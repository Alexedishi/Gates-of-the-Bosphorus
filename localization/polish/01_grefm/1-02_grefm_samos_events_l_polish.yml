l_polish:
 grefm_samos.001.t: "Samos Defiant"
 grefm_samos.001.d: "Despite taking up arms during the Greek War of Independence, the [ROOT.GetCountry.GetName] remains separated from the #greece Greek State#!. Following the imposition of Turkish rule, thousands have fled the island to seek their fortunes in Greece. Bereft of its freedom, the small island is ruled by the unpopular [ROOT.GetCountry.GetRuler.GetFullName] who regularly abuses his authority while the island's inhabitants dream of union with the free $grefm_greek$ community."
 grefm_samos.001.f: "While nominally subject to the #bold Sublime Porte#!, the island has been granted a large amount of autonomy, effectively functioning as it's own state. This compromise, the Sultan hopes, will avoid the emergence of a foreign threat so close to the Anatolian coast."
 grefm_samos.001.a: "[ROOT.GetCountry.GetName] will find its way."
 grefm_samos.002.t: "An Imposed Ruler"
 grefm_samos.002.d: "Hardly two full years have passed since [ROOT.GetCountry.GetRuler.GetFullName] was appointed to rule [ROOT.GetCountry.GetName] and the people have grown weary of his rule. Loyal to the #bold Sublime Porte#! above the needs of the islanders, the Prince has focused his rule on taxation and autocracy, seeking to establish himself as the perpetual ruler of the island.\n\nTo this end, he has favored the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] and a means to consolidate his power base at the expense of the [GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetName] who, enlightened by the tides of liberalism from Europe, demand constitutional rights for the people."
 grefm_samos.002.f: "Despite his pretense of "ruling" Samos, the Prince has yet to step foot on the island. Yet, he has ensured that his delegates and commanders on the island are loyal to him alone."
 grefm_samos.002.a: "The [ROOT.GetCountry.GetAdjective] people deserve better."
 grefm_samos.003.t: "The Organic Charter"
 grefm_samos.003.d: "Against the will of the Prince, the legislature of the island has forced through a legal framework severely curtailing the rights of both the Prince and the #bold Porte#! over the people of Samos."
 grefm_samos.003.f: "The Organic Charter"
 grefm_samos.003.a: "It is the will of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people!"
 grefm_samos.004.t: "The Tyranny of Lord Stefanos"
 grefm_samos.004.d: "Against the will of the people, [ROOT.GetCountry.GetRuler.GetFullName] has imposed autocratic rule over Samos. Now taking up residence on the island, he was styled himself the "Hegemon of Samos.""
 grefm_samos.004.f: "The actions of [ROOT.GetCountry.GetRuler.GetFirstName] serve as a despicable betrayal of the promises made by the #bold Porte#!. At this rate, all we can do it hope for aid from our Greek brothers abroad."
 grefm_samos.004.a: "What do the people know of governance anyhow?"
 grefm_samos.005.t: "A Tyrant Deposed."
 grefm_samos.005.d: "Discontent with the Prince has reached a fever pitch on Samos. In a massive and violent display of outrage, crowds in [ROOT.GetCountry.GetCapital.GetCityHubName] stormed the Prince's residence and seized both him and his delegates. After shipping them back to the mainland, popular leaders sent a demand to to the #bold Porte#! demanding competent leadership. In response, [SCOPE.sCharacter('samos_next_ruler_scope').GetName] has been dispatched to the island."
 grefm_samos.005.f: "Not content to chafe under continued oppression, the people of Samos have ejected this tyrant from the island."
 grefm_samos.005.a: "Let this next servant of the Sultan test our mettle."
 grefm_samos.006.t: "New Governor Appointed"
 grefm_samos.006.d: "In the endlessly shifting politics of the Ottoman court, [ROOT.GetCountry.GetRuler.GetFullName] has been recalled by the #bold Porte#!. With his departure, a dragoman has arrived to report that [SCOPE.sCharacter('samos_next_ruler_scope').GetFullName] has been appointed as the new overseer of [ROOT.GetCountry.GetName]."
 grefm_samos.006.f: "Per its treaty rights over Samos, the #bold Porte#! has nominated the next ruler of the islands without any say from the people."
 grefm_samos.006.a: "He is but another servant of the Sultan."
 grefm_samos.007.t: "Lord [ROOT.GetCountry.GetRuler.GetFirstName] deposed."
 grefm_samos.007.d: "Discontent with the Prince has reached a fever pitch on Samos. In a massive and violent display of outrage, crowds in [ROOT.GetCountry.GetCapital.GetCityHubName] stormed the Prince's residence and seized both him and his delegates. After shipping them back to the mainland, popular leaders sent a demand to to the #bold Porte#! demanding competent leadership. In response, [SCOPE.sCharacter('samos_next_ruler_scope').GetName] has been dispatched to the island."
 grefm_samos.007.f: "Not content to chafe under continued oppression, the people of Samos have ejected yet another tyrant from the island."
 grefm_samos.007.a: "Let this next servant of the Sultan test our mettle."
 grefm_samos.008.t: "Samos Liberated"
 grefm_samos.008.d: "The long and cruel subjugation of [ROOT.GetCountry.GetName] has finally come to an end. With its Independence, the island is now free to seek reunion with the Greek family."
 grefm_samos.008.f: "First, freedom. Next, #italic enosis#!!"
 grefm_samos.008.a: "The [ROOT.GetCountry.GetAdjective] people are finally free!"
 grefm_samos.009.t: "Samian Union with the Greek State"
 grefm_samos.009.d: "Decades of agitation and demands have culminated in the unification of the [SCOPE.sState('samos_scope').GetName] with [ROOT.GetCountry.GetName]. In a simple, but polite, ceremony in [SCOPE.sState('samos_scope').GetCapital.GetCityHubName], the [SCOPE.sCountry('samos_scope').GetAdjective] flag has been lowered and replaced with that of the Greek state."
 grefm_samos.009.f: ""Well, do you want us or not?" -T. Sophoulis, to the Greek government, 1912"
 grefm_samos.009.a: "This is a great day for [ROOT.GetCountry.GetName]!"