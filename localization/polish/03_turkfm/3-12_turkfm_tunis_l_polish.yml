 modifier_turkfm_tribal_administration: "Tribal Administration"
 modifier_turkfm_western_inspirations: "Western Inspirations"
 modifier_turkfm_failed_reforms: "Failed Reforms"
 modifier_turkfm_modernized_state: "Modernized State"

 # Notifications
 notification_notification_turkfm_senussi_ghosted_name: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName] Vanishes!"
 notification_notification_turkfm_senussi_ghosted_desc: "Security services have reported that [GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetFullName] has vanished without a trace."
 notification_notification_turkfm_senussi_entrenched_name: " Becomes Entrenched"
 notification_notification_turkfm_senussi_entrenched_desc: "The Dominance of the $turkfm_senusiyya_movement$ has allowed [GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetFullName] to entrench himself in the Court at [ROOT.GetCountry.GetCapital.GetCityHubName]."
 notification_notification_turkfm_senussi_urbanized_up_name: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName] Advances into the Cities"
 notification_notification_turkfm_senussi_urbanized_up_desc: "The Dominance of the $turkfm_senusiyya_movement$ has allowed [GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetFullName]'s followers to advance into urban areas."
 notification_notification_turkfm_senussi_urbanized_down_name: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName] Regroups in the Cities"
 notification_notification_turkfm_senussi_urbanized_down_desc: "Recent setbacks in the influence of the $turkfm_senusiyya_movement$ has forced [GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetFullName]'s followers to withdraw into urban centers."
 notification_notification_turkfm_senussi_villages_up_name: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName] Advances into Desert Villages"
 notification_notification_turkfm_senussi_villages_up_desc: "The Dominance of the $turkfm_senusiyya_movement$ has allowed [GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetFullName]'s followers to advance into desert villages."
 notification_notification_turkfm_senussi_villages_down_name: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName] Withdraws to Desert Villages"
 notification_notification_turkfm_senussi_villages_down_desc: "Recent setbacks in the influence of the $turkfm_senusiyya_movement$ has forced [GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetFullName]'s followers to withdraw into desert villages."
 notification_notification_turkfm_senussi_desert_up_name: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName] Arrives in the Desert"
 notification_notification_turkfm_senussi_desert_up_desc: "The Dominance of the $turkfm_senusiyya_movement$ has allowed [GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetFullName]'s followers to advance into the depths of the desert wastelands."
 notification_notification_turkfm_senussi_desert_down_name: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName] Withdraws into the Desert"
 notification_notification_turkfm_senussi_desert_down_desc: "Recent setbacks in the influence of the $turkfm_senusiyya_movement$ has forced [GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetFullName]'s followers to withdraw into the depths of the desert wastelands."
 notification_notification_turkfm_senussi_arrival_name: "The $turkfm_senusiyya_movement$ Returns to [ROOT.GetCountry.GetName]"
 notification_notification_turkfm_senussi_arrival_desc: "Despite being driven out, the followers of $turkfm_senusiyya$ have once again managed to establish a foothold in [ROOT.GetCountry.GetName]"

 # Scripted Buttons
 turkfm_visit_france_button: "Schedule Trip to France"
 turkfm_visit_france_button_desc: "The ascendancy of the $FRA_ADJ$ Empire in the Maghreb has raised eyebrows in the [ROOT.GetCountry.GetAdjectiveNoFormatting] court. Following a visit by the Emperor to [ROOT.GetCountry.GetCapital.GetCityHubName], the $FRA_ADJ$ court has extended an offer for a reciprocal visit by the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."

