l_polish:
# Journal Entries
 je_turkfm_tri_centralization: "Entrenching the State"
 je_turkfm_tri_centralization_reason: "For millennia, the coasts of [ROOT.GetCountry.GetName] have served as little more than outposts for imperialist authority. As a new age dawns on the world, there is a renewed push to create a truly [ROOT.GetCountry.GetAdjectiveNoFormatting] state apparatus from which the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] may project true sovereignty."
 je_turkfm_tri_centralization_complete: "[ROOT.GetCountry.GetNameNoFlag] has #bold 10 or greater#! [concept_institution] [concept_investment_level]#o s#! (Currently #v [JournalEntry.MakeScope.Var('turkfm_institution_investment_var').GetValue]#!)"

 je_turkfm_senusiyya_main: "The Teachings of al-Sanusi"
 je_turkfm_senusiyya_main_reason: "$je_turkfm_senusiyya_flavor$\n$TOOLTIP_DELIMITER$\n$je_turkfm_senusiyya_details$\n$TOOLTIP_DELIMITER$\n$je_turkfm_senusiyya_modifier$"
 je_turkfm_senusiyya_sub: "$je_turkfm_senusiyya_main$"
 je_turkfm_senusiyya_sub_reason: "$je_turkfm_senusiyya_flavor$\n$TOOLTIP_DELIMITER$\n#$je_turkfm_senusiyya_details$\n$TOOLTIP_DELIMITER$\n$je_turkfm_senusiyya_modifier$"

 je_turkfm_senusiyya_flavor: "Like much of the Arab world, spiritual life in [ROOT.GetCountry.GetName] is guided by the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName]. However, in the expanses of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName], spiritual life often centers around the [GetCharacterTrait('gbbf_trait_marabout').GetName]. Under increasing pressure from the $turkfm_porte$, the $turkfm_senusiyya_movement$ has gained traction amongst the [ROOT.GetCountry.GetAdjectiveNoFlag] people."
 je_turkfm_senusiyya_details: "#white Led by [GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetFullName], the $turkfm_senusiyya_movement$ has [GetPlayer.MakeScope.Var('turkfm_senussi_var').GetValue] strength. This is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],turkfm_senussi_progress_tt [GetPlayer.MakeScope.Var('turkfm_senussi_progress_var').GetValue]#! next month."
 je_turkfm_senusiyya_modifier: "At maximum support, the $turkfm_senusiyya_movement$ will provide the following effects:\n[GetStaticModifier('modifier_turkfm_senusiyya_movement').GetDesc]"
 je_turkfm_senusiyya_complete: "[ROOT.GetCountry.GetNameNoFlag] has either #bold Embraced#! or #bold Swept Away#! the $turkfm_senusiyya_movement$"
 je_turkfm_senusiyya_on_complete_1: "If [ROOT.GetCountry.GetNameNoFlag] has #bold Embraced#! the $turkfm_senusiyya_movement$, triggers the event #bold #white House Senussi of [ROOT.GetCountry.GetNameNoFormatting]#!#!"
 je_turkfm_senusiyya_on_complete_2: "If [ROOT.GetCountry.GetNameNoFlag] has #bold Swept Away#! the $turkfm_senusiyya_movement$, triggers the event #bold #white The Senusiyya Movement Extinguished#!#!"

 # Journal Entry Lobby Text
 je_turkfm_tri_centralization_lobby: "$gbbf_journal_lobby$\nFor millennia, the coasts of Tripolitania have served as little more than outposts for imperialist authority. As a new age dawns on the world, there is a renewed push to create a proper state apparatus from which the Sultan may project true sovereignty."
 je_turkfm_senusiyya_main_lobby: "$gbbf_journal_lobby$\nLike much of the Arab world, spiritual life in Libya is guided by the Ulema. However, in the expanses of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName], spiritual life often centers around the [GetCharacterTrait('gbbf_trait_marabout').GetName]. Under increasing pressure from the $turkfm_porte$, the $turkfm_senusiyya_movement$ has gained traction amongst the [GetCulture('bedouin').GetName] people."

 # Modifiers
 modifier_turkfm_informal_administration: "Informal Administration"
 modifier_turkfm_centralized_authority: "Centralized Authority"
 modifier_turkfm_senusiyya_movement: "$turkfm_senusiyya_movement$"
 modifier_turkfm_senussi_stronghold: "$turkfm_senusiyya$ Stronghold"
 modifier_turkfm_senussi_nationalism: "Senussi Nationalism"
 modifier_turkfm_desert_raids: "Desert Patrols"
 modifier_turkfm_senusiyya_extinguished: "$turkfm_senusiyya$ Extinguished"
 modifier_turkfm_senusiyya_embraced: "$turkfm_senusiyya$ Embraced"

 # Scripted Buttons
 turkfm_embrace_senussi_button: "Embrace $turkfm_senusiyya$"
 turkfm_embrace_senussi_button_desc: "The $turkfm_senusiyya_movement$ permeates every aspect of [ROOT.GetCountry.GetAdjectiveNoFlag] society. The time has come to throw off the tradition of Turkish rule and embrace a new future for [ROOT.GetCountry.GetNameNoFormatting]."
 turkfm_embrace_senussi_possible: "Support for $turkfm_senusiyya$ is at #bold Maximum#!"
 turkfm_embrace_senussi_button_effect: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName] will become the [concept_ruler] of [ROOT.GetCountry.GetNameNoFlag]"
 turkfm_sweep_desert_button: "Sweep the Desert"
 turkfm_sweep_desert_button_desc: "The $turkfm_senusiyya_movement$ has been driven out of our cities and deep into the desert. All that remains is to round up their last supporters and shutter their last lodges to extinguish these radicals."
 turkfm_sweep_desert_possible: "There is #bold zero#! support for the $turkfm_senusiyya_movement$"
 turkfm_sweep_desert_button_effect: "The $turkfm_senusiyya_movement$ will be expelled from [ROOT.GetCountry.GetNameNoFlag] never to return"
 turkfm_supress_senusiyya_button: "Suppress Senussi's Followers"
 turkfm_supress_senusiyya_button_desc: "The tenets of the $turkfm_senusiyya_movement$ threaten the foundation of Turkish governance in [ROOT.GetCountry.GetName]. Suppression of Senussi's message via censorship and intimidation is our only choice."
 turkfm_supress_senusiyya_possible_1: "[ROOT.GetCountry.GetNameNoFlag] has #bold Sent an Armed Delegation to Senussi#!"
 turkfm_supress_senusiyya_possible_2: "[ROOT.GetCountry.GetNameNoFlag] has not changed its stance towards [GetStaticModifier('modifier_turkfm_desert_raids').GetName] within the last #bold 2 years#!"
 turkfm_supress_senusiyya_effect: "[ROOT.GetCountry.GetNameNoFlag] will be unable to change its stance towards [GetStaticModifier('modifier_turkfm_desert_raids').GetName] for #bold 2 years#!"
 turkfm_armed_delegation_button: "Send Armed Delegation"
 turkfm_armed_delegation_button_desc: "Despite being pushed out from the cities, Senussi continues to send his missionaries into our urban areas. We should send him a message to stay in his lane."

 # Scripted Progress Bar
 turkfm_senussi_progressbar: "$turkfm_senusiyya$ Influence:#!\n$TOOLTIP_DELIMITER$\n#bold #italic Factors in Support of Al-Senussi:#!#!\n[GetPlayer.MakeScope.GetScriptValueDesc('turkfm_senussi_support_value')]\n$TOOLTIP_DELIMITER$\n#bold #italic Factors in Opposition to Al-Senussi:\n#!#![GetPlayer.MakeScope.GetScriptValueDesc('turkfm_senussi_opposition_value')]\n$TOOLTIP_DELIMITER$\n#italic #white #bold [GetPlayer.MakeScope.Var('turkfm_senussi_progress_var').GetValue] expected monthly"
 turkfm_senussi_progressbar_desc: "$turkfm_senusiyya$ Influence"

 # Script Value Breakdowns
 turkfm_value_from_senussi_support: "From factors #bold supporting#! the $turkfm_senusiyya_movement$"
 turkfm_value_from_senussi_opposition: "From factors #bold opposing#! the $turkfm_senusiyya_movement$"

 turkfm_value_from_senussi_popularity: "From the [concept_popularity] of #bold as-Senussi#!"
 turkfm_value_from_strongholds: "From the number of [ROOT.GetCountry.GetAdjectiveNoFlag] [concept_state]#o s#! hosting a [GetStaticModifier('modifier_turkfm_senussi_stronghold').GetName]"
 turkfm_value_from_bedouin_radicals:  "From [GetCulture('bedouin').GetName] [concept_radical] [concept_pop]#o s#! in [ROOT.GetCountry.GetNameNoFlag]"
 turkfm_value_from_devout_clout: "From the [concept_clout] of the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName]"

 turkfm_value_from_decentralized_provinces: "From the number of [concept_decentralized_nation] [concept_province]#o s#! in $turkfm_marabout_influenced$ [concept_state_region]#o s#! [ROOT.GetCountry.GetNameNoFlag] has a [concept_state] in"
 turkfm_value_from_centralized_provinces: "From the number of [concept_decentralized_nation] [concept_province]#o s#! in $turkfm_marabout_influenced$ [concept_state_region]#o s#! owned by [ROOT.GetCountry.GetNameNoFlag]"

 turkfm_value_from_libya_centralized: "From the number of [concept_province]#o s#! owned by [ROOT.GetCountry.GetNameNoFlag] in the [GetStateRegion('STATE_LIBYA').GetName] [concept_state_region]"
 turkfm_value_from_libyan_desert_centralized: "From the number of [concept_province]#o s#! owned by [ROOT.GetCountry.GetNameNoFlag] in the [GetStateRegion('STATE_LIBYAN_DESERT').GetName] [concept_state_region]"
 turkfm_value_from_tripoli_centralized: "From the number of [concept_province]#o s#! owned by [ROOT.GetCountry.GetNameNoFlag] in the [GetStateRegion('STATE_TRIPOLI').GetName] [concept_state_region]"
 turkfm_value_from_matruh_centralized: "From the number of [concept_province]#o s#! owned by [ROOT.GetCountry.GetNameNoFlag] in the [GetStateRegion('STATE_MATRUH').GetName] [concept_state_region]"
 turkfm_value_from_egyptian_desert_centralized: "From the number of [concept_province]#o s#! owned by [ROOT.GetCountry.GetNameNoFlag] in the [GetStateRegion('STATE_EGYPTIAN_DESERT').GetName] [concept_state_region]"
 turkfm_value_from_tunisia_centralized: "From the number of [concept_province]#o s#! owned by [ROOT.GetCountry.GetNameNoFlag] in the [GetStateRegion('STATE_TUNISIA').GetName] [concept_state_region]"

 turkfm_value_from_libya_decentralized: "From the number of [GetCulture('bedouin').GetName] [concept_decentralized_nation] [concept_province]#o s#! in the [GetStateRegion('STATE_LIBYA').GetName] [concept_state_region]"
 turkfm_value_from_libyan_desert_decentralized: "From the number of [GetCulture('bedouin').GetName] [concept_decentralized_nation] [concept_province]#o s#! in the [GetStateRegion('STATE_LIBYAN_DESERT').GetName] [concept_state_region]"
 turkfm_value_from_tripoli_decentralized: "From the number of [GetCulture('bedouin').GetName] [concept_decentralized_nation] [concept_province]#o s#! in the [GetStateRegion('STATE_TRIPOLI').GetName] [concept_state_region]"
 turkfm_value_from_matruh_decentralized: "From the number of [GetCulture('bedouin').GetName] [concept_decentralized_nation] [concept_province]#o s#! in the [GetStateRegion('STATE_MATRUH').GetName] [concept_state_region]"
 turkfm_value_from_egyptian_desert_decentralized: "From the number of [concept_decentralized_nation] [GetCulture('bedouin').GetName] [concept_province]#o s#! in the [GetStateRegion('STATE_EGYPTIAN_DESERT').GetName] [concept_state_region]"
 turkfm_value_from_tunisia_decentralized: "From the number of [GetCulture('bedouin').GetName] [concept_decentralized_nation] [concept_province]#o s#! in the [GetStateRegion('STATE_TUNISIA').GetName] [concept_state_region]"

 # Tooltips
 turkfm_senusiyya: "#o #tooltip:[GetRawTextTooltipTag('turkfm_senusiyya_concept')] @gbbf_senusiyya! Senusiyya#!#!"
 turkfm_senusiyya_movement: "#o #tooltip:[GetRawTextTooltipTag('turkfm_senusiyya_concept')] @gbbf_senusiyya! Senusiyya Movement#!#!"
 turkfm_senusiyya_concept: "The #bold Senusiyya Movement#!, founded by Muhammad ibn Ali al-Sanusi, seeks to purify Islam and explicitly rejects fanaticism while encouraging jurisprudence on both the part of the people and the state."
 turkfm_senussi_gain_10: "The $turkfm_senusiyya_movement$ will gain #bold 10#! support."
 turkfm_senussi_gain_20: "The $turkfm_senusiyya_movement$ will gain #bold 20#! support."
 turkfm_senussi_lose_10: "The $turkfm_senusiyya_movement$ will lose #bold 10#! support."
 turkfm_senussi_lose_20: "The $turkfm_senusiyya_movement$ will lose #bold 20#! support."
 turkfm_senussi_progress_tt: "[Country.MakeScope.GetScriptValueDesc('turkfm_senussi_progress_value')]"

 turkfm_senussi_location_status: "[GetPlayer.MakeScope.Var('turkfm_senussi_location_var').GetFlagName]"
 turkfm_senussi_ghosted: "Al-Senussi's location is unknown"
 turkfm_senussi_desert: "Al-Senussi is Hiding in the Desert"
 turkfm_senussi_villages: "Al-Senussi is Operating in Desert Villages"
 turkfm_senussi_urban: "Al-Senussi is Operating in Urban Areas"
 turkfm_senussi_court: "Al-Senussi is Entrenched in Court"

 turkfm_marabout_influenced: "#o #tooltip:[GetRawTextTooltipTag('turkfm_senusiyya_region')] @gbbf_senusiyya! [GetCharacterTrait('gbbf_trait_marabout').GetName]-influenced#!#!"
 turkfm_marabout_region: "The following [concept_state_region]#o s#! participate in the [GetCharacterTrait('gbbf_trait_marabout').GetName] tradition:\n•[GetStateRegion('STATE_LIBYA').GetName]\n•[GetStateRegion('STATE_LIBYAN_DESERT').GetName]\n•[GetStateRegion('STATE_TRIPOLI').GetName]\n•[GetStateRegion('STATE_MATRUH').GetName]\n•[GetStateRegion('STATE_EGYPTIAN_DESERT').GetName]\n•[GetStateRegion('STATE_TUNISIA').GetName]"

