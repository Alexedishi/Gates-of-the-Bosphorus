l_polish:
 # Character Ideologies
 ideology_gbbf_bavarocrat: "Bavarocrat"
 ideology_gbbf_bavarocrat_desc: "#lore Empowered by their favor with the Wittelsbach court, this character seeks to retain their influence over the state through absolutist Monarchism.#!"
 ideology_gbbf_constitutionalist: "Constitutionalist"
 ideology_gbbf_constitutionalist_desc: "#lore Inspired by Western thought, this character aims to bring Constitutional rule to the nation.#!"
 ideology_gbbf_dacianist: "Dacianist"
 ideology_gbbf_dacianist_desc: "#lore Influenced by the Dacian movement, this character firmly believes in the pioneering narrative of Romanian history and seeks to bring the Romanian people forward into the industrial age.#!"

 ideology_gbbf_islamist_leader: "Islamist"
 ideology_gbbf_islamist_leader_desc: "#lore This character believes that the promotion of Islamic jurisprudence and tradition are the means to hold the Ottoman Empire together.#!"
 ideology_gbbf_junimist: "Junimist"
 ideology_gbbf_junimist_desc: "#lore Influenced by the Junimea literary group, this character seeks to restrain Romanian society's reckless charge towards liberalism for the sake of liberalism.#!"
 ideology_gbbf_kogalnitchanism: "Kogalnitchanist"
 ideology_gbbf_kogalnitchanism_desc: "#lore Inspired by the writings of Mihail Kogălniceanu, this character believes the destruction of feudalism is the only way forward for the Principalities.#!"
 ideology_gbbf_ottomanist: "Ottomanist"
 ideology_gbbf_ottomanist_desc: "#lore This character believes that state reform and an Ottoman national identity are the means to hold the Ottoman Empire together#!."
 ideology_gbbf_symphonist_leader: "Symphonist"
 ideology_gbbf_symphonist_leader_desc: "#lore This character believes that the unique roles of the church and state are meant to complement, but not dominate each other.#!"
 ideology_gbbf_venizelos: "Venizelist"
 ideology_gbbf_venizelos_desc: "#lore Driven by the Cretan struggle, this character strives to reform Greek society for an industrial future and to bring the dream of the $grefm_megali_idea$ into reality.#!"
 ideology_gbbf_venizelist: "Venizelist"
 ideology_gbbf_venizelist_desc: "#lore Inspired by the Ethnarch, this character strives to reform Greek society for an industrial future and to bring the dream of the $grefm_megali_idea$ into reality.#!"
 ideology_gbbf_venizelist_leader: "Venizelist"
 ideology_gbbf_venizelist_leader_desc: "#lore Inspired by the Ethnarch, this character strives to reform Greek society for an industrial future and to bring the dream of the $grefm_megali_idea$ into reality.#!"
 
