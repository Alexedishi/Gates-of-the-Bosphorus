 amendment_gbbf_elifba: "Elifbâ"
 amendment_gbbf_elifba_desc: "A specialized version of the Arabic script has been in use for Turkish documents and communications for nearly six centuries. It is difficult to learn, but lends gravitas to the publications of the Porte."
 
 law_imperial_divan: "Imperial Divan"
 law_imperial_divan_desc: "The Head of State's power is absolute and they are held accountable to no earthly power."
 law_ministerial_council: "Ministerial Council"
 law_ministerial_council_desc: "The Head of State shares power and responsibility with a small group of powerful, unelected individuals."
 law_scribal_bureaucrats: "Scribal Bureaucrats"
 law_scribal_bureaucrats_desc: "The Scribal class controls the administration of the state. Rampant nepotism and corruption has resulted in a bloated and byzantine apparatus incapable of effective action."