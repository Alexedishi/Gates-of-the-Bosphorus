l_german:
 grefm_greece.001.t: "The Regency Council"
 grefm_greece.001.d: "In the aftermath of gaining independence, [ROOT.GetCountry.GetName] fell into political instability, culminating in the assassination of Governor #yellow Ioannis Kapodistrias#!. To stave off a collapse into civil war, the [Concept('concept_great_power','$concept_great_powers$')] installed a Bavarian Catholic King to govern over the reconstituted [ROOT.GetCountry.GetAdjectiveNoFormatting] state.\n\nThe young King [ROOT.GetCountry.GetRuler.GetFullName] has recently come of age, but finds his ascent to the throne marred by the political intrigues of his "Arch-Chancellor" [GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetFullName] who has amassed personal control over the Greek political system."
 grefm_greece.001.f: ""O King of Greece! Old Greece bequeathed the lights of learning to Germany, through you Germany has undertaken to repay the gift with interest, and will be grateful to you, seeing in you the one to resurrect the firstborn people of the Earth." -P. Soutsos, 1837"
 grefm_greece.001.a: "[ROOT.GetCountry.GetName] must find its way."
 grefm_greece.002.t: "A Crisis Averted"
 grefm_greece.002.d: "In the face of popular distrust and despite the machinations of the [SCOPE.gsInterestGroup('ig_landowners_scope').GetName], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has implemented limitations on royal authority giving liberties to the citizens of [ROOT.GetCountry.GetName]. However, many continue to call for further reductions in the power and status of the nobility and the elevation of Greece into a beacon of hope for Greek peoples abroad."
 grefm_greece.002.f: "We did not fight to overthrow our Turkish oppressors just to replace them with German ones."
 grefm_greece.002.a: "Hail to the benevolent [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], [SCOPE.sCharacter('king_otto_scope').GetFullName]!"
 grefm_greece.003.t: "The September Revolution"
 grefm_greece.003.d: "When [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('king_otto_scope').GetFirstName] was crowned, many hoped he would bring prosperity to [ROOT.GetCountry.GetName]. Instead, he has stonewalled reforms, against the will of the Greek people. Infuriated with this state of affairs, [SCOPE.sCharacter('ig_armed_forces_scope').GetFullName] has rallied the military and demanded the installation of a formal constitution for [ROOT.GetCountry.GetName]."
 grefm_greece.003.f: ""After a little while, the door of the balcony of the palace opened, the king appeared and addressed himself to Kallergis: 'General Kallergis.'But the latter replied, 'Not general, merely citizen.' After these words there followed the following shout by the army and assembled multitude, 'Long live the constitution. Long live Kallergis.' 'Your Majesty,' shouted Kallergis, 'the people want a constitution.' Then the king withdrew." - C. Neeser, in his memoirs"
 grefm_greece.003.a: "We must yield to the will of the people."
 grefm_greece.003.b: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('king_otto_scope').GetFullName] will not be bullied by rabble."
 grefm_greece.003.c: "Eject this interloper from [ROOT.GetCountry.GetName]!"
 grefm_greece.004.t: "Long live the Constitution!"
 grefm_greece.004.d: "Against popular demands and in defiance of his obligations to [ROOT.GetCountry.GetName]'s protectors, [SCOPE.sCharacter('king_otto_scope').GetFullName] has dismissed [GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetFullName] and established absolute personal rule over the Greek state."
 grefm_greece.004.f: ""In my position, without State Chancellor, without Prime Minister, I feel a new incentive to devote myself with greater activity to my calling, for the success of the good cause now depends on me more than formerly." -Otto of Greece, to his father Ludwig of Bavaria, 1838"
 grefm_greece.004.a: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] will have sovereignty."
 grefm_greece.005.t: "The Bavarocracy Abolished"
 grefm_greece.005.d: "In the face of the Great Powers that supported Greek independence, the Greek people have abolished the monarchy."
 grefm_greece.005.f: ""King of the Hellenes! You have been a victim of men who, in order to undo the work of the Revolution and to restore the old regime of corruption, have not hesitated to traffic the people's reverence for the Crown and their devotion to your person. You have been the victim finally of your own quite human and not unnatural weakness. Accustomed to admire everything German, bewildered by the unrivalled German organization of military and other affairs of every sort, you not only expected a German victory, but you came to desire it, hoping that it would enable you to concentrate in your own hands all the authority of the government, and substantially to set aside our free Constitution.""
 grefm_greece.005.a: "It is the will of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people!"
 grefm_greece.006.t: "The October Revolution"
 grefm_greece.006.d: "Despite his efforts to hold the throne, the German-born [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('king_otto_scope').GetFullName] has proven intolerable to both the people and aristocracy of [ROOT.GetCountry.GetName]. In a sudden action, the military, led by [SCOPE.sCharacter('ig_armed_forces_scope').GetFullName], has seized the capital and deposed the King. The deposed [SCOPE.sCharacter('king_otto_scope').GetFirstName] has fled into exile to [SCOPE.sState('bavaria_state_scope').GetNameNoFormatting] with the help of [SCOPE.sCountry('uk_scope').GetAdjectiveNoFormatting] naval forces. [SCOPE.sCharacter('voulgaris_scope').GetFullName] has formed a caretaker government with elections for a replacement monarch to be held later this year."
 grefm_greece.006.f: ""Greece, my Greece, my beloved Greece." -former King Otto, on his deathbed"
 grefm_greece.006.a: "[ROOT.GetCountry.GetName] will find its way."
 grefm_greece.006.b: "[ROOT.GetCountry.GetName] will find its way."
 grefm_greece.007.t: "Mandate Secured"
 grefm_greece.007.d: "With firm and decisive leadership, [SCOPE.sCharacter('king_otto_scope').GetFirstName] has established the legitimacy of his rule."
 grefm_greece.007.f: ""Today the fatherland is reborn, that for so long was lost and extinguished. Today are raised from the dead the fighters, political, religious, as well as military, for our King has come, that we begot with the power of God. Praised be your most virtuous name, omnipotent and most merciful Lord.""
 grefm_greece.007.a: "All Hail [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('king_otto_scope').GetFullName]!"
 grefm_greece.008.t: "The Overthrow of the Bavarocracy"
 grefm_greece.008.d: "In the face of the Great Powers that supported Greek independence and of the German pretenders that sought dominion over [ROOT.GetCountry.GetName], the Greek people have abolished the monarchy."
 grefm_greece.008.f: ""King of the Hellenes! You have been a victim of men who, in order to undo the work of the Revolution and to restore the old regime of corruption, have not hesitated to traffic the people's reverence for the Crown and their devotion to your person. You have been the victim finally of your own quite human and not unnatural weakness. Accustomed to admire everything German, bewildered by the unrivalled German organization of military and other affairs of every sort, you not only expected a German victory, but you came to desire it, hoping that it would enable you to concentrate in your own hands all the authority of the government, and substantially to set aside our free Constitution.""
 grefm_greece.008.a: "It is the will of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people!"
 grefm_greece.008.b: "It is the will of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people!"
 grefm_greece.009.t: "A Disgraced Tyrant"
 grefm_greece.009.d: "The royal court and political structure supporting the King has collapsed. Riding to the Royal Palace, [SCOPE.sCharacter('armed_forces_leader_scope').GetFullName] has seized [ROOT.GetCountry.GetRuler.GetFirstName] and secured passage of a constitution. While the King expected to hold out against the coup, his Council had already drawn up the document well before the uprising was declared."
 grefm_greece.009.f: ""I have given up all my privileges; I am no longer king; now that my ministers, the national assembly and a constitution have been imposed upon me and now that my army has stopped obeying me. In Greece, constitution means nothing more nor less than pillage." -Otto of Greece, 1843"
 grefm_greece.009.a: "Long Live the Constitution!"

 grefm_greece.010.t: "Constitutional Promises"
 grefm_greece.010.d: "When the Regency Council took custody of [ROOT.GetCountry.GetName], it was with the promise that a formal constitution would be established. Presently, [ROOT.GetCountry.GetRuler.GetFirstName] rules with no structure in place to seek redress against abuses of power, and he has shown little interest in accepting reform."
 grefm_greece.010.f: ""...but as it is today, 1835, the Greek state with a limited area, with population thinning, poverty, homelessness and foreign regency, how can it to hope for its rapid development and for future prosperity and progress? The leader and administrator of our public affairs, a foreigner, however good and loyal he may be, will seek his individual advantage above all else and will strive with all his might to establish an independent and proud existence in his country from our sweat and intolerance, because according to natural reason, he can have no other sympathy in favor of his (foreign) land, but that of individual interest." -L. Kountouriotis , 1835"
 grefm_greece.010.a: "Something must be done."
 grefm_greece.010.tt1: "If [ROOT.GetCountry.GetName] enacts #yellow Wealth Voting#!, #yellow Census Suffrage#!, or #yellow Universal Suffrage#!:\nThe event #bold A Crisis Averted#! will occur."
 grefm_greece.010.tt2: "If [ROOT.GetCountry.GetName] enacts #yellow Autocracy#!:\nThe event #bold Long Live the Constitution!#! will occur."
 grefm_greece.010.tt3: "If #yellow Political Instability#! reaches #bold 100#!:\nThe event #bold The September Revolution#! will occur."
 grefm_greece.011.t: "King [SCOPE.sCharacter('ludwig_scope').GetFirstName] Visits Greece"
 grefm_greece.011.d: "In support of the ascent of his son, King [SCOPE.sCharacter('ludwig_scope').GetFullName] has arrived in [ROOT.GetCountry.GetName] with the aim to provide both counsel and legitimacy to the young monarch."
 grefm_greece.011.f: "The arrival of a foreign monarch has caused a buzz of activity and intrigue in [ROOT.GetCountry.GetCapital.GetCityHubName] with popular reactions ranging from curiosity to trepidation."
 grefm_greece.011.a: "Interesting."
 grefm_greece.012.t: "[ROOT.GetCountry.GetRuler.GetFirstName] Departs for [SCOPE.sState('bavaria_state_scope').GetName]"
 grefm_greece.012.d: "King [ROOT.GetCountry.GetRuler.GetFirstName] lacks much as a young monarch, but chief among them is both a queen and an heir. The young King has accompanied his father, King [SCOPE.sCharacter('ludwig_scope').GetFirstName] back to [SCOPE.sState('bavaria_state_scope').GetName] with the aim of finding an acceptable consort."
 grefm_greece.012.f: "While the struggle with Lord [GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetFullName] has gone mostly unnoticed by the people, they have taken issue with the lack of an heir to the throne. The King has delegated state functions to his council, but many are concerned that the regent will be quick to expand his power base  once the monarch leaves."
 grefm_greece.012.a: "Long live the King."
 grefm_greece.013.t: "A Consort Fit for a Bavarian"
 grefm_greece.013.d: "[ROOT.GetCountry.GetRuler.GetFirstName]'s return to Bavaria has been filled with pomp and circumstance as his father seeks a suitable match for the young king. A strong match has been found in the young noble, [SCOPE.sCharacter('queen_amalia_scope').GetFirstName] of [SCOPE.sCountry('oldenburg_scope').GetName], although alternative candidates have been put forward."
 grefm_greece.013.f: ""The Queen was small, beautiful and with a lovely figure. She was lively, almost too lively, spoke of various subjects and complimented Greece in favor of the Nordic countries, and was certain that we would very soon be accustomed to this beautiful nation with its lovely climate." -C. Lüth, regarding Queen Amalia, 1839"
 grefm_greece.013.a: "[SCOPE.sCharacter('queen_amalia_scope').GetFirstName] of [SCOPE.sCountry('oldenburg_scope').GetName] is an exemplary match."
 grefm_greece.013.tt: "This is the historical option."
 grefm_greece.014.t: "[ROOT.GetCountry.GetRuler.GetFirstName]'s Intellect Challenged"
 grefm_greece.014.d: "King [ROOT.GetCountry.GetRuler.GetFirstName] has been made aware of a disturbing plot by Lord [SCOPE.sCharacter('armansperg_scope').GetLastName]. Ever since the King's departure from Greece, the Arch-Chancellor has been secretly sending letters to King [SCOPE.sCharacter('ludwig_scope').GetFirstName] accusing [ROOT.GetCountry.GetRuler.GetFirstName] of being both deranged and feeble-minded."
 grefm_greece.014.f: "In the King's absence, Lord Armansperg has centralized political power about himself and has begun a ploy to have himself installed as a permanant regent over the Greek state."
 grefm_greece.014.a: "This is an outrage!"
 grefm_greece.015.t: "Discharging the Regency"
 grefm_greece.015.d: "King [ROOT.GetCountry.GetRuler.GetFullName] has returned to [ROOT.GetCountry.GetName] to find the Regency Council and National Assembly divided and in disarray at the hands of Lord [SCOPE.sCharacter('armansperg_scope').GetLastName]'s interference. [ROOT.GetCountry.GetRuler.GetFirstName] now faces pressure from abroad to bring order to the Greek state and legitimize Bavarian rule. In light of this, political leaders demand a resolution to this political crisis."
 grefm_greece.015.f: "[ROOT.GetCountry.GetName] is poor, rural, and dependent on the great powers.  The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] was accepted eagerly by the [ROOT.GetCountry.GetAdjectiveNoFormatting] people, but every day that passes without reform and without prosperity steadily undermines his authority and tests the patience of the Great Powers."
 grefm_greece.015.a: "Dismiss this self-serving worm."
 grefm_greece.015.b: "The King should reconcile with him."
 grefm_greece.016.t: "The Philorthodox Conspiracy"
 grefm_greece.016.d: "A disturbing plot has been exposed in [ROOT.GetCountry.GetCapital.GetCityHubName]. Conspirators, backed by Bishop [SCOPE.sCharacter('devout_leader_scope').GetFullName] and aided by the #yellow Philorthodox Society#!, have launched a scheme to hold the King at arms and secure the royal family's conversion to the [GetReligion('orthodox').GetName] faith."
 grefm_greece.016.f: "The $grefm_greek$ people are unquestioningly entwined with [GetReligion('orthodox').GetName] Christianity and this has manifested in a tide of xenophobia. Every day, contingents of priest and peasant alike believe that securing an [GetReligion('orthodox').GetName] ruler may be the best hope for halting the decline of the Church's influence."
 grefm_greece.016.a: "The royal family will join the Church."
 grefm_greece.016.b: "We will compromise with the heir, [SCOPE.sCharacter('eocfm_heir_scope').GetFirstName]."
 grefm_greece.016.c: "This is nonsense!"
 grefm_greece.017.t: "The Royal Bavarian Auxiliary Corps"
 grefm_greece.017.d: "When King Otto arrived in 1832 he was accompanied by a force of 3500 Bavarian soldiers to solidify his rule. In the time since, they have found themselves unable to assimilate to life in Greece, speaking neither the language nor having access to the comforts of home the pervasively rural Greek state. With expenses mounting and their use in putting down rebellions, their presence wears on the Greek populace."
 grefm_greece.017.f: ""The foreign auxiliary troops cost money, without doing much", while the "insistence on European clothing and armament in the army have removed the most usable people from military service and made them into disgruntled men." -Anton von Prokesch-Osten, Austrian Diplomat"
 grefm_greece.017.a: "They serve at the pleasure of the King."
 grefm_greece.018.t: "Bavarian Forces Depart [ROOT.GetCountry.GetName]"
 grefm_greece.018.d: "Bending to the calls of reformers, [SCOPE.sCharacter('king_otto_scope').GetFullName] has dismissed the Royal Bavarian Auxiliaries back to Bavaria."
 grefm_greece.018.f: "While necessary to save the finances of the state, our army will take some time to reorganize itself with a fully-Greek officer corps."
 grefm_greece.018.a: "A Necessary Choice."
 grefm_greece.019.t: "The Return of the "Turk-Eater""
 grefm_greece.019.d: "In a supreme act of clemency, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has pardoned #gold Nikitaras#! from his imprisonment and charged him with aid in the defense of the nation. A famed fighter during the Greek War of Independence, he was known for his aggressive actions towards Turkish soldiers, earning him the nickname "Turkophagos" or "Turk-Eater." Armed with a sword and pardons for previously speaking out against the regency, our rivals would do well to fear him."
 grefm_greece.019.f: ""I have only my sword, and that I gladly give for my country." -N. Stamatelopoulos, 1826"
 grefm_greece.019.a: "He will serve [ROOT.GetCountry.GetName] well."

 grefm_greece.020.t: "Bavarianism in Greece"
 grefm_greece.020.d: "The trials and tribulations of the early Bavarocrat rule have faded into distant memory, and [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has been hailed as the backbone of the Greek state. As power centralizes ever more around the royal court, the people pray for their future prosperity."
 grefm_greece.020.f: "It was the young lord of House Wittelsbach that brought peace to [ROOT.GetCountry.GetName]. It is only right that they retain the authority to rule."
 grefm_greece.020.a: "[ROOT.GetCountry.GetName] will achieve enlightenment."
 grefm_greece.021.t: "The Search for a King"
 grefm_greece.021.d: "The unexpected rejection of a Western-approved monarch has sent shock-waves across the diplomatic world. [ROOT.GetCountry.GetRuler.GetFullName] has set up a custodian government with the express goal of selecting a suitable candidate for the Greek crown."
 grefm_greece.021.f: "Spurned by the $grefm_greek$ people they idealize, Philhellenes throughout Europe have challenged the legitimacy of the Greek state."
 grefm_greece.021.a: "We must find a suitable candidate."
 grefm_greece.021.tt1: "Electing a [GetCulture('greek').GetName] [concept_ruler] will improve our relations with Western countries."
 grefm_greece.021.tt2: "Electing a [GetCulture('rhomaios').GetName] [concept_ruler] will improve our relations with #bold Russia#!."
 grefm_greece.022.t: "A [GetCulture('greek').GetName] King"
 grefm_greece.022.d: "With the overthrow of the $grefm_bavarocracy$, [ROOT.GetCountry.GetName] has been freed from the meddling of the European monarchies. Following months of searching, the National Assembly has settled on a series of candidates of sufficient noble stock to claim legitimacy to the Greek throne."
 grefm_greece.022.f: "Throughout history, from the Greek Plan in the 1700s to the $grefm_megali_idea$ from the 1800s, scholars have envisioned a reconstituted Greece at the helm of a resurrected Christian Empire in the East. With a native Greek on the throne, this dream comes every closer to becoming reality."
 grefm_greece.022.1: "The Kapodistrias family will retake the throne."
 grefm_greece.022.tt1: "A Noble of House #yellow Kapodistrias#! will take the throne."
 grefm_greece.022.2: "A member of the Mavrocordatos family will serve the state."
 grefm_greece.022.tt2: "A Noble of House #yellow Mavrocordatos#! will take the throne."
 grefm_greece.022.3: "The Metaxas family deserves the role."
 grefm_greece.022.tt3: "A Noble of House #yellow Metaxas#! will take the throne."
 grefm_greece.022.4: "House Ypsilantis is of satisfactory stock."
 grefm_greece.022.tt4: "A Noble of House #yellow Ypsilantis#! will take the throne."
 grefm_greece.023.t: "A [GetCulture('rhomaios').GetName] King"
 grefm_greece.023.d: "With the overthrow of the $grefm_bavarocracy$, [ROOT.GetCountry.GetName] has been freed from the meddling of the European monarchies. Following months of searching, the National Assembly has settled on a series of candidates of sufficient noble stock to claim legitimacy to the Greek throne."
 grefm_greece.023.f: "Throughout history, from the Greek Plan in the 1700s to the $grefm_megali_idea$ from the 1800s, scholars have envisioned a reconstituted Greece at the helm of a resurrected Christian Empire in the East. With a native Greek on the throne, this dream comes every closer to becoming reality."
 grefm_greece.023.1: "House Angelos will lead the Greeks once more."
 grefm_greece.023.tt1: "A Noble of House #yellow Angelos#! will take the throne."
 grefm_greece.023.2: "House Doukas will reprise its noble pedigree."
 grefm_greece.023.tt2: "A Noble of House #yellow Doukas#! will take the throne."
 grefm_greece.023.3: "House Kantakouzenos brings the greatest merit."
 grefm_greece.023.tt3: "A Noble of House #yellow Kantakouzenos#! will take the throne."
 grefm_greece.023.4: "House Palaiologos is the only true heir to the throne."
 grefm_greece.023.tt4: "A Noble of House #yellow Palaiologos#! will take the throne."

 grefm_greece.030.t: "An Elected Monarch"
 grefm_greece.030.d: "With the ousting of the Bavarian Monarchy, the custodian government has called for a plebiscite to determine the best candidate for the throne. However, this has proved problematic with the most popular candidates being unwilling or politically unable to take the crown. It has fallen to the caretaker government to appoint a new ruler."
 grefm_greece.030.f: "The rulers of Greece vastly overestimated the value of the Greek crown to outsiders. Noble after noble passed on ruling the backwards nation. The most popular candidates were disqualified due to connections to the $GBR_ADJ$, $FRA_ADJ$, or $RUS_ADJ$ royal families."
 grefm_greece.030.1: "The young lord, William of Denmark, will take the throne."
 grefm_greece.030.2: "The noble prince, Philippe de Flandre, is a fine choice."
 grefm_greece.030.3: "The benefactor, Eynard the Philhellene, deserves the highest office."
 grefm_greece.030.4: "Enough talk of foreign lords, a $grefm_greek$ will take the throne."
 grefm_greece.030.5: "The renegade, Garbaldi, what's the worst that could happen?"
 grefm_greece.030.6: "We will establish a republic."
 grefm_greece.030.1.tt: "#yellow William of Denmark#! becomes ruler. #italic This is the historical option#!."
 grefm_greece.030.2.tt: "#yellow Philippe de Flandre#! becomes ruler."
 grefm_greece.030.3.tt: "#yellow Eynard the Philhellene#! becomes ruler."
 grefm_greece.030.5.tt: "#yellow G A R I B A L D I#! becomes ruler."
 grefm_greece.031.t1: "The King of the Hellenes"
 grefm_greece.031.t2: "The King of the Romans"
 grefm_greece.031.t3: "The King of the Greeks"
 grefm_greece.031.d1: "It was with great haste that a delegation was assembled by the National Assembly and dispatched to offer the crown to [ROOT.GetCountry.GetRuler.GetFullName]. Now, on his arrival in [SCOPE.sState('grefm_capital_scope').GetCityHubName], the new [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been greeted by cheers of jubilation for the hope of a second chance for [ROOT.GetCountry.GetName]."
 grefm_greece.031.d2: "With Bavarian rule over [ROOT.GetCountry.GetName] secured, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has been invested with the legitimacy of absolute power by the National Assembly."
 grefm_greece.031.d3: "A new day has dawned on the Greek state. Content in King [ROOT.GetCountry.GetRuler.GetFirstName]'s commitment to the defense of the rights and prosperity of [ROOT.GetCountry.GetName], crowds in [ROOT.GetCountry.GetCapital.GetCityHubName] have heralded him as not only the King of Greece, but the the rightful ruler of $grefm_greek$s the world over."
 grefm_greece.031.f: ""People of Greece, rejoice! Your troubles are at an end and our prayers have been heard! The dangers of Hellas are past, the ground has ceased to tremble, the earthquake has subsided before the edifice of the State was shaken to its foundation." - #italic Evnomia, May 24th#!"
 grefm_greece.031.a: "All Hail [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('king_of_the_hellenes_scope').GetFullName]!"
 grefm_greece.032.t: ""Who is to Blame?""
 grefm_greece.032.d: "In keeping with their continual frustration with the monarchy, reformist [SCOPE.sCharacter('intelligentsia_leader_scope').GetFullName] has penned an inflammatory article denouncing the monarch as favoring his friends as prime ministers as opposed to politicians with genuine popular backing. The article has been seized upon by supporters and detractors as both a valid criticism of the Greek state and a grievous affront to the Crown."
 grefm_greece.032.f: ""If the people are not at fault, the politicians are at fault, others say, and the nation is responsible for their corruption, since they belong to the nation. We answer that the conduct of the statesmen would be the responsibility of the nation, if Greece were self-governing, but since through the perversion of the Constitution and the virtuality of the Parliament, Greece is indeed governed as an absolute monarchy, it was next that the statesmen whom the illegitimate regime propagates should also become at fault." -K. Trikoupis, 1874"
 grefm_greece.032.a: "The Crown must take action."
 grefm_greece.033.t: "A Harmonious State"
 grefm_greece.033.d: "In accordance with the wishes of the National Assembly, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has granted assent to constitutional and procedural reforms curtailing the rights of the crown to appoint ministers without a majority in the assembly."
 grefm_greece.033.f: ""Requiring as a necessary qualification of those invited to join the local government the trust expressed to them by the majority of the representatives of the nation, I accept that the Parliament makes possible the existence of this qualification, without which the harmonious functioning of the state is impossible." -George I, 1875"
 grefm_greece.033.a: ""Zito Vasilévs ! Zito Vasilevka !—Zito, zito !""
 grefm_greece.034.t: ""Unfortunately, We are Bankrupt""
 grefm_greece.034.d: "In a nationally embarrassing show of incompetence, [ROOT.GetCountry.GetName]'s leaders have managed to bankrupt the nation. Despite this, several politicians have put together a series of plans to restore our financial credibility."
 grefm_greece.034.f: "Historical Note: Following an ambitious career marked by overspending and #italic a lot#! of corruption, Prime Minister Charilaos Trikoupis stood before Parliament and gave the most famous statement of his career. Or maybe he didn't. This quote isn't actually included in the minutes of the legislative session in question, but persists in popular mythos."
 grefm_greece.034.a: "We must reorganize our finances."
 grefm_greece.034.b: "Cancel foreign debts."
 grefm_greece.035.t: "A Perennial Problem"
 grefm_greece.035.d: "Despite centralization of state authority, brigands have clung on as a force in the hilly borders with the Ottomans. In a brazen action, a band of raiders seized a group of nobles on holiday in [ROOT.GetCountry.GetName]. Despite efforts by [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] to negotiate a ransom, the group was viciously massacred following a misunderstanding between them and the envoys of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. International reactions have been harsh against both the state and the crown."
 grefm_greece.035.f: ""We are moving on again. . . . We can see Evzones in front of us . . . we are lost. . ." -Mr. Vyner, a nephew of Lord Grey of England."
 grefm_greece.035.a: "This is a stain on [ROOT.GetCountry.GetName]."
 grefm_greece.035.tt: "Historical Note: In April of 1870, brigands took a group of aristocratic $GBR_ADJ$ travelers hostage. After negotiations were mishandled, they were murdered before Greek forces could apprehend the brigands. This badly damaged Greece's international standing and the peoples' confidence in the crown."
