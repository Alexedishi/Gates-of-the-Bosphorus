 grefm_greece.040.t: "The Military League"
 grefm_greece.040.d: "Emulating historical nationalist revolutions, a small, but determined, group of eager young officers have formed a radical faction within the National Assembly. This has spiraled into malcontent amongst the military who have formed the "Military League" and demanded the removal of all royal influence in the military and a renewed focus on the $grefm_megali_idea$. Many have gone as far as to strike up republican tones."
 grefm_greece.040.f: "While ranging from across the political spectrum, the participants in the Military League were inspired by an earlier faction, the "Japanese Group" named in reference to the Meiji reformers. While the "Japanese" took up an anti-oligarchy stance, the newly-formed Military League has maintained a strong meritocracy stance. Both have ended up fanning the flames of anti-monarchism in the name of Nationalism."
 grefm_greece.040.a: ""
 grefm_greece.041.t: "Military Lobbyists"
 grefm_greece.041.d: "Members of the [SCOPE.gsInterestGroup('armed_forces_scope').GetName] have interrupted proceedings at the National Assembly to present demands from the Military League. Among them, they "
 grefm_greece.041.f: ""
 grefm_greece.041.a: "Maybe they have some good points."
 grefm_greece.041.b: "They should know their place."
 grefm_greece.041.c: "Arrest these insubordinate curs!"
 grefm_greece.041.tt: "[SCOPE.sCharacter('armed_forces_leader_scope').GetFullName] will resign from [SCOPE.sCharacter('armed_forces_leader_scope').GetHerHis] position"
 grefm_greece.045.t: "A Cretan Champion"
 grefm_greece.045.d: "As the Military League continues to gather power and make direct threats to the monarchy, a relatively unknown politician, [SCOPE.sCharacter('grefm_venizelos_scope').GetFullName], has arrived in [SCOPE.sState('grefm_capital_scope').GetCityHubName] with a bold plan: playing on his popularity as a leader in the Cretan struggle, the man intends to take the reigns of power and push through a mixture of concessions and liberal reforms to appease the Military League."
 grefm_greece.045.f: ""After I finished my studies in Athens I returned home and hung out my bandolier. I had not tried many cases in the court of my home island before it became necessary for me to take up arms against the Turkish government. Although my father was born in Greece, I was considered an Ottoman subject —therefore a rebel— because my mother was born under the Turkish flag....I soon reached the point where I had to decide whether I ought to be a lawyer by profession and a revolutionary at intervals or a revolutionary by profession and a lawyer at intervals ... I naturally became a revolutionary by profession." - E. Venizelos, 1919"
 grefm_greece.045.a: "[ROOT.GetCountry.GetName] will finally have strong leadership."
 grefm_greece.045.b: "What does this man know of our politics?"
 grefm_greece.046.t: "A Cretan Champion"
 grefm_greece.046.d: "It was an unremarkable day when a relatively unknown politician, [SCOPE.sCharacter('grefm_venizelos_scope').GetFullName], arrived in [SCOPE.sState('grefm_capital_scope').GetCityHubName] with a bold plan: playing on his popularity as a leader in the Cretan struggle and riding the tide of Nationalism, this man intends to take the reigns of power and push through a mixture of liberal and military reforms to bring the $grefm_megali_idea$ from dream to reality."
 grefm_greece.046.f: ""After I finished my studies in Athens I returned home and hung out my bandolier. I had not tried many cases in the court of my home island before it became necessary for me to take up arms against the Turkish government. Although my father was born in Greece, I was considered an Ottoman subject —therefore a rebel— because my mother was born under the Turkish flag....I soon reached the point where I had to decide whether I ought to be a lawyer by profession and a revolutionary at intervals or a revolutionary by profession and a lawyer at intervals ... I naturally became a revolutionary by profession." - E. Venizelos, 1919"
 grefm_greece.046.a: "[ROOT.GetCountry.GetName] will finally have strong leadership."
 grefm_greece.046.b: "What does this man know of our politics?"
 grefm_greece.047.t: "A Loyalist Victory"
 grefm_greece.047.d: ""
 grefm_greece.047.f: ""
 grefm_greece.047.a: ""
 grefm_greece.047.b: ""
 grefm_greece.048.t: "The Goudi Coup"
 grefm_greece.048.d: "Fed up with the endless squabbles with the monarchy, the Military League has seized control of the SCOPE.gsInterestGroup('ig_armed_forces_scope').GetName] and ousted the Royal family from [ROOT.GetCountry.GetName]. With the nation under their control they have set up a military junta with the stated goal of enforcing Greek superiority over the Hellespont."
 grefm_greece.048.f: ""The first duty of a politician is to sacrifice his personal interest and that of his party to the general interest of his country. It is also his duty always to speak the truth to great and small aUke, without heeding the displeasure that his loyalty may provoke. Leaders must show an example of absolute submission to the law, or how will they be able to imbue their followers with their way of thinking? That is my fundamental principle...." -E. Venizelos, 1910"
 grefm_greece.048.a: "[ROOT.GetCountry.GetName] will finally have strong leadership."
 grefm_greece.049.t: "The Rise of the Ethnarch"
 grefm_greece.049.d: "Riding a wave of popular support, [SCOPE.sCharacter('grefm_venizelos_scope').GetFullName] has taken the reigns of government and proposed a wild flurry of reforms that aim to shake the Greek state to its core. Backed by the will of the people and the uneasy support of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], [ROOT.GetCountry.GetName] will be a herald of change in the East."
 grefm_greece.049.f: ""...I gave the opinion that the Army should devote itself to the urgent task of reorganizing the country's military forces and at the same time I gave the Revolution the advice to demand and impose the convening of a Revisionist Parliament, which would proceed with the revision of those provisions of the Constitution, the need for reform of which was demonstrated by the experience of almost half a century...." - E. Venizelos, 1910"
 grefm_greece.049.a: "Today marks a new future for [ROOT.GetCountry.GetName]."

