 grefm_greece.094.d: ""
 grefm_greece.094.f: ""
 grefm_greece.094.a: ""
 grefm_greece.095.t: ""
 grefm_greece.095.d: ""
 grefm_greece.095.f: ""
 grefm_greece.095.a: ""
 grefm_greece.096.t: "A Disgraced Tyrant"
 grefm_greece.096.d: "The royal court and political structure supporting [GetLawType('law_autocracy').GetName] has collapsed. Riding to the Royal Palace, [SCOPE.sCharacter('armed_forces_leader_scope').GetFullName] has seized [ROOT.GetCountry.GetRuler.GetFirstName] and secured passage of a constitution. While the King expected to hold out against the coup, his Council had already drawn up the document well before the uprising was declared."
 grefm_greece.096.f: ""I have given up all my privileges; I am no longer king; now that my ministers, the national assembly and a constitution have been imposed upon me and now that my army has stopped obeying me. In Greece, constitution means nothing more nor less than pillage." -Otto of Greece, 1843"
 grefm_greece.096.a: "Long Live the Constitution!"

 grefm_greece.097.t: "The Downfall of King Otto"
 grefm_greece.097.d: "Fed up with the $grefm_bavarocracy$, a popular insurrection has broken out in [ROOT.GetCountry.GetCapital.GetCityHubName] and deposed [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], who was last seen boarding a foreign schooner bound northwards. With the old [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] gone, the people have been asked by the provisional government to vote on his successor."
 grefm_greece.097.f: ""No printed ballot papers? Is this some sort of joke?"\n\n"No, sir. You will merely write the name of the man you would like on the throne and submit it to me within the hour.""
 grefm_greece.097.a: "[ROOT.GetCountry.GetName] will cast off the [GetLawType('law_monarchy').GetName]."
 grefm_greece.097.b: "Enough talk of foreign lords. A $grefm_greek$ will sit the throne."

 grefm_greece.097.1: "[SCOPE.sCountry('denmark_scope').GetAdjective] lord, William of Glücksburg, should take the throne."
 grefm_greece.097.2: "The [SCOPE.sCountry('belgium_scope').GetAdjective] prince, Philippe de Flandre, is a fine choice."
 grefm_greece.097.3: "Our benefactor, Eynard of [SCOPE.sCountry('swiss_scope').GetName], merits this office."
 grefm_greece.097.4: "The [SCOPE.sCountry('uk_scope').GetAdjective] Duke, Alfred is of a high pedigree."
 grefm_greece.097.5: "A [SCOPE.sCountry('france_scope').GetAdjective] noble will carry the torch."
 grefm_greece.097.6: "Prince Nicholas of [SCOPE.sCountry('russia_scope').GetName] is a perfect fit."
 grefm_greece.097.7: ""
 grefm_greece.097.8: ""
 grefm_greece.097.9: "Install the renegade, Garbaldi. What could go wrong?"

 grefm_greece.097.1_tt: "#bold William of Glücksburg#!, a [SCOPE.sCountry('denmark_scope').GetAdjective] [GetIdeology('ideology_reformer').GetName] Prince, will become $grefm_king_of_the_hellenes$ as #b George I#!"
 grefm_greece.097.2_tt: "#bold Philippe de Flandre#!, a [SCOPE.sCountry('belgium_scope').GetAdjective] [GetIdeology('ideology_modernizer').GetName] Prince, will become $grefm_king_of_the_hellenes$ as #b George I#!"
 grefm_greece.097.3_tt: "#bold Eynard the Philhellene#!, a [SCOPE.sCountry('swiss_scope').GetAdjective] [GetIdeology('ideology_humanitarian_royalist').GetName] notable, will become $grefm_king_of_the_hellenes$ as #b George I#!"
 grefm_greece.097.4_tt: "#bold Alfred, Duke of Edinburgh#!, a [SCOPE.sCountry('uk_scope').GetAdjective] [GetIdeology('ideology_market_liberal').GetName] Prince, will become $grefm_king_of_the_hellenes$ as #b George I#!"
 grefm_greece.097.5_tt: "A [SCOPE.sCountry('france_scope').GetAdjective] [GetIdeology('ideology_moderate').GetName] Prince will become $grefm_king_of_the_hellenes$ as #b George I#!"
 grefm_greece.097.5_tt_bourbon: "A [SCOPE.sCountry('france_scope').GetAdjective] #b Legitimist#! [GetIdeology('ideology_traditionalist').GetName] Prince will become $grefm_king_of_the_hellenes$ as #b George I#!"
 grefm_greece.097.5_tt_orleans: "A [SCOPE.sCountry('france_scope').GetAdjective] #b Orleanist#! [GetIdeology('ideology_market_liberal').GetName] Prince will become $grefm_king_of_the_hellenes$ as #b George I#!"
 grefm_greece.097.5_tt_bonaparte: "A [SCOPE.sCountry('france_scope').GetAdjective] #b Bonapartist#! [GetIdeology('ideology_jingoist_leader').GetName] Prince will become $grefm_king_of_the_hellenes$ as #b George I#!"
 grefm_greece.097.6_tt: "#bold Nicholas Nikolaevich#!, a [SCOPE.sCountry('russia_scope').GetAdjective] [GetIdeology('ideology_royalist').GetName] Prince, will become $grefm_king_of_the_hellenes$ as #b George I#!"
 grefm_greece.097.7_tt: ""
 grefm_greece.097.8_tt: ""
 grefm_greece.097.9_tt: "#bold Giuseppe Garibaldi#! will become $grefm_king_of_the_hellenes$ as #b Iosif I#!"

 grefm_greece.098.t: "The Othonian Realm"
 grefm_greece.098.d: "Having successfully steered the country through its tumultuous early years, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has now established himself as a capable statesman at the helm of a stable government."
 grefm_greece.098.f: "Sipping his coffee, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting] looked over his morning correspondence. Reports of roadside brigands, corruption scandals, and factional disputes, as per usual. But among the usual dreary reports were also hints of change. The effects of the recent changes in policing policy, the establishment of intellectual institutions, and the stirrings of a modern bureaucratic apparatus. Much remained to be done, but year by year the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] found his morning work just a touch more enjoyable."
 grefm_greece.098.a: "A new Pericles!"
 grefm_greece.098.b: "A new Alexander!"
 grefm_greece.099.t: "Civilizer-King of the Hellenes"
 grefm_greece.099.d: "Having successfully steered the country through its tumultuous early years, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has now established himself as a capable statesman at the helm of a stable government."
 grefm_greece.099.f: "Sipping his coffee, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting] looked over his morning correspondence. Reports of roadside brigands, corruption scandals, and factional disputes, as per usual. But among the usual dreary reports were also hints of change. The effects of the recent changes in policing policy, the establishment of intellectual institutions, and the stirrings of a modern bureaucratic apparatus. Much remained to be done, but year by year the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] found his morning work just a touch more enjoyable."
 grefm_greece.099.a: "A new Pericles!"
 grefm_greece.099.b: "A new Alexander!"

 grefm_greece.100.t: "The Fix Brewery"
 grefm_greece.100.d: "In newly independent Greece, several Bavarian nobles accompanied King Otto and settled throughout Attica, bringing with them their penchant for beer. To compete with the import of beers from Bavaria, Johann Karl Fix has established a brewery in the state of Athens to cater to the needs of the elites."
 grefm_greece.100.f: "Johann Adam Fix began brewing beer during the regency of King Otto which he found to be immensely lucrative. After securing his position as the supplier of beer to King George I, his son, Johann Karl Fix, opened the Fix Brewery which would go on to develop a stranglehold on the Greek beer market through the 1960s."
 grefm_greece.100.a: "Let the beer flow!"
 grefm_greece.101.t: "The Hellenic Railway"
 grefm_greece.101.d: "The connection of Attica with Thessaly has provided a clear sign of [ROOT.GetCountry.GetName]'s rise from its rural station."
 grefm_greece.101.f: "Historical Note: The construction of railways in Greece began in the 1880s under Prime Minister Charilaos Trikoupis who oversaw construction of the first major rail connections between Athens and newly conquered lands in Thessaly and later Thrace."
 grefm_greece.101.a: "Onward!"
 grefm_greece.102.t: "The Birth of Greek Flight"
 grefm_greece.102.d: "On a clear, sunny day in [SCOPE.sState('attica_scope').GetCityHubName], Greek aviator, Emmanouil Argyropoulos, has become the first Greek to fly over Athens, bringing delight and curiosity to the citizens down below."
 grefm_greece.102.f: "Historical Note: On 8 February 1912, Argyropoulos was the first Greek to perform a flight over his home country. A second flight conducted that same day, with then Prime Minister Eleftherios Venizelos, convinced state leaders of the need for a Hellenic Air Force."
 grefm_greece.102.a: "What a magnificent day for [ROOT.GetCountry.GetName]."
 grefm_greece.103.t: "Mercantile Traditions"
 grefm_greece.103.d: "Ever since their arrival in the Balkans in the late neolithic, the Greek cultures have had a stranglehold on maritime trade across the Aegean Sea. So great was the wealth of the Greek shipping magnates that they provided the material support that would give rise to the #italic Diafotismos#!, Greek Enlightenment, and from there, the Greek Revolution."
 grefm_greece.103.f: "While the Greeks held maritime supremacy in the Aegean throughout history, Ottoman rule saw Greek merchants take on a power of their own. From the 16th to the 18th century, trade in the Eastern Mediterranean came under Greek domination as a result of the jockeying between Great Britain, France, and Russia."
 grefm_greece.103.a: "The Aegean belongs to the Greeks."

 grefm_greece.110.t: "The Decline of the Heptanese School"
 grefm_greece.110.d: "Ever since Greek independence, the great art schools of the Ionian Islands have been declining as artists explore abroad. A royal commission has suggested that the state set up a Royal Art School to attract Greek artists."
 grefm_greece.110.f: "In the centuries since the Fall of Constantinople, artists on the Ionian Islands have kept alive the Byzantine artistic tradition. With an independent Greek state and influence from Italian and $FRA_ADJ$ artists, many artists have begun a shift towards Romanticism and away from the restrictive style of Byzantine art."
 grefm_greece.110.a: "This is a noble endeavor."
 grefm_greece.110.b: "The state cannot afford this expense."
 grefm_greece.111.t: "The Kopais Plain"
 grefm_greece.111.d: "With advances in Greek engineering, land surveyors have suggested that the state may be able to reclaim fertile lands currently submerged beneath Lake Kopais in Attica."
 grefm_greece.111.f: "Historical Note: Lake Kopais was once drained by the Mycenaneans over 3000 years ago in what was an incredible feat of prehistoric engineering. The lake refilled as their stone-works failed over the millennia. Villagers along the banks of the lake frequently complain of flooding and high water tables during heavy inflows into the lake."
 grefm_greece.111.a: "We will see what can be done."
 grefm_greece.111.tt: "You may now take a decision to #bold Drain Lake Kopais#!."
 grefm_greece.112.t: "The Kopais Plain Reclaimed"
 grefm_greece.112.d: "Years of steady work have borne fruit and Lake Kopais has been transformed into the Kopais plain. Already countless farmers have begun agricultural activity across the lakebed with the hope that these plains will be cultivated for generations to come."
 grefm_greece.112.f: ""They had learned later from my German friend, Ziegler, an engineer officer in Greece, that the Bavarians were pinning their hopes on the plan to drain Lake Kopais. Firstly, that from these expenses generated by the public during the work of that great enterprise, their benefit would not be negligible and secondly, the slower production from the cultivated lands of Kopaida would fill their pockets." -P. Papanaoum, 1873"
 grefm_greece.112.a: "A magnificent accomplishment."
 grefm_greece.113.t: "A Citadel Emerges"
 grefm_greece.113.d: "As the waters of Lake Kopais recede, researchers have taken note of a raised outcropping into the lake. While the site has been known to contain an ancient ruin, ephors from the Archaeological Service have suggested it may have played a larger role in relation to the shrinking lake and have requested authorization to excavate the area."
 grefm_greece.113.f: "The ruins, called "Gla," overlooks the Kopais Plain. Ignored until the draining of the lake, it shows promise as an early Greek site."
 grefm_greece.113.a: "We will see what can be done."
 grefm_greece.114.t: "Mercantile Rivalry"
 grefm_greece.114.d: "As our fleets begin to modernize, a fierce rivalry has developed between the ports of #yellow Pireaus#!, #yellow Patras#!, and #yellow Syra#!. Each has petitioned for status as the primary naval hub of [ROOT.GetCountry.GetName]."
 grefm_greece.114.f: "Each of these port cities comes with its benefits in the eyes of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. #yellow Pireaus#! lies closest to Athens, being a suburb in all but name. #yellow Patras#! is nestled in the Peloponnese, easily defensible with better access to Europe. #yellow Syra#!, out in the Cyclades, played a prominent role in the war for independence."
 grefm_greece.114.a: "Pireaus is already established."
 grefm_greece.114.b: "Patras might be more defensible."
 grefm_greece.114.c: "Syra is well positioned."

 grefm_greece.119.t: "Land Reclaimed in Kopaida"
 grefm_greece.119.d: "Lead engineers on the Lake Kopais project have announced the reclamation of several large tracts of land from the lake."
 grefm_greece.119.f: "With the lake level receding, several farmers from nearby villages have already begun preparing the land for agriculture."
 grefm_greece.119.a: "Excellent."

 grefm_greece.120.t: "The Rebirth of the Olympics"
 grefm_greece.120.d: "After years of political and monetary misfires, the Olympic Games have been held for the first time in over two millennia. Crowds have descended on [SCOPE.sState('attica_state').GetCityHubName] to experience the ceremony and events."
 grefm_greece.120.f: ""I declare the opening of the first international Olympic Games in Athens. Long live the Nation. Long live the Greek people.""
 grefm_greece.120.a: "This is an auspicious day!"
 grefm_greece.120.tt: "Cost of the Olympics has been set to a flat 200 bureaucracy."
 grefm_greece.121.t: "The Royal University of Athens"
 grefm_greece.121.d: "In the interest of developing the Greek state, King [SCOPE.sCharacter('university_benefactor').GetFullName] has put forward a plan to open [ROOT.GetCountry.GetName]'s first institution of higher learning in the same vein as the Ionian Academy. This plan would represent a large expense for the state."
 grefm_greece.121.f: "In 1837, the Athenian University (then called the Othonian University) was established by Royal decree of the King. While small at first, it represented a massive step in the development of a cohesive culture in modern Greece. Today, the university stands as the oldest institute of higher learning in the Balkans."
 grefm_greece.121.a: "A noble endeavor."
 grefm_greece.121.b: "The King knows not what he asks."
 grefm_greece.122.t: "The Great School of the Nation"
 grefm_greece.122.d: "With the liberation of [SCOPE.sState('university_state').GetCityHubName], [SCOPE.sCharacter('university_benefactor').GetFullName] has suggested reorganizing the Phanar Greek Orthodox College and opening it to the masses for the benefit of the Greek people."
 grefm_greece.122.f: "The Imperial University of Constantinople was founded as a #italic Universitas#! in 425AD under the Emperor Theodosius II. While different from European-style universities, it was an institution of higher learning teaching subjects ranging from law to mathematics to philosophy. With 31 chairs teaching subjects in both Latin and Greek, the institution aimed to produce competent bureaucrats to manage the Byzantine state. After the Fall of Constantinople, the university reorganized into its current form serving Phanariot families and Ottoman ministers."
 grefm_greece.122.a: "We will restore our cultural legacy."
 grefm_greece.122.b: "We will restore our cultural legacy."
 grefm_greece.122.c: "This is a meaningless endeavor."
 grefm_greece.123.t: "The Women's Journal"
 grefm_greece.123.d: "A young Cretan woman, [SCOPE.sCharacter('kalliroi_scope').GetFullName], recently started up a newspapers in [SCOPE.sState('grefm_capital_scope').GetCityHubName]. Named the #italic Ladies' Journal#!, this bi-weekly publication has begun to expose the virtues of protecting children from dangerous working environments and better compensation for women. Parren has gone as far as attending conferences denouncing the exclusion of women from both the workforce and political arena."
 grefm_greece.123.f: ""A principle knows no country; truth knows no frontiers. The question of women's rights is the same everywhere; everywhere it can be summed up in two words: Equality, Justice." -Leon Richer"
 grefm_greece.123.a: "We need to give value to our women and children."
 grefm_greece.123.b: "These women should focus themselves on their households."
 grefm_greece.123.tt: "Kalliroi Parren is widely seen as the founder of the feminist movement in Greece. Born in Crete and educated in Athens, she launched the #italic Ephemeris ton kyrion#!, which was run entirely by women and served as a springboard for spreading the message of feminism across Greece. She attended several international conferences and founded several welfare organizations dedicated to forwarding the cause of women. However, she would not directly support women's suffrage which she worried would be too radical for Greece at the turn of the century."
 grefm_greece.124.t: "Greek League for Women's Rights"
 grefm_greece.124.d: "The movements ignited by Kalliroi Parren have borne fruit with the elevation of the status of women beyond housewives. Furthermore, limitations on child labor have given the Greek state a chance at bettering the lives of the lower classes. As restrictions on the speech of women are peeled away, several leaders call for further reforms, including equality in marriage and suffrage."
 grefm_greece.124.f: "Following the first wave of women's rights reforming throughout the late 1800s, feminist Avra Theodoropoulou founded the Greek League for Women's Rights which expressly championed the cause of women's suffrage. This cause would eventually succeed in two phases: first in 1930 for literate women, and second in 1952 for all women. Feminist efforts would gradually turn women from silent housewives to active participants in the development of Greek nationalism."
 grefm_greece.124.a: "We will continue the push for equality."
 grefm_greece.124.b: "We should be proud of what we've accomplished."

 grefm_greece.130.t: "The Corinth Canal"
 grefm_greece.130.d: "Following the conclusion of a detailed survey in [SCOPE.sState('corinth_canal_site').GetNameNoFormatting], [SCOPE.sCharacter('ig_intelligentsia_scope').GetFullName] has declared that it may be possible to complete the bold plan envisioned by the late statesman, Ioannis Kapodistrias: a maritime canal cutting across Corinth."
 grefm_greece.130.f: "Since the days of ancient Greece, the Isthmus of Corinth has served as a vital link between the Peloponnese and Greater Greece. With our modern innovations, it may be possible to link the Ionia and Aegean Seas where historical attempts have failed."
 grefm_greece.130.a: "Let our work begin."
 grefm_greece.130.tt: "You may now begin construction on the Corinth Canal."
 grefm_greece.131.t: "The Corinth Canal Completed!"
 grefm_greece.131.d: "After years of labor, we have successfully carved a canal across Corinth and the waters of the Aegean and Ionian seas now mingle across the isthmus."
 grefm_greece.131.f: "With its towering limestone walls, this canal drastically shortens voyages from Thrace to Western Europe."
 grefm_greece.131.a: "This is a marvel of Greek might."
 grefm_greece.132.t: "The Royal Palace"
 grefm_greece.132.d: "After years of debates, a proposal has been put forward to build a royal residence in [SCOPE.sState('palaia_anaktora_site').GetCityHubName]."
 grefm_greece.132.f: "Designed by Bavarian architect, Friedrich von Gärtner, and funded by Ludwig I of Bavaria, the construction of a royal palace would lend to the credibility of the crown."
 grefm_greece.132.a: "A fine proposal."
 grefm_greece.132.b: "That would be a useless expense."

 grefm_greece.161.t: "The Don Pacifico Affair"
 grefm_greece.161.d1: "A missive arrived this morning from one of our citizens abroad. #yellow David Pacifico#! has reported that his residence was ransacked by a Greek mob. As a former member of our diplomatic mission to [SCOPE.sCountry('greece_scope').GetName], he has requested our intervention. Our diplomats have suggested passing the request through [SCOPE.sCountry('uk_scope').GetName], one of the guarantors of the Greek state."
 grefm_greece.161.d2: "[SCOPE.sCountry('portugal_scope').GetName] has requested our intervention in a minor diplomatic impasse in [SCOPE.sCountry('greece_scope').GetName]. A former diplomat of theirs, #yellow Don Pacifico#!, has had his residence raided by a mob in Athens. The Portuguese state aims to secure reparations for Pacifico."
 grefm_greece.161.d3: "A mob of miscreants have torched the home of #yellow David Pacifico#!, a former Portuguese diplomat. Using his contacts in the administrations of [SCOPE.sCountry('portugal_scope').GetName] and the [SCOPE.sCountry('uk_scope').GetName], he has made a formal request for reparations from the crown for damages to his property and insult to his person."
 grefm_greece.161.f: "An Easter-time tradition in Athens is the burning of an effigy of Judas. However, the practice was banned by the crown this year to avoid insult to #yellow Lord Rothschild#! who was visiting the capital. Confusingly, the residents of the city have wrongly blamed the former diplomat #yellow Don Pacifico#! for this disruption and raided his residence."
 grefm_greece.161.por1: "We will seek redress."
 grefm_greece.161.por2: "This is beneath us."
 grefm_greece.161.gbr1: "Their demands are just."
 grefm_greece.161.gbr2: "The Greek state cannot be held at fault."
 grefm_greece.161.gre1: "We will make this right."
 grefm_greece.161.gre2: "Who are they to make demands?"
 grefm_greece.162.t: "A Bulgarian Visitor"
 grefm_greece.162.d: "King [ROOT.GetCountry.GetRuler.GetFirstName] welcomed Prince [SCOPE.sCharacter('bulgaria_ruler_scope').GetLastName] of [SCOPE.sCountry('bulgaria_scope').GetName] to the court in [SCOPE.sState('greece_capital_scope').GetCityHubName] this afternoon. After introductions, Prince [SCOPE.sCharacter('bulgaria_ruler_scope').GetLastName] has made a passionate argument for pan-Balkan cooperation against the Sultan. Almost anxiously, the Prince awaits the King's response."
 grefm_greece.162.f: "Many Greeks both live within Bulgarian lands and within their greater claims as far south as Thrace. The Prince may promise them fair treatment under Bulgarian rule, but this does little to allay reports of mistreatment under the current regime. Regardless, some in the court believe that an alliance against the Porte may be the only way to ensure any type of future for [ROOT.GetCountry.GetName]."
 grefm_greece.162.a: "We welcome any supporters of the Greek cause."
 grefm_greece.162.tt: "Now to settle the problems of overlapping claims..."
 grefm_greece.162.b: "The Slavs will find no friends here."

 grefm_greece.180.t: "The Defence of Jonas King"
 grefm_greece.180.d: "[SCOPE.sCharacter('grefm_jonas_scope').GetFullName], a young and enthusiastic preacher from the [SCOPE.sCountry('usa_scope').GetName] has caused public outrage by spreading Calvinist doctrine in [ROOT.GetCountry.GetName]. The clergy have demanded immediate action by the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 grefm_greece.180.f: "At least on paper, the citizens of [ROOT.GetCountry.GetName] enjoy religious freedom. In practice, however, the Greek state is dominated by the [SCOPE.gsInterestGroup('devout_scope').GetName]. Following accusations of heresy for disrespect of [ROOT.GetCountry.GetStateReligion.GetName] iconography, he has published a book, #italic The Defence of Jonas King#!, in which he has argued that the early Church fathers rejected the use of icons. In doing so, he has been branded an apologist for Iconoclasm and has drawn popular anger."
 grefm_greece.180.a: "Suppress this heretic!"
 grefm_greece.180.b: "He means no harm."
 grefm_greece.181.t: "Speech before the Areopagus"
 grefm_greece.181.d: "The itinerant preacher, [SCOPE.sCharacter('grefm_jonas_scope').GetFullName], has been brought before [ROOT.GetCountry.GetName]'s high court to answer charges of heresy and defamation of the state. Following rapid proceedings, the court has ruled that the preacher will be exiled from the Greek state."
 grefm_greece.181.f: ""I am an evangelist; that is, a preacher of the word of God; I am a Christian most orthodox.... Those things in my book with regard to Mary, with regard to transubstantiation, and with regard to images, did not say; but the most brilliant luminaries of the Eastern church, St. Epiphanius, St. Chrysostom, the great St. Basil, St. Irenaeus, Clemens, and Eusebius." -J. King, testifying before the Aeropragus, 1843."
 grefm_greece.181.a: "Good riddance!"
 grefm_greece.182.t: "Jonas King Returns"
 grefm_greece.182.d: "Having sensed a thaw in Orthodox-Catholic tensions, the preacher [SCOPE.sCharacter('grefm_jonas_scope').GetFullName] has once again travelled to [ROOT.GetCountry.GetName]. As expected, leaders from the [SCOPE.gsInterestGroup('devout_scope').GetName] are outraged by his return."
 grefm_greece.182.f: "Despite taking a less aggressive approach towards his preaching, Reverend King has been set upon by the Greek church, with bishops denouncing his presence in the nation as anathema to the state."
 grefm_greece.182.a: "Arrest this renegade."
 grefm_greece.182.b: "He is no threat."
 grefm_greece.182.tt: "[GetReligion('protestant').GetName] states will appreciate this act."
 grefm_greece.183.t: "Foreign Intercession for Jonas King"
 grefm_greece.183.d: "Seeking justice for the witch-hunt against [SCOPE.sCharacter('grefm_jonas_scope').GetFullName], diplomats from the [SCOPE.sCountry('usa_scope').GetName] have interceded on behalf of King, asking that [ROOT.GetCountry.GetRuler.GetFullName] show clemency towards the preacher."
 grefm_greece.183.f: "Accused of "blasphemy against the One apostolic church," Jonas faced imprisonment on half-baked charges of heresy and insurrection. Given the delicate political situation growing around the trial, politicians have turned to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to decide the Greek state's next move."
 grefm_greece.183.a: "We will seek reconciliation."
 grefm_greece.183.b: "The state cannot tolerate this insult."
