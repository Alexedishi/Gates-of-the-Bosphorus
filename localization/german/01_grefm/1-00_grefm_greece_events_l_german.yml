 grefm_greece.060.t: "The Nature of the National Assembly"
 grefm_greece.060.d: "[SCOPE.sCharacter('grefm_venizelos_scope').GetFullName] and his supporters have provoked a fierce debate between the Revisionist supporters of Venizelos, who agitate for radical changes to the Greek state, and the Constituents, who argue for a complete rewrite of the Constitution."
 grefm_greece.060.f: ""My criticisms upon the inertia of royalty have been misinterpreted as antidynastic. On the contrary I believe that it is to the nation's interest to show its devotion to the reigning dynasty, and I therefore consider that the Assembly should remain revisionary, and recast the bases of legislation, according to modern requirements, in all matters dealing with public education, with labour questions and the relations of capital and labour...."\n\n"I will therefore co-operate with those whose aim is to raise Greece morally and materially to the level of other modern States, and to make her the great factor in civilization and progress in the East." -E. Venizelos, 1910"
 grefm_greece.060.a: "Take up the Revisionist charge."
 grefm_greece.060.b: "Restructure the entire state."
 grefm_greece.061.t: "Rejuvenating the State"
 grefm_greece.061.d: "The first reforms proposed by [SCOPE.sCharacter('grefm_venizelos_scope').GetFullName] have quickly centered on the reorganization of the state apparatus. Determined to rip [ROOT.GetCountry.GetName] free from the last vestiges of it's Ottoman history, Venizelists have preparing reforms covering land policy, judicial reform, and bureaucratic professionalism."
 grefm_greece.061.f: ""I do not promise that the Government will inaugurate the golden age in a day; the disease has been serious, and its treatment will take long; but what I can promise is that this treatment will be severe and radical." -E. Venizelos, 1910"
 grefm_greece.061.a: "The people deserve a competent state."
 grefm_greece.062.t: "A Competent Bureaucracy"
 grefm_greece.062.d: "Through aggressive reforms and recruitment, [ROOT.GetCountry.GetName] has assembled a veritable army of bean counters and pencil pushers capable of serving the future needs of the Greek state."
 grefm_greece.062.f: ""The first duty of a politician is to sacrifice his personal interest and that of his party to the general interest of his country.... The statesman must look upon power not as an end, but as a means to the realization of a lofty and patriotic aim." -E. Venizelos, 1910"
 grefm_greece.062.a: "The state must serve the people."
 grefm_greece.063.t: "Reorganizing the Military"
 grefm_greece.063.d: "Despite the overbearing influence of the military, [SCOPE.sCharacter('grefm_venizelos_scope').GetLastName] has embraced the military as an essential element of Greek identity and security. Several proposals have been put forward to improve the size, equipment, and training of the [SCOPE.gsInterestGroup('armed_forces_scope').GetName] such that [ROOT.GetCountry.GetName] will be able to exert it's influence across the Balkans."
 grefm_greece.063.f: ""Is the Greek army really ready? How many men can Greece put in the field?""
 grefm_greece.063.a: "The military must safeguard the Greek state."
 grefm_greece.064.t: "A Formidable Military"
 grefm_greece.064.d: "Modeled after the might and discipline of the armies of the West, the Greek military has transformed from the tribal militias of the Revolutionary era into a modern and formidable fighting force, giving [ROOT.GetCountry.GetName] the ability to project power beyond its borders."
 grefm_greece.064.f: ""What good is it to go to London? The fogs of the English capital will not help us; we had much better meet at Chataldja and dictate peace beneath the protection of our guns." -E. Venizelos, 1913"
 grefm_greece.064.a: "[ROOT.GetCountry.GetName] will fear nothing."
 grefm_greece.065.t: "Advancing Society"
 grefm_greece.065.d: "Following up on their demands for bureaucratic reform, the Venizelist camp has begun to push for reforms targeting the stations of women and children. Arguing that women and children are the foundation of the nation's future, they argue that children belong in schools and that women deserve increased rights on the factory floor."
 grefm_greece.065.f: "Unlike prior administrations, the Venizelists argue that, while removing children from the factories will damage production in the short term, these changes are an investment in the future of the Greek state."
 grefm_greece.065.a: "We cannot wallow in the past."
 grefm_greece.066.t: "A Modern Society"
 grefm_greece.066.d: "With a patient and steady hand, the Venizelists have succeeded in kick-starting changes in [ROOT.GetCountry.GetName]'s attitudes towards its women and children."
 grefm_greece.066.f: "These changes will allow women to become more than just meek housekeepers and children more than expendable brats."
 grefm_greece.066.a: "These changes are only fair."
 grefm_greece.067.t: "The Ignorant Masses"
 grefm_greece.067.d: "[ROOT.GetCountry.GetName] has long suffered from the twin maladies of illiteracy and rural poverty. While the valiant efforts of the #italic Phanariotes#! and the Orthodox Church kept the Greek language alive, the Venizelists hold that it is time for education and culture to spread beyond just the urban elites."
 grefm_greece.067.f: "Following in the vein of the $FRA_ADJ$ and Americans, the Venizelists seek to bring the light of civilization to all Greeks."
 grefm_greece.067.a: "The people must rise beyond their rural stations."
 grefm_greece.068.t: "An Educated Populace"
 grefm_greece.068.d: "The Venizelist push to bring a modern education system to the Greek people has culminated in the birth of a robust public education system."
 grefm_greece.068.f: "By teaching the people to read and write we will secure both our cultural heritage and build the foundation of our industrial future."
 grefm_greece.068.a: "Justly done!"
 grefm_greece.069.t: "The Greek State Resurgent"
 grefm_greece.069.d: "While polarizing and inflammatory, none can doubt that the efforts of the Venizelists to reform the Greek state have been successful. From administration to citizen's rights, [ROOT.GetCountry.GetName] stands poised to act once more as the beacon of civilization in the East."
 grefm_greece.069.f: ""Long live our nation!\nLong live Venizelos!\nLong live Greater Greece!""
 grefm_greece.069.a: "Our future remains bright!"

 grefm_greece.090.t: "The Regency Council"
 grefm_greece.090.d: "In the aftermath of gaining independence, [ROOT.GetCountry.GetName] fell into political instability, culminating in the assassination of Governor #yellow Ioannis Kapodistrias#!. To stave off a collapse into civil war, the [Concept('concept_great_power','$concept_great_powers$')] installed a Bavarian Catholic King to govern over the reconstituted [ROOT.GetCountry.GetAdjectiveNoFormatting] state.\n\nThe young King [ROOT.GetCountry.GetRuler.GetFullName] has recently come of age, but finds his ascent to the throne marred by the political intrigues of his "Arch-Chancellor" [GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetFullName] who has amassed personal control over the Greek political system."
 grefm_greece.090.f: ""O King of Greece! Old Greece bequeathed the lights of learning to Germany, through you Germany has undertaken to repay the gift with interest, and will be grateful to you, seeing in you the one to resurrect the firstborn people of the Earth." -P. Soutsos, 1837"
 grefm_greece.090.a: "[ROOT.GetCountry.GetName] must find its way."
 grefm_greece.091.t: "A Crisis Averted"
 grefm_greece.091.d: "In the face of popular distrust and despite the machinations of the [SCOPE.gsInterestGroup('ig_landowners_scope').GetName], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has implemented limitations on royal authority giving liberties to the citizens of [ROOT.GetCountry.GetName]. However, many continue to call for further reductions in the power and status of the nobility and the elevation of Greece into a beacon of hope for Greek peoples abroad."
 grefm_greece.091.f: "We did not fight to overthrow our Turkish oppressors just to replace them with German ones."
 grefm_greece.091.a: "Hail to the benevolent [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], [ROOT.GetCountry.GetRuler.GetFullName]!"
 grefm_greece.092.t: "Long Live the Constitution!"
 grefm_greece.092.d: "Against popular demands and in defiance of his obligations to [ROOT.GetCountry.GetName]'s protectors, [SCOPE.sCharacter('king_otto_scope').GetFullName] has dismissed [GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetFullName] and established absolute personal rule over the Greek state."
 grefm_greece.092.f: ""In my position, without State Chancellor, without Prime Minister, I feel a new incentive to devote myself with greater activity to my calling, for the success of the good cause now depends on me more than formerly." -Otto of Greece, to his father Ludwig of Bavaria, 1838"
 grefm_greece.092.a: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] will have sovereignty."
 grefm_greece.093.t: "The True Faith of Greece"
 grefm_greece.093.d: "Relenting to pressure from his subjects, King [ROOT.GetCountry.GetRuler.GetFirstName] has agreed to adopt the true [GetReligion('orthodox').GetName] faith. However, there remain many who doubt the sincerity of this supposed [concept_conversion]"
 grefm_greece.093.f: "The $grefm_greek$ people are unquestioningly entwined with [GetReligion('orthodox').GetName] Christianity and this has manifested in a tide of xenophobia. Every day, contingents of priest and peasant alike believe that securing an [GetReligion('orthodox').GetName] ruler may be the best hope for halting the decline of the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName]'s influence."
 grefm_greece.093.a: "The royal family will join the Church."
