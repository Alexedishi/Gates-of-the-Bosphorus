 turkfm_tunis.008.t: "A Stagnant State"
 turkfm_tunis.008.d: "Despite attempts at reform and modernization, it is clear that [ROOT.GetCountry.GetName] will be unable to achieve its lofty ambitions to equal the might of the West."
 turkfm_tunis.008.f: "Despite the failure of attempts at rapid reform, many in court cling to the ideals of reform."
 turkfm_tunis.008.a: "Is [ROOT.GetCountry.GetNameNoFormatting] doomed to stagnation?"
 turkfm_tunis.008.b: "We will not give up our aspirations."
 turkfm_tunis.009.t: "The Tunisian Fundamental Pact"
 turkfm_tunis.009.d: "Through a lifetime of dedication, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] elevated [ROOT.GetCountry.GetName] from its disorganized roots into a true state."
 turkfm_tunis.009.f: ""We commit ourselves, not only in our name, but also in the name of all our successors; none of them will be able to reign until they have sworn to observe these liberal institutions. We call to witness, before God, this illustrious assembly composed of the representatives of the great friendly powers, and the high officials of our government". -Tunisian Fundamental Pact of 1857"
 turkfm_tunis.009.a: "This is a wonderful day for [ROOT.GetCountry.GetName]!"