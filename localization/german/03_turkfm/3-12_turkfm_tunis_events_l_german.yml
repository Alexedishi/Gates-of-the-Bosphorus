l_german:
 turkfm_tunis.001.t: "Between Seas and Sands"
 turkfm_tunis.001.d: "Through the millennia, [ROOT.GetCountry.GetName] has existed as a vital link between the waters of the Mediterranean and the sands of the Sahara. However, with $FRA_ADJ$ intrusions looming from the west and Turkish influence from the east, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] finds himself pressed to stave off foreign intervention."
 turkfm_tunis.001.f: "From Punic, to Roman, to Greek, to Arab, and now Turkish overlords, the inhabitants of [ROOT.GetCountry.GetNameNoFormatting] have persevered. With the ascendancy of the $FRA_ADJ$ Empire comes the threat of a new era of foreign overlordship."
 turkfm_tunis.001.a: "[ROOT.GetCountry.GetName] will find its way."
 turkfm_tunis.002.t: "An Ambitious [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]"
 turkfm_tunis.002.d: "In a shock to the court, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has been found dead in his chambers from natural causes. His inexperienced, but highly educated son, [SCOPE.sCharacter('turkfm_ahmad_scope').GetFullName], has been recalled from abroad to assume the lordship of [ROOT.GetCountry.GetName]."
 turkfm_tunis.002.f: "While inexperienced, the young Lord has been gripped by the development of the West and is filled with an ambition to realize the modernization of Tunis. Armed with a western education, he has been quick to declare the beginning of a era of reform."
 turkfm_tunis.002.a: "Onward, for [ROOT.GetCountry.GetName]!"
 turkfm_tunis.003.t: "A Stately Reception"
 turkfm_tunis.003.d: "Following days of pomp and circumstance, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s visit to the [SCOPE.sCountry('france_scope').GetName] has been a resounding success. Carefully attended to by his hosts in [SCOPE.sCountry('france_scope').GetCapital.GetCityHubName], [ROOT.GetCountry.GetRuler.GetFirstName] has returned to [ROOT.GetCountry.GetName] with a sense of deep awe and respect for the development of the west and plans to bring the enlightenment to the [ROOT.GetCountry.GetAdjectiveNoFormatting] people."
 turkfm_tunis.003.f: "The [SCOPE.sCountry('france_scope').GetAdjectiveNoFormatting] [SCOPE.sCountry('france_scope').GetRuler.GetPrimaryRoleTitle] has greeted the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] with honors befitting a sovereign nation. This is likely to draw a dispute from the $turkfm_porte$."
 turkfm_tunis.003.a: "[ROOT.GetCountry.GetName] will remain a backwater no longer."
