l_simp_chinese:
 grefm_trabzon.001.t: "The Pontic Greeks"
 grefm_trabzon.001.d: "The [GetCulture('rhomaios').GetName] of [ROOT.GetCountry.GetName] have called their lands home since before written history. The arrival of the [SCOPE.sCountry('ottoman_scope').GetName], coupled with the emanations of [GetCulture('greek').GetName]#yellow ism#! from the West, has brought the erosion of our unique culture and identity. The [ROOT.GetCountry.GetAdjectiveNoFormatting] people must find their place in this changing world."
 grefm_trabzon.001.f: ""...the cruel persecutions of their Mahomedan masters have been the cause of their present degraded state of ignorance, even in regard to their native tongue; for that there was a time when their Turkish masters strictly prohibited the Greeks in Asia Minor even from speaking the Greek language among themselves....  the language of their oppressors has long since almost universally prevailed, and in a great part of Anatolia even the public worship of the Greeks is now performed in the Turkish tongue." -John Pinkerton, 1817"
 grefm_trabzon.001.a: "[ROOT.GetCountry.GetName] must find its way."