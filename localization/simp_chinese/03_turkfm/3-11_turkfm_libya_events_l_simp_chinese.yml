 turkfm_libya.009.t: "A Centralized State"
 turkfm_libya.009.d: "In a heavily rehearsed ceremony, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] proclaimed the restructuring of [ROOT.GetCountry.GetName] and has elevated the law of the state above that of the tribes."
 turkfm_libya.009.f: "One by one, the tribal heads have sworn their allegiance to the central authority in [ROOT.GetCountry.GetCapital.GetCityHubName]. With their support, the will of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] will reach even to the deserts."
 turkfm_libya.009.a: "This is a great day for [ROOT.GetCountry.GetName]!"

 turkfm_libya.100.t: "The Senussi Order"
 turkfm_libya.100.d: "An unassuming [GetReligion('sunni').GetName] scholar, [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName], has arrived in [ROOT.GetCountry.GetNameNoFlag]. In advocating for reform of [GetReligion('sunni').GetName] Islam and independence from [ROOT.GetCountry.GetOverlord.GetName], he has gained recognition amongst the [GetCulture('bedouin').GetName] tribes of the desert."
 turkfm_libya.100.f: "Outside of the major settlements, spiritual lives in the deserts are guided less by the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] and more by itinerant preachers known by the term [GetCharacterTrait('gbbf_trait_marabout').GetName]. These figures often act as tribal mediators and intermediaries between state authorities and tribal leaders."
 turkfm_libya.100.a: "This could be troublesome."
 turkfm_libya.101.t: "The Grand Senussi"
 turkfm_libya.101.d: "#yellow Muhammad ibn Ali#! has died. In his place, his son [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName], has risen to head the $turkfm_senusiyya$ Order. Hailed as the "Mahdi" or "Great One," he is poised to lead the order to greater influence."
 turkfm_libya.101.f: "While [SCOPE.sCharacter('turkfm_senussi_character_scope').GetLastName] has refused to claim the title of "Mahdi," that has done little to dissuade adherents of the order from proclaiming him to a be saint in the making."
 turkfm_libya.101.a: "Definitely troublesome."
 turkfm_libya.102.t: "Senussi Withdraws to the Desert"
 turkfm_libya.102.d: "In response to increased scrutiny by [ROOT.GetCountry.GetNameNoFlag], [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName] has relocated his operations deep into the deserts of [SCOPE.sCountry('kufra_scope').GetNameNoFlag] in the hopes of evading our patrols."
 turkfm_libya.102.f: "While much harsher an environment than the cities and oases, the deserts offer ample places to hide from the eyes of the state."
 turkfm_libya.102.a: "Serves them right."
 turkfm_libya.103.t: "Armed Diplomacy"
 turkfm_libya.103.d: "Our armed delegation has arrived at [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFirstName]'s base of operations in [SCOPE.sState('kufra_capital_scope').GetName]. Following a tense exchange with [SCOPE.sCharacter('turkfm_senussi_character_scope').GetLastName], a nominal agreement was struck to minimize interference with the [ROOT.GetCountry.GetAdjectiveNoFlag] administration."
 turkfm_libya.103.f: "While discussions were cordial, [SCOPE.sCharacter('turkfm_senussi_character_scope').GetLastName] appeared to understand the nature of our visit. However, advisors have been quick to caution that there is little we can to do actually enforce any agreements."
 turkfm_libya.103.a: "Let this be a message."
 turkfm_libya.104.t: "The State-within-a-State"
 turkfm_libya.104.d: "As the influence of the $turkfm_senusiyya_movement$ continues to grow in [ROOT.GetCountry.GetNameNoFlag], [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName] has proposed the organization of his adherents and their lodges into a "state-within-a-State.""
 turkfm_libya.104.f: "While wrapped in the noble cause of defending his followers, the Grand Senussi threatens the supremacy of the Sultan in state and social affairs."
 turkfm_libya.104.a: "This is concerning."
