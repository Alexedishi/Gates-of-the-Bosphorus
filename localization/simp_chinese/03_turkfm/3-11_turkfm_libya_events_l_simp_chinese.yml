 turkfm_libya.108.t: "The Senusiyya Movement Extinguished"
 turkfm_libya.108.d: "In accordance with the mandate of the $turkfm_porte$, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has driven back the adherents of the $turkfm_senusiyya_movement$ and ensured the extinction of their school of thought."
 turkfm_libya.108.f: "By securing the country against the followers of Senussi, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has also secured the dominance of [GetCulture('turkish').GetName] influence over [ROOT.GetCountry.GetName]."
 turkfm_libya.108.a: "The [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] will guide [ROOT.GetCountry.GetName]."
 turkfm_libya.109.t: "House Senussi of [ROOT.GetCountry.GetName]"
 turkfm_libya.109.d: "Arriving flanked by cheering crowds, [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName], the head of the $turkfm_senusiyya_movement$, has taken the throne of [ROOT.GetCountry.GetName]."
 turkfm_libya.109.f: ""
 turkfm_libya.109.a: "The $turkfm_senusiyya_movement$ will guide [ROOT.GetCountry.GetName]"

 turkfm_libya.110.t: "$turkfm_senusiyya$ Spreads to [SCOPE.sCountry('turkfm_senussi_target').GetName]"
 turkfm_libya.110.d: "Comfortable in his level of influence within [ROOT.GetCountry.GetName], [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName] has dispatched missionaries across the border into the deserts of [SCOPE.sCountry('turkfm_senussi_target').GetName] to spread his message."
 turkfm_libya.110.f: "By operating deep in the deserts, the followers of Senussi are able to evade central authority. To them, international borders are merely a suggestion."
 turkfm_libya.110.a: "This is becoming problematic."
 turkfm_libya.111.t: "The Senussi Order"
 turkfm_libya.111.d: "Adherents of the [GetReligion('sunni').GetName] scholar, [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName], have arrived in [ROOT.GetCountry.GetNameNoFlag]. Bringing with their peculiar brand of $turkfm_senusiyya$ thought, they have gained recognition amongst the [GetCulture('bedouin').GetName] tribes of the desert."
 turkfm_libya.111.f: "Outside of the major towns, spiritual life in [GetStrategicRegion('region_north_africa').GetName] is guided less by the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] and more by itinerant preachers known by the term [GetCharacterTrait('gbbf_trait_marabout').GetName] These figures often act as tribal mediators and intermediaries between state authorities and tribal leaders."
 turkfm_libya.111.a: "This could be troublesome."
 turkfm_libya.112.t: "$turkfm_senusiyya$ Takes Root in [SCOPE.sState('turkfm_senussi_state_scope').GetName]"
 turkfm_libya.112.d: "Adherents of the $turkfm_senusiyya_movement$ have made significant inroads into [SCOPE.sState('turkfm_senussi_state_scope').GetCityHubName] and established several lodges across [SCOPE.sState('turkfm_senussi_state_scope').GetName]. It will take significant effort to dislodge them now."
 turkfm_libya.112.f: "Centralized administration has encountered opposition from the populace who decry increased taxation and the erosion of their traditional autonomy. This has given the $turkfm_senusiyya_movement$ a wedge to find popular support."
 turkfm_libya.112.a: "We must keep them in their lane."
 turkfm_libya.112.b: "The state must take action."
 turkfm_libya.113.t: "$turkfm_senusiyya$ Expunged From [SCOPE.sState('turkfm_senussi_state_scope').GetName]"
 turkfm_libya.113.d: "Leaders of the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] have succeeded in pushing the $turkfm_senusiyya_movement$ out of [SCOPE.sState('turkfm_senussi_state_scope').GetCityHubName] and from their lodges across [SCOPE.sState('turkfm_senussi_state_scope').GetName]."
 turkfm_libya.113.f: "By repelling the $turkfm_senusiyya_movement$ from our urban centers, the "
 turkfm_libya.113.a: "The [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] are the only authority in [ROOT.GetCountry.GetName]."
