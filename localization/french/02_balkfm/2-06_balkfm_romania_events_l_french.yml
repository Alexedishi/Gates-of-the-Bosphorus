 balkfm_romania.300.t: "The Lands Beyond the Forest"
 balkfm_romania.300.d: ""
 balkfm_romania.300.f: ""
 balkfm_romania.300.a: ""
 balkfm_romania.300.b: ""

 balkfm_romania.400.t: "An Elected Domintor"
 balkfm_romania.400.d: "With the approval of the Great Powers and the Constituent Assembly, [ROOT.GetCountry.GetRuler.GetFullName] has been named [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Newspapers have reported he has already arrived in [ROOT.GetCountry.GetCapital.GetCityHubName]."
 balkfm_romania.400.f: "While the new [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] is unfamiliar with [ROOT.GetCountry.GetName] and her customs, the people are optimistic for future political stability."
 balkfm_romania.400.a: "[ROOT.GetCountry.GetName] must find its way."
 balkfm_romania.401.t: "Liberalist Demands"
 balkfm_romania.401.d: "The failure of the #italic Statutul Desvoltător#! has led politicial leaders to put forward plans for a new Constitution for [ROOT.GetCountry.GetName]. Inspired by Belgian Liberalism, Romanian intellectuals hope this will lead the nation into an era of modernity."
 balkfm_romania.401.f: "The proposed changes are much more modest in scope that previously, this time attempting to strike a balance between imported Liberalism from the West and the unique circumstances of the Romanian state."
 balkfm_romania.401.a: "This is a noble vision for [ROOT.GetCountry.GetName]."
 balkfm_romania.401.b: "This reeks of bourgeoisie entitlement."
 balkfm_romania.402.t: "A Conspiracy in Ploiești"
 balkfm_romania.402.d: "Incensed by the King's refusal to accept consitutional limitations, a group of intellectuals, led by [SCOPE.sCharacter('balkfm_candiano_scope').GetFullName] have raised banners and declared a rebellion in the city of #yellow Ploiești#!. Local security forces having already begun the process of rounding up the participants, but many fear a renewed radicalist contagion in [ROOT.GetCountry.GetName]."
 balkfm_romania.402.f: ""We'll walk to the train station on the other side of Cişmigiu, and sometime till morning we'll catch the train to Ploieşti... There, I shan't be afraid anymore: I'll be among my own kind! All of them republicans, poor souls!" -excerpt from the play "Conu Leonida faţă cu reacţiunea," 1880"
 balkfm_romania.402.a: "Arrest these radicals."
 balkfm_romania.402.b: "We cannot resist their demands."
 balkfm_romania.402.c: "This man could have a better use..."
 balkfm_romania.402.tt: "This will reduce support for the King by #bold 20#!."
 balkfm_romania.403.t: "Ploiești Revolt Suppressed"
 balkfm_romania.403.d: "As quickly as it started, the self-proclaimed #yellow Republic of Ploieşti#! has been dissolved and it's organizers arrested."
 balkfm_romania.403.f: ""In the space of our century, a very interesting state was born and ended, one that no scrupulous historian should ignore. I wish to speak of the Ploieşti Republic, a state which, although it has lasted only fifteen hours, has for sure marked a celebrated page in contemporary history. Born out of, through, and for the people, at around two o'clock in the morning of August 8, 1870, the young republic was smothered on the same day, around four o'clock in the afternoon. Never mind! the greatness and importance of states are not judged by their extent and duration, but by the more or less brilliant role they have played in the universal system." -I. L. Caragiale"
 balkfm_romania.403.a: "Excellent news."
 balkfm_romania.403.tt: "This will increase support for the King by #bold 20#!."
 balkfm_romania.404.t: "Ploieștian Radicalism Spreads"
 balkfm_romania.404.d: "As quickly as it started, the self-proclaimed #yellow Republic of Ploieşti#! has been dissolved and it's organizers arrested. However, the brutality of local forces has inspired several others to take up the republican cause."
 balkfm_romania.404.f: ""...you have forgotten that I am a Ploieşti native – yes, a Ploieşti native – buddy, and I shall pull you a revolution, but not just any revolution... one to remember me by!..." excerpt from "D-ale carnavalului," 1885"
 balkfm_romania.404.a: "This is getting out of hand."
 balkfm_romania.404.tt: "This will reduce support for the King by #bold 20#!."
 balkfm_romania.405.t: "The Candiano Republic"
 balkfm_romania.405.d: "Radicalism has overwhelmed the [ROOT.GetCountry.GetAdjective] state. Leading the charge, radical [SCOPE.sCharacter('balkfm_candiano_scope').GetFullName] has taken the reigns of the state and promises to bring an era of renewed liberalism to [ROOT.GetCountry.GetName]."
 balkfm_romania.405.f: "Faced with threats to his person, [SCOPE.sCharacter('balkfm_ruler_scope').GetFullName] has fled to the West."
 balkfm_romania.405.a: "Down with the crown!"
 balkfm_romania.406.t: "Monarchism Secured"
 balkfm_romania.406.d: "In the face of the regime that welcomed him into [ROOT.GetCountry.GetName], King [ROOT.GetCountry.GetRuler.GetFullName] has installed himself as an autocratic ruler."
 balkfm_romania.406.f: "As citizens fall in line behind the new order, the conspirators have been outed and arrested."
 balkfm_romania.406.a: "[ROOT.GetCountry.GetName] will have order."
 balkfm_romania.406.b: "Expel these radicals."
 balkfm_romania.407.t: "The Republic of [ROOT.GetCountry.GetName]"
 balkfm_romania.407.d: "Radicalism has overwhelmed the [ROOT.GetCountry.GetAdjective] state. Leading the charge, radical [SCOPE.sCharacter('balkfm_candiano_scope').GetFullName] has taken the reigns of the state and promises to bring an era of renewed liberalism to [ROOT.GetCountry.GetName]."
 balkfm_romania.407.f: "Faced with threats to his person, [SCOPE.sCharacter('balkfm_ruler_scope').GetFullName] has fled to the West."
 balkfm_romania.407.a: "[ROOT.GetCountry.GetName] must find it's way."

 balkfm_romania.500.t: "The Romanian Academy"
 balkfm_romania.500.d: "In the interest of developing [ROOT.GetCountry.GetName], King [SCOPE.sCharacter('university_benefactor').GetFullName] has put forward a plan to open a native institution of higher learning in [SCOPE.sState('university_state').GetCityHubName]. This plan would represent a large expense for the state."
 balkfm_romania.500.f: "The Academia Română was founded in Bucharest in 1866. Today, it serves as the authoritative institution on matters of Romania language, history, and culture."
 balkfm_romania.500.a: "A noble endeavor."
 balkfm_romania.500.b: "The cost is too great."
 balkfm_romania.501.t: "A Royal Estate"
 balkfm_romania.501.d: "After a tremendous effort, the #yellow Castelul Peleș#! has been completed in [SCOPE.sState('wallachia_state_scope').GetName]. Eager to legitimize his rule, [ROOT.GetCountry.GetRuler.GetFullName] has already begun moving his court into the complex."
 balkfm_romania.501.f: ""Italians were masons, Romanians were building terraces, the Gypsies were coolies. Albanians and Greeks worked in stone, Germans and Hungarians were carpenters. Turks were burning brick. Engineers were Polish and the stone carvers were Czech. The Frenchmen were drawing, the Englishmen were measuring, and so was then when you could see hundreds of national costumes and fourteen languages in which they spoke, sang, cursed and quarreled in all dialects and tones, a joyful mix of men, horses, cart oxen and domestic buffaloes." -Queen Elisabeth of Wied"
 balkfm_romania.501.a: "Wonderful."

 balkfm_romania.600.t: "Forms Without Substance"
 balkfm_romania.600.d: "The debate over Romanian identity has reached a fever pitch in the literary space. Scholar [SCOPE.sCharacter('balkfm_mairoescu_scope').GetFullName] has blasted the supposed "reckless" modernization of the Romanian state, claiming that liberalism has no basis in [ROOT.GetCountry.GetName] as it is a nation of peasants and landowners without an entrenched bourgeoisie class."
 balkfm_romania.600.f: "Mairoescu and his supporters have gathered around a literary club "Junimea." Claiming to champion the true Romanian identity, they have become a focal point for Romanian conservatism between their demands for legislative regression and the rejection of an idealized Romanian past."
 balkfm_romania.600.a: "But we've always been Romanian..."
 balkfm_romania.601.t: "Etymologicum Magnum Romaniae"
 balkfm_romania.601.d: "Accomplished Romanian historiographer, [SCOPE.sCharacter('balkfm_hasdeu_scope').GetFullName], has found himself the target of the #yellow Junimist#! movement following his latest publications regarding the Romanian language. Undaunted, he has pushed forward the narrative that the Romanian people have been and will continue to be the primary force of European innovation."
 balkfm_romania.601.f: "Liberal thought in Romania has found its basis in a self-ascribed Romanian "pioneering spirit" that they claim has propelled Romanian primacy in history. Termed #yellow Dacianism#!, this school of thought suggests that Romanian people have been at the forefront of politics and science since the days of Roman Dacia. This is despite a conspicuous lack of evidence to support their claims."
 balkfm_romania.601.a: ""Pioneering Spirit" indeed..."
 balkfm_romania.602.t: "A Romanian Identity"
 balkfm_romania.602.d1: "The triumph of the #yellow Junimist#! movement has laid the foundation for a unified Romanian identity. Striking a balance between the boyars and farmers who work their land, Romanians have come to see themselves as a people that have evolved through a fusion of Dacian agrarianism and Roman statesmanship."
 balkfm_romania.602.d2: "The triumph of the #yellow Dacian#! movement has laid the foundation for a unified Romanian identity. Foregoing the imagined "shackles" of agrarianism, Romanians have been enthralled by the narrative that they are the heirs to a rich tradition of progress and innovation dating back to when the first Roman colonists set foot in what would become Roman Dacia."
 balkfm_romania.602.f1: ""The only true social class is the Romanian peasant, and his reality is suffering. His sighs are caused by the fantasies of the upper classes, for it is out of his daily sweat, that the material means to support this fictitious structure we call Romanian culture are taken. And we force him to hand out the very last measure of himself in order to pay for our painters and musicians, the Academy and Atheneum members, and the literary and scientific awards wherever they are handed out. And we do not have, at the very least, the gratitude to produce a single artistic work that would for a moment raise his spirits and make him forget his daily misery." -T. Mairoescu"
 balkfm_romania.602.f2: ""...in the cruel solitude to which I am condemned, only this colossal encyclopedia of the Romanian people, only the daily contact with the spirit of an entire nation, only the satisfaction that I alone do what even my enemies have admitted that it cannot do no one, only this saves me from the ugliness that would destroy me. In the words of a Roman emperor, I feel that I am becoming a god, and feeling it - I feel like laughing." - B. Hasdeu"
 balkfm_romania.602.a: "[ROOT.GetCountry.GetName] will not abandon her roots."
 balkfm_romania.602.b: "[ROOT.GetCountry.GetName] will pioneer a new future."

 balkfm_romania.700.t: "Our Declaration of Union"
 balkfm_romania.700.d: "By our strength and wits, we have taken the first steps in uniting the Romanian nation. The future beckons!"
 balkfm_romania.700.f: "The reporter began writing the day's experiences down. "Nothing but the liveliest demonstrations of joy could be heard throughout the capital. It was the only show that could be seen on all the streets, on all the sidewalks, in all the public places of the city. Our peasant brothers were now shouting with all the energetic power of their souls: '#italic Long live the nation! Long live Romania!#!'"\n\nA single joyous tear rolled down his cheek. "Everyone threw themselves into each other's arms, regardless of their station, as if all, in general, had freed themselves from the most oppressive yoke.""
 balkfm_romania.700.a: "Toți în unu!"
 balkfm_romania.700.a.tta: "[SCOPE.sCountry('romania_lesser_partner').GetName] shall become the lesser member in a [concept_personal_union] with us."
 balkfm_romania.700.a.ttb: "[SCOPE.sCountry('romania_lesser_partner').GetName] shall become our [concept_puppet]."
 balkfm_romania.701.t: "Awaken Thee, Romanian!"
 balkfm_romania.701.d: "Our union with [SCOPE.sCountry('romania_lesser_union_partner').GetName] is complete. Our bonds are solid, our will is unyielding—together, we are #bold Romania#!."
 balkfm_romania.701.d2: "Our union with [SCOPE.sCountry('romania_lesser_union_partner').GetName] and [SCOPE.sCountry('transylvania_union_partner').GetName] is complete. Our bonds are solid, our will is unyielding—together, we are #bold Romania#!."
 balkfm_romania.701.f: ""Wake up, Romanians, from your sleep of death," roared the crowd.\n\n"Into which you've been sunk by the barbaric tyrants.\nNow or never, sow a new fate for yourself\nTo which even your cruel enemies will bow!"\n\nTricolors flapped in the wind. Children were being hoisted into the air to etch the moment into their memories. Together, people were singing a song they had never heard before, but knew the words in their hearts already."
 balkfm_romania.701.a: "Unity through life and brotherhood through death!"
 balkfm_romania.702.t: "Retrocession Granted"
 balkfm_romania.702.d: "Following quick negotiations, [SCOPE.sCountry('romanian_bessarabia_owner').GetName] has agreed to cede a portion of Bessarabia to [ROOT.GetCountry.GetName]."
 balkfm_romania.702.f: "Slowly, but surely, the dream of Romanian union will come to fruition."
 balkfm_romania.702.a: "This is a great step for the [GetCulture('romanian').GetName] people!"
 balkfm_romania.703.t: "Retrocession Denied"
 balkfm_romania.703.d: "Negotiations for the return of Bessarabian lands to [ROOT.GetCountry.GetName] have failed. With this, the [GetCulture('romanian').GetName] people remain estranged by foreign borders."
 balkfm_romania.703.f: "The Romanian people have long been prey to the imperial powers in the Balkans. This failure represents another continuation of their oppression."
 balkfm_romania.703.a: "They will not stop the [GetCulture('romanian').GetName] cause."
 balkfm_romania.704.t: "Union with Transylvania"
 balkfm_romania.704.d: "Our union with [SCOPE.sCountry('transylvania_scope').GetName] is complete. Our bonds are solid, our will is unyielding—together, [ROOT.GetCountry.GetName] will not be denied!."
 balkfm_romania.704.f: ""The lands named in the resolution of the Alba-Iulia National Assembly of the 18th of November 1918 are and remain forever united with the Kingdom of Romania." -Ferdinand I, 11 December 1918"
 balkfm_romania.704.a: "One for All"
 balkfm_romania.705.t: "Treaty of [SCOPE.sState('transylvania_capital_scope').GetCityHubName]"
 balkfm_romania.705.d: "Following quick negotiations, [SCOPE.sCountry('transylvania_scope').GetName] has agreed to join the Greek state."
 balkfm_romania.705.f: "Romanians in [SCOPE.sState('transylvania_capital_scope').GetName] fought for their freedom. It is only right that they rejoin the [ROOT.GetCountry.GetAdjective] family."
 balkfm_romania.705.a: "[ROOT.GetCountry.GetName] will not be denied!"
 balkfm_romania.706.t: "Romanian Agitation Abroad!" #ROM
 balkfm_romania.706.d: "With our support, [GetCulture('romanian').GetName] radicals in Transylvania have begun organizing civil demonstrations across the state in the hopes of furthering the cause against [SCOPE.sCountry('austria_scope').GetAdjectiveNoFlag] oppression."
 balkfm_romania.706.f: ""O! Holy Lord,\nOur Heavenly Father,\nExtend Your Hand\nOver the Romanian Country!""
 balkfm_romania.706.a: "We will not stop until [ROOT.GetCountry.GetName] is whole."
 balkfm_romania.707.t: "Romanian Agitation Against [ROOT.GetCountry.GetAdjective] Rule!" #AUS
 balkfm_romania.707.d: "[GetCulture('romanian').GetName] radicals in Transylvania have provoked demonstrations across the state. They demand equal rights for all slavs within [ROOT.GetCountry.GetName]."
 balkfm_romania.707.f: "While the situation on the streets is chaotic, initial suspicions have been directed at agitators from [SCOPE.sCountry('romania_scope').GetName]."
 balkfm_romania.707.a: "This is not civil behavior."
 balkfm_romania.708.t: "The Greater Romanian Lands"
 balkfm_romania.708.d: "With the unification of the Principalities under a single state, a greater plan has come into vision: the unification of all [GetCulture('romanian').GetName] lands in #yellow Danubia#!."
 balkfm_romania.708.f: ""The only future for [ROOT.GetCountry.GetName] is one where our entire nation is free and whole.""
 balkfm_romania.708.a: "These lands are rightfully ours."
 balkfm_romania.709.t: "The Reunification of Romania"
 balkfm_romania.709.d: "From the Dniester to the Tisza, the dream of a whole and independent [ROOT.GetCountry.GetName] has been made reality."
 balkfm_romania.709.f: ""Romanians!\n\nThe war which for the last two years has been encircling our frontiers more and more closely has shaken the ancient foundations of Europe to their depths.\n\nIt has brought the day which has been awaited for centuries by the national conscience, by the founders of the Romanian State, by those who united the principalities in the war of independence, by those responsible for the national renaissance.\n\nIt is the day of the union of all branches of our nation. Today we are able to complete the task of our forefathers and to establish forever that which Michael the Great was only able to establish for a moment, namely, a Romanian union on both slopes of the Carpathians...." \n-Proclamation by King Ferdinand, 28 August 1916"
 balkfm_romania.709.a: "This is a wonderous day for [ROOT.GetCountry.GetName]!"

 balkfm_romania.710.t: "[SCOPE.sCountry('transylvania_scope').GetName] Take Up Arms!" # Provocateur Event
 balkfm_romania.710.d: "With our support, [GetCulture('Romanian').GetName] radicals in [SCOPE.sCountry('transylvania_scope').GetCapital.GetName] have seized control of the regional palace and declared the independence of [SCOPE.sCountry('transylvania_scope').GetName]. They have issued a call for international aid and recognition."
 balkfm_romania.710.f: "While Transylvanian rebels have ejected the Austrian governors, they will desperately need international assistance if they are to stay safe from Austrian reprisal."
 balkfm_romania.710.a: "All Romanians deserve their freedom."
 balkfm_romania.711.t: "[SCOPE.sCountry('transylvania_scope').GetName] Take Up Arms!" # Target Event
 balkfm_romania.711.d: "[GetCulture('Romanian').GetName] radicals in [SCOPE.sCountry('transylvania_scope').GetCapital.GetName] have seized control of the regional palace and declared the independence of [SCOPE.sCountry('transylvania_scope').GetName]. They demand immediate recognition by and independence from the [ROOT.GetCountry.GetAdjectiveNoFlag] administration."
 balkfm_romania.711.f: "While we may not have immediate proof, our intelligence service reports that [SCOPE.sCountry('romanian').GetName] is directly responsible for funding and organizing this rebellion."
 balkfm_romania.711.a: "Put them down!"
 balkfm_romania.711.b: "Grant them autonomy."

 balkfm_romania.720.t: "The Imperial Standard"
 balkfm_romania.720.d: "As the [GetCulture('romanian').GetName] people begin to understand themselves as a singular nation, many have begun to question [ROOT.GetCountry.GetName]'s role within the political landscape of Eastern Europe. With nationalism cementing itself among the populace, irredentist movers have declared that we are the only true successors to the #yellow Roman Empire#!."
 balkfm_romania.720.f: ""We have secured our independence from our Greek, $RUS_ADJ$, and Ottoman oppressors. Now we we must decide what our position will be within the fabric of the Balkan community.""
 balkfm_romania.720.a: "We will reclaim the Imperial Throne!"
 balkfm_romania.720.b: "The Empire is dead. We should leave it as such."
 balkfm_romania.721.t: "The Queen of Cities"
 balkfm_romania.721.d: "With the conquest of lands across the Bosphorus and the Dardanelles, the ancient imperial capital of Constantinople now lies within our control. The once-illusory dreams of reforging the Byzantine Empire have come to fruition. Our citizens now look to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to lead them into a new era."
 balkfm_romania.721.f: "The ancient imperial capital of Constantinople now lies within our control. None can question the legitimacy of our claim to the Byzantine throne."
 balkfm_romania.721.a: "Our armies will raise the Imperial standard once more!"

 balkfm_romania.790.t: "The Romanian Declaration of Union"
 balkfm_romania.790.d: "[SCOPE.sCountry('romania_unifier').GetName] has proclaimed itself the unifier of Romania, and is seeking to establish a union over the other Romanian principalities in the region."
 balkfm_romania.790.f: ""We proclaim ourselves to be the true representatives of the nation, the heirs of a rich land and vibrant history. This fulfillment of a holy desire will see us blessed by posterity, and we will brook no resistance from any other state—this is our land, and this is our destiny.""
 balkfm_romania.790.a: "We welcome this union and will honor our agreements with [SCOPE.sCountry('romania_unifier').GetName]."
 balkfm_romania.790.b: "We did not approve of this! [SCOPE.sCountry('romania_unifier').GetName] must be condemned for its actions."
 balkfm_romania.791.t: "The South Bessarabian Retrocession"
 balkfm_romania.791.d: "Backed by a great power, [SCOPE.sCountry('romanian_bessarabia_receiver').GetName] has requested a sliver of territory in [SCOPE.sState('south_bessarabia_cession').GetName]—a territory previously ruled by Moldavia—to grant it access to the Black Sea. Envoys have informed us that we would enjoy the thanks of a grateful Romanian nation if we agreed to this request."
 balkfm_romania.791.f: ""What sort of state would we be without access to the sea? Cahul, Bolgrad, and Ismail would do much for our prosperity and for your posterity.""
 balkfm_romania.791.a: "Ceding [SCOPE.sState('south_bessarabia_cession').GetName] is something we can afford to do."
 balkfm_romania.791.b: "[SCOPE.sState('south_bessarabia_cession').GetName] is and will remain ours, not theirs!"