l_french:
 balkfm_romania.001.t: "The Regulamentul Organic"
 balkfm_romania.001.d: "In the wake of their pseudo-independence from the [SCOPE.sCountry('ottoman_scope').GetName], both [SCOPE.sCountry('moldavia_scope').GetName] and [SCOPE.sCountry('wallachia_scope').GetName] suffered from political instability that culminated in famine and plague. To restore order to the Principalities and to build the foundation of a modern state, [SCOPE.sCountry('russia_scope').GetName] imposed the #italic Regulamentul Organic#! on the states in the hopes of beginning the process of Westernization."
 balkfm_romania.001.f: "The #italic Regulamentul#! forms the first constitutional document in the Principalities. Recognizing the threat of their stagnation compared to the West, the $RUS_ADJ$ state has advocated for a system of gradual modernization in [ROOT.GetCountry.GetNameNoFlag]."
 balkfm_romania.001.a: "These are lofty aspirations."
 balkfm_romania.001.tt: "Complete #bold Ottoman Legacy#! [Concept('concept_journal_entry','$concept_journal_entries$')] to advance the progress bar"
 balkfm_romania.002.t: ""
 balkfm_romania.002.d: ""
 balkfm_romania.002.f: ""
 balkfm_romania.002.a: ""
 balkfm_romania.003.t: ""
 balkfm_romania.003.d: ""
 balkfm_romania.003.f: ""
 balkfm_romania.003.a: ""
 balkfm_romania.004.t: "Electing a Hospodar"
 balkfm_romania.004.d: "[ROOT.GetCountry.GetRuler.GetFullName]'s tenure as Hospodar of [ROOT.GetCountry.GetName] has expired. In compliance with the #italic Regulamentul Organic#! and the terms of the Akkerman Convention, elections have begun for a new Hospodar."
 balkfm_romania.004.f: "In many ways, the Hospodar elections are an evolution of the boyar system, with lords typically electing one of their own to "rule" [ROOT.GetCountry.GetNameNoFormatting]."
 balkfm_romania.004.a: "[SCOPE.sCharacter('balkfm_hospodar_candidate_1').GetFullName] should retain the title."
 balkfm_romania.004.b: "[SCOPE.sCharacter('balkfm_hospodar_candidate_2').GetFullName] seems well qualified."
 balkfm_romania.004.c: "[SCOPE.sCharacter('balkfm_hospodar_candidate_3').GetFullName] may be the strongest choice."
 balkfm_romania.005.t: "Electing a Hospodar"
 balkfm_romania.005.d: "[ROOT.GetCountry.GetRuler.GetFullName]'s tenure as Hospodar of [ROOT.GetCountry.GetName] has expired. In compliance with the#italic  Regulamentul Organic#! and the terms of the Akkerman Convention, elections have begun for a new Hospodar."
 balkfm_romania.005.f: "In many ways, the Hospodar elections are an evolution of the boyar system, with lords typically electing one of their own to "rule" [ROOT.GetCountry.GetNameNoFormatting]."
 balkfm_romania.005.a: "[SCOPE.sCharacter('balkfm_hospodar_candidate_1').GetFullName] should retain the title."
 balkfm_romania.005.b: "[SCOPE.sCharacter('balkfm_hospodar_candidate_2').GetFullName] seems well qualified."
 balkfm_romania.005.c: "[SCOPE.sCharacter('balkfm_hospodar_candidate_3').GetFullName] may be the strongest choice."
 balkfm_romania.006.t: "The Death of Feudalism"
 balkfm_romania.006.d: "Despite the prejudice and doubts of both benefactors and rivals alike, [ROOT.GetCountry.GetName] has succeeded in shedding the archaic institutions of our feudal overlords."
 balkfm_romania.006.f: "Both despite and in spite of our centuries of exploitation by the Ottoman state, today the [ROOT.GetCountry.GetAdjectiveNoFormatting] people stand ready to carve out their own future."
 balkfm_romania.006.a: "A glorious achievement for [ROOT.GetCountry.GetName]."
 balkfm_romania.007.t: "Absolutist Aspirations"
 balkfm_romania.007.d: "[ROOT.GetCountry.GetRuler.GetFullName] has pushed forward a set of constitutional reforms that would dramatically increase his control over the state."
 balkfm_romania.007.f: "Through the efforts of [ROOT.GetCountry.GetRuler.GetFullName], [ROOT.GetCountry.GetName] has been freed from Turkish servitude and achieved its unification. Yet, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has begun to press for increased central privileges that would transform the nation into an absolutist state legitimized by an empowered pesantry."
 balkfm_romania.007.a: "We should support his efforts."
 balkfm_romania.007.b: "He is a reckless tyrant."
 balkfm_romania.008.t: "Mandate Secured"
 balkfm_romania.008.d: "In a show of statesmanship befitting the unifier of Romania, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has secured his grasp on authoritarian rule over [ROOT.GetCountry.GetName]."
 balkfm_romania.008.f: "With the backing of the peasantry, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] stands poised to lead the [ROOT.GetCountry.GetAdjectiveNoFormatting] state into a resurgent future. The tacit acceptance of his rule by both the #bold Porte#! and the European powers has only served to silence his detractors."
 balkfm_romania.008.a: "This is a great day for [ROOT.GetCountry.GetName]!"
 balkfm_romania.009.t: "A Monstrous Coalition"
 balkfm_romania.009.d: "In response to [ROOT.GetCountry.GetRuler.GetFullName]'s deranged plans for absolutist rule, a band of politicians have joined in opposing his rule. Termed the #bold Monstrous Coalition#! by the press, they have rallied the army to out the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] from the throne.\n\n The Coalition has appealed to the Great Powers for their approval in selecting a new [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 balkfm_romania.009.f: "Through his arrogance, [ROOT.GetCountry.GetRuler.GetFirstName] has managed to unite the conservative landowners and liberal business in their opposition to absolutism."
 balkfm_romania.009.a: "Prince Hohenzollern is an accceptable choice."
 balkfm_romania.009.a.tt: "#yellow Carol Hohenzollern#! becomes ruler."
 balkfm_romania.009.b: "The noble prince, Philippe de Flandre, is a fine choice."
 balkfm_romania.009.b.tt: "#yellow Philippe de Flandre#! becomes ruler."

 balkfm_romania.100.t: "The Lands of Stephen the Great"
 balkfm_romania.100.d: "Following centuries of domination by the [SCOPE.sCountry('ottoman_scope').GetName], the Treaty of Adrianople established both the Principalities of [SCOPE.sCountry('moldavia_scope').GetName] and [SCOPE.sCountry('wallachia_scope').GetName] as nominal subjects of the Porte.\n\nSupported by the diplomatic designs of [SCOPE.sCountry('russia_scope').GetName], the Principalities have struggled to find their footing, held back by their feudal pasts."
 balkfm_romania.100.f: "[ROOT.GetCountry.GetNameNoFlag] has suffered from both warfare and stagnation under Turkish rule following centuries of conflict over ownership of the mouths of the Danube and Dniester rivers, yet many are hopeful of a future free from complete servitude."
 balkfm_romania.100.a: "[ROOT.GetCountry.GetName] will find its way."
 balkfm_romania.101.t: "The Petition-Proclamation"
 balkfm_romania.101.d: "Disaffection has been mounting against the rather arbitrary nature of the position of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Riding the tide of liberalism and nationalism spreading across Europe, prominent intellectuals, lead by [SCOPE.sCharacter('balkfm_alecsandri_scope').GetFullName] have demanded tangible guardrails against abuses by the Hospodar."
 balkfm_romania.101.f: "Composed of a joint effort between the great boyars and western-educated intellectuals, the revolutionaries hope to establish a moderate liberal foundation in [ROOT.GetCountry.GetNameNoFormatting] without a complete overthrow of the #italic Regulamentul#! system."
 balkfm_romania.101.a: "The state will not bow to troublemakers."
 balkfm_romania.101.b: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must listen to the people."
 balkfm_romania.102.t: "The Moldavian Revolutionary Committee"
 balkfm_romania.102.d: "Prominent intellectual, [SCOPE.sCharacter('balkfm_kogalniceanu_scope').GetFullName], has gathered fellow radicals to make demands of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]. Calling themselves #italic The Moldavian Revolutionary Committee#!, they have presented a draft constitution that would transfer the majority of state functions to the legislature."
 balkfm_romania.102.f: "Fears of radicalism in [ROOT.GetCountry.GetName] have yet to find validation, as the Committee has held back from demanding the abolition of the #italic Regulamentul#! system. $RUS_ADJ$ and Ottoman delegated have voiced concerns that these reforms might blow open the doors to further radicalization along the Danube."
 balkfm_romania.102.a: "We must find a compromise."
 balkfm_romania.103.t: "Kogălniceanu's Revolution"
 balkfm_romania.103.d: "Support for [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has collapsed. Caving to the demands of the #italic Revolutionary Committee#!, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has signed off on their demands for liberalization and abdicated his position."
 balkfm_romania.103.f: "In the place of the disgraced [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], liberal politician [SCOPE.sCharacter('balkfm_kogalniceanu_scope').GetFullName] has taken the reigns of the government and promises to lead reforms in [ROOT.GetCountry.GetName]."
 balkfm_romania.103.a: "So be it."
 balkfm_romania.104.t: "The Convention of Balta Liman"
 balkfm_romania.104.d: "With the threat of revolution suppressed, a joint [SCOPE.sCountry('russia_scope').GetAdjective]-[SCOPE.sCountry('ottoman_scope').GetAdjective] delegation has confirmed the status quo of their joint oversight over the Romanian Principalities."
 balkfm_romania.104.f: "Despite a mutual desire to see the Principalities modernize, their overlords seek to restrain their independence within tight bounds."
 balkfm_romania.104.a: "So be it."
 balkfm_romania.105.t: "Constitutional Stalemate"
 balkfm_romania.105.d: "The liberalist movement sweeping [ROOT.GetCountry.GetName] has failed to gain significant traction. With their objectives incomplete and the threat of a joint [SCOPE.sCountry('russia_scope').GetAdjective]-[SCOPE.sCountry('ottoman_scope').GetAdjective] intervention, the #italic Revolutionary Committee#! has disbanded."
 balkfm_romania.105.f: "Despite a mutual desire to see the Principalities modernize, their overlords seek to restrain their independence within tight bounds."
 balkfm_romania.105.a: "So be it."
 balkfm_romania.106.t: "$RUS_ADJ$ Troops Enter Moldavia"
 balkfm_romania.106.d: "Following pleas from [SCOPE.sCountry('moldavia_scope').GetRuler.GetFullName], [SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('russia_scope').GetRuler.GetFullName] has sent troops into [SCOPE.sCountry('moldavia_scope').GetName] to suppress the #italic Revolutionary Committee#!."
 balkfm_romania.106.f: "Overstepping the suzerainty of the [SCOPE.sCountry('ottoman_scope').GetName], the $RUS_ADJ$ foreign service has elected to take no risks in losing the Principalities to the tide of liberalism and has deployed forces across the Dniester."
 balkfm_romania.106.a: "We will have order!"
 balkfm_romania.106.b: "We cannot tolerate this offense!"
 balkfm_romania.106.tt: "This will provide drastic support for the Prince."

 balkfm_romania.200.t: "The Land Beyond the Snowy Mountains"
 balkfm_romania.200.d: "Following centuries of domination by the [SCOPE.sCountry('ottoman_scope').GetName], the Treaty of Adrianople established both the Principalities of [SCOPE.sCountry('moldavia_scope').GetName] and [SCOPE.sCountry('wallachia_scope').GetName] as nominal subjects of the Porte.\n\nSupported by the diplomatic designs of [SCOPE.sCountry('russia_scope').GetName], the Principalities have struggled to find their footing, held back by their feudal pasts."
 balkfm_romania.200.f: "[ROOT.GetCountry.GetNameNoFlag] has suffered from both warfare and stagnation under Turkish rule following centuries of conflict over ownership of the mouths of the Danube and Dniester rivers, yet many are hopeful of a future free from complete servitude."
 balkfm_romania.200.a: "[ROOT.GetCountry.GetName] will find its way."
 balkfm_romania.201.t: "Proclamation of Islaz"
 balkfm_romania.201.d: "Prominent intellectual, [SCOPE.sCharacter('balkfm_balcescu_scope').GetFullName], has gathered fellow radicals to make demands of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]. Calling themselves the #italic The Brotherhood#!, they have presented a list of demands that would dramatically increase voting rights and transfer the majority of state functions to the legislature."
 balkfm_romania.201.f: "Fears of radicalism in [ROOT.GetCountry.GetName] have yet to find validation, as the Brotherhood has held back from openly demanding the abolition of the #italic Regulamentul#! system. $RUS_ADJ$ and Ottoman delegated have voiced concerns that these reforms might blow open the doors to further radicalization along the Danube."
 balkfm_romania.201.a: "[ROOT.GetCountry.GetName] must follow the will of the people."
 balkfm_romania.201.b: "Silence these anarchists."
 balkfm_romania.202.t: "The Wallachian Brotherhood"
 balkfm_romania.202.d: "Embracing the tide of radicalism surging across Europe, [SCOPE.sCharacter('balkfm_balcescu_scope').GetFullName] has presented [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] with a series of demands that would strip away any semblance of traditional authority in [ROOT.GetCountry.GetName]."
 balkfm_romania.202.f: "Unlike their compatriots in [SCOPE.sCountry('moldavia_scope').GetName], the #italic Brotherhood#! has charged forward with radicalist demands, seeking Romanian unification and the abolition of the #italic Regulamentul#! system."
 balkfm_romania.202.a: "We must find a compromise"
 balkfm_romania.203.t: "The Sword of the Revolution"
 balkfm_romania.203.d: "Support for [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has collapsed. Caving to the demands of the #italic Revolutionary Committee#!, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has signed off on their demands for liberalization and abdicated his position."
 balkfm_romania.203.f: "In the place of the disgraced [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], liberal politician [SCOPE.sCharacter('balkfm_balcescu_scope').GetFullName] has taken the reigns of the government and promises to lead reforms in [ROOT.GetCountry.GetName]"
 balkfm_romania.203.a: "So be it."
