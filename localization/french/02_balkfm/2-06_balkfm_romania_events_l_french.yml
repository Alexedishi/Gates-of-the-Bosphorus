 balkfm_romania.205.f: "Despite a mutual desire to see the Principalities modernize, their overlords seek to restrain their independence within tight bounds."
 balkfm_romania.205.a: "So be it."
 balkfm_romania.206.t: "$RUS_ADJ$ Troops Enter Wallachia"
 balkfm_romania.206.d: "Following pleas from [SCOPE.sCountry('wallachia_scope').GetRuler.GetFullName], [SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('russia_scope').GetRuler.GetFullName] has sent troops into [SCOPE.sCountry('wallachia_scope').GetName] to suppress the #italic Revolutionary Committee#!."
