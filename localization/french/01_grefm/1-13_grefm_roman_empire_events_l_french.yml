l_french:
 grefm_roman_empire.001.t: "The Phoenix Rises"
 grefm_roman_empire.001.d: "Church bells ring and people cheer as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] declares the rebirth of the [ROOT.GetCountry.GetName]. Beneath the imposing presence of the [SCOPE.sBuilding('hagia_sofia_scope').GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been adorned with reconstructions of the old sigils and regalia of the Eastern Roman emperors. Stepping forward towards the array of citizens, dignitaries, and clergy, [ROOT.GetCountry.GetRuler.GetFirstName] stands as a beacon for the future of the Greek people."
 grefm_roman_empire.001.f: "Where countless attempts failed over the centuries since the losses of Rome and Constantinople, the Empire stands resurgent today. However, much work remains: numerous Greeks are ruled by heretics and heathens, formerly Roman lands remain within the grasp of foreign pretenders, and countless Byzantine treasures are kept hostage abroad. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must be sure to live up to the expectations of [ROOT.GetCountry.GetRuler.GetHerHis] subjects if [ROOT.GetCountry.GetRuler.GetSheHe] is to bring glory to [ROOT.GetCountry.GetName]."
 grefm_roman_empire.001.a: "From the ashes, we rise."
 grefm_roman_empire.001.b: "It is time to focus on our own prosperity."
 grefm_roman_empire.002.t: "The Eternal City"
 grefm_roman_empire.002.d: "Our efforts have borne fruit with the rebirth of the [ROOT.GetCountry.GetName]. Now several voices call for the restoration of [ROOT.GetCountry.GetAdjectiveNoFormatting] power and prestige with the return of Rome, the Eternal City, to Greek hands. It falls to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to determine the future of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state."
 grefm_roman_empire.002.f: ""The Kingdom of Greece is not Greece; it is merely a part: the smallest, poorest part of Greece. The Greek is not only he who inhabits the Kingdom, but also he who inhabits Ioannina, Salonika or Serres or Adrianople or Constantinople or Trebizond or Crete or Samos or any other region belonging to the Greek history or the Greek race... There are two great centres of Hellenism. Athens is the capital of the Kingdom. Constantinople is the great capital, the dream and hope of all Greeks." -I. Kolettis, 1844"
 grefm_roman_empire.002.a: "We will restore the glory of the [ROOT.GetCountry.GetName]."
 grefm_roman_empire.002.b: "This goal is unreasonable."
 grefm_roman_empire.009.t: "Renovatio Imperii Romanorum"
 grefm_roman_empire.009.d: "As Imperial forces march through the Eternal City, our dream of restoring the Roman Empire has come a conclusion. For the first time in over a millennium, Rome, the Eternal City and the Foremost Seat in the Pentarchy, has been returned to the Empire. From the shores of the Bosporus to the mighty Tiber, the lands ancient Rome have been reunited under one banner."
 grefm_roman_empire.009.f: "The city of Rome was the seat of one of the greatest Empires to dominate Europe. For centuries it has languished in the hands of Lombardic and Gallic pretenders. Today the crown jewel and beating heart of the Empire has been reclaimed from the barbarian masses! Hail to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]! Glory to the [ROOT.GetCountry.GetName]!"
 grefm_roman_empire.009.a: "Rome shall shine once more!"
 grefm_roman_empire.009.b: "Constantinople is the New Rome!"