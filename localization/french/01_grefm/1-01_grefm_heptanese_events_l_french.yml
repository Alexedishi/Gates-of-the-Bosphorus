l_french:
 grefm_heptanese.001.t: "The Republic of the Seven Islands"
 grefm_heptanese.001.d: "Hugging the coast of Roumeli and the Peloponnese are the many islands of the [ROOT.GetCountry.GetName]. Captured by the $FRA_ADJ$ over 50 years ago, the Heptanese are now under colonial administration as part of the [ROOT.GetCountry.GetPowerBloc.GetName]. Under their rule, the islands have begun to step into the industrial age, yet the people dream of the day they will be united with the #bold Greek state#!."
 grefm_heptanese.001.f: "Greek presence in the Heptanese dates back further than written records in Ancient Greece, with many ascribing mythical status to the islands. Following their capture by Venice in the early 13th century, the islands were spared conquest by the Ottomans, but have found themselves saddled with a rural and agricultural society with both outdated norms and industry."
 grefm_heptanese.001.a: "The [ROOT.GetCountry.GetName] will find their way."
 grefm_heptanese.002.t: "The Ionian Jewel"
 grefm_heptanese.002.d: "The [ROOT.GetCountry.GetName] are nothing like the rest of the [SCOPE.sCountry('ionian_overlord').GetAdjective] Empire, yet for everything the small country lacks in resources or commodities, it has established itself as a beacon for good governance and serves as an inspiration for what can be achieved by a fusion of Western ideals with those of the Greek people."
 grefm_heptanese.002.f: "Political leaders have seized on the success of the pseudo-colonial system in the [ROOT.GetCountry.GetName] hailing the development of the Islands as proof of the [ROOT.GetCountry.GetPowerBloc.GetName]'s colonial mandate. From Corfu to London, the press has gone as far as labeling the islands a "jewel in the imperial crown.""
 grefm_heptanese.002.a: "This is a great achievement for the [ROOT.GetCountry.GetName]"
 grefm_heptanese.003.t: "Modernized Agriculture"
 grefm_heptanese.003.d: "Our efforts to reorganize the agricultural systems of the [ROOT.GetCountry.GetName] have come to fruition. As the people become used to the modern way of farming, many wonder why they ever clung to the old ways in the first place."
 grefm_heptanese.003.f: "Every year, the productivity of the various $GBR_ADJ$ colonies are compiled into "blue books" for presentation to Parliament. For the first time, the Heptanese book contains a simple statement: "Agribusiness - Profitable.""
 grefm_heptanese.003.a: "Excellent news."
 grefm_heptanese.004.t: "A Civilized State"
 grefm_heptanese.004.d: "Since the collapse of Venetian rule in the islands, many cities, including Corfu have been swamped with vagrants and orphans, all victims of the collapse of connections to the European system. With the development of social nets and poorhouses, poverty is no longer the death sentence it once was."
 grefm_heptanese.004.f: "In extending compassion to the weakest of its society, the [ROOT.GetCountry.GetName] have broken the mould to give an appearance of civilization in the East."
 grefm_heptanese.004.a: "Justly done."
 grefm_heptanese.005.t: "The Ionian Academy"
 grefm_heptanese.005.d: "Original established in Ithaca, the #yellow Ionian Academy#! has operated in Corfu since the Greek War of Independence. With a recent change in leadership at the university, the new president has requested additional funding to open a new School of Civil Engineering."
 grefm_heptanese.005.f: "The Ionian Academy represents the first western-style university to operate within Greek lands. It operated until 1864, when it's staff were relocated to support the University of Athens."
 grefm_heptanese.005.a: "This is an excellent initiative."
 grefm_heptanese.005.b: "Sounds like a waste of resources."

 grefm_heptanese.010.t: "The Romanyotim of the Heptanese"
 grefm_heptanese.010.d: "For centuries, the [ROOT.GetCountry.GetName] have played host to a vibrant #yellow Jewish#! community with many able to trace their ancestry back to the second temple era. While their rights have waxed and waned between Venetian and $FRA_ADJ$ rule, their condition has undoubtedly deteriorated under the [ROOT.GetCountry.GetPowerBloc.GetName]. With sanction from the outgoing administration in London, the colonial administration has excluded them from holding public office or from fair use of the court system."
 grefm_heptanese.010.f: "Judaism, while not outright discriminated in the law, is in effect relegated to second-class status, with the Ionian constitution, classifying all non-Orthodox, non-Catholic faiths was merely "tolerated." While the Jewish community has continued to exercise their tradition of petitioning the government for reform, these have fallen on deaf ears since the arrival of the $GBR_ADJ$."
 grefm_heptanese.010.a: "The state should take action."
 grefm_heptanese.011.t: "Jews Request former Rights"
 grefm_heptanese.011.d: "A modernizing agenda has begun to spread throughout the [ROOT.GetCountry.GetPowerBloc.GetName] as means to standardize legal systems across the Empire. As part of these reforms, the colonial administrator has issued a major rewrite of the court system of the [ROOT.GetCountry.GetName]. While expanding Greek access to the legal system, the new regulations have been crafted by local Greek authorities to continue the exclusion of the Jewry from the legal system."
 grefm_heptanese.011.f: "In stipulating the need to "profess the Christian faith," colonial administrators have ensured that the Jews of the Islands remain isolated from the functions of the state while keeping the laws palatable for their $GBR_ADJ$ overseers."
 grefm_heptanese.011.a: "There's nothing to be done."
 grefm_heptanese.011.b: "We must protest this injustice!"
 grefm_heptanese.012.t: "Nacamulli's Press House"
 grefm_heptanese.012.d: "Giuseppe Nacamulli, a member of the Jewish community, has opened the first true press house in the [ROOT.GetCountry.GetName]. As a means of advocating for Jewish rights, he has begun publishing a journal, "Israilitika Chronika," which has harshly criticized the status of Jews under the colonial administration. This has served to drag the private process of seeking redress for discrimination out into the open for the citizenry to see."
 grefm_heptanese.012.f: ""Only one number of this journal has appeared and although there is nothing in it which would offend the most sensitive Christian opposers of them and their religion, still a Jewish newspaper was a novelty displeasing to the ignorant and narrow minded amongst the Greek Christians." -Lord High Commissioner Henry Storks"
 grefm_heptanese.012.a: "They should be allowed to speak."
 grefm_heptanese.012.b: "Shut down the press."
 grefm_heptanese.013.t: "Blood Libel"
 grefm_heptanese.013.d: "Incensed at the increasing prominence of Jews on the islands, [GetReligion('orthodox').GetName] radicals have spread vile rumors regarding the Jews in [ROOT.GetCountry.GetCapital.GetCityHubName] leads to mobs gathering to harass the Jewish quarter."
 grefm_heptanese.013.f: ""The people of these states are ignorant and prejudiced.... the tenets of the Greek Church are selfish and illiberal.... other Christian religions, particularly the Roman Catholic, are looked upon as heresies of a formidable nature and the Turks and Jews are considered as out of the pale of humanity.”" -Lord High Commissioner Henry Storks"
 grefm_heptanese.013.a: "Break up the mob."
 grefm_heptanese.013.b: "This sounds like a private affair."
 grefm_heptanese.014.t: "Unrest in Corfu"
 grefm_heptanese.014.d: "[GetReligion('orthodox').GetName] rioters have attacked the [GetCulture('romanyotim').GetName] quarter in [ROOT.GetCountry.GetCapital.GetCityHubName]. While local security forces have put down the riot, many have have killed or injured."
 grefm_heptanese.014.f: ""From that moment on, those who had the most to gain by stirring the whole city against the Jewish element, shouted that the murdered girl was Christian, that her blood was drawn by the Jews, to be used for their Mazot, without which they could not celebrate Easter, that the judges and prosecutors and all military authorities were bribed to take care of the Jews, setting the murderers free for the sake of future elections." -T. Kefalas, prosecutor, 1891"
 grefm_heptanese.014.a: "Arrest those responsible for this madness!"
 grefm_heptanese.014.b: "There's nothing to be done.

 grefm_heptanese.018.t: "Jewish Exclusion"
 grefm_heptanese.018.d: "Despite concerted efforts by the [GetCulture('romanyotim').GetName] community to gain legal recognition, leaders have been forced to acknowledge that these efforts are dead in the water."
 grefm_heptanese.018.f: "In keeping with $GBR_ADJ$ sentiment, the Heptanese government has zig-zagged granting legal rights to the Jewry while not outright criminalizing their religious practices.
 grefm_heptanese.018.a: "A shameful outcome, really."
 grefm_heptanese.019.t: "A Judaeo-Greek Nation"
 grefm_heptanese.019.d: "With the abolition of the last targeted laws against the Jewry, social leaders have advocated for the expansion of citizenship and full political rights to the Jews of the Islands."
 grefm_heptanese.019.f: "In raising the Jews from their second-class status, the state has brought a new question to light: if the [GetCulture('romanyotim').GetName] are so interwoven with the $grefm_greek$ community of the [ROOT.GetCountry.GetName], then why should they not be recognized as an essential part of the country?"
 grefm_heptanese.019.a: "They are an inseparable part of our heritage."
 grefm_heptanese.019.b: "We have done enough for them."

 grefm_heptanese.020.t: "The Dream of Enosis"
 grefm_heptanese.020.d: "The [ROOT.GetCountry.GetName] are unquestioningly part of the greater Greek community. Despite centuries of political separation from the mainland, casual travel and trade between the two regions has continued unabated. With the Independence of the Greek state, the many of our citizens have argued that the time is ripe for the reunification of the islands with their mainland relatives."
 grefm_heptanese.020.f: "With every change of hands, the Islanders' dreams of union with the mainland have seemed just out of arm's reach, yet every [concept_great_power] to hold the islands has discovered the value of holding lands so near to the east."
 grefm_heptanese.020.a: "Enosis is inevitable."
 grefm_heptanese.021.t: "Ionian Union with the Greek State"
 grefm_heptanese.021.d: "Decades of agitation and demands have culminated in the unification of the [SCOPE.sState('ionian_islands_state_scope').GetName] with [ROOT.GetCountry.GetName]. In a simple, but polite, ceremony in [SCOPE.sState('ionian_islands_state_scope').GetCityHubName], the [SCOPE.sCountry('uk_scope').GetAdjective] flag has been lowered and replaced with that of the Greek state."
 grefm_heptanese.021.f: ""They were good people, but now we are free!""
 grefm_heptanese.021.a: "This is a great day for [ROOT.GetCountry.GetName]."
 grefm_heptanese.022.t: "Moisis Caimis Supports Dimotikí"
