l_english:
 law_imperial_divan: "Imperial Divan"
 law_imperial_divan_desc: "The Head of State's power is absolute and they are held accountable to no earthly power."
 law_ministerial_council: "Ministerial Council"
 law_ministerial_council_desc: "The Head of State shares power and responsibility with a small group of powerful, unelected individuals."
 law_scribal_bureaucrats: "Scribal Bureaucrats"
 law_scribal_bureaucrats_desc: "The Scribal class controls the administration of the state. Rampant nepotism and corruption has resulted in a bloated and byzantine apparatus incapable of effective action."

 law_gbbf_palace_service: "Palace Service"
 law_gbbf_palace_service_desc: "The imperial center provides a decentralized intelligence apparatus that gathers information from the millets and eyalets of the empire and filters it through layers of bloated administration."
 law_gbbf_teshkilat: "Teşkilat"
 law_gbbf_teshkilat_desc: "The state maintains a palace-based intelligence agency tasked with identifying forces acting both for and against the state."
 
 law_gbbf_beylerbeylik_policing: "Beylerbeylik Policing"
 law_gbbf_beylerbeylik_policing_desc: "Local security is delegated the governor-generals of the imperial provinces."