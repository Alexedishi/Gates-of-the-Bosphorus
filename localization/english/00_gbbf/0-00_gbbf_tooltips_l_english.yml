l_english:
 gbbf_no_effects: "#italic No immediate effects#!..."
 gbbf_nothing_happens: "#italic Nothing happens#!..."

 gbbf_armed_forces: "[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]"
 gbbf_devout: "[GetInterestGroupVariant('ig_devout',GetPlayer).GetName]"
 gbbf_industrialists: "[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]"
 gbbf_intelligentsia: "[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]"
 gbbf_landowners: "[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]"
 gbbf_petty_bourgeoisie: "[GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetName]"
 gbbf_rural_folk: "[GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetName]"
 gbbf_trade_unions: "[GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName]"

 gbbf_checkbox_green: "@green_checkmark_box!"
 gbbf_checkbox_empty: "@simple_box!"
 
 gbbf_fully_owns: "#tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_fully_owns_desc')] Fully Owns#!#!"
 gbbf_fully_own: "#tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_fully_owns_desc')] Fully Own#!#!"
 gbbf_fully_owned: "#tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_fully_owns_desc')] Fully Owned#!#!"
 gbbf_fully_owning: "#tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_fully_owns_desc')] Fully Owning#!#!"
 gbbf_fully_owns_desc: "A #bold Fully Owned#! [concept_state_region] is one that completely controlled by a single [concept_country]."
 
 gbbf_control: "#tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_control_desc')] Control#!#!"
 gbbf_control_desc: "A [concept_country] controls a [concept_strategic_region] if it directly and $gbbf_fully_owns$ a majority of [Concept('concept_state_region','$concept_state_regions$')] in that strategic region. [Concept('concept_state','$concept_states$')] that are split between [Concept('concept_subject','$concept_subjects$')] and [Concept('concept_overlord','$concept_overlords$')] do not count towards this total."
 gbbf_controls: "#tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_control_desc')] Controls#!#!"
 gbbf_controlled: "#tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_control_desc')] Controlled#!#!"
 gbbf_controlling: "#tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_control_desc')] Controlling#!#!"

 gbbf_restrictiveness: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],gbbf_restrictiveness_desc Restrictiveness#!#"
 gbbf_restrictiveness_desc: "The #bold Restrictiveness#! of [GetLawGroup('lawgroup_citizenship').GetName] laws indicates how difficult it is for a resident to obtain citizenship within their [concept_country] of residence:\n • [GetLawType('law_subjecthood').GetName] #bold (Most Restrictive)#!\n • [GetLawType('law_ethnostate').GetName]\n • [GetLawType('law_national_supremacy').GetName]\n • [GetLawType('law_racial_segregation').GetName]\n • [GetLawType('law_cultural_exclusion').GetName] #bold (Least Restrictive)#!\n@information! [GetLawType('law_multicultural').GetName] has #bold no#! Restrictiveness."