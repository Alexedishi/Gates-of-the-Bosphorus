 ## Greece / Byzantium History
 gbbf_bio_macedon_alexandros: "@gbbf_character! #o #tooltip:[GetRawTextTooltipTag('gbbf_bio_macedon_alexandros_desc')] $Alexander$ the Great#!#!"
 gbbf_bio_macedon_alexandros_desc: "#bold $Alexander$ the Great#!$gbbf_linebreak_normal$Born c. #v July 356 BCE#! in Pella, Macedon\nDied c. #v June 323 BCE#! in Babylon, Macedonian Empire\n\n--"
 
 gbbf_bio_aristotles: "@gbbf_character! #o #tooltip:[GetRawTextTooltipTag('gbbf_bio_aristotles_desc')] $Aristotle$#!#!"
 gbbf_bio_aristotles_desc: "#bold $Aristotle$#!$gbbf_linebreak_normal$Born c. #v 384 BCE#! in Stagira, Chalkidiki\nDied c. #v 322 BCE#! in Chalcis, Euboea\n\n$Aristotle$ was an Ancient Greek philosopher "
 
 gbbf_bio_kapodistrias_ioannis: "@gbbf_character! #o #tooltip:[GetRawTextTooltipTag('gbbf_bio_kapodistrias_ioannis_desc')] $Ioannis$ $Kapodistrias$#!#!"
 gbbf_bio_kapodistrias_ioannis_desc: "#bold $Ioannis$ $Kapodistrias$#!$gbbf_linebreak_normal$Born on #v February 10th 1776#! in Corfu, Ionian Islands\nDied on #v September 21st 1831#! in Nafplion, Greece\n\n$Ioannis$ $Kapodistrias$ was the first head of state of the independent Greek state. With a long career ranging from a ministerial position in the Septinsular Republic to becoming Foreign Minister of Imperial Russia, $Kapodistrias$ was one of the most prominent diplomats of the early 19th century. His rule was marked by open contempt for tribal leaders and entrenched elites as he attempted to unity the young state.\nHis assassination in 1831 heralded six months of political chaos leading up to the appointment of $Otto$ $von_Wittelsbach$."

 gbbf_bio_pericles: "@gbbf_character! #o #tooltip:[GetRawTextTooltipTag('gbbf_bio_pericles_desc')] $Pericles$#!#!"
 gbbf_bio_pericles_desc: "#bold $Pericles$#!$gbbf_linebreak_normal$Born c. #v 495 BCE#! in Athens, Ancient Greece\nDied c. #v 429 BCE#! in Athens, Ancient Greece\n\n$Pericles$, nicknamed the \"the first citizen of Athens\", was an ancient Greek statesman and general from Ancient Athens that played a leading role in transforming Athens into an imperial power in the wake of the Persian wars.\nHis ambition and skills as an oration are held to have resulted in an era of Athenian dominance called the \"Age of Pericles\"."
 
 gbbf_theodosius_ii: "@gbbf_character! #o #tooltip:[GetRawTextTooltipTag('gbbf_theodosius_ii_desc')] $Theodosius$ II#!#!"
 gbbf_theodosius_ii_desc: "#bold $Theodosius$ II#!$gbbf_linebreak_normal$\nBorn on #v April 10th 401#! in Constantinople\nDied on #v July 28th 450#! in Constantinople\n\nBorn the only son of the Emperor Arcadius, $Theodosius$ was proclaimed \"co-Augustus\" by his father and groomed to rule Eastern Rome. His reign was marked by the construction of the Theodosian Walls and the first attempt to organize all known Roman laws, resulting in the Codex Theodosianus.\nOne of his most impactful actions was to convene the First Council of Ephesus which saw the priest Nestorius, and Monophysitism at large, condemned as heresy."

 gbbf_simeon_veliki: "@gbbf_character! #o #tooltip:[GetRawTextTooltipTag('gbbf_simeon_veliki_desc')] $Simeon$ I#!#!"
 gbbf_simeon_veliki_desc: "#bold $Simeon$ I#!$gbbf_linebreak_normal$Born c. #v 864#! in Bulgaria\nDied on #v May 27th 927#! in Preslav, Bulgarian Empire\n\n--"
 
 
