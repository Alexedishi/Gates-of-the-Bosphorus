 # Diplomatic Plays
 dp_gbbf_integrate_eyalet: "Integrate Eyalet"
 dp_gbbf_integrate_eyalet_tooltip: "#header Start a $dp_gbbf_integrate_eyalet$ [concept_diplomatic_play]#!$gbbf_delimiter_normal$$dp_gbbf_integrate_eyalet_desc$"
