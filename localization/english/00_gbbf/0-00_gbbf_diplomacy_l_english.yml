l_english:
 # Diplomatic Actions
 turkfm_accelerate_tensions: "Accelerate the $turkfm_balkan_situation$"
 turkfm_accelerate_tensions_desc: "A diplomatic operation to fund and organize separatists in the [GetStrategicRegion('region_balkans').GetName]."
 turkfm_accelerate_tensions_pact_desc: "$turkfm_accelerate_tensions_desc$"
 turkfm_accelerate_tensions_action_notification_name: "[INITIATOR_COUNTRY.GetName] Stoking $turkfm_balkan_situation$"
 turkfm_accelerate_tensions_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has begun a diplomatic operation to fund and organize separatists in the [GetStrategicRegion('region_balkans').GetName]."
 turkfm_accelerate_tensions_action_notification_third_party_name: "[INITIATOR_COUNTRY.GetName] Stoking $turkfm_balkan_situation$"
 turkfm_accelerate_tensions_action_notification_third_party_desc: "[INITIATOR_COUNTRY.GetName] has begun a diplomatic operation to fund and organize separatists in the [GetStrategicRegion('region_balkans').GetName]."
 turkfm_accelerate_tensions_action_propose_name: "Accelerate the $turkfm_balkan_situation$"
 turkfm_accelerate_tensions_action_break_name: "Cease Accelerating the $turkfm_balkan_situation$"
 turkfm_accelerate_tensions_action_notification_break_name: "Ceased Accelerating the $turkfm_balkan_situation$"
 turkfm_accelerate_tensions_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has stopped organizing separatists in the [GetStrategicRegion('region_balkans').GetName]."
 turkfm_accelerate_tensions_action_notification_third_party_break_name: "Ceased Accelerating the $turkfm_balkan_situation$"
 turkfm_accelerate_tensions_action_notification_third_party_break_desc: "[INITIATOR_COUNTRY.GetName] has stopped organizing separatists in the [GetStrategicRegion('region_balkans').GetName]"

 turkfm_decelerate_tensions: "Mitigate the $turkfm_balkan_situation$"
 turkfm_decelerate_tensions_desc: "A diplomatic operation to deconflict and mediate separatists in the [GetStrategicRegion('region_balkans').GetName]."
 turkfm_decelerate_tensions_pact_desc: "$turkfm_decelerate_tensions_desc$"
 turkfm_decelerate_tensions_action_notification_name: "[INITIATOR_COUNTRY.GetName] Mitigating the $turkfm_balkan_situation$"
 turkfm_decelerate_tensions_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has begun a diplomatic operation to deconflict and mediate separatists in the [GetStrategicRegion('region_balkans').GetName]."
 turkfm_decelerate_tensions_action_notification_third_party_name: "[INITIATOR_COUNTRY.GetName] Mitigating the $turkfm_balkan_situation$"
 turkfm_decelerate_tensions_action_notification_third_party_desc: "[INITIATOR_COUNTRY.GetName] has begun a diplomatic operation to deconflict and mediate separatists in the [GetStrategicRegion('region_balkans').GetName]."
 turkfm_decelerate_tensions_action_propose_name: "Mitigate the $turkfm_balkan_situation$"
 turkfm_decelerate_tensions_action_break_name: "Cease Mitigating the $turkfm_balkan_situation$"
 turkfm_decelerate_tensions_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] Ceases Mitigating the $turkfm_balkan_situation$"
 turkfm_decelerate_tensions_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has ceased deconflicting and mediating with separatists in the [GetStrategicRegion('region_balkans').GetName]."
 turkfm_decelerate_tensions_action_notification_third_party_break_name: "[INITIATOR_COUNTRY.GetName] Ceases Mitigating $turkfm_balkan_situation$"
 turkfm_decelerate_tensions_action_notification_third_party_break_desc: "[INITIATOR_COUNTRY.GetName] has ceased deconflicting and mediating with separatists in the [GetStrategicRegion('region_balkans').GetName]."

 turkfm_disloyal_subject: "Denounce the Suzerainty of the $turkfm_porte$"
 turkfm_disloyal_subject_desc: "The Ottoman Empire is in terminal decline. It is only reasonable that we make our own path to freedom."
 turkfm_disloyal_subject_pact_desc: "$turkfm_disloyal_subject_desc$"
 turkfm_disloyal_subject_action_name: "$turkfm_disloyal_subject$"
 turkfm_disloyal_subject_action_notification_name: "[INITIATOR_COUNTRY.GetName] Denounce the $turkfm_porte$"
 turkfm_disloyal_subject_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has emphatically rejected the suzerainty of the [TARGET_COUNTRY.GetName]."
 turkfm_disloyal_subject_action_propose_name: "[INITIATOR_COUNTRY.GetName] Denounces Our Suzerainty"
 turkfm_disloyal_subject_action_break_name: "Withdraw Denunciation of the $turkfm_porte$"
 turkfm_disloyal_subject_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] Withdraws Denunciation of the $turkfm_porte$"
 turkfm_disloyal_subject_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has withdrawn its denunciation of the $turkfm_porte$ [TARGET_COUNTRY.GetName]."
 turkfm_disloyal_subject_action_notification_third_party_name: "$turkfm_disloyal_subject_action_notification_name$"
 turkfm_disloyal_subject_action_notification_third_party_desc: "$turkfm_disloyal_subject_action_notification_desc$"
 turkfm_disloyal_subject_action_notification_third_party_break_name: "$turkfm_disloyal_subject_action_notification_break_name$"
 turkfm_disloyal_subject_action_notification_third_party_break_desc: "$turkfm_disloyal_subject_action_notification_break_desc$"

 turkfm_loyal_subject: "Declare Fealty to the $turkfm_porte$"
 turkfm_loyal_subject_desc: "The Ottoman Empire has endured for centuries, it is only reasonable to support the Empire in its rebirth as loyal vassals of the Sultan."
 turkfm_loyal_subject_pact_desc: "$turkfm_loyal_subject_desc$"
 turkfm_loyal_subject_action_name: "$turkfm_loyal_subject$"
 turkfm_loyal_subject_action_notification_name: "[INITIATOR_COUNTRY.GetName] Declares Fealty to the $turkfm_porte$"
 turkfm_loyal_subject_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has declared its unyielding loyalty to the $turkfm_sublime_porte$ and the Sultan's court."
 turkfm_loyal_subject_action_propose_name: "[INITIATOR_COUNTRY.GetName]"
 turkfm_loyal_subject_action_break_name: "Withdraw Fealty to the $turkfm_porte$"
 turkfm_loyal_subject_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] Withdraws Fealty to the $turkfm_porte$"
 turkfm_loyal_subject_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has withdrawn its declaration of loyalty to the $turkfm_sublime_porte$ and the Sultan's court."
 turkfm_loyal_subject_action_notification_third_party_name: "$turkfm_loyal_subject_action_notification_name$"
 turkfm_loyal_subject_action_notification_third_party_desc: "$turkfm_loyal_subject_action_notification_desc$"
 turkfm_loyal_subject_action_notification_third_party_break_name: "$turkfm_loyal_subject_action_notification_break_name$"
 turkfm_loyal_subject_action_notification_third_party_break_desc: "$turkfm_loyal_subject_action_notification_break_desc$"
 
 # Diplomatic Subject Actions
 turkfm_subject_eyalet: "Eyalet"
 turkfm_subject_eyalet_desc: "The #bold Eyalets#!, also called #italic Beylerbeyliks#! or #italic Pashaliks#!, are the primary administrative divisions of the Ottoman Empire."
 turkfm_subject_eyalet_pact_desc: "$turkfm_subject_eyalet_desc$"
 turkfm_subject_eyalet_action_name: "[concept_eyalet]"
 turkfm_subject_eyalet_action_notification_name: "[INITIATOR_COUNTRY.GetName] Creates [concept_eyalet]"
 turkfm_subject_eyalet_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has created an [concept_eyalet] administration in [TARGET_COUNTRY.GetName]."
 turkfm_subject_eyalet_action_propose_name: "[INITIATOR_COUNTRY.GetName] Requests [concept_eyalet]"
 turkfm_subject_eyalet_action_break_name: "Abandon [concept_eyalet]"
 turkfm_subject_eyalet_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] Loses [concept_eyalet]"
 turkfm_subject_eyalet_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has abandoned its [concept_eyalet] in [TARGET_COUNTRY.GetName]."

 turkfm_subject_beylik: "Beylik"
 turkfm_subject_beylik_desc: "#bold Beylik#! is the name ascribed to a principality or petty kingdom ruled by a Bey."
 turkfm_subject_beylik_pact_desc: "$turkfm_subject_beylik_desc$"
 turkfm_subject_beylik_action_name: "[concept_beylik]"
 turkfm_subject_beylik_action_notification_name: "[INITIATOR_COUNTRY.GetName] Creates [concept_beylik]"
 turkfm_subject_beylik_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has created a [concept_beylik] in [TARGET_COUNTRY.GetName]."
 turkfm_subject_beylik_action_propose_name: "Offer [concept_beylik]"
 turkfm_subject_beylik_action_break_name: "Release [concept_beylik]"
 turkfm_subject_beylik_action_notification_break_name: "[INITIATOR_COUNTRY.GetName] Releases [concept_beylik]"
 turkfm_subject_beylik_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has released [TARGET_COUNTRY.GetName] from its obligations as a [concept_beylik]."

 turkfm_subject_tribe: "Tribe"
 turkfm_subject_tribe_desc: "A $concept_kurdish_tribe$ ([concept_subject]) is a highly autonomous [concept_subject_type] able to start their own [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')]."
 turkfm_subject_tribe_pact_desc: "$turkfm_subject_tribe_desc$"
 turkfm_subject_tribe_action_name: "[concept_kurdish_tribe]"
 turkfm_subject_tribe_action_notification_name: "[TARGET_COUNTRY.GetName] Subjugates [concept_kurdish_tribe]"
 turkfm_subject_tribe_action_notification_desc: "[TARGET_COUNTRY.GetName] has subjugated the [concept_kurdish_tribe] of [TARGET_COUNTRY.GetName]."
 turkfm_subject_tribe_action_propose_name: "Demand Tribal Subjugation"
 turkfm_subject_tribe_action_break_name: "Release [concept_kurdish_tribe]"
 turkfm_subject_tribe_action_notification_break_name: "[TARGET_COUNTRY.GetName] Releases [concept_kurdish_tribe]"
 turkfm_subject_tribe_action_notification_break_desc: "[INITIATOR_COUNTRY.GetName] has released [TARGET_COUNTRY.GetName] from its obligations as a [concept_kurdish_tribe]."
 
 # Diplomatic Pact Triggers
 gbbf_diplomatic_pact_requirement_subject_relation: "[SCOPE.sCountry('source_country').GetName] must be a [concept_subject] of [SCOPE.sCountry('target_country').GetName]"

 # Subject Types:
 subject_type_turkfm_eyalet: "@gbbf_subject_eyalet! $subject_type_turkfm_eyalet_no_icon$"
 subject_type_turkfm_eyalet_no_icon: "[concept_eyalet]"
 subject_type_turkfm_beylik: "@gbbf_subject_beylik! $subject_type_turkfm_beylik_no_icon$"
 subject_type_turkfm_beylik_no_icon: "[concept_beylik]"
 subject_type_turkfm_tribe: "@gbbf_subject_tribe! $subject_type_turkfm_tribe_no_icon$"
 subject_type_turkfm_tribe_no_icon: "[concept_kurdish_tribe]"