 # Artistic Traditions
 grefm_literary_tradition: "@gbbf_literary_tradition! #o #tooltip:[GetPlayer.GetTooltipTag],grefm_literary_tradition_desc Literary Tradition#!#!"
 grefm_literary_tradition_desc: "#bold Literary Tradition#! is a representation of a nation's literary achievements and traditions.\nThere are various ways to gain #bold Literary Tradition#!. Having at least one $building_art_academy$, having one or more #bold Local Writers#!, a #bold National Writer#! and having certain #bold Centers of Art#! will passively add #bold Literary Tradition#! to your country.\nThe more #bold Literary Tradition#! your nation gains, the higher the prestige bonus you gain."
 
 grefm_musical_tradition: "@grefm_musical_tradition! #o #tooltip:[GetPlayer.GetTooltipTag],grefm_musical_tradition_desc Musical Tradition#!#!"
 grefm_musical_tradition_desc: "#bold Musical Tradition#! is a representation of a nation's musical achievements and traditions.\nThere are various ways to gain #bold Musical Tradition#!. If you have at least one #bold Opera#!, you will passively get #bold Musical Tradition#!. The more #bold Operas#! you have the more you get. You can also gain more #bold Musical Tradition#! from musical and arts technologies. Each Technology gives a different bonus. You can also get #bold Musical Tradition#! from events, especially if you have a #bold Composer#!.\nThe more #bold Musical Tradition#! your nation gains, the higher the prestige bonus you gain."
 
 grefm_painting_tradition: "@grefm_painting_tradition! #o #tooltip:[GetPlayer.GetTooltipTag],grefm_painting_tradition_desc Artistic Tradition#!#!"
 grefm_painting_tradition_desc: "#bold Painting Tradition#! is a representation of a nation's painting achievements and traditions. It can be gained from having #bold Arts Academies#!, a #bold concept_klimt_painter#!, certain $gbbf_technologies$ or from events."

