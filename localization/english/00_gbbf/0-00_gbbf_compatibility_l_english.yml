l_english:
 # Archaeology
 gbbf_artifact_local: "@gbbf_artifact_local_minor! #o #tooltip:[GetPlayer.GetTooltipTag],gbbf_artifact_local_desc Local Artifact#!#!"
 gbbf_artifacts_local: "@gbbf_artifact_local_minor! #o #tooltip:[GetPlayer.GetTooltipTag],gbbf_artifact_local_desc Local Artifacts#!#!"
 gbbf_artifact_local_desc: "#bold Minor Artifacts represent the less auspicious archeological findings from sending Archaeological Teams on Expeditions within our borders. While not as headline-grabbing as the findings of major expeditions, these are important for building up the foundation of your museums. You can usually find them in Expeditions, excavations and as Archaeological Discoveries."
 
