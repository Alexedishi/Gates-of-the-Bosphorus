l_english:
 # Historical Characters
 glossary_macedon_alexandros: "$Alexander$ the Great"
 glossary_macedon_alexandros_desc: "#tooltip_header $glossary_macedon_alexandros$#!$gbbf_linebreak_normal$Born c. #v July 356 BCE#! in Pella, Macedon\nDied c. #v June 323 BCE#! in Babylon, Macedonian Empire\n\n--"
 
 glossary_aristotles: "$Aristotle$"
 glossary_aristotles_desc: "#tooltip_header $glossary_aristotles$#!$gbbf_linebreak_normal$Born c. #v 384 BCE#! in Stagira, Chalkidiki\nDied c. #v 322 BCE#! in Chalcis, Euboea\n\n$Aristotle$ was an Ancient Greek philosopher "
 
 glossary_belisarius: "$Belisarius$"
 glossary_belisarius_desc: "#tooltip_header $glossary_belisarius$#!$gbbf_linebreak_normal$Born c. #v 500 CE#! in Germania, Moesia\nDied c. #v March 565 CE#! in Chalcedon, Bithynia\n\n$Belisarius$ was a military commander of the Eastern Roman Empire who served under Justinian I. Despite a string of defeats early in his career, he developed a reputation as a disciplined commander capable of securing victory even when facing numerically superior forces. Following his reconquest of Rome, $Belisarius$ was called out of retirement in 559 to repel a Hunnic invasion.\n\nThe partnership between himself and the Emperor Justinian I inaugurated an era of Eastern Roman dominance in the East."
 
 glossary_kapodistrias_ioannis: "$Ioannis$ $Kapodistrias$"
 glossary_kapodistrias_ioannis_desc: "#tooltip_header $glossary_kapodistrias_ioannis$#!$gbbf_linebreak_normal$Born on #v February 10th 1776#! in Corfu, Ionian Islands\nDied on #v September 21st 1831#! in Nafplion, Greece\n\n$Ioannis$ $Kapodistrias$ was the first head of state of the independent Greek state. With a long career ranging from a ministerial position in the Septinsular Republic to becoming Foreign Minister of Imperial Russia, $Kapodistrias$ was one of the most prominent diplomats of the early 19th century. His rule was marked by open contempt for tribal leaders and entrenched elites as he attempted to unity the young state.\n\nHis assassination in 1831 heralded six months of political chaos leading up to the appointment of $Otto$ $von_Wittelsbach$."
 
 glossary_pericles: "$Pericles$"
 glossary_pericles_desc: "#tooltip_header $glossary_pericles$#!$gbbf_linebreak_normal$Born c. #v 495 BCE#! in Athens, Ancient Greece\nDied c. #v 429 BCE#! in Athens, Ancient Greece\n\n$Pericles$, nicknamed the \"the first citizen of Athens\", was an ancient Greek statesman and general from Ancient Athens that played a leading role in transforming Athens into an imperial power in the wake of the Persian wars.\n\nHis ambition and skills as an oration are held to have resulted in an era of Athenian dominance called the \"Age of Pericles\"."
 
 glossary_theodosius_ii: "$Theodosius$ II"
 glossary_theodosius_ii_desc: "#tooltip_header $glossary_theodosius_ii$#!$gbbf_linebreak_normal$\nBorn on #v April 10th 401#! in Constantinople\nDied on #v July 28th 450#! in Constantinople\n\nBorn the only son of the Emperor Arcadius, $Theodosius$ was proclaimed \"co-Augustus\" by his father and groomed to rule Eastern Rome. His reign was marked by the construction of the Theodosian Walls and the first attempt to organize all known Roman laws, resulting in the Codex Theodosianus.\n\nOne of his most impactful actions was to convene the First Council of Ephesus which saw the priest Nestorius, and Monophysitism at large, condemned as heresy."
 
 glossary_selim_iii: "Selim III Osmanoğlu"
 glossary_selim_iii_desc: "#tooltip_header $glossary_selim_iii$#!$gbbf_linebreak_normal$Born on #v December 24th 1761#! in Constantinople\nDied on #v July 28th 1808#! in Constantinople\n\nSelim III was named Sultan after the death of his reform-minded father, Sultan Mustafa III. His most notable act was the organization of a modernized army unit, the \"Nizam-I Cedid\". This act earned the ire of the Janissaries who deposed him in favor of his uncle.\n\nHe would be killed by an assassin while imprisoned, but his attempts at reform would herald the era of the Tanzimât."
 
 glossary_simeon_veliki: "$Simeon$"
 glossary_simeon_veliki_desc: "#tooltip_header $glossary_simeon_veliki$#!$gbbf_linebreak_normal$Born c. #v 864#! in Bulgaria\nDied on #v May 27th 927#! in Preslav, Bulgarian Empire\n\n--"
 
 glossary_ali_of_jannina: "Ali of Jannina"
