 ## EQFM Glossary
 glossary_concert_of_europe: "Concert of Europe"
 glossary_concert_of_europe_desc: "The Concert of Europe is the informal political structure and balance of power that gives each country a [concept_rank], provides each [concept_great_power] with a sphere of influence, and has been a major step towards avoiding the conditions that led to the $FRA_ADJ$ Revolutionary War and the Napoleonic Wars."
 
 glossary_eastern_question: "Eastern Question"
 glossary_eastern_question_desc: "The Eastern Question is the unstable political situation caused by the decline of the Ottoman Empire. As the empire slowly crumbles from within, the $gbbf_great_powers$ struggle to find strategic and political solutions to expand their influence without disrupting the [glossary_concert_of_europe]."
 

 
 
 
 
 
 
