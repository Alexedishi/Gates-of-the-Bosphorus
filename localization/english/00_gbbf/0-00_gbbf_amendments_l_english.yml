l_english:
 amendment_gbbf_cizye_tax: "Cizye Tax"
 amendment_gbbf_cizye_tax_desc: "A religious tax levied on non-Muslim subjects of countries governed by Islamic law. Mentioned by the Quran, this tax is paid by non-Muslim males in exchange for protection, exemption from military service, and freedom to practice their own religion."
 amendment_gbbf_chiftlik: "Çiftlik"
 amendment_gbbf_chiftlik_desc: "The system of land management generally used in the Ottoman Empire. Derived from temporary land grants to powerful military officers, this serves as the primary method of land inheritance in the empire."
 amendment_gbbf_elifba: "Elifbâ"
 amendment_gbbf_elifba_desc: "A specialized version of the Arabic script has been in use for Turkish documents and communications for nearly six centuries. It is difficult to learn, but lends gravitas to the publications of the Porte."
 amendment_gbbf_esir_pazari: "Esir Pazari"
 amendment_gbbf_esir_pazari_desc: "Unlike the Atlantic slave trade, Ottoman slavery has specialized more towards the sale of women into slavery for concubinage and domestic duties. Many are drawn the populations at the fringes of the empire."
 
