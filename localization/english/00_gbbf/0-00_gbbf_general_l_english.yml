l_english:
 # DLC Info
 dlc_grefm: "Gates of the Bosphorus"
 dlc_grefm_desc: "Step into the events of the Balkans and Eastern Mediterranean during the decline in political, military, and regional significance of the Ottoman Empire. Guide the fledgling Balkan nations as they struggle to enter the industrial world or take charge of the crumbling Ottoman Empire and its subjects as they clings to survival against the thundering tides of Nationalism and Colonialism.$gbbf_linebreak_normal$#bold Gates of the Bosphorus#! comprises the following content modules:\n • $grefm$\n • $balkfm$\n • $turkfm$\n • $mgrbfm$\n • $haykfm$\n • $eqfm$$gbbf_linebreak_normal$#bold Gates of the Bosphorus#! is dependent on the following mods:\n • $gbbf_cmf$\n • $gbbf_csf$\n\n$gbbf_integrates_ip3$\n$gbbf_integrates_atr$\n$gbbf_compatibility_mgr$"
 # \n • $levafm$
 
 gbbf_journal_lobby: "#v Added by Mod: $gbbf_name$#!"
 gbbf_integrates_votp: "@information! #italic #bold #lore #tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_dlc_content_info')] Integrates Content#!#! from DLC: Voice of the People#!#!#!"
 gbbf_integrates_ip3: "@information! #italic #bold #lore #tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_dlc_content_info')] Integrates Content#!#! from DLC: National Awakening#!#!#!"
 gbbf_integrates_ip4: "@information! #italic #bold #lore #tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_dlc_content_info')] Integrates Content#!#! from DLC: Iberian Twilight#!#!#!"
 gbbf_dlc_content_info: "DLC-specific content will only be provided if that DLC is owned and active"
 gbbf_integrates_atr: "@information! Integrates the mod $gbbf_atr$ with permission"
 gbbf_compatibility_mgr: "@warning! Expanded content is available with $gbbf_mgr$"
 
 gbbf_name: "@gbbf_gotb_icon!#bold #greece Gates of the Bosphorus#!#!"
 gbbf_name_no_icon: "#bold #greece Gates of the Bosphorus#!#!"
 gbbf_cmf: "@gbbf_cmf_icon!#bold #blue Community Mod Framework#!#!"
 gbbf_cmf_no_icon: "#bold #blue Community Mod Framework#!#!"
 gbbf_csf: "@gbbf_csf_icon!#bold #green Community State Framework#!#!"
 gbbf_csf_no_icon: "#bold #green Community State Framework#!#!"
 gbbf_atr: "@gbbf_atr_icon!#bold #yellow Awaken Thee, Romanian!#!#!"
 gbbf_atr_no_icon: "#bold #yellow Awaken Thee, Romanian!#!#!"
 gbbf_mgr: "@gbbf_mgr_icon! #bold #red Morgenröte - Dawn of Flavor#!#!"
 gbbf_mgr_no_icon: "#bold #red Morgenröte - Dawn of Flavor#!#!"

 grefm: "#tooltippable #tooltip:[GetRawTextTooltipTag('grefm_desc')] Greek Flavor Module#!#!"
 grefm_desc: "#bold Covers the peoples of the Greek world, including:#!\n • $GRE$\n • $dyn_c_byzantium$\n • $ION$\n • $GRE_SAM$\n • $BYZ_CAP$\n • $BYZ_TRB$\n • $GRA_THE$"
 balkfm: "#tooltippable #tooltip:[GetRawTextTooltipTag('balkfm_desc')] Balkans Flavor Module#!#!"
 balkfm_desc: "#bold Covers the peoples of the Balkans, including:#!\n • $YUG$\n • $MON$\n • $SER$\n • $BUL$\n • $ROM$\n • $BOS$\n • $ALB$ \n@information! Integrates the mod $gbbf_atr$ with permission."
 # \n • $CRO$\n • $SLO$
 turkfm: "#tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_desc')] Turkish Flavor Module#!#!"
 turkfm_desc: "#bold Covers the peoples of the Turkish world, including:#!\n • $dyn_c_ottoman_empire$\n • $TUR$"
 mgrbfm: "#tooltippable #tooltip:[GetRawTextTooltipTag('mgrbfm_desc')] Maghrebi Flavor Module#!#!"
 mgrbfm_desc: "#bold Covers the peoples of the Ottoman sphere of Northern Africa, including:#!\n • $TRI$\n • $TUN$\n • $FZN$\n • $LBY$"
 haykfm: "#tooltippable #tooltip:[GetRawTextTooltipTag('haykfm_desc')] Highlands Flavor Module#!#!"
 haykfm_desc: "#bold Covers the peoples of the Middle Eastern Highlands, including:#!\n • $KUR$"
 # \n • ARM\n • $ASS$
 levafm: "#tooltippable #tooltip:[GetRawTextTooltipTag('levafm_desc')] Levantine Flavor Module#!#!"
 levafm_desc: "#bold Covers the peoples of the Ottoman holdings in the Levant, including:#!\n • $LEB$\n • $SYR$\n • $PAL$"
 eqfm: "#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_desc')] Eastern Question Flavor Module#!#!"
 eqfm_desc: "#bold Covers the $je_group_global_international_situations$ resulting from the decline of the $dyn_c_ottoman_empire$, including:#!\n • $je_eqfm_balkan_powder_keg$\n • $je_eqfm_senusiyya$\n • $je_eqfm_pirates_of_the_adriatic$\n • $je_eqfm_karadag$\n • $je_eqfm_libyan_desert$"

