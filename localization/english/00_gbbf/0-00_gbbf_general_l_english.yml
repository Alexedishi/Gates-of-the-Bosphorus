l_english:
 # DLC Info
 dlc_grefm: "Gates of the Bosphorus"
 dlc_grefm_desc: "Step into the events of the Balkans and Eastern Mediterranean during the decline in political, military, and regional significance of the Ottoman Empire. Guide the fledgling Balkan nations as they struggle to enter the industrial world or take charge of the crumbling Ottoman Empire as it clings to survival against the tide of Nationalism.\n\nGates of the Bosphorus comprises the following content modules:\n • $grefm$\n • $balkfm$\n • $turkfm$\n • $mgrbfm$\n • $haykfm$\n • $eqfm$" # \n • $levafm$
 
 gbbf_journal_lobby: "#v Added by Mod: $gbbf_name$#!"
 gbbf_integrates_votp: "@information! #italic #bold #lore #tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_dlc_content_info')] Integrates Content#!#! from DLC: Voice of the People#!#!#!"
 gbbf_integrates_ip3: "@information! #italic #bold #lore #tooltippable #tooltip:[GetRawTextTooltipTag('gbbf_dlc_content_info')] Integrates Content#!#! from DLC: National Awakening#!#!#!"
 gbbf_dlc_content_info: "DLC-specific content will only be provided if the DLC is owned"
 
 gbbf_name: "@gbbf_gotb_icon!#bold #greece Gates of the Bosphorus#!#!"
 gbbf_name_no_icon: "#bold #greece Gates of the Bosphorus#!#!"
 gbbf_cmf: "@gbbf_cmf_icon!#bold #green Community Mod Framework#!#!"
 gbbf_cmf_no_icon: "#bold #green Community Mod Framework#!#!"
 gbbf_atr: "@gbbf_atr_icon!#bold #yellow Awaken Thee, Romanian!#!#!"
 gbbf_atr_no_icon: "#bold #yellow Awaken Thee, Romanian!#!#!"

