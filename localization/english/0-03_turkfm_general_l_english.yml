l_english:

 # Ideologies
 ideology_turkfm_ottomanist: "Ottomanist"
 ideology_turkfm_ottomanist_desc: "This character believes that state reform and an Ottoman national identity are the means to hold the Ottoman Empire together."
 ideology_turkfm_islamist: "Islamist"
 ideology_turkfm_islamist_desc: "This character believes that the promotion of Islamic jurisprudence and tradition are the means to hold the Ottoman Empire together."

 turkfm_ideology_scribalistic: "Scribalistic"
 turkfm_ideology_scribalistic_desc: "#lore This group believes that administration is a high art unto itself and opposes any attempts at bureaucratic reform."
 turkfm_ideology_islamist: "Islamist"
 turkfm_ideology_islamist_desc: "#lore This group believes that the promotion of Islamic jurisprudence and tradition are the means to hold the Ottoman Empire together."

 # Institutions
 institution_millet_system: "Millet Privileges"
 institution_millet_system_desc: "The degree to which civic affairs are delegated to confessional communities."

 # Interest Group Names
 turkfm_ig_ottoman_beylerbey: "Kubbealtı Vezirleri" # Term referring to the Beys directly influencing the Sultan; drawn from Eyalet rulers/commanders
 turkfm_ig_ottoman_landowners: "Askeriye" # Ottoman term for the ruling class; this should be used after the Vilayet Reforms
 turkfm_ig_ottoman_devout: "İlmiye" # Term referring to the Ottoman oversight over its Ulema
 turkfm_ig_ottoman_armed_forces: "Seifiye" # Called Men of the Sword, this was the Military-Administrative class
 turkfm_ig_ottoman_scribes: "Kalemiye" # The pre-Tanzimât Scribal Class
 turkfm_ig_ottoman_intelligentsia: "Mulkiye" # The post-Tanzimât Civil Service
 turkfm_ig_ottoman_petty_bourgeoisie: "Âyanlık" # The pre-Tanzimât Urban notables & guildsmen
 turkfm_ig_ottoman_rural_folk: "Reaya" # Term derived from the Arabic for flock; refers to tax-generating peasants; in practice, refers to non-muslims... a better term is needed

 # Laws
 lawgroup_grefm_millet_system: "Ottoman Millet System"
 lawgroup_grefm_millet_system_desc: "The privileges and deference given to independent courts of sharia, kanon, and halakha."

 law_turkfm_religious_autonomy: "Religious Autonomy"
 law_turkfm_religious_autonomy_desc: "Ethno-religious groups operate with broad autonomy from the central government. Spiritual leaders apply their own religious and communal justice."
 EFFECTS_ON_ACCEPTANCE_law_turkfm_religious_autonomy: "#tooltippable #tooltip:$BREAKDOWN_TAG$ Pops with lower acceptance will have greatly reduced radicalism and will be very difficult to assimilate.#!#!"

 law_turkfm_nominal_equality: "Nominal Equality"
 law_turkfm_nominal_equality_desc: "All citizens are at least nominally equal before the eyes of the state, and religious leaders are discouraged from exerting control over their communities."
 EFFECTS_ON_ACCEPTANCE_law_turkfm_nominal_equality: "#tooltippable #tooltip:$BREAKDOWN_TAG$ Pops with lower acceptance will be somewhat less radical and more difficult to assimilate.#!#!"

 law_turkfm_judicial_standardization: "Judicial Standardization"
 law_turkfm_judicial_standardization_desc: "The law of the state is given priority over religious law where the two conflict. Religious leaders are relegated to inter-community mediation."
 EFFECTS_ON_ACCEPTANCE_law_turkfm_judicial_standarization: "#tooltippable #tooltip:$BREAKDOWN_TAG$ Pops with lower acceptance with be marginally less radical and slightly more difficult to assimilate.#!#!"

 law_turkfm_millet_abolished: "Millet System Abolished"
 law_turkfm_millet_abolished_desc: "All ethno-religious privileges have been abolished. Religious leaders have been stripped of any and all secular authority."

