l_english:
 # Journal Entry Groups
 je_group_turkfm_libya: "Libyan Historical Content"

# Journal Entries
 je_turkfm_pirates_of_the_adriatic: "The Pirates of the Adriatic"
 je_turkfm_pirates_of_the_adriatic_reason: "Operating from the Balkan mainland, pirates have persistently terrorized the coasts of the Adriatic Sea. Through the centuries, they have served as an extension of Sultanic authority over the Adriatic. With the decline of central authority however, many have taken increased liberties to raid and pillage without allegiance nor accountability.\n$TOOLTIP_DELIMITER$\n@information![GetPlayer.MakeScope.Var('turkfm_jack_sparrow_var').GetCharacter.GetFullName] leads the largest band of pirates and [SCOPE.GetRootScope.GetCountry.GetCustom('turkfm_jack_sparrow_type')]"
 je_turkfm_pirates_of_the_adriatic_complete_tt: "The #bold Pirate Menace#! has been rooted out"

 je_turkfm_tri_centralization: "Entrenching the State"
 je_turkfm_tri_centralization_reason: "For millennia, the coasts of [ROOT.GetCountry.GetName] have served as little more than outposts for imperialist authority. As a new age dawns on the world, there is a renewed push to create a truly [ROOT.GetCountry.GetAdjectiveNoFormatting] state apparatus from which the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] may project true sovereignty."
 je_turkfm_tri_libyan_desert: "Securing the Desert"
 je_turkfm_tri_libyan_desert_reason: "Through millennia of servitude to foreign overlords, [ROOT.GetCountry.GetNameNoFlag] has only exerted nominal control over the deserts to its south. Foreign powers angle to stretcher their tendrils across the world, and [ROOT.GetCountry.GetNameNoFlag] must act quickly to secure the southern border."
 je_turkfm_senusiyya_main: "The Teachings of al-Sanusi"
 je_turkfm_senusiyya_main_reason: "Like much of the Arab world, spiritual life in [ROOT.GetCountry.GetName] is guided by the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName]. However, in the expanses of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName], spiritual life often centers around the [GetCharacterTrait('trait_turkfm_marabout').GetName]. Under increasing pressure from the $turkfm_porte$, the $turkfm_senusiyya_movement$ has gained traction amongst the [ROOT.GetCountry.GetAdjectiveNoFlag] people.\n$TOOLTIP_DELIMITER$\n#white Led by [GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetFullName], the $turkfm_senusiyya_movement$ has [GetPlayer.MakeScope.Var('turkfm_senussi_var').GetValue] strength. This is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],turkfm_senussi_progress_tt [GetPlayer.MakeScope.Var('turkfm_senussi_progress_var').GetValue]#! next month."
 je_turkfm_senusiyya_main_complete: "[ROOT.GetCountry.GetNameNoFlag] has either #bold Embraced#! or #bold Swept Away#! the $turkfm_senusiyya_movement$"
 je_turkfm_senusiyya_main_on_complete_1: "If [ROOT.GetCountry.GetNameNoFlag] has #bold Embraced#! the $turkfm_senusiyya_movement$, triggers the event #bold #white House Senussi of [ROOT.GetCountry.GetNameNoFormatting]#!#!"
 je_turkfm_senusiyya_main_on_complete_2: "If [ROOT.GetCountry.GetNameNoFlag] has #bold Swept Away#! the $turkfm_senusiyya_movement$, triggers the event #bold #white The Senusiyya Movement Extinguished#!#!"
 je_turkfm_senusiyya_main_status_0: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName]'s whereabouts are unknown."
 je_turkfm_senusiyya_main_status_1: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName] is hiding in the desert."
 je_turkfm_senusiyya_main_status_2: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName] operates in desert villages."
 je_turkfm_senusiyya_main_status_3: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName] operates in major cities."
 je_turkfm_senusiyya_main_status_4: "[GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetLastName] is entrenched at court."
 je_turkfm_senusiyya_sub: "The Teachings of al-Sanusi"
 je_turkfm_senusiyya_sub_reason: "Like much of the Arab world, spiritual life in [ROOT.GetCountry.GetName] is guided by the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName]. However, in the expanses of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName], spiritual life often centers around the  [GetCharacterTrait('trait_turkfm_marabout').GetName]. Under increasing pressure from the $turkfm_porte$, the $turkfm_senusiyya_movement$ has gained traction amongst the [ROOT.GetCountry.GetAdjectiveNoFlag] people.\n$TOOLTIP_DELIMITER$\n#white Led by [GetPlayer.MakeScope.Var('turkfm_senussi_character_var').GetCharacter.GetFullName], the $turkfm_senusiyya_movement$ has [GetPlayer.MakeScope.Var('var').GetValue] strength. This is expected to change by #tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_senussi_progress_tt')] [GetPlayer.MakeScope.Var('turkfm_senussi_var').GetValue]#!#! next month."

