 turkfm_kemalism: "@gbbf_identity! #yellow #tooltip:[GetPlayer.GetTooltipTag],turkfm_kemalism_desc Kemalism#!#!"
 turkfm_kemalism_desc: "#bold Kemalism#!, espoused by Mustafa Kemal, asserts \"Turkish-ness\" as a \"civic nation\" defined by the institutions of the state. In this model, the [GetCulture('turkish').GetName] identity is that of the nation itself and one to which all cultures of the nation are subordinated. Through this, the Ottoman monarchy, caliphate, and nobility are denied a role in the new state."
 turkfm_kemalist: "@gbbf_identity! #yellow #tooltip:[GetPlayer.GetTooltipTag],turkfm_kemalism_desc Kemalist#!#!"
 
 turkfm_turanism: "@gbbf_identity! #greece #tooltip:[GetPlayer.GetTooltipTag],turkfm_turanism_desc Turanism#!#!"
 turkfm_turanism_desc: "#bold Turanism#!, spearheaded by Ziya Gökalp, argues that the Turkish state is but a small fragment of a larger Turkic whole. In this model, the [GetCulture('turkish').GetName] identity is the one charged with bringing forth the union of all Turkic peoples."
 turkfm_turanist: "@gbbf_identity! #greece #tooltip:[GetPlayer.GetTooltipTag],turkfm_turanism_desc Turanist#!#!"
 
 turkfm_anatolianism: "@gbbf_identity! #purple #tooltip:[GetPlayer.GetTooltipTag],turkfm_anatolianism_desc Anatolianism#!#!"
 turkfm_anatolianism_desc: "#bold Anatolianism#!, put forwarded by intellectuals like Hilmi Ziya Ülken, rejects the notions of socio-political reform attempted by the $turkfm_tanzimat$. In this model, [GetCulture('turkish').GetName] identity is tied neither to the Sultan nor to Islam, but rather, is an emergent, and self-sustaining civilization developed over centuries of inhabiting Anatolia."
 turkfm_anatolianist: "@gbbf_identity! #purple #tooltip:[GetPlayer.GetTooltipTag],turkfm_anatolianism_desc Anatolianist#!#!"
 
 turkfm_kemalism_factors: "The following factors will contribute to the $turkfm_kemalist$ $turkfm_foundation$:\n • Having either [GetLawType('law_parliamentary_republic').GetName] or [GetLawType('law_presidential_republic').GetName] enacted\n • $gbbf_restrictiveness$ of [ROOT.GetCountry.GetNameNoFlag]'s [GetLawGroup('lawgroup_citizenship').GetName] law\n • total amount of [concept_institution] $gbbf_investment_levels$\n • Average [concept_sol] relative to average [concept_expected_sol]\n • Having [GetLawType('law_total_separation').GetName] enacted\n • [concept_innovation]\n • [political_movement_support] of the #bold Cultural Majority#! $gbbf_movement$\n • states in [GetGeographicRegion('geographic_region_anatolia').GetName] with the [GetDecreeType('decree_promote_national_values').GetName] active\n • $gbbf_restrictiveness$ of [ROOT.GetCountry.GetNameNoFlag]'s [GetLawGroup('lawgroup_citizenship').GetName] law"
 
 turkfm_turanism_factors:  "The following factors will contribute to the $turkfm_turanist$ $turkfm_foundation$:\n • $gbbf_fully_owning$ non-[GetCulture('turkish').GetName] $turkfm_turkic_culture$ [concept_homeland] $gbbf_states$\n • [concept_prestige]\n • [concept_army_power_projection]\n • States in [GetGeographicRegion('geographic_region_anatolia').GetName] with the [GetDecreeType('decree_enlistment_efforts').GetName] active"
 
 turkfm_anatolianism_factors:  "The following factors will contribute to the $turkfm_anatolianist$ $turkfm_foundation$:\n • Average [concept_literacy] of [GetCulture('turkish').GetName] $gbbf_pops$\n • $gbbf_fully_owning$ [GetCulture('turkish').GetName] [concept_homeland] $gbbf_states$\n • [GetBuildingType('building_university').GetName] $gbbf_building_levels$ in [GetGeographicRegion('geographic_region_anatolia').GetName]\n • States in [GetGeographicRegion('geographic_region_anatolia').GetName] with the [GetDecreeType('decree_promote_social_mobility').GetName] active"
 
 turkfm_turkic_culture: "#yellow #tooltip:[GetPlayer.GetTooltipTag],turkfm_turkic_culture_desc Turkic Culture#!#!"
 turkfm_turkic_culture_desc: "\n • [GetCulture('turkish').GetName]\n • [GetCulture('turkmen').GetName]\n • [GetCulture('kazak').GetName]\n • [GetCulture('uzbek').GetName]\n • [GetCulture('tajik').GetName]\n • [GetCulture('uighur').GetName]\n • [GetCulture('tatar').GetName]\n • [GetCulture('azerbaijani').GetName]"
