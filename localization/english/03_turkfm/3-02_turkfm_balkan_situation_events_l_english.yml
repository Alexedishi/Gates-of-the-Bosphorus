 turkfm_balkan_situation.207.t: "Violence in [SCOPE.sState('turkfm_riot_state_scope').GetName] Worsens"
 turkfm_balkan_situation.207.d: "Despite efforts by local garrisons to quash the unrest in [SCOPE.sState('turkfm_riot_state_scope').GetCityHubName], the violence has begun to spillover to [SCOPE.sState('turkfm_riot_state_scope').GetName] at large."
 turkfm_balkan_situation.207.f: "As violence spreads from the cities and into the countryside, locals have begun ambushing and harassing both Turkish solider and civilian alike."
 turkfm_balkan_situation.207.a: "This is for the local governor to handle."
 turkfm_balkan_situation.207.a.tt: "Your actions may cause the situation to escalate."
 turkfm_balkan_situation.207.b: "We must exercise restraint."
 turkfm_balkan_situation.207.b.tt: "Your lack of action is likely to escalate the situation."
 turkfm_balkan_situation.207.c: "Muster the army, intervene immediately."
 turkfm_balkan_situation.207.c.tt: "Your actions are likely to keep the situation from escalating."
 turkfm_balkan_situation.208.t: "Massacre in [SCOPE.sState('turkfm_riot_state_scope').GetName]!"
 turkfm_balkan_situation.208.d: "Disastrous news has arrived from [SCOPE.sState('turkfm_riot_state_scope').GetName]. After a weeks-long standoff in [SCOPE.sState('turkfm_riot_state_scope').GetCityHubName], forces attached to the local garrison fired on hundreds of peaceful protesters. While numbers are still being reported, the deaths may number in the hundreds."
 turkfm_balkan_situation.208.f: ""For three days the miserable inhabitants were given over to lust and cruelty of a mob of savages. Neither sex nor age was spared. Women and children were tortured before being put to death. So great was the slaughter that Kolokotronis himself says that, from the gate to the citadel his horse's hoofs never touched the ground. His path of triumph was carpeted with corpses. At the end of two days, the wretched remnant of the Mussulmans were deliberately collected, to the number of some two thousand souls, of every age and sex, but principally women and children, were led out to a ravine in the neighboring mountains and there butchered like cattle.""
 turkfm_balkan_situation.208.a: "We must enforce order!"
 turkfm_balkan_situation.208.b: "Avoid escalating the situation further."
 turkfm_balkan_situation.209.t: "Crowds Dispersed in [SCOPE.sState('turkfm_riot_state_scope').GetName]"
 turkfm_balkan_situation.209.d: "Following days of violence and abuses in [SCOPE.sState('turkfm_riot_state_scope').GetCityHubName], the joint garrisons of [SCOPE.sState('turkfm_riot_state_scope').GetName] have dispersed several crowds from public centers. While the totals are being tallied, news have arrived of dozens of arrests involving local leaders."
 turkfm_balkan_situation.209.f: ""Certain among you have taken as a pretext for revolt the abuse by the governmental administration, some others have invoked the defence of the Caliphate." -Diyarbakir Independence Tribunal, 28 June 1925"
 turkfm_balkan_situation.209.a: "Justice well served."