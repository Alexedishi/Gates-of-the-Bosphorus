 turkfm_balkan_situation.200.t: "Garrison in [SCOPE.sState('turkfm_riot_state_scope').GetName] Besieged"
 turkfm_balkan_situation.200.d: "An alarming report has arrived from [SCOPE.sState('turkfm_riot_state_scope').GetName]: the provincial garrison at has been surrounded in the fort at [SCOPE.sState('turkfm_riot_state_scope').GetCityHubName] by massive crowds of rioters. Several messengers have managed to break through the siege to bring desperate pleas for orders from the $turkfm_porte$."
 turkfm_balkan_situation.200.f: "With farming implements, makeshift rifles, and rumors of foreign suppliers, the crowds have prevented the garrison from taking any meaningful actions."
 turkfm_balkan_situation.200.a: "Order the garrison to shelter in place."
 turkfm_balkan_situation.200.b: "Surrender the fort and have the garrison march to safety."
 turkfm_balkan_situation.201.t: "Crowds Burn Palace in [SCOPE.sState('turkfm_riot_state_scope').GetName]"
 turkfm_balkan_situation.201.d: "An out of control mob has stormed the provincial palace in [SCOPE.sState('turkfm_riot_state_scope').GetCityHubName] and set the palace ablaze. While the governor has escaped, the palace has been reduced to a burned husk."
 turkfm_balkan_situation.201.f: "Not a single desk was left unturned nor a single shred of paper left unburnt. It was a scene of total anarchy."
 turkfm_balkan_situation.201.a: "What happened to the guards?"
 turkfm_balkan_situation.201.b: "Send in the provincial garrison!"
 turkfm_balkan_situation.202.t: "[SCOPE.gsInterestGroup('turkfm_riot_ig_scope').GetName] Sides with Minorities"
 turkfm_balkan_situation.202.d: "In a break with political norms, the [SCOPE.gsInterestGroup('turkfm_riot_ig_scope').GetName] has declared their open support for the rioters. This has caused an uproar within the Center."
 turkfm_balkan_situation.202.f: ""We cannot pretend to call ourselves civilized while such barbarism exists within our borders!""
 turkfm_balkan_situation.202.a: "Round up these renegades."
 turkfm_balkan_situation.202.b: "Undermine [SCOPE.gsInterestGroup('turkfm_riot_ig_scope').GetLeader.GetFullName]'s credibility."
 turkfm_balkan_situation.203.t: "The [SCOPE.gsInterestGroup('turkfm_riot_ig_scope').GetName] Mobilizes the Faithful"
 turkfm_balkan_situation.203.d: "[SCOPE.gsInterestGroup('turkfm_riot_ig_scope').GetLeader.GetFullName] has hosted a marathon of sermons rallying the [GetReligion('sunni').GetName] faithful of [SCOPE.sState('turkfm_riot_state_scope').GetName] to hold back the rioters."
 turkfm_balkan_situation.203.f: ""These infidels are a scourge upon our lands! They must not be allowed to roam free any longer!""
 turkfm_balkan_situation.203.a: "We must trust in his jurisprudence."
 turkfm_balkan_situation.203.b: "Shut him up before he makes things worse!"
 turkfm_balkan_situation.204.t: "[SCOPE.gsInterestGroup('turkfm_riot_ig_scope').GetName] Requests Intervention"
 turkfm_balkan_situation.204.d: "The [SCOPE.gsInterestGroup('turkfm_riot_ig_scope').GetName] has requested that they be given leave to put down the rebellion in [SCOPE.sState('turkfm_riot_state_scope').GetName]."
 turkfm_balkan_situation.204.f: "Anxious to assert their relevance in the Ottoman court, [SCOPE.gsInterestGroup('turkfm_riot_ig_scope').GetLeader.GetFullName] has already assembled a force for immediate action."
 turkfm_balkan_situation.204.a: "Grant the order."
 turkfm_balkan_situation.204.b: "Order him to stand down."
