l_english:
 turkfm_balkan_situation.001.t: "The Peoples of the Empire"
 turkfm_balkan_situation.001.d: "The [ROOT.GetCountry.GetName] simmers with turmoil, a deep chasm appearing between its [GetCulture('turkish').GetName] ruling classes and its many [GetReligion('orthodox').GetName] and [GetReligion('jewish').GetName] populations."
 turkfm_balkan_situation.001.f: "As the tenets of [GetTechnology('nationalism').GetName] emanate across the [GetStrategicRegion('region_balkans').GetName], many peoples begin to dream of a future where they determine their fate without the abuses of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] and [ROOT.GetCountry.GetRuler.GetHerHis] court. It will take all the efforts of the ailing imperial bureaucracy to exert the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s will over our flock.\n\n#white [ROOT.GetCountry.GetNameNoFlag] is [SCOPE.GetRootScope.GetCountry.GetCustom('turkfm_tension_involvement_type')] in the $turkfm_balkan_nationalism$ conflict.#!\n\nThe [GetStrategicRegion('region_balkans').GetName] are currently in the $turkfm_tension_status_short$ phase.\n\n#italic [ROOT.GetCountry.GetAdjectiveNoFlag] actions along with those of other participants will determine the future phases of the conflict and its eventual outcome.#!"
 turkfm_balkan_situation.001.a: "We will have peace in our time."
 turkfm_balkan_situation.002.t: "The Rise of Nationalism"
 turkfm_balkan_situation.002.d: "A wave of revivalist fervor has swept across the [GetStrategicRegion('region_balkans').GetName]. There can be no doubt: [GetTechnology('nationalism').GetName] has arrived and there is little we can do to dislodge it from the hearts of our subjects."
 turkfm_balkan_situation.002.f: "As whispers of rebellions flood the court, the Sultan's inner circle have agreed that the only way to push back the tide of revivalism is to prove the Ottoman state to be a more capable alternative."
 turkfm_balkan_situation.002.a: "This is worrisome."
 turkfm_balkan_situation.003.t: "Nationalist Movements Intensify"
 turkfm_balkan_situation.003.d: "The myriad waves of [GetTechnology('nationalism').GetName] have begun to converge with the advent of [GetTechnology('pan-nationalism').GetName]. Governors have voiced concern that it is becoming harder to contain dissent."
 turkfm_balkan_situation.003.f: ""Day by day, the peoples of the [GetStrategicRegion('region_balkans').GetName] find themselves drawn together by commonalityies between each other as opposed to those with the $turkfm_porte$.""
 turkfm_balkan_situation.003.a: "We must keep order."
 turkfm_balkan_situation.004.t: "DUMMY"
 turkfm_balkan_situation.004.d: "DUMMY"
 turkfm_balkan_situation.004.f: "DUMMY"
 turkfm_balkan_situation.004.a: "DUMMY"
 turkfm_balkan_situation.005.t: "Riots in [SCOPE.sState('turkfm_riot_state_scope').GetName]"
 turkfm_balkan_situation.005.d: "Rioting has broken out in [SCOPE.sState('turkfm_riot_state_scope').GetCityHubName]. Unlike previous unrest, the locals have begun erecting barricades across the city."
 turkfm_balkan_situation.005.f: "While unrest against Ottoman rule has been chronic since the defeat at the hands of the Holy League, these latest protests have taken a much more nationalistic tone."
 turkfm_balkan_situation.005.a: "Send in the regular army."
 turkfm_balkan_situation.005.tt: "If the #bold Nationalist Insurrection#! [concept_journal_entry] progress bar reaches #bold 200#!, rebels will take up arms against [ROOT.GetCountry.GetAdjectiveNoFlag] rule."
 turkfm_balkan_situation.006.t: "The [SCOPE.sCountry('turkfm_rebellion_scope').GetAdjective] Rebellion"
 turkfm_balkan_situation.006.d: "Our garrisons in [SCOPE.sCountry('turkfm_rebellion_scope').GetCapital.GetName] have collapsed. The [SCOPE.sCountry('turkfm_rebellion_scope').GetAdjectiveNoFlag] people have raised their flag over [SCOPE.sCountry('turkfm_rebellion_scope').GetCapital.GetCityHubName] and declared their independence from the [ROOT.GetCountry.GetName]."
 turkfm_balkan_situation.006.f: "The outright ejection of our forces has shaken confidence in the [ROOT.GetCountry.GetAdjective] State's right to dominion over the Balkans. We will need to act decisively if we are to ensure our continued domain over Rumelia."
 turkfm_balkan_situation.006.a: "We will crush these rebels!"
 turkfm_balkan_situation.006.b: "[SCOPE.sCountry('turkfm_rebellion_scope').GetName] shall have autonomy."
 turkfm_balkan_situation.007.t: "Rebellion in [SCOPE.sState('turkfm_riot_state_scope').GetName] Suppressed"
 turkfm_balkan_situation.007.d: "Reassurances have arrived from [SCOPE.sState('turkfm_riot_state_scope').GetName] as the garrison commander has reported success in putting down the last radical elements in [SCOPE.sState('turkfm_riot_state_scope').GetCityHubName]."
 turkfm_balkan_situation.007.f: "With the organizers of the rebellion in our custody, their trials will make excellent public fodder to extol our authority over the Balkans."
 turkfm_balkan_situation.007.a: "Excellent work."
 turkfm_balkan_situation.008.t: "Rumelia Lost"
 turkfm_balkan_situation.008.d: "With the collapse of our authority has come the disintegration of the state apparatus across Rumelia. The Balkan states have plied themselves free of our grip, each cackling like hyenas in the dark."
 turkfm_balkan_situation.008.f: "Without the pressure of Ottoman intervention and now unchecked influence from Austrian and Russian envoys, the Balkans have torn themselves away from the East in the hopes of rejoining the European community."
 turkfm_balkan_situation.008.a: "Any hope we have, we entrust to Allah."
 turkfm_balkan_situation.009.t: "Dominion Over Rumelia"
 turkfm_balkan_situation.009.d: "Despite the immense challenges thrown at the feet of the $turkfm_porte$, the forces of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] have succeeded in not only curtailing separatism, but have also exalted the #yellow Sublime#! [ROOT.GetCountry.GetAdjective] #yellow State#! as the supreme force in the Balkans."
 turkfm_balkan_situation.009.f: "Despite centuries of challenges from the West, the [ROOT.GetCountry.GetName] has secured the Balkans as a truly Turkish realm."
 turkfm_balkan_situation.009.a: "The Caliphate is Eternal."

 turkfm_balkan_situation.100.t: "Extortionate Taxation in [SCOPE.sState('turkfm_tension_state_scope').GetName]"
 turkfm_balkan_situation.100.d: "A local bey in [SCOPE.sState('turkfm_tension_state_scope').GetName] has been accused of imposing excessive taxation on our non-Muslim subjects. He has argued that this is merely an exercise in the state's authority to collect the jizya."
 turkfm_balkan_situation.100.f: "The jizya is a form of taxation imposed on non-Muslims in the Muslim Empires in exchange for protection and an exemption from military service. This has been widely decried by Orthodox believers as unfair and unethical."
 turkfm_balkan_situation.100.a: "The Sultan stands behind his Pashas."
 turkfm_balkan_situation.100.b: "The Pasha has overstepped his mandate."
 turkfm_balkan_situation.101.t: "Plague Outbreak in [SCOPE.sState('turkfm_tension_state_scope').GetName]"
 turkfm_balkan_situation.101.d: "An outbreak of plague has occurred in [SCOPE.sState('turkfm_tension_state_scope').GetName]. Locals have pointed fingers at an Ottoman garrison that was recently stationed in [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName]."
 turkfm_balkan_situation.101.f: "While the plague was quickly becoming a distant memory in the West, the lack of developed healthcare and sanitation across the Empire has led to occasional problems with the plague."
 turkfm_balkan_situation.101.a: "This is not our problem."
 turkfm_balkan_situation.101.b: "Implement a Quarantine."
 turkfm_balkan_situation.102.t: "Ecumenical Patriarch Demands Protections"
 turkfm_balkan_situation.102.d: "Following violence against [GetReligion('orthodox').GetName] worshipers in [SCOPE.sState('turkfm_tension_state_scope').GetName], the Ecumenical Patriarch has reached out to the Sultan directly to demand increased protections for the faithful."
 turkfm_balkan_situation.102.f: "Following the fall of Constantinople, the Ecumenical Patriarch was recognized as the head of the Orthodox "millet." In the centuries since, this power has been eroded to the point that abuses against the Orthodox population have become common in the Empire."
 turkfm_balkan_situation.102.a: "The Patriarch overestimates his authority."
 turkfm_balkan_situation.102.b: "Provide a token garrison."
 turkfm_balkan_situation.103.t: "The Language of Paperwork"
 turkfm_balkan_situation.103.d: "Frustrated members of the [SCOPE.sReligion('turkfm_tension_religion_scope').GetName] community in [SCOPE.sState('turkfm_tension_state_scope').GetName] have petitioned the local bey to authorize publications of legal papers in their native language."
 turkfm_balkan_situation.103.f: "Since the inception of the Empire, communication with the High Center has taken place in either Turkish or Arabic. The adjustment of our administrative into a local language would require an immense bureaucratic effort."
 turkfm_balkan_situation.103.a: "This is strictly a local matter."
 turkfm_balkan_situation.103.b: "Send a delegation from the translation service."
 turkfm_balkan_situation.104.t: "Food Shortages in [SCOPE.sState('turkfm_tension_state_scope').GetName]"
 turkfm_balkan_situation.104.d: ""
 turkfm_balkan_situation.104.f: ""
 turkfm_balkan_situation.104.a: ""
 turkfm_balkan_situation.104.b: ""
 turkfm_balkan_situation.105.t: "Peasants March in [SCOPE.sState('turkfm_tension_state_scope').GetName]"
 turkfm_balkan_situation.105.d: "Messengers from [SCOPE.sState('turkfm_tension_state_scope').GetName] have reported informal, but sustained protests by peasants in [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName] in the name of reducing taxes."
 turkfm_balkan_situation.105.f: "Overtaxation of the dhimmi communities has long been the primary means of shoring up the increasing needs of the central bureaucracy. This has become extortionate in regions where strong administration has coupled with abusive governors."
 turkfm_balkan_situation.105.a: "Such protests are an affront to the Sultan."
 turkfm_balkan_situation.105.b: "Let them complain. We will change nothing."
 turkfm_balkan_situation.106.t: "Local Bey Exceeds Authority"
 turkfm_balkan_situation.106.d: "The governor of [SCOPE.sState('turkfm_tension_state_scope').GetName] has been accused of demanding unreasonable taxes from our non-[GetReligion('sunni').GetName] population, far beyond the accepted level of Cizye historically demanded of our dhimmi communities."
 turkfm_balkan_situation.106.f: "While the dhimmi communities enjoyed tolerable conditions for most of their time under Ottoman rule, this waxed and waned depending on the policies of successive Sultans."
 turkfm_balkan_situation.106.a: "He is merely exercising his authority."
 turkfm_balkan_situation.106.b: "Recall him to the court."
 turkfm_balkan_situation.107.t: "Church Services Disrupted"
 turkfm_balkan_situation.107.d: "A [GetReligion('sunni').GetName] mob has disrupted religious services in [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName] and vandalized several churches."
 turkfm_balkan_situation.107.f: "While services are expected to resume without much delay, the Orthodox community in [SCOPE.sState('turkfm_tension_state_scope').GetName] had demanded that justice be brought upon the perpetrators."
 turkfm_balkan_situation.107.a: "Religious services must remain unmolested."
 turkfm_balkan_situation.107.b: "This sounds like a local problem."
 turkfm_balkan_situation.108.t: "Villages Request Schools"
 turkfm_balkan_situation.108.d: "[SCOPE.sCulture('turkfm_tension_culture_scope').GetName] [GetReligion('orthodox').GetName] [GetPopType('academics').GetName] in [SCOPE.sState('turkfm_tension_state_scope').GetState] have approached the administration in  [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName] to request support for education efforts in the hinterlands."
 turkfm_balkan_situation.108.f: "Islamic schools have informally served the many peoples of the Empire for centuries, but with the arrival of western thought, many communities have begun to organize their own methods of schooling independent of the Islamic system."
 turkfm_balkan_situation.108.a: "This request is inappropriate."
 turkfm_balkan_situation.108.b: "The $turkfm_porte$ will spare the funds."
 turkfm_balkan_situation.109.t: "Revivalist Publications"
 turkfm_balkan_situation.109.d: "Independent publishers in [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName] have run a series of newspaper articles calling for the revival of a [SCOPE.sCulture('turkfm_tension_culture_scope').GetName] state with autonomy from the $turkfm_sublime_porte$. Local governors have requested direction with how to respond to this development."
 turkfm_balkan_situation.109.f: ""
 turkfm_balkan_situation.109.a: "We tolerate no dissent. Shut it down."
 turkfm_balkan_situation.109.b: "These publications are as empty as their words."

 turkfm_balkan_situation.110.t: "Storefronts Ransacked"
 turkfm_balkan_situation.110.d: "Incensed by a series of inflammatory writings, angry mobs have descended upon [SCOPE.sCulture('turkfm_tension_culture_scope').GetName]-owned businesses in [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName]. While garrisons have cleared the crowds, concerns remain for the losses incurred by the affected minorities."
 turkfm_balkan_situation.110.f: "With the rise of Industrialism in the west, Ottoman merchants have found themselves gradually outcompeted in foreign markets. An increasing trend across the empire has been to pin these failures on alleged conspiracies by minorities."
 turkfm_balkan_situation.110.a: "This is a local affair."
 turkfm_balkan_situation.110.b: "Provide for reparations."
 turkfm_balkan_situation.111.t: "Minority Rejects Classification"
 turkfm_balkan_situation.111.d: "The [SCOPE.sCulture('turkfm_tension_culture_scope').GetName] population of [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName] have made vocal complaints regarding their inclusion in the broader [GetReligion('orthodox').GetName] millet. Community leaders have requested increased independence in their cultural affairs."
 turkfm_balkan_situation.111.f: "With increasing attempts at reform and standardization, local communities have begun searching for ways to retain their unique privileges while paying lip service to the idea of general equality."
 turkfm_balkan_situation.111.a: "We cannot fragment our administration."
 turkfm_balkan_situation.111.b: "The governor can turn a blind eye for now."
 turkfm_balkan_situation.112.t: "Shipping Merchants Held Up"
 turkfm_balkan_situation.112.d: "Pirate bands, led by [SCOPE.sCharacter('turkfm_jack_sparrow_scope').GetFullName], have held up our merchant fleets in the Adriatic."
 turkfm_balkan_situation.112.f: ""Take what ye can!\n"Give nothin' back!""
 turkfm_balkan_situation.112.a: "We cannot tolerate this!"
 turkfm_balkan_situation.113.t: "Crowds Gather in City Hub"
 turkfm_balkan_situation.113.d: "Disputes between the [GetReligion('orthodox').GetName] and [GetReligion('sunni').GetName] communities of [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName] have flared up with [GetReligion('orthodox').GetName] crowds gathering in the city center. Local authorities have voiced concern that conflict is on the horizon."
 turkfm_balkan_situation.113.f: "While disagreements are common between minorities and the Sunni majority, governors quick to respond to any threats of true conflict."
 turkfm_balkan_situation.113.a: "Have police disperse the crowds."
 turkfm_balkan_situation.113.b: "Let them bluster at each other."
 turkfm_balkan_situation.113.c: "Have the garrison beat them down."
 turkfm_balkan_situation.114.t: "Language Bans in State"
 turkfm_balkan_situation.114.d: "Outcry has been heard from [SCOPE.sState('turkfm_tension_state_scope').GetName] where the local governor has implemented a ban of the use of non-[GetCulture('turkish').GetName] languages in any official capacity."
 turkfm_balkan_situation.114.f: "While officially a Turkish empire, the Ottoman administration has for centuries accepted the use of native languages outside of the court at [ROOT.GetCountry.GetCapital.GetCityHubName]. Any change in this status threatens to upend centuries of tradition."
 turkfm_balkan_situation.114.a: "This is within his purview."
 turkfm_balkan_situation.114.b: "Order him to rescind the ban."
 turkfm_balkan_situation.114.c: "Excellent idea. Extend this to the whole Empire."
 turkfm_balkan_situation.115.t: "Gun-Runners Intercepted" # Greek Variant
 turkfm_balkan_situation.115.d: "Weapon smugglers supplying separatist groups have been intercepted in [SCOPE.sState('turkfm_tension_state_scope]. A quick investigation has revealed them to be sponsored by [SCOPE.sCountry('turkfm_tension_country_scope').GetNameNoFlag]."
 turkfm_balkan_situation.115.f: "The borders between the Empire and its neighbors have been painstakingly mapped out via treaty. Actually enforcing these borders has turned out to be a different matter altogether."
 turkfm_balkan_situation.115.a: "We will address this directly with the [SCOPE.sCountry('turkfm_tension_country_scope').GetAdjectiveNoFormatting] state."
 turkfm_balkan_situation.115.b: "We cannot risk an incident. Release these men."
 turkfm_balkan_situation.116.t: "Gun-Runners Intercepted" # Yugoslav Variant
 turkfm_balkan_situation.116.d: "Weapon smugglers supplying separatist groups have been intercepted in [SCOPE.sState('turkfm_tension_state_scope]. A quick investigation has revealed them to be sponsored by [SCOPE.sCountry('turkfm_tension_country_scope').GetNameNoFlag]."
 turkfm_balkan_situation.116.f: "The borders between the Empire and its neighbors have been painstakingly mapped out via treaty. Actually enforcing these borders has turned out to be a different matter altogether."
 turkfm_balkan_situation.116.a: "We will address this directly with the [SCOPE.sCountry('turkfm_tension_country_scope').GetAdjectiveNoFormatting] state."
 turkfm_balkan_situation.116.b: "We cannot risk an incident. Release these men."
 turkfm_balkan_situation.117.t: "Piracy in State"
 turkfm_balkan_situation.117.d: "For the past week, our convoys in the Adriatic have been beset by [concept_albanian_piracy]. Led by [SCOPE.sCharacter('turkfm_jack_sparrow_scope').GetFullName], these ruffians have struck fear into our merchant marine."
 turkfm_balkan_situation.117.f: ""Did anyone see that because I will not be doing it again!""
 turkfm_balkan_situation.117.a: "This is unacceptable."
 turkfm_balkan_situation.117.b: "Have our expedition fleet drive them off."
 turkfm_balkan_situation.118.t: "Villagers Displaced in State"
 turkfm_balkan_situation.118.d: "Tempers have flared in [SCOPE.sState('turkfm_tension_state_scope').GetName] over the settlement of [GetCulture('turkish').GetName] in lands historically populated by [GetCulture('turkfm_tension_culture_scope').GetName] communities. Locals allege they are being forced out while new arrivals claim they are moving into abandoned and disused land."
 turkfm_balkan_situation.118.f: "In the centuries since the Ottoman conquests, the Christian and Muslim populations have readily intermingled, each keeping to their own confessional communities. This coexistence has begun to break down as paranoia grips the [GetReligion('sunni').GetName] population."
 turkfm_balkan_situation.118.a: "These matters are for the local governors."
 turkfm_balkan_situation.118.b: "Curb new settlements until tempers subside."
 turkfm_balkan_situation.118.c: "We should encourage these new settlements."
 turkfm_balkan_situation.119.t: "Brigands Cross the Border"
 turkfm_balkan_situation.119.d: "[SCOPE.sCountry('turkfm_tension_country_scope').GetNameNoFlag]'s brazen lack of central control have come to a head once more. Brigands have retreated across the [SCOPE.sCountry('turkfm_tension_country_scope').GetAdjectiveNoFormatting] border into [ROOT.GetCountry.GetAdjectiveNoFlag] leaving more destruction in their wake."
 turkfm_balkan_situation.119.f: "Disillusioned irregulars have seized on weak government control and police corruption to rob and pillage both laborer and gentry alike. Withdrawing as quickly as they arrived, local chieftains have found several villages raided and burned."
 turkfm_balkan_situation.119.a: "We must seek redress."
 turkfm_balkan_situation.119.b: "Perhaps we can cooperate on the issue."

 turkfm_balkan_situation.120.t: "Church Burned in [SCOPE.sState('turkfm_tension_state_scope').GetName]"
 turkfm_balkan_situation.120.d: "A dispute in [SCOPE.sState('turkfm_tension_state_scope').GetName] escalated to open rioting several days ago. By the time the rioters were pacified, several [GetReligion('orthodox').GetName] churches had been torched. Faith leaders have appealed to the $turkfm_porte$ for reparations."
 turkfm_balkan_situation.120.f: "As nationalism takes a hold of both Muslim and Orthodox alike, outright confrontation is becoming more frequent in the streets. Advisors warn that a lack of decisive action may endanger the legitimacy of the Sultan's authority."
 turkfm_balkan_situation.120.a: "They can tend to their own affairs."
 turkfm_balkan_situation.120.b: "We right this abuse."
 turkfm_balkan_situation.121.t: "Popular Speaker Lynched in [SCOPE.sState('turkfm_tension_state_scope').GetName]"
 turkfm_balkan_situation.121.d: "Crowds have clashed during [SCOPE.sCulture('turkfm_tension_culture_scope').GetName] demonstrations in [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName]. In one confrontation, one of the [SCOPE.sCulture('turkfm_tension_culture_scope').GetName] leaders was seized and beaten. Our informants tell us he is unlikely to survive his injuries."
 turkfm_balkan_situation.121.f: ""Murders! Killers! Animals!""
 turkfm_balkan_situation.121.a: "Arrest the perpetrators."
 turkfm_balkan_situation.121.b: "Serves them right."
 turkfm_balkan_situation.122.t: "Brigandage in [SCOPE.sState('turkfm_tension_state_scope').GetName]"
 turkfm_balkan_situation.122.d: "Brigands have raided the countryside in [SCOPE.sState('turkfm_tension_state_scope').GetName], prompting calls for action by the authorities."
 turkfm_balkan_situation.122.f: "Disillusioned irregulars have seized on weak government control and police corruption to rob and pillage both laborer and gentry alike. Withdrawing as quickly as they arrived, local beys have found several villages raided and burned."
 turkfm_balkan_situation.122.a: "This is beneath our concern."
 turkfm_balkan_situation.122.b: "Deploy the local garrison."
 turkfm_balkan_situation.123.t: "Port Burned in State"
 turkfm_balkan_situation.123.d: "The garrisons in [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName] have lost control of rioters at the city port. In the madness that ensued, separatists put large amounts of port infrastructure to the torch. Local administrators are still tallying up the damages."
 turkfm_balkan_situation.123.f: "The burned ferries... they burned warehouses... they even burned down my favorite fish joint!"
 turkfm_balkan_situation.123.a: "Round up these lunatics."
 turkfm_balkan_situation.123.b: "We cannot spare any resources."
 turkfm_balkan_situation.123.c: "Focus on rebuilding the port."
 turkfm_balkan_situation.124.t: "Blood Libel"
 turkfm_balkan_situation.124.d: "Ominous rumors have spread across [SCOPE.sState('turkfm_tension_state_scope').GetName] accusing the [SCOPE.sCulture('turkfm_tension_culture_scope').GetName] [SCOPE.sCulture('turkfm_tension_religion_scope').GetName] community of deranged crimes against the [GetReligion('sunni').GetName] majority. Reports have spread of mobs roaming door-to-door in the mountain villages terrorizing any [SCOPE.sCulture('turkfm_tension_culture_scope').GetName] they find."
 turkfm_balkan_situation.124.f: "Given the insular nature of the mountain villages, misunderstandings can quickly become rumors which often spiral into violence."
 turkfm_balkan_situation.124.a: "Perhaps their fears are well-founded."
 turkfm_balkan_situation.124.b: "Order the governor to secure order."
 turkfm_balkan_situation.125.t: "Administrative Offices Ransacked"
 turkfm_balkan_situation.125.d: "An angry mob have ransacked the administrative offices in [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName]. While damage was minimal, this threatens to impair our governance over [SCOPE.sState('turkfm_tension_state_scope').GetName]."
 turkfm_balkan_situation.125.f: "Entire halls of land and business documents have been left in total disarray. It will take months to sort everything back into a usable state."
 turkfm_balkan_situation.125.a: "Wait, where is the guard?"
 turkfm_balkan_situation.125.b: "Send in the garrison."
 turkfm_balkan_situation.126.t: "Military Column Attacked"
 turkfm_balkan_situation.126.d: "A small gang ambushed a patrol in the hinterlands of [SCOPE.sState('turkfm_tension_state_scope').GetName]. Witnesses have been quick to blame the local [SCOPE.sCulture('turkfm_tension_culture_scope').GetName] community."
 turkfm_balkan_situation.126.f: "Surprise raids by local highwaymen is not unheard of, yet that hasn't stopped disaffected communities from pointing the finger at local minorities."
 turkfm_balkan_situation.126.a: "Have the military round up the suspects."
 turkfm_balkan_situation.126.b: "Limit patrols through these areas."
 turkfm_balkan_situation.127.t: "Muslim Militia Organizes in State"
 turkfm_balkan_situation.127.d: "Following weeks of firey sermons, a [GetReligion('sunni').GetName] imam in [SCOPE.sState('turkfm_tension_state_scope').GetName] has organized an informal militia in the name of "safeguarding jurisprudence." Local spies warn of a risk of impending violence."
 turkfm_balkan_situation.127.f: ""They pollute our streets! They tempt our women! They are heathens and nothing more!""
 turkfm_balkan_situation.127.a: "We should commend his piety."
 turkfm_balkan_situation.127.b: "Order these irregulars to disband."
 turkfm_balkan_situation.128.t: "Local Garrison Fires into Crowd"
 turkfm_balkan_situation.128.d: "Protests in [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName] have gone awry. Following clashes between [GetReligion('sunni').GetName] and [SCOPE.sCulture('turkfm_tension_culture_scope').GetName] protesters, an untrained and jittery garrison fired into the crowd. Casualties currently number in the dozens and counting."
 turkfm_balkan_situation.128.f: ""The town has been pillaged and destroyed ... It is impossible to estimate the number of killed. The corpses lie scattered through the streets. Friday, when I went out, I had to pick my way between the dead to avoid stepping on them." -Rev. Herbert Gibbons"
 turkfm_balkan_situation.128.a: "Recall the garrison."
 turkfm_balkan_situation.128.b: "Let the garrison enforce order as they see fit."
 turkfm_balkan_situation.129.t: "Railways Bombed in State"
 turkfm_balkan_situation.129.d: "Radicals in [SCOPE.sState('turkfm_tension_state_scope').GetName] have bombed a major rail line to [SCOPE.sState('turkfm_tension_state_scope').GetCityHubName]. While casualties are limited, this has shaken confidence in the $turkfm_porte$'s ability to enforce safety within the Empire."
 turkfm_balkan_situation.129.f: "Repairs will be quick, but public confidence in our ability to assure their safety has taken a vital blow."
 turkfm_balkan_situation.129.a: "This is unacceptable."
 turkfm_balkan_situation.129.b: "Release funds to aid in repairs."

 turkfm_balkan_situation.130.t: "Dragoman Reduces Tensions"
 turkfm_balkan_situation.130.d: "A meeting between the Vizier of [SCOPE.sState('turkfm_tension_state_scope').GetName] and local [GetReligion('orthodox').GetName] leaders nearly devolved into chaos yesterday. Thankfully, a dragoman from the translation service was present to mediate and provide clarification that the conflict was entirely due to a cross-cultural misunderstanding."
 turkfm_balkan_situation.130.f: ""They are the tongue that speaks, the ear that hears, the eye that sees, the hand that gives, the spirit that acts, and on whom the life and success of every negotiation may depend." -Venetian ambassador regarding the dragomans"
 turkfm_balkan_situation.130.a: "Excellent work."
 turkfm_balkan_situation.131.t: "Inter-faith Dialogue"
 turkfm_balkan_situation.131.d: "A meeting to settle a dispute between the [GetReligion('sunni').GetName] and [GetReligion('orthodox').GetName] communities of [SCOPE.sState('turkfm_tension_state_scope').GetName] has proven more fruitful than expected and both parties have walked away feeling their concerns have been properly addressed."
 turkfm_balkan_situation.131.f: "Meetings between the Millet Patriarchs are fraught with potential for misunderstandings and escalations, yet sometimes, cooler heads can prevail."
 turkfm_balkan_situation.131.a: "Certainly surprising."
