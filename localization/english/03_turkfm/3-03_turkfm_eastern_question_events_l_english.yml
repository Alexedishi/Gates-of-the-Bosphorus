l_english:
 turkfm_eastern_question.001.t: "The Eastern Question"
 turkfm_eastern_question.001.d: "Across Europe, it is held as a certainty that the [SCOPE.sCountry('ottoman_scope').GetName] is in decline. As dissent spreads across the Empire, the government in [SCOPE.sCountry('ottoman_scope').GetCapital.GetCityHubName] has found itself grappling strife and separatism across its holdings."
 turkfm_eastern_question.001.f: "As the tenets of [GetTechnology('nationalism').GetName] emanate across the [GetStrategicRegion('region_balkans').GetName], many peoples begin to dream of a future where they determine their fate without the abuses of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] and [ROOT.GetCountry.GetRuler.GetHerHis] court. It will take all the efforts of the ailing imperial bureaucracy to exert the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s will over our flock.\n\n#white [ROOT.GetCountry.GetNameNoFlag] is [SCOPE.GetRootScope.GetCountry.GetCustom('turkfm_tension_involvement_type')] in the $turkfm_balkan_nationalism$ conflict.#!\n\nThe [GetStrategicRegion('region_balkans').GetName] are currently in the $turkfm_tension_status_short$ phase.\n\n#italic [ROOT.GetCountry.GetAdjectiveNoFlag] actions along with those of other participants will determine the future phases of the conflict and its eventual outcome.#!"
 turkfm_eastern_question.001.a: "We will have peace in our time."
