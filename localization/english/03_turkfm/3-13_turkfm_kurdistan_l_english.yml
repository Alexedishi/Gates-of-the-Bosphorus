l_english:
 # Journal Entry Groups
 je_group_turkfm_kurdistan: "Kurdistan Historical Content"

 # Journal Entries
 je_turkfm_kur_tribes: "The Tribes of Kurdistan"
 je_turkfm_kur_tribes_reason: "The [GetCulture('kurdish').GetName] have existed in relative isolation from the centralizing forces in the West. However, this increasing pressure form Constantinople, it has become clear that the only way forward is for [ROOT.GetCountry.GetNameNoFlag] to shed its tribal roots."

 je_turkfm_kur_unification: "The Unification of Kurdistan"
 je_turkfm_kur_unification_reason: "The [GetCulture('kurdish').GetName] people have called their lands home for countless centuries. As [GetTechnology('nationalism').GetName] spreads across the tribes, one thing has become clear: the only future for the Kurdish people is one under a united Kurdistan!"
 je_turkfm_kur_unification_complete: "[ROOT.GetCountry.GetNameNoFlag] has formed #bold $KUR$#!"
 je_turkfm_kur_heartlands: "The Lands of Kurdistan"
 je_turkfm_kur_heartlands_reason: ""
 je_turkfm_kur_heartlands_possible: "[ROOT.GetCountry.GetNameNoFlag] has formed #bold $KUR$#!"

 # Journal Entry Lobby Text
 je_turkfm_kur_tribes_lobby: "$gbbf_journal_lobby$\nThe [GetCulture('kurdish').GetName] have existed in relative isolation from the centralizing forces in the West. However, this increasing pressure form Constantinople, it has become clear that the only way forward is for the Kurds to shed their tribal roots."
 je_turkfm_kur_unification_lobby: "$gbbf_journal_lobby$\nThe [GetCulture('kurdish').GetName] people have called their lands home for countless centuries. As [GetTechnology('nationalism').GetName] spreads across the tribes, one thing has become clear: the only future for the Kurdish people is one under a united Kurdistan!"

