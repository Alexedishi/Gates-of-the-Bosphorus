l_english:
 # Journal Entry Groups
 je_group_turkfm_kurdistan: "Kurdistan Historical Content"

 # Journal Entries
 je_turkfm_kur_tribes: "The Tribes of Kurdistan"
 je_turkfm_kur_tribes_reason: "The [GetCulture('kurdish').GetName] have existed in relative isolation from the centralizing forces in the West. However, this increasing pressure form Constantinople, it has become clear that the only way forward is for [ROOT.GetCountry.GetNameNoFlag] to shed its tribal roots."

 je_turkfm_kur_heartlands: "The Lands of Kurdistan"
 je_turkfm_kur_heartlands_reason: "The [GetCulture('kurdish').GetName] people have called their lands home for countless centuries. As [GetTechnology('nationalism').GetName] spreads across the tribes, one thing has become clear: the only future for the Kurdish people is one under a united Kurdistan!"
 je_turkfm_kur_heartlands_complete: "[ROOT.GetCountry.GetNameNoFlag] has formed #bold $KUR$#!"

 # Modifiers
 modifier_turkfm_tribal_state: "Tribal State"
 modifier_turkfm_centralized_tribe: "Centralized Tribe"
 modifier_turkfm_miri_miran_country: "Mir-i Miran"
 modifier_turkfm_miri_miran_leader: "Mir-i Miran"

 # Scripted Buttons
 turkfm_claim_miri_miran_button: "Claim the Title of Mir-i Miran"
 turkfm_claim_miri_miran_button_desc: "Split across dozens of small tribal holdings, the [GetCulture('kurdish').GetName] people answer to no single dominant power. As a new age dawns on the world, so do new ambitions amongst the tribal leader to see themselves recognized as the master of Kurdistan."
 turkfm_claim_miri_miran_button_possible: "[ROOT.GetCountry.GetNameNoFlag] is the [concept_overlord] of all other [GetCulture('kurdish').GetName] tribes"