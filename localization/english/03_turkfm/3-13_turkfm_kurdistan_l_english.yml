 # Scripted Buttons
 turkfm_claim_miri_miran_button: "Claim the Title of Mir-i Miran"
 turkfm_claim_miri_miran_button_desc: "Split across dozens of small tribal holdings, the [GetCulture('kurdish').GetName] people answer to no single dominant power. As a new age dawns on the world, so do new ambitions amongst the tribal leader to see themselves recognized as the master of Kurdistan."
 turkfm_claim_miri_miran_button_possible: "[ROOT.GetCountry.GetNameNoFlag] is the [concept_overlord] of all other [GetCulture('kurdish').GetName] tribes"
 turkfm_organize_kurdistan_button: "Organize the $dyn_c_kurdistan_eyalet$"
 turkfm_organize_kurdistan_button_desc: "For centuries, the $turkfm_porte$ has struggled to assert control over the [GetCulture('kurdish').GetName] tribes. In lieu of direct rule, some ministers have suggested organizing Kurdistan under a regional governor as a means to erode the autonomy of the tribes."
 turkfm_organize_kurdistan_button_erzurum_possible: "All of [GetStateRegion('STATE_ERZURUM').GetName] is owned by the [ROOT.GetCountry.GetNameNoFlag] and its $subject_type_puppet$s"
 turkfm_organize_kurdistan_button_diyarbakir_possible: "All of [GetStateRegion('STATE_DIYARBAKIR').GetName] is owned by the [ROOT.GetCountry.GetNameNoFlag] and its $subject_type_puppet$s"
 turkfm_organize_kurdistan_button_deir_ez_zor_possible: "All of [GetStateRegion('STATE_DEIR_EZ_ZOR').GetName] is owned by the [ROOT.GetCountry.GetNameNoFlag] and its $subject_type_puppet$s"
 turkfm_organize_kurdistan_button_mosul_possible: "All of [GetStateRegion('STATE_MOSUL').GetName] is owned by the [ROOT.GetCountry.GetNameNoFlag] and its $subject_type_puppet$s"
 turkfm_organize_kurdistan_button_urmia_possible: "All of [GetStateRegion('STATE_URMIA').GetName] is owned by the [ROOT.GetCountry.GetNameNoFlag] and its $subject_type_puppet$s"
 turkfm_organize_kurdistan_button_persian_kurdistan_possible: "All of [GetStateRegion('STATE_PERSIAN_KURDISTAN').GetName] is owned by the [ROOT.GetCountry.GetNameNoFlag] and its $subject_type_puppet$s"
 turkfm_organize_kurdistan_button_erzurum_effect: "[GetStateRegion('STATE_ERZURUM').GetName] will be included in #bold Kurdistan#!"
