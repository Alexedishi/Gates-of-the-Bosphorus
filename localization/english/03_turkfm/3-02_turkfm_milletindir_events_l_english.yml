l_english:
 turkfm_milletindir.001.t: "A \"Turkish\" State"
 turkfm_milletindir.001.d: ""
 turkfm_milletindir.001.f: "\"Within the political and social unity of today's Turkish nation, there are citizens and co-nationals who have been incited to think of themselves as Kurds, Circassians, Laz or Bosnians. But these erroneous appellations - the product of past periods of tyranny - have brought nothing but sorrow to individual members of the nation, with the exception of a few brainless reactionaries, who became the enemy's instruments.\" —Mustafa Kemal Atatürk, 1930"
 turkfm_milletindir.001.a: ""
 turkfm_milletindir.001.tt: "Nationalist thinkers have proposed the following models for the foundation of the Turkish State:\n • $turkfm_kemalism$\n • $turkfm_turanism$\n • $turkfm_anatolianism$"
 turkfm_milletindir.002.t: ""
 turkfm_milletindir.002.d: ""
 turkfm_milletindir.002.f: ""
 turkfm_milletindir.002.a: ""
 turkfm_milletindir.002.b: ""
 
 turkfm_milletindir.010.t: "Restoring Anadolu"
 turkfm_milletindir.010.d: "The $dyn_c_ottoman_empire$ has fallen and in its place remains the [ROOT.GetCountry.GetAdjective] State. Untold numbers of our countrymen are now subjects to foreign governments, each as oppressive as the next. It falls to [ROOT.GetCountry.GetNameNoFormatting] to reunite the fractured [GetCulture('turkish').GetName] landscape."
 turkfm_milletindir.010.f: "\"I do not order you to fight, I order you to die. In the time which passes until we die, other troops and commanders can come forward and take our places\" —Mustafa Kemal Atatürk, at the Battle of Gallipoli, 25 April 1915"
 turkfm_milletindir.010.a: "We will reclaim [GetGeographicRegion('geographic_region_anatolia').GetName]."
 turkfm_milletindir.010.b: "The empire is dead. We will forge a new path."
