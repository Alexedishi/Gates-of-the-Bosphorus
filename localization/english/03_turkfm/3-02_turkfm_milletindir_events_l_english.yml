l_english:
 turkfm_milletindir.001.t: "A \"Turkish\" State"
 turkfm_milletindir.001.d: "The Ottoman Empire is dead, and in its heartlands, the [ROOT.GetCountry.GetAdjective] state has emerged. As the new nation seeks to find its footing, many have asked.\" What is a 'Turk?'\""
 turkfm_milletindir.001.f: "\"Within the political and social unity of today's Turkish nation, there are citizens and co-nationals who have been incited to think of themselves as Kurds, Circassians, Laz or Bosnians. But these erroneous appellations - the product of past periods of tyranny - have brought nothing but sorrow to individual members of the nation, with the exception of a few brainless reactionaries, who became the enemy's instruments.\" —Mustafa Kemal Atatürk, 1930"
 turkfm_milletindir.001.a: "We will claim our future."
 turkfm_milletindir.001.tt: "Nationalist thinkers have proposed the following models for the foundation of the Turkish State:\n • $turkfm_kemalism$\n • $turkfm_turanism$\n • $turkfm_anatolianism$"
 turkfm_milletindir.002.t: "The Identity of the State"
 turkfm_milletindir.002.d: ""
 turkfm_milletindir.002.f: ""
 turkfm_milletindir.002.a: "The state will be a pillar of order!"
 turkfm_milletindir.002.b: "The state shall be beacon of progress!"
 
 turkfm_milletindir.010.t: "Restoring Anadolu"
 turkfm_milletindir.010.d: "The $dyn_c_ottoman_empire$ has fallen and in its place remains the [ROOT.GetCountry.GetAdjective] State. Untold numbers of our countrymen are now subjects to foreign governments, each as oppressive as the next. It falls to [ROOT.GetCountry.GetNameNoFormatting] to reunite the fractured [GetCulture('turkish').GetName] landscape."
 turkfm_milletindir.010.f: "\"I do not order you to fight, I order you to die. In the time which passes until we die, other troops and commanders can come forward and take our places\" —Mustafa Kemal Atatürk, at the Battle of Gallipoli, 25 April 1915"
 turkfm_milletindir.010.a: "We will reclaim [GetGeographicRegion('geographic_region_anatolia').GetName]."
 turkfm_milletindir.010.b: "The empire is dead. We will forge a new path."
 turkfm_milletindir.011.t: "Anadolu Reclaimed"
 turkfm_milletindir.011.d: "Reaching out from [ROOT.GetCountry.GetCapital.GetCityHubName], the armies of [ROOT.GetCountry.GetName] have restored [GetCulture('turkish').GetName] control over [GetGeographicRegion('geographic_region_anatolia').GetName]."
 turkfm_milletindir.011.f: ""
 turkfm_milletindir.011.a: "From the ashes, we rise anew."
 turkfm_milletindir.011.b: "Let us inaugurate renewed prosperity."
 turkfm_milletindir.012.t: "Broken Ambitions"
 turkfm_milletindir.012.d: "Despite bold efforts and impassioned speeches, it has become clear that our irredentist project is untenable. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastName] has already taken responsibility for this humiliating failure."
 turkfm_milletindir.012.f: ""
 turkfm_milletindir.012.a: "What will become of [ROOT.GetCountry.GetName]?"
 turkfm_milletindir.013.t: "The Wolf Howls"
 turkfm_milletindir.013.d: "Despite the collapse of the empire, [ROOT.GetCountry.GetName] stands stronger than ever. Both politicians and intellectuals alike have clamored for the [GetCulture('turkish').GetName] to reclaim the lands unfairly striped from her."
 turkfm_milletindir.013.f: ""
 turkfm_milletindir.013.a: "We will raise the standard of the empire once more!"
 turkfm_milletindir.013.b: "The empire is dead. We will forge a new future."
 turkfm_milletindir.014.t: "A Turkish Empire"
 turkfm_milletindir.014.d: "By the blood and sweat of our armies, the empire has been restored. From the Danube to the Nile, none can question our rule."
 turkfm_milletindir.014.f: ""
 turkfm_milletindir.014.a: "Glory to the [GetCulture('turkish').GetName] people!"
 turkfm_milletindir.014.b: "Glory to [ROOT.GetCountry.GetName]!"
 turkfm_milletindir.015.t: "Broken Ambitions"
 turkfm_milletindir.015.d: "Despite bold efforts and impassioned speeches, it has become clear that our irredentist project is untenable. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastName] has already taken responsibility for this humiliating failure."
 turkfm_milletindir.015.f: ""
 turkfm_milletindir.015.a: "What will become of [ROOT.GetCountry.GetName]?"
 turkfm_milletindir.016.t: "The Turanist Project"
 turkfm_milletindir.016.d: ""
 turkfm_milletindir.016.f: "\"Right across northern Europe and Asia, from the Baltic to the Pacific and from the Mediterranean to the Arctic Ocean, there stretches a vast band of peoples... who are more generally termed "Turanians".... Diverse though they are in culture, tradition, and even physical appearance... what is of even more import, their physical and mental make-up displays undoubted affinities.\" —Ziya Gökalp, 1917"
 turkfm_milletindir.016.a: ""
 turkfm_milletindir.016.b: ""
 turkfm_milletindir.017.t: "Great Turan United"
 turkfm_milletindir.017.d: ""
 turkfm_milletindir.017.f: "\"For the Turks, Fatherland means neither Turkey, nor Turkestan; Fatherland is a large and eternal country--Turan!\" —Ziya Gökalp, 1911"
 turkfm_milletindir.017.a: "Our Empire will be eternal!"
 turkfm_milletindir.018.t: "Turanism Defeated"
 turkfm_milletindir.018.d: "Despite bold efforts and impassioned speeches, it has become clear that our irredentist project is untenable. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastName] has already taken responsibility for this humiliating failure."
 turkfm_milletindir.018.f: ""
 turkfm_milletindir.018.a: "What will become of [ROOT.GetCountry.GetName]?"
 
 turkfm_milletindir.100.t: "A Scapegoat for Collapse"
 turkfm_milletindir.100.d: "The fracturing of the empire has sent shockwaves across our [GetCulture('turkish').GetName] population. Seeking a target for the blame, many have set themselves upon the [GetCulture('armenian').GetName] in the East."
 turkfm_milletindir.100.f: "\"If a man is killed in Paris, it is a murder; the throats of fifty thousand people are cut in the East, and it is a question.\" —Victor Hugo"
 turkfm_milletindir.100.a: "These are the end times."
 turkfm_milletindir.100.tt: "Failing to halt these expulsions will have #red #bold catastrophic#!#! consequences for [GetCulture('armenian').GetName] pops in [ROOT.GetCountry.GetName]"
 turkfm_milletindir.101.t: "An Anatolian Frontier"
 turkfm_milletindir.101.d: "The census-takers have certified the end of our grisly works. The East will be a frontier for [GetCulture('turkish').GetName] settlers."
 turkfm_milletindir.101.f: "\"We have been blamed for not making a distinction between guilty and innocent Armenians.... The concern for the safety of Turkey simply had to silence all other concerns.\" —Mehmed Talât Pasha, 4 May 1916"
 turkfm_milletindir.101.a: "Onward!"
 turkfm_milletindir.102.t: "Cultural Reparations"
 turkfm_milletindir.102.d: "The campaigns against the [GetCulture('armenian').GetName] have been halted. Now the question remains—how shall the state make amends?"
 turkfm_milletindir.102.f: "\"Now, let's suppose that Nikolai does something bad: Does this give one the right to drive five or six hundred Apostolic Christians into the mountains, loot their property, and slaughter them? The issue... was not deportation, it was annihilation.\" —Yorgi Yuvandis Efendi of Trabzon"
 turkfm_milletindir.102.a: "Their residency is compensation enough."
 turkfm_milletindir.102.b: "Set up a support fund."
 turkfm_milletindir.103.t: "Death Marches"
 turkfm_milletindir.103.d: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s morning meeting has ended in an impasse. At issue is credible information from the diplomatic service indicating that the [SCOPE.sCountry('ottoman_scope').GetName] is in the process of brutalizing its [GetCulture('armenian').GetName] populations."
 turkfm_milletindir.103.f: "\"...our Armenian policy is absolutely fixed and that nothing can change it. We will not have the Armenians anywhere in Anatolia. They can live in the desert but nowhere else.\" —Mehmed Talât Pasha to US ambassador, Henry Morgenthau, 2 August 1915"
 turkfm_milletindir.103.a: "Issue a formal protest."
 turkfm_milletindir.103.b: "This is no concern of ours."
 turkfm_milletindir.103.c: "We will not tolerate these atrocities!"
 turkfm_milletindir.104.t: "Armenian Expulsions Halted"
 turkfm_milletindir.104.d: "With decisive resolve, [ROOT.GetCountry.GetName] has struck down the brutal dislocations of the [SCOPE.sCountry('ottoman_scope').GetName]."
 turkfm_milletindir.104.f: "\"In the view of these ... crimes of Turkey against humanity and civilization ... the Allied governments announce publicly ... that they will hold personally responsible ... all members of the Ottoman Government and those of their agents who are implicated in such massacres.\" —Communique of the Triple Entente to the Ottoman Empire, 24 May 1915"
 turkfm_milletindir.104.a: "Justice is served."