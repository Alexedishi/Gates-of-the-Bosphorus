 turkfm_milletindir.100.t: "A Scapegoat for Collapse"
 turkfm_milletindir.100.d: ""
 turkfm_milletindir.100.f: "\"If a man is killed in Paris, it is a murder; the throats of fifty thousand people are cut in the East, and it is a question.\" —Victor Hugo"
 turkfm_milletindir.100.a: "These are the end times."
 turkfm_milletindir.100.tt: "Failing to halt these expulsions will have #red #bold catastrophic#!#! consequences for [GetCulture('armenian').GetName] pops in [ROOT.GetCountry.GetName]"
 turkfm_milletindir.101.t: "An Anatolian Frontier"
 turkfm_milletindir.101.d: ""
 turkfm_milletindir.101.f: "\"We have been blamed for not making a distinction between guilty and innocent Armenians.... The concern for the safety of Turkey simply had to silence all other concerns.\" —Mehmed Talât Pasha, 4 May 1916"
 turkfm_milletindir.101.a: ""
 turkfm_milletindir.102.t: "Cultural Reparations"
 turkfm_milletindir.102.d: ""
 turkfm_milletindir.102.f: "\"Now, let's suppose that Nikolai does something bad: Does this give one the right to drive five or six hundred Apostolic Christians into the mountains, loot their property, and slaughter them? The issue... was not deportation, it was annihilation.\" —Yorgi Yuvandis Efendi of Trabzon"
 turkfm_milletindir.102.a: ""
 turkfm_milletindir.102.b: ""
 turkfm_milletindir.103.t: "Death Marches"
 turkfm_milletindir.103.d: ""
 turkfm_milletindir.103.f: "\"...our Armenian policy is absolutely fixed and that nothing can change it. We will not have the Armenians anywhere in Anatolia. They can live in the desert but nowhere else.\" —Mehmed Talât Pasha to US ambassador, Henry Morgenthau, 2 August 1915"
 turkfm_milletindir.103.a: ""
 turkfm_milletindir.103.b: ""
 turkfm_milletindir.103.c: ""
 turkfm_milletindir.104.t: "Armenian Expulsions Halted"
 turkfm_milletindir.104.d: ""
 turkfm_milletindir.104.f: "\"In the view of these ... crimes of Turkey against humanity and civilization ... the Allied governments announce publicly ... that they will hold personally responsible ... all members of the Ottoman Government and those of their agents who are implicated in such massacres.\" —Communique of the Triple Entente to the Ottoman Empire, 24 May 1915"
 turkfm_milletindir.104.a: ""