 turkfm_milletindir.016.t: "The Turanist Project"
 turkfm_milletindir.016.d: ""
 turkfm_milletindir.016.f: "\"Right across northern Europe and Asia, from the Baltic to the Pacific and from the Mediterranean to the Arctic Ocean, there stretches a vast band of peoples... who are more generally termed "Turanians".... Diverse though they are in culture, tradition, and even physical appearance... what is of even more import, their physical and mental make-up displays undoubted affinities.\" —Ziya Gökalp, 1917"
 turkfm_milletindir.016.a: ""
 turkfm_milletindir.016.b: ""
 turkfm_milletindir.017.t: "Great Turan United"
 turkfm_milletindir.017.d: ""
 turkfm_milletindir.017.f: "\"For the Turks, Fatherland means neither Turkey, nor Turkestan; Fatherland is a large and eternal country--Turan!\" —Ziya Gökalp, 1911"
 turkfm_milletindir.017.a: ""
 turkfm_milletindir.017.b: ""
