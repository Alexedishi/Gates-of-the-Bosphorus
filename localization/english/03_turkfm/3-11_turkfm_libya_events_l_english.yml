 turkfm.1118.t: "$turkfm_senusiyya$ Takes Root in [SCOPE.sState('turkfm_senussi_state_scope').GetName]"
 turkfm.1118.d: "Adherents of the $turkfm_senusiyya_movement$ have made significant inroads into [SCOPE.sState('turkfm_senussi_state_scope').GetCityHubName] and established several lodges across [SCOPE.sState('turkfm_senussi_state_scope').GetName]. It will take significant effort to dislodge them now."
 turkfm.1118.f: "Centralized administration has encountered opposition from the populace who decry increased taxation and the erosion of their traditional autonomy. This has given the $turkfm_senusiyya_movement$ a wedge to find popular support."
 turkfm.1118.a: "We must keep them in their lane."
 turkfm.1118.b: "The state must take action."
 turkfm.1119.t: "$turkfm_senusiyya$ Expunged From [SCOPE.sState('turkfm_senussi_state_scope').GetName]"
 turkfm.1119.d: "Leaders of the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] have succeeded in pushing the $turkfm_senusiyya_movement$ out of [SCOPE.sState('turkfm_senussi_state_scope').GetCityHubName] and from their lodges across [SCOPE.sState('turkfm_senussi_state_scope').GetName]."
 turkfm.1119.f: "By repelling the $turkfm_senusiyya_movement$ from our urban centers, the "
 turkfm.1119.a: "The [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] are the only authority in [ROOT.GetCountry.GetName]."