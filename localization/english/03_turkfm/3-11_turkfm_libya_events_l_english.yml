l_english:
 turkfm_libya.001.t: "On the Margins of the Empire"
 turkfm_libya.001.d: "[ROOT.GetCountry.GetName] is less a country than it is an imperial outpost. For centuries these lands along the mediterranean have served as extensions of foreign empires. From the urban hubs of [GetStateRegion('STATE_TRIPOLI').GetName] and [GetStateRegion('STATE_LIBYA').GetName] to the expanses of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName], life has continued relatively unchanged across the centuries across the rise and fall of empires."
 turkfm_libya.001.f: "With its recent reintegration into the [ROOT.GetCountry.GetPowerBloc.GetName], [ROOT.GetCountry.GetOverlord.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetOverlord.GetRuler.GetFirstName] in [GetStateRegion('STATE_EASTERN_THRACE').GetCityHubName] has given [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] a mandate to enforce a centralized and effective administration in [ROOT.GetCountry.GetNameNoFlag]."
 turkfm_libya.001.a: "[ROOT.GetCountry.GetName] will find its way."
