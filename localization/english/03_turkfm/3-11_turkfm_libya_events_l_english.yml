 turkfm_libya.006.t: "The Senusiyya Movement Extinguished"
 turkfm_libya.006.d: "In accordance with the mandate of the $turkfm_porte$, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has driven back the adherents of the $turkfm_senusiyya_movement$ and ensured the extinction of their school of thought."
 turkfm_libya.006.f: "By securing the country against the followers of Senussi, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has also secured the dominance of [GetCulture('turkish').GetName] influence over [ROOT.GetCountry.GetName]."
 turkfm_libya.006.a: "The [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] will guide [ROOT.GetCountry.GetName]."
 turkfm_libya.007.t: "House Senussi of [ROOT.GetCountry.GetName]"
 turkfm_libya.007.d: "Arriving flanked by cheering crowds, [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName], the head of the $turkfm_senusiyya_movement$, has taken the throne of "
 turkfm_libya.007.f: ""
 turkfm_libya.007.a: "The $turkfm_senusiyya_movement$ will guide [ROOT.GetCountry.GetName]"
 turkfm_libya.008.t: "The Libyan Deserts"
 turkfm_libya.008.d: "Through concerted efforts, the [ROOT.GetCountry.GetAdjective] government has succeeded in taming the frontier of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName] and has brought this vital link to the south under state control."
 turkfm_libya.008.f: "While often construed as a wasteland by Europeans, the deserts have long hosted a flourishing network of nomadic peoples."
 turkfm_libya.008.a: "These lands belong to [ROOT.GetCountry.GetName]"
 turkfm_libya.009.t: "A Centralized State"
 turkfm_libya.009.d: "In a heavily rehearsed ceremony, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] proclaimed the restructuring of [ROOT.GetCountry.GetName] and has elevated the law of the state above that of the tribes."
 turkfm_libya.009.f: "One by one, the tribal heads have sworn their allegiance to the central authority in [ROOT.GetCountry.GetCapital.GetCityHubName]. With their support, the will of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] will reach even to the deserts."
 turkfm_libya.009.a: "This is a great day for [ROOT.GetCountry.GetName]!"

 turkfm.1110.t: "The Senussi Order"
 turkfm.1110.d1: "An unassuming [GetReligion('sunni').GetName] scholar, [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName], has arrived in [ROOT.GetCountry.GetNameNoFlag]. In advocating for reform of [GetReligion('sunni').GetName] Islam and independence from [ROOT.GetCountry.GetOverlord.GetName], he has gained recognition amongst the [GetCulture('bedouin').GetName] tribes of the desert."
 turkfm.1110.d2: "Adherents of the [GetReligion('sunni').GetName] scholar, [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName], have arrived in [ROOT.GetCountry.GetNameNoFlag]. Bringing with their peculiar brand of $turkfm_senusiyya$ thought, they have gained recognition amongst the [GetCulture('bedouin').GetName] tribes of the desert."
 turkfm.1110.f1: "Outside of the major towns, spiritual life in the [GetStateRegion('STATE_LIBYAN_DESERT').GetName] is guided less by the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] and more by itinerant preachers known by the term [GetCharacterTrait('trait_turkfm_marabout').GetName]. These figures often act as tribal mediators and intermediaries between state authorities and tribal leaders."
 turkfm.1110.f2: "Outside of the major towns, spiritual life in the [GetStrategicRegion('region_sahara').GetName] is guided less by the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] and more by itinerant preachers known by the term [GetCharacterTrait('trait_turkfm_marabout').GetName] These figures often act as tribal mediators and intermediaries between state authorities and tribal leaders."
 turkfm.1110.a: "This could be troublesome."
 turkfm.1111.t: "The Grand Senussi"
 turkfm.1111.d: "#yellow Muhammad ibn Ali#! has died. In his place, his son [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName], has risen to head the $turkfm_senusiyya$ Order. Hailed as the "Mahdi" or "Great One," he is poised to lead the order to greater influence."
 turkfm.1111.f: "While [SCOPE.sCharacter('turkfm_senussi_character_scope').GetLastName] has refused to claim the title of "Mahdi," that has done little to dissuade adherents of the order from proclaiming him to a be saint in the making."
 turkfm.1111.a: "Definitely troublesome."
 turkfm.1112.t: "Senussi Withdraws to the Desert"
 turkfm.1112.d: "In response to increased scrutiny by [ROOT.GetCountry.GetNameNoFlag], [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName] has relocated his operations deep into the deserts of [SCOPE.sCountry('kufra_scope').GetNameNoFlag] in the hopes of evading our patrols."
 turkfm.1112.f: "While much harsher an environment than the cities and oases, the deserts offer ample places to hide from the eyes of the state."
 turkfm.1112.a: "Serves them right."
 turkfm.1113.t: "Armed Diplomacy"
 turkfm.1113.d: "Our armed delegation has arrived at [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFirstName]'s base of operations in [SCOPE.sCountry('kufra_capital_scope').GetName]. Following a tense exchange with , [SCOPE.sCharacter('turkfm_senussi_character_scope').GetLastName] has nominally agreed to minimize interference with [ROOT.GetCountry.GetAdjectiveNoFlag] administration."
 turkfm.1113.f: "While discussions were cordial, [SCOPE.sCharacter('turkfm_senussi_character_scope').GetLastName] appeared to understand the nature of our visit."
 turkfm.1113.a: "Let this be a message."
 turkfm.1114.t: "The State-within-a-State"
 turkfm.1114.d: "As the influence of the $turkfm_senusiyya_movement$ continues to grow in [ROOT.GetCountry.GetNameNoFlag], [SCOPE.sCharacter('turkfm_senussi_character_scope').GetFullName] has proposed the organization of his adherents and their lodges into a "state-within-a-State.""
 turkfm.1114.f: "While wrapped in the noble cause of defending his followers, the Grand Senussi threatens the supremacy of the Sultan in state and social affairs."
 turkfm.1114.a: "This is concerning."
