l_english:
 turkfm_sick_man.001.t: "The Sick Man of Europe"
 turkfm_sick_man.001.d: "Across Europe, it is held as a certainty that the [ROOT.GetCountry.GetName] is in decline. As dissent spreads across the [ROOT.GetCountry.GetPowerBloc.GetName], the government in [ROOT.GetCountry.GetCapital.GetCityHubName] finds itself grappling with strife and separatism across the its holdings. Between unruly subjects, undeveloped infrastructure, and ineffective government, the Empire appears like a house of cards, waiting for one last gust of wind before collapsing upon itself."
 turkfm_sick_man.001.f: "Every year, the European eye turns more towards the [Concept('concept_eastern_question','$concept_eastern_question$')]. Like vultures to a corpse, the Great Powers have begun efforts to enforce their designs for the [GetStrategicRegion('region_balkans').GetName] and beyond without regard for the desires of local populations. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has remained defiant, and it will take all we have to stand against the designs of the European empires."
 turkfm_sick_man.001.a: "The [ROOT.GetCountry.GetName] must find its way."

 turkfm_sick_man.005.t: "Control Over [SCOPE.sStrategicRegion('turkfm_sregion_scope').GetName] Lost"
 turkfm_sick_man.005.d: "Our setbacks in the [SCOPE.sStrategicRegion('turkfm_sregion_scope').GetName] [concept_strategic_region] have broken our perceived dominance over the region. This only serves to ability the narrative of the "Sick Man.\""
 turkfm_sick_man.005.f: "\"We have a sick man on our hands, a man gravely ill, it will be a great misfortune if one of these days he slips through our hands, especially before the necessary arrangements are made.\" -$GBR_ADJ$ Ambassador G. H. Seymour"
 turkfm_sick_man.005.a: "This cannot stand!"
 turkfm_sick_man.006.t: "Control Over [SCOPE.sStrategicRegion('turkfm_sregion_scope').GetName] Secured"
 turkfm_sick_man.006.d: "Our advances in the [SCOPE.sStrategicRegion('turkfm_sregion_scope').GetName] [concept_strategic_region] have restored our dominance over the region. The west would do well to heed our ascent."
 turkfm_sick_man.006.f: "\"Justice should be strong, and the strong should be just.\" -Sultan Abdulaziz"
 turkfm_sick_man.006.a: "Excellent News."
 turkfm_sick_man.007.t: "The Empire Shattered"
 turkfm_sick_man.007.d: "The [SCOPE.sCountry('ottoman_scope').GetName] has failed to modernize and re-assert itself on the world stage. The vultures begin to circle as the last days of the Empire draw near. In the midst of this chaos, [ROOT.GetCountry.GetName] must choose: Will we remain with the Empire or break free from the Sultan's grip?"
 turkfm_sick_man.007.f: "The $turkfm_sublime_porte$ falls silent. For days after conceding the failure of the Tanzimât, the [SCOPE.sCharacter('ottoman_ruler_scope').GetPrimaryRoleTitle] has been secluded in [SCOPE.sCharacter('ottoman_ruler_scope').GetHerHis] chambers. Much like [SCOPE.sCharacter('ottoman_ruler_scope').GetHerHis] precious empire, the [SCOPE.sCharacter('ottoman_ruler_scope').GetPrimaryRoleTitle] had been suffering from a long, creeping sickness that ultimately made [SCOPE.sCharacter('ottoman_ruler_scope').GetHerHim] unable to bear the weight of the kavuk of state."
 turkfm_sick_man.007.a: "We cannot survive this world alone."
 turkfm_sick_man.007.b: "[ROOT.GetCountry.GetName] will forge its own destiny."
 turkfm_sick_man.008.t: "The Dead Man of Europe"
 turkfm_sick_man.008.d: ""
 turkfm_sick_man.008.f: "The $turkfm_sublime_porte$ falls silent. For days, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been secluded in his [ROOT.GetCountry.GetRuler.GetHerHis] chambers, paying little heed to the dire news from our borders. But there can be no question: the Sick Man is dead. There will be no revival."
 turkfm_sick_man.008.a: "We belong to Allah, and to Him do we return."
 turkfm_sick_man.009.t: "The Healthy Man of Europe"
 turkfm_sick_man.009.d: "Against the tides of Nationalism and the industrial might of the West, the [ROOT.GetCountry.GetName] has not just survived, but has roared to life once more. The Sick Man is healed. Osman's Empire will be eternal."
 turkfm_sick_man.009.f: "With the Sword of Osman held high, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has declared a new Golden Age that promises enlightenment and prosperity to all [ROOT.GetCountry.GetAdjectiveNoFormatting] citizens."
 turkfm_sick_man.009.a: "By the grace of Allah, we will prevail."
 
 turkfm_sick_man.018.t: "A Consuming Sickness"
 turkfm_sick_man.018.d: "For weeks [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has shown signs of increasing illness and debility. Following an examination, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been diagnosed with [GetCharacterTrait('gbbf_trait_tuberculosis').GetName]."
 turkfm_sick_man.018.f: "A staple of the urban overcrowding, the White Death stalks the lands of the Empire, claiming both noble and peasant alike."
 turkfm_sick_man.018.a: "This is unfortunate."
 turkfm_sick_man.019.t: "The Ascent of [SCOPE.sCharacter('turkfm_heir_scope').GetFirstName]"
 turkfm_sick_man.019.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has been found dead in his chambers, his body withered by his disease. As [SCOPE.sCharacter('turkfm_heir_scope').GetFirstName] prepares to take the throne, jockeying has already begun between various ministers for positions in the new regime."
 turkfm_sick_man.019.f: "The largest danger of succession in the Empire comes from the machinations of the court, with nobles, scribes, and commanders each seeking to lull the new [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] into their grasp."
 turkfm_sick_man.019.a: "Tragic circumstances."
 turkfm_sick_man.019.b: "It is time for true reform."