l_english:
# Journal Entry Groups
 je_group_turkfm_tanzimat: "The Tanzimât Reforms"

# Journal Entries
 je_turkfm_tanzimat_main: "The Reorganization of the State"
 je_turkfm_tanzimat_main_reason: "$je_turkfm_tanzimat_main_flavor$\n$TOOLTIP_DELIMITER$\n$je_turkfm_tanzimat_main_reform$\n$TOOLTIP_DELIMITER$\n$je_turkfm_tanzimat_main_indentity$"
 je_turkfm_tanzimat_main_flavor: "For decades, the [ROOT.GetCountry.GetName] has been in steady decline, with the powers of Europe gnawing at its borders and unrest spreading across its minorities. In the face of these threats, Sultan #bold Mahmud II#! championed an era of reform, with the aim of creating a truly centralized bureaucracy to govern and unite the Empire. As western thought begins to permeate [ROOT.GetCountry.GetCapital.GetCityHubName], the spirit of reform and progress is in the air."
 je_turkfm_tanzimat_main_reform: "#white #bold Monthly $turkfm_tanzimat$ Progress:#!#!\n• $turkfm_reformist$ Momentum: #bold #green [GetPlayer.MakeScope.Var('turkfm_tanzimat_reformist_progress_var').GetValue|2]#!#! per month\n• $turkfm_conservatist$ Momentum: #bold #red [GetPlayer.MakeScope.Var('turkfm_tanzimat_conservatist_progress_var').GetValue|2]#!#! per month\n\nThis is expected to change by [GetPlayer.MakeScope.Var('turkfm_tanzimat_reform_progress_var').GetValue|+=] next month based on #tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_reformist_sources')] Reformist sources#!#! and #tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_conservatist_sources')] Conservatist sources#!#!."
 je_turkfm_tanzimat_main_indentity: "#white #bold Monthly $turkfm_imperial_identity$ Progress:#!#!\n• $turkfm_ottomanist$ Momentum: #bold #green [GetPlayer.MakeScope.Var('turkfm_tanzimat_ottomanist_progress_var').GetValue|2]#!#! per month\n• $turkfm_islamist$ Momentum: #bold #red [GetPlayer.MakeScope.Var('turkfm_tanzimat_islamist_progress_var').GetValue|2]#!#! per month\n\nCurrently, [SCOPE.GetRootScope.GetCountry.GetCustom('turkfm_tanzimat_identity_tilt_type')]\n\nThis is expected to [SCOPE.GetRootScope.GetCountry.GetCustom('turkfm_tanzimat_identity_progress_type')] next month based on #tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_ottomanist_sources')] Ottomanist sources#!#! and #tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_islamist_sources')] Islamist sources#!#!."

 je_turkfm_tanzimat_main_complete: "The [ROOT.GetCountry.GetNameNoFlag] has embraced an $turkfm_imperial_identity$"
 BULje_turkfm_tanzimat_main_on_complete_ottomanist: "If the [ROOT.GetCountry.GetNameNoFlag] has embraced the $turkfm_ottomanist$ $turkfm_identity$:\n#indent_newline:3 •Triggers the event #white #bold The Ottoman Motherland#!#!#!\n#indent_newline:3 •[GetCulture('ottoman').GetName] will become the [Concept('concept_primary_cultures','$concept_primary_culture$')] of the [ROOT.GetCountry.GetName]#!\n#indent_newline:3 •A large percentage of all [concept_pop]#o s#! will immediately adopt this [concept_culture]#!"
 BULje_turkfm_tanzimat_main_on_complete_islamist: "If the [ROOT.GetCountry.GetNameNoFlag] has embraced the $turkfm_islamist$ $turkfm_identity$:\n#indent_newline:3 •Triggers the event #white #bold The Eternal Caliphate#!#!#!"
 je_turkfm_tanzimat_main_fail: "The #bold $turkfm_tanzimat_reforms$#! progress bar has fallen to zero."
 je_turkfm_tanzimat_argiculture: "$turkfm_tanzimat$: Agricultural Reforms"
 je_turkfm_tanzimat_argiculture_reason: "Agricultural and land practices have languished as a result of centuries under Ottoman rule. The Empire is a rural one, sometimes even aggressively so. Reform must come lest the threat of famine and decay continue to take root."
 je_turkfm_tanzimat_army: "$turkfm_tanzimat$: Army Reforms"
 je_turkfm_tanzimat_army_reason: "The #bold Auspicious Incident#! saw the institution of the Janissary Order dismantled and their leaders expunged from the Ottoman court. Despite this, the army remains woefully disorganized and outdated."
 je_turkfm_tanzimat_bureaucracy: "$turkfm_tanzimat$: Bureaucratic Reforms"
 je_turkfm_tanzimat_bureaucracy_reason: "The "administration" of the Empire can hardly be described as such. Despite several attempts at reform, local beys continue to exercise autonomy, taxes are embezzled, and justice is informal. The Empire cannot hold itself together without a central authority."
 je_turkfm_tanzimat_economy: "$turkfm_tanzimat$: Economic Reforms"
 je_turkfm_tanzimat_economy_reason: "Despite centuries of connection to European markets, the Ottoman economy is mostly agricultural. The production of finished goods is relegated to artisans and guilds, and the Empire cannot hope to keep pace with Western production methods."
 je_turkfm_tanzimat_education: "$turkfm_tanzimat$: Education Reforms"
 je_turkfm_tanzimat_education_reason: "As the Empire lurches forward into modernity, the lack of formal educational institutions and widespread illiteracy have hamstrung both reforms and industry. While it comes with many risks, the Empire can longer suffer such widespread ignorance."
 je_turkfm_tanzimat_millet_reform: "$turkfm_tanzimat$: Millet Reforms"
 je_turkfm_tanzimat_millet_reform_reason: "The Millet System has served as one of the cornerstones of the Imperial order since the Fall of Constantinople. In practice, however, it is anything but systematic. In providing broad authority to its non-Muslim populations, the Empire has hamstrung its ability to effectively implement and exercise law. While each community may fear the loss of their unique privileges, we must standardize this practice."
 je_turkfm_tanzimat_security: "$turkfm_tanzimat$: Security Reforms"
 je_turkfm_tanzimat_security_reason: "Policing and Penal Codes are woefully disorganized throughout the Empire. While the Sultan rules by decree and provides security to the areas near [ROOT.GetCountry.GetCapital.GetCityHubName], beyond our capital, local beys and autonomous rulers exercise their own authority over their subjects."
 je_turkfm_tanzimat_slavery: "$turkfm_tanzimat$: Abolish the Slave Trade"
 je_turkfm_tanzimat_slavery_reason: "Even before the Sultan's entrenchment in Constantinople, the slave trade has been a driver of the Ottoman economy. Yet this practice has fallen out of favor in the "civilized" world, and its continued tolerance by the central administration has been used to assail the standing of the $turkfm_porte$. It may be time to reassess the continued existence of this institution."

 je_turkfm_tanzimat_young_ottomans: "The Young Ottomans"
 je_turkfm_tanzimat_young_ottomans_reason: "While [GetTechnology('nationalism').GetName] has been embraced by the peoples of the [GetStrategicRegion('region_balkans').GetName] the idea "
 je_turkfm_tanzimat_young_ottomans_fail: "The $turkfm_young_ottoman$ plot has reached #bold 100#! progress"
 je_turkfm_tanzimat_young_ottomans_status_1: "The $turkfm_young_ottoman$ plot will advance next month."
 je_turkfm_tanzimat_young_ottomans_status_2: "The $turkfm_young_ottoman$ plot will regress next month."
 je_turkfm_tanzimat_young_ottomans_status_3: "The $turkfm_young_ottoman$ plot will make no progress next month."

 je_turkfm_tanzimat_young_turks: "The Young Turks"
 je_turkfm_tanzimat_young_turks_reason: ""

