# Journal Entry Groups
 je_group_turkfm_tanzimat: "The Tanzimât Reforms"

# Journal Entries
 je_turkfm_tanzimat_main: "The Reorganization of the State"
 je_turkfm_tanzimat_main_reason: "For decades, the [ROOT.GetCountry.GetName] has been in steady decline, with the powers of Europe gnawing at its borders and unrest spreading across its minorities. In the face of these threats, Sultan #bold Mahmud II#! championed an era of reform, with the aim of creating a truly centralized bureaucracy to govern and unite the Empire. As western thought begins to permeate [ROOT.GetCountry.GetCapital.GetCityHubName], the spirit of reform and progress is in the air.\n$TOOLTIP_DELIMITER$\n#white Currently, [SCOPE.GetRootScope.GetCountry.GetCustom('turkfm_tanzimat_tilt_type')]\n\nThis is expected to [SCOPE.GetRootScope.GetCountry.GetCustom('turkfm_tanzimat_progress_type')] next month based on #tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_ottomanism_sources')] Ottomanist sources#!#! and #tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_islamism_sources')] Islamist sources#!#!."
 je_turkfm_tanzimat_main_complete: "The #bold Tanzimât#! progress bar has advanced by #bold 500 points#! towards the [GetIdeology('ideology_turkfm_ottomanist').GetName] movement"
 je_turkfm_tanzimat_main_fail: "The #bold Tanzimât#! progress bar has advanced by #bold 500 points#! towards the [GetIdeology('ideology_turkfm_islamist').GetName] movement"
 je_turkfm_tanzimat_argiculture: "Tanzimât: Agricultural Reforms"
 je_turkfm_tanzimat_argiculture_reason: "Agricultural and land practices have languished as a result of centuries under Ottoman rule. The Empire is a rural one, sometimes even aggressively so. Reform must come lest the threat of famine and decay continue to take root."
 je_turkfm_tanzimat_army: "Tanzimât: Army Reforms"
 je_turkfm_tanzimat_army_reason: "The #bold Auspicious Incident#! saw the institution of the Janissary Order dismantled and their leaders expunged from the Ottoman court. Despite this, the army remains woefully disorganized and outdated."
 je_turkfm_tanzimat_bureaucracy: "Tanzimât: Bureaucratic Reforms"
 je_turkfm_tanzimat_bureaucracy_reason: "The "administration" of the Empire can hardly be described as such. Despite several attempts at reform, local beys continue to exercise autonomy, taxes are embezzled, and justice is informal. The Empire cannot hold itself together without a central authority."
 je_turkfm_tanzimat_economy: "Tanzimât: Economic Reforms"
 je_turkfm_tanzimat_economy_reason: "Despite centuries of connection to European markets, the Ottoman economy is mostly agricultural. The production of finished goods is relegated to artisans and guilds, and the Empire cannot hope to keep pace with Western production methods."
 je_turkfm_tanzimat_education: "Tanzimât: Education Reforms"
 je_turkfm_tanzimat_education_reason: "As the Empire lurches forward into modernity, the lack of formal educational institutions and widespread illiteracy have hamstrung both reforms and industry. While it comes with many risks, the Empire can longer suffer such widespread ignorance."
 je_turkfm_tanzimat_millet_reform: "Tanzimât: Millet Reforms"
 je_turkfm_tanzimat_millet_reform_reason: "The Millet System has served as one of the cornerstones of the Imperial order since the Fall of Constantinople. In practice, however, it is anything but systematic. In providing broad authority to its non-Muslim populations, the Empire has hamstrung its ability to effectively implement and exercise law. While each community may fear the loss of their unique privileges, we must standardize this practice."
 je_turkfm_tanzimat_security: "Tanzimât: Security Reforms"
 je_turkfm_tanzimat_security_reason: "Policing and Penal Codes are woefully disorganized throughout the Empire. While the Sultan rules by decree and provides security to the areas near [ROOT.GetCountry.GetCapital.GetCityHubName], beyond our capital, local beys and autonomous rulers exercise their own authority over their subjects."
 je_turkfm_tanzimat_slavery: "Tanzimât: Abolish the Slave Trade"
 je_turkfm_tanzimat_slavery_reason: "Even before the Sultan's entrenchment in Constantinople, the slave trade has been a driver of the Ottoman economy. Yet this practice has fallen out of favor in the "civilized" world, and its continued tolerance by the central administration has been used to assail the standing of the $turkfm_porte$. It may be time to reassess the continued existence of this institution."

