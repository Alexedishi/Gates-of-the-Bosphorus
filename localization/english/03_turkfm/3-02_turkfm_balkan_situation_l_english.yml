l_english:
# Journal Entry Groups
 je_group_turkfm_separatism: "The Rise of Nationalism"

 # Journal Entries
 je_turkfm_balkan_situation_main: "The Rise of Nationalism"
 je_turkfm_balkan_situation_main_reason: "The subjects of the [ROOT.GetCountry.GetName] grow ever more rebellious as the ideals of [GetTechnology('nationalism').GetName] take root across the Empire. Already the Empire has been shaken by rebellions in Greece and Serbia, and the Russian Empire has secured seniority in the Romanian Principalities. All eyes now turn to the #bold Sultan#! to bring our [GetReligion('orthodox').GetName] subjects to heel.$turkfm_tension_details$"
 je_turkfm_balkan_situation_main_status: "$turkfm_tension_status_short$"
 je_turkfm_balkan_situation_main_complete: "The base [concept_acceptance]#o s#! of #bold all#! of the following [concept_culture]#o s#! are #bold 80 or Greater#!:\n•[GetCulture('greek').GetName]\n•[GetCulture('rhomaios').GetName]\n•[GetCulture('serb').GetName]\n•[GetCulture('bulgarian').GetName]\n•[GetCulture('bosniak').GetName]\n•[GetCulture('albanian').GetName]\n•[GetCulture('croat').GetName]\n•[GetCulture('slovene').GetName]

 je_turkfm_balkan_situation_riots: "Nationalist Insurrection"
 je_turkfm_balkan_situation_riots_reason: "#italic "... were, upon the whole, from the black day when they first entered Europe, the one great anti-human specimen of humanity. Wherever they went, a broad line of blood marked the track behind them; and as far as their dominion reached, civilisation disappeared from view. They represented everywhere government by force, as opposed to government by law. For the guide of this life they had a relentless fatalism: for its reward hereafter, a sensual paradise."#! -William Ewart Gladstone, 1876\n\nRioting has broken out in the [GetStrategicRegion('region_balkans').GetName]. Unless the $turkfm_porte$ manages to restore order, the separatism movement will take up arms against our authority.\n$TOOLTIP_DELIMITER$\n#white Currently, the Insurrectionists have mustered #bold #greece [GetPlayer.MakeScope.Var('turkfm_riot_var').GetValue]#!#! momentum. This is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_turkfm_balkan_situation_riots_breakdown [GetPlayer.MakeScope.Var('turkfm_riot_progress_var').GetValue|-=]#! next week.#!\n\nAt maximum momentum, [ROOT.GetCountry.GetNameNoFlag] will receive the following effects:\n[GetStaticModifier('modifier_turkfm_nationalist_insurrection').GetDesc]"
 je_turkfm_balkan_situation_riots_breakdown: "[Country.MakeScope.GetScriptValueDesc('turkfm_riot_progress_value')]"
 je_turkfm_balkan_situation_riots_complete: "[ROOT.GetCountry.GetNameNoFlag] is not involved in a [concept_diplomatic_play] against a #bold Nationalist Insurrection#!"
 je_turkfm_balkan_situation_riots_invalid: "The $turkfm_balkan_nationalism$ Conflict is #bold NOT#! in the $turkfm_hostility$ Phase"

