 turkfm_crisis_leader: "[ROOT.GetCountry.GetNameNoFlag] is  #o #tooltip:[GetRawTextTooltipTag('turkfm_crisis_leader_tt')] opposing#!#! the Ottomans\nWe will lead the [concept_diplomatic_play]"
 turkfm_crisis_leader_tt: "If #bold Crisis Progress#! reaches #bold 100#!, [ROOT.GetCountry.GetNameNoFlag] will join the war supporting the Ottomans. We will be the [concept_diplomatic_play] leader as we have the highest [concept_prestige] of all participating countries."
