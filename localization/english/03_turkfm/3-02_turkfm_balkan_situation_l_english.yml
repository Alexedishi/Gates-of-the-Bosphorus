 turkfm_escalation_factors_tt: "#white #bold Monthly Sources:#!#!\n•#bold #red +1#!:#! Base Monthly Progress\n•#bold #red +0.1#!x:#! Average [concept_radical] [concept_pop]#o s#! of $turkfm_balkfm_cultures$ (Max +8)\n•#bold #red +0.1#!x:#! Per Ottoman [concept_legitimacy] below 70 (max +3)\n•#bold #red +1#!x:#! Number of [concept_great_power]#o s#! #bold Accelerating Tensions#!\n•#bold #red +3#!:#! Per Month if [GetTechnology('nationalism').GetName] is present in any [GetStrategicRegion('region_balkans').GetName] [concept_subject]\n#white #bold Instant Sources:#!#!\n•#bold #red +3#!:#! Enforce a [concept_war_goal] on the Ottomans\n•#bold #red +3#!:#! Expel Diplomats as a non-[concept_great_power]\n•#bold #red +10#!:#! Reduce [concept_autonomy] of a [GetStrategicRegion('region_balkans').GetName] [concept_subject]\n•#bold #red +10#!:#! Expel Ottoman Diplomats as a [concept_great_power]\n•#bold #red +10#!:#! Enforce a [concept_humiliation] [concept_war_goal] on the Ottomans\n•#bold #red +10#!:#! Declare a [concept_rivalry] against the Ottomans as a [concept_great_power]"

 turkfm_deescalation_factors_tt: "#white #bold Monthly Sources:#!#!\n•#bold #green +1#!:#! Base Monthly Progress\n•#bold #green +.01x!:#! Average [concept_loyalist] [concept_pop]#o s#! of $turkfm_balkfm_cultures$ (Max +8)\n•#bold #green +0.1#!:#! From Ottoman [concept_legitimacy] above 70 (max +3)\n•#bold #green +1x#!:#! Number of countries Decelerating Tensions\n•#bold #green +1x#!:#! Bankroll [GetStrategicRegion('region_balkans').GetName] a [concept_subject] (per month)\n#white #bold Instant Sources:#!#!\n•#bold #green +5#!:#! Enforce a  [concept_war_goal] against a [concept_great_power]\n•#bold #green +10#!:#! Increase [concept_autonomy] of a [GetStrategicRegion('region_balkans').GetName] [concept_subject]\n•#bold #green +10#!:#! Declare an [concept_alliance] with the Ottomans as a [concept_great_power]\n•#bold #green +10#!:#! Increase the [concept_autonomy] of a [GetStrategicRegion('region_balkans').GetName] [concept_subject]\n•#bold #green +25#!:#! Grant a [GetStrategicRegion('region_balkans').GetName] Subject Independence"

