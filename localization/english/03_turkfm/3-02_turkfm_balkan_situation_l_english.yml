 # Tooltips
 turkfm_tension_involved_tt: "[ROOT.GetCountry.GetNameNoFlag] is $turkfm_involved$ in the $turkfm_balkan_nationalism$ Conflict"

 turkfm_balkan_nationalism: "#o #tooltip:[GetRawTextTooltipTag('turkfm_balkan_nationalism_concept')] Balkan Nationalism#!#!"
 turkfm_balkan_nationalism_concept: "#bold Separatist Tension#! in the Balkans is a measure of the resistance to Ottoman rule. Should tensions escalate, the #bold Ottoman Empire#! may face uprisings in the Balkans."
 turkfm_balkfm_cultures: "#o #tooltip:[GetRawTextTooltipTag('turkfm_balkfm_cultures_concept')] Balkan Cultures#!#!"
 turkfm_balkfm_cultures_concept: "[GetCulture('greek').GetName], [GetCulture('rhomaios').GetName], [GetCulture('serb').GetName], [GetCulture('bulgarian').GetName], [GetCulture('romanian').GetName], [GetCulture('albanian').GetName], [GetCulture('bosniak').GetName], [GetCulture('croat').GetName], and [GetCulture('slovene').GetName]."
 turkfm_involved: "#greece #tooltip:[GetRawTextTooltipTag('turkfm_involved_concept')] Involved#!#!"
 turkfm_involved_concept: "A [concept_country] is #bold Involved#! in the $turkfm_balkan_nationalism$ Conflict by either:\n•Being a [concept_subject] of the #bold Ottoman Empire#!\n•Having their [concept_capital_state] in the [GetStrategicRegion('region_balkans').GetName]\n•Having an [concept_alliance] with the #bold Ottoman Empire#!\n#italic Different Actions will be available to you depending on your level of involvement."
 turkfm_interloper: "#greece #tooltip:[GetRawTextTooltipTag('turkfm_interloper_concept')] An Interloper#!#!"
 turkfm_interloper_concept: "A [concept_country] is #bold An Interloper#! in the $turkfm_balkan_nationalism$ Conflict by either:\n•Having diplomatic content with the #bold Ottoman Empire#!\n•Directly controlling a state in the [GetStrategicRegion('region_balkans').GetName] while their [concept_capital_state] is in another [concept_strategic_region]\n•Having a [concept_subject] with its [concept_capital_state] in the [GetStrategicRegion('region_balkans').GetName]\n#italic Different Actions will be available to you depending on your level of involvement.\n$TOOLTIP_DELIMITER$\nA [concept_country] can become #bold Involved#! in the $turkfm_balkan_nationalism$ Conflict by either:\n•Being a [concept_subject] of the #bold Ottoman Empire#!\n•Having their [concept_capital_state] in the [GetStrategicRegion('region_balkans').GetName]\n•Having an [concept_alliance] with the #bold Ottoman Empire#!\n#italic Different Actions will be available to you depending on your level of involvement."
 turkfm_uninvolved: "#greece #tooltip:[GetRawTextTooltipTag('turkfm_uninvolved_concept')] Uninvolved#!#!"
 turkfm_uninvolved_concept: "A [concept_country] can become #bold An Interloper#! in the $turkfm_balkan_nationalism$ Conflict by either:\n•Having diplomatic content with the #bold Ottoman Empire#!\n•Directly controlling a state in the [GetStrategicRegion('region_balkans').GetName] while their [concept_capital_state] is in another [concept_strategic_region]\n•Having a [concept_subject] with its [concept_capital_state] in the [GetStrategicRegion('region_balkans').GetName]\n#italic Different Actions will be available to you depending on your level of involvement.\n$TOOLTIP_DELIMITER$\nA [concept_country] can become #bold Involved#! in the $turkfm_balkan_nationalism$ Conflict by either:\n•Being a [concept_subject] of the #bold Ottoman Empire#!\n•Having their [concept_capital_state] in the [GetStrategicRegion('region_balkans').GetName]\n•Having an [concept_alliance] with the #bold Ottoman Empire#!\n#italic Different Actions will be available to you depending on your level of involvement."

 turkfm_stable: "@turkfm_stable! #bold #green #tooltip:[GetRawTextTooltipTag('turkfm_stable_concept')] Stable#!#!#!"
 turkfm_stable_concept: "@turkfm_stable! #bold #green Stable#!#!\n$TOOLTIP_DELIMITER$\nOne of the phases in $turkfm_balkan_nationalism$ Conflict.\n\nAfter mending burned bridges during the $turkfm_deconfliction$ phase, people have slowly begun to remember what is was that brought them to blows in the first place. Eventually, disputes and misunderstandings will cause an escalation into the $turkfm_unrest$ phase.\n$TOOLTIP_DELIMITER$\nThis phase provides the following effects:\n[GetStaticModifier('modifier_turkfm_stable_phase').GetDesc]"
 turkfm_unrest: "@turkfm_unrest! #bold #yellow #tooltip:[GetRawTextTooltipTag('turkfm_unrest_concept')] Unrest#!#!#!"
 turkfm_unrest_concept: "@turkfm_unrest! #bold #yellow Unrest#!#!\n$TOOLTIP_DELIMITER$\nOne of the phases in $turkfm_balkan_nationalism$ Conflict.\n\nFear and paranoia have once again brought the peoples of the [GetStrategicRegion('region_balkans').GetName] into conflict with their [GetCulture('turkish').GetName] rulers. As discrimination and deception takes hold in the streets, further insults will cause an escalation into the $turkfm_hostility$ phase.\n$TOOLTIP_DELIMITER$\nThis phase provides the following effects:\n[GetStaticModifier('modifier_turkfm_unrest_phase').GetDesc]"
 turkfm_hostility: "@turkfm_hostility! #bold #red #tooltip:[GetRawTextTooltipTag('turkfm_hostility_concept')] Hostility#!#!#!"
 turkfm_hostility_concept: "@turkfm_hostility! #bold #red Hostility#!#!\n$TOOLTIP_DELIMITER$\nOne of the phases in $turkfm_balkan_nationalism$ Conflict.\n\nViolence has become routine across the [GetStrategicRegion('region_balkans').GetName] as widespread rejection of Ottoman rule takes root. Should the $turkfm_porte$ fail to restore order, this may cause an escalation to the $turkfm_crisis$ phase, given the right circumstances. Should these tensions go unresolved, they will eventually sputter out, causing a deescalation to the $turkfm_deconfliction$ phase.\n$TOOLTIP_DELIMITER$\nThis phase provides the following effects:\n[GetStaticModifier('modifier_turkfm_hosility_phase').GetDesc]"
 turkfm_deconfliction: "@turkfm_deconfliction! #bold #greece #tooltip:[GetRawTextTooltipTag('turkfm_deconfliction_concept')] Deconfliction#!#!#!"
 turkfm_deconfliction_concept: "@turkfm_deconfliction! #bold #greece Deconfliction#!#!\n$TOOLTIP_DELIMITER$\nOne of the phases in $turkfm_balkan_nationalism$ Conflict.\n\nIn the wake of widespread violence, tensions have found release through chaos and destruction in both city and countryside. As noble and peasant alike return to their daily lives, many question how the situation was able to get so far out of control. These conciliatory feelings will not last forever, leading to a natural escalation to the $turkfm_stable$ phase.\n$TOOLTIP_DELIMITER$\nThis phase provides the following effects:\n[GetStaticModifier('modifier_turkfm_deconfliction_phase').GetDesc]"
 turkfm_crisis: "@turkfm_crisis! #bold #red #tooltip:[GetRawTextTooltipTag('turkfm_crisis_concept')] Crisis#!#!#!"
 turkfm_crisis_concept: "@turkfm_crisis! #bold #red Crisis#!#!\n$TOOLTIP_DELIMITER$\nOne of the phases in $turkfm_balkan_nationalism$ Conflict.\n\nFollowing years of buildup, tensions have finally boiled over as [GetReligion('orthodox').GetName] and [GetReligion('jewish').GetName] populations seek to tear down the rule of the $turkfm_porte$ by any means necessary. With international eyes fixed on the [GetStrategicRegion('region_balkans').GetName], the Ottoman Empire faces widespread dissent from their subjects in Rumelia. [concept_great_power]#o s#! will have the opportunity to support or hamper these movements. Should these tensions go unresolved, they will eventually sputter out, causing a deescalation to the $turkfm_deconfliction$ phase.\n$TOOLTIP_DELIMITER$\nThis phase provides the following effects:\n[GetStaticModifier('modifier_turkfm_crisis_phase').GetDesc]\n\n#italic War will break out if #bold Crisis Progress#! reaches #bold 100#!.#!"

