 notification_notification_turkfm_race_riots_name: "Rioting Breaks Out in the Balkans"
 notification_notification_turkfm_race_riots_desc: "Massive and sustained riots have broken out in the [GetStrategicRegion('region_balkans').GetName]. The $turkfm_porte$ finds itself facing imminent revolt should it fail to restore order."
 notification_notification_turkfm_race_riots_worsen_name: "Balkan Riots Worsen"
 notification_notification_turkfm_race_riots_worsen_desc: "Sustained rioting has spread to another state in the [GetStrategicRegion('region_balkans').GetName]. The $turkfm_porte$ may face multiple avenues of revolt should the situation remain unmitigated."
 notification_notification_turkfm_revolt_seccession_name: "Balkan Country Revolts!"
 notification_notification_turkfm_revolt_seccession_desc: "One of the peoples of the [GetStrategicRegion('region_balkans').GetName] have taken up arms against the $turkfm_porte$! It now falls to the Sultan to bring them to heel."
 notification_notification_turkfm_revolt_protectorate_name: "Balkan Country Secured Autonomy"
 notification_notification_turkfm_revolt_protectorate_desc: "One of the peoples of the [GetStrategicRegion('region_balkans').GetName] have strong-armed the $turkfm_porte$ into granting them limited autonomy. This has brought the legitimacy of the Sultan's mandate into question."
 notification_notification_turkfm_riot_suppressed_name: "Rioting Suppressed in the Balkans"
 notification_notification_turkfm_riot_suppressed_desc: "Despite their intensity and motivation, the $turkfm_porte$ has succeeded in quashing one of the riots in the [GetStrategicRegion('region_balkans').GetName]."

 notification_notification_turkfm_overtaxed_name: "Overtaxation in the [GetStrategicRegion('region_balkans').GetName] Raises Tensions"
 notification_notification_turkfm_overtaxed_desc: "Aggressive taxation by the $turkfm_porte$ has caused outcry against their rule. $turkfm_escalation_increase_medium$"
 notification_notification_turkfm_tax_break_name: "The $turkfm_porte$ Grants Tax Breaks in the [GetStrategicRegion('region_balkans').GetName]"
 notification_notification_turkfm_tax_break_desc: "In response to outcry by impacted communities, the $turkfm_porte$ has granted relief from taxation in rural areas of the Balkans. $turkfm_deescalation_increase_medium$"
 notification_notification_turkfm_plague_name: "Plague Outbreak in the [GetStrategicRegion('region_balkans').GetName] Raises Tensions"
 notification_notification_turkfm_plague_desc: "A massive plague outbreak has occurred in the $turkfm_porte$'s Balkan holdings. $turkfm_escalation_increase_medium$"
 notification_notification_turkfm_quarantine_name: "The $turkfm_porte$ Imposes Quarantines in the [GetStrategicRegion('region_balkans').GetName]"
 notification_notification_turkfm_quarantine_desc: "In response to a plague outbreak in the Balkans, the $turkfm_porte$ has imposed checkpoints and quarantines to stem the spread of the disease. $turkfm_escalation_increase_small$"
 notification_notification_turkfm_faketriarch_name: "Patriarchal Rebuke Raises Tensions"
 notification_notification_turkfm_faketriarch_desc: "The $turkfm_porte$ has directly rebuked the authority of the Ecumenical Patriarch to directly intervene in abuses against the [GetReligion('orthodox').GetName] Millet. $turkfm_escalation_increase_small$"
