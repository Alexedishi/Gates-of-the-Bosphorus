# Journal Entries
 je_turkfm_eastern_question: "The Eastern Question"
 je_turkfm_eastern_question_reason: "The #bold Ottoman Empire#! has fallen from grace. Rocked by revolutions in Greece and Serbia and reeling from the Egyptian Revolt, the authority of the $turkfm_sublime_porte$ has come into question. With the Empire humiliated by the insults of the Treaty of Adrianople and Convention of Kütahya, many anticipate the imminent disintegration of the Sultanate. The government in [ROOT.GetCountry.GetCapital.GetCityHubName] struggles to defend itself from the Great Powers, and its #o #tooltip:[GetRawTextTooltipTag('turkfm_balkfm_cultures_concept_tt')] Balkan Subjects#!#! eye their chances to break free from the Empire.$turkfm_tension_details$"
 je_turkfm_international_congress: "The Congress of --"
 je_turkfm_international_congress_reason: "The [GetStrategicRegion('region_balkans').GetName] have convulsed with conflict. As tensions in the $turkfm_balkan_nationalism$ Conflict begin to simmer, the [concept_great_power]#o s#! have convened in -- to ensure peace for the foreseeable future."
 je_turkfm_international_congress_complete: "All issues confronting the Congress have been resolved"

