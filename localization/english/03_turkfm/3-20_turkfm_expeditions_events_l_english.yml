l_english:
 turkfm_expeditions.001.t: "The Battle of Grahovo"
 turkfm_expeditions.001.d: "The Vizier of the [SCOPE.sCountry('hersek_scope').GetName], [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName], has attacked the border village of Grahovo with the aim of asserting his perceived right to tribute. Despite the valiant efforts of the local militia, the village was ransacked and several civilians have been put to the sword at the command of [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! [SCOPE.sCharacter('smail_aga_scope').GetLastName]. Amongst the fallen is the brother of the [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle], #yellow Joko Petrovic#!."
 turkfm_expeditions.001.f: ""On Grahovo's wide and spacious plain\nOf Petrovic men full nine were slain\nBy Cengijic Aga's gleaming sword,\nTo the shame of Montenegro's lord."\n-Popular poem recounting the action at Grahovo, 1830s"
 turkfm_expeditions.001.a: "[ROOT.GetCountry.GetName] must demand restitution."
 turkfm_expeditions.001.b: "These lands are the rightful domain of the Sultan."
 turkfm_expeditions.001.c: "[GetStateRegion('STATE_MONTENEGRO').GetName] should be ours."
 turkfm_expeditions.002.t: ""
 turkfm_expeditions.002.d: ""
