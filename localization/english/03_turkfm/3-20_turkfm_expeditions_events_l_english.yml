 turkfm_expeditions.052.t: "Village Families Massacred"
 turkfm_expeditions.052.d: ""Concerning news has trickled in to border outposts in [GetStateRegion('STATE_MONTENEGRO').GetName]: militiamen nominally operating under our control have ransacked several non-[ROOT.GetCountry.GetStateReligion.GetName] houses with great human cost.""
 turkfm_expeditions.052.f: "Exercising military command is already complicated by the ruggedness of the mountain terrain. This, combined with traditional violence, has served as the perfect recipe for atrocity."
 turkfm_expeditions.052.a: "Put a stop to this madness."
 turkfm_expeditions.052.b: "This is no concern of ours. "
 turkfm_expeditions.053.t: "Bora Disrupts Operations"
 turkfm_expeditions.053.d: "A powerful windstorm has swept down from the mountains. While the Ottomans have been forced to seek shelter, the Montenegrins have consolidated their control over the village."
 turkfm_expeditions.053.f: ""
 turkfm_expeditions.053.a: "This will certainly muddy things up."
 turkfm_expeditions.054.t: ""
 turkfm_expeditions.054.d: ""
 turkfm_expeditions.054.f: ""
 turkfm_expeditions.054.a: ""
 turkfm_expeditions.055.t: "Pitched Battle"
 turkfm_expeditions.055.d: "A chance encounter between a Montenegrin scouting party and an Ottoman patrol devolved into prolonged fighting as both leaders elected to reinforce their positions."
 turkfm_expeditions.055.f: "Despite their flexibility and familiarity with the terrain, the Montenegrins struggle to inflict sizeable damage to organized formations."
 turkfm_expeditions.055.a: "Our men will not be cowed."
 turkfm_expeditions.055.b: "These tribal forces are no threat to us."
 turkfm_expeditions.056.t: "Sudden Breakthrough"
 turkfm_expeditions.056.d: "A surprisingly organized push by [SCOPE.sCharacter('turkfm_black_mountain_tur_leader').GetFullName] have broken through our defenses near the village center and laid claim to several key buildings."
 turkfm_expeditions.056.f: ""
 turkfm_expeditions.056.a: "Our braves will never fail!"
 turkfm_expeditions.056.b: "Let them taste the sword."
 turkfm_expeditions.057.t: ""
 turkfm_expeditions.057.d: ""
 turkfm_expeditions.057.f: ""
 turkfm_expeditions.057.a: ""
 turkfm_expeditions.058.t: "Ottoman Commander Captured"
 turkfm_expeditions.058.d: ""
 turkfm_expeditions.058.f: "With so little to leverage against the Ottomans, the capture of politically sensitive hostages has emerged as one of the pre-eminent tools of Montenegrin diplomacy."
 turkfm_expeditions.058.a: "Turn them loose."
 turkfm_expeditions.058.b: "Bring them to the palace."
 turkfm_expeditions.058.c: "We take no prisoners."
 turkfm_expeditions.059.t: "Montenegrin Leader Killed"
 turkfm_expeditions.059.d: "[ROOT.GetCapital.GetCityHubName] has been the site of mass mourning as the distressing news as arrived of the death of a famed warrior in the [ROOT.GetCountry.GetAdjectiveNoFlag] highlands."
 turkfm_expeditions.059.f: ""Oh my bird, oh my dear grey falcon,\nHow do you feel with your wing torn out?\nI am feeling with my wing torn out\nLike a brother one without the other.""
 turkfm_expeditions.059.a: "We will sing songs to his glory!"
 turkfm_expeditions.059.b: "Justice well served!"

 turkfm_expeditions.100.t: "The Pirates of the Adriatic"
 turkfm_expeditions.100.d: "For centuries, [GetCulture('albanian').GetName] pirates based on the eastern coast of the Adriatic have raided European vessels. Renowned as the "Ulcinian Sea Wolves" by the Italians, these professional outfits have long served the $turkfm_porte$ in both formal and informal capacities."
 turkfm_expeditions.100.f: ""The Ulcignote pirates used to be the terror of Italy and the Adriatic; her seamen were much sought by the Porte, and more than one became Capitan-pasha." -Viscountess Emily Anne Beaufort Smythe, 1863"
 turkfm_expeditions.100.a: "These are untamed waters."
 turkfm_expeditions.100.tt: "As long as [concept_albanian_piracy] remains entrenched, countries along the Adriatic Sea will be at risk for #bold Piracy Events#!."
 turkfm_expeditions.101.t: "Pacifying the Adriatic"
 turkfm_expeditions.101.d: "Armed with orders to defend our interests in the Adriatic, the Admiralty must choose a leader for the hastily assembled naval task force. A few promising candidates have distinguished themselves."
 turkfm_expeditions.101.f: ""Attack authorizations? I thought pirate activity was at an ebb...""
 turkfm_expeditions.101.a: "[SCOPE.sCharacter('expedition_leader_1').GetFullName] is an experienced naval commander."
 turkfm_expeditions.101.b: "[SCOPE.sCharacter('expedition_leader_2').GetFullName] will serve us well."
 turkfm_expeditions.101.c: "[SCOPE.sCharacter('expedition_leader_3').GetFullName] has never let us down before."
 turkfm_expeditions.101.e: "[SCOPE.sCharacter('expedition_leader_4').GetFullName] is the most prepared one."
 turkfm_expeditions.102.t: "[SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetFullName] Arrives in the Adriatic"
 turkfm_expeditions.102.d: "After a few weeks of preparations and travel, the expedition led by [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetFullName] has crossed the Strait of Otranto. From here, they begin their mission to track down [SCOPE.sCharacter('turkfm_jack_sparrow_scope').GetFullName] and his vile outfit."
 turkfm_expeditions.102.f: ""Lord [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName] will soon have the scurvy pirates on the run.""
 turkfm_expeditions.102.a: "We have a favorable wind, sir."
 turkfm_expeditions.103.t: "[SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetFullName] Withdraws from the Adriatic"
 turkfm_expeditions.103.d: "Facing dwindling supplies and disintegrating morale, [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetFullName] has informed the Admiralty that his only course of action is to return to friendly waters."
 turkfm_expeditions.103.f: ""We'll be back.""
 turkfm_expeditions.103.a: "How could this happen?"
 turkfm_expeditions.104.t: "Expedition Leader Has Died!"
 turkfm_expeditions.104.d: "Tragedy has struck our expedition into the Adriatic. Our assigned leader has died before he could complete the mission."
 turkfm_expeditions.104.f: "With our task force leaderless and disorganized, the order has been given for them to return to friendly waters."
 turkfm_expeditions.104.a: "What tragic circumstances..."
 turkfm_expeditions.105.t: "Treating with Corsairs"
 turkfm_expeditions.105.d: "Dragomans of the $turkfm_porte$ have arrived at the docks of [SCOPE.sState('turkfm_piracy_state_scope').GetPortHubName] to seek recruits for the [ROOT.GetCountry.GetAdjectiveNoFlag] navy. Both ambitious young men and retired veterans of the pirate trade have offered their services in exchange for a path to reformed life."
 turkfm_expeditions.105.f: ""You look bloody awful. What are you doing here?"\n"You hired me. I can’t help it if your standards are lax.\nYou smell funny.""
 turkfm_expeditions.105.a: "Issue a call for able-bodied sailors."
 turkfm_expeditions.105.b: "The feared Captain [SCOPE.sCharacter('turkfm_hector_barbossa_scope').GetFirstName] will serve us well."
 turkfm_expeditions.105.c: "This is a waste of our time."
 turkfm_expeditions.106.t: "Pirate Hideout Destroyed"
 turkfm_expeditions.106.d: "After scouring the Adriatic for weeks, Captain [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetFullName] has located a pirate stronghold in the $gbbf_adriatic_sea$. His marines stand ready to storm their fortifications and burn their operation to cinders."
 turkfm_expeditions.106.f: ""The Brethren know they face extinction. All that remains is for them to decide where they make their final stand.""
 turkfm_expeditions.106.a: "Bring the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s justice upon them."
 turkfm_expeditions.107.t: "Pirate Fleet Destroyed"
 turkfm_expeditions.107.d: "After scouring the Adriatic for weeks, Captain [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetFullName] has decisively engaged and destroyed a pirate fleet off the coasts of [SCOPE.sState('turkfm_piracy_state_scope').GetName], burning their vessels and placing any survivors in chains."
 turkfm_expeditions.107.f: ""Advise your Brethren: you can fight, and all of you will die, or you can not fight, in which case only most of you will die.""
 turkfm_expeditions.107.a: "Serves them right."
 turkfm_expeditions.108.t: "[SCOPE.sCharacter('turkfm_jack_sparrow_scope').GetFullName] Clapped in Irons!"
 turkfm_expeditions.108.d: "Triumphant news has arrived in [ROOT.GetCountry.GetCapital.GetCityHubName]: Through the superior might and pluck of the [ROOT.GetCountry.GetAdjectiveNoFlag] navy, [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetFullName] has captured the vile [SCOPE.sCharacter('turkfm_jack_sparrow_scope').GetFullName]."
 turkfm_expeditions.108.f: ""By what authority have you arrested this man?"\n"By the Crown's authority.""
 turkfm_expeditions.108.a: "He will rot in a cell for his crimes."
 turkfm_expeditions.108.b: "Life is too much a mercy. To the gallows!""
 turkfm_expeditions.108.c: "I can think of a better use of his talents..."
 turkfm_expeditions.109.t: "The End of [SCOPE.sCharacter('turkfm_jack_sparrow_scope').GetFullName]"
 turkfm_expeditions.109.d: "Following a successful foray into the Adriatic, [SCOPE.sCountry('turkfm_the_company_scope').GetName] has captured the vile pirate [SCOPE.sCharacter('turkfm_jack_sparrow_scope').GetFullName] and brought an end to the pirate's terror over the Adriatic."
 turkfm_expeditions.109.f: ""We witness the end of piracy and the end of [SCOPE.sCharacter('turkfm_jack_sparrow_scope').GetFullName]. Has there ever been a more glorious day!""
 turkfm_expeditions.109.a: "At long last, the Adriatic will know peace."

 turkfm_expeditions.110.t: "Coastal Village Raided!"
 turkfm_expeditions.110.d: "Pirates have raided a series of coastal villages in [SCOPE.sState('turkfm_piracy_state_scope').GetName], pillaging local storage depots and taking dozens of citizens to be sold into slavery."
 turkfm_expeditions.110.f: ""The slave trade isn't a pleasant business, granted, but it is extremely lucrative. It's very good business. One can't afford these days to be...finicky.""
 turkfm_expeditions.110.a: "Such are the dangers of the coasts."
 turkfm_expeditions.110.b: "We should provide a relief package."
 turkfm_expeditions.110.c: "Have [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetFullName] supply provisions."
 turkfm_expeditions.111.t: "Merchant Vessels Raided!"
 turkfm_expeditions.111.d: "Reports have arrived of several of our merchant vessels being held up by pirates in the Adriatic. The violence displayed in these incidents have sent chills through the merchant marine."
 turkfm_expeditions.111.f: ""Commandeer. We're going to commandeer that ship. Nautical term.""
 turkfm_expeditions.111.a: "This is barbaric."
 turkfm_expeditions.112.t: "Nobleman Held Hostage"
 turkfm_expeditions.112.d: "Pirates have seized the yacht of a member of the [ROOT.GetCountry.GetNameNoFlag] [GetPopType('aristocrats').GetName] and are holding him for ransom. We do not have long to act."
 turkfm_expeditions.112.f: ""Aye. Now... Before I go just handing them over, I do have one or two conditions.""
 turkfm_expeditions.112.a: "Send word that we will pay."
 turkfm_expeditions.112.b: "We do not negotiate with terrorists."
 turkfm_expeditions.112.c: "Task [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetFullName] with a rescue."
 turkfm_expeditions.113.t: "A Pirate's Booty"
 turkfm_expeditions.113.d: "Coastal patrols in [SCOPE.sState('turkfm_piracy_state_scope').GetName] have seized an apparently derelict pirate vessel. The commander has reported a large amount of stolen bullion belonging to [SCOPE.sCountry('turkfm_piracy_country_scope').GetName] in the hold."
 turkfm_expeditions.113.f: ""It's happened again! How can a pirate earn his money honestly when people steal his ship all the time?""
 turkfm_expeditions.113.a: "Return the spoils to their rightful owners."
 turkfm_expeditions.113.b: "This is legal salvage for [ROOT.GetCountry.GetNameNoFlag]."
 turkfm_expeditions.114.t: "Diplomatic Communiques Intercepted"
 turkfm_expeditions.114.d: "The [ROOT.GetCountry.GetNameNoFormatting] diplomatic service has come with news that a vessel carrying sensitive communications between [ROOT.GetCountry.GetNameNoFlag] and [SCOPE.sCountry('turkfm_piracy_country_scope').GetNameNoFlag] has been waylaid by pirates in the Adriatic."
 turkfm_expeditions.114.f: ""I'm listening... I'm listening intently.""
 turkfm_expeditions.114.a: "Pay ransom for the ship."
 turkfm_expeditions.114.b: "What's the worst they can do?"
 turkfm_expeditions.114.c: "Task [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetFullName] to "rectify" the situation."
 turkfm_expeditions.115.t: "Slavers Intercepted"
 turkfm_expeditions.115.d: "Coastal patrols in [SCOPE.sState('turkfm_piracy_state_scope').GetName] have detained a slave ship en route from [SCOPE.sCountry('turkfm_piracy_country_scope').GetName] to [SCOPE.sCountry('ottoman_scope').GetName]."
 turkfm_expeditions.115.f: ""It’s an honor to meet the captain who so nearly broke the record for sailing the Triangle.""
 turkfm_expeditions.115.a: "Arrest the crew and return their captives."
 turkfm_expeditions.115.b: ""Slavers? What slavers?""
 turkfm_expeditions.115.c: "Demand ransom from the crew."
 turkfm_expeditions.115.e: "Grant these souls refuge in [ROOT.GetCountry.GetNameNoFlag]."
 turkfm_expeditions.116.t: "Greener Pastures"
 turkfm_expeditions.116.d: "Rumors have spread of the prosperity of [SCOPE.sState('turkfm_piracy_state_scope').GetName] to such an extend that instead of raiding coastal communities, pirates have begun to look at [SCOPE.sState('turkfm_piracy_state_scope').GetPortHubName] as the ideal place for retirement."
 turkfm_expeditions.116.f: "“Not all treasure is silver and gold, mate.”"
 turkfm_expeditions.116.a: "Interesting..."
 turkfm_expeditions.117.t: "The [SCOPE.sGoods('turkfm_piracy_goods_scope').GetName] Smugglers"
 turkfm_expeditions.117.d: "Unscrupulous merchants in [SCOPE.sState('turkfm_piracy_state_scope').GetName] have been moving large quantities of [SCOPE.sGoods('turkfm_piracy_goods_scope').GetName] into the region. As a result, many of the locals are plunging into stupor, and in the worst cases, death."
 turkfm_expeditions.117.f: ""Last time, the rum runners used this island as a cache, they came past and I was able to barter passage off. By the look of things, they've long been out of business.""
 turkfm_expeditions.117.a: "Deploy the guard and root them out."
 turkfm_expeditions.117.b: "What the poor do is of no concern to us."
 turkfm_expeditions.117.c: "Extend social services."
 turkfm_expeditions.118.t: "The Peasant's Pirate"
 turkfm_expeditions.118.d: "[SCOPE.sCharacter('turkfm_jack_sparrow_scope').GetFullName] has been the subject of praise amongst the coastal villages of [SCOPE.sState('turkfm_piracy_state_scope').GetName]. Apparently, the pirate lord has been "redistributing" his ill-gotten gains amongst the peasantry."
 turkfm_expeditions.118.f: ""I'm afraid currency is the currency of the realm.""
 turkfm_expeditions.118.a: "What a peculiar habit."
 turkfm_expeditions.118.b: "Order these goods confiscated."
 turkfm_expeditions.119.t: "DUMMY"
 turkfm_expeditions.119.d: "DUMMY"
 turkfm_expeditions.119.f: "DUMMY"
 turkfm_expeditions.119.a: "DUMMY"

 turkfm_expeditions.120.t: "Local Informants"
 turkfm_expeditions.120.d: "Fishermen in [SCOPE.sState('turkfm_piracy_state_scope').GetName] have approached us with information detailing recent pirate fleet movements."
 turkfm_expeditions.120.f: ""We will beat your captain to death until he reveals where they're heading.""
 turkfm_expeditions.120.a: "How generous of them."
 turkfm_expeditions.120.b: "Perhaps we can coax a little more from them."
 turkfm_expeditions.121.t: "A Suspicious Inlet"
 turkfm_expeditions.121.d: "Scouts following leads in [SCOPE.sState('turkfm_piracy_state_scope').GetName] have reported suspicious naval activity in a sheltered cove near [SCOPE.sState('turkfm_piracy_state_scope').GetPortHubName]. Their commander has requested permission to investigate."
 turkfm_expeditions.121.f: ""That's no ship, sir. It's a shipwreck.""
 turkfm_expeditions.121.a: "Make a cursory inspection."
 turkfm_expeditions.121.b: "We should leave well enough alone..."
 turkfm_expeditions.121.c: "Detach a fighting ship to aid in the search."
 turkfm_expeditions.122.t: "The Runaway"
 turkfm_expeditions.122.d: "Our expedition fleet has been signaled by a pirate vessel requesting to surrender. The ship appears heavily damaged with the captain reported he has to flee after a "disagreement" with his fellow pirates. The ship's crew has pledged to join the expedition should be provide them safe harbor."
 turkfm_expeditions.122.f: ""Parleley, parlelellyleloooo, par le nee, partner, par... snip, parsley..."\n"Parley?"\n"That's the one. Parley. Parley.""
 turkfm_expeditions.122.a: "Welcome aboard, Captain."
 turkfm_expeditions.122.b: "Once a pirate, always a pirate. Send them to the bottom."
 turkfm_expeditions.123.t: "Spoiled Provisions"
 turkfm_expeditions.123.d: "Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName] has been informed that crewmen aboard the flagship have found several tons of foodstuff spoiled following seawater intrusion in the hold. This will undoubtedly impact the expedition's endurance."
 turkfm_expeditions.123.f: ""...But why is the rum gone?""
 turkfm_expeditions.123.a: "We'll have to start rationing soon."
 turkfm_expeditions.123.b: "Good thing we're running a surplus."
 turkfm_expeditions.124.t: "Circular Bearing"
 turkfm_expeditions.124.d: "Navigation staff have reported a severe misalignment of the sextant aboard Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName]'s flagship. The culprit has been flogged and fellow captains chastised for not reporting their deviation from planning bearings. This has done little to salvage the fleet's progress."
 turkfm_expeditions.124.f: ""You're off the edge of the map, mate. Here there be monsters!""
 turkfm_expeditions.124.a: ""So... we're lost?""
 turkfm_expeditions.124.b: ""Keep holding this bearing, just trust me.""
 turkfm_expeditions.125.t: "Windstorms in the Adriatic"
 turkfm_expeditions.125.d: "The expedition has encountered a violent windstorm in the Adriatic. Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName] has ordered all sails furled in the hopes of minimizing damages to the masts."
 turkfm_expeditions.125.f: "You can’t just sit there and wait for the storm to pass. You’ve got to learn to dance in the rain.""
 turkfm_expeditions.125.a: "Hunker down and hope for a break in the storm."
 turkfm_expeditions.125.b: "Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName] has weathered harsher storms."
 turkfm_expeditions.126.t: "Foul Waters"
 turkfm_expeditions.126.d: "While following a lead off the coasts of [SCOPE.sState('turkfm_piracy_state_scope').GetName], the expedition fleet has accidentally wandered into a maze of shoals and reefs. It make take days to fully extricate the fleet."
 turkfm_expeditions.126.f: ""Have you noticed, on top of everything, it's raining?!""
 turkfm_expeditions.126.a: "Proceed with caution."
 turkfm_expeditions.126.b: "We cannot afford any delays."
 turkfm_expeditions.126.c: "Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName]'s experience will serve us here."
 turkfm_expeditions.127.t: "Scouts Pick Up Leads"
 turkfm_expeditions.127.d: "Advance scouts have "acquired" details of nearby pirate activity. Several fisherman at our latest stop have corroborated this information."
 turkfm_expeditions.127.f: ""So you see, every man has a price he will willingly accept. Even for what he hoped never to sell.""
 turkfm_expeditions.127.a: "Let's put it to use."
 turkfm_expeditions.127.b: "Perhaps the locals could be "convinced" to elaborate."
 turkfm_expeditions.128.t: "Emergency Repairs"
 turkfm_expeditions.128.d: "One of our expedition ships has been found to have damage belowdecks. With the ship developing a list, the captain has advised Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName] that they should make port to conduct repairs."
 turkfm_expeditions.128.f: ""Two shot holes Captain— one clean through the mizzenmast.""
 turkfm_expeditions.128.a: "Make for the nearest serviceable port."
 turkfm_expeditions.128.b: "Implement quick repairs, we cannot waste time."
 turkfm_expeditions.128.c: "The Admiral's expertise will come in handy here."
 turkfm_expeditions.129.t: "Port of Call"
 turkfm_expeditions.129.d: "The expedition fleet has moored at harbor in [SCOPE.sState('turkfm_piracy_state_scope').GetPortHubName] for resupply. Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName] expects it will not take long."
 turkfm_expeditions.129.f: ""Hold up there, ye! The mooring fee's a shilling, and I'll need to know your name.""
 turkfm_expeditions.129.a: "Take on only what we need."
 turkfm_expeditions.129.b: "We should load up extra supplies."

 turkfm_expeditions.130.t: "Pirates Spotted!"
 turkfm_expeditions.130.d: "The lead ship of our expedition has spotted a pirate vessel on the horizon. Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName] has ordered the fleet to give pursuit."
 turkfm_expeditions.130.f: ""Set top sails and clear up this mess.""
 turkfm_expeditions.130.a: "We will send them to the bottom!"
 turkfm_expeditions.131.t: "Man Overboard!"
 turkfm_expeditions.131.d: "Choppy waters have enveloped the expedition as the cry of "Man Overboard" rings out from one of the lead ships. Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName] can just make out the figure of a human amongst the waves. It may be possible to rescue him, but we risk losing the pirate fleet."
 turkfm_expeditions.131.f: ""The sea is like a woman. You can love her but rule her? Out of the question. Her waves are too choppy and her gales too stormy.""
 turkfm_expeditions.131.a: "Strike the jib. We leave no one behind."
 turkfm_expeditions.131.b: "He him behind. Focus on our quarry."
 turkfm_expeditions.132.t: "The Pillagers' Wake"
 turkfm_expeditions.132.d: "What was reported as a possible pirate stronghold has turned out to be a coastal village recently raided and burned by the pirate fleet. Several villagers can be seen attempting to signal the fleet for aid."
 turkfm_expeditions.132.f: ""My story. It’s exactly the same as your story, just one chapter behind. I chased a man across the seven seas. The pursuit cost me my crew, my commission, and my life.""
 turkfm_expeditions.132.a: "We cannot allow for any distractions."
 turkfm_expeditions.132.b: "Detach a ship to provide aid."
 turkfm_expeditions.133.t: ""
 turkfm_expeditions.133.d: ""
 turkfm_expeditions.133.f: ""
 turkfm_expeditions.133.a: ""
 turkfm_expeditions.133.b: ""
 turkfm_expeditions.134.t: "Without a Trace"
 turkfm_expeditions.134.d: "A message arrived this morning reporting that Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName] has lost sight of the pirate fleet. The expedition has returned to scouting procedures."
 turkfm_expeditions.134.f: ""Gentlemen, m'lady, you will always remember this as the day that you almost caught Captain [SCOPE.sCharacter('turkfm_jack_sparrow_scope').GetFullName]!""
 turkfm_expeditions.134.a: "We'll get them next time, boys."
 turkfm_expeditions.135.t: "Bearing Down"
 turkfm_expeditions.135.d: "Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName]'s fleet continues to close the distance towards the pirate fleet."
 turkfm_expeditions.135.f: ""Strike your colors, you bloomin' cockroaches! Hands, grapnels at the ready! Prepare to board!""
 turkfm_expeditions.135.a: "Keep at it!"
 turkfm_expeditions.135.b: "Take a more aggressive tack."
 turkfm_expeditions.136.t: "Cut and Run"
 turkfm_expeditions.136.d: "Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName] has fallen into a trap. Right as the morning fog cleared, he has found his fleet flanked on two sides by pirates. His staff have advised a retreat to regroup."
 turkfm_expeditions.136.f: ""As much as I love that plan, no vessel can outrun that wretched hull of a ship.""
 turkfm_expeditions.136.a: "Retreat is the sensible option."
 turkfm_expeditions.136.b: "Nonsense. We fight our way through!"
 turkfm_expeditions.137.t: "Action Along the Coast"
 turkfm_expeditions.137.d: "Under Admiral [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetLastName]'s command, the expedition fleet has exchanged fire with several pirate scout ships. While indecisive, they have given away the position of their larger fleet."
 turkfm_expeditions.137.f: ""Hands, come about! Roll out the guns!""
 turkfm_expeditions.137.a: "We're getting close."
 turkfm_expeditions.138.t: "A Duel on the High Seas"
 turkfm_expeditions.138.d: "DUMMY"
 turkfm_expeditions.138.f: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has received urgent word that the task force led by [SCOPE.sCharacter('turkfm_cutler_beckett_scope').GetFullName] has tracked down [SCOPE.sCharacter('turkfm_jack_sparrow_scope').GetFullName]'s flagship and intends to engage the ruffian in a naval duel.\n$TOOLTIP_DELIMITER$@divider_decorative!$TOOLTIP_DELIMITER$\n#lore "The enemy, has opted for oblivion… ready the fleet."#!"
 turkfm_expeditions.138.a: "Give them what for!"
 turkfm_expeditions.138.b: "Order him to stand down!"
 turkfm_expeditions.139.t: "A Devastating Showdown"
 turkfm_expeditions.139.d: "In a brutal exchange of fire, [SCOPE.sCharacter('turkfm_duel_victor_scope').GetFullName]'s fleet has emerged triumphant. [SCOPE.sCharacter('turkfm_duel_loser_scope').GetFullName] has ordered his fleet to withdraw to lick it's wounds."
 turkfm_expeditions.139.f: ""You may kill me, but you may never insult me. Who am I? I'm Captain [SCOPE.sCharacter('turkfm_jack_sparrow_scope').GetFullName], mate.""
 turkfm_expeditions.139.a: "This is a travesty!"
 turkfm_expeditions.139.b: "Excellent News!"