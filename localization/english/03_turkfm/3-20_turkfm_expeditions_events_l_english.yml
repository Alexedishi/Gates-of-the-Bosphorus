 turkfm_expeditions.027.t: "Village Skirmish Escalates"
 turkfm_expeditions.027.d: "Urgent news has arrived of an escalating conflict at a village along the border. Local militias have begun dug in for several days and have sent urgent calls for aid. Our advisors have warned of threats to the local population."
 turkfm_expeditions.027.f: "Given the remoteness of the mountains and the poor state of the roads, its surprising they held out at all. There's no guarantee any aid will arrive in time, but the tribes will remember our decision."
 turkfm_expeditions.027.a: "Give no ground!"
