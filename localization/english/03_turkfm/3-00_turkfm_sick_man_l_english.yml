l_english:
# Journal Entries
 je_turkfm_sick_man_main: "The Sick Man of Europe"
 je_turkfm_sick_man_main_reason: "The [ROOT.GetCountry.GetName] has fallen from grace. Rocked by revolutions in Greece and Serbia and reeling from the Egyptian Revolt, the authority of the $turkfm_sublime_porte$ has come into question. With the Empire humiliated by the insults of the Treaty of Adrianople and Convention of Kütahya, many anticipate the imminent disintegration of the Sultanate. The government in [ROOT.GetCountry.GetCapital.GetCityHubName] struggles to defend itself from the Great Powers, and its #o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc_tt')] Balkan Subjects#!#! eye their chances to break free from the Empire."
 je_turkfm_sick_man_grand_collapse: "$je_the_grand_collapse$"
 je_turkfm_sick_man_grand_collapse_reason: "$je_the_grand_collapse_reason$"
 
 je_turkfm_sick_man_syria: "$je_sick_man_syria$"
 je_turkfm_sick_man_syria_reason: "$je_sick_man_syria_reason$"
 je_turkfm_sick_man_egypt: "$je_sick_man_egypt$"
 je_turkfm_sick_man_egypt_reason: "$je_sick_man_egypt_reason$"
 je_turkfm_sick_man_crete: "Sick Man: Reclaim Crete"
 je_turkfm_sick_man_crete_reason: "The Eyalet of Crete has been illegitimately occupied by Egypt since the outbreak of the Greek War of Independence. Seizing on the Sultan's moment of weakness, Muhammad Ali seized the island and has since refused to to return it to our rightful rule. We can no longer tolerate this insult."
 je_turkfm_sick_man_caucasus: "Sick Man: Lay Claim to the Caucasus"
 je_turkfm_sick_man_caucasus_reason: "Before the outbreak of the Russo-Turkish Wars, the Caucasus Mountains were firmly within the grasp of the Sultan. However, the $RUS_ADJ$ Tsars have taken advantage of Ottoman disorder to encroach on our holdings in the region. The $turkfm_porte$ must take decisive action lest these lands be forever lost to us."
 je_turkfm_sick_man_kurdistan: "Sick Man: The Kurdish Frontier"
 je_turkfm_sick_man_kurdistan_reason: "Ever since the Turks first charged into Anatolia, the [GetCulture('kurdish').GetName] people have resisted the authority of Constantinople. With the aim of centralizing the power of the $turkfm_porte$, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] is determined to finally secure the Empire's eastern border."
 je_turkfm_sick_man_kurdistan_complete_erzurum: "All of [GetStateRegion('STATE_ERZURUM').GetName] is owned by [ROOT.GetCountry.GetNameNoFlag] and is an [concept_incorporated_state]"
 je_turkfm_sick_man_kurdistan_complete_diyarbakir: "All of [GetStateRegion('STATE_DIYARBAKIR').GetName] is owned by [ROOT.GetCountry.GetNameNoFlag] and is an [concept_incorporated_state]"
 je_turkfm_sick_man_kurdistan_complete_mosul: "All of [GetStateRegion('STATE_MOSUL').GetName] is owned by [ROOT.GetCountry.GetNameNoFlag] and is an [concept_incorporated_state]"
 je_turkfm_sick_man_kurdistan_complete_deir_ez_zor: "All of [GetStateRegion('STATE_DEIR_EZ_ZOR').GetName] is owned by [ROOT.GetCountry.GetNameNoFlag] and is an [concept_incorporated_state]"
 je_turkfm_sick_man_kurdistan_complete_urmia: "All of [GetStateRegion('STATE_URMIA').GetName] is owned by [ROOT.GetCountry.GetNameNoFlag] and is an [concept_incorporated_state]"
 je_turkfm_sick_man_kurdistan_complete_persian_kurdistan: "All of [GetStateRegion('STATE_PERSIAN_KURDISTAN').GetName] is owned by [ROOT.GetCountry.GetNameNoFlag] and an [concept_incorporated_state]"

 # Journal Entry Lobby Text
 je_turkfm_sick_man_main_lobby: "$gbbf_journal_lobby$\nThe Ottoman Empire has fallen from grace. Rocked by revolutions in Greece and Serbia and reeling from the Egyptian Revolt, the authority of the $turkfm_sublime_porte$ has come into question. With the Empire humiliated by the insults of the Treaty of Adrianople and Convention of Kütahya, many anticipate the imminent disintegration of the Sultanate."

 # Modifiers
 modifier_turkfm_sick_man: "The Sick Man"
 modifier_turkfm_imperial_aspiriations: "Imperial Aspirations"
 modifier_turkfm_secured_region: "Secured Strategic Region"
 modifier_turkfm_lost_region: "Lost Strategic Region"
 modifier_turkfm_sultanate_shattered: "Sultanate Shattered"
 modifier_turkfm_imperial_challenger: "Imperial Challenger"
 modifier_turkfm_ottoman_legacy: "Ottoman Legacy"
 modifier_turkfm_untamed_frontier: "Untamed Frontier"

 # Scripted Progress Bars
 turkfm_sick_main_progress_bar: "[GetPlayer.MakeScope.GetScriptValueDesc('turkfm_sick_man_value')]$gbbf_linebreak_normal$#bold #greece [GetPlayer.MakeScope.Var('turkfm_sick_man_var').GetValue|0]#!/#white 4#!#! total"
 turkfm_sick_main_progress_bar_desc: "The Sick Man"

 # Triggers
 turkfm_grand_collapse_completed: "[ROOT.GetCountry.GetNameNoFlag] has completed the #bold $je_the_grand_collapse$#! [concept_journal_entry]"
 turkfm_grand_collapse_failed: "[ROOT.GetCountry.GetNameNoFlag] has failed the #bold $je_the_grand_collapse$#! [concept_journal_entry]"
 turkfm_grand_collapse_happened: "[ROOT.GetCountry.GetNameNoFlag] has completed or failed the #bold $je_the_grand_collapse$#! [concept_journal_entry]"
 
 # Tooltips
 turkfm_region_secured: "[ROOT.GetCountry.GetNameNoFlag] has gained $gbbf_control$ over the [GetPlayer.MakeScope.Var('gbbf_control_event_var').GetFlagName] [concept_georegion]"
 turkfm_region_lost: "[ROOT.GetCountry.GetNameNoFlag] has lost $gbbf_control$ over the [GetPlayer.MakeScope.Var('gbbf_control_event_var').GetFlagName] [concept_georegion]"