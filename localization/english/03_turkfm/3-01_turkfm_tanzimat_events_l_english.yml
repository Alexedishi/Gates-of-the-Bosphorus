l_english:
 turkfm_tanzimat.001.t: "The Decaying Empire"
 turkfm_tanzimat.001.d: "The [ROOT.GetCountry.GetName] has stood for four centuries by drawing from Persian and Byzantine statesmanship to develop and legitimize its rule. However, what once was a deep well of administrative strength has begun to run dry, and the $turkfm_porte$ must discover a new dynamism if it is to survive the Industrial Age."
 turkfm_tanzimat.001.f: "Since its inception, the [ROOT.GetCountry.GetName] has existed in a state of tension between its mixed heritage with the tradition of Iranian absolute kingship clashing with the Turkic ideal of a quasi-divine monarchy, both rooted in a pre-Islamic past and themselves at odds with the with the tenets of Islamic rule by a religiously acknowledged caliph."
 turkfm_tanzimat.001.a: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must remain supreme."
 turkfm_tanzimat.002.t: "The Edict of Gülhane"
 turkfm_tanzimat.002.d: "At the behest of [SCOPE.sCharacter('turkfm_reshid_scope').GetFullName], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has promulgated the "Imperial Edict of Reorganization." Consisting of a complicated number of declarations and directives, the edict seeks to guarantee standards of living, standardize taxation, and recognize human rights amongst the subjects of the $turkfm_porte$."
 turkfm_tanzimat.002.f: ""...whereas it appears necessary... henceforth to establish new laws for the good administration of our Sublime State and our well-protected provinces..." -Gülhane Decree, 1839"
 turkfm_tanzimat.002.a: "Today marks a new age for the [ROOT.GetCountry.GetName]"
 turkfm_tanzimat.003.t: "The Men of the Tanzimât"
 turkfm_tanzimat.003.d: "As the ideals of reform begin to take root in the [ROOT.GetCountry.GetName], several politicians have presented themselves as the ideal candidates to lead the Empire's charge into modernity."
 turkfm_tanzimat.003.f: ""The state cannot stand without statesmen,\nBut the statesmen must have wealth"\n-Yusuf Nabi, "Hayriyye", 1889"
 turkfm_tanzimat.003.a: "These men will drive our progress."
 turkfm_tanzimat.003.b: "We must trust the old guard."
 turkfm_tanzimat.004.t: ""
 turkfm_tanzimat.004.d: ""
 turkfm_tanzimat.004.f: ""
 turkfm_tanzimat.004.a: ""
 turkfm_tanzimat.005.t: "The Identity of the Empire"
 turkfm_tanzimat.005.d: "Through the tremendous generational effort of the $turkfm_tanzimat$, the ideals of western reform have been infused into the very soul of the Empire."
 turkfm_tanzimat.005.f: ""...since it is more difficult thus entirely to change and renovate the laws of a state than to found a state anew..." -Ahmed Cevdet Pasha, Tarih"
 turkfm_tanzimat.005.a: "The [GetIdeology('ideology_gbbf_ottomanist_leader').GetName] $turkfm_identity$ will lead use to the future!"
 turkfm_tanzimat.005.a.tt: "The [ROOT.GetCountry.GetName] will adopt the [GetCulture('ottoman').GetName] culture as its core identity."
 turkfm_tanzimat.005.b: "The [GetIdeology('ideology_gbbf_islamist_leader').GetName] $turkfm_identity$ is the only moral choice!"
 turkfm_tanzimat.005.b.tt: "The [ROOT.GetCountry.GetName] will adopt [GetReligion('sunni').GetName] Islam as its core identity."
 turkfm_tanzimat.005.c: "Any decision would be inappropriate at this time."
 turkfm_tanzimat.006.t: "The Decaying Empire"
 turkfm_tanzimat.006.d: "The [ROOT.GetCountry.GetName] has failed to modernize and re-assert itself on the world stage. The vultures begin to circle as the last days of the [ROOT.GetCountry.GetName] draw near."
 turkfm_tanzimat.006.f: ""From 1838 to 1908, the Ottoman Empire staged its final but doomed struggle for survival. The Tanzimat’s dual allegiance to Western progress and Islamic tradition left it alienating both reformers and traditionalists, accelerating its disintegration." -Zeynep Çelik, 1986"
 turkfm_tanzimat.006.a: "The [ROOT.GetCountry.GetName] must find its way..."
 turkfm_tanzimat.007.t: "The Three Pashas"
 turkfm_tanzimat.007.d: ""
 turkfm_tanzimat.007.f: ""
 turkfm_tanzimat.007.a: ""
 turkfm_tanzimat.008.t: "The Eternal Caliphate"
 turkfm_tanzimat.008.d: "Flanked by prominent members of the $gbbf_devout$, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has declared the establishment of the Eternal [ROOT.GetCountry.GetAdjectiveNoFlag] Caliphate. From the Danube to the Levant, the Word of the Prophet shall reign supreme."
 turkfm_tanzimat.008.f: "With the collapse of the $turkfm_ottomanist$ movement, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been left with no choice but to establish Islam as the one and only foundation of the [ROOT.GetCountry.GetName]."
 turkfm_tanzimat.008.a: "God is Great!"
 turkfm_tanzimat.009.t: "The Ottoman Motherland"
 turkfm_tanzimat.009.d: "After nearly two centuries of false-starts and set-backs, the [ROOT.GetCountry.GetName] has emerged from the Tanzimât with a renewed sense of identity and administrative might. No longer just an Empire, the [ROOT.GetCountry.GetGovernment.GetName] now stands as a beacon welcoming all who would swear allegiance to the $turkfm_porte$."
 turkfm_tanzimat.009.f: ""...the readiness of the country for constitutional government is now evident; and therefore, our sovereign decree having been issued... I have proclaimed that no interference shall ever or in any way come to the application of the constitution." -Sultan Abdul Hamid II to Grand Vizier Said Pasha, 1908"
 turkfm_tanzimat.009.a: "A new era dawns for the [ROOT.GetCountry.GetName]!"

 turkfm_tanzimat.010.t: "Modernized Agriculture"
 turkfm_tanzimat.010.d: "Despite centuries of stagnation in farming practices, the [ROOT.GetCountry.GetName] has adopting a series of agricultural reforms that will enable the Empire to sustain its growing population."
 turkfm_tanzimat.010.f: "While it will take time to see the end results, farmers have already begun to realize the benefits of directly owning their land and crops."
 turkfm_tanzimat.010.a: "This is good news."
 turkfm_tanzimat.011.t: "A Formidable Army"
 turkfm_tanzimat.011.d: "Decades of reform since the abolition of the Janissary Order have culminated in the recognition of the [ROOT.GetCountry.GetAdjective] $gbbf_armed_forces$ as a modern and formidable fighting force."
 turkfm_tanzimat.011.f: "In the chaos of the Auspicious Incident and wars with the Russians, the Empire has found the motivation to organize an army to meet the might of the West head-on."
 turkfm_tanzimat.011.a: "Our might will remain unquestioned"
 turkfm_tanzimat.012.t: "The Civic-Bureaucrats"
 turkfm_tanzimat.012.d: "Through an extensive and fundamental restructuring of the nature of the administration of the Empire, a new class of [GetPopType('bureaucrats').GetName] have emerged. With their focus on administrative tasks instead of the art of scribal-ism, the [ROOT.GetCountry.GetName] is poised to assert more direct control over its subjects."
 turkfm_tanzimat.012.f: ""...the scribal profession is the noblest and oldest of arts.\n-A grand-verzirial decree, 1824"
 turkfm_tanzimat.012.a: "These men will be the engines of reform."
 turkfm_tanzimat.013.t: "Revitalizing the Economy"
 turkfm_tanzimat.013.d: "[ROOT.GetCountry.GetName] has pushed forward economic changes that have begun the process of reorganizing the [ROOT.GetCountry.GetAdjectiveNoFormatting] state into an industrial nation."
 turkfm_tanzimat.013.f: "While still backwards in comparison to the West, these changes herald the end of feudal rule in [ROOT.GetCountry.GetNameNoFormatting]."
 turkfm_tanzimat.013.a: "Our future is bright."
 turkfm_tanzimat.014.t: "An Educated Populace"
 turkfm_tanzimat.014.d: "Educational reforms pushed forward by the National Assembly have brought into force the process of transforming [ROOT.GetCountry.GetAdjectiveNoFlag] people from a feudal society to one capable of doing business with the West."
 turkfm_tanzimat.014.f: "By uplifting our peasantry, the Empire will build the foundation of future prosperity."
 turkfm_tanzimat.014.a: "All shall reap the benefits."
 turkfm_tanzimat.014.b: "The Empire will thrive from this."
 turkfm_tanzimat.015.t: "Equality Before the Law"
 turkfm_tanzimat.015.d: "In reforming the Millet System and setting limitations on the rights of its confessional communities, the $turkfm_porte$ has made significant strides in placing the secular law before religious law."
 turkfm_tanzimat.015.f: "The only way to secure unity in the Empire is to ensure its law is applied equally and fairly."
 turkfm_tanzimat.015.a: "This is only fair."
 turkfm_tanzimat.016.t: "Countrysides Secured"
 turkfm_tanzimat.016.d: "Firm and decisive leadership from the state has led to the bandits ravaging our countryside putting down their weapons and taking up work as productive members of society."
 turkfm_tanzimat.016.f: "While a basic and mundane thing, ensuring the safety of our countrymen at home is an important step in legitimizing the state."
 turkfm_tanzimat.016.a: "Justly done."
 turkfm_tanzimat.017.t: "Slavery Abolished"
 turkfm_tanzimat.017.d: "As the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetHerHis] affixes his signature on the document abolishing Slavery, garrisons across the Empire are shuttering Slave markets and driving out slavers."
 turkfm_tanzimat.017.f: "By abandoning the ancient practice of Slavery, the Empire has removed once of the greatest obstacles to normalizing relations with the West."
 turkfm_tanzimat.017.a: "Justly done."
