 turkfm_tanzimat.020.t: "The Sultan in Mostar"
 turkfm_tanzimat.020.d: "Several Pashas have grown worried of the sudden rise in prominence of the Vizier of Herzegovina, [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName]. Rumors abound of his aspirations to establish his power base in Rumelia. Known loyalist [SCOPE.sCharacter('omer_pasha_scope').GetFullName] has offered his services to bring order to the region."
 turkfm_tanzimat.020.f: "Vizier of the [SCOPE.sCountry('hersek_scope').GetName], [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName], has made a bold challenge to the authority of the Sultan. In a drunken rant, he has named himself the 'Sultan of Mostar' in defiance of Constantinople."
 turkfm_tanzimat.020.a: "The $turkfm_porte$ cannot tolerate insubordination."
 turkfm_tanzimat.020.b: "This is of no concern to the Sultan."
 turkfm_tanzimat.021.t: "Ali Pasha Detained"
 turkfm_tanzimat.021.d: "At the direction of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], the treasonous [SCOPE.sCountry('hersek_scope').GetRuler.GetFullName] has been seized and stripped of his governorship. Our agent, General [SCOPE.sCharacter('omer_pasha_scope').GetFullName] awaits the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s orders."
 turkfm_tanzimat.021.f: ""Why dost thou torment me thus? Thou art a Vlach and the son of a Vlach! From whom hast thou authority to drag me thus? Aye, and had I taken arms against the Sultan himself, it is not to thee belongs the right to treat me as one taken in battle, wert thou three times Seraskier. Therefore, O unclean Vlach! Send me rather to my Padishah, that he may judge me, and vex me not in my old age!" -Ali Pasha to Omer Pasha"
 turkfm_tanzimat.021.a: "Off with his head."
 turkfm_tanzimat.021.b: "Let him rot in exile."
