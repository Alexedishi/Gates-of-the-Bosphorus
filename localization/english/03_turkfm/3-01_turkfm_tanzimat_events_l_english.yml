 turkfm_tanzimat.107.t: "The Tanzimat Uncontested"
 turkfm_tanzimat.107.d: "Quickly deferring to the will of the $turkfm_young_ottomans$, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has promulgated a basic constitution, at the very least allowing for nominal elections."
 turkfm_tanzimat.107.f: ""Every member of the Chamber of Deputies represents the whole of the Ottoman nation and not exclusively the district which has elected him." -THE OTTOMAN CONSTITUTION, ART. 72, promulgated 1876"
 turkfm_tanzimat.107.a: "Truly, a wise move by the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 turkfm_tanzimat.108.t: "The Young Ottomans Neutralized"
 turkfm_tanzimat.108.d: "Through a firm will and steady hand, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has deflected the $turkfm_young_ottoman$ plot. With their political clout broken, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s viziers stand ready to deal with the plotters."
 turkfm_tanzimat.108.f: "With their plans for aggressive reforms foiled, many plotters have pre-emptively self-exiled to the West."
 turkfm_tanzimat.108.a: "The Empire needs strong leadership."
 turkfm_tanzimat.109.t: "A "Bloodless" Coup"
 turkfm_tanzimat.109.d: "[ROOT.GetCountry.GetRuler.GetFirstName] is dead. The former [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] was informed of his deposition and held in the #bold Feriye Palace#!. Shortly after asking for a pair of scissors to clip his beard, the monarch was found dead with profuse bleeding from both of his wrists."
 turkfm_tanzimat.109.f: "The coup was as painless as it was non-violent. Students from the military academy marched into the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s court and informed the monarch that he was being relieved of his throne. With the blessing of the Şeyhülislâm, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] was taken from the Dolmabahçe Palace and ferried away from his court."
 turkfm_tanzimat.109.a: "This is [SCOPE.sCharacter('turkfm_murad_scope').GetFirstName]'s time to shine."

 turkfm_tanzimat.110.t: "A Broken Sultan"
 turkfm_tanzimat.110.d: "Despite initial hopes of a fruitful reign, it has become clear that [ROOT.GetCountry.GetRuler.GetFirstName] has been badly shaken by the unexpected death of Abdulaziz. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has become increasingly withdrawn from public life with several duties going neglected."
 turkfm_tanzimat.110.f: "Anxiety and despair have gripped the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s mind. Between fear of being framed for the death of Abdulaziz, and the pressures of adjusting to the throne, the monarch has been afflicted with fits and emotional outbursts."
 turkfm_tanzimat.110.a: "What a tragic outcome."
 turkfm_tanzimat.111.t: "Renewed Momentum"
 turkfm_tanzimat.111.d: "Despite some initial concerns of his mental fortitude, the newly crowned [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has adjusted well to his new role. Day by the day, the Empire at large is coming to recognize [ROOT.GetCountry.GetRuler.GetFirstName] as the true ruler of the [ROOT.GetCountry.GetName]."
 turkfm_tanzimat.111.f: "With a clear mind and the support of his ministers, the new monarch has seized on the promise of a new future for the Empire."
 turkfm_tanzimat.111.a: "Onward, to progress!"
 turkfm_tanzimat.112.t: "Deposing an Invalid"
 turkfm_tanzimat.112.d: "Despite hope by his ministers, [ROOT.GetCountry.GetRuler.GetFirstName] has spiraled into paranoia and depression. Visits by western physicians only confirmed what everyone already knew: that the Sultan was unfit to rule. Once more, backed by the Şeyhülislâm, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been deposed and ordered confined to the Çırağan Palace. [SCOPE.sCharacter('turkfm_abdulhamid_scope').GetFirstName] will now ascend to the throne."
 turkfm_tanzimat.112.f: ""I made a mistake in wishing to content myself with the example of my father, $Abdulmecid$, who sought to carry out reforms by persuading the people and creating liberal institutions. From now on, I shall follow the example of my grandfather, $Sultan$ $Mahmud$. Like him, I now understand that it is not possible to move the peoples whom God has placed under my protection by any means other than force." -$Sultan$ $Abdul_Hamid$, 1878"
 turkfm_tanzimat.112.a: "The Empire deserves a strong ruler."
 
