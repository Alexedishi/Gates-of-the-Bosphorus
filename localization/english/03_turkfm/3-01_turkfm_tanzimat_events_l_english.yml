 turkfm_tanzimat.100.t: "Yeni Osmanlılar"
 turkfm_tanzimat.100.d: "In response to the ascent of an [GetIdeology('ideology_authoritarian').GetName] [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], a determined group of $turkfm_reformist$ [GetPopType('bureaucrats').GetName] have hatched a plot to ensure the success of the $turkfm_tanzimat$. Calling themselves the $turkfm_young_ottomans$, their plan hinges on deposing [ROOT.GetCountry.GetRuler.GetFirstName] and installing [SCOPE.sCharacter('turkfm_murad_scope').GetFirstName] to rule the [ROOT.GetCountry.GetName]."
 turkfm_tanzimat.100.f: "Loosely organized around [SCOPE.sCharacter('left_icon').GetFullName], the Young Ottomans have grown concerned that the Sultan intends to reject further reform efforts. Drawing from connections with the $gbbf_armed_forces$, they represent a credible threat to the Sultan."
 turkfm_tanzimat.100.a: "This is an affront to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 turkfm_tanzimat.101.t: "The Softas Take to the Streets"
 turkfm_tanzimat.101.d: "Dozens of students from the religious schools in [ROOT.GetCountry.GetCapital.GetCityHubName] have taken to the streets in protest against absolutism. Motivated by the publications of the $turkfm_young_ottomans$, these protests have disrupted traffic throughout the capital."
 turkfm_tanzimat.101.f: "Flush with the ideals of the $turkfm_tanzimat$ and inspired by similar protests in the West, the Empire's religious students have stunned the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] with their overt defiance."
 turkfm_tanzimat.101.a: "This is beneath the attention of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 turkfm_tanzimat.101.b: "Order these publishing shuttered."
 turkfm_tanzimat.101.c: "Send in the local garrisons."
