 # Notifications
 notification_notification_turkfm_expeditionary_force_arrives_name: "Ottoman Expeditionary Force Arrives at the Border"
 notification_notification_turkfm_expeditionary_force_arrives_desc: ""
 notification_notification_turkfm_expeditionary_force_withdraws_name: "Ottoman Expeditionary Force Withdraws from the Border"
 notification_notification_turkfm_expeditionary_force_withdraws_desc: ""
 notification_notification_turkfm_noble_released_name: "Ottoman Nobleman Released"
 notification_notification_turkfm_noble_released_desc: "Montenegrin raiders recently captured a minor noble during a $turkfm_black_mountain_frontier$ raid. Strangely, they have shown clemency and allowed him to return to Ottoman territory."
 notification_notification_turkfm_noble_captured_name: "Ottoman Nobleman Captured"
 notification_notification_turkfm_noble_captured_desc: "Montenegrin raiders have seized a minor noble during a $turkfm_black_mountain_frontier$ raid. This presents an embarrassing setback in the conflict."
 notification_notification_turkfm_folk_hero_killed_name: "Montenegrin Folk Hero Killed"
 notification_notification_turkfm_folk_hero_killed_desc: "Ottoman soldiers have dispatched a notable #yellow Montenegrin#! war leader. This has increased their $turkfm_black_mountain_influence$ over the $turkfm_black_mountain_frontier$ and galvanized the Montenegrin people against the $turkfm_porte$."
 notification_notification_turkfm_village_skirmish_name: "$turkfm_tribal_skirmish$ Escalates"
 notification_notification_turkfm_village_skirmish_desc: "News has arrived of an escalating conflict at a border village in [GetStateRegion('STATE_MONTENEGRO').GetName]. Militias on both sides have dug in for a prolonged fight."
 notification_notification_turkfm_villages_burned_name: "Village Outskirts Burned"
 notification_notification_turkfm_villages_burned_desc: "Several buildings on the outskirts of the village have been set aflame. This has cost us #v 1#! progress in the $turkfm_tribal_skirmish$"

 notification_notification_turkfm_jack_sparrow_reincarnated_name: "New Pirate Lord Rises"
 notification_notification_turkfm_jack_sparrow_reincarnated_desc: "With the passing of the previous pirate lord, [GetPlayer.MakeScope.Var('turkfm_jack_sparrow_var').GetCharacter.GetFullName] has emerged as the new leader for the Albanian pirates."
 notification_notification_turkfm_piracy_yearly_progress_name: "$turkfm_adriatic_expedition$ Makes Progress"
 notification_notification_turkfm_piracy_yearly_progress_desc: "[GetPlayer.MakeScope.Var('turkfm_cutler_beckett_var').GetCharacter.GetFullName]'s task force has picked up leads on pirate activity in the Adriatic."

 # Scripted Buttons
 turkfm_recall_expedition_button: "Recall $turkfm_expedition$"
 turkfm_recall_expedition_button_desc: "The state's needs are ever changing. Should we need, we can recall our $turkfm_expedition$ to free up resources."

 turkfm_renounce_headtaking_button: "Renounce Head-taking"
 turkfm_renounce_headtaking_button_desc: "The taking of heads is a bizarre and barbaric holdover of the tribal history of [GetStateRegion('STATE_MONTENEGRO').GetName]. While previous attempts at negotiating its abolition have failed, increased exposure to the West has provided renewed support for ending the practice."
 turkfm_renounce_headtaking_possible: "Negotiations on #bold Head-taking#! have not occurred within the last #bold 5#! years"
 turkfm_renounce_headtaking_effect: "Participants will make their choice on whether to suppress head-taking"

 turkfm_increase_raiding_button: ""Bring Me More Heads!""
 turkfm_increase_raiding_button_desc: "Encourage the tribes to raid more often, increasing [concept_raiding_frequency]. This will increase our income, but hurt [concept_relations] with #v $RUS$#! and especially the #v Ottoman Empire#!."
 turkfm_decrease_raiding_button: "Discourage Raiding"
 turkfm_decrease_raiding_button_desc: "Force the tribes to curtail their raiding, decreasing [concept_raiding_frequency]. $RUS$#! will appreciate this step towards civility towards the #v Ottoman Empire#!."

 turkfm_appoint_tribal_chief_button: "Appoint Tribal Chief"
 turkfm_appoint_tribal_chief_button_desc: ""
 turkfm_dismiss_tribal_chief_button: "Dismiss Tribal Chief"
 turkfm_dismiss_tribal_chief_button_desc: ""
 turkfm_ransom_captives_button: "Ransom Ottoman Noble"
 turkfm_ransom_captives_button_desc: "While they serve as a potent propaganda piece, the nobles we've captured do little for the cause beyond languishing in captivity. The Ottoman court may be interested in paying a ransom in exchange for a chance to save face."
 turkfm_ransom_captives_possible: "We have at least #bold 1#! captured noble"
 turkfm_negotiate_kotor_button: "Negotiate Adriatic Access"
 turkfm_negotiate_kotor_button_desc: "Kotor and its surrounding lands have long been home to the Montenegrin people, yet they have been unfairly cleaved from their countrymen by centuries of imperial designs. However, the Emperor in Vienna may be willing to lend us his ear in exchange for us aligning closer with his Empire."

 turkfm_assign_border_guard_button: "Deploy $turkfm_black_mountain_expedition$"
 turkfm_assign_border_guard_button_desc: "The border between Montenegro and the Ottoman Empire is ill-defined, with casual travel across the border being commonplace. With concerted effort, [ROOT.GetCountry.GetNameNoFlag] could extend its $turkfm_black_mountain_influence$ across the $turkfm_black_mountain_frontier$. However, the resident tribal leaders may not appreciate damages to their lands."

 turkfm_hire_retired_pirates_button: "Hire Retired Pirates"
 turkfm_hire_retired_pirates_button_desc: "The coasts of the Adriatic are not only home to active pirates- they host entire communities whose existence is inseparable from the sea. Many an experienced sailor would hardly turn down the offer at legal employment."

 turkfm_adriatic_expedition_button: "Deploy Adriatic Expedition"
 turkfm_adriatic_expedition_button_desc: "The Albanian pirates will never cease their activities until they are forced to. To that end, we should deploy an $turkfm_expedition$ to hunt them down."


