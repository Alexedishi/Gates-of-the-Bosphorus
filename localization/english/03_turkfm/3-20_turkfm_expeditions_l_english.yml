 turkfm_karadag_expedition: "#tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_adriatic_expedition_concept')] Expedition in the Black Mountain#!#!"
 turkfm_karadag_expedition_concept: "The #bold Montenegrin Frontier# has been isolated from the influences of the greater world by a mixture of rugged terrain and lack of development. As the Ottoman Empire lashes out in its death throes, the $turkfm_porte$ is determined to finally subjugate the Montenegrin tribes."
 turkfm_karadag_expedition_details: "If $turkfm_expedition$ $turkfm_expedition_progress$ reaches #bold #green 8#!#!, [ROOT.GetCountry.GetNameNoFlag] will increase its influence over the $turkfm_karadag_frontier$. If $turkfm_expedition$ $turkfm_expedition_peril$ reaches #red #bold 8#!#!, [ROOT.GetCountry.GetNameNoFlag]'s mission will fail."
 turkfm_karadag_frontier: "#o #tooltip:[GetRawTextTooltipTag('turkfm_karadag_frontier_concept')] Montenegrin Frontier#!#!"
 turkfm_karadag_frontier_concept: "The #bold Montenegrin Frontier#! has been in a fractured and decentralized state since the collapse of Byzantine and Serbian imperial rule. By leveraging $turkfm_karadag_influence$, the Montenegrin and Ottoman states can lure the tribes into their rule."
 turkfm_karadag_influence: "#o #tooltip:[GetRawTextTooltipTag('turkfm_karadag_influence_concept')] Frontier Influence#!#!"
 turkfm_karadag_influence_concept: "#bold Frontier Influence#! represents the amount of socio-political sway a state holds over the Montenegrin tribes."

