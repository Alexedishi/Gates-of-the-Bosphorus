# Journal Entry Groups
 je_group_turkfm_expeditions: "Expeditions to the Orient"

# Journal Entries
 je_turkfm_black_mountain: "The Lands of the Black Mountain"
 je_turkfm_black_mountain_reason: "In many ways, the vicious frontier of [GetStateRegion('STATE_MONTENEGRO').GetName] has preserved many of the pre-medieval customs of conflict and tribal rule. From slave raids to the taking of heads, the hinterlands represent a bizarre holdover of tribalistic behavior to the outside world. As the Ottoman Empire struggles to assert its sovereignty, it looks to finally bring the Montenegrin people to heel."
 je_turkfm_karadag: "The Lands of the Black Mountain"
 je_turkfm_karadag_reason: "In many ways, the vicious frontier of [GetStateRegion('STATE_MONTENEGRO').GetName] has preserved many of the pre-medieval customs of conflict and tribal rule. From slave raids to the taking of heads, the hinterlands represent a bizarre holdover of tribalistic behavior to the outside world. As the Ottoman Empire struggles to assert its sovereignty, it looks to finally bring the Montenegrin people to heel.\n$TOOLTIP_DELIMITER$\n[ROOT.GetCountry.GetNameNoFlag] controls #tooltippable;tooltip:[Country.GetTooltipTag],turkfm_provinces_breakdown [GetPlayer.MakeScope.Var('turkfm_provinces_var').GetValue]#! provinces in [GetStateRegion('STATE_MONTENEGRO').GetName].\n\n#bold #white Monthly #tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_karadag_mon_factors')] Montenegrin Influence#!#!#!:#! #tooltippable;tooltip:[Country.GetTooltipTag],turkfm_karadag_mon_breakdown [GetPlayer.MakeScope.Var('turkfm_karadag_mon_var').GetValue]#!\n#bold #white Monthly #tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_karadag_tur_factors')] Ottoman Influence#!#!#!:#! #tooltippable;tooltip:[Country.GetTooltipTag],turkfm_karadag_tur_breakdown [GetPlayer.MakeScope.Var('turkfm_karadag_tur_var').GetValue]#!\n#italic When $turkfm_karadag_influence$ is at either extreme, that country will gain a #yellow Montenegrin#! province#!.[SCOPE.GetRootScope.GetCountry.GetCustom('turkfm_karadag_expedition_type')]"

