l_english:
 mgrbfm_libya.001.t: "On the Margins of the Empire"
 mgrbfm_libya.001.d: "[ROOT.GetCountry.GetName] is less a country than it is an imperial outpost. For centuries these lands along the mediterranean have served as extensions of foreign empires. From the urban hubs on the shores of [GetStateRegion('STATE_TRIPOLI').GetName] and [GetStateRegion('STATE_LIBYA').GetName] to the expanses of [GetStateRegion('STATE_LIBYAN_DESERT').GetName], life has continued relatively unchanged for the locals.$com_lb$With its recent reintegration into the [ROOT.GetCountry.GetPowerBloc.GetName], [ROOT.GetCountry.GetOverlord.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetOverlord.GetRuler.GetFirstName] in [GetStateRegion('STATE_EASTERN_THRACE').GetCityHubName] has given [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] a mandate to enforce a centralized and effective administration in [ROOT.GetCountry.GetNameNoFlag]. The first order of business is to bring order to [SCOPE.sCountry('fezzan_scope').GetName] led by [SCOPE.sCountry('fezzan_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('fezzan_scope').GetRuler.GetFullName]."
 mgrbfm_libya.001.f: ""
 mgrbfm_libya.001.a: "[ROOT.GetCountry.GetName] will find its way."
 mgrbfm_libya.001.tt: "#red #bold #italic [ROOT.GetCountry.GetNameNoFlag] is at [concept_war] with [SCOPE.sCountry('fezzan_scope').GetNameNoFlag]!#!#!#!"
 
 mgrbfm_libya.002.t: "Centralizing the Deserts"
 mgrbfm_libya.002.d: "With the conclusion of the conflict with the Fezzanis, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s advisors have wasted little time in reminding him of his goal in [ROOT.GetCountry.GetNameNoFlag]: asserting [GetCulture('turkish').GetName] control over the vast Libyan deserts. With sparse [GetCulture('mashriqi').GetName] settlements along the coastline and disloyal [GetCulture('bedouin').GetName] tribes in the south, there is much to be done towards securing Libya."
 mgrbfm_libya.002.f: "\"If Abu Zayd the Hilalian did not cultivate his own land, then why would he care if another land became a desert?\" —Libyan proverb"
 mgrbfm_libya.002.a: "They will make loyal subjects."
 
 mgrbfm_libya.003.t: "An Untamed Frontier"
 mgrbfm_libya.003.d: "With [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]'s mandate to govern the [ROOT.GetCountry.GetName] has also come an imperative to extend the authority of the [ROOT.GetCountry.GetOverlord.GetName]."
 mgrbfm_libya.003.f: "The [ROOT.GetCountry.GetAdjectiveNoFlag] administration asserts a nominal claim to the [GetStateRegion('STATE_LIBYAN_DESERT').GetName], yet central authority beyond the major cities is tenuous at best. The [GetCulture('bedouin').GetName] tribes keep their own laws in the deserts beyond."
 mgrbfm_libya.003.a: "We will master the desert."
 mgrbfm_libya.003.b: "No expense will be spared."
 
 mgrbfm_libya.004.t: "The Libyan Deserts"
 mgrbfm_libya.004.d: "Through concerted efforts, the [ROOT.GetCountry.GetAdjective] government has succeeded in taming the frontier of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName] and has brought this vital link to the south under state control."
 mgrbfm_libya.004.f: "While often construed as a wasteland by Europeans, the deserts have long hosted a flourishing network of nomadic peoples."
 mgrbfm_libya.004.a: "These lands belong to [ROOT.GetCountry.GetName]"
 
 mgrbfm_libya.009.t: "A Centralized State"
 mgrbfm_libya.009.d: "In a heavily rehearsed ceremony, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] proclaimed the restructuring of [ROOT.GetCountry.GetName] and has elevated the law of the state above that of the tribes."
 mgrbfm_libya.009.f: "One by one, the tribal heads have sworn their allegiance to the central authority in [ROOT.GetCountry.GetCapital.GetCityHubName]. With their support, the will of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] will reach even to the deserts."
 mgrbfm_libya.009.a: "This is a great day for [ROOT.GetCountry.GetName]!"