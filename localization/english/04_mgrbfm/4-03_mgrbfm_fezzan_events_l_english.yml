l_english:
 mgrbfm_fezzan.001.t: "The Country of Pheasants"
 mgrbfm_fezzan.001.d: "The lands of [ROOT.GetCountry.GetName] are rugged and desolate. Inhabited by mostly nomadic [GetCulture('bedouin').GetName] tribes, the country has little resembling central governance."
 mgrbfm_fezzan.001.f: "[ROOT.GetCountry.GetNameNoFlag] has served as a linchpin in regional trade, allowing goods and ideas to cross the otherwise insurmountable Sahara. By leveraging knowledge of the desert terrain, tribal leaders have long extracted wealth from trade across their lands. As the $turkfm_tanzimat$ looms, this era may be coming to an end."
 mgrbfm_fezzan.001.a: "[ROOT.GetCountry.GetName] must find its way."
 mgrbfm_fezzan.001.tt: "#red #bold #italic [ROOT.GetCountry.GetNameNoFlag] is at [concept_war] with [SCOPE.sCountry('fezzan_scope').GetNameNoFlag]!#!#!#!"
 mgrbfm_fezzan.002.t: "Securing [GetStateRegion('STATE_LIBYAN_DESERT').GetName]"
 mgrbfm_fezzan.002.d: "Despite the best efforts of the Sultan's lackeys, [ROOT.GetCountry.GetName] stands strong. This has done little to ease the worries of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], who sees threats from both Europe and Asia as foreign powers seek to dominate [GetStrategicRegion('region_north_africa').GetName]."
 mgrbfm_fezzan.002.f: ""If Abu Zayd the Hilalian did not cultivate his own land, then why would he care if another land became a desert?" -Libyan proverb"
 mgrbfm_fezzan.002.a: "We must secure our borders."
