l_english:
 # Journal Entries
 je_mgrbfm_egypt_muhammad_ali: "The Ambitions of Muhammad 'Ali"
 je_mgrbfm_egypt_muhammad_ali_reason: "\"#italic I am well aware that the Ottoman Empire is heading by the day toward destruction. ... On her ruins I will build a vast kingdom ... up to the Euphrates and the Tigris.\" -Muhammad 'Ali#!\n\n Through military prowess and political cunning, $Muhammad_Ali$ rose from his roots in rural [GetStateRegion('STATE_ALBANIA').GetName] to become the unquestioned ruler of [ROOT.GetCountry.GetName]. As the $turkfm_porte$ struggles to find its footing, $Muhammad_Ali$ seeks to entrench the #bold $al-_Alawi$#! dynasty as the hereditary rulers of a restored Egyptian Empire."
 je_mgrbfm_egypt_muhammad_ali_complete_1: "[ROOT.GetCountry.GetAdjectiveNoFlag] [concept_army_power_projection] is greater than that of the [SCOPE.sCountry('ottoman_scope').GetNameNoFlag] (Currently #v [JournalEntry.MakeScope.Var('mgrbfm_egy_army_projection').GetValue|1]#! vs #v [JournalEntry.MakeScope.Var('mgrbfm_tur_army_projection').GetValue|1]#!)"
 je_mgrbfm_egypt_muhammad_ali_complete_2: "[ROOT.GetCountry.GetAdjectiveNoFlag] [concept_naval_power_projection] is greater than that of the [SCOPE.sCountry('ottoman_scope').GetNameNoFlag] (Currently #v [JournalEntry.MakeScope.Var('mgrbfm_egy_navy_projection').GetValue|1]#! vs #v [JournalEntry.MakeScope.Var('mgrbfm_tur_navy_projection').GetValue|1]#!)"
 je_mgrbfm_egypt_muhammad_ali_complete_3: "[ROOT.GetCountry.GetNameNoFlag] $gbbf_fully_owns$ #bold 4 or more#! $gbbf_state_regions$ in the [GetStrategicRegion('region_nile_basin').GetName]"
 je_mgrbfm_egypt_muhammad_ali_complete_4: "[ROOT.GetCountry.GetNameNoFlag] $gbbf_fully_owns$ #bold 6 or more#! $gbbf_state_regions$ in the [GetGeographicRegion('geographic_region_levant').GetName]"
 je_mgrbfm_egypt_muhammad_ali_fail: "Neither #bold Muhammad 'Ali#! nor his son, #bold Ibrahim#!, rules [ROOT.GetCountry.GetNameNoFlag]"
 je_mgrbfm_egypt_muhammad_ali_status: "[ROOT.GetCountry.GetRuler.GetFirstName] rules [ROOT.GetCountry.GetName]"
 
 je_mgrbfm_egypt_modernization: "Dawn of the New Egypt"
 je_mgrbfm_egypt_modernization_reason: "Since the expulsion of the [GetCulture('french').GetName] from [ROOT.GetCountry.GetName], the country has made massive efforts towards modernization and industrialization. With the looming threats of European colonialism and the disintegration of the Ottoman Empire, Egypt must be capable to stand on its own.$gbbf_linebreak_normal$#bold Modernization Efforts#! have reached #v [JournalEntry.MakeScope.Var('mgrbfm_egypt_modernization_var').GetValue]#! progress. This is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_mgrbfm_egypt_modernization_breakdown [JournalEntry.MakeScope.Var('mgrbfm_egypt_modernization_progress_var').GetValue|+=]#! next month.$gbbf_linebreak_normal$$je_mgrbfm_egypt_modernization_factors$"
 je_mgrbfm_egypt_modernization_breakdown: "[Country.MakeScope.GetScriptValueDesc('mgrbfm_egypt_modernization_progress_value')]"
 je_mgrbfm_egypt_modernization_complete: "#bold Modernization Efforts#! have reached #v 100#! #bold or greater#! progress (Currently #v [JournalEntry.MakeScope.Var('mgrbfm_egypt_modernization_var').GetValue]#!)"
 
 je_mgrbfm_egypt_modernization_factors: "The following factors will influence #bold Modernization Efforts#!\n • [concept_prestige] of [ROOT.GetCountry.GetNameNoFlag]\n • Average [concept_literacy] in [ROOT.GetCountry.GetNameNoFlag]\n • Total number of [concept_institution] $gbbf_investment_levels$\n • [ROOT.GetCountry.GetNameNoFlag] being an [concept_unrecognized_power]\n • Number of [GetBuildingType('gbbf_building_nile_barrage').GetName] $gbbf_buildings$\n • Number of [GetCulture('misri').GetName] [concept_homeland] $gbbf_states$ with a [GetBuildingType('building_railway').GetName]\n • Total number of $gbbf_country_monopolies$\n • [concept_urbanization] of [GetCulture('misri').GetName] [concept_homeland] $gbbf_states$ in [ROOT.GetCountry.GetNameNoFlag]\n • Average $gbbf_radicalism$ in [GetCulture('misri').GetName] [concept_homeland] $gbbf_states$ in [ROOT.GetCountry.GetNameNoFlag]\n • Average [concept_sol] compared to the average [concept_expected_sol] in [ROOT.GetCountry.GetNameNoFlag]"
 
 je_mgrbfm_egypt_nile_river: "Taming the Nile"
 je_mgrbfm_egypt_nile_river_reason: "The [concept_nile_floods] have been an annual occurrence since prehistory, and countless attempts to control the ferocity of the river have failed over the millennia. Keen to harness the newfound industrial might of Egypt, Muhammad 'Ali has inaugurated renewed attempts to tame the Great Black River in the name of agriculture and stability.\n\n@information! As long as the [GetGeographicRegion('geographic_region_lower_nile').GetName] remains uncontrolled, our $gbbf_state_regions$ will be at risk of the [GetHarvestConditionType('flood').GetName] [concept_harvest_condition]."
 je_mgrbfm_egypt_nile_river_complete_status_1: "The Nile is poorly controlled ([GetGlobalVariable('mgrbfm_nile_control_var').GetValue]/5)"
 je_mgrbfm_egypt_nile_river_complete_status_2: "The Nile is partially controlled ([GetGlobalVariable('mgrbfm_nile_control_var').GetValue]/5)"
 je_mgrbfm_egypt_nile_river_complete_status_3: "The Nile is mostly controlled ([GetGlobalVariable('mgrbfm_nile_control_var').GetValue]/5)"

 je_mgrbfm_egypt_nationalism: "Egyptian Nationalism"
 je_mgrbfm_egypt_nationalism_reason: "$je_mgrbfm_egypt_nationalism_flavor$$gbbf_linebreak_normal$$je_mgrbfm_egypt_nationalism_details$"
 
 je_mgrbfm_egypt_nationalism_flavor: "Despite uncountable millennia of civilization in the valleys of the Nile, Egypt has never hosted a cohesive identity shared by its people. Inspired by European Nationalism, intellectuals have engaged in a fierce debate over what should constitute a $mgrbfm_national_identity$ in the Egyptian state."
 je_mgrbfm_egypt_nationalism_details: "#white • The [GetCulture('misri').GetName] $mgrbfm_identity$ has #tooltippable;tooltip:[Country.GetTooltipTag],je_mgrbfm_egypt_nationalism_misri_breakdown [JournalEntry.MakeScope.Var('mgrbfm_misri_identity_var').GetValue]#! support from #bold #tooltippable #tooltip:[GetRawTextTooltipTag('je_mgrbfm_egypt_nationalism_misri_factors')] its factors#!#!#!.\n • The [GetCulture('arab').GetName] $mgrbfm_identity$ has #tooltippable;tooltip:[Country.GetTooltipTag],je_mgrbfm_egypt_nationalism_arab_breakdown [JournalEntry.MakeScope.Var('mgrbfm_arab_identity_var').GetValue]#! support from #bold #tooltippable #tooltip:[GetRawTextTooltipTag('je_mgrbfm_egypt_nationalism_arab_factors')] its factors#!#!#!.• The [GetCulture('misri').GetName]-[GetCulture('coptic').GetName] $mgrbfm_identity$ has #tooltippable;tooltip:[Country.GetTooltipTag],je_mgrbfm_egypt_nationalism_copt_breakdown [JournalEntry.MakeScope.Var('mgrbfm_copt_identity_var').GetValue]#! support from #bold #tooltippable #tooltip:[GetRawTextTooltipTag('je_mgrbfm_egypt_nationalism_copt_factors')] its factors#!#!#![GetPlayer.GetCustom('mgrbfm_artifact_contribution_type')]."
 
 je_mgrbfm_egypt_nationalism_misri_factors: "The following factors will contribute support for the [GetCulture('misri').GetName] $mgrbfm_identity$:"
 je_mgrbfm_egypt_nationalism_arab_factors: "The following factors will contribute support for the Pan-[GetCulture('arab').GetName] $mgrbfm_identity$:"
 je_mgrbfm_egypt_nationalism_copt_factors: "The following factors will contribute support for the [GetCulture('misri').GetName]-[GetCulture('coptic').GetName] $mgrbfm_identity$:"
 
 je_mgrbfm_egypt_nationalism_misri_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('mgrbfm_misri_identity_value')]"
 je_mgrbfm_egypt_nationalism_arab_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('mgrbfm_arab_identity_value')]"
 je_mgrbfm_egypt_nationalism_copt_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('mgrbfm_copt_identity_value')]"
 
 je_mgrbfm_egypt_nationalism_complete: "[ROOT.GetCountry.GetNameNoFlag] has embraced a $mgrbfm_national_identity$"
 je_mgrbfm_egypt_nationalism_on_complete_1: "If [ROOT.GetCountry.GetNameNoFlag] embraces a [GetCulture('misri').GetName] $mgrbfm_identity$:\n • Triggers the Event #white --#!\n • [GetCulture('misri').GetName] will remain the $gbbf_primary_culture$ of [ROOT.GetCountry.GetNameNoFlag]"
 je_mgrbfm_egypt_nationalism_on_complete_2: "If [ROOT.GetCountry.GetName] embraces a #yellow Pan-[GetCulture('arab').GetName] $mgrbfm_identity$:\n • Triggers the Event #white --#!\n • [GetCulture('arab').GetName] will become a $gbbf_primary_culture$ of [ROOT.GetCountry.GetNameNoFlag]\n • [GetCulture('misri').GetName] will no longer be a $gbbf_primary_culture$ of [ROOT.GetCountry.GetNameNoFlag] \n • A majority of [GetCulture('misri').GetName] $gbbf_pops$ in [ROOT.GetCountry.GetNameNoFlag] will assimilate to this culture"
 je_mgrbfm_egypt_nationalism_on_complete_3: "If [ROOT.GetCountry.GetName] embraces a hybrid [GetCulture('misri').GetName]-[GetCulture('coptic').GetName] $mgrbfm_identity$:\n • Triggers the Event #white --#!\n • [GetCulture('misri').GetName] will remain the $gbbf_primary_culture$ of [ROOT.GetCountry.GetNameNoFlag]\n • [GetCulture('coptic').GetName] will become a $gbbf_primary_culture$ of [ROOT.GetCountry.GetNameNoFlag]"
 je_mgrbfm_egypt_nationalism_on_complete_4: "If [ROOT.GetCountry.GetName] enacts [GetLawType('law_ethnostate').GetName]:\n • Triggers the Event #white --#!\n • [GetCulture('misri').GetName] will remain the $gbbf_primary_culture$ of [ROOT.GetCountry.GetNameNoFlag]"
 
 je_mgrbfm_egypt_imperialism: "The Egyptian Empire"
 je_mgrbfm_egypt_imperialism_reason: "[ROOT.GetCountry.GetName]'s future depends entirely on its ability to stand apart from both the Ottoman Empire and the European powers. The only way that [ROOT.GetCountry.GetCapital.GetCityHubName] can ensure its survival is to project a new order in the Orient."
 je_mgrbfm_egypt_imperialism_complete: "No $gbbf_states$ in [GetStrategicRegion('geographic_region_greater_egypt').GetName] are owned by #bold Ottoman Empire#!, any of its $gbbf_subjects$, nor any member of its [concept_power_bloc]"
 mgrbfm_egypt_imperialism_completed: "[ROOT.GetCountry.GetNameNoFlag] has completed either the #bold $je_mgrbfm_egypt_muhammad_ali$#! or #bold $je_mgrbfm_egypt_imperialism$#! [concept_journal_entry]"
 
 je_mgrbfm_egypt_arabia: "The Egyptian Caliphate"
 je_mgrbfm_egypt_arabia_reason: "For nearly a millennium, dynasties based in Cairo have contested supremacy over the Arab world. With the [ROOT.GetCountry.GetAdjectiveNoFlag] Empire's position firmly established in the Orient, all that remains is to reclaim the mantle of the Caliphate by spreading our influence across the Arab world."
 
 je_mgrbfm_egypt_sudan: "The Subjugation of Sudan"
 je_mgrbfm_egypt_sudan_reason: "#italic \"You are aware that the end of all our effort and this expense is to procure negroes. Please show zeal in carrying out our wishes in the capital matter.\" —$Muhammad_Ali$ to  Muhammad Bey Khusraw, 23 September 1823#!\n\nAfter his extermination of the Mamluks, $Muhammad_Ali$ as set about expanding Egyptian influence with the aim of breaking the country's dependence on the Ottoman economy. Chief among these is the extraction of resources from the Sudan- both human and natural."
 je_mgrbfm_egypt_sudan_kordofan: "[GetStateRegion('STATE_KORDOFAN').GetName] is an [concept_incorporated_state] and has #bold less than#! #v 25%#! $gbbf_radicalism$"
 je_mgrbfm_egypt_sudan_blue_nile: "[GetStateRegion('STATE_BLUE_NILE').GetName] is an [concept_incorporated_state] and has #bold less than#! #v 25%#! $gbbf_radicalism$"
 je_mgrbfm_egypt_sudan_dongola: "[GetStateRegion('STATE_DONGOLA').GetName] is an [concept_incorporated_state] and has #bold less than#! #v 25%#! $gbbf_radicalism$"
 
 je_mgrbfm_egypt_ethiopia: "The Ethiopian Frontier"
 je_mgrbfm_egypt_ethiopia_reason: "Since the first expeditions of $Muhammad_Ali$, military planners and the Khedives themselves have dreamed of controlling the entirety of the Nile Basin. Within the highlands of Ethiopia lies the source of the Blue Nile. Between the river and the resources around it, this is an essential goal for the Egyptian state."
 
 # Journal Entry Lobby Text
 je_mgrbfm_egypt_muhammad_ali_lobby: "Through military prowess and political cunning, $Muhammad_Ali$ rose from his roots in rural Albania to become the unquestioned ruler of Egypt. As the $turkfm_porte$ struggles to find its footing, $Muhammad_Ali$ seeks to entrench the #bold $al-_Alawi$#! dynasty as the hereditary rulers of a restored Egyptian Empire."
 je_mgrbfm_egypt_modernization_lobby: "Egypt has struggled to assert its autonomy from the Ottoman Empire. Under the rulership of $Muhammad_Ali$, the Egyptian state must industrialize before it to falls under the sway of the European powers."
 
