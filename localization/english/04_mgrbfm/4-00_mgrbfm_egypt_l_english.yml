 mgrbfm_value_from_prestige: "From the [concept_prestige] of [ROOT.GetCountry.GetNameNoFlag]"
 mgrbfm_value_from_literacy_rate: "From the average [concept_literacy] in [ROOT.GetCountry.GetNameNoFlag]"
 mgrbfm_value_from_misri_urbanization: "From the [concept_urbanization] of [GetCulture('misri').GetName] [concept_homeland] [concept_state]#o s#! in [ROOT.GetCountry.GetNameNoFlag]"
 mgrbfm_value_from_average_vs_expected_sol: "From the average [concept_sol] compared to the average [concept_expected_sol] in [ROOT.GetCountry.GetNameNoFlag]"
 mgrbfm_value_from_unrecognized: "From [ROOT.GetCountry.GetNameNoFlag] being an [concept_unrecognized_power]"
 mgrbfm_value_from_misri_radicalism: "From the average [concept_radical]#o ism#! in [GetCulture('misri').GetName] [concept_homeland] [concept_state]#o s#! in [ROOT.GetCountry.GetNameNoFlag]"
 
