 mgrbfm_fully_owns: "#tooltippable #tooltip:[GetRawTextTooltipTag('mgrbfm_fully_owns_desc')] fully owns#!#!"
 mgrbfm_fully_owns_desc: "A #bold fully owned#! [concept_state_region] is one that completely controlled by a single [concept_country]."