 # Tooltips
 mgrbfm_identity: "@gbbf_identity! #o #tooltip:[GetPlayer.GetTooltipTag],mgrbfm_identity_desc Identity#!#!"
 mgrbfm_identity_desc: "@gbbf_identity! #header Egyptian Identity#!\n$TOOLTIP_DELIMITER$\n The lands known as Egypt have changed hands countless times from the fringes of early history to the industrial. Through Kemetic, Greek, and now Arab eras, the people of Egypt have never experienced a singular, unified cultural identity that they have valued over their own villages and tribes. Inspired by the ideals of European Nationalism, the nascent Egyptian intellectual sphere has begun to develop a vision of a singular Egyptian identity that transcends both state and ruler. This movement is fraught with division, as thinker clash over whether such an identity should be rooted in the country's ethnic, religious, or territorial history."
 mgrbfm_identities: "@gbbf_identity! #o #tooltip:[GetPlayer.GetTooltipTag],mgrbfm_identity_desc Identities#!#!"
 mgrbfm_national_identity: "@gbbf_identity! #o #tooltip:[GetPlayer.GetTooltipTag],mgrbfm_identity_desc National Identity#!#!"