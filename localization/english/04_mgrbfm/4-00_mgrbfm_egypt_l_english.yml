l_english:
 # Journal Entries
 je_mgrbfm_egypt_muhammad_ali: "The Ambitions of Muhammad 'Ali"
 je_mgrbfm_egypt_muhammad_ali_reason: ""#italic I am well aware that the Ottoman Empire is heading by the day toward destruction. ... On her ruins I will build a vast kingdom ... up to the Euphrates and the Tigris." -Muhammad 'Ali#!\n\n Through military prowess and political cunning, $Muhammad_Ali$ rose from his roots in rural [GetStateRegion('STATE_ALBANIA').GetName] to become the unquestioned ruler of [ROOT.GetCountry.GetName]. As the $turkfm_porte$ struggles to find its footing, $Muhammad_Ali$ seeks to entrench the #bold $al-_Alawi$#! dynasty as the hereditary rulers of a restored Egyptian Empire."
 je_mgrbfm_egypt_muhammad_ali_complete_1: "[ROOT.GetCountry.GetAdjectiveNoFlag] [concept_army_power_projection] is greater than that of the [SCOPE.sCountry('ottoman_scope').GetNameNoFlag] (Currently #v [JournalEntry.MakeScope.Var('mgrbfm_egy_army_projection').GetValue|1]#! vs #v [JournalEntry.MakeScope.Var('mgrbfm_tur_army_projection').GetValue|1]#!)"
 je_mgrbfm_egypt_muhammad_ali_complete_2: "[ROOT.GetCountry.GetAdjectiveNoFlag] [concept_naval_power_projection] is greater than that of the [SCOPE.sCountry('ottoman_scope').GetNameNoFlag] (Currently #v [JournalEntry.MakeScope.Var('mgrbfm_egy_navy_projection').GetValue|1]#! vs #v [JournalEntry.MakeScope.Var('mgrbfm_tur_navy_projection').GetValue|1]#!)"
 je_mgrbfm_egypt_muhammad_ali_complete_3: "[ROOT.GetCountry.GetNameNoFlag] $gbbf_fully_owns$ #bold 4 or more#! [Concept('concept_state_region','$concept_state_regions$')] in the [GetStrategicRegion('region_nile_basin').GetName]"
 je_mgrbfm_egypt_muhammad_ali_complete_4: "[ROOT.GetCountry.GetNameNoFlag] $gbbf_fully_owns$ #bold 6 or more#! [Concept('concept_state_region','$concept_state_regions$')] in the [GetGeographicRegion('geographic_region_levant').GetName]"
 je_mgrbfm_egypt_muhammad_ali_fail: "Neither #bold Muhammad 'Ali#! nor his son, #bold Ibrahim#!, rules [ROOT.GetCountry.GetNameNoFlag]"
 je_mgrbfm_egypt_muhammad_ali_status: "[ROOT.GetCountry.GetRuler.GetFirstName] rules [ROOT.GetCountry.GetName]"
 
 je_mgrbfm_egypt_modernization: "Dawn of the New Egypt"
 je_mgrbfm_egypt_modernization_reason: "Since the expulsion of the [GetCulture('french').GetName] from [ROOT.GetCountry.GetName], the country has made massive efforts towards modernization and industrialization. With the looming threats of European colonialism and the disintegration of the Ottoman Empire, Egypt must be capable to stand on its own.$gbbf_linebreak_normal$#bold Modernization Efforts#! have reached #v [JournalEntry.MakeScope.Var('mgrbfm_egypt_modernization_var').GetValue]#! progress. This is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_mgrbfm_egypt_modernization_breakdown [JournalEntry.MakeScope.Var('mgrbfm_egypt_modernization_progress_var').GetValue|+=]#! next month.$gbbf_linebreak_normal$The following factors will influence #bold Modernization Efforts#!\n • [concept_prestige] of [ROOT.GetCountry.GetNameNoFlag]\n • Average [concept_literacy] in [ROOT.GetCountry.GetNameNoFlag]\n • [concept_urbanization] of [GetCulture('misri').GetName] [concept_homeland] [Concept('concept_state','$concept_states$')] in [ROOT.GetCountry.GetNameNoFlag]\n • Average [concept_sol] compared to the\n   average [concept_expected_sol] in [ROOT.GetCountry.GetNameNoFlag]\n • Total amount of [concept_institution] [Concept('concept_investment_level','$concept_investment_levels$')]\n • [ROOT.GetCountry.GetNameNoFlag] being an [concept_unrecognized_power]\n • Average [Concept('concept_radical','$concept_radicalism$')] in [GetCulture('misri').GetName] [concept_homeland] [Concept('concept_state','$concept_states$')] in [ROOT.GetCountry.GetNameNoFlag]"
 je_mgrbfm_egypt_modernization_breakdown: "[Country.MakeScope.GetScriptValueDesc('mgrbfm_egypt_modernization_progress_value')]"
 je_mgrbfm_egypt_modernization_complete: "#bold Modernization Efforts#! have reached #v 100#! #bold or greater#! progress (Currently #v [JournalEntry.MakeScope.Var('mgrbfm_egypt_modernization_var').GetValue]#!)"

 je_mgrbfm_egypt_nationalism: "Egyptian Nationalism"
 je_mgrbfm_egypt_nationalism_reason: "$je_mgrbfm_egypt_nationalism_flavor$ $gbbf_linebreak_normal$$je_mgrbfm_egypt_nationalism_details$"
 
 je_mgrbfm_egypt_nationalism_flavor: "Despite uncountable millennia of civilization in the valleys of the Nile, Egypt has never hosted a cohesive identity shared by its people. Inspired by European Nationalism, intellectuals have engaged in a fierce debate over what should constitute a $mgrbfm_national_identity$ in the Egyptian state."
 je_mgrbfm_egypt_nationalism_details: ""
 je_mgrbfm_egypt_nationalism_misri_factors: "The following factors will contribute support for the [GetCulture('misri').GetName] $mgrbfm_identity$:"
 je_mgrbfm_egypt_nationalism_arab_factors: "The following factors will contribute support for the Pan-[GetCulture('arab').GetName] $mgrbfm_identity$:"
 je_mgrbfm_egypt_nationalism_copt_factors: "The following factors will contribute support for the [GetCulture('misri').GetName]-[GetCulture('coptic').GetName] $mgrbfm_identity$:"
 
 je_mgrbfm_egypt_nationalism_complete: "[ROOT.GetCountry.GetNameNoFlag] has embraced a $mgrbfm_national_identity$"
 je_mgrbfm_egypt_nationalism_on_complete_1: "If [ROOT.GetCountry.GetNameNoFlag] embraces a [GetCulture('misri').GetName] $mgrbm_identity$:\n • Triggers the Event #white --#!\n • [GetCulture('misri').GetName] will remain the [Concept('concept_primary_cultures','$concept_primary_culture$')] of [ROOT.GetCountry.GetNameNoFlag]"
 je_mgrbfm_egypt_nationalism_on_complete_2: "If [ROOT.GetCountry.GetName] embraces a #yellow Pan-[GetCulture('arab').GetName] $mgrbm_identity$:\n • Triggers the Event #white --#!\n • [GetCulture('arab').GetName] will become a [Concept('concept_primary_cultures','$concept_primary_culture$')] of [ROOT.GetCountry.GetNameNoFlag]\n • [GetCulture('misri').GetName] will no longer be a [Concept('concept_primary_cultures','$concept_primary_culture$')] of [ROOT.GetCountry.GetNameNoFlag] \n • A majority of [GetCulture('misri').GetName] [Concept('concept_pop','$concept_pops$')] in [ROOT.GetCountry.GetNameNoFlag] will assimilate to this culture"
 je_mgrbfm_egypt_nationalism_on_complete_3: "If [ROOT.GetCountry.GetName] embraces a hybrid [GetCulture('misri').GetName]-[GetCulture('coptic').GetName] $mgrbm_identity$:\n • Triggers the Event #white --#!\n • [GetCulture('misri').GetName] will remain the [Concept('concept_primary_cultures','$concept_primary_culture$')] of [ROOT.GetCountry.GetNameNoFlag]\n • [GetCulture('coptic').GetName] will become a [Concept('concept_primary_cultures','$concept_primary_culture$')] of [ROOT.GetCountry.GetNameNoFlag]"
 je_mgrbfm_egypt_nationalism_on_complete_4: "If [ROOT.GetCountry.GetName] enacts [GetLawType('law_ethnostate').GetName]:\n • Triggers the Event #white --#!\n • [GetCulture('misri').GetName] will remain the [Concept('concept_primary_cultures','$concept_primary_culture$')] of [ROOT.GetCountry.GetNameNoFlag]"
 
