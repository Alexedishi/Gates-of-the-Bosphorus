 # Scripted Buttons
 mgrbfm_broker_colonization_button: "Seek Agreement with the [GetCulture('bedouin').GetName]"
 mgrbfm_broker_colonization_button_desc: "The western deserts are governed by a complex network of tribal relations that often supersede any authority of the state. Muhammad 'Ali has proven himself a master in dealing with these tribal systems in the past, and many advisors have urged him to make use of this to finish taming our western border."
 
 mgrbfm_repair_nilometers_button: "Repair Nilometers"
 mgrbfm_repair_nilometers_button_desc: "The Nilometer system, while ad hoc for the millennia, has proved indispensable in predicting flood intensity and calculating expected agricultural output. Their dysfunction threatens the stability of the country."
 
