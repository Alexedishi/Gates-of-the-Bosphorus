 # Scripted Buttons
 mgrbfm_visit_france_name: "Schedule Trip to France"
 mgrbfm_visit_france_desc: "The ascendancy of the $FRA_ADJ$ Empire in the Maghreb has raised eyebrows in the [ROOT.GetCountry.GetAdjectiveNoFormatting] court. Following a visit by the Emperor to [ROOT.GetCountry.GetCapital.GetCityHubName], the $FRA_ADJ$ court has extended an offer for a reciprocal visit by the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 
