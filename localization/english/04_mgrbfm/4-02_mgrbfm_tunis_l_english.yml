# Journal Entries
 je_mgrbfm_tunis_modernization: "The Modernization of Tunis"
 je_mgrbfm_tunis_modernization_reason: "For untold centuries, [ROOT.GetCountry.GetName] has stood as a bridge between the Arab west, the #italic Maghreb#!, and the Arab east, the #italic Mashriq#!. From its strategic location, the [ROOT.GetCountry.GetAdjectiveNoFormatting] realm serves as an important crossroads between Africa, the Middle East, and Europe. Despite this, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] finds the country threatened by European expansion across the #italic Maghreb#!. Intellectuals and political leaders have seized on the energy of modernization emanating from the $turkfm_sublime_porte$ as a means to secure future [ROOT.GetCountry.GetAdjectiveNoFormatting] independence."

 # Journal Entry Lobby Text
 je_mgrbfm_tunis_modernization_lobby: "$gbbf_journal_lobby$\nFrom its strategic location, the Tunisian realm serves as an important crossroads between Africa, the Middle East, and Europe. Despite this, the bey of Tunis finds the country threatened by European expansion across the #italic Maghreb#!. Intellectuals and political leaders have seized on the energy of modernization emanating from the $turkfm_sublime_porte$ as a means to secure future Tunisian independence."

 # Modifiers
