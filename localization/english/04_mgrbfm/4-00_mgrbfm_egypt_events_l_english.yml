 mgrbfm_egypt.010.t: "Egypt in the Industrial Age"
 mgrbfm_egypt.010.d: ""
 mgrbfm_egypt.010.f: ""
 mgrbfm_egypt.010.a: "The future is an [ROOT.GetCountry.GetAdjective] one!"
 mgrbfm_egypt.011.t: "The Stagnation of Industry"
 mgrbfm_egypt.011.d: ""
 mgrbfm_egypt.011.f: "\"When I came to Egypt it was really barbarous, utterly barbarous. Barbarous it remains to this day. Still I hope that my labours have rendered its condition somewhat better than it was. You must not however be shocked if you do not find in these countries the civilization which prevails in Europe.\" —Lord Palmerston, to Colonel Hodges, 1840"
 mgrbfm_egypt.011.a: "Are we doomed to be colonized?"

 
 mgrbfm_egypt.100.t: "To Live as Egyptians"
 mgrbfm_egypt.100.d: "In the quest for autonomy, Muhammad 'Ali has stoked the beginnings of an \"Egyptian\" identity. Through forced military service and Muhammad 'Ali's campaigns, the various peoples under Egyptian rule have begun to experience a collective sense that has set them apart from the rest of the Muslim world. With the aim of surviving against the West, the leadership in Cairo has sought to exploit this development to further bind the [ROOT.GetCountry.GetGovernment.GetName] together. However, the only thing everyone can agree on is the following question:\n\n#italic What is an \"Egyptian\"?$gbbf_linebreak_normal$"
 mgrbfm_egypt.100.f: "\"If I weren't an Egyptian, I would have wished to be an Egyptian.\" —Mustafa Kamil"
 mgrbfm_egypt.100.a: "We are more than just Arabs to be subjugated."
