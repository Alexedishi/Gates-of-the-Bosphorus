l_english:
 mgrbfm_egypt.001.t: "The Man Who Would Be Khedive"
 mgrbfm_egypt.001.d: "Once the seat of great empires, [ROOT.GetCountry.GetName] has languished under the decaying influence of the [SCOPE.sCountry('ottoman_scope').GetName]. Having entrenched himself as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] through military might and industrial development, [ROOT.GetCountry.GetRuler.GetFullName], the \"Old Spider,\" dares to defy the might of [SCOPE.sCountry('ottoman_scope').GetCapital.GetCityHubName] and aims to secure hereditary rule over [ROOT.GetCountry.GetNameNoFormatting]."
 mgrbfm_egypt.001.f: "\"We visited the old spider in his den.... He did not address any of his subjects, but I observed his sharp cunning eyes fixing itself on every one. The light was not strong enough to remark minutely, but I can agree with former travellers as to the vivid expression of his eye, and, for the rest . . . it is absurd to talk of, or have any idea of his face.\\" -Lord Lindsay, regarding Mehmed Pasha, December 1836."
 mgrbfm_egypt.001.a: "[ROOT.GetCountry.GetName] will find its way."
 mgrbfm_egypt.002.t: "Darkness Clouds the Spider"
 mgrbfm_egypt.002.d: ""
 mgrbfm_egypt.002.f: ""
 mgrbfm_egypt.002.a: ""
 mgrbfm_egypt.003.t: "The Spider Crawls No More"
 mgrbfm_egypt.003.d: ""
 mgrbfm_egypt.003.f1: "\"...the ceremonial of the funeral was a most meagre, miserable affair; the Consular was not invited to attend, and neither the shops nor the Public offices were closed – in short, a general impression prevails that Abbas Pasha has shown a culpable lack of respect for the memory of his illustrious grandfather, in allowing his obsequies to be conducted in so paltry a manner, and in neglecting to attend them in person.\\" -British consul John Murray"
 mgrbfm_egypt.003.f2: "\"...the attachment and veneration of all classes in Egypt for the name of Muhammad Ali are prouder obsequies than any of which it was in power of his successor to confer. The old inhabitants remember and talk of the chaos and anarchy from which he rescued this country; the younger compare his energetic rule with the capricious, vacillating government of his successor; all classes whether Turk, or Arab, not only feel, but do not hesitate to say openly that the prosperity of Egypt has died with Muhammad Ali...\"  -British consul John Murray"
 mgrbfm_egypt.003.a: ""
