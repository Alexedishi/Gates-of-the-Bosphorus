l_english:
 mgrbfm_egypt.001.t: "The Man Who Would Be Khedive"
 mgrbfm_egypt.001.d: "Once the seat of great empires, [ROOT.GetCountry.GetName] languishes under the decaying influence of the $turkfm_porte$. However, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] aims to change this. Through military might and industrial development, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] aims to defy the might of Constantinople and secure hereditary rule over [ROOT.GetCountry.GetNameNoFormatting]."
 mgrbfm_egypt.001.f: "The Khedivate of [ROOT.GetCountry.GetNameNoFormatting] has a deep history. From its ancient origins as #bold Kemet#! and through Greek, Roman, and now Arab rule, the country is home to varied peoples of many [Concept('concept_culture','$concept_cultures')] and [Concept('concept_religion','$concept_religions')]. With the seat of Egypt secured, $Muhammad_Ali$ now aims to reclaim his country's long history of imperial dominance."
 mgrbfm_egypt.001.a: "[ROOT.GetCountry.GetName] will find its way."
