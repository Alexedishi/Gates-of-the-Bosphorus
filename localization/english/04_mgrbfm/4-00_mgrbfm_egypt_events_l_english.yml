 mgrbfm_egypt.110.t: "Flooding Strikes the [GetGeographicRegion('geographic_region_lower_nile').GetName]!"
 mgrbfm_egypt.110.d: "Outflows from upstream seasonal rains have begun the annual flooding of the [GetGeographicRegion('geographic_region_lower_nile').GetName]. The intensity of this year's rains have resulted in uncontrolled flooding in [SCOPE.sState('mgrbfm_flood_scope').GetName]."
 mgrbfm_egypt.110.d2: ""
 mgrbfm_egypt.110.d3: ""
 mgrbfm_egypt.110.f: "From the Nile's curve near Aswan to the banks of Cairo, the floods travel down the river like a wave. From the gauges at Aswan, the waters take only nine to eleven days to arrive at the Delta, leaving little time to strengthen levees by the time an exceptional flood is detected."
 mgrbfm_egypt.110.a: "Warn the $ig_mgrbfm_fellahin$!"
 mgrbfm_egypt.110.b: "Partial mitigation is better than nothing..."
 mgrbfm_egypt.110.c: "Excellent news."
 mgrbfm_egypt.111.t: "Nilometer Destroyed in [SCOPE.sState('mgrbfm_nile_flood_scope').GetName]"
 mgrbfm_egypt.111.d: "The might of the Nile's floodwaters have devastated its banks in [SCOPE.sState('mgrbfm_nile_flood_scope').GetName]. Inspections have discovered that this year's flood have also undermined and all but demolished the Nilometer at [SCOPE.sState('mgrbfm_nile_flood_scope').GetCityHubName]."
 mgrbfm_egypt.111.f: "Engineers dutifully reported to work at dawn to check the Nilometer gauges, only to find a collapsed mound of brickwork where there once stood the Nilometer complex."
 mgrbfm_egypt.111.a: "We must effect repairs."
 mgrbfm_egypt.112.t: "Railway Damaged in [SCOPE.sState('mgrbfm_nile_flood_scope').GetName]"
 mgrbfm_egypt.112.d: "Several levees have ruptured in [SCOPE.sState('mgrbfm_nile_flood_scope').GetName] allowing the Nile's floodwaters to advance unchecked across the floodplain. Engineers have reported that critical sections of the [GetBuildingType('building_railway').GetName] have been partially submerged and displaced."
 mgrbfm_egypt.112.f: "The railway is far from destroyed, but it will take days for floodwaters to recede and the rails to be reset to their correct positions."
 mgrbfm_egypt.112.a: "It's a shame trains can't swim."
 
 mgrbfm_egypt.200.t: "From the Nile to the Orontes"
 mgrbfm_egypt.200.d: ""
 mgrbfm_egypt.200.f: "\"This banner is the symbol of victory, of pride, of life and of faith... Make sure it does not fall while there is still a breath of life left in any one of you. If it does fall – God forbid – then let the spot on which it falls be the spot on which you die.\" —Muhammad Ali, to his newly formed regiments"
 mgrbfm_egypt.200.a: ""
 mgrbfm_egypt.200.b: ""
