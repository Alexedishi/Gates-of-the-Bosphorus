l_english:
 grefm_roman_empire.001.t: "The Phoenix Rises"
 grefm_roman_empire.001.d: "Church bells ring and people cheer as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] declares the rebirth of the [ROOT.GetCountry.GetName]. Beneath the imposing presence of the [SCOPE.sBuilding('hagia_sofia_scope').GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been adorned with reconstructions of the old sigils and regalia of the Eastern Roman emperors. Stepping forward towards the array of citizens, dignitaries, and clergy, [ROOT.GetCountry.GetRuler.GetFirstName] stands as a beacon for the future of the Greek people."
 grefm_roman_empire.001.f: "Where countless attempts failed over the centuries since the losses of Rome and Constantinople, the Empire stands resurgent today. However, much work remains: numerous Greeks are ruled by heretics and heathens, formerly Roman lands remain within the grasp of foreign pretenders, and countless Byzantine treasures are kept hostage abroad. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must be sure to live up to the expectations of [ROOT.GetCountry.GetRuler.GetHerHis] subjects if [ROOT.GetCountry.GetRuler.GetSheHe] is to bring glory to [ROOT.GetCountry.GetName]."
 grefm_roman_empire.001.a: "From the ashes, we rise."
 grefm_roman_empire.002.t: "Nova Rome Constantinopolitana"
 grefm_roman_empire.002.d: "Our efforts have borne fruit with the rebirth of the [ROOT.GetCountry.GetName]. Now several voices call for the restoration of [ROOT.GetCountry.GetAdjectiveNoFormatting] power and prestige with the return of formerly Byzantine lands to Greek hands. It falls to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to determine the future of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state."
 grefm_roman_empire.002.f: ""The Kingdom of Greece is not Greece; it is merely a part: the smallest, poorest part of Greece. The Greek is not only he who inhabits the Kingdom, but also he who inhabits Ioannina, Salonika or Serres or Adrianople or Constantinople or Trebizond or Crete or Samos or any other region belonging to the Greek history or the Greek race... There are two great centres of Hellenism. Athens is the capital of the Kingdom. Constantinople is the great capital, the dream and hope of all Greeks." -I. Kolettis, 1844"
 grefm_roman_empire.002.a: "We will restore the glory of the [ROOT.GetCountry.GetName]."
 grefm_roman_empire.002.b: "We will limit ourselves to Anatolia."
 grefm_roman_empire.002.c: "We will limit ourselves to the Balkans."
 grefm_roman_empire.003.t: "The Rome of the East"
 grefm_roman_empire.003.d: "With Anatolia and the Balkans firmly within our grasp, the old heart of the Empire has been reclaimed. Prominent leaders in the [ROOT.GetCountry.GetAdjectiveNoFormatting] court now call for the return of Egypt and the Levant, once strongholds of Christendom, into the Imperial sphere."
 grefm_roman_empire.003.f: "Almost one thousand years ago, Basileus Isaac I Komnenos augustly led the Empire into an era of renewed might and glory. Yet today, the old Greek cities lie in ruins and the old bastions of Christendom wither under their Muslim holders."
 grefm_roman_empire.003.a: "We will reclaim the Eastern Empire."
 grefm_roman_empire.003.b: "We have reclaimed the Greek heartlands. This is enough."
 grefm_roman_empire.004.t: "The Basileia Rhōmaiōn"
 grefm_roman_empire.004.d: "With the Eastern Empire within our domain, our people look across our borders to lands held by pretenders and heathens. Politicians and agitators alike call for the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to lead [ROOT.GetCountry.GetName] into this new era."
 grefm_roman_empire.004.f: "Following the restoration of the Roman state, our people have begun to look beyond the old borders of the East, to the lands once held by the Empire under Emperor Justinian."
 grefm_roman_empire.004.a: "We will reclaim the Eternal City."
 grefm_roman_empire.004.b: "We must focus on our citizens."
 grefm_roman_empire.005.t: "Dalmatia Reclaimed"
 grefm_roman_empire.005.d: "For the first time in centuries, Greek armies march along the eastern coast of the Adriatic Sea."
 grefm_roman_empire.005.f: "Before being lost to the Goths and later Slavs, Dalmatia, as the province of Illyricum, was the great link between the Roman and Greek sides of the Roman Empire."
 grefm_roman_empire.005.a: "Glory to the Empire."
 grefm_roman_empire.006.t: "Lombardia Reclaimed"
 grefm_roman_empire.006.d: "As our soldiers walk in the shadows of the Alps, northern Italy has returned to Imperial control."
 grefm_roman_empire.006.f: "Despite serving as a barrier shielding Rome from the wild north, it was through the Alps that the Lombards poured into Italy a millennium ago, replacing the Roman legal system with their own barbarian tradition."
 grefm_roman_empire.006.a: "Glory to the Empire."
 grefm_roman_empire.007.t: "Magna Graecia Reclaimed"
 grefm_roman_empire.007.d: "From the shores of the Ionian Sea to the banks of the Garigliano, southern Italy has returned to the Imperial fold."
 grefm_roman_empire.007.f: "In Antiquity, southern Italy was colonized by large numbers of Greeks. These Greeks intermingled with the local Latin peoples, giving the south of the peninsula a unique flavor and exposing the nascent Roman Republic to Greek culture."
 grefm_roman_empire.007.a: "Glory to the Empire."
 grefm_roman_empire.008.t: "Exarchate of Ravenna Reclaimed"
 grefm_roman_empire.008.d: "From the Po Valley to the Slopes of the Apennines, central Italy has come under our sway."
 grefm_roman_empire.008.f: "Central Italy was the cradle of Roman Expansion, as the Latins spread across lands held by the Sabines, Umbrians, and Etruscans."
 grefm_roman_empire.008.a: "Glory to the Empire."
 grefm.808.t: "OPEN"
 grefm.808.d: "OPEN"
 grefm.808.f: "OPEN"
 grefm.808.a: "OPEN"
 grefm_roman_empire.009.t: "Renovatio Imperii Romanorum"
 grefm_roman_empire.009.d: "As Imperial forces march through the Eternal City, our dream of restoring the Roman Empire has come a conclusion. For the first time in over a millennium, Rome, the Eternal City and the Foremost Seat in the Pentarchy, has been returned to the Empire. From the shores of the Bosporus to the mighty Tiber, the lands ancient Rome have been reunited under one banner."
 grefm_roman_empire.009.f: "The city of Rome was the seat of one of the greatest Empires to dominate Europe. For centuries it has languished in the hands of Lombardic and Gallic pretenders. Today the crown jewel and beating heart of the Empire has been reclaimed from the barbarian masses! Hail to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]! Glory to the [ROOT.GetCountry.GetName]!"
 grefm_roman_empire.009.a: "Rome shall shine once more!"
 grefm_roman_empire.009.b: "Constantinople is the New Rome!"