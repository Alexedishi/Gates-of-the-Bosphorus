 grefm_chariot_team: "@gbbf_charioteer! Chariot Teams"
 grefm_chariot_teams_desc: "@gbbf_charioteer! #bold Chariot Teams#!$gbbf_linebreak_normal$#bold Chariot racing#! was one of the most high profile sporting events from the Ancient Greek through Byzantine times. Single drivers would lead teams of 2 or 4 horses through 5 to 12 laps around a circus, depending on era and format. The dangers and unpredictability of the sport lent itself to mass popularity and the sponsorship of charioting events was seen as the civic duty of both consuls and emperors.\n\nThe revived teams are each sponsored by an [concept_interest_group]. These races follow a format of championship races every 4 years, with the winning team's sponsor receiving the #tooltippable #tooltip:[GetRawTextTooltipTag('grefm_chariot_teams_modifier_desc')] $modifier_grefm_ig_won_races$#!#!$gbbf_linebreak_normal$The Chariot Teams are:\n • $grefm_chariot_team_reds$\n • $grefm_chariot_team_whites$\n • $grefm_chariot_team_greens$\n • $grefm_chariot_team_blues$\n • $grefm_chariot_team_purples$ (Requires Expanded Racing Roster)\n • $grefm_chariot_team_golds$ (Requires Expanded Racing Roster)"
 grefm_chariot_teams_modifier_desc: "[GetStaticModifier('modifier_grefm_ig_won_races').GetDesc]"
 
