l_english:
 grefm_greek_nationalism.001.t: "What is a "Greek?\""
 grefm_greek_nationalism.001.d: "The question of $grefm_greek$ identity has taken a new light with the emergence of #yellow Nationalist#! thought in [ROOT.GetCountry.GetName]. Intellectuals have emphasized language and religion as the delimiters of a common [GetCulture('greek').GetName] identity. This idea is weak among the common folk, who feel stronger links to their [GetCulture('rhomaios').GetName] villages that have endured since Byzantine times."
 grefm_greek_nationalism.001.f: "In the Byzantine era, Greeks often defined themselves along two lines: firstly they called themselves "Roman;" secondly, they emphasized their identity as Christians. This mixed identity became even more important in the Ottoman era where their culture survived by a shared experience of language and religion through various stages of acceptance and persecution by their Ottoman overlords."
 grefm_greek_nationalism.001.a: "Haven't we always been Greek?"
 grefm_greek_nationalism.001.tt1: "Our choices in the #bold Greek Nationalism#! [concept_journal_entry] will affect the status of the [GetCulture('rhomaios').GetName] people."
 grefm_greek_nationalism.001.tt2: "Our choices in the #bold Greek Nationalism#! [concept_journal_entry] will affect the status of the [GetCulture('greek').GetName] people."
 grefm_greek_nationalism.002.t: "The History of the Greek Nation"
 grefm_greek_nationalism.002.d: "Following decades of academic rigor, Constantine Paparrigopoulos has published the last volume of his work #italic History of the Hellenic Nation#!. A remarkably vivid and elegant accounting of Greek history, his work is the first to thread together the histories of ancient Greece, medieval Greece, and the modern Greek state into a marvelous story of Greek presence across the Balkans and Anatolia."
 grefm_greek_nationalism.002.f: "Historical note: Published in six volumes from 1860 to 1877, Paparrigopoulos' work was the first truly academic attempt to rebut the mainstream opinion that the Greek "race" had been displaced or assimilated by various Slavic peoples during the migration period with a complete disregard towards nearly a millennium of Byzantine domination of the Hellespont followed by a complex existence as an integral part of the fabric of the Ottoman state."
 grefm_greek_nationalism.002.a: "The Greek flame will never be extinguished."
 grefm_greek_nationalism.002.b: "We must not forget our Roman roots."
 grefm_greek_nationalism.003.t: "The Greek Capital"
 grefm_greek_nationalism.003.d: "The liberated Greeks of [SCOPE.sState('eastern_thrace_scope').GetCityHubName] have petitioned the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to restore the city to its former position as the center of the Greek world."
 grefm_greek_nationalism.003.f: "\"The Kingdom of Greece is not Greece; it is merely a part: the smallest, poorest part of Greece. The Greek is not only he who inhabits the Kingdom, but also he who inhabits Ioannina, Salonika or Serres or Adrianople or Constantinople or Trebizond or Crete or Samos or any other region belonging to the Greek history or the Greek race... There are two great centres of Hellenism. Athens is the capital of the Kingdom. Constantinople is the great capital, the dream and hope of all Greeks.\""
 grefm_greek_nationalism.003.a: "Constantinople will be the heart of [ROOT.GetCountry.GetName]!"
 grefm_greek_nationalism.003.b: "[SCOPE.sState('attica_scope').GetCityHubName] serves our purposes."
 grefm_greek_nationalism.006.t: "The Language Question"
 grefm_greek_nationalism.006.d: "Since independence, the [SCOPE.gsInterestGroup('ig_intelligentsia_scope').GetName] has pushed for the adoption of a variety of Greek called $grefm_dialect_katharevousa$. The people continue to use $grefm_dialect_demotic$, or vulgar Greek, with each region having its own local variation of the Greek language. Concurrently, the [SCOPE.gsInterestGroup('ig_devout_scope').GetName] continues to use $grefm_dialect_khoine$ Greek, a liturgical dialect with continuity back to the Hellenistic period."
 grefm_greek_nationalism.006.f: "Historical Note: The problem of which dialect of Greek to promote to national status was a heavily debated issue up to 1976. For millennia, the Greek language has existed along a continuum, like most languages before the advent of modern schooling and nation-states. The arrival of the Seljuk Turks carved physical divisions between various Greek populations, allowing many dialects to diverge to a point of being nearly unintelligible to each other."
 grefm_greek_nationalism.006.a: "Our language will bind us together."
 grefm_greek_nationalism.006.tt1: "Supporting $grefm_dialect_demotic$ or $grefm_dialect_katharevousa$ will increase our tilt towards #bold Hellenism#!."
 grefm_greek_nationalism.006.tt2: "Supporting $grefm_dialect_khoine$ or $grefm_dialect_rhomaiika$ will increase our tilt towards #bold Romanism#!."
 grefm_greek_nationalism.007.t: "A National Language"
 grefm_greek_nationalism.007.d: "Through academic rigor and the will of the state, national leaders are ready to organize a national curriculum for the Greek language. While this won't resolve the language problem overnight, we can at least ensure a consistent linguistic education for our children across the Greek state."
 grefm_greek_nationalism.007.f: "As the Greek literary landscape grows, Katharevousa has been disproportionately favored by writers and politicians alike. Many fear that further pushing the Greek language backwards in time will only further alienate the populace and impede education access for the masses. Conversely, many hold that purifying the language of Slavic and Turkish "contamination" will allow educators to refine the otherwise uncouth masses."
 grefm_greek_nationalism.007.a: "$grefm_dialect_demotic$ is the true language of the people."
 grefm_greek_nationalism.007.b: "$grefm_dialect_katharevousa$ will cement a Greek identity."
 grefm_greek_nationalism.007.c: "$grefm_dialect_khoine$ is the only truly Greek language."
 grefm_greek_nationalism.007.e: "$grefm_dialect_rhomaiika$ is the only dialect with merit."
 grefm_greek_nationalism.007.g: "Perhaps we are being hasty..."
 grefm_greek_nationalism.007.tt: "We will not declare a national dialect"
 grefm_greek_nationalism.008.t: "Defining Greek Roots"
 grefm_greek_nationalism.008.d: "The large strides made by the Archaeological Society have given the Greek people a sense of presence in the Balkans back into prehistoric times. Every month, more of the people speak of the Greek state as if it has existed through the eras, going as far as conflating the modern state with the Byzantine and Roman administrations that preceded the Ottomans."
 grefm_greek_nationalism.008.f: "Thanks to our scholars, we can say without question that the "proto-Greeks" arrived in the Balkans well before recorded history and have been here ever since. Be they in the hands the pre-Roman city-states, the Byzantine Empire, or the Venetian and Ottoman oppressors, these land have been and always will remain Greek."
 grefm_greek_nationalism.008.a: "We have always been here."
 grefm_greek_nationalism.009.t: "The Greek Ethnogenesis"
 grefm_greek_nationalism.009.d: "Nobody could tell you when it happened, but everybody knew it happened: day-in and day-out the people are proud to walk [SCOPE.sCulture( 'grefm_national_culture_scope').GetName] streets, to work [SCOPE.sCulture( 'grefm_national_culture_scope').GetName] jobs, and to coexist with their [SCOPE.sCulture( 'grefm_national_culture_scope').GetName] neighbors. From its beginning as a disunified and crumbling post-Turkish state, [ROOT.GetCountry.GetName] and her people have risen to stand as a true nation-state."
 grefm_greek_nationalism.009.f: "\"For how long, o brave young men, shall we live in fastnesses,\nAlone, like lions, on the ridges in the mountains?\nShall we dwell in caves, looking out on branches,\nFleeing from the world on account of bitter serfdom?\nAbandoning brothers, sisters, parents, homeland\nFriends, children, and all of our kin?\n\nBetter one hour of free life,\nThan forty years of slavery and prison."\n\n -R. Feraios, #italic Thourios#!, 1797"
 grefm_greek_nationalism.009.a: "Freedom or Death!"
 grefm_greek_nationalism.009.b: "Meep."

 grefm_greek_nationalism.040.t: "The Archaeological Society of Athens"
 grefm_greek_nationalism.040.d: "With support from both politicians and scholars, archaeologists from across Greece have begun a process of locating, securing, and restoring the numerous relics of Ancient Greece. Ephors from the Greek Archaeological Service have prepared a list of sites for immediate study."
 grefm_greek_nationalism.040.f: "Founded in 1837, the Archaeological Society of Athens was instrumental in cataloging and restoring countless ruins and artifacts extending from as recent as Byzantine times to as far back as the Greek Bronze Age."
 grefm_greek_nationalism.040.a: "A noble effort."
 grefm_greek_nationalism.040.a.tt: "You may now choose to launch an archaeological study from the journal."
 grefm_greek_nationalism.041.t: "Planning an Excavation"
 grefm_greek_nationalism.041.d1: "Ephors from the Archaeological Society have organized a team to begin a systematic excavation of the site in [SCOPE.sState('grefm_excavation_site').GetName]. This team has staged in [SCOPE.sState('grefm_excavation_site').GetCityHubName] and awaits approval from state sponsors to depart."
 grefm_greek_nationalism.041.d2: "Ephors from the Archaeological Society have put together a team to begin an organized excavation of the ancient citadel of Gla. The team now awaits approval from state sponsors to depart."
 grefm_greek_nationalism.041.f: "the Peloponnese to as far as the Hindu Kush, there are countless treasures of our Greek heritage to be found."
 grefm_greek_nationalism.041.a: "Yes, we wish the team luck."
 grefm_greek_nationalism.041.b: "No, is not the best time."
 grefm_greek_nationalism.042.t: "Alternative Dig Sites Considered"
 grefm_greek_nationalism.042.d1: "Against the tide of institutional and cultural momentum, the directors of the Archaeological Service have approved the study of Byzantine-era sites in addition to ruins from the Ancient Greek Era."
 grefm_greek_nationalism.042.d2: "Against the tide of institutional and cultural momentum, the directors of the Archaeological Service have approved the study of Ancient Greek-era sites in addition to ruins from the Byzantine Era."
 grefm_greek_nationalism.042.f: "This decision has proven unpopular within our academia, with many voicing concerns that acknowledging this aspect of our history will dilute our cultural identity."
 grefm_greek_nationalism.042.a: "Certainly a unique initiative."
 grefm_greek_nationalism.042.b: "Perhaps this isn't the best idea..."
 grefm_greek_nationalism.042.tt1: "You will now have access to #yellow Hellenic#! dig sites."
 grefm_greek_nationalism.042.tt2: "You will now have access to #yellow Roman#! dig sites."
 grefm_greek_nationalism.043.t1: "Acropolis of Athens Surveyed"
 grefm_greek_nationalism.043.d1: "Ephors have announced the completion the enormous project to clear and catalogue the site at the Acropolis. Amongst the piles of discarded bricks and stones, over a dozen unique sites have been identified throughout the hilltop. Most prominent among these is the Parthenon, an ancient monument-treasury and later church, that currently hosts a mosque at its heart. Dating as far back as the Mycenaean period, the Acropolis has been built over and repurposed countless times over the millennia. Several temples, sanctuaries, and gateways dot the site, each having found new uses under successive regimes to the modern day."
 grefm_greek_nationalism.043.t2: "Parthenon Site Excavated"
 grefm_greek_nationalism.043.d2: "The abandoned mosque has been demolished and the site cleared at the Parthenon. Under the supervision of Architect Nikolaos Balanos, the shattered remains of the Parthenon have been identified and reassembled using iron and concrete for structural reinforcement."
 grefm_greek_nationalism.043.t3: "Knossos Surveyed"
 grefm_greek_nationalism.043.d3: "Building on the initial discovery of the site by Minos Kalokairinos in the 1870s, a team has uncovered an enormous throne room at the heart of a Bronze Age Palace. Further work has uncovered the sprawling remains of palace complex and ancient urban site.U ntil the formal excavations at Knossos, the role of Crete in the Minoan civilization was unclear. With the discovery of the palace complex, the city's position at the heart of the Minoan Civilization has been confirmed."
 grefm_greek_nationalism.043.t4: "Minoan Palace Restored"
 grefm_greek_nationalism.043.d4: "With the aid of Englishman Arthur Evans, laborers have completed an extensive reconstruction of the palace and its associated buildings. Several chambers and frescoes have been painstakingly rebuilt, with artisans blending the modern repair work with the ancient aesthetics. While impressive, the "reconstitution" of the palace attracted criticism with many arguing that Evan's "artistic license" has created a misleading representation of the past."
 grefm_greek_nationalism.043.t5: "Citadel of Gla Excavated"
 grefm_greek_nationalism.043.d5: "The Ephor overseeing activities at the Gla site has reported the completion of a comprehensive detailing of the site. Excavations of several buildings at the site have shown that Mycenaean architecture was already beginning to resemble that of Classical Greece. The ancient citadel sprawls across an outcrop that juts far into former Lake Kopais. Measuring larger then the footprint of ancient Athens, the site is defined by two major features: a palace-like structure in the north and two warehouse-like structures in the south. Scholars have theorized that the entire site may have served as a temporary shelter in times of war or hardship."
 grefm_greek_nationalism.043.t6: "Delos Surveyed"
 grefm_greek_nationalism.043.d6: "Situated amongst the Cyclades, Delos was the mythological core of the Aegean Sea. With the island abandoned since Byzantine times and managed only by a small caretaker population, the "excavations" at Delos have been more of just an accounting of the various structures located at the site. Several temples and social centers survive in remarkable condition."
 grefm_greek_nationalism.043.t7: "Larissa Surveyed"
 grefm_greek_nationalism.043.d7: "While several Greek cities have been abandoned over the years, some, like Larissa have been in continuous use, with medieval and modern buildings coexisting with archaic structures. After exhaustive efforts, the Archaeological Service has detailed several ruins and structures that dot the city. As lists are distributed to local officials, the hope is that urban planners can avoid disruption of known ancient sites."
 grefm_greek_nationalism.043.t8: "Rhodes Surveyed"
 grefm_greek_nationalism.043.d8: "Inhabited since the time of Mycenaneans, Rhodes has been ruled by the Greeks, Byzantines, Knights Hospitaller, and the Ottomans. Alongside that came populations of Jews, Pagans, Christians, and Muslims, giving the island an incredible variety of culutral influences. However, despite the numerous finds, the supervising ephor was disappointed to announce that no signs of the fabled Colossus of Rhodes have been found."
 grefm_greek_nationalism.043.f: "With every ancient site surveyed, [ROOT.GetCountry.GetName]'s connection to antiquity grows clearer and stronger."
 grefm_greek_nationalism.043.a: "Excellent Work!"
 grefm_greek_nationalism.044.t1: "Hexamilion Wall Examined"
 grefm_greek_nationalism.044.d1: "Ephors from the Archaeological Service have announced the completion of a sprawling survey detailing the extent of the Hexamilion Wall. Stretching across the isthmus, its ruins have provided experts with several major artifacts from the Roman era."
 grefm_greek_nationalism.044.t2: "Acrocorinth Surveyed"
 grefm_greek_nationalism.044.d2: "Following months of efforts, ephors have cleared and documented the majority of the massive structure of the Acrocorinth. they have identified a storied history stretching from a Byzantine fortress, to an Orthodox church, and later a mosque. Many are eager to open the site to the public."
 grefm_greek_nationalism.044.t3: "Heptapyrgion Restored"
 grefm_greek_nationalism.044.d3: "The Heptapyrgion presents a stunned example of the architecture from the height of the Byzantine era. With major restoration work already underway, the Archaeological Service has voiced enthusiasm for the use of the site as a centerpiece in Byzantine education."
 grefm_greek_nationalism.044.t4: "Workshops of Thebes Excavated"
 grefm_greek_nationalism.044.d4: "Ephors have announced the completion of their massive effort to locate and catalogue the numerous small ruins throughout Thebes. In the Byzantine era, many of these buildings served as the beating heart of the Byzantine silk industry."
 grefm_greek_nationalism.044.t5: "Nicomedia Surveyed"
 grefm_greek_nationalism.044.d5: "Through a mixture of public surveys and private reporting, ephors have detailed a series of reports showing the extensive Roman history of the city. The expansiveness of the ruins have made it difficult to tell where ancient ruins end and modern city begins."
 grefm_greek_nationalism.044.t6: "Smyrna Surveyed"
 grefm_greek_nationalism.044.d6: "Ephors have announced the conclusion of their survey of the extensive ruins in Smyrna. The city competed for "second city" status compared to Constantinople in the Byzantine era and researchers have recovered thousands of artifacts definitively dated to this flourishing phase of Smyrnite history."
 grefm_greek_nationalism.044.t7: "Tyana Excavated"
 grefm_greek_nationalism.044.d7: "While Tyana was lost to Turkic invasion early in their conquest of Anatolia, this fact hasn't stopped ephors from identifying hundreds of ruins in the old city."
 grefm_greek_nationalism.044.t8: "Chios Surveyed"
 grefm_greek_nationalism.044.d8: "Ephors have announced the completion of their survey of the island of Chios. Several ruins have been identified that have secured the island's status as a strategic holding during the Roman era and its subsequent occupation by the Genoese before falling into Ottoman control."
 grefm_greek_nationalism.044.f: "With every medieval site explored, [ROOT.GetCountry.GetName] is reminded of how it flourished in the Roman era."
 grefm_greek_nationalism.044.a: "Fantastic Work!"

 grefm_greek_nationalism.050.t: "Excavation Proceeding Smoothly"
 grefm_greek_nationalism.050.d: "Lead engineers have reported that the ongoing excavation project had proceeded more quickly than expected. The supervising Ephor has indicated that the project is now slated to finish earlier than expected."
 grefm_greek_nationalism.050.f: "Barring any surprises in the substrata, our efforts are progressing smoothly and should continue to do so."
 grefm_greek_nationalism.050.a: "Excellent news!"
 grefm_greek_nationalism.050.tt: "The excavation will be #green advanced#! by 4 months."
 grefm_greek_nationalism.051.t: "Industrial Equipment Requested"
 grefm_greek_nationalism.051.d: "A mixture of packed clay soils and sudden encounters with bedrock have perplexed engineers at the excavation site. The supervising Ephor has suggested that heavy machinery be used to break up the offending topography."
 grefm_greek_nationalism.051.f: "A percussion drill or two ought to do the trick. We might even be able change our entire approach to the project once they arrive!"
 grefm_greek_nationalism.051.a: "They will have what they need."
 grefm_greek_nationalism.051.a.tt: "The excavation will be #green advanced#! by 6 months."
 grefm_greek_nationalism.051.b: "To crack open some rocks? I don't think so."
 grefm_greek_nationalism.051.b.tt: "The excavation will be #red delayed#! by 6 months."
 grefm_greek_nationalism.052.t: "Ancient Tomb Uncovered"
 grefm_greek_nationalism.052.d: "Ephors have announced that what appears to be a grave site has been found at the excavation site and have called for a more detailed cataloging of grave goods. Planners have cautioned that this approach may introduce a large delay to the project."
 grefm_greek_nationalism.052.f: "While they may be trinkets of the dead, these grave goods represent some of the best-preserved relics of the era!."
 grefm_greek_nationalism.052.a: "We will detail everything."
 grefm_greek_nationalism.052.a.tt: "The excavation will be #red delayed#! by 6 months."
 grefm_greek_nationalism.052.b: "This is a waste of time."
 grefm_greek_nationalism.053.t: "Mudslide at the Excavation Site"
 grefm_greek_nationalism.053.d: "Local papers have reported a minor mudslide at the excavation site. Engineers have blamed unusually high amounts of precipitation."
 grefm_greek_nationalism.053.f: "Look, I told them we might want extra shoring along the entire southern wall, but they told me to keep shoveling."
 grefm_greek_nationalism.053.a: "That's too bad."
 grefm_greek_nationalism.053.a.tt: "The excavation will be #red delayed#! by 4 months."
 grefm_greek_nationalism.054.t: "Disaster at the Excavation Site!"
 grefm_greek_nationalism.054.d: "Multiple reports have arrived that disaster has struck the excavation team. Following an investigation, Ephors have reported a massive mudslide and structural collapse that claimed the lives of dozens of laborers and has buried most of the site under the earth once more."
 grefm_greek_nationalism.054.f: "While this is a tragic incident, analysts have recommended several changes that should prevent this in the future..."
 grefm_greek_nationalism.054.a: "What misfortune."
 grefm_greek_nationalism.054.a.tt: "The excavation will be #red delayed#! by 12 months."
 grefm_greek_nationalism.055.t: "Popular Interest in Excavation"
 grefm_greek_nationalism.055.d: "Growing crowds have been sighted in the areas surrounding the excavation project. Both children and adults alike have been turning up to gawk at the spectacle. Some have even joined in to aid our laborers."
 grefm_greek_nationalism.055.f: "Honestly, they're not even in the way. Some of our junior academics have even taken the chance to educate the masses about our proud history."
 grefm_greek_nationalism.055.a: "Interesting."
 grefm_greek_nationalism.056.t: "Palace Uncovered"
 grefm_greek_nationalism.056.d: "Engineers at the excavation site have uncovered a series of old foundations that have been tentatively labeled as the court of an ancient aristocratic ruler. The first of what is expected to be a large number of ancient artifacts has already arrived at the Archaeological Society's offices."
 grefm_greek_nationalism.056.f: "It's just treasures upon treasures! Enough to open a new wing at the national museum it seems!"
 grefm_greek_nationalism.056.a: "Wonderful."
 grefm_greek_nationalism.057.t: "The Mask of Agamemnon"
 grefm_greek_nationalism.057.d: "Ephors working on a minor dig site in [SCOPE.sState('peloponnese_scope').GetName] have announced an incredible find: a series of beautiful and exquisitely details funerary masks made of pure gold. Found still in place over the bodies they were buried with, the preliminary consensus is that these individuals were of remarkable status. Some have gone as far to claim that this may even be the grave of Agamemnon, the legendary King of Mycenae."
 grefm_greek_nationalism.057.f: "\"...blond, large, and powerful. He was eloquent, wise, and noble, a man richly endowed. -Dares Phrygius, 5th century AD"
 grefm_greek_nationalism.057.a: "It's beautiful!"
 grefm_greek_nationalism.058.t: "The [SCOPE.gsInterestGroup('grefm_benefactor_scope').GetName] Offer Funding"
 grefm_greek_nationalism.058.d: "In support of our efforts in [SCOPE.sState('grefm_excavation_target').GetName], members of the [SCOPE.gsInterestGroup('grefm_benefactor_scope').GetName] have offered to contribute private funds to this endeavour."
 grefm_greek_nationalism.058.f: "Accepting these funds will help us hurry along the excavation, but we can be sure they'll use this as a propaganda piece."
 grefm_greek_nationalism.058.a: "All support is welcome in preserving our history."
 grefm_greek_nationalism.058.b: "We cannot allow undue influence over our academia."
 grefm_greek_nationalism.058.tt: "The excavation will be #green advanced#! by 6 months."
 grefm_greek_nationalism.059.t: "Reconstruction Garners Criticism"
 grefm_greek_nationalism.059.d: "Academics from [SCOPE.sState('grefm_excavation_target').GetName] have submitted some sternly worded complaints regarding our leading Ephor's reconstructions of the excavation site."
 grefm_greek_nationalism.059.f: "\"Look, you can clearly tell that column is supposed to be over there... and that mosaic style is inconsistent with the era associated with this stratum... wait, who's in charge here!?!\""
 grefm_greek_nationalism.059.a: "\"Okay, but do they have the original plans?\""
 grefm_greek_nationalism.059.b: "Our Ephor should take a step back."
 grefm_greek_nationalism.059.b.tt: "The excavation will be #red delayed#! by 6 months."