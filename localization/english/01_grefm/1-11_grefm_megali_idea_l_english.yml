 grefm_form_byz_name: "Form #bold $BYZ$"
 grefm_form_byz_desc: "[ROOT.GetCountry.GetNameNoFlag] has declared its aspirations to enforce the $grefm_megali_idea$. We must succeed."
 grefm_balkans_triumph_name: "Host a Triumph for the [GetGeographicRegion('geographic_region_balkan_highlands').GetName]"
 grefm_balkans_triumph_desc: "Seated in the heart of the Balkans, Macedonia and its nearby regions were the core from which Alexander the Great conquered the first empire of the Greeks. We cannot assume the empire restored without our ancient homelands."
 grefm_aegean_triumph_name: "Host a Triumph for the [GetGeographicRegion('geographic_region_aegean_sea').GetName]"
 grefm_aegean_triumph_desc: "For well over four millennia, the Greek people have plied the waters of the Aegean Sea. These waters are inseparable from the essence of the Greek identity."
 grefm_anatolia_triumph_name: "Host a Triumph for [GetGeographicRegion('geographic_region_anatolia').GetName]"
 grefm_anatolia_triumph_desc: "Fought over for centuries before the fall of the Empire, Anatolia is as old a home to the Greeks as the Balkans."
 grefm_levant_triumph_name: "Host a Triumph for the [GetGeographicRegion('geographic_region_levant').GetName]"
 grefm_levant_triumph_desc: "Phoenicia, an ancient name for the land known as the Levant, once linked the ancient Greek world to the eastern centers of civilization in Egypt and Mesopotamia. Once a part of the easternmost Roman Empire, these lands have languished under centuries of Muslim rulers."
 grefm_egypt_triumph_name: "Host a Triumph for [GetGeographicRegion('geographic_region_aegyptus').GetName]"
 grefm_egypt_triumph_desc: "The Roman East was once anchored on the nomi of Aegyptus. We will bring this former bastion of Greek culture back into the Empire."
 grefm_italy_triumph_name: "Host a Triumph for [GetGeographicRegion('geographic_region_italia').GetName]"
 grefm_italy_triumph_desc: "Once on the fringes of Greek culture, Italy saw the mixing of Greek and Roman culture throughout antiquity. With the East under our control, the time has come to reclaim the old heart of the Roman Empire."

