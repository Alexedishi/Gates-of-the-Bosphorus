 # Journal Entry Groups
 je_group_grefm_megali_idea: "The Megali Idea"

 # Journal Entries
 je_grefm_megali_idea: "The Megali Idea"
 je_grefm_megali_idea_reason: "The Greek World once stretched from the hills of the Balkans to the shores of the Levantine Sea. Across the Mediterranean, Greek peoples call for union with the Greek state. We will see the Greek realm restored."
 je_grefm_megali_idea_complete: "We will have the option to form the #bold Hellenic Empire#!"
 je_grefm_scions_of_rhomania: "Scions of Rhomania"
 je_grefm_scions_of_rhomania_reason: "The Greek World once stretched from the hills of the Balkans to the shores of the Levantine Sea. Across the Mediterranean, Greek peoples call for union with the Greek state. We will see the Greek realm restored."
 je_grefm_scions_of_rhomania_complete:  "We will have the option to form the #bold Roman Empire#!"
 je_grefm_the_greek_plan: "The Greek Plan"
 je_grefm_the_greek_plan_reason: "In the 1780s, Empress Catherine the Great envisioned a restored Greek Empire under Russian tutelage that would secure her access to the Black Sea. Her designs led to the immigration of thousands of Greeks to the northern shores of the Black Sea. We should unite these peoples and seek a greater existence for the Greek people."
 je_grefm_last_of_the_romans: "The Last of the Romans"
 je_grefm_last_of_the_romans_reason: "The Greek World once stretched from the hills of the Balkans to the shores of the Levantine Sea. Across the Mediterranean, Greek peoples call for union with the Greek state. We will see the Greek realm restored."

 je_grefm_greater_greece: "Greater Greece"
 je_grefm_greater_greece_reason: "The Megali Idea has been brought to fruition, but only in its most basic form. Several Greek communities still lie beyond our borders. We have an imperative to see to it that our borders grow until every Greek may find shelter within the Greek state."
 je_grefm_greater_greece_possible: "[ROOT.GetCountry.GetNameNoFlag] has completed the #bold Greek Nationalism#! [concept_journal_entry]"
 je_grefm_grecoturkism: "Helleno-Turkism"
 je_grefm_grecoturkism_reason: "Despite the insults we have inflicted upon each other after centuries of Imperial rule, we have determined that the only way forward for [ROOT.GetCountry.GetName] is to embrace the shared heritage between Greek and Turk. While our cultures are familiar to ech other, this process will take time."
 je_grefm_grecoturkism_goal: "This process will take time..."

 je_grefm_greek_separatism_main: "Greek Separatism"
 je_grefm_greek_separatism_main_reason: "Greek populations extend from their heartlands in Attica, Thessaly, and the Aegean islands to marginal populations reaching into the Levantine and Black Seas. With the rise of nationalism and the Independence of the Greek State, these peoples have begun to yearn for union with the nascent Greek nation. With our support, they may be able to take up arms against their oppressors."
 je_grefm_greek_separatism_crete_status: "The #greece Cretan Revolt#! has #bold #tooltippable #tooltip:[GetRawTextTooltipTag('grefm_crete_progress_tt')] [GetGlobalVariable('grefm_crete_revolt_var').GetValue]/200#!#!#! momentum."
 je_grefm_greek_separatism_sub: "Greek Separatism"
 je_grefm_greek_separatism_sub_reason: "Greek populations extend from their heartlands in Attica, Thessaly, and the Aegean islands to marginal populations reaching into the Levantine and Black Seas. With the rise of nationalism and the Independence of the Greek State, these peoples have begun to yearn for union with the nascent Greek nation. If we fail to keep them placated, they may take up arms against us."

 je_grefm_bul_megali_idea: "The Throne of the East"
 je_grefm_bul_megali_idea_reason: "In 924, Simeon I the Great, then regent of the Bulgarian Empire was crowned #italic basileus tōn Boulgarōn#! by Byzantine Emperor Romanos I. With the extinction of the Byzantine state by the Ottomans and the resurrection of the Bulgarian state, nationalists have declared that the mantle of the Empire has been inherited by [ROOT.GetCountry.GetName]."
 je_grefm_rom_megali_idea: "Scions of the Empire"
 je_grefm_rom_megali_idea_reason: "The Roman Empire once stretched across the Mediterranean, and it was the arrival of Roman settlers that gave rise to the Romanian people. The time has come for [ROOT.GetCountry.GetName] to reclaim the Balkans and restore Roman authority over the Balkans."
 je_grefm_aus_megali_idea: "The Double-headed Emu"
 je_grefm_aus_megali_idea_reason: "A new era is rising in the West. The Double-headed Eagle once stretched its wings across the whole of the Mediterranean Sea. With the [GetCulture('australian').GetName] arrival in the Balkans, the Emu shall rise to take its place."
 je_grefm_emu_empire: "The Emu Empire"
 je_grefm_emu_empire_reason: "The lands of the Romans once stretched across both the Balkans and Anatolia. With the forging of the [ROOT.GetCountry.GetName], we will secure dominion over these lands."
 je_grefm_emu_of_the_east: "The Emu of the East"
 je_grefm_emu_of_the_east_reason: "The Roman East encompassed Egypt and the Levant at the height of the Empire. We will bring the cradle of Christianity under the protection of the Double-headed Emu."

 # Decisions
 grefm_annex_hepatanese_decision: "Annex the Ionian Islands"
 grefm_annex_hepatanese_decision_desc: "The Ionian Islands changed hands multiple times throughout the Napoleonic Wars, and were not integrated into the Greek state upon their independence. If we can obtain the consent of both the Ionian people and the government of their protectors, we may be able to negotiate a peaceful transition of power."
 grefm_annex_epirus_decision: "Annex Epirus"
 grefm_annex_epirus_decision_desc: "The Epirote people fought for their freedom from the Ottomans to join the Greek state. We should welcome them into the fold."
 grefm_annex_cyprus_decision: "Annex Cyprus"
 grefm_annex_cyprus_decision_desc: "The Cypriot people have overthrown their Turkish oppressors and call for union with the [ROOT.GetCountry.GetAdjectiveNoFormatting] state."
 grefm_annex_macedonia_decision: "Annex Macedonia"
 grefm_annex_macedonia_decision_desc: "The Macedonian people have earned their freedom from Muslim persecution. They should take their place in the Greek state."
 grefm_annex_crete_decision: "Annex Crete"
 grefm_annex_crete_decision_desc: "The people of Crete have struggled for generations against their Muslim oppressors. We should welcome them into the Greek state."
 grefm_annex_samos_decision: "Annex Samos"
 grefm_annex_samos_decision_desc: "The island of Samos has resisted complete subjugation to the Porte since the war of independence. We should welcome them into the Greek state."
 grefm_annex_trabzon_decision: "Annex Trabzon"
 grefm_annex_trabzon_decision_desc: "Trabzon held out for years after the fall of Byzantium. With some patient diplomacy, they could be reunited with the Greek state."
 grefm_annex_cappadocia_decision: "Annex Cappadocia"
 grefm_annex_cappadocia_decision_desc: "The highlands of Cappadocia have hosted [ROOT.GetCountry.GetAdjectiveNoFormatting] populations since the Hellenistic era. With some negotiations, we could seek their reunion with Greek."
 grefm_annex_theodoro_decision: "Annex Theodoro"
 grefm_annex_theodoro_decision_desc: "Theodoro was once of the rumps states that survived the fall of Constantinople. Greeks still call its coasts home today, and it may be possible to negotiate their reunion with the Greek state."

