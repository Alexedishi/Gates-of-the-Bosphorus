 # Tooltips
 grefm_megali_idea: "@gbbf_unification! #o #tooltip:[GetRawTextTooltipTag('grefm_megali_idea_desc')] Megali Idea#!#!"
 grefm_megali_idea_desc: "@gbbf_unification! #header Megali Idea#!$gbbf_linebreak_normal$#lore "Once more, as years and time go by, once more they shall be ours."#!\n\nThe #bold Megali Idea#! is a nationalist and irredentist concept that expresses the idea of reviving the Greek Empire encompassing both the Greek State and those Greek populations still under the rule of the Ottoman Empire. Lacking a formal definition or manifesto, the claims of the Megali Idea range from the Balkans to Anatolia and Cyprus.$gbbf_linebreak_normal$The #bold Megali Idea#! [concept_journal_entry] will take different names depending on the [concept_primary_cultures] of your country. These are:\n • #bold $je_grefm_megali_idea_name_hellene$#! for [GetCulture('greek').GetName] countries\n • #bold $je_grefm_megali_idea_name_rhomaios$#! for [GetCulture('rhomaios').GetName] countries\n • #bold $je_grefm_megali_idea_name_urum$#! for [GetCulture('urum').GetName] countries"
 grefm_megali_idea_aspirant: "[ROOT.GetCountry.GetName] will be able to access the $grefm_megali_idea$ [concept_journal_entry]"

 grefm_greek_empire: "#tooltippable #tooltip:[GetRawTextTooltipTag('grefm_greek_empire_desc')] Greek Empire#!#!"
 grefm_greek_empires: "#tooltippable #tooltip:[GetRawTextTooltipTag('grefm_greek_empire_desc')] Greek Empires#!#!"
 grefm_greek_empire_desc: "The Greek Empire [concept_country] may be known as:\n • #bold $dyn_c_hellas$#!\n • #bold $dyn_c_rhomania$#!\n • #bold $dyn_c_byzantium$#!\n • #bold $dyn_c_graia$#!"

 grefm_greek_empire_name_hellas: "As we have the [GetCulture('greek').GetName] $gbbf_primary_culture$, the $grefm_greek_empire$ will be known as #v $dyn_c_hellas$#!"
 grefm_greek_empire_name_rome: "As we have the [GetCulture('rhomaios').GetName] $gbbf_primary_culture$, the $grefm_greek_empire$ will be known as #v $dyn_c_rhomania$#!"
 grefm_greek_empire_name_byzantium: "As we have the [GetCulture('rhomaios').GetName] $gbbf_primary_culture$, the $grefm_greek_empire$ will be known as #v $dyn_c_byzantium$#!"
 grefm_greek_empire_name_graia: "As we have both [GetCulture('greek').GetName] #bold and#! [GetCulture('rhomaios').GetName] as [concept_primary_cultures], the $grefm_greek_empire$ will be known as #v $dyn_c_graia$#!"
 grefm_greek_empire_name_emu: "As we have the [GetCulture('australian').GetName] $gbbf_primary_culture$, the $grefm_greek_empire$ will be known as the #v $dyn_c_byzantine_emu_empire$#!"

 grefm_weaksauce: "#bold #red The completion requirements of the#! [GetPlayer.GetCustom('grefm_megali_idea_name_type')] #red will stay the same:#!#!$grefm_megali_idea_base$"
 grefm_embrace_megali_idea: "#bold #red The completion requirements of the#! [GetPlayer.GetCustom('grefm_megali_idea_name_type')] #red will expand to the following:#!#!$grefm_megali_idea_pan_greek$"
 grefm_embrace_imperial_restoration: "#bold #red The completion requirements of the#! [GetPlayer.GetCustom('grefm_megali_idea_name_type')] #red will expand to the following:#!#!$grefm_megali_idea_byzantium$"
 grefm_megali_idea_rejected_effect: "#bold #red [ROOT.GetCountry.GetName] will reject the $grefm_megali_idea$."

 grefm_greek_enosis: "#bold #red This will change your played country to#! #greece Greece#! #red ! You will adopt all Greek laws and institutions!#!#!."
 grefm_turkish_homelands_tt: "All other Greek homeland states will lose their Turkish homeland status."

 grefm_megali_idea_base: "\n • [ROOT.GetCountry.GetNameNoFlag] is at peace\n • [ROOT.GetCountry.GetNameNoFlag] is #b not#! a [concept_subject] of another nation\n • [ROOT.GetCountry.GetAdjectiveNoFlag] [concept_gold_reserves] are greater than #v @money![GetPlayer.MakeScope.ScriptValue('greek_nationalism_gold_min')|2]#!\n • [ROOT.GetCountry.GetNameNoFlag] owns all of [GetStateRegion('STATE_EASTERN_THRACE').GetName]\n • $je_grefm_megali_idea_complete_base$\n • [concept_rank] of [ROOT.GetCountry.GetNameNoFlag] is greater than or equal to [concept_minor_power]\n • [ROOT.GetCountry.GetNameNoFlag] has #b no#! $gbbf_insurrectionary$ $gbbf_political_movements$"

 grefm_megali_idea_pan_greek: "\n • [ROOT.GetCountry.GetNameNoFlag] is at peace\n • [ROOT.GetCountry.GetNameNoFlag] is #b not#! a [concept_subject] of another nation\n • [ROOT.GetCountry.GetAdjectiveNoFlag] [concept_gold_reserves] are greater than #v @money![GetPlayer.MakeScope.ScriptValue('greek_nationalism_gold_min')|2]#!\n • [ROOT.GetCountry.GetNameNoFlag] owns all of [GetStateRegion('STATE_EASTERN_THRACE').GetName]\n • $je_grefm_megali_idea_complete_pan_greek$\n • [concept_rank] of [ROOT.GetCountry.GetNameNoFlag] is greater than or equal to [concept_major_power]\n • [ROOT.GetCountry.GetNameNoFlag] has #b no#! $gbbf_insurrectionary$ $gbbf_political_movements$"

 grefm_megali_idea_byzantium: "\n • [ROOT.GetCountry.GetNameNoFlag] is at peace \n • [ROOT.GetCountry.GetNameNoFlag] is #b not#! a [concept_subject] of another nation\n • [ROOT.GetCountry.GetName] will need to form $BYZ$ in [concept_nation_formation]\n • [ROOT.GetCountry.GetAdjectiveNoFlag] [concept_gold_reserves] are greater than #v @money![GetPlayer.MakeScope.ScriptValue('greek_nationalism_gold_min')|2]#!\n • [ROOT.GetCountry.GetNameNoFlag] owns all of [GetStateRegion('STATE_EASTERN_THRACE').GetName]\n • $je_grefm_megali_idea_complete_byzantium$\n • [concept_rank] of [ROOT.GetCountry.GetNameNoFlag] is greater than or equal to [concept_major_power]\n • [ROOT.GetCountry.GetNameNoFlag] has #b no#! $gbbf_insurrectionary$ $gbbf_political_movements$"
 
