 notification_notification_grefm_claims_added_desc: "We have gained claims on #o Attica#!, #o Peloponnese#!, #o Thessaly#! and the #o West Aegean Islands#!.

 # Scripted Buttons
 grefm_greek_enosis_button: "Seek Union with the Greek State"
 grefm_greek_enosis_button_desc: "The time was come for us to reunite with our brothers in the Greek state. All that remains is to complete the paperwork."