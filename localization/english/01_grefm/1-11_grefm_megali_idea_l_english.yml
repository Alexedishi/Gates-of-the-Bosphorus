l_english:
 # Journal Entries
 je_grefm_megali_idea: "[GetPlayer.GetCustom('grefm_megali_idea_name_type')]"
 je_grefm_megali_idea_reason: "[GetPlayer.GetCustom('grefm_megali_idea_body_type')]"
 je_grefm_megali_idea_possible: "[ROOT.GetCountry.GetNameNoFlag] has #v [GetPlayer.MakeScope.ScriptValue('grefm_megali_idea_possible_value')] or more#! $gbbf_states$ in [GetCulture('greek').GetName] $gbbf_homelands$"
 je_grefm_megali_idea_complete: "[ROOT.GetCountry.GetNameNoFlag] completely owns at least #v [GetPlayer.MakeScope.ScriptValue('grefm_megali_idea_complete_value')]#! $gbbf_states$ in the [GetGeographicRegion('geographic_region_greek_heartlands').GetName] $je_grefm_megali_idea_complete_counter$"
 je_grefm_megali_idea_status_default: "In pursuit of expanding the Greek State"
 je_grefm_megali_idea_status_embraced_megali_idea: "In pursuit of the Megali Idea"
 je_grefm_megali_idea_status_embraced_imperial_restoration: "In pursuit of the Empire of the Greeks"
 
 je_grefm_megali_idea_name_hellene: "The Megali Idea"
 je_grefm_megali_idea_name_rhomaios: "Scions of Rhomania"
 je_grefm_megali_idea_name_hybrid: "The Megali Idea"
 je_grefm_megali_idea_name_urum: "The Last of the Romans"
 je_grefm_megali_idea_name_bulgaria: "The Throne of the East"
 je_grefm_megali_idea_name_romania: "Scions of the Empire"
 je_grefm_megali_idea_name_australia: "The Double-headed Emu"

 je_grefm_megali_idea_body_default: "The Greek World once stretched from the hills of the Balkans to the shores of the Levantine Sea. Across the Mediterranean, Greek peoples call for union with the Greek state. We will see the Greek realm restored."
 je_grefm_megali_idea_body_hellene: "$je_grefm_megali_idea_body_default$"
 je_grefm_megali_idea_body_rhomaios: "$je_grefm_megali_idea_body_default$"
 je_grefm_megali_idea_body_hybrid: "$je_grefm_megali_idea_body_default$"
 je_grefm_megali_idea_body_urum: "$je_grefm_megali_idea_body_default$"
 je_grefm_megali_idea_body_bulgaria: "In 924, $gbbf_bio_simeon_veliki$, then regent of the Bulgarian Empire was crowned #italic basileus tōn Boulgarōn#! by Byzantine Emperor Romanos I. With the extinction of the Byzantine state by the Ottomans and the resurrection of the Bulgarian state, nationalists have declared that the mantle of the Empire has been inherited by [ROOT.GetCountry.GetName]."
 je_grefm_megali_idea_body_romania: "The Roman Empire once stretched across the Mediterranean, and it was the arrival of Roman settlers that gave rise to the Romanian people. The time has come for [ROOT.GetCountry.GetName] to reclaim the Balkans and restore Roman authority over the Balkans."
 je_grefm_megali_idea_body_australia: "A new era is rising in the West. The Double-headed Eagle once stretched its wings across the whole of the Mediterranean Sea. With the [GetCulture('australian').GetName] arrival in the Balkans, the Emu shall rise to take its place."

 je_grefm_the_greek_plan: "The Greek Plan"
 je_grefm_the_greek_plan_reason: "In the 1780s, Empress Catherine the Great envisioned a restored Greek Empire under $RUS_ADJ$ tutelage that would secure her access to the Black Sea. Her designs led to the immigration of thousands of Greeks to the northern shores of the Black Sea. We should unite these peoples and seek a greater existence for the Greek people."

 je_grefm_byzantine_restoration: "[GetPlayer.GetCustom('grefm_byzantine_restoration_name_type')]"
 je_grefm_byzantine_restoration_reason: "[GetPlayer.GetCustom('grefm_byzantine_restoration_body_type')]"
 je_grefm_byzantine_restoration_status_base: "Restoring Eastern Rome"
 je_grefm_byzantine_restoration_status_expanded: "Reuniting the Roman Empire"
 je_grefm_byzantine_restoration_rejected_effect: "[ROOT.GetCountry.GetNameNoFlag] will #bold #red reject#!#! the #bold Byzantine Restoration#!"
 je_grefm_byzantine_restoration_rejected_trigger: "[ROOT.GetCountry.GetNameNoFlag] has rejected the #bold Byzantine Restoration#!"

 je_grefm_byzantine_restoration_name_default: "The Byzantine Restoration"
 je_grefm_byzantine_restoration_name_hellene: "The Revenge of the Greeks"
 je_grefm_byzantine_restoration_name_rhomiaos: "The Purple Phoenix"
 je_grefm_byzantine_restoration_name_hybrid: "The Empire of the Greeks"
 je_grefm_byzantine_restoration_name_australia: "The Emu of the West"

 je_grefm_byzantine_restoration_body_default: "The Byzantine realm once stretched across the Eastern Mediterranean. We will restore our dominion over these lands."
 je_grefm_byzantine_restoration_body_hellene: "$je_grefm_byzantine_restoration_body_default$"
 je_grefm_byzantine_restoration_body_rhomiaos: "$je_grefm_byzantine_restoration_body_default$"
 je_grefm_byzantine_restoration_body_hybrid: "$je_grefm_byzantine_restoration_body_default$"
 je_grefm_byzantine_restoration_body_australia: "$je_grefm_byzantine_restoration_body_default$"

 je_grefm_emu_empire: "The Emu Empire"
 je_grefm_emu_empire_reason: "The lands of the Romans once stretched across both the Balkans and Anatolia. With the forging of the [ROOT.GetCountry.GetName], we will secure dominion over these lands."
 je_grefm_emu_of_the_east: "The Emu of the East"
 je_grefm_emu_of_the_east_reason: "The Roman East encompassed Egypt and the Levant at the height of the Empire. We will bring the cradle of Christianity under the protection of the Double-headed Emu."

 # Decisions
 grefm_annex_hepatanese_decision: "Annex the Ionian Islands"
 grefm_annex_hepatanese_decision_desc: "The Ionian Islands changed hands multiple times throughout the Napoleonic Wars, and were not integrated into the Greek state upon their independence. If we can obtain the consent of both the Ionian people and the government of their protectors, we may be able to negotiate a peaceful transition of power."
 grefm_annex_epirus_decision: "Annex Epirus"
 grefm_annex_epirus_decision_desc: "The Epirote people fought for their freedom from the Ottomans to join the Greek state. We should welcome them into the fold."
 grefm_annex_cyprus_decision: "Annex Cyprus"
 grefm_annex_cyprus_decision_desc: "The Cypriot people have overthrown their Turkish oppressors and call for union with the Greek state."
 grefm_annex_macedonia_decision: "Annex Macedonia"
 grefm_annex_macedonia_decision_desc: "The Macedonian people have earned their freedom from Muslim persecution. They should take their place in the Greek state."
 grefm_annex_crete_decision: "Annex Crete"
 grefm_annex_crete_decision_desc: "The people of Crete have struggled for generations against their Muslim oppressors. We should welcome them into the Greek state."
 grefm_annex_samos_decision: "Annex Samos"
 grefm_annex_samos_decision_desc: "The island of Samos has resisted complete subjugation to the Porte since the war of independence. We should welcome them into the Greek state."
 grefm_annex_trabzon_decision: "Annex Trabzon"
 grefm_annex_trabzon_decision_desc: "Trabzon held out for years after the fall of Byzantium. With some patient diplomacy, they could be reunited with the Greek state."
 grefm_annex_cappadocia_decision: "Annex Cappadocia"
 grefm_annex_cappadocia_decision_desc: "The highlands of Cappadocia have hosted Greek populations since the Hellenistic era. With some negotiations, we could seek their reunion with Greek."
 grefm_annex_theodoro_decision: "Annex Theodoro"
 grefm_annex_theodoro_decision_desc: "Theodoro was once of the rumps states that survived the fall of Constantinople. Greeks still call its coasts home today, and it may be possible to negotiate their reunion with the Greek state."

