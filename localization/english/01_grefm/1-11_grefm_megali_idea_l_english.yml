 je_grefm_megali_idea_complete_pan_greek: "[ROOT.GetCountry.GetNameNoFlag] completely owns at least #v [GetPlayer.MakeScope.ScriptValue('grefm_megali_idea_complete_pan_greek_value')]#! $gbbf_states$ in the [GetGeographicRegion('geographic_region_greek_heartlands').GetName] $je_grefm_megali_idea_complete_counter$"
