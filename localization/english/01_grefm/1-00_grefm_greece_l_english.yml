 grefm_add_venizelism_culture_agenda: "The $grefm_culture_reform_agenda$ will be added to the #bold $je_grefm_venizelism$#! [concept_journal_entry]"
 
 grefm_metaxism_tradition_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_metaxism_tradition_reform_agenda_desc Restore the Pillars of Tradition#!#! $grefm_agenda$"
 grefm_metaxism_tradition_reform_agenda_desc: "Metaxas has based his vision of a \"New State\" in the perceived values of \"Country, Loyalty, Family and Religion\" drawn from the discpline of Ancient Sparta and the centralized state and faith of the Byzantine Empire. As such, his supported have embraced his aims of entrenching [GetLawType('law_monarchy').GetName] and [GetLawType('law_state_religion').GetName] as the pillars of the New Greece."
 grefm_metaxism_tradition_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_metaxism_tradition_reform_agenda_desc Restore the Pillars of Tradition#!#!"
 
 grefm_metaxism_authoritarian_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_metaxism_authoritarian_reform_agenda_desc Secure Political Dominance#!#! $grefm_agenda$"
 grefm_metaxism_authoritarian_reform_agenda_desc: "Metaxas has framed the history of post-independence Greek politics as on marred by instability and corruption. With this in mind, his supporters seek to sideline and abolish all forms of political and popular dissent."
 grefm_metaxism_authoritarian_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_metaxism_authoritarian_reform_agenda_desc Secure Political Dominance#!#!"
 
