l_english:
 # Decisions
 grefm_corinth_canal_survey_decision: "Survey the Isthmus of Corinth"
 grefm_corinth_canal_survey_decision_desc: "Since ancient times, the Isthmus of Corinth has linked the Peloponnese from the rest of Greece. With modern innovations in engineering and explosives, we may be able to link the Ionian and Aegean Seas."
 grefm_lake_kopais_decision: "Drain Lake Kopais"
 grefm_lake_kopais_decision_desc: "In ancient times, the Kopaida Plain was drained and became essential for agriculture in the region. With our growing industrial prowess, Lake Kopais could be drained once more."

 # Ideologies
 ideology_gbbf_bavarocrat: "Bavarocrat"
 ideology_gbbf_bavarocrat_desc: "#lore Empowered by their favor with the Wittelsbach court, this character seeks to retain their influence over the state through absolutist Monarchism.#!"
 ideology_gbbf_constitutionalist: "Constitutionalist"
 ideology_gbbf_constitutionalist_desc: "#lore Inspired by Western thought, this character aims to bring Constitutional rule to the nation."

 ideology_gbbf_venizelos: "Venizelist"
 ideology_gbbf_venizelos_desc: "#lore Driven by the Cretan struggle, this character strives to reform Greek society for an industrial future and to bring the dream of the $grefm_megali_idea$ into reality.#!"
 ideology_gbbf_venizelist: "Venizelist"
 ideology_gbbf_venizelist_desc: "#lore Inspired by the Ethnarch, this character strives to reform Greek society for an industrial future and to bring the dream of the $grefm_megali_idea$ into reality.#!"

 # Journal Entries
 je_grefm_bavarocracy_main: "The Bavarocracy"
 je_grefm_bavarocracy_main_reason: "Following the collapse of the [ROOT.GetCountry.GetAdjective] government after the assassination of #yellow Ioannis Kapodistrias#!, the [Concept('concept_great_power','$concept_great_powers$')] installed #yellow House Wittelsbach#! as sovereign over the Greek State in the hope of bringing stability to the young nation. However, since taking power, King [ROOT.GetCountry.GetRuler.GetFullName] has conspired to rule Greece by means of absolutism. Meanwhile, both citizens and politicians protest the stagnation and corruption rampant in the nation.[SCOPE.GetRootScope.GetCountry.GetCustom('grefm_bavarocracy_type')]\n$TOOLTIP_DELIMITER$\nCurrently, the King enjoys #bold #greece [ROOT.GetVariable('grefm_bavarocracy_var').GetValue]#!#! #bold Political Support#!.\nThis is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_bavarocracy_main_breakdown [ROOT.GetVariable('grefm_bavarocracy_progress_var').GetValue|+=2]#! next month."
 je_grefm_bavarocracy_phase_regency: "\n$TOOLTIP_DELIMITER$\n@information! The $grefm_regency_council$ currently has a stranglehold on the Greek state and its politics. With the young King approaching adulthood, he will soon be able to take action against #yellow Armansperg#! and his lackeys.\n$TOOLTIP_DELIMITER$\n#bold Current Political Instability: #red [ROOT.GetVariable('grefm_bavarocracy_instability_var').GetValue]#!/100#!\nThis is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_bavarocracy_instability_breakdown [ROOT.GetVariable('grefm_bavarocracy_instability_progress_var').GetValue|-=2]#! next month."
 je_grefm_bavarocracy_phase_constitution: "\n$TOOLTIP_DELIMITER$\n@information! When the $grefm_regency_council$ took custody of the nation for the young King Otto, promises were made to produce a constitution that would limit the power of the King and provide good governance to the people. The National Assembly impatiently awaits for the enactment of suffrage rights. Should political instability progress too far, Constitutionalist leaders will take action against the King.\n$TOOLTIP_DELIMITER$\n#bold Current Political Instability: #red [ROOT.GetVariable('grefm_bavarocracy_instability_var').GetValue]#!/200#!\nThis is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_bavarocracy_instability_breakdown [ROOT.GetVariable('grefm_bavarocracy_instability_progress_var').GetValue|-=2]#! next month."
 je_grefm_bavarocracy_phase_tyranny: "\n$TOOLTIP_DELIMITER$\n@information! [ROOT.GetCountry.GetRuler.GetFullName] has declared himself the absolute ruler of [ROOT.GetCountry.GetName]. The National Assembly has been disbanded, and the King directly chairs his privy council, routing all affairs of state through his office. This has not gone unanswered and supporters of constitutional rule have begun to rally the people to the cause of democracy. Should political instability progress too far, Constitutionalist leaders will take action against the King.\n$TOOLTIP_DELIMITER$\nThe King has maintained autocratic rule for #bold [ROOT.GetVariable('grefm_tyranny_var').GetValue]/84#! months.\n#bold Current Political Instability: #red [ROOT.GetVariable('grefm_bavarocracy_instability_var').GetValue]#!/200#!\nThis is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_bavarocracy_instability_breakdown [ROOT.GetVariable('grefm_bavarocracy_instability_progress_var').GetValue|-=2]#! next month."
 je_grefm_bavarocracy_phase_bavarianism: "\n$TOOLTIP_DELIMITER$\n@information! [ROOT.GetCountry.GetRuler.GetFullName] has enforced his absolute rule over [ROOT.GetCountry.GetName]. All that remains is to entrench his political control over the Greek state."
 je_grefm_bavarocracy_status_regency: "The $grefm_regency$ holds the throne.\n#bold Political Instability: #red [ROOT.GetVariable('grefm_bavarocracy_instability_var').GetValue]#!/200#!"
 je_grefm_bavarocracy_status_constitution: "The people demand a constitution.\n#bold Political Instability: #red [ROOT.GetVariable('grefm_bavarocracy_instability_var').GetValue]#!/200#!"
 je_grefm_bavarocracy_status_tyranny: "The King is imposing autocratic rule.\n#bold Political Instability: #red [ROOT.GetVariable('grefm_bavarocracy_instability_var').GetValue]#!/200#!"
 je_grefm_bavarocracy_status_bavarianism: "Cement the King's rule."
 je_grefm_bavarocracy_main_status: "Guide the people of [ROOT.GetCountry.GetName] into Liberty or Autocracy."
 je_grefm_bavarocracy_main_breakdown: "[Country.MakeScope.GetScriptValueDesc('grefm_bavarocracy_progress_value')]"
 je_grefm_bavarocracy_main_complete_2: "The King has maintained [GetLawType('law_autocracy').GetName] for #bold 7#! years"
 je_grefm_bavarocracy_main_complete_1: "The King has maximum support"
 je_grefm_bavarocracy_main_fail_1: "The King has lost all support"
 je_grefm_bavarocracy_main_fail_2: "Triggers the event #bold The October Revolution#!"
 je_grefm_bavarocracy_instability_breakdown: "[Country.MakeScope.GetScriptValueDesc('grefm_bavarocracy_instability_progress_value')]"

 je_grefm_bavarocracy_ip3: "The Bavarocracy"
 je_grefm_bavarocracy_ip3_reason: "Following its establishment in 1832 after the assassination of #yellow Ioannis Kapodistrias#!, the nascent [ROOT.GetCountry.GetAdjective] kingdom — the first truly independent Greek state since the days of Constantine XI — has been under the thumb of [ROOT.GetCountry.GetRuler.GetFullName] and his Bavarian regents.\n\nSince taking power, King [ROOT.GetCountry.GetRuler.GetFirstName] has conspired to rule Greece by means of absolutism. Meanwhile, both citizens and politicians alike protest the stagnation and corruption rampant in the nation. If the young king wants to prove himself as a worthy ruler of the [GetCulture('greek').GetName], he will have to take drastic steps to appease his new subjects.\n$TOOLTIP_DELIMITER$\nCurrently, [concept_bavarocratic_ire] is #v [GetPlayer.MakeScope.Var('grefm_bavarocracy_instability_var').GetValue]#!. This is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_bavarocracy_ip3_ire_breakdown [ROOT.GetVariable('grefm_bavarocracy_instability_progress_var').GetValue|-=2]#! next month.\n\nRevolutionary Momentum is #v [GetPlayer.MakeScope.Var('grefm_bavarocracy_var').GetValue]#!. This will increase by #v 1#! every month that [concept_bavarocratic_ire] is over #v 80#!. Should Revolutionary Momentum reach #v 50#!, the $grefm_bavarocracy$ will be ejected from [ROOT.GetCountry.GetName].[GetPlayer.GetCustom('grefm_tyranny_type')]"
 je_grefm_bavarocracy_ip3_liberalism_complete: "If completed with a Liberal outcome, Triggers the Event #white #bold Civilizer-King of the Hellenes#!#!"
 je_grefm_bavarocracy_ip3_autocracy_complete: "If completed with an Autocratic outcome, Triggers the Event #white #bold The Othonian Realm#!#!"
 je_grefm_bavarocracy_ip3_fail: "Bavarocratic Ire has been at #v 80#! or above for #v 50#! months. Currently this has been true for #v [GetPlayer.MakeScope.Var('grefm_bavarocracy_var').GetValue]#! months."
 je_grefm_bavarocracy_ip3_status_regency: "The $grefm_regency$ grips the throne."
 je_grefm_bavarocracy_ip3_status_tyranny: "Cement the King's rule."
 je_grefm_bavarocracy_ip3_main_status: "Guide [ROOT.GetCountry.GetName] into Liberty or Autocracy."
 je_grefm_bavarocracy_ip3_ire_breakdown: "[Country.MakeScope.GetScriptValueDesc('grefm_bavarocractic_ire_progress_value')]"
 je_grefm_bavarocracy_ip3_tyranny: "\n@warning! #red #bold #italic Repealing [GetLawType('law_autocracy').GetName] will result in the people forcing the enactment of Suffrage Rights!#!#!#!"

 je_grefm_greek_king: "A Greek King"
 je_grefm_greek_king_reason: "The European imposition that was the $grefm_bavarocracy$ has been overthrown. However, this has come at the cost of challenging the diplomatic recognition of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state. In a ploy to salvage the legitimacy of an independent [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetFullName] has set up a custodian government with the aim of appointing a ruler capable of securing recognition by the senior noble families of Europe."
 je_grefm_greek_king_complete: "[ROOT.GetCountry.GetNameNoFlag] has elected a Greek King"

 je_grefm_the_dedilomeni_principle: "The Dedilomeni Principle"
 je_grefm_the_dedilomeni_principle_reason: "After two revolts against the monarchy, the spirit of reform is widespread in Greece. Reformers have demanded that the King be mandated to appoint a government leader with a majority of political power, rather than the leader being chosen by their favor with the King."
 je_grefm_the_dedilomeni_principle_goal: "Maintain legitimate rule for 5 years."
 je_grefm_the_dedilomeni_principle_complete: "Maintain these conditions for 5 years."
 je_grefm_the_dedilomeni_principle_otto_alternate_tt: "This outcome of this journal will vary depending on which group of laws is implemented."
 je_grefm_the_dedilomeni_principle_otto_alternate_goal: "Maintain Absolutism or Reform into Democracy."
 je_grefm_the_dedilomeni_principle_byzantium_alternate: "The Basileùs Autokrátōr"
 je_grefm_the_dedilomeni_principle_byzantium_alternate_reason: "Byzantium has been resurrected and with it the legacy of four millennia of Greek administrative tradition. As the Greek state reorganizes itself around the imperial court, politicians and citizens alike anxiously await to see what form the Imperial administration will take."
 je_grefm_the_military_league: "The Military League"
 je_grefm_the_military_league_reason: "Motivated by the dream of enosis with Crete and a greater union with Greeks beyond our borders, a band of militarists has hatched a plan to overthrow the government and place themselves in charge. Should they succeed, they intend to reorganize the Greek state to further the cause of the $grefm_megali_idea$."
 je_grefm_the_military_league_goal: "The Military League is preparing..."

 je_grefm_venizelism_main: "Venizelism"
 je_grefm_venizelism_main_reason: "Eleftherios Venizelos is at the helm, and an era of wild change has begun in the Greek state. With the people in a nationalistic fervor, Venizelos and his supporters aim to bring Greece onto the world stage with little to no regard for the whims of the Great Powers. #italic Ankyra! Ankyra!#!"
 je_grefm_venizelism_tt1: "Develop Greek Nationalism."
 je_grefm_venizelism_tt2: "Rejuvenate the Government Apparatus"
 je_grefm_venizelism_tt3: "Modernize the Military"
 je_grefm_venizelism_tt4: "Push Forward Societal Reforms"
 je_grefm_venizelism_tt5: "Implement Educational Initiatives"
 je_grefm_venizelism_civics: "Venizelism: Civic Rejuvenation"
 je_grefm_venizelism_civics_reason: "The Greek State has come a long way since independence from the Ottoman Empire. Now, with renewed motivation from Venizelos, the revisionists hope to build the state apparatus into a system capable of rivaling those of Western Europe."
 je_grefm_venizelism_military: "Venizelism: Military Rejuvenation"
 je_grefm_venizelism_military_reason: "Little memory remains of the semi-formal #italic Evzones#! units that were hastily assembled during the Greek Revolution. As planners look forward towards a future in which Greece has a voice in the Balkans, it has become clear that a disciplined and capable army will be essential in securing this outcome."
 je_grefm_venizelism_society: "Venizelism: Societal Rejuvenation"
 je_grefm_venizelism_society_reason: "In many ways, Greek social norms reflect centuries of conservative pressures from both the Ottoman state and the Orthodox Church. Intellectuals argue that Greece must shed these feudal relics in order to leap into the modern age."
 je_grefm_venizelism_education: "Venizelism: Academic Rejuvenation"
 je_grefm_venizelism_education_reason: "While ambitious, the education reforms put forward by the Venizelists aim to bring to the Greek people up to the forefront of academic standards."
 je_grefm_venizelism_constitution: "Venizelism: Constitutional Reform"
 je_grefm_venizelism_constitution_reason: "In the wake of Venizelos' arrival in Greece, the Constituent faction in the National Assembly pushed for the complete abolition of the Monarchy."
 je_grefm_venizelism_humanities: "Venizelism: Supporting Greek Humanities"
 je_grefm_venizelism_humanities_reason: ""

 je_grefm_the_womens_journal: "The Women's Journal"
 je_grefm_the_womens_journal_reason: "Spearheaded by Kalliroi Parren and backed by the greater Feminism movement, women across the Greek state yearn for better treatment. Historically seen as little more than housewives, women seek their own role in advancing the nationalist cause of the Greek people. The publication, #italic The Women's Journal#!, has acted as a herald for this movement putting forth the ideas that women should own their own property and that children should be taken off the factory floors."

 je_grefm_corinth_canal_survey: "Corinth Canal Survey"
 je_grefm_corinth_canal_survey_reason: "The survey of the Corinth Canal is underway. Engineers are optimistic about plans to realize the millennia-old dream of cutting a channel across the isthmus."
 je_grefm_corinth_canal_survey_goal: "Wait for the survey to complete..."
 je_grefm_land_reclaimation: "Lake Kopais Reclamation"
 je_grefm_land_reclaimation_reason: "The Kopais Plain was a fertile land in antiquity. With our industrial might, we will see it restored to productivity. Currently, we estimate water levels have dropped by #blue [GetGlobalVariable('grefm_lake_kopais_var').GetValue]/3#!."
 je_grefm_land_reclaimation_goal: "Draining the lakebed will take several years. Events will notify you of progress."
 je_grefm_land_reclaimation_status: "Reclamation of the lakebed is underway..."

 # Journal Entry Lobby Text
 je_grefm_bavarocracy_main_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_ip3$\nSince taking power, King Otto von Wittelsbach has conspired to rule Greece by means of absolutism. Meanwhile, both citizens and politicians protest the stagnation and corruption rampant in the nation."
 je_grefm_venizelism_main_lobby: "$gbbf_journal_lobby$\nEleftherios Venizelos is at the helm, and an era of wild change has begun in the Greek state. With the people in a nationalistic fervor, Venizelos and his supporters aim to bring Greece onto the world stage with little to no regard for the whims of the Great Powers. #italic Ankyra! Ankyra!#!"

