 grefm_reform_agenda: "#o #tooltip:[GetPlayer.GetTooltipTag],grefm_reform_agenda_desc Reform Agenda#!#!"
 grefm_reform_agenda_desc: "A #bold Reform Agenda#! is a stated goal for developing an aspect of the state or society. Completing all Agendas will contribute to the success of its [concept_journal_entry]. The number of completed Agendas will also provide for a qualified failure if the entry is failed."
 grefm_reform_agendas: "#o #tooltip:[GetPlayer.GetTooltipTag],grefm_reform_agenda_desc Reform Agendas#!#!"
 grefm_agenda: "#o #tooltip:[GetPlayer.GetTooltipTag],grefm_reform_agenda_desc Agenda#!#!"
 grefm_agendas: "#o #tooltip:[GetPlayer.GetTooltipTag],grefm_reform_agenda_desc Agendas#!#!"
 
 grefm_identity_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_identity_reform_desc Develop a National $grefm_identity$#!#! $grefm_agenda$"
 grefm_identity_reform_desc: "Despite their presence along the [GetGeographicRegion('geographic_region_aegean_sea').GetName] since time immemorial, the $grefm_greek$ people gave never held a singular cultural identity to unite them. Emboldened by the firey rhetoric of the Ethnarch, the Venizelists hope to build a culture to bind the Greek state together."
 grefm_identity_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_identity_reform_desc Develop a National $grefm_identity$#!#!"
 
 grefm_civic_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_civic_reform_desc Modernize the Government#!#! $grefm_agenda$"
 grefm_civic_reform_desc: "The Greek State has come a long way since independence from the Ottoman Empire. Now, with renewed motivation from Venizelos, the revisionists hope to build the state apparatus into a system capable of rivaling those of Western Europe."
 grefm_civic_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_civic_reform_desc Modernize the Government#!#!"
 
 grefm_military_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_military_reform_desc Expand the Military#!#! $grefm_agenda$"
 grefm_military_reform_desc: "Little memory remains of the semi-formal #italic Evzones#! units that were hastily assembled during the Greek Revolution. As planners look forward towards a future in which Greece has a voice in the Balkans, it has become clear that a disciplined and capable army will be essential in securing this outcome."
 grefm_military_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_military_reform_desc Expand the Military#!#!"
 
 grefm_social_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_social_reform_desc Advance Social Norms#!#! $grefm_agenda$"
 grefm_social_reform_desc: "In many ways, Greek social norms reflect centuries of conservative pressures from both the Ottoman state and the Orthodox Church. Intellectuals argue that Greece must shed these feudal relics in order to leap into the modern age."
 grefm_social_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_social_reform_desc Advance Social Norms#!#!"
 
 grefm_education_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_education_reform_desc Strengthen the Education System#!#! $grefm_agenda$"
 grefm_education_reform_desc: "While ambitious, the education reforms put forward by the Venizelists aim to bring to the Greek people up to the forefront of academic standards."
 grefm_education_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_education_reform_desc Strengthen the Education System#!#!"
 
 grefm_constitution_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_constitution_reform_desc Reform the Constitution#!#! $grefm_agenda$"
 grefm_constitution_reform_desc: "In the wake of Venizelos' arrival in Greece, the Constituent faction in the National Assembly pushed for the complete abolition of the Monarchy."
 grefm_constitution_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_constitution_reform_desc Reform the Constitution#!#!"
 
 grefm_culture_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_culture_reform_desc Patronize the Humanities#!#! $grefm_agenda$"
 grefm_culture_reform_desc: "It was the legacy of Ancient Greek culture that first inspired the Philhellenes to support the independence of the Greek state. The Venizelists hope to inaugurate a new Greek Renaissance by sponsoring artistic efforts across the Greek state."
 grefm_culture_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],grefm_culture_reform_desc Patronize the Humanities#!#!"
 
 grefm_add_venizelism_identity_agenda: "The $grefm_identity_reform_agenda$ will be added to the #bold $je_grefm_venizelism$#! [concept_journal_entry]"
