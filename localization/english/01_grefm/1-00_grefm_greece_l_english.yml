 # Scripted Buttons
 grefm_dismiss_auxilliaries_button: "Dismiss the Bavarian Auxiliaries"
 grefm_dismiss_auxilliaries_button_desc: "When King Otto arrived in 1832 he was accompanied by a force of 3500 Bavarian soldiers to solidify his rule. In the time since, they have found themselves unable to assimilate to life in [ROOT.GetCountry.GetNameNoFlag], speaking neither the language nor having access to the comforts of home in the pervasively rural Greek state. Between mounting expenses and their use in putting down rebellions, their presence wears on the Greek populace."
 grefm_dismiss_auxilliaries_effect: "Any [GetCulture('south_german').GetName] [GetPopType('officers').GetName] will be removed from [ROOT.GetCountry.GetNameNoFlag]'s [Concept('concept_army','$concept_armies$')]"
 grefm_release_nikitaras_button: "Release Nikitaras from Prison"
 grefm_release_nikitaras_button_desc: "Nikitas Stamatelopoulos is a national hero for his bravery during the Greek War of Independence. However, he was imprisoned during the years of the $grefm_regency_council$ for his strong opposition to the $grefm_bavarocracy$. To this day, he has ardent supporters that pine for his release."
 grefm_authorize_palace_button: "Fund Royal Palace"
 grefm_authorize_palace_button_desc: "In many ways, the $grefm_bavarocrat$ court seeks to legitimize its presence in the Greek state. Several in the King's council have suggested that the construction of a proper royal residence would bring recognition to their continued rule over [ROOT.GetCountry.GetName]."
 grefm_philhellenic_loan_button: "Seek Philhellene Loan"
 grefm_philhellenic_loan_button_desc: "The Philhellenes, admirers of ancient Greek culture and art, funded the Greek revolution. Across western Europe, several Philhellenic organizations have pledged their monetary support towards the young nation."
 grefm_bavarocracy_convert_button: "Convert to the [GetReligion('orthodox').GetName] [concept_religion]"
 grefm_bavarocracy_convert_button_desc: "Despite [ROOT.GetCountry.GetName] being a firmly [GetReligion('orthodox').GetName] country, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has steadfastly clung to his native [GetReligion('catholic').GetName] faith, causing considerable consternation among his newfound subjects.\n\nIf Othonian rule is to endure among the Greeks, perhaps some personal sacrifices must be made?"
 grefm_bavarocracy_convert_button_possible: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] follows the [GetReligion('catholic').GetName] [concept_religion]"
 grefm_bavarocracy_convert_button_effect: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] will convert to the [GetReligion('orthodox').GetName] [concept_religion]"
 grefm_seek_royal_wedding_button: "Seek Royal Wedding"
 grefm_seek_royal_wedding_button_desc: "The legitimacy of the $grefm_bavarocracy$ is marred by the lack of an heir to the throne of [ROOT.GetCountry.GetNameNoFlag]. Advisors to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] have advised that marriage and production of an heir is instrumental to securing the continued acceptance of House [ROOT.GetCountry.GetRuler.GetLastName]."

 grefm_favor_hellene_king_button: "Favor Hellene Candidates"
 grefm_favor_hellene_king_button_desc: "The [GetCulture('greek').GetName] identity is the only way to unify the Greek people. If we wish, we can provide official support for a candidate of this culture."
 grefm_favor_hellene_king_effect: "This will increase monthly support for a [GetCulture('greek').GetName] candidate by #bold 1#!"
 grefm_favor_roman_king_button: "Favor Roman Candidates"
 grefm_favor_roman_king_button_desc: "The [GetCulture('rhomaios').GetName] identity is the true legacy Greek people. If we wish, we can provide official support for a candidate of this culture."
 grefm_favor_roman_king_effect: "This will increase monthly support for a [GetCulture('rhomaios').GetName] candidate by #bold 1#!"
 grefm_elect_hellene_king_button: "Elect a Hellene King"
 grefm_elect_hellene_king_button_desc: "After months of arduous work, a list of [GetCulture('greek').GetName]-culture candidates has been drawn up, each with the pedigree and public gravitas to sit on the throne of [ROOT.GetCountry.GetName]. The National Assembly awaits the chance to elect the next King."
 grefm_favor_hellene_king_button_effect: "A [GetCulture('greek').GetName] [concept_ruler] will be appointed"
 grefm_elect_roman_king_button: "Elect a Roman King"
 grefm_elect_roman_king_button_desc: "After months of arduous work, a list of [GetCulture('rhomaios').GetName]-culture candidates has been drawn up, each with the pedigree and public gravitas to sit on the throne of [ROOT.GetCountry.GetName]. The National Assembly awaits the chance to elect the next King."
 grefm_elect_roman_king_button_effect: "A [GetCulture('rhomaios').GetName] [concept_ruler] will be appointed"

