 grefm_bavarocracy_instability_progressbar: "Political Instability:#!\n$TOOLTIP_DELIMITER$\n[GetPlayer.GetCustom('grefm_instability_breakdown_type')]\n$TOOLTIP_DELIMITER$\n#bold [GetPlayer.MakeScope.Var('grefm_bavarocracy_instability_progress_var').GetValue|-=]#! #italic #bold monthly"
 grefm_bavarocracy_instability_progressbar_desc: "Political Instability [GetPlayer.GetCustom('grefm_instability_type')]"

