 je_grefm_the_womens_journal: "The Women's Journal"
 je_grefm_the_womens_journal_reason: "Spearheaded by Kalliroi Parren and backed by the greater Feminism movement, women across the Greek state yearn for better treatment. Historically seen as little more than housewives, women seek their own role in advancing the nationalist cause of the Greek people. The publication, #italic The Women's Journal#!, has acted as a herald for this movement putting forth the ideas that women should own their own property and that children should be taken off the factory floors."

 je_grefm_corinth_canal_survey: "Corinth Canal Survey"
 je_grefm_corinth_canal_survey_reason: "The survey of the Corinth Canal is underway. Engineers are optimistic about plans to realize the millennia-old dream of cutting a channel across the isthmus."
 je_grefm_corinth_canal_survey_goal: "Wait for the survey to complete..."
 je_grefm_land_reclamation: "Lake Kopais Reclamation"
 je_grefm_land_reclamation_reason: "The Kopais Plain was a fertile land in antiquity. With our industrial might, we will see it restored to productivity. Currently, we estimate water levels have dropped by #blue [GetGlobalVariable('grefm_lake_kopais_var').GetValue]/3#!."
 je_grefm_land_reclamation_goal: "Draining the lakebed will take several years. Events will notify you of progress."
 je_grefm_land_reclamation_status: "Reclamation of the lakebed is underway..."

 # Journal Entry Lobby Text
 je_grefm_bavarocracy_main_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_ip3$\nSince taking power, King Otto von Wittelsbach has conspired to rule Greece by means of absolutism. Meanwhile, both citizens and politicians protest the stagnation and corruption rampant in the nation."
 je_grefm_the_military_league_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_votp$\nMotivated by the dream of enosis with Crete and a greater union with Greeks beyond our borders, a band of militarists has hatched a plan to overthrow the government and place themselves in charge. Should they succeed, they intend to reorganize the Greek state to further the cause of the $grefm_megali_idea$."
 je_grefm_venizelism_lobby: "$gbbf_journal_lobby$\nEleftherios Venizelos is at the helm, and an era of wild change has begun in the Greek state. With the people in a nationalistic fervor, Venizelos and his supporters aim to bring Greece onto the world stage with little to no regard for the whims of the Great Powers. #italic Ankyra! Ankyra!#!"

