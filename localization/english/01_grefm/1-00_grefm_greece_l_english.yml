 # Notifications
 notification_notification_don_pacifico_gbr1_name: "[SCOPE.sCountry('uk_scope').GetName] supports our complaint."
 notification_notification_don_pacifico_gbr1_desc: "The British government has forwarded our request for reparations to the Greek state."
 notification_notification_don_pacifico_gbr2_name: "[SCOPE.sCountry('uk_scope').GetName] rejects our complaint."
 notification_notification_don_pacifico_gbr2_desc: "The British government has rejected our request for reparations as baseless."
 notification_notification_don_pacifico_gre1_name: "[SCOPE.sCountry('greece_scope').GetName] accepts our compromise."
 notification_notification_don_pacifico_gre1_desc: "The Greek state has accepted our offer to settle the dispute with Don Pacifico. Our mutual relations have improved."
 notification_notification_don_pacifico_gre2_name: "[SCOPE.sCountry('greece_scope').GetName] rejects our compromise."
 notification_notification_don_pacifico_gre2_desc: "The Greek state has refused to cooperate with our attempts to settle the dispute with Don Pacifico. Our mutual relations have declined."

 # Scripted Buttons
 grefm_dismiss_auxilliaries_button: "Dismiss the Bavarian Auxiliaries"
 grefm_dismiss_auxilliaries_button_desc: "Bavarian soldiers and officers dominate the Greek army, causing discord between them and local recruits. Reformers have called for the expulsion of these units from the Greek armed forces."
 grefm_release_nikitaras_button: "Release Nikitaras from Prison"
 grefm_release_nikitaras_button_desc: "Nikitas Stamatelopoulos is a national hero for his bravery during the Greek War of Independence. However, he was imprisoned during the years of the Regency Council for his strong opposition to the Bavarocracy. To this day, he has ardent supporters that pine for his release."
 grefm_authorize_palace_button: "Fund Royal Palace"
 grefm_authorize_palace_button_desc: "In many ways, the Bavarocract court seeks to legitimize its presence in the Greek state. Several in the King's council have suggested that the construction of a proper royal residence would bring recognition to their continued rule over [ROOT.GetCountry.GetName]."
 grefm_philhellenic_loan_button: "Seek Philhellene Loan"
 grefm_philhellenic_loan_button_desc: "The Philhellenes, admirers of ancient Greek culture and art, funded the Greek revolution. Across western Europe, several Philhellenic organizations have pledged their monetary support towards the young nation."

 grefm_favor_hellene_king_button: "Favor Hellene Candidates"
 grefm_favor_hellene_king_button_desc: "The [GetCulture('greek').GetName] identity is the only way to unify the Greek people. If we wish, we can provide official support for a candidate of this culture."
 grefm_favor_roman_king_button: "Favor Roman Candidates"
 grefm_favor_roman_king_button_desc: "The [GetCulture('rhomaios').GetName] identity is the true legacy Greek people. If we wish, we can provide official support for a candidate of this culture."
 grefm_elect_hellene_king_button: "Elect a Hellene King"
 grefm_elect_hellene_king_button_desc: "After months of arduous work, a list of [GetCulture('greek').GetName]-culture candidates has been drawn up, each with the pedigree and public gravitas to sit on the throne of [ROOT.GetCountry.GetName]. The National Assembly awaits the chance to elect the next King."
 grefm_elect_roman_king_button: "Elect a Roman King"
 grefm_elect_roman_king_button_desc: "After months of arduous work, a list of [GetCulture('rhomaios').GetName]-culture candidates has been drawn up, each with the pedigree and public gravitas to sit on the throne of [ROOT.GetCountry.GetName]. The National Assembly awaits the chance to elect the next King."

