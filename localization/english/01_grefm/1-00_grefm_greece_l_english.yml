 grefm_regency_council_desc: "A #bold Regency Council#! was established in [GetPlayer.GetName] by King Ludwig of Bavaria for the minority of King Otto. Led by statesman #bold Josef Ludwig von Armansperg#!, this regency quickly eroded its popularity through its authoritarian style and distrust of the native Greek political parties."
