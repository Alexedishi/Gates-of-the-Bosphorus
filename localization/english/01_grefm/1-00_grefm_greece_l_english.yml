 grefm_bavarocracy_desc: "The #bold Bavarocracy#! is a derogative name used to describe the imposition of a Bavarian king onto the Greek state. While the King was accepted with hope and joy, the proliferation of absolutist thought in the Greek court with its associated corruption has begun to erode trust in the institution of the Monarchy."

