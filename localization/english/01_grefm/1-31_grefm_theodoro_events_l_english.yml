l_english:
 grefm_theodoro.001.t: "The [GetCulture('urum').GetName]#yellow s#! of "Little Theodoro""
 grefm_theodoro.001.d: "For centuries, Greeks have lived along the shores of the Black Sea developing a unique fusion of Greek and Turkic cultures that has flourished in [ROOT.GetCountry.GetName]. While they speak a Turkish language, the [GetCulture('urum').GetName] people practice the [GetReligion('orthodox').GetName] faith and consider themselves to be $greek_cultures$.\n\nUnder the [ROOT.GetCountry.GetPowerBloc.GetName]'s rule, these Greeks have taken on a new importance as the Tsar seeks to project suzerainty over the Orthodox peoples in the Ottoman Empire."
 grefm_theodoro.001.f: "While many have claimed the Urum to be little more than "baptized Tatars", the Urum have retained their faith and continue their Greek traditions despite the loss of their native tongue."
 grefm_theodoro.001.a: "[ROOT.GetCountry.GetName] must find its way."