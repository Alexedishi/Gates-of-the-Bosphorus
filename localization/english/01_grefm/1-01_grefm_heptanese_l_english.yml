l_english:
# Journal Entries
 je_grefm_ion_xenocracy: "The Xenocracy"
 je_grefm_ion_xenocracy_reason: "The [ROOT.GetCountry.GetName] has seen countless overlords come and go, from their initial conquest by the Romans two millennia ago, the Heptanese have changes hands several times, although they avoided conquest by the Ottoman Empire. Since 1815, the island have been administered as a protectorate of the $GBR_ADJ$ Empire. Under the auspices of High Commissioner [ROOT.GetCountry.GetRuler.GetFullName], Philhellenes across the Empire have sought to model the islands into an ideal colony, in line with $GBR_ADJ$ successes across their realm."
 je_grefm_ion_venetian_legacy: "A Venetian Legacy"
 je_grefm_ion_venetian_legacy_reason: "The Heptanese came under Venetian rule in the 13th century after they were taken from the ailing Byzantine Empire. The Venetians brought with them medieval farming practices which widely replaced ancient farming practices. Since then, agriculture has remained unchanged across the islands, with output having declined following successive conflicts between the [Concept('concept_great_power','$concept_great_powers$')] and disruptions from the #bold Greek War of Independence#!. With renewed attention from Philhellenes in London, local leaders have begun to push for a coordinated reform of farming practices across the islands."
 je_grefm_ion_poverty: "Poorhouses and Sanitation"
 je_grefm_ion_poverty_reason: "In the wake of the #bold Greek War of Independence#!, the [ROOT.GetCountry.GetName] have been inundated with refugees from the mainland. Lacking both industry and agriculture, the state has struggled to meet the needs of the poor. In keeping with his mandate, the High Commissioner has formed a committee with the express goal of providing outreach programs to aid the destitute."
 je_grefm_ion_jewry: "The Jewry of the Ionian Islands"
 je_grefm_ion_jewry_reason: "The [GetCulture('sephardic').GetName] Jews have a long history on the [ROOT.GetCountry.GetName]. From the first arrivals during the Second Temple era and Roman rule, to migrations from expulsions at the hands of Catholicism, the #bold Heptanese#! host a vibrant [GetReligion('jewish').GetName] community.\n\nWhile their rights have varied over the course of Byzantine, Venetian, and $FRA_ADJ$ rule, the Jewry have been accustomed to co-existence with the $grefm_greek$ [GetReligion('orthodox').GetName] community. However, their position has taken a sudden turn with the passing of the Islands to the [ROOT.GetCountry.GetPowerBloc.GetName]. With the majority of Jews excluded from the state, many have begun to protest their unwarranted second-class status.\n\nCurrently, #bold #green [GetPlayer.MakeScope.Var('grefm_samos_loyalist_jews_var').GetValue]%#!#! of our #yellow Sephardic#! [Concept('concept_pop','$concept_pops$')] are [concept_loyalist] while #bold #red [GetPlayer.MakeScope.Var('grefm_samos_radical_jews_var').GetValue]%#!#! of our #yellow Sephardic#! [Concept('concept_pop','$concept_pops$')] are [concept_radical]."
 je_grefm_ion_jewry_complete_tt1: "The total [concept_timed_modifier] for #yellow Sephardic#! [Concept('concept_pop','$concept_pops$')] [concept_sol] is #bold #green +4#! or greater#!."
 je_grefm_ion_jewry_complete_tt2: "Over #bold #green 75%#!#! of our #yellow Sephardic#! [Concept('concept_pop','$concept_pops$')] are [Concept('concept_loyalist','$concept_loyal$')]."
 je_grefm_ion_jewry_fail_tt: "Over #bold #red 75%#!#! of our #yellow Sephardic#! [Concept('concept_pop','$concept_pops$')] are [concept_radical]."

 # Journal Entry Lobby Text
 je_grefm_ion_xenocracy_lobby: "$gbbf_journal_lobby$\nUnder the auspices of the High Commissioner, Philhellenes across the Empire seek to model the islands into an ideal colony, in line with $GBR_ADJ$ successes across their realm."

