 # Notifications
 notification_notification_grefm_steady_progress_name: "Excavation Proceeding Smoothly"
 notification_notification_grefm_steady_progress_desc: "Lead engineers have reported that the ongoing excavation project had proceeded more quickly than expected. The supervising Ephor has indicated that the project is now slated to finish #bold #green 2 months#!#! earlier than expected."
 notification_notification_grefm_minor_collapse_name: "Mudslide at the Excavation Site"
 notification_notification_grefm_minor_collapse_desc: "Local papers have reported a minor mudslide at the excavation site. Engineers have blamed unusually high amounts of precipitation. The excavation has been set back by #bold #red 4 months#!#!."
 notification_notification_grefm_major_collapse_name: "Disaster at the Excavation Site!"
 notification_notification_grefm_major_collapse_desc: "Multiple reports have arrived of a massive mudslide and structural collapse that has claimed the lives of dozens of laborers and has buried most of the site under the earth once more. The excavation will be The excavation has been set back by #bold #red 12 months#!#!."
 notification_notification_grefm_popular_interest_name: "Popular Interest in Excavation"
 notification_notification_grefm_popular_interest_desc: "Growing crowds have been sighted in the areas surrounding the excavation project. Both children and adults alike have been turning up to gawk at the spectacle. Some have even joined in to aid our laborers."
 notification_notification_grefm_palace_discovered_name: "Palace Uncovered at Dig Sit"
 notification_notification_grefm_palace_discovered_desc: "Engineers at the excavation site have uncovered a series of old foundations that have been tentatively labeled as the court of an ancient aristocratic ruler. The first of what is expected to be a large number of ancient artifacts has already arrived at the Archaeological Society's offices."

 # Scripted Buttons
 grefm_embrace_hellenic_identity_button: "Embrace Hellenic Identity"
 grefm_embrace_hellenic_identity_button_desc: "The [GetCulture('greek').GetName] movement is the only means we have to truly unify [ROOT.GetCountry.GetName] under a single identity. We should embrace our truly ancient roots."
 grefm_embrace_roman_identity_button: "Embrace Roman Identity"
 grefm_embrace_roman_identity_button_desc: "The [GetCulture('rhomaios').GetName] movement represents the inherited legacy of the Greek people. We cannot deny our Roman identity."
 grefm_embrace_hybrid_identity_button: "Embrace Hybrid Identity"
 grefm_embrace_hybrid_identity_button_desc: "The [GetCulture('greek').GetName] and [GetCulture('rhomaios').GetName] movements are but two halves of a singular identity. We cannot deny that to be $greek_cultures$ is to embrace both our Ancient Greek and Greco-Roman roots."
 grefm_declare_national_language_button: "Declare National Language"
 grefm_declare_national_language_button_desc: "The linguistic question has hounded the question of Greek identity since before the Revolution. While we may not have the institutions to enforce a nationwide language yet, we can declare our intent for the Greek Language."

 grefm_mega_palation_button: "Survey the Palace Ruins"
 grefm_mega_palation_button_desc: "The Imperial Palace, the Méga Palátion, lies in ruin, yet it may be possible to restore large portions of it."
 grefm_hippodrome_button: "Survey the Hippodrome"
 grefm_hippodrome_button_desc: "The Hippodrome served as a site for popular entertainment for centuries. While ruined, it's restoration is within the realm of possibility."
 grefm_mega_palation_survey_button: "Survey the Imperial Palace Ruins"
 grefm_mega_palation_survey_button_desc: "With the restoration of Constantinople as the seat of Byzantine authority, a movement has developed to survey the site of the old Great Palace that once served as the seat of imperial power. Only a few ruins halls and fragments of its foundations have survived into the present day."


