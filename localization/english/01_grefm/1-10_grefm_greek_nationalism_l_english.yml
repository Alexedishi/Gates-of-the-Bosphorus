l_english:
 # Journal Entry Groups
 je_group_grefm_nationalism: "Greek Nationalism"

 # Journal Entries
 je_grefm_greek_nationalism: "Greek Nationalism"
 je_grefm_greek_nationalism_reason: "While the $greek_cultures$ people have existed for millennia, never has a truly Greek state ever come into existence. From the Greek city-states of antiquity through the multi-ethnic Roman and Ottoman Empires, the Greek communities have never beheld a state that they valued over their own home villages and regions. Spearheaded by Enlightenment thought, two opposing movements have emerged, each seeking to unite the Greek people under a truly common identity.\n\nThe [GetCulture('greek').GetName] movement, spearheaded by Philhellene thinkers in Western Europe and America, argue that the Greek people are inheritors of the Bronze and Iron Age Greek culture and thus are the scions of the forefathers of Western Civilization. Hellenist supporters discard the Roman and Ottoman eras as a "Dark Age" during which Greek culture was dormant and suppressed.\n\nThe [GetCulture('rhomaios').GetName] identity represents the continuous experience of the Greek people with an unquestioned link from Greco-Roman to modern times, during which the Greek culture has evolved and grown under Roman, Slavic, and Turkish influences.\n$TOOLTIP_DELIMITER$\n•The [GetCulture('greek').GetName] movement has #tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_greek_nationalism_hellenism_breakdown [GetPlayer.MakeScope.Var('grefm_hellene_culture_var').GetValue]#! support from #bold #tooltippable #tooltip:[GetRawTextTooltipTag('je_grefm_greek_nationalism_hellenism_factors')] its factors#!#!#!.\n•The [GetCulture('rhomaios').GetName] movement has #tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_greek_nationalism_romanism_breakdown [GetPlayer.MakeScope.Var('grefm_rhomaios_culture_var').GetValue]#! support from #bold #tooltippable #tooltip:[GetRawTextTooltipTag('je_grefm_greek_nationalism_romanism_factors')] its factors#!#!#!."
 je_grefm_greek_nationalism_complete: "[ROOT.GetCountry.GetNameNoFlag] has embraced a national identity"
 je_grefm_greek_nationalism_hellenism_breakdown: "[Country.MakeScope.GetScriptValueDesc('grefm_hellenism_value')]"
 je_grefm_greek_nationalism_romanism_breakdown: "[Country.MakeScope.GetScriptValueDesc('grefm_romanism_value')]"
 je_grefm_greek_nationalism_hellenism_factors: "The following factors will contribute support for #yellow Hellenism#!:\n•Having [GetCulture('greek').GetName] as one of our [concept_primary_cultures] (#bold #green +1#!#!)\n•The [concept_literacy] of our [GetCulture('greek').GetName] [concept_pop]#o s#! (#bold #green +1 per 10%#!#!)\n•Adopting #bold #purple Katharevousa#!#! as our national dialect (#bold #green +2#!#!)\n•Adopting #bold #greece Dimotikí#!#! as our national dialect (#bold #green +1#!#!)\n•Completing [GetCulture('greek').GetName] archaeological excavations (#bold #green +1 per site#!#!)\n•Having a [GetCulture('greek').GetName]-[concept_culture] [concept_ruler] (#bold #green +2#!#!)"
 je_grefm_greek_nationalism_romanism_factors: "The following factors will contribute support for #yellow Romanism#!:\n•Having [GetCulture('rhomaios').GetName] as one of our [concept_primary_cultures] (#bold #green +1#!#!)\n•The [concept_literacy] of our [GetCulture('rhomaios').GetName] [concept_pop]#o s#! (#bold #green +1 per 10%#!#!)\n•Adopting #bold #green Rhomaίika#!#! as our national dialect (#bold #green +2#!#!)\n•Adopting #bold #white Khoine#!#! as our national dialect (#bold #green +1#!#!)\n•Completing [GetCulture('rhomaios').GetName] archaeological excavations (#bold #green +1 per site#!#!)\n•Having a [GetCulture('rhomaios').GetName]-[concept_culture] [concept_ruler] (#bold #green +2#!#!)"
 je_grefm_national_language: "A National Language"
 je_grefm_national_language_reason: "Separated by time, distance, and empires, the greater Greek populations have each diverged from the Greek languages that were spoken during the pre-Ottoman times. Scholars today have been engaged in a deep argument whether the Turkic intrusions into the Greek language, or any deviation from Koine Greek, should be tolerated at all.\n$TOOLTIP_DELIMITER$\n@information!Supporting #bold #greece Demotic#!#! or #bold #purple Katharevousa#!#! will increase our tilt towards #bold Hellenism#!. Supporting #bold #yellow Khoine#!#! or #bold #green Rhomaίika#!#! will increase our tilt towards #bold Romanism#!."
 je_grefm_national_language_complete: "[ROOT.GetCountry.GetNameNoFlag] has declared a National Dialect"

 je_grefm_archaeology: "Greek Cultural Roots"
 je_grefm_archaeology_reason: "The $greek_cultures$ people have had a presence across the Aegean since pre-historic times. In the contest over defining the roots of the Greek people, the Archaeological Service has been tasked with unearthing artifacts and ruins to prove the legacy of the Greek people and justify their claims to the region.\n$TOOLTIP_DELIMITER$\n@information!Every [GetCulture('greek').GetName] site that we excavate will contribute towards support for #bold Hellenism#!. Likewise, every [GetCulture('rhomaios').GetName] site will contribute support towards #bold Romanism#!.\n$TOOLTIP_DELIMITER$\nWe have excavated #bold #greece [GetPlayer.MakeScope.Var('grefm_hellenic_archeaology_var').GetValue]#!#! [GetCulture('greek').GetName] sites.\nWe have excavated #bold #greece [GetPlayer.MakeScope.Var('grefm_roman_archeaology_var').GetValue]#!#! [GetCulture('rhomaios').GetName] sites."
 je_grefm_archaeology_complete: "Complete all excavations"
 je_grefm_archaeology_status: "Excavation progress: #bold #greece [GetPlayer.MakeScope.Var('grefm_excavation_var').GetValue]#!/24#!"

