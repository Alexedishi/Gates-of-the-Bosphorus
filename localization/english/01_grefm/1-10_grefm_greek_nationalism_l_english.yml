 grefm_identity: "@gbbf_identity! #o #tooltip:[GetPlayer.GetTooltipTag],grefm_identity_desc Identity#!#!"
 grefm_identity_desc: "@gbbf_identity! #header Greek Identity#!\n$TOOLTIP_DELIMITER$\n From their arrival in the [GetStrategicRegion('region_balkans').GetName] in prehistory and through various rulers and empires, the $grefm_greek$ people have never experienced a singular, unified cultural identity that they have valued over their own villages and tribes. Inspired by thinkers in Western Europe amd North America, a grand vision has been crafted of a [GetCulture('greek').GetName] nation that has persisted since the times of Ancient Greece. This has found many detractors amongst the $grefm_greeks$ still living within the Ottoman Empire, who have, as far as they are concerned, always been the [GetCulture('rhomaios').GetName] people, both during and since the fall of the Byzantine Empire."
 grefm_identities: "@gbbf_identity! #o #tooltip:[GetPlayer.GetTooltipTag],grefm_identity_desc Identities#!#!"
 grefm_national_identity: "@gbbf_identity! #o #tooltip:[GetPlayer.GetTooltipTag],grefm_identity_desc National Identity#!#!"

 grefm_dialect: "@gbbf_dialect! #o #tooltip:[GetPlayer.GetTooltipTag],grefm_dialect_desc Dialect#!#!"
 grefm_dialect_desc: "@gbbf_dialect! #header Greek Dialect#!\n$TOOLTIP_DELIMITER$\nIn pre-Islamic times, the Greek language existed in a continuum reaching from the shores of the Adriatic to the Levant. Gradual encroachment from both Arab and Turkic polities has slowly fragmented the Greek language space, resulting in several #bold dialects#! with varying degrees of mutual intelligibility.\n$TOOLTIP_DELIMITER$\n •$grefm_dialect_demotic$ is spoken across the Aegean as remains the last unbroken dialect continuum in the Greek world.\n •$grefm_dialect_katharevousa$ is a constructed version of Greek created with the intent of "purifying" the language from Turkic and other "foreign" influences.\n •$grefm_dialect_khoine$ is the liturgical dialect of Greek remaining in widespread use in the Orthodox Church representing Medieval form of Greek.\n •$grefm_dialect_rhomaiika$ encompasses a series of dialects spoken in Greek communities across Anatolia."
 grefm_national_dialect: "@gbbf_dialect! #o #tooltip:[GetPlayer.GetTooltipTag],grefm_dialect_desc National Dialect#!#!"
 grefm_dialects: "@gbbf_dialect! #o #tooltip:[GetPlayer.GetTooltipTag],grefm_dialect_desc Dialects#!#!"
 grefm_dialect_demotic: "#bold #greece Dimotikí#!#!"
 grefm_dialect_katharevousa: "#bold #purple Katharevousa#!#!"
 grefm_dialect_khoine: "#bold #yellow Khoine#!#!"
 grefm_dialect_rhomaiika: "#bold #green Rhomaίika#!#!"
 
