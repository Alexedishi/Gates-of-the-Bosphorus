 # Notifications
 notification_notification_grefm_steady_progress_name: "Excavation Proceeding Smoothly"
 notification_notification_grefm_steady_progress_desc: "Lead engineers have reported that the ongoing excavation project had proceeded more quickly than expected. The supervising Ephor has indicated that the project is now slated to finish #bold #green 2 months#!#! earlier than expected."
 notification_notification_grefm_minor_collapse_name: "Mudslide at the Excavation Site"
 notification_notification_grefm_minor_collapse_desc: "Local papers have reported a minor mudslide at the excavation site. Engineers have blamed unusually high amounts of precipitation. The excavation has been set back by #bold #red 4 months#!#!."
 notification_notification_grefm_major_collapse_name: "Disaster at the Excavation Site!"
 notification_notification_grefm_major_collapse_desc: "Multiple reports have arrived of a massive mudslide and structural collapse that has claimed the lives of dozens of laborers and has buried most of the site under the earth once more. The excavation will be The excavation has been set back by #bold #red 12 months#!#!."
 notification_notification_grefm_popular_interest_name: "Popular Interest in Excavation"
 notification_notification_grefm_popular_interest_desc: "Growing crowds have been sighted in the areas surrounding the excavation project. Both children and adults alike have been turning up to gawk at the spectacle. Some have even joined in to aid our laborers."
 notification_notification_grefm_palace_discovered_name: "Palace Uncovered at Dig Sit"
 notification_notification_grefm_palace_discovered_desc: "Engineers at the excavation site have uncovered a series of old foundations that have been tentatively labeled as the court of an ancient aristocratic ruler. The first of what is expected to be a large number of ancient artifacts has already arrived at the Archaeological Society's offices."

 # Scripted Buttons
 grefm_embrace_hellenic_identity_button: "Embrace Hellenic Identity"
 grefm_embrace_hellenic_identity_button_desc: "The [GetCulture('greek').GetName] movement is the only means we have to truly unify [ROOT.GetCountry.GetName] under a single identity. We should embrace our truly ancient roots."
 grefm_embrace_hellenic_identity_button_possible: "The [GetCulture('greek').GetName] [concept_culture] has #bold 10#! support"
 grefm_embrace_roman_identity_button: "Embrace Roman Identity"
 grefm_embrace_roman_identity_button_desc: "The [GetCulture('rhomaios').GetName] movement represents the inherited legacy of the Greek people. We cannot deny our Roman identity."
 grefm_embrace_roman_identity_button_possible: "The [GetCulture('rhomaios').GetName] [concept_culture] has #bold 10#! support"
 grefm_embrace_hybrid_identity_button: "Embrace Hybrid Identity"
 grefm_embrace_hybrid_identity_button_desc: "The [GetCulture('greek').GetName] and [GetCulture('rhomaios').GetName] movements are but two halves of a singular identity. We cannot deny that to be $grefm_greek$ is to embrace both our Ancient Greek and Greco-Roman roots."

 grefm_declare_national_language_button: "Declare National Language"
 grefm_declare_national_language_button_desc: "The linguistic question has hounded the question of Greek identity since before the Revolution. While we may not have the institutions to enforce a nationwide language yet, we can declare our intent for the Greek Language."
 grefm_declare_national_language_button_possible: "Any Greek dialect has at least #bold 100#! support."

 grefm_mega_palation_button: "Survey the Palace Ruins"
 grefm_mega_palation_button_desc: "The Imperial Palace, the Méga Palátion, lies in ruin, yet it may be possible to restore large portions of it."
 grefm_hippodrome_button: "Survey the Hippodrome"
 grefm_hippodrome_button_desc: "The Hippodrome served as a site for popular entertainment for centuries. While ruined, it's restoration is within the realm of possibility."
 grefm_mega_palation_survey_button: "Survey the Imperial Palace Ruins"
 grefm_mega_palation_survey_button_desc: "With the restoration of Constantinople as the seat of Byzantine authority, a movement has developed to survey the site of the old Great Palace that once served as the seat of imperial power. Only a few ruins halls and fragments of its foundations have survived into the present day."
 
 grefm_greek_sites_button: "Show Hellenic Sites"
 grefm_greek_sites_button_desc: "Ruins of Ancient Greek are littered across the Aegean. Every excavation we complete of a Hellenic site will #bold increase#! our tilt towards a Hellenic national identity."
 grefm_greek_sites_effect: "This will toggle showing Hellenic Excavation sites"
 
 grefm_roman_sites_button: "Show Roman Sites"
 grefm_roman_sites_button_desc: "The remains of the Roman Empire are so integral to our existence, that many structures remain in use to this day with their original purposes long forgotten. Every excavation we complete of a Roman site will #bold increase#! our tilt towards a Roman national identity."
 grefm_roman_sites_effect: "This will toggle showing Roman Excavation sites"
 
 grefm_alternate_sites_button: "Consider Alternate Sites"
 grefm_alternate_sites_button_desc: "Presently, our scholars are singularly focused on the excavation of sites from one specific era. We could direct expansion of the field of research to include both the Ancient and Medieval eras, despite widespread opposition from academics."
 grefm_cancel_dig_button: "Cancel Current Expedition"
 grefm_cancel_dig_button_desc: "This will cancel the current excavation. All progress will be lost."
 
 grefm_parthenon_button_1: "Survey the Acropolis"
 grefm_parthenon_button_1_desc: "Towering over the city of Athens, the ancient acropolis, once called the #bold Cecropia#!, lay at the heart of the Athenian city-state. Today the site lays in ruins having decayed after millennia of neglect. Ephors of the archaeological service clamor for a proper study of the site."
 grefm_parthenon_button_2: "Excavate the Parthenon"
 grefm_parthenon_button_2_desc: "Between damages during Morean War and the later construction of an Ottoman mosque, the structure of the Parthenon exists as a skeleton of its former glory. Despite this, ephors feel that a partial restoration should be possible with modern industrial techniques."
 grefm_mycenae_button_1: "Explore Knossos"
 grefm_mycenae_button_1_desc: "The academic mainstream has long suspected that the island of Crete played a pivotal role in the ancient Minoan Civilization. Amateur excavations by Minos Kalokairinos have proven the existence of a Bronze Age palace, but interference by the Turkish administration has hampered formal studies on the island."
 grefm_mycenae_button_2: "Excavate the Minoan Palace"
 grefm_mycenae_button_2_desc: "With the identification of the palace site, scholars have come forward to push for a full excavation and restoration of the sprawling complex."
 grefm_gla_button: "Survey the citadel of Gla"
 grefm_gla_button_desc: "As water levels in Lake Kopais have receded, a small island at its heart has been identified as a large fortification dating back to Greek pre-history. As the water levels continue to recede, some ephors have pushed to set up an expedition to the site."
 grefm_delos_button: "Survey the island of Delos"
 grefm_delos_button_desc: "Effectively abandoned since the late eight century, the island of Delos was one of the centers of ancient Greek mythology. Dotted by countless ruins, several ephors argue this site will prove essential to displaying the cosmopolitan nature of ancient Greece and its standing within the Mediterranean."
 grefm_larissa_button: "Survey the ruins in Larissa"
 grefm_larissa_button_desc: "Larissa, one of the largest cities in [ROOT.GetCountry.GetName], is built atop several ruins from pre-modern Greece with some in continued use. Local scholars and engineers have reported uncovering numerous sites as the city begins to expand."
 grefm_rhodes_button: "Survey the ruins on Rhodes"
 grefm_rhodes_button_desc: "Located at the eastern edge of the Greek Islands, Rhodes was once a powerhouse in both political and maritime influence. Academics have long known of the wealth of cultural history strewn across the island."
 
 grefm_archeaology_corinth_button_1: "Excavate the Hexamilion Wall"
 grefm_archeaology_corinth_button_1_desc: "First built during the reign of Theodosius II, the Hexamilion Wall represents the first coordinated attempt to secure the Peloponnese from northerly invasions. While now abandoned, the sprawling structure was maintained through to the early Byzantine era."
 grefm_archeaology_corinth_button_2: "Explore the Acrocorinth"
 grefm_archeaology_corinth_button_2_desc: "Built atop a hill overlooking Corinth, the Acrocorinth took on an important role in the Byzantine era when it evolved into the seat of the Thema of Hellas."
 grefm_archeaology_thessaloniki_button: "Detail the ruins in Thessaloniki"
 grefm_archeaology_thessaloniki_button_desc: "Built deep within the ancient core of Thessaloniki, the Heptapyrgion was transformed into a massive citadel under the orders of the Emperor Theodosius. Following the Ottoman conquest, it would go to to serve as a prison."
 grefm_archeaology_thebes_button: "Survey the workshops of Thebes"
 grefm_archeaology_thebes_button_desc: "Thebes was once the core of Byzantine silk production. Ephors have suggested that the ruins of this massive industry are likely scattered throughout the modern city."
 grefm_archeaology_nicomedia_button: "Excavate the ruins of Nicomedia"
 grefm_archeaology_nicomedia_button_desc: "Buried under the modern city of Izmit, the ruins of Nicomedia form the foundations of the modern city."
 grefm_archeaology_smyrna_button: "Survey the ruins in Smyrna"
 grefm_archeaology_smyrna_button_desc: "While the ancient settlement of Smyrna dates back to Ancient Greece, the city came to prominence during the Roman era, with ephors noting several phases of raiding, decline, and regrowth over its centuries of Roman existence."
 grefm_archeaology_tyana_button: "Excavate the ruins of Tyana"
 grefm_archeaology_tyana_button_desc: "The ruins of Tyana are extensive and showcase several eras of Roman rule, from its development into a major center of Roman influence in the East to its later role as a frontier city during the Byzantine era."
 grefm_archeaology_chios_button: "Catalog the island of Chios"
 grefm_archeaology_chios_button_desc: "Chios has been a center of Greek culture for millennia. The island has a storied history having changed hands between Roman, Byzantine, Genoese, and Ottoman control over its long history."
 
