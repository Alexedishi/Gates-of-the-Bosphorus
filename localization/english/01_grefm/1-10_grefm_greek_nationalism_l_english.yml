l_english:
 # Journal Entries
 je_grefm_greek_nationalism: "Greek Nationalism"
 je_grefm_greek_nationalism_reason: "$je_grefm_greek_nationalism_flavor$\n$TOOLTIP_DELIMITER$\n$je_grefm_greek_nationalism_details$"
 je_grefm_greek_nationalism_flavor: "The [GetCulture('greek').GetName] $grefm_identity$, spearheaded by Philhellene thinkers in Western Europe and America, argue that the Greek people are inheritors of the Bronze and Iron Age Greek culture and thus are the scions of the forefathers of Western Civilization. Hellenist supporters discard the Roman and Ottoman eras as a "Dark Age" during which Greek culture was dormant and suppressed. Meanwhile, the [GetCulture('rhomaios').GetName] $grefm_identity$ represents the continuous experience of the Greek people with an unquestioned link from Greco-Roman to modern times, during which the Greek culture has evolved and grown under Roman, Slavic, and Turkish influences."
 je_grefm_greek_nationalism_details: "#white • The [GetCulture('greek').GetName] $grefm_identity$ has #tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_greek_nationalism_hellenism_breakdown [GetPlayer.MakeScope.Var('grefm_hellene_culture_var').GetValue]#! support from #bold #tooltippable #tooltip:[GetRawTextTooltipTag('je_grefm_greek_nationalism_hellenism_factors')] its factors#!#!#!.\n• The [GetCulture('rhomaios').GetName] $grefm_identity$ has #tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_greek_nationalism_romanism_breakdown [GetPlayer.MakeScope.Var('grefm_rhomaios_culture_var').GetValue]#! support from #bold #tooltippable #tooltip:[GetRawTextTooltipTag('je_grefm_greek_nationalism_romanism_factors')] its factors#!#!#!#!."
 je_grefm_greek_nationalism_complete: "[ROOT.GetCountry.GetNameNoFlag] has embraced a $grefm_national_identity$"
 je_grefm_greek_nationalism_hellenism_breakdown: "[Country.MakeScope.GetScriptValueDesc('grefm_hellenism_value')]"
 je_grefm_greek_nationalism_romanism_breakdown: "[Country.MakeScope.GetScriptValueDesc('grefm_romanism_value')]"
 je_grefm_greek_nationalism_hellenism_factors: "The following factors will contribute support for the [GetCulture('greek').GetName] $grefm_identity$:\n•Having [GetCulture('greek').GetName] as one of our [concept_primary_cultures] (#bold #green +1#!#!)\n•The [concept_literacy] of our [GetCulture('greek').GetName] [Concept('concept_pop','$concept_pops$')] (#bold #green +1 per 10%#!#!)\n•Adopting $grefm_dialect_katharevousa$ as our $grefm_national_dialect$ (#bold #green +2#!#!)\n•Adopting $grefm_dialect_demotic$ as our $grefm_national_dialect$ (#bold #green +1#!#!)\n•Completing [GetCulture('greek').GetName] archaeological excavations (#bold #green +1 per site#!#!)\n•Having a [GetCulture('greek').GetName]-[concept_culture] [concept_ruler] (#bold #green +2#!#!)"
 je_grefm_greek_nationalism_romanism_factors: "The following factors will contribute support for the [GetCulture('rhomaios').GetName] $grefm_identity$:\n•Having [GetCulture('rhomaios').GetName] as one of our [concept_primary_cultures] (#bold #green +1#!#!)\n•The [concept_literacy] of our [GetCulture('rhomaios').GetName] [Concept('concept_pop','$concept_pops$')] (#bold #green +1 per 10%#!#!)\n•Adopting $grefm_dialect_rhomaiika$ as our $grefm_national_dialect$ (#bold #green +2#!#!)\n•Adopting $grefm_dialect_khoine$ as our $grefm_national_dialect$ (#bold #green +1#!#!)\n•Completing [GetCulture('rhomaios').GetName] archaeological excavations (#bold #green +1 per site#!#!)\n•Having a [GetCulture('rhomaios').GetName]-[concept_culture] [concept_ruler] (#bold #green +2#!#!)"
 je_grefm_greek_nationalism_ethostate: "If completed by having [GetLawType('law_ethnostate').GetName] enacted, [ROOT.GetCountry.GetNameNoFlag] will adopt the $grefm_national_identity$ of its current [concept_primary_cultures]"
 je_grefm_greek_nationalism_multicultural: "If completed by having [GetLawType('law_multicultural').GetName] enacted, [ROOT.GetCountry.GetNameNoFlag] will adopt a hybrid $grefm_national_identity$"
 
 je_grefm_archaeology: "Greek Cultural Roots"
 je_grefm_archaeology_reason: "The $grefm_greek$ people have had a presence across the Aegean since pre-historic times. In the contest over defining the roots of the Greek people, the Archaeological Service has been tasked with unearthing artifacts and ruins to prove the legacy of the Greek people and justify their claims to the region.$gbbf_linebreak_normal$[GetPlayer.GetCustom('grefm_archaeology_body_type')]"
 je_grefm_archaeology_base: "@information!Every [GetCulture('greek').GetName] site that we excavate will contribute towards support for #bold Hellenism#!. Likewise, every [GetCulture('rhomaios').GetName] site will contribute support towards #bold Romanism#!.\n$TOOLTIP_DELIMITER$\nWe have excavated #bold #greece [GetPlayer.MakeScope.Var('grefm_hellenic_archeaology_var').GetValue]#!#! [GetCulture('greek').GetName] sites.\nWe have excavated #bold #greece [GetPlayer.MakeScope.Var('grefm_roman_archeaology_var').GetValue]#!#! [GetCulture('rhomaios').GetName] sites."
 je_grefm_archaeology_mgr: "@information!Every #bold Aegean Artifact#! that we excavate will contribute towards support for #bold Hellenism#!. Likewise, every #bold Local Artifact#! will contribute support towards #bold Romanism#!.$gbbf_linebreak_normal$Thus far, [ROOT.GetCountry.GetNameNoFlag] has excavated:\n • #bold #greece [GetPlayer.MakeScope.Var('lepsius_aegean_artifact_minor').GetValue]#!#! $grefm_artifacts_aegean_minor$\n • #bold #greece [GetPlayer.MakeScope.Var('lepsius_aegean_artifact_major').GetValue]#!#! $grefm_artifacts_aegean_major$\n • #bold #greece [GetPlayer.MakeScope.Var('lepsius_local_artifact_minor').GetValue]#!#! $grefm_artifacts_local_minor$\n • #bold #greece [GetPlayer.MakeScope.Var('lepsius_local_artifact_major').GetValue]#!#! $grefm_artifacts_local_major$."
 je_grefm_archaeology_complete: "[ROOT.GetCountry.GetNameNoFlag] has completed all excavations"
 je_grefm_archaeology_status: "Excavation progress: #bold #greece [GetPlayer.MakeScope.Var('grefm_excavation_var').GetValue]#!/16#!"
 je_grefm_archaeology_complete_mgr: "[ROOT.GetCountry.GetNameNoFlag] has gathered over #v 100#! artifacts"

 je_grefm_national_language: "A National Language"
 je_grefm_national_language_reason: "Separated by time, distance, and empires, the many $grefm_greek$ populations have each diverged from the Greek languages that were spoken during the pre-Ottoman times resulting in several $grefm_dialects$ of Greek. Scholars today have been engaged in a deep argument whether the Turkic intrusions into the Greek language, or any deviation from Koine Greek, should be tolerated at all.\n$TOOLTIP_DELIMITER$\n@information!Supporting $demotic$ or $grefm_dialect_katharevousa$ will increase our tilt towards #bold Hellenism#!. Supporting $grefm_dialect_khoine$ or $grefm_dialect_rhomaiika$ will increase our tilt towards #bold Romanism#!."
 je_grefm_national_language_complete: "[ROOT.GetCountry.GetNameNoFlag] has declared a $grefm_national_dialect$"
 je_grefm_national_language_complete_mgr: "[ROOT.GetCountry.GetNameNoFlag] has #v 50 or more#! $grefm_literary_tradition$"

 # Journal Entry Lobby Text
 je_grefm_greek_nationalism_lobby: "$gbbf_journal_lobby$\nFrom the Greek city-states of antiquity through the multi-ethnic Roman and Ottoman Empires, the Greek communities have never beheld a state that they valued over their own home villages and regions. Spearheaded by Enlightenment thought, two opposing movements have emerged, each seeking to unite the Greek people under a truly common identity."

