l_english:

 grefm_byzantium.010.t: "The 14 Regions of Constantinople"
 grefm_byzantium.010.d: "Constantinople suffered serious decline and depopulation in the decades after the Ottoman conquest. While the city has grown considerably in the last century, this has come at the cost of slums expanding outward beyond the ancient heart of the city. Byzantophile leaders have urged the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to lead"
 grefm_byzantium.010.f: "\"Indeed, the length of the city from the golden gate to the seashore in a direct line is fourteen thousand seventy-five feet, and the breadth six thousand one hundred and fifty feet.\" -Notitia Urbis Constantinopolitanae, mid-5th century"
 grefm_byzantium.010.a: "We will rebuild the Queen of Cities."
 grefm_byzantium.011.t: "Imperial Palace Ruins Identified"
 grefm_byzantium.011.d: "Our engineers' detailed survey has finally been completed and our experts believe the restoration of the Megas Palation, while audacious, is possible. Presently, only the Boukoleon Palace stands as a ruin and several Ottoman structures exist over the site. This will be a taxing effort for the state."
 grefm_byzantium.011.f: "\"We rode all along the shore to the palace of Bucoleon, and when he arrived there it surrendered, on condition that the lives of all therein should be spared. At Bucoleon were found the larger number of the great ladies who had fled to the castle, for there were found the sister of the King of France, who had been empress, and the sister of the King of Hungary, who had also been empress, and other ladies very many. Of the treasure that was found in that palace I cannot well speak, for there was so much that it was beyond end or counting.\" -Geoffrey of Villehardouin, 1204, following the capture of the palace by Boniface of Montferrat"
 grefm_byzantium.011.a: "All for the Glory of Byzantium."
 grefm_byzantium.012.t: "Great Palace of Constantinople"
 grefm_byzantium.012.d: "The Great Palace of Constantinople served as the main imperial residence of the Eastern Roman or Byzantine emperors until 1081 and was the center of imperial administration for over 690 years. The restored seat of the Eastern Roman Empire once again looms over Constantinople, evoking the legacy of Constantine and Justinian."
 grefm_byzantium.012.f: "\"No other place in the empire - or perhaps the world - dripped so extravagantly in gold or boasted so magnificent a display of wealth. Behind the massive golden throne were trees made of hammered gold and silver, complete with jewel-encrusted mechanical birds that would burst into song at the touch of a lever. Wound around the base of the tree were golden lions and griffins staring menacingly from beside each armrest, looking as if they could spring up at any moment."\"
 grefm_byzantium.012.a: "All for the Glory of Byzantium."
 grefm_byzantium.012.tt: "[ROOT.GetCountry.GetNameNoFlag] may now expand the reconstruction by rebuilding the #bold Hippodrome#!."
 grefm_byzantium.013.t: "The Hippodrome of Constantinople"
 grefm_byzantium.013.d: "Following months of meticulous work, the Hippodrome has been rebuilt. With a new track, new stands, and redecorated spina, it now stands ready for the people."
 grefm_byzantium.013.f: "In the times of the Roman Emperors, the circus at Constantinople, known as the Hippodrome, once held grandiose chariot races for the masses. Even though it has been over a millennium since the last true chariot race was hosted here, with the track, spina, and seating restored, it may be possible to revive this ancient tradition."
 grefm_byzantium.013.a: "Open the Gates!"
 grefm_byzantium.013.tt: "[ROOT.GetCountry.GetNameNoFlag] may now take a decision to revive Chariot Racing."
 grefm_byzantium.014.t: "Notitia Urbis Constantinopolitanae"
 grefm_byzantium.014.d: "Our years of labor and industry have transformed Constantinople from a city locked in a feudal past into a renewed metropolis in the East. Truly, no other city deserves the title "Queen of Cities" more than the heart of the Greek world."
 grefm_byzantium.014.f: "For centuries, Constantinople served as the cradle of Eastern Christianity. Now, the restored city has become a beacon heralding the birth of a new Empire."
 grefm_byzantium.014.a: "Byzantium is Eternal."

 grefm_byzantium.020.t: "#dummy grefm_byzantium.020.t#!"
 grefm_byzantium.020.d: "#dummy grefm_byzantium.020.d#!"
 grefm_byzantium.020.f: "#dummy grefm_byzantium.020.f#!"
 grefm_byzantium.020.a: "#dummy grefm_byzantium.020.a#!"
 grefm_byzantium.021.t: "Chariot Racing Re-established"
 grefm_byzantium.021.d: "By imperial decree, the ancient institution of chariot racing will be re-established. Set to a four-year schedule, these races will be open to both citizens and tourists of the Queen of Cities."
 grefm_byzantium.021.f: "After training and tryouts, four teams have been formed: the #red Reds#!, #white Whites#!, #green Greens#!, and #blue Blues#! - each named for one of the ancient Roman chariot teams."
 grefm_byzantium.021.a: "Bring forth the chariots!"
 grefm_byzantium.022.t: "Chariot Racing Expanded"
 grefm_byzantium.022.d: "With the stroke of a pen, the Emperor has expanded the chariot races by two more teams."
 grefm_byzantium.022.f: "The two new teams have taken it upon themselves to resurrect the #gold Golds#! and the #purple Purples#!, two later Roman chariot teams."
 grefm_byzantium.022.a: "Glory to Byzantium!"
 grefm_byzantium.023.t: "A Day at the Races"
 grefm_byzantium.023.d: "Under the summer sun, the great racing factions lined up at the starting line of the great Hippodrome. The circus, packed to the brim with spectators, was alight with the cheers of fans and detractors alike. At the sound of the gun, the chariots flew across the track, each team urging their horses forward. In the end, the [GetPlayer.MakeScope.Var('grefm_chariot_race_var').GetFlagName] came out victorious."
 grefm_byzantium.023.f: "\"As the horses made turn after turn, the crowd roared and the ground trembled. It was as if the Queen of Cities itself had come to life.\""
 grefm_byzantium.023.a: "What a great display of Byzantine tradition."
 grefm_byzantium.024.t: "A Day at the Races - Diversum"
 grefm_byzantium.024.d: "Under the summer sun, the great racing factions lined up at the starting line of the great Hippodrome. The circus, packed to the brim with spectators, was alight with the cheers of fans and detractors alike. At the sound of the gun, the chariots flew across the track, each team urging their horses forward. In the end, no team could claim victory after the day's matches. The crowd has called for a #italic diversum#!, a tiebreaker match."
 grefm_byzantium.024.f: "\"As the horses made turn after turn, the crowd roared and the ground trembled. It was as if the Queen of Cities itself had come to life.\""
 grefm_byzantium.024.a: "We shall schedule the rematches."
 grefm_byzantium.024.b: "We will call it a draw."
 grefm_byzantium.025.t: "Sporting Riot"
 grefm_byzantium.025.d: "At this year's chariot races, a fight between rival fans has resulted in mayhem at the Hippodrome."
 grefm_byzantium.025.f: "Under the hot summer sun, a fell spirit swept across the Hippodrome as the teams lined up for the quadrennial races. As the teams withdrew to prepare for the final races, a scuffle broke out amongst the spectators. By the time the city police marched in to restore order, a riot developed that now threatens to spill into the streets."
 grefm_byzantium.025.a: "Evacuate the bystanders."
 grefm_byzantium.025.b: "Arrest these fanatics."
 grefm_byzantium.026.t: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] Attempts to Join Race"
 grefm_byzantium.026.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has been inspired to participate in this year's races."
 grefm_byzantium.026.f: "While definitely great entertainment for the masses, this might be a bit... beneath someone of the highest office of the land."
 grefm_byzantium.026.a: "Sounds like a sporting idea!"
 grefm_byzantium.026.b: "This is hardly acceptable for cultured men."
 grefm_byzantium.027.t: "Chariot Team Caught Cheating"
 grefm_byzantium.027.d: "The chariot team backed by the [SCOPE.gsInterestGroup('cheater_ig_scope').GetName] has been caught attempting to fix this year's race."
 grefm_byzantium.027.f: "An audit has uncovered an incredible level of corruption ranging from bribes to outright sabotage of racing equipment. Some sources hint that the course itself may be a target of mischief."
 grefm_byzantium.027.a: "Cancel the games and launch an investigation."
 grefm_byzantium.027.b: "Let them race, skill shall triumph over treachery."
 grefm_byzantium.028.t: "The Combustion Engine Takes the Hippodrome!"
 grefm_byzantium.028.d: "Crowds rushed to the Hippodrome today for an unprecedented sight:\nTo the deafening roar of automobile engines, the people witnessed several automobile enthusiasts careening around the circus, their drivers desperately clinging to their vehicles as they skipped around the packed soil surface of the track. Emblazoning their vehicles with brightly colored logos and sigils, the racers appear to have attempted to make this a motorized equivalent to the chariot race."
 grefm_byzantium.028.f: "Despite the lack of organized planning, these hooligans have taken to informal sports such as drag racing and power pulling. Several onlookers have even suggested that these sports be formalized, with the most idealistic even suggesting that smaller vehicles, perhaps derived from gas-driven lawnmowers, could take to the track. Elites, however, decry this dangerous activity and have voiced dismay at the risks of damaging the ancient circus."
 grefm_byzantium.028.a: "We should make this a regular thing!"
 grefm_byzantium.028.b: "Arrest these maniacs before they kill someone!"

 grefm_byzantium.030.t: "Reviving the Symphonίa"
 grefm_byzantium.030.d: "With the rebirth of the [ROOT.GetCountry.GetName] has come the dream of restoring the myriad institutions of the [ROOT.GetCountry.GetAdjectiveNoFormatting]. Among these is the concept of the "Symphonίa," once the unique balance that was struck between the apparatus of the Imperial state and that of the Church where the two were administratively inseparable, yet politically distinct."
 grefm_byzantium.030.f: "The Symphonίa was believed to have first come into existence during the reign of Justinian I who began to utilize state authority to enforce Canon Law. While not seen in the world today, many [GetIdeology('ideology_gbbf_symphonist_leader').GetName]#yellow s#! argue that if the Empire can be restored, so too can its ancient institutions."
 grefm_byzantium.030.a: "What is the Empire without the Faith?"