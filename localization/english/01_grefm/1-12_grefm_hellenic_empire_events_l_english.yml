l_english:
 grefm_greek_empire.001.t: "The Vergina Sun Rises"
 grefm_greek_empire.001.d: "Church bells ring and people cheer as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] declares the rebirth of the [ROOT.GetCountry.GetName]. Beneath the imposing presence of the [SCOPE.sBuilding('hagia_sofia_scope').GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been adorned with reconstructions of the old sigils and regalia of the Ancient Greek Kings of Old. Stepping forward towards the array of citizens, dignitaries, and clergy, [ROOT.GetCountry.GetRuler.GetFirstName] stands as a beacon for the future of the Greek people."
 grefm_greek_empire.001.f: "Where countless attempts failed over the centuries since the losses of Rome and Constantinople, the Empire stands resurgent today. However, much work remains: numerous Greeks are ruled by heretics and heathens, formerly Roman lands remain within the grasp of foreign pretenders, and countless Byzantine treasures are kept hostage abroad. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must be sure to live up to the expectations of [ROOT.GetCountry.GetRuler.GetHerHis] subjects if [ROOT.GetCountry.GetRuler.GetSheHe] is to bring glory to [ROOT.GetCountry.GetName]."
 grefm_greek_empire.001.a: "This is a new dawn."
 grefm_greek_empire.002.t: "The Revenge of the Greeks"
 grefm_greek_empire.002.d: "Our efforts have borne fruit with the rebirth of the [ROOT.GetCountry.GetName]. Now several voices call for the restoration of [ROOT.GetCountry.GetAdjectiveNoFormatting] power and prestige with the return of formerly Greek lands to the Hellenic State. It falls to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to determine the future of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state."
 grefm_greek_empire.002.f: ""The Kingdom of Greece is not Greece; it is merely a part: the smallest, poorest part of Greece. The Greek is not only he who inhabits the Kingdom, but also he who inhabits Ioannina, Salonika or Serres or Adrianople or Constantinople or Trebizond or Crete or Samos or any other region belonging to the Greek history or the Greek race... There are two great centres of Hellenism. Athens is the capital of the Kingdom. Constantinople is the great capital, the dream and hope of all Greeks." -I. Kolettis, 1844"
 grefm_greek_empire.002.a: "We will restore the glory of the [ROOT.GetCountry.GetName]."
 grefm_greek_empire.002.b: "We will limit ourselves to the Balkans."
 grefm_greek_empire.002.c: "We will limit ourselves to Anatolia."
 grefm_greek_empire.003.t: "The Shores of Phoenicia"
 grefm_greek_empire.003.d: "The ancient heartlands of the Greek people now lie in our control. Revanchist leaders in the [ROOT.GetCountry.GetAdjectiveNoFormatting] court call for the return of Egypt and the Levant, once strongholds of Christendom, into the Imperial fold."
 grefm_greek_empire.003.f: "Almost one thousand years ago, Basileus Isaac I Komnenos augustly led the Empire into an era of renewed might and glory. With the old heartlands reclaimed, the heart of the Eastern Roman Empire has been restored and the seat of the Orthodox Patriarch reinstated."
 grefm_greek_empire.003.a: "We will reclaim the Eastern Empire."
 grefm_greek_empire.003.b: "We have reclaimed the Greek heartlands. This is enough."
 grefm_greek_empire.004.t: "The Lands of Arianōn"
 grefm_greek_empire.004.d: "With our Eastern borders established, scholars and nationalists alike make calls for the expansion of Greek influence across formerly Greek lands in the Iranian plateau."
 grefm_greek_empire.004.f: "Before the explosive rise of Islam in the 600s and 700s, countless communities from the Tigris to the Indus counted themselves among Christendom, including the Ancient Church of the East and the Nestorian heretics. These communities have grown more and more fragmented since their isolation from the old seats of Christianity. Even longer before this, Greek kingdoms were scattered along the Iranian plateau along the Hindu Kush up and into the edges of Punjab."
 grefm_greek_empire.004.a: "Persia, Africa, Arabia... all will submit to Hellas."
 grefm_greek_empire.004.b: "We should count our blessings."
 grefm_greek_empire.005.t: "The Graveyard of Empires"
 grefm_greek_empire.005.d: "With the subjugation of Iran, a greater design has come into view: the reclamation of the lands held by Alexander the Great."
 grefm_greek_empire.005.f: "After the collapse of the Selucid Empire during the rise of the Roman Empire, several large Greek Kingdoms emerged across the Iranian plateau and Afghani lands in the Hindu Kush, which survived as far as the first century AD. Reminders of this survive to this day with placenames and the presence of minute, but resilient, Greek villages dotting the mountains."
 grefm_greek_empire.005.a: "We will make it so."
 grefm_greek_empire.006.t: "The Empire of the Greeks"
 grefm_greek_empire.006.d: "The Lands once conquered by Alexander the Great at the apex of hellenic influence are once again under Greek control. The Hellenistic Empire has reforged!"
 grefm_greek_empire.006.f: "While short-lived, Alexander's conquests represented the largest amount of land ever held under a single Greek ruler. Thanks to the valor of our armies and the steady hand of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName], we have reclaimed the mantle of the Empire."
 grefm_greek_empire.006.a: "The Hellenic Empire is Restored."
 grefm_greek_empire.007.t: "The Shores of the Hospitable Sea"
 grefm_greek_empire.007.d: "We are unchallenged in our control of the heartlands of Christendom. The last obstacle to our authority remains in the form of the Russian Orthodoxy, which still claims supremacy over the Eastern Church."
 grefm_greek_empire.007.f: "The [ROOT.GetCountry.GetName] once held sway over the Black Sea. Even today, communities of Orthodox Greeks dot its shores. Before setting our eyes on the usurpers to the north, we must first liberate our countrymen from the Slavic yoke."
 grefm_greek_empire.007.a: "Ready the fleet!"
 grefm_greek_empire.008.t: "The Lands of Magna Graecia"
 grefm_greek_empire.008.d: "As the Empire seeks to affirm it's legitimacy, nationalist leaders have begun to clamor for the return of Southern Italy to Greek hands as it was in the time before the Romans."
 grefm_greek_empire.008.f: "Southern Italy, once known as Magna Graecia to the Romans was home to several Greek colonies and hosted a unique fusion of Greek and Latin culture. Several Greek-speaking communities have continued to thrive on the peninsula despite centuries of isolation from the Greek mainland."
 grefm_greek_empire.008.a: "These lands will return to us."
 grefm_greek_empire.009.t: "The Foundings of Alexander"
 grefm_greek_empire.009.d: "As Alexander's armies thundered across Asia, both he and his generals founded several cities in his name, each serving as a beacon of Hellenism in the east. With the restoration of the [ROOT.GetCountry.GetName], leaders have ardently called for the reconquest of the farthest reaches of the Empire, many of which lie in the hands of the [Concept('concept_great_power','$concept_great_powers$$')]."
 grefm_greek_empire.009.f: ""Shall I pass by and leave you lying there because of the expeditions you led against Greece, or shall I set you up again because of your magnanimity and your virtues in other respects?" -Alexander the Great, to a statue of Xerxes the Great (supposedly)"
 grefm_greek_empire.009.a: "We will see Alexander's Legacy Restored."