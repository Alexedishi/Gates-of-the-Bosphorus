l_english:
 # Journal Entries
 je_eqfm_the_black_mountain: "The Black Mountain"
 je_eqfm_the_black_mountain_reason: "$je_eqfm_the_black_mountain_flavor$[GetPlayer.GetCustom('eqfm_black_mountain_raiding_type')]"
 je_eqfm_the_black_mountain_flavor: "In many ways, the vicious frontier of [GetStateRegion('STATE_MONTENEGRO').GetName] has preserved many of the pre-medieval customs of conflict and tribal rule. From slave raids to the taking of heads, the hinterlands represent a bizarre holdover of tribalistic behavior to the outside world. As the Ottoman Empire struggles to assert its sovereignty, it looks to finally bring the Montenegrin people to heel."
 je_eqfm_the_black_mountain_raiding: "\n$TOOLTIP_DELIMITER$\n[ROOT.GetCountry.GetNameNoFlag]'s current [concept_raiding_frequency] is [GetPlayer.MakeScope.Var('raiding_intensity').GetValue]. This results in a weekly income of #g @money! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_eqfm_the_black_mountain_raiding_breakdown [GetPlayer.MakeScope.Var('last_week_raiding_income').GetValue|+=0]#!#! (of a maximum of #v 5000#!) from [concept_raiding].[GetPlayer.GetCustom('eqfm_black_mountain_raiding_organizer_type')][GetPlayer.GetCustom('eqfm_black_captives_type')]"
 je_eqfm_the_black_mountain_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_ip3$\n$je_eqfm_the_black_mountain_flavor$"
 je_eqfm_the_black_mountain_status: "[GetPlayer.GetCustom('eqfm_black_mountain_status_type')][GetPlayer.GetCustom('eqfm_black_mountain_raiding_income_type')][GetPlayer.GetCustom('eqfm_black_mountain_expedition_type')]"
 je_eqfm_the_black_mountain_raiding_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('eqfm_raiding_income_value')]"
 je_eqfm_the_black_mountain_raiding_amount: "\n[concept_raiding] is earning us #g @money!+[GetPlayer.MakeScope.Var('last_week_raiding_income').GetValue]#!"
 je_eqfm_the_black_mountain_raiding_amount_max: "\n[concept_raiding] is earning us #g @money!+[GetPlayer.MakeScope.ScriptValue('eqfm_max_raiding_income_value')]#! (Max)"
 je_eqfm_the_black_mountain_expedition: "\n$eqfm_expedition_progress$: #bold #green [GetPlayer.MakeScope.Var('eqfm_black_mountain_expedition_progress_var').GetValue]#!/8#! $eqfm_expedition_peril$: #bold #red [GetPlayer.MakeScope.Var('eqfm_black_mountain_expedition_peril_var').GetValue]#!/5#!"
 je_eqfm_the_black_mountain_captives_count: "\n@information! [ROOT.GetCountry.GetNameNoFlag] is currently holding [ROOT.MakeScope.Var('eqfm_captured_nobles_var').GetValue] nobles captive."
 je_eqfm_the_black_mountain_raiding_no_chief: "\n@warning! Our [concept_raiding] income is being reduced by #red #bold 75%#!#! due to not having a Tribal Chief organizing our efforts!"

