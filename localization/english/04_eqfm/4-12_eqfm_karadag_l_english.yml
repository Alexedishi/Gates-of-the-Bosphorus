 # Tooltips
 eqfm_black_mountain_expedition: "#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_black_mountain_expedition_desc')] Black Mountain Expedition#!#!"
 eqfm_black_mountain_expedition_desc: "The #bold Montenegrin Frontier#! has been isolated from the influences of the greater world by a mixture of rugged terrain and lack of development. As the Ottoman Empire lashes out in its death throes, the $turkfm_porte$ is determined to finally subjugate the Montenegrin tribes."

