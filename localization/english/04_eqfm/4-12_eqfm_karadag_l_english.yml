 # Notifications
 notification_notification_eqfm_expeditionary_force_arrives_name: "Ottoman Expeditionary Force Arrives at the Border"
 notification_notification_eqfm_expeditionary_force_arrives_desc: "The Ottoman Empire has deployed a $eqfm_black_mountain_expedition$ to combat [concept_raiding]"
 notification_notification_eqfm_expeditionary_force_withdraws_name: "Ottoman Expeditionary Force Withdraws from the Border"
 notification_notification_eqfm_expeditionary_force_withdraws_desc: "The Turkish $eqfm_black_mountain_expedition$ has returned to lick their wounds."
 notification_notification_eqfm_noble_released_name: "Ottoman Nobleman Released"
 notification_notification_eqfm_noble_released_desc: "Montenegrin raiders recently captured a minor noble during a $eqfm_black_mountain_frontier$ raid. Strangely, they have shown clemency and allowed him to return to Ottoman territory."
 notification_notification_eqfm_noble_captured_name: "Ottoman Nobleman Captured"
 notification_notification_eqfm_noble_captured_desc: "Montenegrin raiders have seized a minor noble during a $eqfm_black_mountain_frontier$ raid. This presents an embarrassing setback in the conflict."
 notification_notification_eqfm_folk_hero_killed_name: "Montenegrin Folk Hero Killed"
 notification_notification_eqfm_folk_hero_killed_desc: "Ottoman soldiers have dispatched a notable #yellow Montenegrin#! war leader. This has increased their $eqfm_black_mountain_influence$ over the $eqfm_black_mountain_frontier$ and galvanized the Montenegrin people against the $turkfm_porte$."
 notification_notification_eqfm_village_skirmish_name: "$eqfm_tribal_skirmish$ Escalates"
 notification_notification_eqfm_village_skirmish_desc: "News has arrived of an escalating conflict at a border village in [GetStateRegion('STATE_MONTENEGRO').GetName]. Militias on both sides have dug in for a prolonged fight."
 notification_notification_eqfm_villages_burned_name: "Village Outskirts Burned"
 notification_notification_eqfm_villages_burned_desc: "Several buildings on the outskirts of the village have been set aflame. This has cost us #v 1#! progress in the $eqfm_tribal_skirmish$"
 notification_notification_eqfm_noble_beheaded_name: "Ottoman Nobleman Beheaded"
 notification_notification_eqfm_noble_beheaded_desc: "Following our refusal to pay a ransom for our lost commander, $MON$ has executed their captive by beheading him. His head now adorns the fortifications of the $MON_ADJ$ royal palace."

 # Scripted Buttons
 eqfm_renounce_headtaking_button: "Renounce Head-taking"
 eqfm_renounce_headtaking_button_desc: "The taking of heads is a bizarre and barbaric holdover of the tribal history of [GetStateRegion('STATE_MONTENEGRO').GetName]. While previous attempts at negotiating its abolition have failed, increased exposure to the West has provided renewed support for ending the practice."
 eqfm_renounce_headtaking_possible: "Negotiations on #bold Head-taking#! have not occurred within the last #bold 5#! years"
 eqfm_renounce_headtaking_effect: "Participants will make their choice on whether to suppress head-taking"

 eqfm_increase_raiding_button: ""Bring Me More Heads!""
 eqfm_increase_raiding_button_desc: "Encourage the tribes to raid more often, increasing [concept_raiding_frequency]. This will increase our income, but hurt [concept_relations] with #v $RUS$#! and especially the #v Ottoman Empire#!."
 eqfm_decrease_raiding_button: "Discourage Raiding"
 eqfm_decrease_raiding_button_desc: "Force the tribes to curtail their raiding, decreasing [concept_raiding_frequency]. $RUS$#! will appreciate this step towards civility towards the #v Ottoman Empire#!."

 eqfm_appoint_tribal_chief_button: "Appoint Tribal Chief"
 eqfm_appoint_tribal_chief_button_desc: "[concept_raiding] is endemic to [GetStateRegion('STATE_MONTENEGRO').GetName], and it mostly uncoordinated in nature. By assigning a tribal chief to coordinate raiding, we can instead their spoils and direct a larger portion to state coffers."
 eqfm_dismiss_tribal_chief_button: "Dismiss Tribal Chief"
 eqfm_dismiss_tribal_chief_button_desc: "Tribal chiefs are useful when loyal. Should one become disloyal, there is little more to do than to "deal" with them."
 eqfm_ransom_captives_button: "Ransom Ottoman Noble"
 eqfm_ransom_captives_button_desc: "While they serve as a potent propaganda piece, the nobles we've captured do little for the cause beyond languishing in captivity. The Ottoman court may be interested in paying a ransom in exchange for a chance to save face."
 eqfm_ransom_captives_possible: "We have at least #bold 1#! captured noble"
 eqfm_negotiate_kotor_button: "Negotiate Adriatic Access"
 eqfm_negotiate_kotor_button_desc: "Kotor and its surrounding lands have long been home to the Montenegrin people, yet they have been unfairly cleaved from their countrymen by centuries of imperial designs. However, the Emperor in Vienna may be willing to lend us his ear in exchange for us aligning closer with his Empire."

 eqfm_assign_border_guard_button: "Deploy $eqfm_black_mountain_expedition$"
 eqfm_assign_border_guard_button_desc: "The border between Montenegro and the Ottoman Empire is ill-defined, with casual travel across the border being commonplace. With concerted effort, [ROOT.GetCountry.GetNameNoFlag] could extend its $eqfm_black_mountain_influence$ across the $eqfm_black_mountain_frontier$. However, the resident tribal leaders may not appreciate damages to their lands."
 eqfm_recall_karadag_expedition_button: "Recall $eqfm_black_mountain_expedition$"
 eqfm_recall_karadag_expedition_button_desc: "$eqfm_recall_expedition_button_desc$"

