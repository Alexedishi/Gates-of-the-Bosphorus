l_english:
 # Scripted Buttons
 turkfm_recall_expedition_button: "Recall $turkfm_expedition$"
 turkfm_recall_expedition_button_desc: "The state's needs are ever changing. Should we need, we can recall our $turkfm_expedition$ to free up resources."

 # Triggers
 turkfm_has_expedition: "[ROOT.GetCountry.GetNameNoFlag] has an active $turkfm_expedition$"
 turkfm_has_expedition_NOT: "[ROOT.GetCountry.GetNameNoFlag] does #bold NOT#! have an active $turkfm_expedition$"
 turkfm_has_black_mountain_expedition: "[ROOT.GetCountry.GetNameNoFlag] has an active $turkfm_black_mountain_expedition$"
 turkfm_has_adriatic_expedition: "[ROOT.GetCountry.GetNameNoFlag] has an active $turkfm_adriatic_expedition$"

 # Tooltips
 turkfm_expedition: "#o #tooltip:[GetRawTextTooltipTag('turkfm_expedition_concept')] Expedition#!#!"
 turkfm_expedition_concept: "The #bold Turkish Expeditions#! represent localized struggles by the $turkfm_porte$ to assert control over its Empire beyond the realms of geopolitics and economic development."

 turkfm_expedition_progress:  "#tooltippable;positive_value;TOOLTIP:turkfm_expedition_progress_concept Progress#!"
 turkfm_expedition_progress_concept: "#bold Progress#! represents the progress achieved by the members of an $turkfm_expedition$. Increasing #bold #green Progress#!#! to #bold 8 or more#! will achieve its goal."
 turkfm_progress_plus_1: "The $turkfm_expedition$ gains #bold #green 1#!#! $turkfm_expedition_progress$."
 turkfm_progress_plus_2: "The $turkfm_expedition$ gains #bold #green 2#!#! $turkfm_expedition_progress$."
 turkfm_progress_plus_3: "The $turkfm_expedition$ gains #bold #green 3#!#! $turkfm_expedition_progress$."
 turkfm_progress_minus_1: "The $turkfm_expedition$ loses #bold #red 1#!#! $turkfm_expedition_progress$."
 turkfm_progress_minus_2: "The $turkfm_expedition$ loses #bold #red 2#!#! $turkfm_expedition_progress$."
 turkfm_progress_minus_3: "The $turkfm_expedition$ loses #bold #red 3#!#! $turkfm_expedition_progress$."

 turkfm_expedition_peril: "#tooltippable;negative_value;TOOLTIP:turkfm_expedition_peril_concept Peril#!"
 turkfm_expedition_peril_concept: "#bold Peril#! represents the adversity encountered by the members of an $turkfm_expedition$. Increasing #bold #red Peril#!#! to #bold 8 or more#! will cause it to fail."
 turkfm_peril_plus_1: "The $turkfm_expedition$ gains #bold #red 1#!#! $turkfm_expedition_peril$."
 turkfm_peril_plus_2: "The $turkfm_expedition$ gains #bold #red 2#!#! $turkfm_expedition_peril$."
 turkfm_peril_plus_3: "The $turkfm_expedition$ gains #bold #red 3#!#! $turkfm_expedition_peril$."
 turkfm_peril_minus_1: "The $turkfm_expedition$ loses #bold #green 1#!#! $turkfm_expedition_peril$."
 turkfm_peril_minus_2: "The $turkfm_expedition$ loses #bold #green 2#!#! $turkfm_expedition_peril$."
 turkfm_peril_minus_3: "The $turkfm_expedition$ loses #bold #green 3#!#! $turkfm_expedition_peril$."