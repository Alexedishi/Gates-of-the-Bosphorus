l_english:
 # Journal Entries
 je_eqfm_libyan_desert: "Securing the Desert"
 je_eqfm_libyan_desert_reason: "Through millennia of servitude to foreign overlords, [ROOT.GetCountry.GetNameNoFlag] has only exerted nominal control over the deserts to its south. Foreign powers angle to stretcher their tendrils across the world, and [ROOT.GetCountry.GetNameNoFlag] must act quickly to secure the southern border.\n$TOOLTIP_DELIMITER$\n @information! As long as we maintain a $eqfm_desert_expedition$ with over #v 5#! $turkfm_expedition_progress$, the [GetStateRegion('STATE_LIBYAN_DESERT').GetName] will receive the #tooltippable #tooltip:[GetRawTextTooltipTag('je_eqfm_libyan_desert_modifier')] $modifier_eqfm_desert_scouting$#!#! [concept_timed_modifier]."
 je_eqfm_libyan_desert_status_default: "We control #v [GetPlayer.MakeScope.Var('eqfm_desert_provinces_var').GetValue]#! of #bold 209#! [concept_province]#o s#!"
 je_eqfm_libyan_desert_status_expedition: "[GetPlayer.MakeScope.Var('eqfm_desert_expedition_leader_var').GetCharacter.GetFullName] leads the $turkfm_expedition$\n$turkfm_expedition_progress$: #bold #green [GetPlayer.MakeScope.Var('eqfm_desert_expedition_progress_var').GetValue]#!/8#! $turkfm_expedition_peril$: #bold #red [GetPlayer.MakeScope.Var('eqfm_desert_expedition_peril_var').GetValue]#!/5#!"
 je_eqfm_libyan_desert_modifier: "[GetStaticModifier('modifier_eqfm_desert_scouting').GetDesc]"

 # Modifiers
 modifier_eqfm_leading_desert_expedition: "Leading $eqfm_desert_expedition$"
 modifier_eqfm_desert_scouting: "Desert Scouting"
 modifier_eqfm_completed_desert_expedition: "Completed $eqfm_desert_expedition$"
 modifier_eqfm_cancelled_desert_expedition: "Cancelled $eqfm_desert_expedition$"
 modifier_eqfm_failed_desert_expedition_country: "Failed $eqfm_desert_expedition$"
 modifier_eqfm_failed_desert_expedition_character: "Failed $eqfm_desert_expedition$"
 modifier_eqfm_resupplied_desert_expedition: "Resupplied $eqfm_desert_expedition$"
 modifier_eqfm_tamed_wilderness: "Tamed the Wilderness"
 modifier_eqfm_dissident_teachings: "Dissident Teachings"

 # Notifications
 notification_notification_eqfm_desert_raids_halted_name: ""
 notification_notification_eqfm_desert_raids_halted_desc: ""
 notification_notification_eqfm_yearly_progress_name: ""
 notification_notification_eqfm_yearly_progress_desc: ""

 # Scripted Buttons
 eqfm_deploy_desert_expedition_button: "Deploy $eqfm_desert_expedition$"
 eqfm_deploy_desert_expedition_button_desc: ""
 eqfm_cancel_desert_expedition_button: "Recall $eqfm_desert_expedition$"
 eqfm_cancel_desert_expedition_button_desc: ""
 eqfm_resupply_desert_expedition_button: "Resupply $eqfm_desert_expedition$"
 eqfm_resupply_desert_expedition_button_desc: ""
 eqfm_resupply_desert_expedition_effect: "The $eqfm_desert_expedition$ has #bold #red 3#! or more#! $turkfm_expedition_peril$"
 eqfm_resupply_desert_expedition_possible: "This will reduce $eqfm_desert_expedition$ $turkfm_expedition_peril$ by #bold #green 3#!#! (to a minimum of 0)"

 # Tooltips
 eqfm_desert_expedition: "#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_desert_expedition_desc')] Desert Expedition#!#!"
 eqfm_desert_expedition_desc: ""
 eqfm_desert_expedition_details: "As long as $turkfm_expedition$ $turkfm_expedition_progress$ remains over 5 #bold #green 8#!#!, [GetPlayer.GetNameNoFlag] will receive the -- modifier. If $turkfm_expedition$ $turkfm_expedition_peril$ reaches #red #bold 5#!#!, [GetPlayer.GetNameNoFlag]'s expedition will be forced to withdraw."