 # Notifications
 notification_notification_eqfm_jack_sparrow_reincarnated_name: "New Pirate Lord Rises"
 notification_notification_eqfm_jack_sparrow_reincarnated_desc: "With the passing of the previous pirate lord, [GetPlayer.MakeScope.Var('eqfm_jack_sparrow_var').GetCharacter.GetFullName] has emerged as the new leader for the Albanian pirates."
 notification_notification_eqfm_piracy_yearly_progress_name: "$eqfm_adriatic_expedition$ Makes Progress"
 notification_notification_eqfm_piracy_yearly_progress_desc: "[GetPlayer.MakeScope.Var('eqfm_cutler_beckett_var').GetCharacter.GetFullName]'s task force has picked up leads on pirate activity in the Adriatic."

 # Scripted Buttons
 eqfm_hire_retired_pirates_button: "Hire Retired Pirates"
 eqfm_hire_retired_pirates_button_desc: "The coasts of the Adriatic are not only home to active pirates- they host entire communities whose existence is inseparable from the sea. Many an experienced sailor would hardly turn down the offer at legal employment."
 eqfm_deploy_adriatic_expedition_button: "Deploy Adriatic Expedition"
 eqfm_deploy_adriatic_expedition_button_desc: "The Albanian pirates will never cease their activities until they are forced to. To that end, we should deploy an $turkfm_expedition$ to hunt them down."
 eqfm_cancel_adriatic_expedition_button: "Recall $eqfm_adriatic_expedition$"
 eqfm_cancel_adriatic_expedition_button_desc: "$eqfm_recall_expedition_button_desc$"
 eqfm_resupply_adriatic_expedition_button: "Resupply $eqfm_adriatic_expedition$"
 eqfm_resupply_adriatic_expedition_button_desc: "The $gbbf_adriatic_sea$ is a treacherous and unpredictable body of water. The $eqfm_adriatic_expedition$ will need all the support we can provide."
 eqfm_resupply_adriatic_expedition_button_possible_1: "The $eqfm_adriatic_expedition$ is not involved in a naval chase"
 eqfm_resupply_adriatic_expedition_button_possible_2: "The $eqfm_adriatic_expedition$ has #bold #red 3#! or more#! $turkfm_expedition_peril$"
 eqfm_resupply_adriatic_expedition_button_effect: "This will reduce $eqfm_adriatic_expedition$ $turkfm_expedition_peril$ by #bold #green 3#!#! (to a minimum of 0)"
 
 
 # Scripted Progress Bars
 eqfm_jack_sparrow_progress_bar: "Progress Against Piracy"
 eqfm_jack_sparrow_progress_bar_desc: "Progress Against Piracy"

 # Tooltips
 eqfm_custom_jack_sparrow_cocky: "operates with #red #bold Impunity#!#!, putting us at risk for #bold increased pirate activity#!."
 eqfm_custom_jack_sparrow_cautious: "is showing #orange #bold Trepidation#!#!, putting us at risk for #bold infrequent pirate activity#!."
 eqfm_custom_jack_sparrow_scared: "is #greece #bold In Hiding#!#!, drastically #bold reducing pirate activity#!. Now is the time to put down both him and his treacherous brethren."

 eqfm_adriatic_expedition: "#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_adriatic_expedition_desc')] Adriatic Expedition#!#!"
 eqfm_adriatic_expedition_desc: "Piracy in the Adriatic was largely suppressed in the Roman and Medieval eras, although it remained a nuisance. With the arrival and decay of the Ottoman Empire, however, piracy has returned in force, drawing the ire of Western and Turkish traders alike."
 eqfm_adriatic_expedition_details: "If $turkfm_expedition$ $turkfm_expedition_progress$ reaches #bold #green 8#!#!, [ROOT.GetCountry.GetNameNoFlag] will locate a pirate hideout. If $turkfm_expedition$ $turkfm_expedition_peril$ reaches #red #bold 5#!#!, [ROOT.GetCountry.GetNameNoFlag]'s mission will fail."
 eqfm_jack_sparrow_cocky: "[GetPlayer.MakeScope.Var('eqfm_jack_sparrow_var').GetCharacter.GetFullName] operates with #red #bold Impunity#!#!"
 eqfm_jack_sparrow_cautious: "[GetPlayer.MakeScope.Var('eqfm_jack_sparrow_var').GetCharacter.GetFullName] is showing #orange #bold Trepidation#!#!"
 eqfm_jack_sparrow_scared: "[GetPlayer.MakeScope.Var('eqfm_jack_sparrow_var').GetCharacter.GetFullName] is #greece #bold In Hiding#!#!"
 eqfm_piracy_advance_1: "Progress towards suppressing [concept_albanian_piracy] will advance by #bold #green 1#!#!."
 eqfm_thrown_in_jail_tt: "[SCOPE.sCharacter('jack_sparrow_scope').GetFullName] will languish in prison."
 eqfm_cutler_beckett_expedition_default: "[GetPlayer.MakeScope.Var('eqfm_cutler_beckett_var').GetCharacter.GetFullName] leads the $turkfm_expedition$.\n$turkfm_expedition_progress$: #bold #green [GetPlayer.MakeScope.Var('eqfm_adriatic_expedition_progress_var').GetValue]#!/8#! $turkfm_expedition_peril$: #bold #red [GetPlayer.MakeScope.Var('eqfm_adriatic_expedition_peril_var').GetValue]#!/5#!"
 eqfm_cutler_beckett_expedition_chase: "[GetPlayer.MakeScope.Var('eqfm_cutler_beckett_var').GetCharacter.GetFullName] is giving chase!.\n$turkfm_expedition_progress$: #bold #green [GetPlayer.MakeScope.Var('eqfm_adriatic_expedition_progress_var').GetValue]#!/8#! $turkfm_expedition_peril$: #bold #red [GetPlayer.MakeScope.Var('eqfm_adriatic_expedition_peril_var').GetValue]#!/5#!"
 eqfm_pirates_lost: "The $turkfm_expedition$ loses sight of the pirates..."

 # Opinion Flags
 eqfm_jack_sparrow_opinion_1: "#red #bold Marauding Along the Coastlines#!#!"
 eqfm_cutler_beckett_opinion: "#green #bold Bringing Justice to the Adriatic#!#!"