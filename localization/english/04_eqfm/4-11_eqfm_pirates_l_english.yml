 # Notifications
 notification_notification_turkfm_jack_sparrow_reincarnated_name: "New Pirate Lord Rises"
 notification_notification_turkfm_jack_sparrow_reincarnated_desc: "With the passing of the previous pirate lord, [GetPlayer.MakeScope.Var('turkfm_jack_sparrow_var').GetCharacter.GetFullName] has emerged as the new leader for the Albanian pirates."
 notification_notification_turkfm_piracy_yearly_progress_name: "$turkfm_adriatic_expedition$ Makes Progress"
 notification_notification_turkfm_piracy_yearly_progress_desc: "[GetPlayer.MakeScope.Var('turkfm_cutler_beckett_var').GetCharacter.GetFullName]'s task force has picked up leads on pirate activity in the Adriatic."

 # Scripted Buttons
 turkfm_hire_retired_pirates_button: "Hire Retired Pirates"
 turkfm_hire_retired_pirates_button_desc: "The coasts of the Adriatic are not only home to active pirates- they host entire communities whose existence is inseparable from the sea. Many an experienced sailor would hardly turn down the offer at legal employment."

 turkfm_adriatic_expedition_button: "Deploy Adriatic Expedition"
 turkfm_adriatic_expedition_button_desc: "The Albanian pirates will never cease their activities until they are forced to. To that end, we should deploy an $turkfm_expedition$ to hunt them down."

 # Scripted Progress Bars
 turkfm_jack_sparrow_progress_bar: "Progress Against Piracy"
 turkfm_jack_sparrow_progress_bar_desc: "Progress Against Piracy"

 # Tooltips
 turkfm_custom_jack_sparrow_cocky: "operates with #red #bold Impunity#!#!, putting us at risk for #bold increased pirate activity#!."
 turkfm_custom_jack_sparrow_cautious: "is showing #orange #bold Trepidation#!#!, putting us at risk for #bold infrequent pirate activity#!."
 turkfm_custom_jack_sparrow_scared: "is #greece #bold In Hiding#!#!, drastically #bold reducing pirate activity#!. Now is the time to put down both him and his treacherous brethren."

 turkfm_adriatic_expedition: "#tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_adriatic_expedition_concept')] Adriatic Expedition#!#!"
 turkfm_adriatic_expedition_concept: "Piracy in the Adriatic was largely suppressed in the Roman and Medieval eras, although it remained a nuisance. With the arrival and decay of the Ottoman Empire, however, piracy has returned in force, drawing the ire of Western and Turkish traders alike."
 turkfm_adriatic_expedition_details: "If $turkfm_expedition$ $turkfm_expedition_progress$ reaches #bold #green 8#!#!, [ROOT.GetCountry.GetNameNoFlag] will locate a pirate hideout. If $turkfm_expedition$ $turkfm_expedition_peril$ reaches #red #bold 5#!#!, [ROOT.GetCountry.GetNameNoFlag]'s mission will fail."
 turkfm_jack_sparrow_cocky: "[GetPlayer.MakeScope.Var('turkfm_jack_sparrow_var').GetCharacter.GetFullName] operates with #red #bold Impunity#!#!"
 turkfm_jack_sparrow_cautious: "[GetPlayer.MakeScope.Var('turkfm_jack_sparrow_var').GetCharacter.GetFullName] is showing #orange #bold Trepidation#!#!"
 turkfm_jack_sparrow_scared: "[GetPlayer.MakeScope.Var('turkfm_jack_sparrow_var').GetCharacter.GetFullName] is #greece #bold In Hiding#!#!"
 turkfm_piracy_advance_1: "Progress towards suppressing [concept_albanian_piracy] will advance by #bold #green 1#!#!."
 turkfm_thrown_in_jail_tt: "[SCOPE.sCharacter('jack_sparrow_scope').GetFullName] will languish in prison."
 turkfm_cutler_beckett_expedition: "[GetPlayer.MakeScope.Var('turkfm_cutler_beckett_var').GetCharacter.GetFullName] leads the $turkfm_expedition$.\n$turkfm_expedition_progress$: #bold #green [GetPlayer.MakeScope.Var('eqfm_adriatic_expedition_progress_var').GetValue]#!/8#! $turkfm_expedition_peril$: #bold #red [GetPlayer.MakeScope.Var('eqfm_adriatic_expedition_peril_var').GetValue]#!/5#!"
 turkfm_pirates_lost: "The $turkfm_expedition$ loses sight of the pirates..."

