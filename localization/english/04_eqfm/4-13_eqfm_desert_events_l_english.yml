 eqfm_libyan_desert.001.t: "An Untamed Frontier"
 eqfm_libyan_desert.001.d: "With [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]'s mandate to govern the [ROOT.GetCountry.GetName] has also come an imperative to extend the authority of the [ROOT.GetCountry.GetOverlord.GetName]."
 eqfm_libyan_desert.001.f: "The [ROOT.GetCountry.GetAdjectiveNoFlag] administration asserts a nominal claim to the [GetStateRegion('STATE_LIBYAN_DESERT').GetName], yet central authority beyond the major cities is tenuous at best. The [GetCulture('bedouin').GetName] tribes keep their own laws in the deserts beyond."
 eqfm_libyan_desert.001.a: "We will master the desert."
 eqfm_libyan_desert.001.b: "No expense will be spared."
 eqfm_libyan_desert.002.t: ""
 eqfm_libyan_desert.002.d: ""
 eqfm_libyan_desert.002.f: ""
 eqfm_libyan_desert.002.a: ""
 eqfm_libyan_desert.003.t: ""
 eqfm_libyan_desert.003.d: ""
 eqfm_libyan_desert.003.f: "There is little resembling infrastructure in the deserts, and the best routes through the sands are known to the Bedouin alone."
 eqfm_libyan_desert.003.a: ""
 eqfm_libyan_desert.004.t: ""
 eqfm_libyan_desert.004.d: ""
 eqfm_libyan_desert.004.f: ""
 eqfm_libyan_desert.004.a: ""
 eqfm_libyan_desert.005.t: "Securing the Desert"
 eqfm_libyan_desert.005.d: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has authorized an $turkfm_expedition$ to enforce [ROOT.GetCountry.GetNameNoFlag]'s control over the [GetStateRegion('STATE_LIBYAN_DESERT').GetName]. All that remains is to select a leader."
 eqfm_libyan_desert.005.f: ""Undisciplined... unpunctual... untidy. Several languages. Knowledge of music... literature... knowledge of... knowledge of... you're an interesting man there's no doubt about it.""
 eqfm_libyan_desert.005.a: "Perhaps now is not the time."
 eqfm_libyan_desert.005.b: "[SCOPE.sCharacter('expedition_leader_1').GetFullName] is well qualified."
 eqfm_libyan_desert.005.c: "[SCOPE.sCharacter('expedition_leader_2').GetFullName] has shown promise."
 eqfm_libyan_desert.005.e: "[SCOPE.sCharacter('expedition_leader_1').GetFullName] is a fine choice."

 eqfm_libyan_desert.006.t: "Expedition Departs into the Desert"
 eqfm_libyan_desert.006.d: "After taking a few weeks to muster and gather supplies, [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFullName] has departed [ROOT.GetCountry.GetCapital.GetCityHubName] into the [GetStateRegion('STATE_LIBYAN_DESERT').GetName] in support of our efforts to control the wastes."
 eqfm_libyan_desert.006.f: ""And that is the desert. From here until we reach the other side, no water but what we carry with us. For the camels, no water at all. If the camels die, we die. And in twenty days they will start to die""
 eqfm_libyan_desert.006.a: "We wish them luck."
 eqfm_libyan_desert.007.t: "Expedition Returns from the Desert"
 eqfm_libyan_desert.007.d: "Citing a lack of provisions and attritional losses, [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFullName] has returned from the depths of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName]."
 eqfm_libyan_desert.007.f: ""No Arab loves the desert. We love water and green trees. There is nothing in the desert and no man needs nothing.""
 eqfm_libyan_desert.007.a: "At least they returned alive."
 eqfm_libyan_desert.008.t: "Expedition Leader Has Died!"
 eqfm_libyan_desert.008.d: "Our $eqfm_desert_expedition$ was sighted returning from the depths of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName]. They bring with them the tragic news of the death of [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFullName] out in the wastes."
 eqfm_libyan_desert.008.f: ""No Arab loves the desert. We love water and green trees. There is nothing in the desert and no man needs nothing.""
 eqfm_libyan_desert.008.a: "Tragic circumstances"
 eqfm_libyan_desert.009.t: "The Libyan Deserts"
 eqfm_libyan_desert.009.d: "Through concerted efforts, the [ROOT.GetCountry.GetAdjective] government has succeeded in taming the frontier of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName] and has brought this vital link to the south under state control."
 eqfm_libyan_desert.009.f: "While often construed as a wasteland by Europeans, the deserts have long hosted a flourishing network of nomadic peoples."
 eqfm_libyan_desert.009.a: "These lands belong to [ROOT.GetCountry.GetName]"

 eqfm_libyan_desert.010.t: "Marabouts Spread Dissident Teachings"
 eqfm_libyan_desert.010.d: "Several [GetCharacterTrait('gbbf_trait_marabout').GetName]#yellow s#! have been reported to be spreading teachings that run in defiance of the Ulema. Already small lodges have been reported taking root in [SCOPE.sState('eqfm_senussi_marabout_state').GetName]."
 eqfm_libyan_desert.010.f: "[SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFullName] will enforce order."
 eqfm_libyan_desert.010.a: "Leave them be."
 eqfm_libyan_desert.010.b: "Shutter these lodges before this grows."
 eqfm_libyan_desert.011.t: "Insecure Desert Routes"
 eqfm_libyan_desert.011.d: "Traders from the south have warned that trade routes across the desert have been disrupted by conflicts between [GetCulture('bedouin').GetName] tribes."
 eqfm_libyan_desert.011.f: ""So long as the Arabs fight tribe against tribe, so long will they be a little people, a silly people - greedy, barbarous, and cruel...""
 eqfm_libyan_desert.011.a: "Their quarrels are beyond our concern."
 eqfm_libyan_desert.011.b: "We should broker a peace."
 eqfm_libyan_desert.011.c: "Have our $eqfm_desert_expedition$ secure the way."
 eqfm_libyan_desert.012.t: "Issues with Taxation"
 eqfm_libyan_desert.012.d: "Disagreements have erupted between local beys and [GetCulture('bedouin').GetName] leaders in [SCOPE.sState('eqfm_desert_event_state').GetName] over the application of tax policy. Tribal leaders insist they entitled to a portion of revenues collected, while the beys seek to move all taxes under their jurisdiction."
 eqfm_libyan_desert.012.f: ""Then I will execute the Law. I have no tribe and no one is offended.""
 eqfm_libyan_desert.012.a: "The law of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] will be the only law."
 eqfm_libyan_desert.012.b: "They will have their share."
