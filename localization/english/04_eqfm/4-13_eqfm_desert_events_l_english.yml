 eqfm_libyan_desert.020.t: "A Storm of Sand"
 eqfm_libyan_desert.020.d: "The $eqfm_desert_expedition$ has been enveloped by a brutal sandstorm which shows no signs of relenting any time soon."
 eqfm_libyan_desert.020.f: ""Lawrence, only two kinds of creature get fun in the desert: Bedouins and gods, and you're neither. Take it from me, for ordinary men, it's a burning, fiery furnace.""
 eqfm_libyan_desert.020.a: ""Everyone, find shelter!""
 eqfm_libyan_desert.021.t: "Sand, Sand, and More Sand"
 eqfm_libyan_desert.021.d: "The $eqfm_desert_expedition$ has become disoriented in an area of featureless desert with minimal landmarks."
 eqfm_libyan_desert.021.f: ""My lord, I think... I think your book is right. 'The desert is an ocean in which no oar is dipped' and on this ocean the Bedu go where they please and strike where they please'...""
 eqfm_libyan_desert.021.a: ""I thought they knew how to work a compass...""
 eqfm_libyan_desert.021.b: ""Thankfully, [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFullName] knows the way.""
 eqfm_libyan_desert.022.t: "A Welcome Respite"
 eqfm_libyan_desert.022.d: ""Yes, sir! Right up ahead!"\nThe $eqfm_desert_expedition$ let out collective sighs of relief as a forward scout confirmed the suspected sightings of water were, in fact, a poorly known oasis. With their waterskins refilled and camels rested, the men await further direction."
 eqfm_libyan_desert.022.f: ""He longs for the greenness of his native land. He pines for the Gothic cottages of Surrey, is it not? Already in imagination, he catches trout and engages in all the activities of the English gentleman.""
 eqfm_libyan_desert.022.a: "We shouldn't tarry too long, the sands await."
 eqfm_libyan_desert.022.b: "Let us rest here, for it could be a long journey..."
 eqfm_libyan_desert.022.c: "Make camp. We shall call for a resupply."
 eqfm_libyan_desert.023.t: "Desert Diplomacy"
 eqfm_libyan_desert.023.d: "The $eqfm_desert_expedition$ is expected to pass within a day's travel of a major desert settlement. "
 eqfm_libyan_desert.023.f: ""There may be honor among thieves, but there's none in politicians.""
 eqfm_libyan_desert.023.a: "Host a meeting with tribal leaders."
 eqfm_libyan_desert.023.b: "Stop for supplies, nothing more."
 eqfm_libyan_desert.023.c: "This is a waste of time."
 eqfm_libyan_desert.024.t: "Charting the Desert"
 eqfm_libyan_desert.024.d: ""
 eqfm_libyan_desert.024.f: ""No Arab loves the desert. We love water and green trees. There is nothing in the desert and no man needs nothing.""
 eqfm_libyan_desert.024.a: "Steady as we go."
 eqfm_libyan_desert.024.b: "Let's press a little further."
 eqfm_libyan_desert.025.t: "A Clash on Camel-back"
 eqfm_libyan_desert.025.d: "A band of [GetCulture('bedouin').GetName] nomads have set their sights on the $eqfm_desert_expedition$. With the sun cresting over the dunes, it has become clear they intent to attack. It falls to [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName] to direct the response."
 eqfm_libyan_desert.025.f: ""In this country, Mr. Bentley, the man who gives victory in battle is prized beyond every other man...""
 eqfm_libyan_desert.025.a: ""We form a defensive line. Right there- on that hill.""
 eqfm_libyan_desert.025.b: ""Forward men! To glory!""
 eqfm_libyan_desert.025.c: ""Fall back. Leave behind what you must.""
