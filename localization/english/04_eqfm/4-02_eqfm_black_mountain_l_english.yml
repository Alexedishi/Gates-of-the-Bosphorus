l_english:
 # Journal Entries
 je_turkfm_the_black_mountain: "The Black Mountain"
 je_turkfm_the_black_mountain_reason: "$je_turkfm_the_black_mountain_flavor$[GetPlayer.GetCustom('je_turkfm_the_black_mountain_raiding')]"
 je_turkfm_the_black_mountain_flavor: "In many ways, the vicious frontier of [GetStateRegion('STATE_MONTENEGRO').GetName] has preserved many of the pre-medieval customs of conflict and tribal rule. From slave raids to the taking of heads, the hinterlands represent a bizarre holdover of tribalistic behavior to the outside world. As the Ottoman Empire struggles to assert its sovereignty, it looks to finally bring the Montenegrin people to heel."
 je_turkfm_the_black_mountain_raiding: "\n$TOOLTIP_DELIMITER$\n[ROOT.GetCountry.GetNameNoFlag]'s current [concept_raiding_frequency] is [GetPlayer.MakeScope.Var('raiding_intensity').GetValue]. This results in a weekly income of #g @money!+[GetPlayer.MakeScope.Var('last_week_raiding_income').GetValue]#! from [concept_raiding].[GetPlayer.GetCustom('turkfm_black_mountain_raiding_organizer_type')]"
 je_turkfm_the_black_mountain_lobby: "$je_turkfm_the_black_mountain_flavor$"

 je_turkfm_the_black_mountain_status: "[GetPlayer.GetCustom('turkfm_black_mountain_status_type')] [GetPlayer.GetCustom('turkfm_black_mountain_raiding_income_type')]"
 je_turkfm_the_black_mountain_raiding_amount: "\n[concept_raiding] is earning us #g @money!+[GetPlayer.MakeScope.Var('last_week_raiding_income').GetValue]#!"
 je_turkfm_the_black_mountain_raiding_amount_max: "\n[concept_raiding] is earning us #g @money!+[GetPlayer.MakeScope.ScriptValue('max_raiding_income')]#! (Max)"
 je_turkfm_the_black_mountain_raiding_no_chief: "\n@warning! #italic #red Our [concept_raiding] income is being reduced by 75% due to not having a Tribal Chief organizing our efforts!#!#!"

