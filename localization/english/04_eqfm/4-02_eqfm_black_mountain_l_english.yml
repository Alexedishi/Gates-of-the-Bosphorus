 # Notifications
 notification_notification_turkfm_expeditionary_force_arrives_name: "Ottoman Expeditionary Force Arrives at the Border"
 notification_notification_turkfm_expeditionary_force_arrives_desc: ""
 notification_notification_turkfm_expeditionary_force_withdraws_name: "Ottoman Expeditionary Force Withdraws from the Border"
 notification_notification_turkfm_expeditionary_force_withdraws_desc: ""
 notification_notification_turkfm_noble_released_name: "Ottoman Nobleman Released"
 notification_notification_turkfm_noble_released_desc: "Montenegrin raiders recently captured a minor noble during a $turkfm_black_mountain_frontier$ raid. Strangely, they have shown clemency and allowed him to return to Ottoman territory."
 notification_notification_turkfm_noble_captured_name: "Ottoman Nobleman Captured"
 notification_notification_turkfm_noble_captured_desc: "Montenegrin raiders have seized a minor noble during a $turkfm_black_mountain_frontier$ raid. This presents an embarrassing setback in the conflict."
 notification_notification_turkfm_folk_hero_killed_name: "Montenegrin Folk Hero Killed"
 notification_notification_turkfm_folk_hero_killed_desc: "Ottoman soldiers have dispatched a notable #yellow Montenegrin#! war leader. This has increased their $turkfm_black_mountain_influence$ over the $turkfm_black_mountain_frontier$ and galvanized the Montenegrin people against the $turkfm_porte$."
 notification_notification_turkfm_village_skirmish_name: "$turkfm_tribal_skirmish$ Escalates"
 notification_notification_turkfm_village_skirmish_desc: "News has arrived of an escalating conflict at a border village in [GetStateRegion('STATE_MONTENEGRO').GetName]. Militias on both sides have dug in for a prolonged fight."
 notification_notification_turkfm_villages_burned_name: "Village Outskirts Burned"
 notification_notification_turkfm_villages_burned_desc: "Several buildings on the outskirts of the village have been set aflame. This has cost us #v 1#! progress in the $turkfm_tribal_skirmish$"

 # Scripted Buttons
 turkfm_renounce_headtaking_button: "Renounce Head-taking"
 turkfm_renounce_headtaking_button_desc: "The taking of heads is a bizarre and barbaric holdover of the tribal history of [GetStateRegion('STATE_MONTENEGRO').GetName]. While previous attempts at negotiating its abolition have failed, increased exposure to the West has provided renewed support for ending the practice."
 turkfm_renounce_headtaking_possible: "Negotiations on #bold Head-taking#! have not occurred within the last #bold 5#! years"
 turkfm_renounce_headtaking_effect: "Participants will make their choice on whether to suppress head-taking"

 turkfm_increase_raiding_button: ""Bring Me More Heads!""
 turkfm_increase_raiding_button_desc: "Encourage the tribes to raid more often, increasing [concept_raiding_frequency]. This will increase our income, but hurt [concept_relations] with #v $RUS$#! and especially the #v Ottoman Empire#!."
 turkfm_decrease_raiding_button: "Discourage Raiding"
 turkfm_decrease_raiding_button_desc: "Force the tribes to curtail their raiding, decreasing [concept_raiding_frequency]. $RUS$#! will appreciate this step towards civility towards the #v Ottoman Empire#!."

 turkfm_appoint_tribal_chief_button: "Appoint Tribal Chief"
 turkfm_appoint_tribal_chief_button_desc: "[concept_raiding] is endemic to [GetStateRegion('STATE_MONTENEGRO').GetName], and it mostly uncoordinated in nature. By assigning a tribal chief to coordinate raiding, we can instead their spoils and direct a larger portion to state coffers."
 turkfm_dismiss_tribal_chief_button: "Dismiss Tribal Chief"
 turkfm_dismiss_tribal_chief_button_desc: "Tribal chiefs are useful when loyal. Should one become disloyal, there is little more to do than to "deal" with them."
 turkfm_ransom_captives_button: "Ransom Ottoman Noble"
 turkfm_ransom_captives_button_desc: "While they serve as a potent propaganda piece, the nobles we've captured do little for the cause beyond languishing in captivity. The Ottoman court may be interested in paying a ransom in exchange for a chance to save face."
 turkfm_ransom_captives_possible: "We have at least #bold 1#! captured noble"
 turkfm_negotiate_kotor_button: "Negotiate Adriatic Access"
 turkfm_negotiate_kotor_button_desc: "Kotor and its surrounding lands have long been home to the Montenegrin people, yet they have been unfairly cleaved from their countrymen by centuries of imperial designs. However, the Emperor in Vienna may be willing to lend us his ear in exchange for us aligning closer with his Empire."

 turkfm_assign_border_guard_button: "Deploy $turkfm_black_mountain_expedition$"
 turkfm_assign_border_guard_button_desc: "The border between Montenegro and the Ottoman Empire is ill-defined, with casual travel across the border being commonplace. With concerted effort, [ROOT.GetCountry.GetNameNoFlag] could extend its $turkfm_black_mountain_influence$ across the $turkfm_black_mountain_frontier$. However, the resident tribal leaders may not appreciate damages to their lands."

 # Script Value Breakdowns
 turkfm_value_from_organizing_raids: "From organizing [ROOT.GetCountry.GetAdjectiveNoFlag] [concept_raiding]"
 turkfm_value_from_black_mountain_expedition: "From deploying an $turkfm_black_mountain_expedition$ to suppress [concept_raiding]"
 turkfm_value_from_adriatic_expedition: "From deploying an $turkfm_adriatic_expedition$ to chase down [concept_albanian_piracy]"
 turkfm_value_from_desert_expedition: "From deploying an $eqfm_desert_expedition$ to tame the [concept_bedouin_tribes]"

 # Tooltips
 turkfm_black_mountain_expedition: "#tooltippable #tooltip:[GetRawTextTooltipTag('turkfm_black_mountain_frontier_concept')] Black Mountain Expedition#!#!"
 turkfm_black_mountain_expedition_concept: "The #bold Montenegrin Frontier# has been isolated from the influences of the greater world by a mixture of rugged terrain and lack of development. As the Ottoman Empire lashes out in its death throes, the $turkfm_porte$ is determined to finally subjugate the Montenegrin tribes."

 turkfm_dismiss_tribal_chief: "This will reduce our earned [concept_raiding] income by #bold 50%#!"
 turkfm_cancel_black_mountain_expedition: "This will increase #bold Montenegrin#! raiding income by #bold 50%#!"

 turkfm_tribal_skirmish: "#bold #tooltip:[GetRawTextTooltipTag('turkfm_tribal_skirmish_desc')] Tribal Skirmish#!#!"
 turkfm_tribal_skirmish_desc: ""
 turkfm_black_mountain_skirmish_start: "While the $turkfm_tribal_skirmish$ is ongoing, both sides will be unable to withdraw their leaders until the resolution of the battle"
 turkfm_black_mountain_skirmish_penalty: "#red Being involved in a $turkfm_tribal_skirmish$ will halve our [concept_raiding] @gold! income!#!"
 turkfm_black_mountain_skirmish_end: "The $turkfm_tribal_skirmish$ comes to an end"

 turkfm_skirmish_no_progress: "The $turkfm_tribal_skirmish$ makes no progress"
 turkfm_skirmish_progress_mon_1: "The $turkfm_tribal_skirmish$ by #v 1#! in favor of [SCOPE.sCountry('montenegro_scope').GetName]"
 turkfm_skirmish_progress_mon_2: "The $turkfm_tribal_skirmish$ by #v 2#! in favor of [SCOPE.sCountry('montenegro_scope').GetName]"
 turkfm_skirmish_progress_mon_3: "The $turkfm_tribal_skirmish$ by #v 3#! in favor of [SCOPE.sCountry('montenegro_scope').GetName]"
 turkfm_skirmish_progress_tur_1: "The $turkfm_tribal_skirmish$ by #v 1#! in favor of [SCOPE.sCountry('ottoman_scope').GetName]"
 turkfm_skirmish_progress_tur_2: "The $turkfm_tribal_skirmish$ by #v 2#! in favor of [SCOPE.sCountry('ottoman_scope').GetName]"
 turkfm_skirmish_progress_tur_3: "The $turkfm_tribal_skirmish$ by #v 3#! in favor of [SCOPE.sCountry('ottoman_scope').GetName]"

 turkfm_black_mountain_expedition_details: "If $turkfm_expedition$ $turkfm_expedition_progress$ reaches #bold #green 8#!#!, [ROOT.GetCountry.GetNameNoFlag] will increase its influence over the $turkfm_black_mountain_frontier$. If $turkfm_expedition$ $turkfm_expedition_peril$ reaches #red #bold 8#!#!, [ROOT.GetCountry.GetNameNoFlag]'s mission will fail."
 turkfm_black_mountain_frontier: "#o #tooltip:[GetRawTextTooltipTag('turkfm_black_mountain_frontier_concept')] Montenegrin Frontier#!#!"
 turkfm_black_mountain_frontier_concept: "The #bold Montenegrin Frontier#! has been in a fractured and decentralized state since the collapse of Byzantine and Serbian imperial rule. By leveraging $turkfm_black_mountain_influence$, the Montenegrin and Ottoman states can lure the tribes into their rule."
 turkfm_black_mountain_influence: "#o #tooltip:[GetRawTextTooltipTag('turkfm_black_mountain_influence_concept')] Frontier Influence#!#!"
 turkfm_black_mountain_influence_concept: "#bold Frontier Influence#! represents the amount of socio-political sway a state holds over the Montenegrin tribes."

 turkfm_black_mountain_placid: "@gbbf_placid! #bold #green Placid#!#!"
 turkfm_black_mountain_placid_desc: "@information! There is nothing of note occurring along the $turkfm_black_mountain_frontier$."
 turkfm_black_mountain_status_placid: "#bold Current Situation:#! $turkfm_black_mountain_placid$"

 turkfm_black_mountain_raiding: "@gbbf_raiding! #bold #orange Raiding#!#!"
 turkfm_black_mountain_raiding_desc: "@information! Our tribesmen are [concept_raiding] along the $turkfm_black_mountain_frontier$."
 turkfm_black_mountain_status_raiding: "#bold Current Situation:#! $turkfm_black_mountain_raiding$"

 turkfm_black_mountain_raided: "@gbbf_rebelling! #bold #orange Being Raided#!#!"
 turkfm_black_mountain_raided_desc: "@warning! Our subjects are experiencing [concept_raiding] along the $turkfm_black_mountain_frontier$."
 turkfm_black_mountain_status_raided: "#bold Current Situation:#! $turkfm_black_mountain_raided$"

 turkfm_black_mountain_patrolling: "@gbbf_patrolling! #bold #red Leading Patrols#!#!"
 turkfm_black_mountain_raided_patrolling: "@warning! We have deployed an $turkfm_expedition$ to combat [concept_raiding] along the $turkfm_black_mountain_frontier$."
 turkfm_black_mountain_status_patrolling: "#bold Current Situation:#! $turkfm_black_mountain_patrolling$"

 turkfm_black_mountain_skirmish: "@gbbf_skirmishing! #bold #red Skirmishing#!#!"
 turkfm_black_mountain_skirmish_desc: "@warning! Irregular militias have become engaged in a skirmish in the $turkfm_black_mountain_frontier$."
 turkfm_black_mountain_status_skirmish: "#bold Current Situation:#! $turkfm_black_mountain_skirmish$"

 turkfm_headtaking_cooldown_GET: "We will be unable to attempt negotiations on Head-taking for #bold 5#! years"
 turkfm_raiding_status_cooldown: "[ROOT.GetCountry.GetNameNoFlag] has not changed its stance on raiding activities within the last #bold 2#! years"
