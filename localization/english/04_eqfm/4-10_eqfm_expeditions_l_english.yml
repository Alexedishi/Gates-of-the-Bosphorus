l_english:
 # Modifiers
 modifier_eqfm_deployed_expedition: "Deployed Expedition Costs"

 # Scripted Buttons
 eqfm_recall_expedition_button: "Recall $turkfm_expedition$"
 eqfm_recall_expedition_button_desc: "The state's needs are ever changing. Should we need, we can recall this $turkfm_expedition$ to free up resources."

 # Script Value Breakdowns
 eqfm_value_from_organizing_raids: "From organizing [ROOT.GetCountry.GetAdjectiveNoFlag] [concept_raiding]"
 eqfm_value_from_black_mountain_expedition: "From deploying an $eqfm_black_mountain_expedition$ to suppress [concept_raiding]"
 eqfm_value_from_adriatic_expedition: "From deploying an $eqfm_adriatic_expedition$ to chase down [concept_albanian_piracy]"
 eqfm_value_from_desert_expedition: "From deploying an $eqfm_desert_expedition$ to tame the [concept_bedouin_tribes]"

 # Triggers
 turkfm_has_expedition: "[ROOT.GetCountry.GetNameNoFlag] has an active $turkfm_expedition$"
 turkfm_has_expedition_NOT: "[ROOT.GetCountry.GetNameNoFlag] does #bold not#! have an active $turkfm_expedition$"
 eqfm_has_adriatic_expedition: "[ROOT.GetCountry.GetNameNoFlag] has an active $eqfm_adriatic_expedition$"
 eqfm_has_adriatic_expedition_NOT: "[ROOT.GetCountry.GetNameNoFlag] does #bold not#! have an active $eqfm_adriatic_expedition$"
 turkfm_has_black_mountain_expedition: "[ROOT.GetCountry.GetNameNoFlag] has an active $eqfm_black_mountain_expedition$"
 turkfm_has_black_mountain_expedition_NOT: "[ROOT.GetCountry.GetNameNoFlag] does #bold not#! have an active $eqfm_black_mountain_expedition$"
 eqfm_has_desert_expedition: "[GetPlayer.GetNameNoFlag] has an active $eqfm_desert_expedition$"
 eqfm_has_desert_expedition_NOT: "[GetPlayer.GetNameNoFlag] does #bold not#! have an active $eqfm_desert_expedition$"

 # Tooltips
 turkfm_expedition: "#o #tooltip:[GetRawTextTooltipTag('turkfm_expedition_concept')] Expedition#!#!"
 turkfm_expedition_concept: "The #bold Turkish Expeditions#! represent localized struggles by the $turkfm_porte$ to assert control over its Empire beyond the realms of geopolitics and economic development."

 turkfm_expedition_progress:  "#tooltippable;positive_value;TOOLTIP:turkfm_expedition_progress_desc Progress#!"
 turkfm_expedition_progress_desc: "#bold Progress#! represents the progress achieved by the members of an $turkfm_expedition$. Increasing #bold #green Progress#!#! to #bold 8 or more#! will achieve its goal."
 turkfm_progress_plus_1: "The $turkfm_expedition$ gains #bold #green 1#!#! $turkfm_expedition_progress$"
 turkfm_progress_plus_2: "The $turkfm_expedition$ gains #bold #green 2#!#! $turkfm_expedition_progress$"
 turkfm_progress_plus_3: "The $turkfm_expedition$ gains #bold #green 3#!#! $turkfm_expedition_progress$"
 turkfm_progress_minus_1: "The $turkfm_expedition$ loses #bold #red 1#!#! $turkfm_expedition_progress$"
 turkfm_progress_minus_2: "The $turkfm_expedition$ loses #bold #red 2#!#! $turkfm_expedition_progress$"
 turkfm_progress_minus_3: "The $turkfm_expedition$ loses #bold #red 3#!#! $turkfm_expedition_progress$"
 turkfm_progress_minus_all: "The $turkfm_expedition$ loses #bold #red all#!#! $turkfm_expedition_progress$"

 turkfm_expedition_peril: "#tooltippable;negative_value;TOOLTIP:turkfm_expedition_peril_desc Peril#!"
 turkfm_expedition_peril_desc: "#bold Peril#! represents the adversity encountered by the members of an $turkfm_expedition$. Increasing #bold #red Peril#!#! to #bold 5 or more#! will cause it to fail."
 turkfm_peril_plus_1: "The $turkfm_expedition$ gains #bold #red 1#!#! $turkfm_expedition_peril$"
 turkfm_peril_plus_2: "The $turkfm_expedition$ gains #bold #red 2#!#! $turkfm_expedition_peril$"
 turkfm_peril_plus_3: "The $turkfm_expedition$ gains #bold #red 3#!#! $turkfm_expedition_peril$"
 turkfm_peril_minus_1: "The $turkfm_expedition$ loses #bold #green 1#!#! $turkfm_expedition_peril$"
 turkfm_peril_minus_2: "The $turkfm_expedition$ loses #bold #green 2#!#! $turkfm_expedition_peril$"
 turkfm_peril_minus_3: "The $turkfm_expedition$ loses #bold #green 3#!#! $turkfm_expedition_peril$"
 turkfm_peril_minus_all: "The $turkfm_expedition$ loses #bold #green all#!#! $turkfm_expedition_peril$"