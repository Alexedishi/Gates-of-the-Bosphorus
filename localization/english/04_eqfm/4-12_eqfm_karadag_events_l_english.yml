 turkfm_expeditions.052.t: "Village Families Massacred"
 turkfm_expeditions.052.d: ""Concerning news has trickled in to border outposts in [GetStateRegion('STATE_MONTENEGRO').GetName]: militiamen nominally operating under our control have ransacked several non-[ROOT.GetCountry.GetStateReligion.GetName] houses with great human cost.""
 turkfm_expeditions.052.f: "Exercising military command is already complicated by the ruggedness of the mountain terrain. This, combined with traditional violence, has served as the perfect recipe for atrocity."
 turkfm_expeditions.052.a: "Put a stop to this madness."
 turkfm_expeditions.052.b: "This is no concern of ours. "
 turkfm_expeditions.053.t: "Bora Disrupts Operations"
 turkfm_expeditions.053.d: "A powerful windstorm has swept down from the mountains. While the Ottomans have been forced to seek shelter, the Montenegrins have consolidated their control over the village."
 turkfm_expeditions.053.f: ""
 turkfm_expeditions.053.a: "This will certainly muddy things up."
 turkfm_expeditions.054.t: ""
 turkfm_expeditions.054.d: ""
 turkfm_expeditions.054.f: ""
 turkfm_expeditions.054.a: ""
 turkfm_expeditions.055.t: "Pitched Battle"
 turkfm_expeditions.055.d: "A chance encounter between a Montenegrin scouting party and an Ottoman patrol devolved into prolonged fighting as both leaders elected to reinforce their positions."
 turkfm_expeditions.055.f: "Despite their flexibility and familiarity with the terrain, the Montenegrins struggle to inflict sizeable damage to organized formations."
 turkfm_expeditions.055.a: "Our men will not be cowed."
 turkfm_expeditions.055.b: "These tribal forces are no threat to us."
 turkfm_expeditions.056.t: "Sudden Breakthrough"
 turkfm_expeditions.056.d: "A surprisingly organized push by [SCOPE.sCharacter('eqfm_black_mountain_tur_leader').GetFullName] have broken through our defenses near the village center and laid claim to several key buildings."
 turkfm_expeditions.056.f: ""
 turkfm_expeditions.056.a: "Our braves will never fail!"
 turkfm_expeditions.056.b: "Let them taste the sword."
 turkfm_expeditions.057.t: ""
 turkfm_expeditions.057.d: ""
 turkfm_expeditions.057.f: ""
 turkfm_expeditions.057.a: ""
 turkfm_expeditions.058.t: "Ottoman Commander Captured"
 turkfm_expeditions.058.d: ""
 turkfm_expeditions.058.f: "With so little to leverage against the Ottomans, the capture of politically sensitive hostages has emerged as one of the pre-eminent tools of Montenegrin diplomacy."
 turkfm_expeditions.058.a: "Turn them loose."
 turkfm_expeditions.058.b: "Bring them to the palace."
 turkfm_expeditions.058.c: "We take no prisoners."
 turkfm_expeditions.059.t: "Montenegrin Leader Killed"
 turkfm_expeditions.059.d: "[ROOT.GetCapital.GetCityHubName] has been the site of mass mourning as the distressing news as arrived of the death of a famed warrior in the [ROOT.GetCountry.GetAdjectiveNoFlag] highlands."
 turkfm_expeditions.059.f: ""Oh my bird, oh my dear grey falcon,\nHow do you feel with your wing torn out?\nI am feeling with my wing torn out\nLike a brother one without the other.""
 turkfm_expeditions.059.a: "We will sing songs to his glory!"
 turkfm_expeditions.059.b: "Justice well served!"