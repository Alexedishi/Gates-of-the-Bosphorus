 turkfm_expeditions.006.t: "The Black Mountain Lost"
 turkfm_expeditions.006.d: "Our efforts to retain control over the Black Mountain have failed. The small country has not only defied our leadership but has expelled our influence from [GetStateRegion('STATE_MONTENEGRO').GetName] altogether."
 turkfm_expeditions.006.f: "Despite centuries of invasions and imperialist designs, Montenegro stands as resolute as its people."
 turkfm_expeditions.006.a: "This is a disastrous outcome."
 turkfm_expeditions.007.t: "The Black Mountain Subdued"
 turkfm_expeditions.007.d: "With both resolute leadership and the fierce spirit of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has brought the entirety of [GetStateRegion('STATE_MONTENEGRO').GetName] under the control of [ROOT.GetCountry.GetName]."
 turkfm_expeditions.007.f: "After centuries of resisting invasions and imperialist designs, [GetStateRegion('STATE_MONTENEGRO').GetName] has finally been brought to heel."
 turkfm_expeditions.007.a: "The Black Mountain has been humbled."
 turkfm_expeditions.008.t: "International Indifference"
 turkfm_expeditions.008.d: "Despite appeals for armed interventions, both the [Concept('concept_great_power','$concept_great_powers$')] have remained silent on the matter of Ottoman dominion over [GetStateRegion('STATE_MONTENEGRO').GetName]. In fact, they have demanded that we avoid aggression in the region lest we provoke a larger conflict."
 turkfm_expeditions.008.f: "Time and time again, the European powers have renewed their support of Montenegro in the hopes of gaining a foothold in the Balkans only to withdraw their support whenever a new border conflict threaten to escalate into open warfare."
 turkfm_expeditions.008.a: ""What use are these so-called "Beacons of Civilization?""
 turkfm_expeditions.009.t: "The Lands of Montenegro"
 turkfm_expeditions.009.d: "With both resolute leadership and the fierce spirit of the Montenegrin people, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has brought the entirety of our lands under the control of [ROOT.GetCountry.GetName]."
 turkfm_expeditions.009.f: "Despite centuries of invasions and imperialist designs, Montenegro stands as resolute as its people."
 turkfm_expeditions.009.a: "[ROOT.GetCountry.GetName] will never fall!"

 turkfm_expeditions.010.t: "Negotiations on Head-taking" # Recipient
 turkfm_expeditions.010.d: "An envoy sent by the [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle] of [SCOPE.sCountry('montenegro_scope').GetName] was hosted at the court in Constantinople today. Among the details discussed was a proposition to ban the practice of Head-taking in the among the tribes of [GetStateRegion('STATE_MONTENEGRO').GetName]."
 turkfm_expeditions.010.f: "The lack of development and infrastructure across Montenegro has permitted the continuation of several traditions including that of head-taking. These grizzly displays have drawn both shock and scorn from the West."
 turkfm_expeditions.010.a: "This is a ridiculous request. Off with his head!"
 turkfm_expeditions.010.b: "These practices are barbaric. We should heed the sentiments of the West."
 turkfm_expeditions.011.t: "Negotiations on Head-taking" # Outcome
 turkfm_expeditions.011.d1: "Almost as expected, [SCOPE.sCountry('eqfm_headtaking_recipient_scope').GetNameNoFlag] has rejected our offer to clamp down on the practice of head-taking."
 turkfm_expeditions.011.d2: "Against all odds, our envoys have brokered a deal that will see the practice of head-taking curtailed across [GetStateRegion('STATE_MONTENEGRO').GetName]. All that remains is to inform the tribal heads."
 turkfm_expeditions.011.f: "While negotiations to abandon the practice of head-taking have occurred in the past, each and ever time they have been hampered by the fear that one side would renege on their side of the bargain."
 turkfm_expeditions.011.a: "If they will not negotiate, then neither shall we."
 turkfm_expeditions.011.b: "The [SCOPE.sCountry('eqfm_headtaking_recipient_scope').GetRuler.GetPrimaryRoleTitle] has no honor. We should display ours."
 turkfm_expeditions.011.c: "Excellent news."
 turkfm_expeditions.012.t: "Negotiations Over Cattaro" # Recipient
 turkfm_expeditions.012.d: "An envoy from [SCOPE.sCountry('montenegro_scope').GetName] presented himself in the [ROOT.GetCountry.GetAdjective] court to negotiate for the return of Kotor to the Montenegrin people."
 turkfm_expeditions.012.f: "Kotor has been a home to the Montenegrins [GetCulture('serb').GetName]#yellow s#! since their arrival in the [GetStrategicRegion('region_balkans').GetName], yet have found itself ruled by foreign powers more often than not. This agreement finally seeks to write this historical wrong."
 turkfm_expeditions.012.a: "Give them a square deal."
 turkfm_expeditions.012.b: "Kotor belongs to the Empire."
 turkfm_expeditions.013.t: "Negotiations Over Cattaro" # Outcome
 turkfm_expeditions.013.d: "Pleased with their entrenchment as our [concept_overlord], the court at [SCOPE.sCountry('austria_scope').GetCapital.GetCityHubName] has approved of our requests for proper access to the Adriatic."
 turkfm_expeditions.013.f: "Kotor has been a home to the Montenegrins [GetCulture('serb').GetName]#yellow s#! since their arrival in the [GetStrategicRegion('region_balkans').GetName], yet have found itself ruled by foreign powers more often than not. This agreement finally seeks to write this historical wrong."
 turkfm_expeditions.013.a: "Kotor will finally come home."
 turkfm_expeditions.013.b: "This is a travesty."
 turkfm_expeditions.014.t: "The Gaols of Centinje"
 turkfm_expeditions.014.d: "Our captives of the Border Conflict languish in our prisons. Their fates rest of the whims of the [ROOT.GetCountry.GetRuler.GetName]."
 turkfm_expeditions.014.f: "While hardly members of the Sultan's household, these captives may still serve a political purpose."
 turkfm_expeditions.014.a: ""
 turkfm_expeditions.014.b: ""
 turkfm_expeditions.014.c: ""
 turkfm_expeditions.014.e: "Leave them be."
 turkfm_expeditions.015.t: "Montenegro Offers Ransom"
 turkfm_expeditions.015.d: "An "ambassador" from [SCOPE.sCountry('montenegro_scope').GetName] was granted an audience with the Sultan this morning. They have offered a ransom for a local noble held captive in Centinje."
 turkfm_expeditions.015.f: "While the captivity of any subjects of the Sultan is an embarrassment, the acceptance of such a bargain may cause worse damage to our reputation."
 turkfm_expeditions.015.a: ""Name your price.""
 turkfm_expeditions.015.b: ""Unacceptable. Begone!""
