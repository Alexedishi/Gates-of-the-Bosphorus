 turkfm_expeditions.030.t: "Tax Evasion"
 # Yoshi Commits Tax Fraud
 turkfm_expeditions.030.d: ""
 # Infamous libertarian and anti-government activist Yoshi has declared that Taxation is Theft and refused to pay his taxes. Why anyone cares is beyond me, given that he is a dinosaur and doesn't have a job.
 turkfm_expeditions.030.f: ""
 # Remember kids, Yoshi never paid his taxes and got pinched by the feds in the end. Now imagine what Danilo would do given the situation.
 turkfm_expeditions.030.a: "Perhaps we should delay our impositions on the tribes."
 # Throw Yoshi in Jail
 turkfm_expeditions.030.b: "We cannot tolerate this insult to our authority."
 # Let Yoshi Go Free
