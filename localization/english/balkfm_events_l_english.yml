 balkfm.130.t: "Insurgency in Niš"
 balkfm.130.d: "A group of [GetCulture('bulgarian').GetName] nationalists in [SCOPE.sState('southern_serbia_state_scope').GetName] recently incited an attempted rebellion against the [SCOPE.sCountry('ottoman_scope').GetName]. While they were quickly arrested by the local garrison, the Phanariot-dominated clergy have claimed responsiblity as a means to legitimize their claims of authority over these lands."
 balkfm.130.f: "Alleging non-compliance with the protections granted to them under the Gülhane Hatt-ı Şerif, Bulgarian nationalists have attempted to launch a Serbian-style rebellion in the #yellow Niš Eyalet#!."
 balkfm.130.a: "The Bulgarians should claim responsibility for the attack."
 balkfm.130.b: "Let the Greeks suffer the consequences."
 balkfm.131.t: "The Bulgarian Eagle"
 balkfm.131.d: "In support of the Bulgarian cause from abroad, revivalist Ivan Bogorov has begun the publication a pro-Bulgarian newspaper, the "Bulgarian Eagle," in Constantinople. Targeted for domestic consumption by the elites of the Queen of Cities, the paper aims to legitimize Bulgarian Nationalism amongst Ottoman intellectuals by portraying the day-to-day struggles of the Bulgarian people in a sympathetic fashion."
 balkfm.131.f: "The idea of the Bulgars as sub-section of the Rûm Millet is not a totally foreign one to the #bold Porte#!, but senior officials have voiced concerns that direct support or acknowledgement by the Eyalet administration may further destabilize the Empire."
 balkfm.131.a: "This is a noble cause."
 balkfm.131.b: "Suppress public knowledge of this paper."
 balkfm.136.t: "The Bulgarian Legion"
 balkfm.136.d: ""
 balkfm.136.f: ""
 balkfm.136.a: "We should support their efforts"
 balkfm.136.b: "Condemn these radicals."
 balkfm.137.t: "The Legion Strikes Again!"
 balkfm.137.d: ""
 balkfm.137.f: ""
 balkfm.137.a: "This is the will of the people."
 balkfm.137.b: "This is madness. Arrest them!"
 balkfm.138.t: "Great Powers Support Bulgaria"
 balkfm.138.d: "Years of tireless diplomacy have come to fruition with the Great Powers openly declaring their support for increased autonomy for the Bulgarian people."
 balkfm.138.f: "While their support comes with no guarantees of what form this autonomy would have, this nonetheless represents a tremendous step for the Bulgarian cause."
 balkfm.138.a: "[SCOPE.sCountry('russia_scope').GetName] will lead us to freedom."
 balkfm.138.b: "[SCOPE.sCountry('austria_scope').GetAdjective] power will safeguard our liberty."
 balkfm.138.tt1: "We will now be empowered to become #bold Bulgaria#!."
 balkfm.138.tt2: "#bold Russia#! will become inclined to support us."
 balkfm.138.tt3: "#bold Austria#! will become inclined to support us."
 balkfm.139.t: "Securing our Sovereignty"
 balkfm.139.d: "As the celebrations and jubilation for the rebirth of [ROOT.GetCountry.GetName] fade away, the conversation has turned to the question of overall structure of the new [ROOT.GetCountry.GetAdjectiveNoFlag] state. The Great Powers have balked at the idea of full autonomy, with a consesus forming around establishing a Principality in similar fashion to Serbia and the Romanian Principalities. Many candidates have been put forward, with a German noble, #yellow Alexander Joseph von Battenburg#! garnering the widest support."
 balkfm.139.f: "Popular opinion favors a native candidate, but foreign consuls have warned of implications towards foreign support should we put forward a disagreeable candidate."
 balkfm.139.1: "The young noble, #yellow Alexander of Battenburg#!, has the most widespread support."
 balkfm.139.1.tt: "This is the historical option."
 balkfm.139.2: "The diplomat #yellow Emmanuel Bogoridi#! is worthy of the title."
 balkfm.139.3: "The revivalist, #yellow Alexander Exarch#!, would be a worthy steward."
 
