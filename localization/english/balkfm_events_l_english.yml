 balkfm.660.t: "The Romanian Academy"
 balkfm.660.d: "In the interest of developing [ROOT.GetCountry.GetName], King [SCOPE.sCharacter('university_benefactor').GetFullName] has put forward a plan to open a native institution of higher learning in [SCOPE.sState('university_state').GetCityHubName]. This plan would represent a large expense for the state."
 balkfm.660.f: "The Academia Română was founded in Bucharest in 1866. Today, it serves as the authoritative institution on matters of Romania language, history, and culture."
 balkfm.660.a: "A noble endeavor."
 balkfm.660.b: "The cost is too great."
 balkfm.661.t: "A Royal Estate"
 balkfm.661.d: "After a tremendous effort, the #yellow Castelul Peleș#! has been completed in [SCOPE.sState('wallachia_state_scope').GetName]. Eager to legitimize his rule, [ROOT.GetCountry.GetRuler.GetFullName] has already begun moving his court into the complex."
 balkfm.661.f: ""Italians were masons, Romanians were building terraces, the Gypsies were coolies. Albanians and Greeks worked in stone, Germans and Hungarians were carpenters. Turks were burning brick. Engineers were Polish and the stone carvers were Czech. The Frenchmen were drawing, the Englishmen were measuring, and so was then when you could see hundreds of national costumes and fourteen languages in which they spoke, sang, cursed and quarreled in all dialects and tones, a joyful mix of men, horses, cart oxen and domestic buffaloes." -Queen Elisabeth of Wied"
 balkfm.661.a: "Wonderful."
 
 balkfm.670.t: "Forms Without Substance"
 balkfm.670.d: "The debate over Romanian identity has reached a fever pitch in the literary space. Scholar [SCOPE.sCharacter('balkfm_mairoescu_scope').GetFullName] has blasted the supposed "reckless" modernization of the Romanian state, claiming that liberalism has no basis in [ROOT.GetCountry.GetName] as it is a nation of peasants and landowners without an entrenched bourgeoisie class."
 balkfm.670.f: "Mairoescu and his supporters have gathered around a literary club "Junimea." Claiming to champion the true Romanian identity, they have become a focal point for Romanian conservatism between their demands for legislative regression and the rejection of an idealized Romanian past."
 balkfm.670.a: "But we've always been Romanian..."
 balkfm.671.t: "Etymologicum Magnum Romaniae"
 balkfm.671.d: "Accomplished Romanian historiographer, [SCOPE.sCharacter('balkfm_hasdeu_scope').GetFullName], has found himself the target of the #yellow Junimist#! movement following his latest publications regarding the Romanian language. Undaunted, he has pushed forward the narrative that the Romanian people have been and will continue to be the primary force of European innovation."
 balkfm.671.f: "Liberal thought in Romania has found its basis in a self-ascribed Romanian "pioneering spirit" that they claim has propelled Romanian primacy in history. Termed #yellow Dacianism#!, this school of thought suggests that Romanian people have been at the forefront of politics and science since the days of Roman Dacia. This is despite a conspicuous lack of evidence to support their claims."
 balkfm.671.a: ""Pioneering Spirit" indeed..."
 balkfm.672.t: "A Romanian Identity"
 balkfm.672.d1: "The triumph of the #yellow Junimist#! movement has laid the foundation for a unified Romanian identity. Striking a balance between the boyars and farmers who work their land, Romanians have come to see themselves as a people that have evolved through a fusion of Dacian agrarianism and Roman statesmanship."
 balkfm.672.d2: "The triumph of the #yellow Dacian#! movement has laid the foundation for a unified Romanian identity. Foregoing the imagined "shackles" of agrarianism, Romanians have been enthralled by the narrative that they are the heirs to a rich tradition of progress and innovation dating back to when the first Roman colonists set foot in what would become Roman Dacia."
 balkfm.672.f1: ""The only true social class is the Romanian peasant, and his reality is suffering. His sighs are caused by the fantasies of the upper classes, for it is out of his daily sweat, that the material means to support this fictitious structure we call Romanian culture are taken. And we force him to hand out the very last measure of himself in order to pay for our painters and musicians, the Academy and Atheneum members, and the literary and scientific awards wherever they are handed out. And we do not have, at the very least, the gratitude to produce a single artistic work that would for a moment raise his spirits and make him forget his daily misery." -T. Mairoescu"
 balkfm.672.f2: ""...in the cruel solitude to which I am condemned, only this colossal encyclopedia of the Romanian people, only the daily contact with the spirit of an entire nation, only the satisfaction that I alone do what even my enemies have admitted that it cannot do no one, only this saves me from the ugliness that would destroy me. In the words of a Roman emperor, I feel that I am becoming a god, and feeling it - I feel like laughing." - B. Hasdeu"
 balkfm.672.a: "[ROOT.GetCountry.GetName] will not abandon her roots."
 balkfm.672.b: "[ROOT.GetCountry.GetName] will pioneer a new future."
 
 balkfm.678.t: "The Imperial Standard"
 balkfm.678.d: "As the [GetCulture('romanian').GetName] people begin to understand themselves as a singular nation, many have begun to question [ROOT.GetCountry.GetName]'s role within the political landscape of Eastern Europe. With nationalism cementing itself among the populace, irredentist movers have declared that we are the only true successors to the #yellow Roman Empire#!."
 balkfm.678.f: ""We have secured our independence from our Greek, Russian, and Ottoman oppressors. Now we we must decide what our position will be within the fabric of the Balkan community.""
 balkfm.678.a: "We will reclaim the Imperial Throne!"
 balkfm.678.b: "The Empire is dead. We should leave it as such."
 balkfm.679.t: "The Queen of Cities"
 balkfm.679.d: "With the conquest of lands across the Bosphorus and the Dardanelles, the ancient imperial capital of Constantinople now lies within our control. The once-illusory dreams of reforging the Byzantine Empire have come to fruition. Our citizens now look to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to lead them into a new era."
 balkfm.679.f: "The ancient imperial capital of Constantinople now lies within our control. None can question the legitimacy of our claim to the Byzantine throne."
 balkfm.679.a: "Our armies will raise the Imperial standard once more!"
 
 balkfm.680.t: "Our Declaration of Union"
 balkfm.680.d: "By our strength and wits, we have taken the first steps in uniting the Romanian nation. The future beckons!"
 balkfm.680.f: "The reporter began writing the day's experiences down. "Nothing but the liveliest demonstrations of joy could be heard throughout the capital. It was the only show that could be seen on all the streets, on all the sidewalks, in all the public places of the city. Our peasant brothers were now shouting with all the energetic power of their souls: '#italic Long live the nation! Long live Romania!#!'"\n\nA single joyous tear rolled down his cheek. "Everyone threw themselves into each other's arms, regardless of their station, as if all, in general, had freed themselves from the most oppressive yoke.""
 balkfm.680.a: "Toți în unu!"
 balkfm.680.a.tta: "[SCOPE.sCountry('romania_lesser_partner').GetName] shall become the lesser member in a [concept_personal_union] with us."
 balkfm.680.a.ttb: "[SCOPE.sCountry('romania_lesser_partner').GetName] shall become our [concept_puppet]."
 balkfm.681.t: "Awaken Thee, Romanian!"
 balkfm.681.d: "Our union with [SCOPE.sCountry('romania_lesser_union_partner').GetName] is complete. Our bonds are solid, our will is unyielding—together, we are #bold Romania#!." 
 balkfm.681.d2: "Our union with [SCOPE.sCountry('romania_lesser_union_partner').GetName] and [SCOPE.sCountry('transylvania_union_partner').GetName] is complete. Our bonds are solid, our will is unyielding—together, we are #bold Romania#!."
 balkfm.681.f: ""Wake up, Romanians, from your sleep of death," roared the crowd.\n\n"Into which you've been sunk by the barbaric tyrants.\nNow or never, sow a new fate for yourself\nTo which even your cruel enemies will bow!"\n\nTricolors flapped in the wind. Children were being hoisted into the air to etch the moment into their memories. Together, people were singing a song they had never heard before, but knew the words in their hearts already."
 balkfm.681.a: "Unity through life and brotherhood through death!"
 balkfm.682.t: "Retrocession Granted"
 balkfm.682.d: "Following quick negotiations, [SCOPE.sCountry('romanian_bessarabia_owner').GetName] has agreed to cede a portion of Bessarabia to [ROOT.GetCountry.GetName]."
 balkfm.682.f: "Slowly, but surely, the dream of Romanian union will come to fruition."
 balkfm.682.a: "This is a great step for the [GetCulture('romanian').GetName] people!"
 balkfm.683.t: "Retrocession Denied"
 balkfm.683.d: "Negotiations for the return of Bessarabian lands to [ROOT.GetCountry.GetName] have failed. With this, the [GetCulture('romanian').GetName] people remain estranged by foreign borders."
 balkfm.683.f: "The Romanian people have long been prey to the imperial powers in the Balkans. This failure represents another continuation of their oppression."
 balkfm.683.a: "They will not stop the [GetCulture('romanian').GetName] cause."
 balkfm.684.t: "Union with Transylvania"
 balkfm.684.d: "Our union with [SCOPE.sCountry('transylvania_scope').GetName] is complete. Our bonds are solid, our will is unyielding—together, [ROOT.GetCountry.GetName] will not be denied!."
 balkfm.684.f: ""The lands named in the resolution of the Alba-Iulia National Assembly of the 18th of November 1918 are and remain forever united with the Kingdom of Romania." -Ferdinand I, 11 December 1918"
 balkfm.684.a: "One for All"
 balkfm.685.t: "Treaty of [SCOPE.sState('transylvania_capital_scope').GetCityHubName]"
 balkfm.685.d: "Following quick negotiations, [SCOPE.sCountry('transylvania_scope').GetName] has agreed to join the Greek state."
 balkfm.685.f: "Romanians in [SCOPE.sState('transylvania_capital_scope').GetName] fought for their freedom. It is only right that they rejoin the [ROOT.GetCountry.GetAdjective] family."
 balkfm.685.a: "[ROOT.GetCountry.GetName] will not be denied!"
 balkfm.686.t: "Romanian Agitation Abroad!" #ROM
 balkfm.686.d: "With our support, [GetCulture('romanian').GetName] radicals in Transylvania have begun organizing civil demonstrations across the state in the hopes of furthering the cause against [SCOPE.sCountry('austria_scope').GetAdjectiveNoFlag] oppression."
 balkfm.686.f: ""O! Holy Lord,\nOur Heavenly Father,\nExtend Your Hand\nOver the Romanian Country!""
 balkfm.686.a: "We will not stop until [ROOT.GetCountry.GetName] is whole."
 balkfm.687.t: "Romanian Agitation Against [ROOT.GetCountry.GetAdjective] Rule!" #AUS
 balkfm.687.d: "[GetCulture('romanian').GetName] radicals in Transylvania have provoked demonstrations across the state. They demand equal rights for all slavs within [ROOT.GetCountry.GetName]."
 balkfm.687.f: "While the situation on the streets is chaotic, initial suspicions have been directed at agitators from [SCOPE.sCountry('romania_scope').GetName]."
 balkfm.687.a: "This is not civil behavior."
 balkfm.688.t: "The Greater Romanian Lands"
 balkfm.688.d: "With the unification of the Principalities under a single state, a greater plan has come into vision: the unification of all [GetCulture('romanian').GetName] lands in #yellow Danubia#!."
 balkfm.688.f: ""The only future for [ROOT.GetCountry.GetName] is one where our entire nation is free and whole.""
 balkfm.688.a: "These lands are rightfully ours."
 balkfm.689.t: "The Reunification of Romania"
 balkfm.689.d: "From the Dniester to the Tisza, the dream of a whole and independent [ROOT.GetCountry.GetName] has been made reality."
 balkfm.689.f: ""Romanians!\n\nThe war which for the last two years has been encircling our frontiers more and more closely has shaken the ancient foundations of Europe to their depths.\n\nIt has brought the day which has been awaited for centuries by the national conscience, by the founders of the Romanian State, by those who united the principalities in the war of independence, by those responsible for the national renaissance.\n\nIt is the day of the union of all branches of our nation. Today we are able to complete the task of our forefathers and to establish forever that which Michael the Great was only able to establish for a moment, namely, a Romanian union on both slopes of the Carpathians...." \n-Proclamation by King Ferdinand, 28 August 1916"
 balkfm.689.a: "This is a wonderous day for [ROOT.GetCountry.GetName]!"
 
 balkfm.690.t: "[SCOPE.sCountry('transylvania_scope').GetName] Take Up Arms!" # Provocateur Event
 balkfm.690.d: "With our support, [GetCulture('Romanian').GetName] radicals in [SCOPE.sCountry('transylvania_scope').GetCapital.GetName] have seized control of the regional palace and declared the independence of [SCOPE.sCountry('transylvania_scope').GetName]. They have issued a call for international aid and recognition."
 balkfm.690.f: "While Transylvanian rebels have ejected the Austrian governors, they will desperately need international assistance if they are to stay safe from Austrian reprisal."
 balkfm.690.a: "All Romanians deserve their freedom."
 balkfm.691.t: "[SCOPE.sCountry('transylvania_scope').GetName] Take Up Arms!" # Target Event
 balkfm.691.d: "[GetCulture('Romanian').GetName] radicals in [SCOPE.sCountry('transylvania_scope').GetCapital.GetName] have seized control of the regional palace and declared the independence of [SCOPE.sCountry('transylvania_scope').GetName]. They demand immediate recognition by and independence from the [ROOT.GetCountry.GetAdjectiveNoFlag] administration."
 balkfm.691.f: "While we may not have immediate proof, our intelligence service reports that [SCOPE.sCountry('romanian').GetName] is directly responsible for funding and organizing this rebellion."
 balkfm.691.a: "Put them down!"
 balkfm.691.b: "Grant them autonomy."
 
 # Bosnia Events
 balkfm.700.t: "The Small Land of the Serbs"
 balkfm.700.d: "For centuries, [ROOT.GetCountry.GetName] has been subject to external powers from the Greeks to the Ottomans. Having earned their freedom, the [GetCulture('bosniak').GetName] can finally claim their own destiny."
 balkfm.700.f: ""
 balkfm.700.a: "[ROOT.GetCountry.GetName] will find its way."
 
 balkfm.790.t: "Tribal Conflicts"
 balkfm.790.d1: "A missive has arrived to inform us that our militias, led by our trusted warlord [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! have had their demands for Haraç rejected by [SCOPE.sCountry('montenegro_scope').GetName]."
 balkfm.790.d2: "In a shocking turn of events, a militia that approached [SCOPE.sCountry('montenegro_scope').GetName] to demand tribute has arrived with a different prize: the submission of the Price-Bishopric to [ROOT.GetCountry.GetName]."
 balkfm.790.f: "The [GetStrategicRegion('region_balkans').GetName] are no stranger to tribal violence. In the hinterlands, tribal feuds and customs often take precedence over the law of the Sultan."
 balkfm.790.a: "The Prince-Bishop will learn humility."
 balkfm.790.b: "They will serve us well."
 balkfm.791.t: ""
 balkfm.791.d: ""
 balkfm.791.f: ""
 balkfm.791.a: ""
 balkfm.792.t: "The Reordering Begins"
 balkfm.792.d: "Messengers have arrived from Constantinople to report the promulgation of the Edict of Gülhane. As the next phase of the Tanzimât, the Sultan has directed all members to carry out its imperatives towards modernization... regardless of any erosion of powers held by the nobility and governors."
 balkfm.792.f: "“If you apply Tanzimât in Bosnia Herzegovina, you will not be able to sustain them for even thirty years.” -Ali Pasha"
 balkfm.792.a: "We will join in this lofty goal."
 balkfm.792.b: "These plans are unreasonable."
 balkfm.793.t: "The Schemes of Smaïl-aga"
 balkfm.793.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has been disturbed by reports that the warlord [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! has been plotting to usurp the lordship of [ROOT.GetCountry.GetName] upon [ROOT.GetCountry.GetRuler.GetFirstName]'s death."
 balkfm.793.f: "In his rule over Bosnia, Ali Pasha has expropriated several"
 balkfm.793.a: "Perhaps we can arrange for an "accident...""
 balkfm.793.b: "He is irrelevant. Leave him be."
 balkfm.794.t: "The Arrogance of Smaïl-aga"
 balkfm.794.d: "In turning a blind eye to the threat posed by [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#!, we have exposed ourselves to his blind ambition as declared a rebellion against [ROOT.GetCountry.GetName]. The $turkfm_porte$ has remained silent, waiting to see the conflict's resolution."
 balkfm.794.f: "The highly decentralized nature of the [SCOPE.sCountry('ottoman_scope').GetName]" has aided it in asserting control over its broad landscape. However, individual Pashas, especially once influential, cooperate with or defy the $turkfm_porte$ and each other as their needs see fit."
 balkfm.794.a: "Perhaps we should have taken action..."
 balkfm.795.t: "Disruptive Influence"
 balkfm.795.d: "A communiqué arrived in [SCOPE.sState('northern_serbia_state_scope').GetCityHubName] this morning, suggesting that the Ottoman bey, [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! [SCOPE.sCharacter('smail_aga_scope').GetLastName], has conspired to usurp [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName] as Vizier of Herzegovina. Advisors to the Prince have warned this could endanger our Serb cousins in [SCOPE.sCountry('montenegro_scope').GetName]."
 balkfm.795.f: "The Prince-Bishop of #yellow Montenegro#! has found himself assailed by the political intrigue of the Porte, with his borders threatened by #yellow Ali Pasha#!. While we cannot act openly against other subjects of our Ottoman overlords, we could aid [SCOPE.sCharacter('montenegro_ruler_scope').GetFullName] in sowing discord in their ranks."
 balkfm.795.a: "Send the Pasha a letter."
 balkfm.795.b: "We do not deal in idle gossip."
 balkfm.796.t1: "Ali Pasha's Demise"
 balkfm.796.t2: "Ali Pasha Deposed"
 balkfm.796.d1: "The $turkfm_porte$'s justice came swiftly. Without warning, the vaunted [SCOPE.sCharacter('omer_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('omer_pasha_scope').GetLastName] arrived to restore control in [SCOPE.sCountry('hersek_scope').GetName]. Ali Pasha has been deposed and executed for asserting his autonomy, and the Sultan has declared his intent to restore central authority in [GetStateRegion('STATE_BOSNIA').GetName]."
 balkfm.796.d2: "The $turkfm_porte$'s justice came swiftly. Without warning, the vaunted [SCOPE.sCharacter('omer_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('omer_pasha_scope').GetLastName] arrived to restore control in [SCOPE.sCountry('hersek_scope').GetName]. Ali Pasha has been detained and removed from power for asserting his autonomy, and the Sultan has declared his intent to restore central authority in [GetStateRegion('STATE_BOSNIA').GetName]."
 balkfm.796.f: "A direct and loyal man, #yellow Ömer Pasha Lütfi#! has already established himself as a capable commander capable of navigating the powder-keg that is the Balkans. Dedicated to serving the Porte, Ömer Pasha has developed a reputation for bringing justice to the native nobility whenever their interests do not align that those of the $turkfm_porte$."
 balkfm.796.a: "Is the [ROOT.GetCountry.GetAdjectiveNoFlag] dream dead?"
 balkfm.796.b: "Good riddance!"
 balkfm.797.t: "The Lands of Montenegro"
 balkfm.797.d: "With both resolute leadership and the fierce spirit of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has brought the entirety of [GetStateRegion('STATE_MONTENEGRO').GetName] under the control of [ROOT.GetCountry.GetName]."
 balkfm.797.f: "After centuries of resisting invasions and imperialist designs, Montenegro has finally been brought to heel."
 balkfm.797.a: "[ROOT.GetCountry.GetRuler.GetFirstName] shall rule as a new Sultan!"
 balkfm.798.t: "Failed Ambitions"
 balkfm.798.d: "With the death of Ali Pasha has come the collapse of his ambitions for an independent Bosnia. While [ROOT.GetCountry.GetRuler.GetFullName] is motivated to rule, it is clear he lacks the deep connections of his father."
 balkfm.798.f: "“If we do not stop Omer Pasha now, Bosnia will not belong to Bosnians in 30 years.” -Ali Pasha, c.1850"
 balkfm.798.a: "[ROOT.GetCountry.GetName] must find its way."
 balkfm.799.t: "House Rizvanbegović of Bosnia"
 balkfm.799.d: "[ROOT.GetCountry.GetRuler.GetFullName]'s rebellion against the [SCOPE.sCountry('ottoman_scope').GetName] has succeeded. With the rise of his Sultanate comes a new era in the [GetStrategicRegion('region_balkans').GetName]."
 balkfm.799.f: "“There is a sultan in Istanbul, but I am the sultan in Mostar.” -Ali Pasha, 1841"
 balkfm.799.a: "[ROOT.GetCountry.GetName] will make its own way."
 
 # Albania Events
 balkfm.800.t: "The Children of the Eagles"
 balkfm.800.d: ""
 balkfm.800.f: ""
 balkfm.800.a: ""
 balkfm.800.b: ""
 
 # Croatia-Slovenia Events
 balkfm.900.t: "Illyrian Sentiment"
 balkfm.900.d: "The Habsburg Empire has contested control of Southeastern Europe against the [SCOPE.sCountry('ottoman_scope').GetName] successfully blocking [GetCulture('turkish').GetName] expansion into Central Europe. Before and during these conflicts, several #yellow #tooltip:[GetRawTextTooltipTag('balkfm_yug_cultures_tt')] Jugoslav#!#! peoples have come to call these lands home with many of them coming under Habsburg rule.\n\nAs #yellow Nationalism#! spreads across Europe, statesman [SCOPE.sCharacter('balkfm_metternich_scope').GetFullName] has identified increasing radicalism amongst the [GetCulture('croat').GetName] people as an emerging threat to the Empire."
 balkfm.900.f: ""A people without a nation\nIs like a body without bones."\n -Opening Motto of #italic Danica#!, 1835–1849"
 balkfm.900.a: "The Empire must remain indivisible."
 balkfm.901.t: "An Austro-Slavic Proposal"
 balkfm.901.d: "As #yellow Nationalist#! sentiments begin to take root across [ROOT.GetCountry.GetName], a [GetCulture('czech').GetName] statesman, [SCOPE.sCharacter('template_balkfm_borovsky_karel').GetFullName], has proposed an outlandish theory to resolve the ethnic stresses on the Empire. Termed #yellow Austrian Slavism#!, the plan envisions the reorganization of the Imperial kingdoms into federal units of a democratized state."
 balkfm.901.f: "The idea of a federated state under the Habsburg crown has quickly gained traction amongst several minorities across the Empire. However, it has found its largest detractors in the Hungarian court, which stands to lose control of several minority regions."
 balkfm.901.a: "This is a laudable proposal."
 balkfm.901.b: "We cannot reduce the power of the crown."
 balkfm.902.t: "Vienna Literary Agreement"
 balkfm.902.d: "Intellectuals from the [GetCulture('serb').GetName], [GetCulture('croat').GetName], and [GetCulture('slovene').GetName] have gathered in [ROOT.GetCountry.GetCapital.GetCityHubName] with the aim of unifying and potentially standardizing their literary languages. While no binding agreements were made, the consensus has been that the #yellow Shtokavian#! dialect should be the basis for a future standard."
 balkfm.902.f: ""There can only be one true literary language in Illyria... It is not found in a single place, or a single country, but in the whole of Illyria... Our grammar and our dictionary is the whole of Illyria. In that huge garden there are beautiful flowers everywhere: let us gather everything of the best in one wreath, which will never wither." -L. Gaj, 1835""
 balkfm.902.a: "What a curious exercise."
 
 balkfm.909.t1: "The Croatian–Hungarian Settlement"
 balkfm.909.t2: "The Austro-Croatian Compromise"
 balkfm.909.d1: "The state has succeeded in striking a balance with the [GetCulture('croat').GetName] people. For generations to come, they will play a role in shaping the future of the state."
 balkfm.909.d2: "The situation in Croatia has begun to boil over as politician leaders have met to demand recognition of the [GetCulture('croat').GetName] people. Should we refuse their calls we risk open rebellion against the state."
 balkfm.909.f1: "While far from true independence for the for Croatia, this action has provided solid guardrails against future abuses by the Austro-Hungarian establishment."
 balkfm.909.f2: "Both Imperial and local officials have rushed to [ROOT.GetCountry.GetCapital.GetCityHubName] to warn the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of the organization of [GetCulture('croat').GetName] separatist movements in the south. With luck, we may be able to strike a compromise with them before violence breaks out."
 balkfm.909.a1: "Croatia is an inseparable part of the Empire."
 balkfm.909.a2: "They shall handle their own affairs."
 balkfm.909.a3: "We must accept the settlement."
 balkfm.909.a4: "[ROOT.GetCountry.GetNameNoFormatting] is [ROOT.GetCountry.GetAdjectiveNoFormatting] first!"
 balkfm.909.b1: "Croatia is an inseparable part of the Empire."
 balkfm.909.b2: "They shall handle their own affairs."
 balkfm.909.b3: "We must accept the compromise."
 balkfm.909.b4: "[ROOT.GetCountry.GetNameNoFormatting] is [ROOT.GetCountry.GetAdjectiveNoFormatting] first!"

 
 balkfm.980.t: "The Triune Dream"
 balkfm.980.d: "With the Independence of [ROOT.GetCountry.GetName], an irredentist desire has begun to spread amongst our citizens to incorporate all people of the former #yellow Triune Kingdom#! under a single state."
 balkfm.980.f: ""We have cast aside centuries of Imperial rule to bring [ROOT.GetCountry.GetName] into being. Yet it is not enough. Many of our countrymen still live under the oppressive yoke of foreign rule, yearning for a country they can call their own.""
 balkfm.980.a: "We cannot leave our countrymen to suffer."
 balkfm.981.t: "Restoration of the Triune Kingdom"
 balkfm.981.d: "With the liberation of lands of the Triune crown, the dream of a reborn [ROOT.GetCountry.GetName] have come to fruition. Our citizens now look to the state to lead them into a new era."
 balkfm.981.f: "A new day dawns, and a new nation rises to the world stage. [ROOT.GetCountry.GetAdjectiveNoFormatting] glory is the inevitable future."
 balkfm.981.a: "We will raise the [ROOT.GetCountry.GetAdjective] banner high!"
 