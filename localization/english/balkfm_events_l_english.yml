 balkfm.512.t: "Strategic Demands"
 balkfm.512.d: "The Treaty of Berlin established the limited Bulgarian state. Amongst its stipulations were requirements that [ROOT.GetCountry.GetName] establish a strategic rail network linking Turkish and Ottoman lands as part of a large Orient Line vision. Additionally, the British have imposed a demand that the state purchase the Rusé-Varna railway as recompense for their losses in the region."
 balkfm.512.f: "Since its inception, the Great Powers have hoped to position Bulgaria as a western beachhead in the Ottoman sphere. Despite desires to bring all aspects of transportation under state control, some fear this may compromise the Powers' support for the Bulgarian nation."
 balkfm.512.a: "We have no future without rail."
 balkfm.513.t: "Extortionate Pricing"
 balkfm.513.d: "After an inflammatory session in the National Assembly, [ROOT.GetCountry.GetName] has made good on its obligations regarding the Rusé-Varna line."
 balkfm.513.f: "The delay between the ratification of the Treaty of Berlin and the purchase of the rail, the English operators of the rail have taken their chance to extort the highest value possible from the Bulgarian state."
 balkfm.513.a: "A prudent choice, regardless of price."
 balkfm.514.t: "The Bulgarian Railways"
 balkfm.514.d: "The completion of a rail network across [ROOT.GetCountry.GetName] has finally given us a definitive link to the European world. We can only hope that this will help us in the push for independence from the [SCOPE.sCountry('ottoman_scope').GetName]."
 balkfm.514.f: "The construction of several railways in Bulgaria is essential to the strategic designs of the Russian and Austria Empires. It has also allowed for the completion of the Orient Express, linking Paris as far as Constantinople."
 balkfm.514.a: "With this, our future is secured."
 balkfm.515.t: "Royal Entourage"
 balkfm.515.d: "With approval from the Tsar's court, Prince [ROOT.GetCountry.GetRuler.GetFirstName] has made preparations to for his journey to [SCOPE.sCountry('russia_scope').GetName]. However, before departure a missive arrived indicating that the Sultan, [SCOPE.sCountry('ottoman_scope').GetRuler.GetFullName] wishes to meet with the Prince."
 balkfm.515.f: "While the Sultan has been less than helpful towards the Prince, many advisors recommend that the Prince make the journey to Constantinople. The Prince himself has considered that this may be a good chance to pay visits to several neighbors in the Balkans before heading on to Moscow."
 balkfm.515.a: "We should pay respect."
 balkfm.515.b: "We make for Russia."
 balkfm.516.t: "A Warm Reception"
 balkfm.516.d: "Despite his apprehensions, [ROOT.GetCountry.GetRuler.GetFirstName] was received warmly by the Sultan. Instead of short, cold exchanges, the Prince has been welcomed with mirth and granted stately decorations. [SCOPE.sCharacter('ottoman_ruler_scope').GetFullName] clearly seeks to quell the separatist tide sweeping across [ROOT.GetCountry.GetName]."
 balkfm.516.f: "The conduct of the Sultan has surprised the Prince and his entourage. The Sultan has given polite and attentive responses to requests by the Prince for Bulgaria, approving most and declining a few with the utmost respect. The Sultan has gone as far as awarding the Prince with the Order of Osmanieh, the second-highest order in the Empire."
 balkfm.516.a: "What a generous surprise!"
 balkfm.517.t: "A Cautious Welcome"
 balkfm.517.d1: "Prince [ROOT.GetCountry.GetRuler.GetFirstName] has been welcomed with distrust at the court in Athens. While no disrespect was made by King [SCOPE.sCharacter('greece_ruler_scope').GetFullName], it is clear that he does not share the Prince's pan-Balkan aspirations."
 balkfm.517.d2: "Prince [ROOT.GetCountry.GetRuler.GetFirstName] received a warm welcome in the Greek court. After concluding formalities, King [SCOPE.sCharacter('greece_ruler_scope').GetFullName] made several overtures in the hopes of securing a Greek ally in the Balkans. The King has further committed to seeking cooperation on the Macedonian Question."
 balkfm.517.f: "Relations between the Balkan peoples have always been fraught with discord. With national borders poorly defined and populations heavily mingled in the major cities, every irredentist movement has been met with dismay by those who would find themselves estranged from their own nation."
 balkfm.517.a: "This is unfortunate."
 balkfm.517.b: "This is fortuitous."
 balkfm.518.t: "The Black Mountain"
 balkfm.518.d1: "The clear air and peaceful environs of the Montenegrin lands warm the heart of any visitor. After friendly reception by [SCOPE.sCharacter('montenegro_ruler_scope').GetFullName], the Montenegrin court has offered the Prince the hand of one of the royal princesses in the hopes of cementing a bond between the two nations."
 balkfm.518.d2: "The clear air and peaceful environs of the Montenegrin lands warm the heart of any visitor. After friendly reception by [SCOPE.sCharacter('montenegro_ruler_scope').GetFullName], the conversation turned towards the decline of the Porte. While no concrete promises were made, the two agreed that the Balkans must stand together against the Turks."
 balkfm.518.f: "[SCOPE.sCountry('montenegro_scope').GetName] has held its own against the Ottomans for centuries. However, as the Porte seeks to assert control over the Balkans, it has found itself assailed on all sides. With this state of affairs, the Prince-Bishop has pushed to establish strong relations with the other Balkan nations."
 balkfm.518.a: "The Prince would be honored."
 balkfm.518.b: "We cannot commit the Prince so easily."
 balkfm.518.c: "May this be the start of a strong friendship."
 balkfm.519.t: "The Tsar's Court"
 balkfm.519.d: "Prince [ROOT.GetCountry.GetRuler.GetFirstName] was absolutely apoplectic when, on his arrival in Moscow, he found none other than #yellow Nikola Suknarov#!, the Mayor of Sofia, claiming to be at the head of a Bulgarian delegation to the Tsar. The enraged Prince stands at a crossroads of how to confront this situation."
 balkfm.519.f: "In his attempts to undermine Bulgarian independence, #yellow General Sobolev#! sent a second delegation directly to Moscow. This has had the intended effect of embarrassing the Bulgarian state abroad. After storming into the Tsar's halls the Prince has demanded an audience before the Tsar and been surprised with a personal meeting with the Emperor himself."
 balkfm.519.a: "Demand #yellow Sobolev#! be punished."
 balkfm.519.b: "Try to make amends."
 
 balkfm.520.t: "An Elected Prince"
 balkfm.520.d: "The search for a new prince to lead the Bulgarian state has been fraught with political intrigue as a torrent of diplomats descended on the National Assembly. The regency council, led by [ROOT.GetCountry.GetRuler.GetFullName], appears to have found a candidate acceptable to the international community."
 balkfm.520.f: "Following the ejection of Prince #yellow Battenburg#! from [ROOT.GetCountry.GetName] the custodian government was quickly approached by diplomats from [SCOPE.sCountry('russia_scope').GetName] and [SCOPE.sCountry('ottoman_scope').GetName] demanding the National Assembly rubber stamp their choice for the throne."
 balkfm.520.1: "The young prankster, Ferdinand Maximilian, is most acceptable."
 balkfm.520.2: "The Georgian Prince, Nikoloz Dadiani, would bring a fine pedigree."
 balkfm.520.3: "The former governor of #yellow Roumelia#!, Alexander Bogoridi, would understand us well."
 balkfm.520.4: "The Danish Prince, Valdemar of Glucksburg, shows the most promise."
 balkfm.520.5: "The Prussian, Goltz Pasha, has proven his value to the [ROOT.GetCountry.GetPowerBloc.GetName]."
 balkfm.521.t: "A Foreigner in Sofia"
 balkfm.521.d1: "[ROOT.GetCountry.GetRuler.GetFullName] is no doubt a strange choice for [ROOT.GetCountry.GetName]. Raised in Vienna and groomed for a life amongst the German nobility, the young [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] knows little of the country he is poised to rule. At his father's behest, a cadre of tutors has accompanied him to aid with him learning the [GetCulture('bulgarian').GetName] language."
 balkfm.521.d2: "[ROOT.GetCountry.GetRuler.GetFullName] is no doubt a strange choice for [ROOT.GetCountry.GetName]. Raised in Zugdidi and groomed for a life as a minor vassal to the Russian tsar, the young [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] knows little of the country he is poised to rule. At his council's behest, a cadre of tutors has accompanied him to aid with him learning the [GetCulture('bulgarian').GetName] language."
 balkfm.521.f: ""He spoke in French with his mother and diplomats; in German to his brother and to the servants; he swore in Hungarian, and boasted in English and Italian." - D. Gancheff, tutor to the Prince, 1887"
 balkfm.521.a: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] should speak the language of the people."
 balkfm.521.b: "The vulgar tongue is beneath the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 balkfm.522.t: "Legitimizing the King"
 balkfm.522.d: "As [ROOT.GetCountry.GetRuler.GetFirstName] settles into his throne, he has found himself vexed by his position: while he may occupy the throne of [ROOT.GetCountry.GetName] he lacks legal recognition from his fellow monarchs and has found himself dependent on statesman [SCOPE.sCharacter('stambolov_scope').GetFullName] to defend his position as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 balkfm.522.f: ""The Prince has recently thrown himself entirely into the arms of Mr. Stamboloff. The stiff, unbending character of the Prime Minister became abhorrent to the Prince quite some time ago.... Had he following his own autocratic leanings, he would have got rid of the 'kingmaker' long ago." -Austrian diplomatic communiqué, 1887"
 balkfm.522.a: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must secure the throne."
 balkfm.523.t: "Military Conciliation"
 balkfm.523.d: "Since his arrival in [ROOT.GetCountry.GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been dogged by fears of a potential #yellow Battenburg#! restoration. In a meeting at the hills of Slivnitsa, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has extended an olive branch to the leaders of the revolt against the former [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Seeking amnesty, the [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName] have renounced any support for House #yellow Battenburg#! and pledged their allegiance to House [ROOT.GetCountry.GetRuler.GetLastName]."
 balkfm.523.f: ""I sincerely thank Your Highness for Your sentiments: I have no doubt that the army which I created and led to victory will always support Your Highness in Your endeavours for a happy and flourishing Bulgaria." -Alexander Battenburg, to Prince Ferdinand, 1887"
 balkfm.523.a: "Grant them amnesty, we will need their strength."
 balkfm.523.b: "We cannot trust these renegades."
 balkfm.524.t: "Military Insufficiency"
 balkfm.524.d: "Despite it's independence from Ottoman administration, [ROOT.GetCountry.GetName]'s army is fundamentally an Ottoman one. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has proposed changes that would seek to modernize the Bulgarian army."
 balkfm.524.f: ""Unfortunately, I am short of weapons and ammunition. If really necessary, we could mobilize 130,000 men, but about 80,000 of them would not even be partly armed. Who can give me arms at this moment? My success, the creation of a stable, peaceful Bulgaria, is the key to solving the Eastern Question..." - Kynaz Ferdinand, to Crown Prince Rudolf, 1887"
 balkfm.524.a: "We should invest in the army."
 balkfm.524.b: "They can make do with what they have."
 balkfm.525.t: "The Bulgarian Army"
 balkfm.525.d: "With a tremendous effort, the [ROOT.GetCountry.GetAdjective] army has reformed itself into a force capable of defending our newly-won independence."
 balkfm.525.f: "With this force, we will defend our freedom."
 balkfm.525.a: "[ROOT.GetCountry.GetName] will not be denied!"
 balkfm.526.t: "The Panitsa Plot"
 balkfm.526.d: "[SCOPE.sCharacter('stambolov_scope').GetFullName] has come with difficult news: the internal service has uncovered a plot by a disgruntled Macedonian, army Major #yellow Kosta Panitsa#! to lead a Battenburgist Restoration to remove [ROOT.GetCountry.GetRuler.GetFirstName] from the throne. Much to the shock of the court, nearly half of the military was in on the plot despite previous attempts at making amends."
 balkfm.526.f: "While most of Panitsa's supporters are at worst ambivalent to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], many have seized on the opportunity to install a revanchist regime to reassert Bulgarian dominance in Macedonia."
 balkfm.526.a: "Panitsa will face the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s justice."
 balkfm.526.b: "Banish these traitors from Bulgaria."
 balkfm.527.t: "Funerary Politics"
 balkfm.527.d: "Duke #yellow Ernest II#!, the head of House Coburg, has died. As the many relatives arrive in [SCOPE.sCountry('prussia_scope').GetName] for the services, a diplomatic dispute has developed over whether [ROOT.GetCountry.GetRuler.GetFirstName] should be allowed to appear in full dress or civilian dress."
 balkfm.527.f: "Despite being elected by the Sobranije, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s lack of diplomatic recognition has caused friction abroad, with diplomats avoiding mention of the topic to avoid upsetting the balance in the Balkans. In the face of this, both the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] and his advisors have resolved that [ROOT.GetCountry.GetRuler.GetFirstName] should present himself in full dress in support of [ROOT.GetCountry.GetName]"
 balkfm.527.a: "We should respect this request."
 balkfm.527.b: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] shall appear in full regalia."
 balkfm.528.t: "The House of Bulgaria"
 balkfm.528.d: "The citizens of the capital were abruptly awoken this morning to the sound of a 101-gun salute announcing the birth of [ROOT.GetCountry.GetHeir.GetFirstName] of Tirnovo. The timely arrival of an heir to the throne has silenced many critics [ROOT.GetCountry.GetRuler.GetFirstName]'s right to rule."
 balkfm.528.f: ""One God, one ruler, one Fatherland""
 balkfm.528.a: "At last, House [ROOT.GetCountry.GetRuler.GetLastName] is secure."
 balkfm.529.t: "Severed Hands"
 balkfm.529.d: "Early this morning, the papers were blazoned with the headlines that [SCOPE.sCharacter('stambolov_scope').GetFullName] was viciously assaulted by a group of Macedonian extremists in retaliation for a series of provocative anti-Macedonian articles published following his dismissal. So savage was the attack that doctors were forced to amputate his hands, yet physicians have reported he will not last the week."
 balkfm.529.f: ""Was it not I who made you Prince of Bulgaria? And in consequence I have borne the responsibility of your mistakes." - S. Stamboloff to Prince Ferdinand, 1894"
 balkfm.529.a: "What a gruesome outcome."
 
 balkfm.530.t: "The Bulgarian Academy"
 balkfm.530.d: "In the interest of developing [ROOT.GetCountry.GetName], King [SCOPE.sCharacter('university_benefactor').GetFullName] has put forward a plan to open a native institution of higher learning in [SCOPE.sState('university_state').GetCityHubName]. This plan would represent a large expense for the state."
 balkfm.530.f: "In it's time under direct Ottoman rule, the Bulgarian people have been cut off from the innovations of the West. Establishing a proper system for higher education will remedy this situation."
 balkfm.530.a: "A noble endeavor."
 balkfm.530.b: "The cost is too great."
 balkfm.531.t: "Royal Recognition"
 balkfm.531.d: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s steady efforts have culminated in the general recognition of his sovereignty over [ROOT.GetCountry.GetName]. Slowly, but surely, letters and missives of congratulation and support have trickled in from monarchs across Europe."
 balkfm.531.f: ""What I have done was imposed on me by my duty towards my beloved people... The sacrifice I have made to the Fatherland is so great.... For Bulgaria's happiness and prosperity I have pledged my own son and by doing so loosened the bands of my family and torn the ties that bound me to the West. In return I do not ask my beloved people for noisy ovations or for hypocritical homage, but merely for their respect and confidence in me." -Ferdinand I, to the Sobranije, 1887"
 balkfm.531.a: "All Hail [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]!"
 balkfm.531.b: "[SCOPE.sCharacter('stambolov_scope').GetFullName] deserves all credit."
 balkfm.531.c: "This is a great day for [ROOT.GetCountry.GetName]."
 balkfm.532.t: "Spring in Constantinople"
 balkfm.532.d: "In celebration of his recognition as the true monarch of [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has untaken a tour of nearby capitals as befits a sovereign ruler. Following a warm reception and dinner with the Sultan [SCOPE.sCountry('ottoman_scope').GetRuler.GetFullName] in Constantinople, [ROOT.GetCountry.GetRuler.GetFirstName] has been showered with decorations befitting his status as a nominal subject of the Porte. Festivities aside, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has found himself enchanted by the incredible glamour and legacy of the ancient Queen of Cities."
 balkfm.532.f: ""....And so, while the Sultan's officer, glued to his door, was watching me with an air of speechless stupefaction, I took my cane and pushed back one of the mats covering the floor. I this disclosed the slab of porphyry on which the Baselius Justinian planted his feet, shod in the imperial purple. And I too, I too, set my feet on the slab of porphyry!" -Ferdinand I, regarding his visit to the Hagia Sophia, 1896"
 balkfm.532.a: "[ROOT.GetCountry.GetName] will not be denied!"
 
 balkfm.560.t: "Threats of Schism"
 balkfm.560.d: "The Ecumenical Patriarch, backed by the authority of the Sublime Porte, has denounced the Bulgarian bishopry as schismatic, threatening to cut ties between [ROOT.GetCountry.GetName] and the Mother Church unless we return to submission under Constantinople."
 balkfm.560.f: "The actions of the Bulgarian ecclesiarchy, both in seeking a firman by the Sultan and by voicing their intent of unilaterally declaring autocephaly, have caused outrage across the Orthodox world. Accusations have been made that the Bulgarian state has prioritized politics over the wellbeing of the faithful."
 balkfm.560.a: "This will insulate the Church from Ottoman meddling."
 balkfm.560.b: "We cannot divide the Church over politics."
 balkfm.561.t: "DUMMY"
 balkfm.561.d: "DUMMY"
 balkfm.561.f: "DUMMY"
 balkfm.561.a: "DUMMY"
 balkfm.562.t: "Ecclesiastic Hostility"
 balkfm.562.d: "During a recent a stay at a convent near Kalofer, [ROOT.GetCountry.GetRuler.GetFirstName] was accosted by Metropolitan [GetInterestGroupVariant('ig_devout',GetPlayer).GetLeader.GetLastName], who wasted no time in reminding the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of his "duties" to the Russian Tsar and denouncing his ongoing commitment to the [GetReligion('catholic').GetName] faith."
 balkfm.562.f: "While [GetInterestGroupVariant('ig_devout',GetPlayer).GetLeader.GetLastName] was removed from the convent, rumors abound that the Metropolitan has taken "gifts" from the Russian foreign ministry."
 balkfm.562.a: "Depose this grifter and strip him of his titles."
 balkfm.562.b: "Perhaps [ROOT.GetCountry.GetRuler.GetFirstName] should learn more of the [GetReligion('orthodox').GetName] faith."
 balkfm.563.t: "An Orthodox Heir"
 balkfm.563.d: "[ROOT.GetCountry.GetName] is an [GetReligion('orthodox').GetName] nation, yet [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] follows the [ROOT.GetCountry.GetRuler.GetReligion.GetName] faith. This has come to a head with political leaders declaring that they will only recognize [SCOPE.sCharacter('eocfm_heir_scope').GetFirstName] as heir if he converts to the faith. Despite efforts by the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to secure international support for conversion, the [GetReligion('catholic').GetName] powers have voiced vicious opposition to the idea."
 balkfm.563.f: ""If you deliver your son into schism, you are excommunicate ipso facto!" -Pope Leo XIII to Prince Ferdinand, 1896"
 balkfm.563.a: "The entire royal family will join the  Eastern Church."
 balkfm.563.b: "The heir, [SCOPE.sCharacter('eocfm_heir_scope').GetFirstName], shall be baptised as [GetReligion('orthodox').GetName]."
 balkfm.563.c: "This is nonsense, House [ROOT.GetCountry.GetRuler.GetLastName] is a [GetReligion('catholic').GetName] family."
 balkfm.564.t: "Restoring the Exarchate"
 balkfm.564.d: "The Bulgarian churches are assaulted on all sides by the influence of the Phanariotes and overtaxation by the Porte. Church leaders have begun a desperate fight to revive the #yellow Exarchate of Bulgaria#!, the ancient [Concept('concept_autocephaly','$concept_autocephalous$')] church of the #yellow Bulgarian Empire#!, as a means to defend our national identity."
 balkfm.564.f: ""Meanwhile the Turk wins by craft more than by force, and snatches away Christ by fraud out of the hearts of men. For the Turk, it is true, at the present time compels no country by violence to apostatise; but he uses other means whereby imperceptibly he roots out Christianity...""
 balkfm.564.a: "The Bulgarian people must take a stand."
 balkfm.565.t: "OPEN"
 balkfm.565.d: ""
 balkfm.565.f: ""
 balkfm.565.a: ""
 balkfm.566.t: "OPEN"
 balkfm.566.d: ""
 balkfm.566.f: ""
 balkfm.566.a: ""
 balkfm.567.t: "OPEN"
 balkfm.567.d: ""
 balkfm.567.f: ""
 balkfm.567.a: ""
 balkfm.568.t: "OPEN"
 balkfm.568.d: ""
 balkfm.568.f: ""
 balkfm.568.a: ""
 balkfm.569.t: "The Exarchate of Bulgaria"
 balkfm.569.d: "In recognition of our efforts, Sultan [SCOPE.sCountry('ottoman_scope').GetRuler.GetFirstName] has granted our request for self-government in ecclesiastic affairs. Exercising authority, he has promulgated a firman delineating our independence from the Ecumenical Patriarchate, completely bypassing our need to interact with the Greek church."
 balkfm.569.f: ""...But in spite of all this we observed with regret the disputes and controversies which contrary to our good will, have lately arisen between the Bulgarians of the Orthodox faith and the Greek Patriarchate, i.e. concerning the relations between the Bulgarian archbishops, bishops, priests, the Bulgarian Church and the Patriarchate. A special spiritual jurisdiction shall be established under the name of Bulgarian Exarchate..." -Sultan Abdülaziz's Firman Establishing the Bulgarian Exarchate, 28 February 1870"
 balkfm.569.a: "This is a great day for the [GetCulture('bulgarian').GetName] people."
 
 balkfm.570.t: "The Two Bulgarias"
 balkfm.570.d: "[ROOT.GetCountry.GetName] exists as a technicality: a legal fiction meant to cleave the [GetCulture('bulgarian').GetName] people in twain. Its existence is a travesty which represents the failures of the West to support the Bulgarian struggle for true self-determination. Yet, the dream of Bulgaria unification burns stronger than ever. All that remains is for us to seek union with [SCOPE.sCountry('bulgaria_scope').GetName] regardless of the will of the Sultan."
 balkfm.570.f: ""We shall set up a rickety sort of Turkish rule again south of the Balkans. But it is a mere respite. There is no vitality left in them." -Lord Salisbury, 1878"
 balkfm.570.a: "[ROOT.GetCountry.GetName] will find its way to union."
 balkfm.571.t: "Governor-General Appointed"
 balkfm.571.d: "The term of our current Governor-General has come to an end. Per the stipulations of the Treaty of Berlin, the Sultan has appointed a new Governor-General who is at least mostly palatable to both [ROOT.GetCountry.GetName] and the international community at large."
 balkfm.571.f: "With our governance bound so tightly to the Sultan, we might has well answer directly to the Ottoman court."
 balkfm.571.a: "So be it."
 
 balkfm.577.t: "Bulgarian Agitation in Rumelia!"
 balkfm.577.d: "[GetCulture('bulgarian').GetName] insurrectionists in [SCOPE.sState('northern_thrace_state_scope').GetName] have sparked a series of riots across the region. While they have been unable to seize political control, Bulgarians across the state have demanded increased autonomy and union with [SCOPE.sCountry('bulgaria_scope').GetName]."
 balkfm.577.f: ""The one road, leads to Philippopolis, and as far further as God may lead, the other to the Danube and Darmstadt." -S.Stamboloff, in counsel to Prince Battenburg, 1885"
 balkfm.577.a: "This is an afford to international order."
 balkfm.577.b: "We will not abandon our brothers!"
 balkfm.578.t: "Eastern Rumelia Rebels!"
 balkfm.578.d: "With direct aid from [SCOPE.sCountry('bulgaria_scope').GetName], separatists have seized the government offices in [SCOPE.sCountry('rumelia_scope').GetCapital.GetCityHubName] and proclaimed the Principality of [SCOPE.sCountry('rumelia_scope').GetName]. They have wasted little time in declaring their independence from [SCOPE.sCountry('ottoman_scope').GetAdjective rule and are determined to seek union with the Bulgarian state."
 balkfm.578.f: "With their emotions in a frenzy, the rebels have announced their intent to crown [SCOPE.sCountry('bulgaria_scope').GetRuler.GetFullName] the "Prince of North and South Bulgaria.""
 balkfm.578.a: "We must support our countrymen!"
 balkfm.578.b: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] will crush these ingrates!"
 balkfm.578.c: "We are in no position to escalate this conflict."
 balkfm.579.t: "Union with Bulgaria"
 balkfm.579.d: "[Root.GetCountry.GetCapital.GetCityHubName] erupted with cheers this morning on the news that the Rumelian puppet government has been overthrown and a union established between [ROOT.GetCountry.GetName] and [SCOPE.sCountry('bulgaria_scope').GetName]. While we remain under Ottoman suzerainty, this is the first step in restoring the Bulgarian state."
 balkfm.579.f: ""Brothers! The hour of our Union has struck. The foreign government which has oppressed Roumelia for six years is overthrown. In it's place is proclaimed her union with the Principality of [ROOT.GetCountry.GetNameNoFlag], under the sceptre of the Bulgarian Prince, [ROOT.GetCountry.GetRuler.GetFullName]!" - Major D. Nikolaev, 1885"
 balkfm.579.a: "This is a great day for the [GetCulture('bulgarian').GetName] people!"
 
 balkfm.580.t: "Dreams of the Tsardom"
 balkfm.580.d: "[ROOT.GetCountry.GetName] may be reborn, but it exists only as a shadow of its full potential. To the west and south, our countrymen still live under the Ottoman thumb. Both the Prince and leaders in the National Assembly have demanded further concessions be made to the Bulgarian state."
 balkfm.580.f: "Historical Note: The 1878 Treaty of San Stefano had originally provided for extreme gains in favor of the newly formed Bulgarian state. Months later, the vast majority of these conquests were reversed in the Treaty of Berlin which favored recognition of Serbia, Montenegro, and Romania. This left Bulgaria with only its lands north of the Balkan mountains and the remainder within East Rumelia with both under Ottoman suzerainty."
 balkfm.580.a: "We cannot abandon our brothers."
 balkfm.581.t: "The Tophane Agreement"
 balkfm.581.d: "[SCOPE.sState('bulgaria_capital_scope').GetCityHubName] erupted with cheers this morning on the news that the Rumelian puppet government has been overthrown and a union established between [ROOT.GetCountry.GetName] and [SCOPE.sCountry('rumelia_scope').GetName]. While we remain under Ottoman suzerainty, this is the first step in restoring the Bulgarian state."
 balkfm.581.f: ""Brothers! The hour of our Union has struck. The foreign government which has oppressed Roumelia for six years is overthrown. In it's place is proclaimed her union with the Principality of [ROOT.GetCountry.GetNameNoFlag], under the sceptre of the Bulgarian Prince, [ROOT.GetCountry.GetRuler.GetFullName]!" - Major D. Nikolaev, 1885"
 balkfm.581.a: "This is a great day for [ROOT.GetCountry.GetName]."
 balkfm.582.t: "An Independent Bulgaria"
 balkfm.582.d: "In a rousing Proclamation in the Church of the Forty Martyrs, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has sent shock-waves across the Balkan world by declaring the both the independence of [ROOT.GetCountry.GetName] and the annexation of East Rumelia. Since the Treaty of Berlin, the suzerainty of the Ottoman Empire has been little more than a pretentious illusion. The Bulgarian state has ruled itself with its own laws and customs, and, with this act, the legal fiction binding us to the [SCOPE.sCountry('ottoman_scope').GetName] has been cast to the wind."
 balkfm.582.f: ""The West has pronounced its anathema on me, the dawn of the East shines its rays on my dynasty and brightens our future!" -Ferdinand I, to the Sobranije, 1887"
 balkfm.582.a: "[ROOT.GetCountry.GetName] will triumph."
 balkfm.583.t: "Bulgarian Irredentism"
 balkfm.583.d: "The miracle of union with Eastern Rumelia has brought the original goals of the Treaty of San Stefano back into focus. As nationalist fervor grips [ROOT.GetCountry.GetName], the most ardent believers demand that all Bulgarians should live under our flag."
 balkfm.583.f: "Ever since their arrival in the Balkans, Bulgarian communities have reached from the banks of the Danube to the shores of the Aegean. The partition of the Bulgarian nation is a legal fiction that we will redress!"
 balkfm.583.a: "These are Bulgarian lands."
 balkfm.583.b: "We cannot anger the Great Powers."
 balkfm.584.t: "The Tsardom of Bulgaria"
 balkfm.584.d: "With the lands of Greater Bulgaria well within our control, [ROOT.GetCountry.GetName] has reclaimed the lands held by the Bulgarian Empires of old."
 balkfm.584.f: "From 681 to 1018 and again from 1185 to 1396 the Bulgarian Empire dominated the northern Balkans, many times even extracting tributes and concessions from the Byzantine Emperors."
 balkfm.584.a: "The Bulgarian state will rule the Balkans."
 balkfm.584.b: "We should be proud of what we've accomplished."
 balkfm.585.t: "The Future of [ROOT.GetCountry.GetName]"
 balkfm.585.d: "Our latest conquests have secured our dominance over the Balkans. Our people now look to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to determine the future of the Bulgarian state."
 balkfm.585.f: "We have secured our independence from our Greek, Russian, and Ottoman oppressors. Now we we must decide what our position will be within the fabric of the Balkan community."
 balkfm.585.a: "[ROOT.GetCountry.GetName] will lead the Balkans!"
 balkfm.585.b: "Our nation will be for all Yugoslavs!"
 balkfm.585.c: "We will reclaim the Imperial Throne!"
 balkfm.585.tt: "This will enable the #bold Načertanije#! journal entry."
 balkfm.585.e: "We should be proud of what we've accomplished."
 balkfm.586.t: "The Bulgarian Empire"
 balkfm.586.d: "Crowds gathered at the heart of [ROOT.GetCountry.GetCapital.GetCityHubName] as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] declared the absolute dominance of the Bulgarian state over the Balkans."
 balkfm.586.f: "In defiance of the imperialist powers that would see us as second-class citizens in our own homelands, we have claimed both our freedom and our future."
 balkfm.586.a: "This is a glorious day for the [ROOT.GetCountry.GetName]"
 balkfm.587.t: "The Yugoslav Nation"
 balkfm.587.d: "Having broken free from the yoke of the Ottoman and Austrian empires, the Slavic peoples of the Balkans have unified into a single nation."
 balkfm.587.f: "Freedom. Not mere release from the shackles, but true freedom. No longer caught between hammer and anvil, hound and hunter, the time has come for a new union. A new pact between Slavs for all to see."
 balkfm.587.a: "The Yugoslavian dream has come true!"
 balkfm.588.t: "The Queen of Cities"
 balkfm.588.d: "With the conquest of lands across the Bosphorus and the Dardanelles, the ancient imperial capital of Constantinople now lies within our control. The once-illusory dreams of reforging the Byzantine Empire have come to fruition. Our citizens now look to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to lead them into a new era."
 balkfm.588.f: ""When you go to Constantinople, think of me." -Ferdinand I, to British General Sir Ian Hamilton"
 balkfm.588.a: "Our armies will raise the Imperial standard once more!"
 
 balkfm.590.t: "Memories of the Steppe"
 balkfm.590.d: "In Byzantine times, the first mention of the [GetCulture('bulgarian').GetName] people comes from the mentions of the "Onogur Bulğars" with their lands clinging to the shores of the Dniester and Volga rivers near the Sea of Azov. With the restoration of the [ROOT.GetCountry.GetName], nationalists have aruged that the time has come for the Bulgarian people to reclaim their ancestral homeland."
 balkfm.590.f: "While the origin of the name "Bulgar" has been lost to time, the ancients made it clear that they first overthrew the Avars before migrating into the Balkans."
 balkfm.590.a: "We will reclaim our roots."
 balkfm.590.b: "This would be a wasted effort."
 balkfm.591.t: "Old Great Bulgaria"
 balkfm.591.d: "Through our efforts the ancient homelands of the Bulgarian people have been reclaimed from Russian hands. While we may speak a slavic language today, we cannot deny our ancient roots."
 balkfm.591.f: ""When someone seeks the truth, God sees. And when someone lies, God sees that too. The Bulgars did many favors to the Christians (Byzantines), but the Christians forgot them. But God sees." -Presian I of Bulgaria, 7th century"
 balkfm.591.a: "The [GetCulture('bulgarian').GetName] people will not be denied!"
 balkfm.597.t: "A United Bulgaria"
 balkfm.597.d: "In a rousing Proclamation in the Church of the Forty Martyrs, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has sent shock-waves across the Balkan world by declaring the both the Tsardom of [ROOT.GetCountry.GetName] and the annexation of East Rumelia."
 balkfm.597.f: ""The West has pronounced its anathema on me, the dawn of the East shines its rays on my dynasty and brightens our future!" -Ferdinand I, to the Sobranije, 1887"
 balkfm.597.a: "[ROOT.GetCountry.GetName] will triumph."
 balkfm.598.t: "The Bulgarian State"
 balkfm.598.d: "With the re-establishment of [SCOPE.sCountry('bulgaria_scope').GetName], the Bulgarian people can finally dream of a future they can call their own. The young nation will require strong leadership if it is to survive Ottoman retributions..."
 balkfm.598.f: ""As it is very necessary that you meet... the leader of the defenders of the people in these border areas, in order to discuss a very important matter to the benefit of all Bulgarians, whom the Berlin Congress has again left under Turkish tyrannical rule." -Nathanael of Ohrid, to Petko Voyvoda, 1878."
 balkfm.598.a: "It's time to focus back on [ROOT.GetCountry.GetName]."
 balkfm.598.b: "I wonder what kind of story they will have..."
 balkfm.599.t: "The Golden Lion Awakens" 
 balkfm.599.d: "Nearly a century of momentum built up in the National Awakening coupled with the decline of the [SCOPE.sCountry('ottoman_scope').GetName] has led to the rebirth of [ROOT.GetCountry.GetName]. With the support of [SCOPE.sCountry('russia_scope').GetName] and [SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('russia_scope').GetRuler.GetFirstName], a Catholic Austrian prince has been elected to rule the fledgling nation of [ROOT.GetCountry.GetName]."
 balkfm.599.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] is young and inexperienced and the country is in a precarious position. Not fully independent from the Porte, [ROOT.GetCountry.GetName] is rural, destitute, and heavily dependent on diplomatic support from the [SCOPE.sCountry('russia_scope').GetAdjectiveNoFormatting] state. Yet, the people feel hope for a future free of oppression and for future union with the Bulgarian people still living within Ottoman lands."
 balkfm.599.a: "[ROOT.GetCountry.GetName] will find its way."
 
 # Romania (and co.) Events
 balkfm.600.t: "The Lands of Stephen the Great"
 balkfm.600.d: "Following centuries of domination by the [SCOPE.sCountry('ottoman_scope').GetName], the Treaty of Adrianople established both the Principalities of [SCOPE.sCountry('moldavia_scope').GetName] and [SCOPE.sCountry('wallachia_scope').GetName] as nominal subjects of the Porte.\n\nSupported by the diplomatic designs of [SCOPE.sCountry('russia_scope').GetName], the Principalities have struggled to find their footing, held back by their feudal pasts."
 balkfm.600.f: "[ROOT.GetCountry.GetNameNoFlag] has suffered from both warfare and stagnation under Turkish rule following centuries of conflict over ownership of the mouths of the Danube and Dniester rivers, yet many are hopeful of a future free from complete servitude."
 balkfm.600.a: "[ROOT.GetCountry.GetName] will find its way."
 balkfm.601.t: "The Petition-Proclamation"
 balkfm.601.d: "Disaffection has been mounting against the rather arbitrary nature of the position of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Riding the tide of liberalism and nationalism spreading across Europe, prominent intellectuals, lead by [SCOPE.sCharacter('balkfm_alecsandri_scope').GetFullName] have demanded tangible guardrails against abuses by the Hospodar."
 balkfm.601.f: "Composed of a joint effort between the great boyars and western-educated intellectuals, the revolutionaries hope to establish a moderate liberal foundation in [ROOT.GetCountry.GetNameNoFormatting] without a complete overthrow of the #italic Regulamentul#! system."
 balkfm.601.a: "The state will not bow to troublemakers."
 balkfm.601.b: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must listen to the people."
 balkfm.602.t: "The Moldavian Revolutionary Committee"
 balkfm.602.d: "Prominent intellectual, [SCOPE.sCharacter('balkfm_kogalniceanu_scope').GetFullName], has gathered fellow radicals to make demands of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]. Calling themselves #italic The Moldavian Revolutionary Committee#!, they have presented a draft constitution that would transfer the majority of state functions to the legislature."
 balkfm.602.f: "Fears of radicalism in [ROOT.GetCountry.GetName] have yet to find validation, as the Committee has held back from demanding the abolition of the #italic Regulamentul#! system. Russian and Ottoman delegated have voiced concerns that these reforms might blow open the doors to further radicalization along the Danube."
 balkfm.602.a: "We must find a compromise."
 balkfm.603.t: "Kogălniceanu's Revolution"
 balkfm.603.d: "Support for [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has collapsed. Caving to the demands of the #italic Revolutionary Committee#!, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has signed off on their demands for liberalization and abdicated his position."
 balkfm.603.f: "In the place of the disgraced [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], liberal politician [SCOPE.sCharacter('balkfm_kogalniceanu_scope').GetFullName] has taken the reigns of the government and promises to lead reforms in [ROOT.GetCountry.GetName]."
 balkfm.603.a: "So be it."
 balkfm.604.t: "The Convention of Balta Liman"
 balkfm.604.d: "With the threat of revolution suppressed, a joint [SCOPE.sCountry('russia_scope').GetAdjective]-[SCOPE.sCountry('ottoman_scope').GetAdjective] delegation has confirmed the status quo of their joint oversight over the Romanian Principalities."
 balkfm.604.f: "Despite a mutual desire to see the Principalities modernize, their overlords seek to restrain their independence within tight bounds."
 balkfm.604.a: "So be it."
 balkfm.605.t: "Constitutional Stalemate"
 balkfm.605.d: "The liberalist movement sweeping [ROOT.GetCountry.GetName] has failed to gain significant traction. With their objectives incomplete and the threat of a joint [SCOPE.sCountry('russia_scope').GetAdjective]-[SCOPE.sCountry('ottoman_scope').GetAdjective] intervention, the #italic Revolutionary Committee#! has disbanded."
 balkfm.605.f: "Despite a mutual desire to see the Principalities modernize, their overlords seek to restrain their independence within tight bounds."
 balkfm.605.a: "So be it."
 balkfm.606.t: "Russian Troops Enter Moldavia"
 balkfm.606.d: "Following pleas from [SCOPE.sCountry('moldavia_scope').GetRuler.GetFullName], [SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('russia_scope').GetRuler.GetFullName] has sent troops into [SCOPE.sCountry('moldavia_scope').GetName] to suppress the #italic Revolutionary Committee#!."
 balkfm.606.f: "Overstepping the suzerainty of the [SCOPE.sCountry('ottoman_scope').GetName], the Russian foreign service has elected to take no risks in losing the Principalities to the tide of liberalism and has deployed forces across the Dniester."
 balkfm.606.a: "We will have order!"
 balkfm.606.b: "We cannot tolerate this offense!"
 balkfm.606.tt: "This will provide drastic support for the Prince."
 
 balkfm.610.t: "The Land Beyond the Snowy Mountains"
 balkfm.610.d: "Following centuries of domination by the [SCOPE.sCountry('ottoman_scope').GetName], the Treaty of Adrianople established both the Principalities of [SCOPE.sCountry('moldavia_scope').GetName] and [SCOPE.sCountry('wallachia_scope').GetName] as nominal subjects of the Porte.\n\nSupported by the diplomatic designs of [SCOPE.sCountry('russia_scope').GetName], the Principalities have struggled to find their footing, held back by their feudal pasts."
 balkfm.610.f: "[ROOT.GetCountry.GetNameNoFlag] has suffered from both warfare and stagnation under Turkish rule following centuries of conflict over ownership of the mouths of the Danube and Dniester rivers, yet many are hopeful of a future free from complete servitude."
 balkfm.610.a: "[ROOT.GetCountry.GetName] will find its way."
 balkfm.611.t: "Proclamation of Islaz"
 balkfm.611.d: "Prominent intellectual, [SCOPE.sCharacter('balkfm_balcescu_scope').GetFullName], has gathered fellow radicals to make demands of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]. Calling themselves the #italic The Brotherhood#!, they have presented a list of demands that would dramatically increase voting rights and transfer the majority of state functions to the legislature."
 balkfm.611.f: "Fears of radicalism in [ROOT.GetCountry.GetName] have yet to find validation, as the Brotherhood has held back from openly demanding the abolition of the #italic Regulamentul#! system. Russian and Ottoman delegated have voiced concerns that these reforms might blow open the doors to further radicalization along the Danube."
 balkfm.611.a: "[ROOT.GetCountry.GetName] must follow the will of the people."
 balkfm.611.b: "Silence these anarchists."
 balkfm.612.t: "The Wallachian Brotherhood"
 balkfm.612.d: "Embracing the tide of radicalism surging across Europe, [SCOPE.sCharacter('balkfm_balcescu_scope').GetFullName] has presented [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] with a series of demands that would strip away any semblance of traditional authority in [ROOT.GetCountry.GetName]."
 balkfm.612.f: "Unlike their compatriots in [SCOPE.sCountry('moldavia_scope').GetName], the #italic Brotherhood#! has charged forward with radicalist demands, seeking Romanian unification and the abolition of the #italic Regulamentul#! system."
 balkfm.612.a: "We must find a compromise"
 balkfm.613.t: "The Sword of the Revolution"
 balkfm.613.d: "Support for [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has collapsed. Caving to the demands of the #italic Revolutionary Committee#!, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has signed off on their demands for liberalization and abdicated his position."
 balkfm.613.f: "In the place of the disgraced [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], liberal politician [SCOPE.sCharacter('balkfm_balcescu_scope').GetFullName] has taken the reigns of the government and promises to lead reforms in [ROOT.GetCountry.GetName]"
 balkfm.613.a: "So be it."
 balkfm.614.t: "The Convention of Balta Liman"
 balkfm.614.d: "With the threat of revolution suppressed, a joint [SCOPE.sCountry('russia_scope').GetAdjective]-[SCOPE.sCountry('ottoman_scope').GetAdjective] delegation has confirmed the status quo of their joint oversight over the Romanian Principalities."
 balkfm.614.f: "Despite a mutual desire to see the Principalities modernize, their overlords seek to restrain their independence within tight bounds."
 balkfm.614.a: "So be it."
 balkfm.615.t: "Constitutional Stalemate"
 balkfm.615.d: "The liberalist movement sweeping [ROOT.GetCountry.GetName] has failed to gain significant traction. With their objectives incomplete and the threat of a joint [SCOPE.sCountry('russia_scope').GetAdjective]-[SCOPE.sCountry('ottoman_scope').GetAdjective] intervention, the #italic Revolutionary Committee#! has disbanded."
 balkfm.615.f: "Despite a mutual desire to see the Principalities modernize, their overlords seek to restrain their independence within tight bounds."
 balkfm.615.a: "So be it."
 balkfm.616.t: "Russian Troops Enter Wallachia"
 balkfm.616.d: "Following pleas from [SCOPE.sCountry('wallachia_scope').GetRuler.GetFullName], [SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('russia_scope').GetRuler.GetFullName] has sent troops into [SCOPE.sCountry('wallachia_scope').GetName] to suppress the #italic Revolutionary Committee#!."
 balkfm.616.f: "Overstepping the suzerainty of the [SCOPE.sCountry('ottoman_scope').GetName], the Russian foreign service has elected to take no risks in losing the Principalities to the tide of liberalism and has deployed forces across the Dniester."
 balkfm.616.a: "We will have order!"
 balkfm.616.b: "We cannot tolerate this offense!"
 balkfm.616.tt: "This will provide drastic support for the Prince."
 
 balkfm.620.t: "The Regulamentul Organic"
 balkfm.620.d: "In the wake of their pseudo-independence from the [SCOPE.sCountry('ottoman_scope').GetName], both [SCOPE.sCountry('moldavia_scope').GetName] and [SCOPE.sCountry('wallachia_scope').GetName] suffered from political instability that culminated in famine and plague. To restore order to the Principalities and to build the foundation of a modern state, [SCOPE.sCountry('russia_scope').GetName] imposed the #italic Regulamentul Organic#! on the states in the hopes of beginning the process of Westernization."
 balkfm.620.f: "The #italic Regulamentul#! forms the first constitutional document in the Principalities. Recognizing the threat of their stagnation compared to the West, the Russian state has advocated for a system of gradual modernization in [ROOT.GetCountry.GetNameNoFlag]."
 balkfm.620.a: "These are lofty aspirations."
 balkfm.620.tt: "Complete #bold Ottoman Legacy#! [Concept('concept_journal_entry','$concept_journal_entries$')] to advance the progress bar"
 balkfm.621.t: ""
 balkfm.621.d: ""
 balkfm.621.f: ""
 balkfm.621.a: ""
 balkfm.622.t: ""
 balkfm.622.d: ""
 balkfm.622.f: ""
 balkfm.622.a: ""
 balkfm.623.t: ""
 balkfm.623.d: ""
 balkfm.623.f: ""
 balkfm.623.a: ""
 balkfm.624.t: "Electing a Hospodar"
 balkfm.624.d: "[ROOT.GetCountry.GetRuler.GetFullName]'s tenure as Hospodar of [ROOT.GetCountry.GetName] has expired. In compliance with the #italic Regulamentul Organic#! and the terms of the Akkerman Convention, elections have begun for a new Hospodar."
 balkfm.624.f: "In many ways, the Hospodar elections are an evolution of the boyar system, with lords typically electing one of their own to "rule" [ROOT.GetCountry.GetNameNoFormatting]."
 balkfm.624.a: "[SCOPE.sCharacter('balkfm_hospodar_candidate_1').GetFullName] should retain the title."
 balkfm.624.b: "[SCOPE.sCharacter('balkfm_hospodar_candidate_2').GetFullName] seems well qualified."
 balkfm.624.c: "[SCOPE.sCharacter('balkfm_hospodar_candidate_3').GetFullName] may be the strongest choice."
 balkfm.625.t: "Electing a Hospodar"
 balkfm.625.d: "[ROOT.GetCountry.GetRuler.GetFullName]'s tenure as Hospodar of [ROOT.GetCountry.GetName] has expired. In compliance with the#italic  Regulamentul Organic#! and the terms of the Akkerman Convention, elections have begun for a new Hospodar."
 balkfm.625.f: "In many ways, the Hospodar elections are an evolution of the boyar system, with lords typically electing one of their own to "rule" [ROOT.GetCountry.GetNameNoFormatting]."
 balkfm.625.a: "[SCOPE.sCharacter('balkfm_hospodar_candidate_1').GetFullName] should retain the title."
 balkfm.625.b: "[SCOPE.sCharacter('balkfm_hospodar_candidate_2').GetFullName] seems well qualified."
 balkfm.625.c: "[SCOPE.sCharacter('balkfm_hospodar_candidate_3').GetFullName] may be the strongest choice."
 balkfm.626.t: "The Death of Feudalism"
 balkfm.626.d: "Despite the prejudice and doubts of both benefactors and rivals alike, [ROOT.GetCountry.GetName] has succeeded in shedding the archaic institutions of our feudal overlords."
 balkfm.626.f: "Both despite and in spite of our centuries of exploitation by the Ottoman state, today the [ROOT.GetCountry.GetAdjectiveNoFormatting] people stand ready to carve out their own future."
 balkfm.626.a: "A glorious achievement for [ROOT.GetCountry.GetName]."
 balkfm.627.t: "Absolutist Aspirations"
 balkfm.627.d: "[ROOT.GetCountry.GetRuler.GetFullName] has pushed forward a set of constitutional reforms that would dramatically increase his control over the state."
 balkfm.627.f: "Through the efforts of [ROOT.GetCountry.GetRuler.GetFullName], [ROOT.GetCountry.GetName] has been freed from Turkish servitude and achieved its unification. Yet, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has begun to press for increased central privileges that would transform the nation into an absolutist state legitimized by an empowered pesantry."
 balkfm.627.a: "We should support his efforts."
 balkfm.627.b: "He is a reckless tyrant."
 balkfm.628.t: "Mandate Secured"
 balkfm.628.d: "In a show of statesmanship befitting the unifier of Romania, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has secured his grasp on authoritarian rule over [ROOT.GetCountry.GetName]."
 balkfm.628.f: "With the backing of the peasantry, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] stands poised to lead the [ROOT.GetCountry.GetAdjectiveNoFormatting] state into a resurgent future. The tacit acceptance of his rule by both the #bold Porte#! and the European powers has only served to silence his detractors."
 balkfm.628.a: "This is a great day for [ROOT.GetCountry.GetName]!"
 balkfm.629.t: "A Monstrous Coalition"
 balkfm.629.d: "In response to [ROOT.GetCountry.GetRuler.GetFullName]'s deranged plans for absolutist rule, a band of politicians have joined in opposing his rule. Termed the #bold Monstrous Coalition#! by the press, they have rallied the army to out the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] from the throne.\n\n The Coalition has appealed to the Great Powers for their approval in selecting a new [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 balkfm.629.f: "Through his arrogance, [ROOT.GetCountry.GetRuler.GetFirstName] has managed to unite the conservative landowners and liberal business in their opposition to absolutism."
 balkfm.629.a: "Prince Hohenzollern is an accceptable choice."
 balkfm.629.a.tt: "#yellow Carol Hohenzollern#! becomes ruler."
 balkfm.629.b: "The noble prince, Philippe de Flandre, is a fine choice."
 balkfm.629.b.tt: "#yellow Philippe de Flandre#! becomes ruler."
 
 balkfm.630.t: "The Lands Beyond the Forest"
 balkfm.630.d: ""
 balkfm.630.f: ""
 balkfm.630.a: ""
 balkfm.630.b: ""
 
 balkfm.640.t: "An Elected Domintor"
 balkfm.640.d: "With the approval of the Great Powers and the Constituent Assembly, [ROOT.GetCountry.GetRuler.GetFullName] has been named [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Newspapers have reported he has already arrived in [ROOT.GetCountry.GetCapital.GetCityHubName]."
 balkfm.640.f: "While the new [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] is unfamiliar with [ROOT.GetCountry.GetName] and her customs, the people are optimistic for future political stability."
 balkfm.640.a: "[ROOT.GetCountry.GetName] must find its way."
 balkfm.641.t: "Liberalist Demands"
 balkfm.641.d: "The failure of the #italic Statutul Desvoltător#! has led politicial leaders to put forward plans for a new Constitution for [ROOT.GetCountry.GetName]. Inspired by Belgian Liberalism, Romanian intellectuals hope this will lead the nation into an era of modernity."
 balkfm.641.f: "The proposed changes are much more modest in scope that previously, this time attempting to strike a balance between imported Liberalism from the West and the unique circumstances of the Romanian state."
 balkfm.641.a: "This is a noble vision for [ROOT.GetCountry.GetName]."
 balkfm.641.b: "This reeks of bourgeoisie entitlement."
 balkfm.642.t: "A Conspiracy in Ploiești"
 balkfm.642.d: "Incensed by the King's refusal to accept consitutional limitations, a group of intellectuals, led by [SCOPE.sCharacter('balkfm_candiano_scope').GetFullName] have raised banners and declared a rebellion in the city of #yellow Ploiești#!. Local security forces having already begun the process of rounding up the participants, but many fear a renewed radicalist contagion in [ROOT.GetCountry.GetName]."
 balkfm.642.f: ""We'll walk to the train station on the other side of Cişmigiu, and sometime till morning we'll catch the train to Ploieşti... There, I shan't be afraid anymore: I'll be among my own kind! All of them republicans, poor souls!" -excerpt from the play "Conu Leonida faţă cu reacţiunea," 1880"
 balkfm.642.a: "Arrest these radicals."
 balkfm.642.b: "We cannot resist their demands."
 balkfm.642.c: "This man could have a better use..."
 balkfm.642.tt: "This will reduce support for the King by #bold 20#!."
 balkfm.643.t: "Ploiești Revolt Suppressed"
 balkfm.643.d: "As quickly as it started, the self-proclaimed #yellow Republic of Ploieşti#! has been dissolved and it's organizers arrested."
 balkfm.643.f: ""In the space of our century, a very interesting state was born and ended, one that no scrupulous historian should ignore. I wish to speak of the Ploieşti Republic, a state which, although it has lasted only fifteen hours, has for sure marked a celebrated page in contemporary history. Born out of, through, and for the people, at around two o'clock in the morning of August 8, 1870, the young republic was smothered on the same day, around four o'clock in the afternoon. Never mind! the greatness and importance of states are not judged by their extent and duration, but by the more or less brilliant role they have played in the universal system." -I. L. Caragiale"
 balkfm.643.a: "Excellent news."
 balkfm.643.tt: "This will increase support for the King by #bold 20#!."
 balkfm.644.t: "Ploieștian Radicalism Spreads"
 balkfm.644.d: "As quickly as it started, the self-proclaimed #yellow Republic of Ploieşti#! has been dissolved and it's organizers arrested. However, the brutality of local forces has inspired several others to take up the republican cause."
 balkfm.644.f: ""...you have forgotten that I am a Ploieşti native – yes, a Ploieşti native – buddy, and I shall pull you a revolution, but not just any revolution... one to remember me by!..." excerpt from "D-ale carnavalului," 1885"
 balkfm.644.a: "This is getting out of hand."
 balkfm.644.tt: "This will reduce support for the King by #bold 20#!."
 balkfm.645.t: "The Candiano Republic"
 balkfm.645.d: "Radicalism has overwhelmed the [ROOT.GetCountry.GetAdjective] state. Leading the charge, radical [SCOPE.sCharacter('balkfm_candiano_scope').GetFullName] has taken the reigns of the state and promises to bring an era of renewed liberalism to [ROOT.GetCountry.GetName]."
 balkfm.645.f: "Faced with threats to his person, [SCOPE.sCharacter('balkfm_ruler_scope').GetFullName] has fled to the West."
 balkfm.645.a: "Down with the crown!"
 balkfm.646.t: "Monarchism Secured"
 balkfm.646.d: "In the face of the regime that welcomed him into [ROOT.GetCountry.GetName], King [ROOT.GetCountry.GetRuler.GetFullName] has installed himself as an autocratic ruler."
 balkfm.646.f: "As citizens fall in line behind the new order, the conspirators have been outed and arrested."
 balkfm.646.a: "[ROOT.GetCountry.GetName] will have order."
 balkfm.646.b: "Expel these radicals."
 balkfm.647.t: "The Republic of [ROOT.GetCountry.GetName]"
 balkfm.647.d: "Radicalism has overwhelmed the [ROOT.GetCountry.GetAdjective] state. Leading the charge, radical [SCOPE.sCharacter('balkfm_candiano_scope').GetFullName] has taken the reigns of the state and promises to bring an era of renewed liberalism to [ROOT.GetCountry.GetName]."
 balkfm.647.f: "Faced with threats to his person, [SCOPE.sCharacter('balkfm_ruler_scope').GetFullName] has fled to the West."
 balkfm.647.a: "[ROOT.GetCountry.GetName] must find it's way."
 
 balkfm.650.t: ""
 balkfm.650.d: ""
 balkfm.650.f: ""
 balkfm.650.a: ""
 balkfm.650.b: ""
 
 balkfm.660.t: "The Romanian Academy"
 balkfm.660.d: "In the interest of developing [ROOT.GetCountry.GetName], King [SCOPE.sCharacter('university_benefactor').GetFullName] has put forward a plan to open a native institution of higher learning in [SCOPE.sState('university_state').GetCityHubName]. This plan would represent a large expense for the state."
 balkfm.660.f: "The Academia Română was founded in Bucharest in 1866. Today, it serves as the authoritative institution on matters of Romania language, history, and culture."
 balkfm.660.a: "A noble endeavor."
 balkfm.660.b: "The cost is too great."
 balkfm.661.t: "A Royal Estate"
 balkfm.661.d: "After a tremendous effort, the #yellow Castelul Peleș#! has been completed in [SCOPE.sState('wallachia_state_scope').GetName]. Eager to legitimize his rule, [ROOT.GetCountry.GetRuler.GetFullName] has already begun moving his court into the complex."
 balkfm.661.f: ""Italians were masons, Romanians were building terraces, the Gypsies were coolies. Albanians and Greeks worked in stone, Germans and Hungarians were carpenters. Turks were burning brick. Engineers were Polish and the stone carvers were Czech. The Frenchmen were drawing, the Englishmen were measuring, and so was then when you could see hundreds of national costumes and fourteen languages in which they spoke, sang, cursed and quarreled in all dialects and tones, a joyful mix of men, horses, cart oxen and domestic buffaloes." -Queen Elisabeth of Wied"
 balkfm.661.a: "Wonderful."
 
 balkfm.670.t: "Forms Without Substance"
 balkfm.670.d: "The debate over Romanian identity has reached a fever pitch in the literary space. Scholar [SCOPE.sCharacter('balkfm_mairoescu_scope').GetFullName] has blasted the supposed "reckless" modernization of the Romanian state, claiming that liberalism has no basis in [ROOT.GetCountry.GetName] as it is a nation of peasants and landowners without an entrenched bourgeoisie class."
 balkfm.670.f: "Mairoescu and his supporters have gathered around a literary club "Junimea." Claiming to champion the true Romanian identity, they have become a focal point for Romanian conservatism between their demands for legislative regression and the rejection of an idealized Romanian past."
 balkfm.670.a: "But we've always been Romanian..."
 balkfm.671.t: "Etymologicum Magnum Romaniae"
 balkfm.671.d: "Accomplished Romanian historiographer, [SCOPE.sCharacter('balkfm_hasdeu_scope').GetFullName], has found himself the target of the #yellow Junimist#! movement following his latest publications regarding the Romanian language. Undaunted, he has pushed forward the narrative that the Romanian people have been and will continue to be the primary force of European innovation."
 balkfm.671.f: "Liberal thought in Romania has found its basis in a self-ascribed Romanian "pioneering spirit" that they claim has propelled Romanian primacy in history. Termed #yellow Dacianism#!, this school of thought suggests that Romanian people have been at the forefront of politics and science since the days of Roman Dacia. This is despite a conspicuous lack of evidence to support their claims."
 balkfm.671.a: ""Pioneering Spirit" indeed..."
 balkfm.672.t: "A Romanian Identity"
 balkfm.672.d1: "The triumph of the #yellow Junimist#! movement has laid the foundation for a unified Romanian identity. Striking a balance between the boyars and farmers who work their land, Romanians have come to see themselves as a people that have evolved through a fusion of Dacian agrarianism and Roman statesmanship."
 balkfm.672.d2: "The triumph of the #yellow Dacian#! movement has laid the foundation for a unified Romanian identity. Foregoing the imagined "shackles" of agrarianism, Romanians have been enthralled by the narrative that they are the heirs to a rich tradition of progress and innovation dating back to when the first Roman colonists set foot in what would become Roman Dacia."
 balkfm.672.f1: ""The only true social class is the Romanian peasant, and his reality is suffering. His sighs are caused by the fantasies of the upper classes, for it is out of his daily sweat, that the material means to support this fictitious structure we call Romanian culture are taken. And we force him to hand out the very last measure of himself in order to pay for our painters and musicians, the Academy and Atheneum members, and the literary and scientific awards wherever they are handed out. And we do not have, at the very least, the gratitude to produce a single artistic work that would for a moment raise his spirits and make him forget his daily misery." -T. Mairoescu"
 balkfm.672.f2: ""...in the cruel solitude to which I am condemned, only this colossal encyclopedia of the Romanian people, only the daily contact with the spirit of an entire nation, only the satisfaction that I alone do what even my enemies have admitted that it cannot do no one, only this saves me from the ugliness that would destroy me. In the words of a Roman emperor, I feel that I am becoming a god, and feeling it - I feel like laughing." - B. Hasdeu"
 balkfm.672.a: "[ROOT.GetCountry.GetName] will not abandon her roots."
 balkfm.672.b: "[ROOT.GetCountry.GetName] will pioneer a new future."
 
 balkfm.678.t: "The Imperial Standard"
 balkfm.678.d: "As the [GetCulture('romanian').GetName] people begin to understand themselves as a singular nation, many have begun to question [ROOT.GetCountry.GetName]'s role within the political landscape of Eastern Europe. With nationalism cementing itself among the populace, irredentist movers have declared that we are the only true successors to the #yellow Roman Empire#!."
 balkfm.678.f: ""We have secured our independence from our Greek, Russian, and Ottoman oppressors. Now we we must decide what our position will be within the fabric of the Balkan community.""
 balkfm.678.a: "We will reclaim the Imperial Throne!"
 balkfm.678.b: "The Empire is dead. We should leave it as such."
 balkfm.679.t: "The Queen of Cities"
 balkfm.679.d: "With the conquest of lands across the Bosphorus and the Dardanelles, the ancient imperial capital of Constantinople now lies within our control. The once-illusory dreams of reforging the Byzantine Empire have come to fruition. Our citizens now look to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to lead them into a new era."
 balkfm.679.f: "The ancient imperial capital of Constantinople now lies within our control. None can question the legitimacy of our claim to the Byzantine throne."
 balkfm.679.a: "Our armies will raise the Imperial standard once more!"
 
 balkfm.680.t: "Our Declaration of Union"
 balkfm.680.d: "By our strength and wits, we have taken the first steps in uniting the Romanian nation. The future beckons!"
 balkfm.680.f: "The reporter began writing the day's experiences down. "Nothing but the liveliest demonstrations of joy could be heard throughout the capital. It was the only show that could be seen on all the streets, on all the sidewalks, in all the public places of the city. Our peasant brothers were now shouting with all the energetic power of their souls: '#italic Long live the nation! Long live Romania!#!'"\n\nA single joyous tear rolled down his cheek. "Everyone threw themselves into each other's arms, regardless of their station, as if all, in general, had freed themselves from the most oppressive yoke.""
 balkfm.680.a: "Toți în unu!"
 balkfm.680.a.tta: "[SCOPE.sCountry('romania_lesser_partner').GetName] shall become the lesser member in a [concept_personal_union] with us."
 balkfm.680.a.ttb: "[SCOPE.sCountry('romania_lesser_partner').GetName] shall become our [concept_puppet]."
 balkfm.681.t: "Awaken Thee, Romanian!"
 balkfm.681.d: "Our union with [SCOPE.sCountry('romania_lesser_union_partner').GetName] is complete. Our bonds are solid, our will is unyielding—together, we are #bold Romania#!." 
 balkfm.681.d2: "Our union with [SCOPE.sCountry('romania_lesser_union_partner').GetName] and [SCOPE.sCountry('transylvania_union_partner').GetName] is complete. Our bonds are solid, our will is unyielding—together, we are #bold Romania#!."
 balkfm.681.f: ""Wake up, Romanians, from your sleep of death," roared the crowd.\n\n"Into which you've been sunk by the barbaric tyrants.\nNow or never, sow a new fate for yourself\nTo which even your cruel enemies will bow!"\n\nTricolors flapped in the wind. Children were being hoisted into the air to etch the moment into their memories. Together, people were singing a song they had never heard before, but knew the words in their hearts already."
 balkfm.681.a: "Unity through life and brotherhood through death!"
 balkfm.682.t: "Retrocession Granted"
 balkfm.682.d: "Following quick negotiations, [SCOPE.sCountry('romanian_bessarabia_owner').GetName] has agreed to cede a portion of Bessarabia to [ROOT.GetCountry.GetName]."
 balkfm.682.f: "Slowly, but surely, the dream of Romanian union will come to fruition."
 balkfm.682.a: "This is a great step for the [GetCulture('romanian').GetName] people!"
 balkfm.683.t: "Retrocession Denied"
 balkfm.683.d: "Negotiations for the return of Bessarabian lands to [ROOT.GetCountry.GetName] have failed. With this, the [GetCulture('romanian').GetName] people remain estranged by foreign borders."
 balkfm.683.f: "The Romanian people have long been prey to the imperial powers in the Balkans. This failure represents another continuation of their oppression."
 balkfm.683.a: "They will not stop the [GetCulture('romanian').GetName] cause."
 balkfm.684.t: "Union with Transylvania"
 balkfm.684.d: "Our union with [SCOPE.sCountry('transylvania_scope').GetName] is complete. Our bonds are solid, our will is unyielding—together, [ROOT.GetCountry.GetName] will not be denied!."
 balkfm.684.f: ""The lands named in the resolution of the Alba-Iulia National Assembly of the 18th of November 1918 are and remain forever united with the Kingdom of Romania." -Ferdinand I, 11 December 1918"
 balkfm.684.a: "One for All"
 balkfm.685.t: "Treaty of [SCOPE.sState('transylvania_capital_scope').GetCityHubName]"
 balkfm.685.d: "Following quick negotiations, [SCOPE.sCountry('transylvania_scope').GetName] has agreed to join the Greek state."
 balkfm.685.f: "Romanians in [SCOPE.sState('transylvania_capital_scope').GetName] fought for their freedom. It is only right that they rejoin the [ROOT.GetCountry.GetAdjective] family."
 balkfm.685.a: "[ROOT.GetCountry.GetName] will not be denied!"
 balkfm.686.t: "Romanian Agitation Abroad!" #ROM
 balkfm.686.d: "With our support, [GetCulture('romanian').GetName] radicals in Transylvania have begun organizing civil demonstrations across the state in the hopes of furthering the cause against [SCOPE.sCountry('austria_scope').GetAdjectiveNoFlag] oppression."
 balkfm.686.f: ""O! Holy Lord,\nOur Heavenly Father,\nExtend Your Hand\nOver the Romanian Country!""
 balkfm.686.a: "We will not stop until [ROOT.GetCountry.GetName] is whole."
 balkfm.687.t: "Romanian Agitation Against [ROOT.GetCountry.GetAdjective] Rule!" #AUS
 balkfm.687.d: "[GetCulture('romanian').GetName] radicals in Transylvania have provoked demonstrations across the state. They demand equal rights for all slavs within [ROOT.GetCountry.GetName]."
 balkfm.687.f: "While the situation on the streets is chaotic, initial suspicions have been directed at agitators from [SCOPE.sCountry('romania_scope').GetName]."
 balkfm.687.a: "This is not civil behavior."
 balkfm.688.t: "The Greater Romanian Lands"
 balkfm.688.d: "With the unification of the Principalities under a single state, a greater plan has come into vision: the unification of all [GetCulture('romanian').GetName] lands in #yellow Danubia#!."
 balkfm.688.f: ""The only future for [ROOT.GetCountry.GetName] is one where our entire nation is free and whole.""
 balkfm.688.a: "These lands are rightfully ours."
 balkfm.689.t: "The Reunification of Romania"
 balkfm.689.d: "From the Dniester to the Tisza, the dream of a whole and independent [ROOT.GetCountry.GetName] has been made reality."
 balkfm.689.f: ""Romanians!\n\nThe war which for the last two years has been encircling our frontiers more and more closely has shaken the ancient foundations of Europe to their depths.\n\nIt has brought the day which has been awaited for centuries by the national conscience, by the founders of the Romanian State, by those who united the principalities in the war of independence, by those responsible for the national renaissance.\n\nIt is the day of the union of all branches of our nation. Today we are able to complete the task of our forefathers and to establish forever that which Michael the Great was only able to establish for a moment, namely, a Romanian union on both slopes of the Carpathians...." \n-Proclamation by King Ferdinand, 28 August 1916"
 balkfm.689.a: "This is a wonderous day for [ROOT.GetCountry.GetName]!"
 
 balkfm.690.t: "[SCOPE.sCountry('transylvania_scope').GetName] Take Up Arms!" # Provocateur Event
 balkfm.690.d: "With our support, [GetCulture('Romanian').GetName] radicals in [SCOPE.sCountry('transylvania_scope').GetCapital.GetName] have seized control of the regional palace and declared the independence of [SCOPE.sCountry('transylvania_scope').GetName]. They have issued a call for international aid and recognition."
 balkfm.690.f: "While Transylvanian rebels have ejected the Austrian governors, they will desperately need international assistance if they are to stay safe from Austrian reprisal."
 balkfm.690.a: "All Romanians deserve their freedom."
 balkfm.691.t: "[SCOPE.sCountry('transylvania_scope').GetName] Take Up Arms!" # Target Event
 balkfm.691.d: "[GetCulture('Romanian').GetName] radicals in [SCOPE.sCountry('transylvania_scope').GetCapital.GetName] have seized control of the regional palace and declared the independence of [SCOPE.sCountry('transylvania_scope').GetName]. They demand immediate recognition by and independence from the [ROOT.GetCountry.GetAdjectiveNoFlag] administration."
 balkfm.691.f: "While we may not have immediate proof, our intelligence service reports that [SCOPE.sCountry('romanian').GetName] is directly responsible for funding and organizing this rebellion."
 balkfm.691.a: "Put them down!"
 balkfm.691.b: "Grant them autonomy."
 
 # Bosnia Events
 balkfm.700.t: "The Small Land of the Serbs"
 balkfm.700.d: "For centuries, [ROOT.GetCountry.GetName] has been subject to external powers from the Greeks to the Ottomans. Having earned their freedom, the [GetCulture('bosniak').GetName] can finally claim their own destiny."
 balkfm.700.f: ""
 balkfm.700.a: "[ROOT.GetCountry.GetName] will find its way."
 
 balkfm.790.t: "Tribal Conflicts"
 balkfm.790.d1: "A missive has arrived to inform us that our militias, led by our trusted warlord [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! have had their demands for Haraç rejected by [SCOPE.sCountry('montenegro_scope').GetName]."
 balkfm.790.d2: "In a shocking turn of events, a militia that approached [SCOPE.sCountry('montenegro_scope').GetName] to demand tribute has arrived with a different prize: the submission of the Price-Bishopric to [ROOT.GetCountry.GetName]."
 balkfm.790.f: "The [GetStrategicRegion('region_balkans').GetName] are no stranger to tribal violence. In the hinterlands, tribal feuds and customs often take precedence over the law of the Sultan."
 balkfm.790.a: "The Prince-Bishop will learn humility."
 balkfm.790.b: "They will serve us well."
 balkfm.791.t: ""
 balkfm.791.d: ""
 balkfm.791.f: ""
 balkfm.791.a: ""
 balkfm.792.t: "The Reordering Begins"
 balkfm.792.d: "Messengers have arrived from Constantinople to report the promulgation of the Edict of Gülhane. As the next phase of the Tanzimât, the Sultan has directed all members to carry out its imperatives towards modernization... regardless of any erosion of powers held by the nobility and governors."
 balkfm.792.f: "“If you apply Tanzimât in Bosnia Herzegovina, you will not be able to sustain them for even thirty years.” -Ali Pasha"
 balkfm.792.a: "We will join in this lofty goal."
 balkfm.792.b: "These plans are unreasonable."
 balkfm.793.t: "The Schemes of Smaïl-aga"
 balkfm.793.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has been disturbed by reports that the warlord [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! has been plotting to usurp the lordship of [ROOT.GetCountry.GetName] upon [ROOT.GetCountry.GetRuler.GetFirstName]'s death."
 balkfm.793.f: "In his rule over Bosnia, Ali Pasha has expropriated several"
 balkfm.793.a: "Perhaps we can arrange for an "accident...""
 balkfm.793.b: "He is irrelevant. Leave him be."
 balkfm.794.t: "The Arrogance of Smaïl-aga"
 balkfm.794.d: "In turning a blind eye to the threat posed by [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#!, we have exposed ourselves to his blind ambition as declared a rebellion against [ROOT.GetCountry.GetName]. The $turkfm_porte$ has remained silent, waiting to see the conflict's resolution."
 balkfm.794.f: "The highly decentralized nature of the [SCOPE.sCountry('ottoman_scope').GetName]" has aided it in asserting control over its broad landscape. However, individual Pashas, especially once influential, cooperate with or defy the $turkfm_porte$ and each other as their needs see fit."
 balkfm.794.a: "Perhaps we should have taken action..."
 balkfm.795.t: "Disruptive Influence"
 balkfm.795.d: "A communiqué arrived in [SCOPE.sState('northern_serbia_state_scope').GetCityHubName] this morning, suggesting that the Ottoman bey, [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! [SCOPE.sCharacter('smail_aga_scope').GetLastName], has conspired to usurp [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName] as Vizier of Herzegovina. Advisors to the Prince have warned this could endanger our Serb cousins in [SCOPE.sCountry('montenegro_scope').GetName]."
 balkfm.795.f: "The Prince-Bishop of #yellow Montenegro#! has found himself assailed by the political intrigue of the Porte, with his borders threatened by #yellow Ali Pasha#!. While we cannot act openly against other subjects of our Ottoman overlords, we could aid [SCOPE.sCharacter('montenegro_ruler_scope').GetFullName] in sowing discord in their ranks."
 balkfm.795.a: "Send the Pasha a letter."
 balkfm.795.b: "We do not deal in idle gossip."
 balkfm.796.t1: "Ali Pasha's Demise"
 balkfm.796.t2: "Ali Pasha Deposed"
 balkfm.796.d1: "The $turkfm_porte$'s justice came swiftly. Without warning, the vaunted [SCOPE.sCharacter('omer_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('omer_pasha_scope').GetLastName] arrived to restore control in [SCOPE.sCountry('hersek_scope').GetName]. Ali Pasha has been deposed and executed for asserting his autonomy, and the Sultan has declared his intent to restore central authority in [GetStateRegion('STATE_BOSNIA').GetName]."
 balkfm.796.d2: "The $turkfm_porte$'s justice came swiftly. Without warning, the vaunted [SCOPE.sCharacter('omer_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('omer_pasha_scope').GetLastName] arrived to restore control in [SCOPE.sCountry('hersek_scope').GetName]. Ali Pasha has been detained and removed from power for asserting his autonomy, and the Sultan has declared his intent to restore central authority in [GetStateRegion('STATE_BOSNIA').GetName]."
 balkfm.796.f: "A direct and loyal man, #yellow Ömer Pasha Lütfi#! has already established himself as a capable commander capable of navigating the powder-keg that is the Balkans. Dedicated to serving the Porte, Ömer Pasha has developed a reputation for bringing justice to the native nobility whenever their interests do not align that those of the $turkfm_porte$."
 balkfm.796.a: "Is the [ROOT.GetCountry.GetAdjectiveNoFlag] dream dead?"
 balkfm.796.b: "Good riddance!"
 balkfm.797.t: "The Lands of Montenegro"
 balkfm.797.d: "With both resolute leadership and the fierce spirit of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has brought the entirety of [GetStateRegion('STATE_MONTENEGRO').GetName] under the control of [ROOT.GetCountry.GetName]."
 balkfm.797.f: "After centuries of resisting invasions and imperialist designs, Montenegro has finally been brought to heel."
 balkfm.797.a: "[ROOT.GetCountry.GetRuler.GetFirstName] shall rule as a new Sultan!"
 balkfm.798.t: "Failed Ambitions"
 balkfm.798.d: "With the death of Ali Pasha has come the collapse of his ambitions for an independent Bosnia. While [ROOT.GetCountry.GetRuler.GetFullName] is motivated to rule, it is clear he lacks the deep connections of his father."
 balkfm.798.f: "“If we do not stop Omer Pasha now, Bosnia will not belong to Bosnians in 30 years.” -Ali Pasha, c.1850"
 balkfm.798.a: "[ROOT.GetCountry.GetName] must find its way."
 balkfm.799.t: "House Rizvanbegović of Bosnia"
 balkfm.799.d: "[ROOT.GetCountry.GetRuler.GetFullName]'s rebellion against the [SCOPE.sCountry('ottoman_scope').GetName] has succeeded. With the rise of his Sultanate comes a new era in the [GetStrategicRegion('region_balkans').GetName]."
 balkfm.799.f: "“There is a sultan in Istanbul, but I am the sultan in Mostar.” -Ali Pasha, 1841"
 balkfm.799.a: "[ROOT.GetCountry.GetName] will make its own way."
 
