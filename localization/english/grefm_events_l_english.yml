 grefm.550.t: "The Pontic Greeks"
 grefm.550.d: "The [GetCulture('rhomaios').GetName] of [ROOT.GetCountry.GetName] have called their lands home since before written history. The arrival of the [SCOPE.sCountry('ottoman_scope').GetName], coupled with the emanations of [GetCulture('greek').GetName]#yellow ism#! from the West, has brought the erosion of our unique culture and identity. The [ROOT.GetCountry.GetAdjectiveNoFormatting] people must find their place in this changing world."
 grefm.550.f: ""the cruel persecutions of their Mahomedan masters have been the cause of their present degraded state of ignorance, even in regard to their native tongue; for that there was a time when their Turkish masters strictly prohibited the Greeks in Asia Minor even from speaking the Greek language among themselves....  the language of their oppressors has long since almost universally prevailed, and in a great part of Anatolia even the public worship of the Greeks is now performed in the Turkish tongue." -John Pinkerton, 1817"
 grefm.550.a: "[ROOT.GetCountry.GetName] must find its way."
 
 grefm.560.t: "The Greeks of the Highlands"
 grefm.560.d: "The [GetCulture('rhomaios').GetName] of [ROOT.GetCountry.GetName] have called their lands home since before written history. The arrival of the [SCOPE.sCountry('ottoman_scope').GetName], coupled with the emanations of [GetCulture('greek').GetName]#yellow ism#! from the West, has brought the erosion of our unique culture and identity. The [ROOT.GetCountry.GetAdjectiveNoFormatting] people must find their place in this changing world."
 grefm.560.f: ""the cruel persecutions of their Mahomedan masters have been the cause of their present degraded state of ignorance, even in regard to their native tongue; for that there was a time when their Turkish masters strictly prohibited the Greeks in Asia Minor even from speaking the Greek language among themselves....  the language of their oppressors has long since almost universally prevailed, and in a great part of Anatolia even the public worship of the Greeks is now performed in the Turkish tongue." -John Pinkerton, 1817"
 grefm.560.a: "[ROOT.GetCountry.GetName] must find its way."

 grefm.570.t: "The [GetCulture('urum').GetName]#yellow s#! of "Little Theodoro""
 grefm.570.d: "For centuries, Greeks have lived along the shores of the Black Sea developing a unique fusion of Greek and Turkic cultures that has flourished in [ROOT.GetCountry.GetName]. While they speak a Turkish language, the [GetCulture('urum').GetName] people practice the [GetReligion('orthodox').GetName] faith and consider themselves to be $greek_cultures$.\n\nUnder the [ROOT.GetCountry.GetPowerBloc.GetName]'s rule, these Greeks have taken on a new importance as the Tsar seeks to project suzerainty over the Orthodox peoples in the Ottoman Empire."
 grefm.570.f: "While many have claimed the Urum to be little more than "baptized Tatars", the Urum have retained their faith and continue their Greek traditions despite the loss of their native tongue."
 grefm.570.a: "[ROOT.GetCountry.GetName] must find its way."
 
 grefm.580.t: "The Treaty of [SCOPE.sState('ionian_overlord_capital').GetCityHubName]"
 grefm.580.d: "Through careful negotiations, [SCOPE.sCountry('ionian_overlord').GetName] has agreed to cede the [SCOPE.sCountry('ionian_country').GetName] to [ROOT.GetCountry.GetName]."
 grefm.580.f: ""To promote good will between our nations and to bolster the spirit of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people, the [SCOPE.sCountry('ionian_overlord').GetRuler.GetPrimaryRoleTitle] has graciously cede the Ionian Islands. Our amiable protectorate, under which the Islands benefited from our true and just assistance, is deemed at an end and we trust that the people of these isles will prosper under the benevolent care of our trusted friends.""
 grefm.580.a: "A most agreeable solution." 
 grefm.581.t: "The Treaty of [SCOPE.sState('epirus_capital').GetCityHubName]"
 grefm.581.d: "Following quick negotiations, [SCOPE.sCountry('epirus_scope').GetName] has agreed to join the Greek state."
 grefm.581.f: "The Epriote Greeks fought for their freedom against the Ottomans, it is only right that the rejoin the Greek family."
 grefm.581.a: "A most agreeable solution."
 grefm.582.t: "The Treaty of [SCOPE.sState('cyprus_capital').GetCityHubName]"
 grefm.582.d: "Following quick negotiations, [SCOPE.sCountry('cyprus_scope').GetName] has agreed to join the Greek state."
 grefm.582.f: "The Cypriot Greeks have won their freedom by their own sweat and blood. If they so choose, then it is right that they join their Greek brothers and sisters."
 grefm.582.a: "A most agreeable solution."
 grefm.583.t: "The Treaty of [SCOPE.sState('crete_capital').GetCityHubName]"
 grefm.583.d: "Following quick negotiations, [SCOPE.sCountry('crete_scope').GetName] has agreed to join the Greek state."
 grefm.583.f: "The Cretan Greeks have finally achieved their freedom after generations of systematic oppression. It is a momentous occasion now that they rejoin their Greek brothers and sisters."
 grefm.583.a: "A most agreeable solution."
 grefm.584.t: "The Treaty of [SCOPE.sState('macedonia_capital').GetCityHubName]"
 grefm.584.d: "Following quick negotiations, [SCOPE.sCountry('macedonia_scope').GetName] has agreed to join the Greek state."
 grefm.584.f: "The Macedonian Greeks have finally achieved their freedom. Crowds cheer in the streets as they are rejoined with the Greek family."
 grefm.584.a: "A most agreeable solution."
 grefm.585.t: "OPEN"
 grefm.585.d: "OPEN"
 grefm.585.f: "OPEN"
 grefm.585.a: "OPEN"
 grefm.586.t: "The Treaty of [SCOPE.sState('samos_capital').GetCityHubName]"
 grefm.586.d: "Following quick negotiations, [SCOPE.sCountry('samos_scope').GetName] has agreed to join the Greek state."
 grefm.586.f: "For centuries, the island has stalwartly held out against Turkish and European incursion. At long last, they will be united with their countrymen."
 grefm.586.a: "A most agreeable solution."
 grefm.587.t: "The Treaty of [SCOPE.sState('theodoro_capital').GetCityHubName]"
 grefm.587.d: "Following quick negotiations, [SCOPE.sCountry('theodoro_scope') has agreed to join the Greek state."
 grefm.587.f: "Once a holdout against Ottoman expansion, the lands Theodoro eventually fell into the hands of the Tartar hordes. Today we welcome them back as citizens of [ROOT.GetCountry.GetName]"
 grefm.587.a: ""A most agreeable solution.""
 grefm.588.t: "The Treaty of [SCOPE.sState('trabzon_capital').GetCityHubName]"
 grefm.588.d: "Following quick negotiations, [SCOPE.sCountry('trabzon_scope') has agreed to join the Greek state."
 grefm.588.f: "Trabzon survived the fall of Constantinople, but soon came under the oppression of the Ottomans. Today, they rejoin [ROOT.GetCountry.GetName] as citizens."
 grefm.588.a: ""A most agreeable solution.""
 grefm.589.t: "The Treaty of [SCOPE.sState('cappadocia_capital').GetCityHubName]"
 grefm.589.d: "OPEN"
 grefm.589.f: "OPEN"
 grefm.589.a: "OPEN"
 
 grefm.590.t: "Greek Separatism"
 grefm.590.d: "A rise in nationalistic fervor has caused Greek peoples in Epirus to call for independence from their Turkish oppressors."
 grefm.590.f: "Pro-Greek fever has spread across the Greek populations that live under Ottoman rule. Agitators and politicians alike both within [ROOT.GetCountry.GetName] and abroad call for the Greek state to sponsor the unification of all Greek peoples under a common flag."
 grefm.590.a: "We should support their cause."
 grefm.590.b: "We will not tolerate insurrection."
 grefm.590.tt1: "You may now support the Greek Separatist cause via the journal."
 grefm.590.tt2: "Month by month, tensions will build in Crete until nationalists are once again ready to launch an uprising."
 grefm.590.tt3: "The [SCOPE.sCountry('grefm_greece_scope').GetAdjective] state may sponsor Hellenism within our own $greek_cultures$ populations."
 grefm.591.t: "Greek Provocations in [SCOPE.sState('grefm_provocation_state_scope').GetName]"
 grefm.591.d: "Our agents in [SCOPE.sState('grefm_provocation_state_scope').GetName] have set in motion their plan to hatch a rebellion against their [SCOPE.sCountry('grefm_provocation_owner_scope').GetAdjective] oppressors."
 grefm.591.f: "With caches of weapons and munitions already in place, all that remains is to finish rallying rebels to the $greek_cultures$ cause."
 grefm.591.a: "[ROOT.GetCountry.GetName] will be made whole!"
 grefm.592.t: "The [SCOPE.sCountry('grefm_revolt_scope').GetAdjective] Revolt"
 grefm.592.d: "Funded by various Philhellenes and inspired by western Nationalism, the $greek_cultures$ people in [SCOPE.sCountry('grefm_revolt_scope').GetName] have rebelled against their [SCOPE.sCountry('grefm_owner_scope').GetName] rulers."
 grefm.592.f: "With covert support, our brothers fight to further the Greek cause abroad."
 grefm.592.a: "We could support their cause."
 grefm.592.b: "We ride to their aid!"
 grefm.593.t: "OPEN"
 grefm.593.d: "OPEN"
 grefm.593.f: "OPEN"
 grefm.593.a: "OPEN"
 grefm.594.t: "The Makedonijan Revolt"
 grefm.594.d: "As Greek influence expands across the Balkans, sympathizers in Northern Macedonia have outsted our garrisons and demanded autonomy."
 grefm.594.f: "Armed with western weaponry and supported by Greek veterans, the Macedonian breakaway state is the latest challenge to our authority."
 grefm.594.a: "We will crush these weasels."
 grefm.594.b: "They are beyond our control now."
 grefm.595.t: "The Epirote Revolt"
 grefm.595.d: "Greek partisans have taken up arms against us in Southern Albania. They demand independence from [ROOT.GetCountry.GetAdjectiveNoFormatting] rule and union with the Greek state."
 grefm.595.f: "Aided and abetted by the Greek state, rebels have set up the breakaway state of Epirus, declaring their intent to join their Greek counterparts."
 grefm.595.a: "We will crush these upstarts." 
 grefm.595.b: "They are beyond our control now."
 grefm.596.t: "The Cypriot Revolt"
 grefm.596.d: "Greek partisans on Cyprus have taken up arms against us. They demand independence from Muslim rule and are seeking union with the Greek state."
 grefm.596.f: "Funded and armed by the Greek state, these rebels seek to return the island to Greek hands despite centuries of legitimate Turkish rule."
 grefm.596.a: "We will crush these infidels." 
 grefm.596.b: "They are beyond our control now."
 grefm.597.t: "The Macedonian Revolt"
 grefm.597.d: "Following Greek expansion in the Balkans, the Greek Macedonians have risen up against our rule. They demand that they be allowed to unite with the Greek state."
 grefm.597.f: "Armed with western weaponry and supported by Greek veterans, the Macedonian breakaway state is the latest challenge to our authority."
 grefm.597.a: "We will crush these traitors."
 grefm.597.b: "They are beyond our control now."
 grefm.598.t: "The Smyrnite Revolt"
 grefm.598.d: "Separatists in Smyrna have take up arms against our rule. They demand independence from Muslim rule and the right to union with the Greek state."
 grefm.598.f: "Greek expansion in the Balkans has sparked dissent in Greek communities across Anatolia. chief among them are the Smyrnites, who have long yearned for union with their brothers across the Aegean."
 grefm.598.a: "We will crush these ingrates."
 grefm.598.b: "They are beyond our control now."
 grefm.599.t: "DUMMY"
 grefm.599.d: "DUMMY"
 grefm.599.f: "DUMMY"
 grefm.599.a: "DUMMY"
 
 grefm.800.t: "The Phoenix Rises"
 grefm.800.d: "Church bells ring and people cheer as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] declares the rebirth of the [ROOT.GetCountry.GetName]. Beneath the imposing presence of the [SCOPE.sBuilding('hagia_sofia_scope').GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been adorned with reconstructions of the old sigils and regalia of the Eastern Roman emperors. Stepping forward towards the array of citizens, dignitaries, and clergy, [ROOT.GetCountry.GetRuler.GetFirstName] stands as a beacon for the future of the Greek people."
 grefm.800.f: "Where countless attempts failed over the centuries since the losses of Rome and Constantinople, the Empire stands resurgent today. However, much work remains: numerous Greeks are ruled by heretics and heathens, formerly Roman lands remain within the grasp of foreign pretenders, and countless Byzantine treasures are kept hostage abroad. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must be sure to live up to the expectations of [ROOT.GetCountry.GetRuler.GetHerHis] subjects if [ROOT.GetCountry.GetRuler.GetSheHe] is to bring glory to [ROOT.GetCountry.GetName]."
 grefm.800.a: "From the ashes, we rise."
 grefm.801.t: "Nova Rome Constantinopolitana"
 grefm.801.d: "Our efforts have borne fruit with the rebirth of the [ROOT.GetCountry.GetName]. Now several voices call for the restoration of [ROOT.GetCountry.GetAdjectiveNoFormatting] power and prestige with the return of formerly Byzantine lands to Greek hands. It falls to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to determine the future of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state."
 grefm.801.f: ""The Kingdom of Greece is not Greece; it is merely a part: the smallest, poorest part of Greece. The Greek is not only he who inhabits the Kingdom, but also he who inhabits Ioannina, Salonika or Serres or Adrianople or Constantinople or Trebizond or Crete or Samos or any other region belonging to the Greek history or the Greek race... There are two great centres of Hellenism. Athens is the capital of the Kingdom. Constantinople is the great capital, the dream and hope of all Greeks." -I. Kolettis, 1844" 
 grefm.801.a: "We will restore the glory of the [ROOT.GetCountry.GetName]."
 grefm.801.b: "We will limit ourselves to Anatolia."
 grefm.801.c: "We will limit ourselves to the Balkans."
 grefm.802.t: "The Rome of the East"
 grefm.802.d: "With Anatolia and the Balkans firmly within our grasp, the old heart of the Empire has been reclaimed. Prominent leaders in the [ROOT.GetCountry.GetAdjectiveNoFormatting] court now call for the return of Egypt and the Levant, once strongholds of Christendom, into the Imperial sphere."
 grefm.802.f: "Almost one thousand years ago, Basileus Isaac I Komnenos augustly led the Empire into an era of renewed might and glory. Yet today, the old Greek cities lie in ruins and the old bastions of Christendom wither under their Muslim holders."
 grefm.802.a: "We will reclaim the Eastern Empire."
 grefm.802.b: "We have reclaimed the Greek heartlands. This is enough." 
 grefm.803.t: "The Basileia Rhōmaiōn"
 grefm.803.d: "With the Eastern Empire within our domain, our people look across our borders to lands held by pretenders and heathens. Politicians and agitators alike call for the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to lead [ROOT.GetCountry.GetName] into this new era."
 grefm.803.f: "Following the restoration of the Roman state, our people have begun to look beyond the old borders of the East, to the lands once held by the Empire under Emperor Justinian."
 grefm.803.a: "We will reclaim the Eternal City."
 grefm.803.b: "We must focus on our citizens."
 grefm.804.t: "Dalmatia Reclaimed"
 grefm.804.d: "For the first time in centuries, Greek armies march along the eastern coast of the Adriatic Sea."
 grefm.804.f: "Before being lost to the Goths and later Slavs, Dalmatia, as the province of Illyricum, was the great link between the Roman and Greek sides of the Roman Empire."
 grefm.804.a: "Glory to the Empire."
 grefm.805.t: "Lombardia Reclaimed"
 grefm.805.d: "As our soldiers walk in the shadows of the Alps, northern Italy has returned to Imperial control."
 grefm.805.f: "Despite serving as a barrier shielding Rome from the wild north, it was through the Alps that the Lombards poured into Italy a millennium ago, replacing the Roman legal system with their own barbarian tradition."
 grefm.805.a: "Glory to the Empire."
 grefm.806.t: "Magna Graecia Reclaimed"
 grefm.806.d: "From the shores of the Ionian Sea to the banks of the Garigliano, southern Italy has returned to the Imperial fold."
 grefm.806.f: "In Antiquity, southern Italy was colonized by large numbers of Greeks. These Greeks intermingled with the local Latin peoples, giving the south of the peninsula a unique flavor and exposing the nascent Roman Republic to Greek culture."
 grefm.806.a: "Glory to the Empire."
 grefm.807.t: "Exarchate of Ravenna Reclaimed"
 grefm.807.d: "From the Po Valley to the Slopes of the Apennines, central Italy has come under our sway."
 grefm.807.f: "Central Italy was the cradle of Roman Expansion, as the Latins spread across lands held by the Sabines, Umbrians, and Etruscans."
 grefm.807.a: "Glory to the Empire."
 grefm.808.t: "OPEN"
 grefm.808.d: "OPEN"
 grefm.808.f: "OPEN"
 grefm.808.a: "OPEN"
 grefm.809.t: "Renovatio Imperii Romanorum"
 grefm.809.d: "As Imperial forces march through the Eternal City, our dream of restoring the Roman Empire has come a conclusion. For the first time in over a millennium, Rome, the Eternal City and the Foremost Seat in the Pentarchy, has been returned to the Empire. From the shores of the Bosporus to the mighty Tiber, the lands ancient Rome have been reunited under one banner."
 grefm.809.f: "The city of Rome was the seat of one of the greatest Empires to dominate Europe. For centuries it has languished in the hands of Lombardic and Gallic pretenders. Today the crown jewel and beating heart of the Empire has been reclaimed from the barbarian masses! Hail to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]! Glory to the [ROOT.GetCountry.GetName]!"
 grefm.809.a: "Rome shall shine once more!"
 grefm.809.b: "Constantinople is the New Rome!" 
 
 grefm.810.t: "The Basileus Basileōn"
 grefm.810.d: "With the overthrow of the Bavarocracy, the [ROOT.GetCountry.GetName] has been freed from the meddling of the western monarchies. In an auspicious ceremony led by Patriarch [SCOPE.sCharacter('devout_leader_scope').GetFullName], [SCOPE.sCharacter('byzfm_ruler_scope').GetFullName] was crowned Basileus. Adorned with the reconstructions of the regalia of Byzantine authority, the Emperor stands radiant as a star, ready to lead the [ROOT.GetCountry.GetAdjectiveNoFormatting] State forward to the future."
 grefm.810.f: "Throughout history, from the Greek Plan in the 1700s to the Megali Idea from the 1800s, scholars have envisioned a Greece at the helm of a resurrected Christian Empire in the East. With a native Greek on the throne, this dream comes every closer to becoming reality."
 grefm.810.a: "Glory to Byzantium!"
 
 grefm.820.t: "The 14 Regions of Constantinople"
 grefm.820.d: "Constantinople suffered serious decline and depopulation in the decades after the Ottoman conquest. While the city has grown considerably in the last century, this has come at the cost of slums expanding outward beyond the ancient heart of the city. Byzantophile leaders have urged the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to lead"
 grefm.820.f: ""Indeed, the length of the city from the golden gate to the seashore in a direct line is fourteen thousand seventy-five feet, and the breadth six thousand one hundred and fifty feet. " -Notitia Urbis Constantinopolitanae, mid-5th century"
 grefm.820.a: "We will rebuild the Queen of Cities."
 grefm.821.t: "Imperial Palace Ruins Identified"
 grefm.821.d: "Our engineers' detailed survey has finally been completed and our experts believe the restoration of the Megas Palation, while audacious, is possible. Presently, only the Boukoleon Palace stands as a ruin and several Ottoman structures exist over the site. This will be a taxing effort for the state."
 grefm.821.f: ""We rode all along the shore to the palace of Bucoleon, and when he arrived there it surrendered, on condition that the lives of all therein should be spared. At Bucoleon were found the larger number of the great ladies who had fled to the castle, for there were found the sister of the King of France, who had been empress, and the sister of the King of Hungary, who had also been empress, and other ladies very many. Of the treasure that was found in that palace I cannot well speak, for there was so much that it was beyond end or counting." -Geoffrey of Villehardouin, 1204, following the capture of the palace by Boniface of Montferrat"
 grefm.821.a: "All for the Glory of Byzantium."
 grefm.822.t: "Great Palace of Constantinople"
 grefm.822.d: "The Great Palace of Constantinople served as the main imperial residence of the Eastern Roman or Byzantine emperors until 1081 and was the center of imperial administration for over 690 years. The restored seat of the Eastern Roman Empire once again looms over Constantinople, evoking the legacy of Constantine and Justinian."
 grefm.822.f: ""No other place in the empire - or perhaps the world - dripped so extravagantly in gold or boasted so magnificent a display of wealth. Behind the massive golden throne were trees made of hammered gold and silver, complete with jewel-encrusted mechanical birds that would burst into song at the touch of a lever. Wound around the base of the tree were golden lions and griffins staring menacingly from beside each armrest, looking as if they could spring up at any moment.""
 grefm.822.a: "All for the Glory of Byzantium."
 grefm.822.tt: "[ROOT.GetCountry.GetNameNoFlag] may now expand the reconstruction by rebuilding the #bold Hippodrome#!."
 grefm.823.t: "The Hippodrome of Constantinople"
 grefm.823.d: "Following months of meticulous work, the Hippodrome has been rebuilt. With a new track, new stands, and redecorated spina, it now stands ready for the people."
 grefm.823.f: "In the times of the Roman Emperors, the circus at Constantinople, known as the Hippodrome, once held grandiose chariot races for the masses. Even though it has been over a millennium since the last true chariot race was hosted here, with the track, spina, and seating restored, it may be possible to revive this ancient tradition."
 grefm.823.a: "Open the Gates!"
 grefm.823.tt: "[ROOT.GetCountry.GetNameNoFlag] may now take a decision to revive Chariot Racing."
 grefm.824.t: "Notitia Urbis Constantinopolitanae"
 grefm.824.d: "Our years of labor and industry have transformed Constantinople from a city locked in a feudal past into a renewed metropolis in the East. Truly, no other city deserves the title "Queen of Cities" more than the heart of the Greek world."
 grefm.824.f: "For centuries, Constantinople served as the cradle of Eastern Christianity. Now, the restored city has become a beacon heralding the birth of a new Empire."
 grefm.824.a: "Byzantium is Eternal."
 
 grefm.830.t: "DUMMY"
 grefm.830.d: "DUMMY"
 grefm.830.f: "DUMMY"
 grefm.830.a: "DUMMY"
 grefm.831.t: "Chariot Racing Re-established"
 grefm.831.d: "By imperial decree, the ancient institution of chariot racing will be re-established. Set to a four-year schedule, these races will be open to both citizens and tourists of the Queen of Cities."
 grefm.831.f: "After training and tryouts, four teams have been formed: the #red Reds#!, #white Whites#!, #green Greens#!, and #blue Blues#! - each named for one of the ancient Roman chariot teams."
 grefm.831.a: "Bring forth the chariots!"
 grefm.832.t: "Chariot Racing Expanded"
 grefm.832.d: "With the stroke of a pen, the Emperor has expanded the chariot races by two more teams."
 grefm.832.f: "The two new teams have taken it upon themselves to resurrect the #gold Golds#! and the #purple Purples#!, two later Roman chariot teams."
 grefm.832.a: "Glory to Byzantium!"
 grefm.833.t: "A Day at the Races"
 grefm.833.d: "Under the summer sun, the great racing factions lined up at the starting line of the great Hippodrome. The circus, packed to the brim with spectators, was alight with the cheers of fans and detractors alike. At the sound of the gun, the chariots flew across the track, each team urging their horses forward. In the end, the [SCOPE.GetRootScope.GetCountry.GetCustom('grefm_chariot_type')] came out victorious."
 grefm.833.f: ""As the horses made turn after turn, the crowd roared and the ground trembled. It was as if the Queen of Cities itself had come to life.""
 grefm.833.a: "What a great display of Byzantine tradition."
 grefm.834.t: "A Day at the Races - Diversum"
 grefm.834.d: "Under the summer sun, the great racing factions lined up at the starting line of the great Hippodrome. The circus, packed to the brim with spectators, was alight with the cheers of fans and detractors alike. At the sound of the gun, the chariots flew across the track, each team urging their horses forward. In the end, no team could claim victory after the day's matches. The crowd has called for a #italic diversum#!, a tiebreaker match."
 grefm.834.f: ""As the horses made turn after turn, the crowd roared and the ground trembled. It was as if the Queen of Cities itself had come to life.""
 grefm.834.a: "We shall schedule the rematches."
 grefm.834.b: "We will call it a draw."
 grefm.835.t: "Sporting Riot"
 grefm.835.d: "At this year's chariot races, a fight between rival fans has resulted in mayhem at the Hippodrome."
 grefm.835.f: "Under the hot summer sun, a fell spirit swept across the Hippodrome as the teams lined up for the quadrennial races. As the teams withdrew to prepare for the final races, a scuffle broke out amongst the spectators. By the time the city police marched in to restore order, a riot developed that now threatens to spill into the streets."
 grefm.835.a: "Evacuate the bystanders."
 grefm.835.b: "Arrest these fanatics."
 grefm.836.t: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] Attempts to Join Race"
 grefm.836.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has been inspired to participate in this year's races."
 grefm.836.f: "While definitely great entertainment for the masses, this might be a bit... beneath someone of the highest office of the land."
 grefm.836.a: "Sounds like a sporting idea!"
 grefm.836.b: "This is hardly acceptable for cultured men."
 grefm.837.t: "Chariot Team Caught Cheating"
 grefm.837.d: "The chariot team backed by the [SCOPE.gsInterestGroup('cheater_ig_scope').GetName] has been caught attempting to fix this year's race."
 grefm.837.f: "An audit has uncovered an incredible level of corruption ranging from bribes to outright sabotage of racing equipment. Some sources hint that the course itself may be a target of mischief."
 grefm.837.a: "Cancel the games and launch an investigation."
 grefm.837.b: "Let them race, skill shall triumph over treachery."
 grefm.838.t: "The Combustion Engine Takes the Hippodrome!"
 grefm.838.d: "Crowds rushed to the Hippodrome today for an unprecedented sight:\nTo the deafening roar of automobile engines, the people witnessed several automobile enthusiasts careening around the circus, their drivers desperately clinging to their vehicles as they skipped around the packed soil surface of the track. Emblazoning their vehicles with brightly colored logos and sigils, the racers appear to have attempted to make this a motorized equivalent to the chariot race."
 grefm.838.f: "Despite the lack of organized planning, these hooligans have taken to informal sports such as drag racing and power pulling. Several onlookers have even suggested that these sports be formalized, with the most idealistic even suggesting that smaller vehicles, perhaps derived from gas-driven lawnmowers, could take to the track. Elites, however, decry this dangerous activity and have voiced dismay at the risks of damaging the ancient circus."
 grefm.838.a: "We should make this a regular thing!"
 grefm.838.b: "Arrest these maniacs before they kill someone!"
 
 grefm.890.t: "'Straya has Landed"
 grefm.890.d: "With [ROOT.GetCountry.GetName]'s arrival in the Balkans has come the dawn of a new idea: What if the [ROOT.GetCountry.GetAdjectiveNoFormatting] Emu were to spread its wings across the eastern Mediterranean like the Roman Empire once did?"
 grefm.890.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastName] might have a few 'roos loose in the top paddock, but his idea has gained traction amongst Nationalists camps."
 grefm.890.a: "Let's put another shrimp on the barbie, yeah?"
 grefm.890.b: "Tell him he’s dreaming."
 grefm.891.t: "The Empire from Down Under"
 grefm.891.d: "Church bells ring and people cheer as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] declares the birth of the [ROOT.GetCountry.GetName]. Beneath the imposing presence of the [SCOPE.sBuilding('hagia_sofia_scope').GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been adorned with the old sigils and regalia of the Eastern Roman emperors and a resplendent robe of Emu down. Stepping forward towards the array of citizens, dignitaries, and clergy, [ROOT.GetCountry.GetRuler.GetFirstName] stands as a beacon for the future of the #bold #greece Emu#!#! state."
 grefm.891.f: ""If we had a military division with the bullet-carrying capacity of these birds it would face any army in the world ... They can face machine guns with the invulnerability of tanks. They are like Zulus whom even dum-dum bullets could not stop." -Major G. Meredith, 1932"
 grefm.891.a: "The Emu will rise!"
 grefm.892.t: "The Emu of the East"
 grefm.892.d: "With Anatolia and the Balkans firmly within our grasp, the old heart of the Byzantine Empire has been brought under the Emu's wing. Prominent leaders roosting in the [ROOT.GetCountry.GetAdjectiveNoFormatting] court now call for the return of Egypt and the Levant, once strongholds of Christendom, into the Imperial sphere."
 grefm.892.f: "Almost one thousand years ago, Basileus Isaac I Komnenos augustly led the Empire into an era of renewed might and glory. Yet today, the old cities lie in ruins and the old bastions of Christendom wither without the Emu's protective light."
 grefm.892.a: "We will claim the Eastern Empire."
 grefm.893.t: "The Holy Byzantine Emu Empire"
 grefm.893.d: "With the Eastern Empire within our domain, our people look to the Great Running Bird for shelter and guidance. Citizen and zookeeper alike call for the [GetCulture('emu').GetName] to lead [ROOT.GetCountry.GetName] into this new era."
 grefm.893.f: "They said she was cactus, that nobody could raise the Imperial banner. They said the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] was dead-set drongo for getting us into a scrap over these forsaken lands. Hard yakka it was sure, but you can't lie that's a ripper flag flapping over the Bosphorus."
 grefm.893.a: ""Good on 'ya mate!""
 