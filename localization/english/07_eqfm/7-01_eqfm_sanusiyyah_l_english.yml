 notification_eqfm_senussi_desert_up_desc: "The Dominance of the $eqfm_sanusiyyah_movement$ has allowed [GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_senussi_character_var').GetCharacter.GetFullName]'s followers to advance into the depths of the desert wastelands."
