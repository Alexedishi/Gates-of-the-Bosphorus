l_english:
 # Journal Entries
 je_eqfm_sanusiyyah: "The Teachings of al-Sanusi"
 je_eqfm_sanusiyyah_reason: "$je_eqfm_sanusiyyah_flavor$[GetPlayer.GetCustom('eqfm_sanusiyyah_influence_type')]$je_eqfm_sanusiyyah_pressure$$je_eqfm_sanusiyyah_entrenchment$"
 je_eqfm_sanusiyyah_status: "[GetPlayer.GetCustom('eqfm_sanusiyyah_status_type')]"
 je_eqfm_sanusiyyah_complete: "Every $eqfm_muslim$ [concept_country] in the [GetGeographicRegion('geographic_region_sanusiyyah').GetName] [concept_georegion] has either #bold Embraced#! or #bold Expelled#! the $eqfm_sanusiyyah_movement$"
 je_eqfm_sanusiyyah_on_complete_sanusiyyah_survives: "If the $eqfm_sanusiyyah_movement$ has been embraced by any country in the [GetGeographicRegion('geographic_region_sanusiyyah').GetName], Triggers the Event #white #bold $eqfm_sanusiyyah.008.t$#!#!"
 je_eqfm_sanusiyyah_on_complete_sanusiyyah_extinguished: "If the $eqfm_sanusiyyah_movement$ has #bold not#! been embraced by any country in the [GetGeographicRegion('geographic_region_sanusiyyah').GetName], Triggers the Event #white #bold $eqfm_sanusiyyah.009.t$#!#!"
 eqfm_sanusiyyah_pressure_progress_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('eqfm_sanusiyyah_pressure_progress_value')]"
 
 je_eqfm_sanusiyyah_flavor: "Like much of the Arab world, spiritual life in much of Northern Africa is guided by the Ulama. However, in the [GetGeographicRegion('geographic_region_sanusiyyah').GetName] [concept_georegion], spiritual life often centers around itinerant preachers known as [GetCharacterTrait('gbbf_trait_marabout').GetName]#yellow s#!. Under increasing pressure from the $turkfm_porte$, the $eqfm_sanusiyyah_movement$ has gained traction amongst the [GetCulture('bedouin').GetName] people, spreading along the paths of the Marabouts."
 
 je_eqfm_sanusiyyah_influence: "$gbbf_linebreak_normal$The $eqfm_sanusiyyah_movement$ commands [GetPlayer.MakeScope.Var('eqfm_sanusiyyah_influence_var').GetValue] over the government of [ROOT.GetCountry.GetCapital.GetCityHubName]. This is expected to change by [GetPlayer.MakeScope.Var('eqfm_sanusiyyah_influence_progress_var').GetValue|+-] next month.\n\n@information! At maximum $eqfm_sanusiyyah_influence_short$, the $eqfm_sanusiyyah_movement$ will provide the following effects:\n[GetStaticModifier('modifier_eqfm_senussi_nationalism').GetDesc]"
 
 je_eqfm_sanusiyyah_pressure: "$gbbf_linebreak_normal$#white Led by [GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_senussi_character_var').GetCharacter.GetFullName], the $eqfm_sanusiyyah_movement$ is exerting [GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_sanusiyyah_pressure_var').GetValue] $eqfm_sanusiyyah_pressure_short$. This is expected to change by #tooltippable;tooltip:[GetPlayer.GetTooltipTag],eqfm_sanusiyyah_pressure_progress_breakdown [GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_sanusiyyah_pressure_progress_var').GetValue]#! next month.#!\n\n@information! At maximum $eqfm_sanusiyyah_pressure_short$, the $eqfm_sanusiyyah_movement$ will provide the following effects:\n[GetStaticModifier('modifier_eqfm_sanusiyyah_movement').GetDesc]"
 
 je_eqfm_sanusiyyah_entrenchment: "$gbbf_linebreak_normal$The $eqfm_sanusiyyah_movement$ has the following $eqfm_sanusiyyah_entrenchment_short$ across the [GetGeographicRegion('geographic_region_sanusiyyah').GetName] [concept_georegion]:\n • [GetPlayer.GetCustom('eqfm_sanusiyyah_libya_type')]\n • [GetPlayer.GetCustom('eqfm_sanusiyyah_libyan_desert_type')]\n • [GetPlayer.GetCustom('eqfm_sanusiyyah_tripoli_type')]\n • [GetPlayer.GetCustom('eqfm_sanusiyyah_egyptian_desert_type')]\n • [GetPlayer.GetCustom('eqfm_sanusiyyah_matruh_type')]\n • [GetPlayer.GetCustom('eqfm_sanusiyyah_chad_type')]"
 
 je_eqfm_sanusiyyah_expedition: "Expedition Against $eqfm_sanusiyyah$"
 je_eqfm_sanusiyyah_expedition_reason: "[ROOT.GetCountry.GetNameNoFlag] has deployed an $eqfm_expedition$ to suppress and drive out the $eqfm_sanusiyyah_entrenched$ adherents to the $eqfm_sanusiyyah_movement$."
 je_eqfm_sanusiyyah_expedition_complete: "The $eqfm_expedition$ has #v 8 or more#! $eqfm_expedition_progress$"
 je_eqfm_sanusiyyah_expedition_fail: "The $eqfm_expedition$ has #v 5 or more#! $eqfm_expedition_peril$"
 je_eqfm_sanusiyyah_expedition_status_transit: "The $eqfm_expedition$ is in transit."
 je_eqfm_sanusiyyah_expedition_status_default: "$eqfm_expedition_progress$: #bold #green [GetPlayer.MakeScope.Var('eqfm_sanusiyyah_expedition_progress_var').GetValue]#!/#!#v 8#!\n$eqfm_expedition_peril$: #bold #red [GetPlayer.MakeScope.Var('eqfm_sanusiyyah_expedition_peril_var').GetValue]#!/#!#v 5#!"

 # Journal Entry Lobby Text
 je_eqfm_sanusiyyah_lobby: "$gbbf_journal_lobby$\nLike much of the Arab world, spiritual life in Libya is guided by the Ulema. However, in the expanses of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName], spiritual life often centers around the [GetCharacterTrait('gbbf_trait_marabout').GetName]. Under increasing pressure from the $turkfm_porte$, the $eqfm_sanusiyyah_movement$ has gained traction amongst the [GetCulture('bedouin').GetName] people."
 
