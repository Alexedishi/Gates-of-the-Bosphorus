 notification_eqfm_sanusiyyah_expelled_name: "$eqfm_sanusiyyah_movement$ Expelled From [ROOT.GetCountry.GetNameNoFlag]"
 notification_eqfm_sanusiyyah_expelled_desc: "The [ROOT.GetCountry.GetAdjectiveNoFlag] administration has succeeded in puring all influence of the $eqfm_sanusiyyah_movement$ over the state."
 notification_eqfm_sanusiyyah_spreads_to_country_name: "$eqfm_sanusiyyah_movement$ Spreads to [SCOPE.sCountry('eqfm_sanusiyyah_country_scope').GetNameNoFlag]."
