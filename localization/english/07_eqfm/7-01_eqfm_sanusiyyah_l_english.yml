 notification_eqfm_senussi_ghosted_desc: "Security services have reported that [GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_senussi_character_var').GetCharacter.GetFullName] has vanished without a trace."
 notification_eqfm_senussi_entrenched_name: "$eqfm_sanusiyyah$ Becomes Entrenched"
 notification_eqfm_senussi_entrenched_desc: "The Dominance of the $eqfm_sanusiyyah_movement$ has allowed [GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_senussi_character_var').GetCharacter.GetFullName] to entrench himself in the Court at [ROOT.GetCountry.GetCapital.GetCityHubName]."
 notification_eqfm_senussi_urbanized_up_name: "[GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_senussi_character_var').GetCharacter.GetLastName] Advances into the Cities"
 notification_eqfm_senussi_urbanized_up_desc: "The Dominance of the $eqfm_sanusiyyah_movement$ has allowed [GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_senussi_character_var').GetCharacter.GetFullName]'s followers to advance into urban areas."
