 notification_eqfm_senussi_desert_down_desc: "Recent setbacks in the influence of the $eqfm_sanusiyyah_movement$ has forced [GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_senussi_character_var').GetCharacter.GetFullName]'s followers to withdraw into the depths of the desert wastelands."
 notification_eqfm_senussi_arrival_name: "The $eqfm_sanusiyyah_movement$ Returns to [ROOT.GetCountry.GetName]"
 notification_eqfm_senussi_arrival_desc: "Despite being driven out, the followers of $eqfm_sanusiyyah$ have once again managed to establish a foothold in [ROOT.GetCountry.GetName]"
 
 notification_eqfm_sanusiyyah_involved_name: "[ROOT.GetCountry.GetNameNoFlag] becomes involved with the $eqfm_sanusiyyah_movement$"
 notification_eqfm_sanusiyyah_involved_desc: "[ROOT.GetCountry.GetNameNoFlag] presence in the [GetGeographicRegion('geographic_region_sanusiyyah').GetName] has resulted in us becoming involved in the $je_eqfm_sanusiyyah$ [concept_journal_entry]."
