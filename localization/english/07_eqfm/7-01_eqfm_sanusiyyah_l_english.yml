 # Scripted Buttons
 eqfm_embrace_sanusiyyah_name: "Embrace $eqfm_sanusiyyah$ in [ROOT.GetCountry.GetName]"
 eqfm_embrace_sanusiyyah_desc: "The $eqfm_sanusiyyah_movement$ permeates every aspect of [ROOT.GetCountry.GetAdjectiveNoFlag] society. The time has come to throw off the tradition of Turkish rule and embrace a new future for [ROOT.GetCountry.GetNameNoFormatting]."
 eqfm_embrace_sanusiyyah_possible: "Support for $eqfm_sanusiyyah$ is at #bold Maximum#!"
 eqfm_embrace_sanusiyyah_effect: "[GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_senussi_character_var').GetCharacter.GetLastName] will become the [concept_ruler] of [ROOT.GetCountry.GetNameNoFlag]"
 eqfm_expell_sanusiyyah_name: "Expel $eqfm_sanusiyyah$ from [ROOT.GetCountry.GetName]"
 eqfm_expell_sanusiyyah_desc: "The $eqfm_sanusiyyah_movement$ has been driven out of our cities and deep into the desert. All that remains is to round up their last supporters and shutter their last lodges to extinguish these radicals."
 eqfm_sweep_sanusiyyah_possible: "The $eqfm_sanusiyyah_movement$ has #bold 0 or less#! $eqfm_sanusiyyah_influence_short$ in [ROOT.GetCountry.GetNameNoFlag]"
 eqfm_expell_sanusiyyah_effect: "The $eqfm_sanusiyyah_movement$ will be expelled from [ROOT.GetCountry.GetNameNoFlag] never to return"
 eqfm_send_armed_delegation_name: "Send Armed Delegation"
 eqfm_send_armed_delegation_desc: "Despite being pushed out from the cities, Senussi continues to send his missionaries into our urban areas. We should send him a message to stay in his lane."
 eqfm_send_armed_delegation_possible: "[ROOT.GetCountry.GetNameNoFlag] has any [concept_state] whose [concept_state_region] is experiencing $eqfm_sanusiyyah_entrenchment_short$ from the $eqfm_sanusiyyah_movement$"
 eqfm_broker_power_deal_name: "Broker Deal with Tribes"
 eqfm_broker_power_deal_desc: "The western deserts are home to the [GetCulture('bedouin').GetName] nomads. Without their cooperation, attempts at colonization or centralization are doomed to failure. However, their compliance usually comes with a price."
 
 eqfm_adopt_welcoming_stance_name: "@green_checkmark! Endorse $eqfm_sanusiyyah_no_icon$"
 eqfm_adopt_welcoming_stance_desc: "The $eqfm_sanusiyyah_movement$ represents an organized resistance to the threat of colonization by the western powers. Empowering the followers of as-Senussi may be our greatest chance at survival."
 eqfm_adopt_welcoming_stance_effect_1: "Any monthly progress from [concept_legitimacy] will be counted #bold in favor#! of $eqfm_sanusiyyah_influence$ in [ROOT.GetCountry.GetNameNoFlag]"
 eqfm_adopt_welcoming_stance_effect_2: "[ROOT.GetCountry.GetNameNoFlag] may encounter more events #bold increasing#! $eqfm_sanusiyyah_influence_short$ and $eqfm_sanusiyyah_entrenchment_short$"
 eqfm_adopt_aloof_stance_name: "@politically_unaligned! Ignore $eqfm_sanusiyyah_no_icon$"
 eqfm_adopt_aloof_stance_desc: "Despite their inflammatory rhetoric, the state should take no stance regarding the $eqfm_sanusiyyah_movement$."
 eqfm_adopt_aloof_stance_effect_1: "Any monthly progress from [concept_legitimacy] will #bold not be counted#! towards $eqfm_sanusiyyah_influence$ growth in [ROOT.GetCountry.GetNameNoFlag]"
 eqfm_adopt_hostile_stance_name: "@red_cross! Oppose $eqfm_sanusiyyah_no_icon$"
 eqfm_adopt_hostile_stance_desc: "With its rejection of Orthodox Islam, the $eqfm_sanusiyyah_movement$ is a grave threat to the stability of the state. We should act decisively to restrict their influence."
 eqfm_adopt_hostile_stance_effect_1: "Any monthly progress from [concept_legitimacy] will be counted #bold against#! $eqfm_sanusiyyah_influence$ in [ROOT.GetCountry.GetNameNoFlag]"
 eqfm_adopt_hostile_stance_effect_2: "[ROOT.GetCountry.GetNameNoFlag] may encounter more events #bold decreasing#! $eqfm_sanusiyyah_influence_short$ and $eqfm_sanusiyyah_entrenchment_short$"
 eqfm_adopt_stance_possible: "[ROOT.GetCountry.GetNameNoFlag] has not changed its stance towards $eqfm_sanusiyyah$ within the last year!"
 eqfm_adopt_stance_effect: "[ROOT.GetCountry.GetNameNoFlag] will be unable to change its stance towards $eqfm_sanusiyyah$ for #v 1 year#!"
 
