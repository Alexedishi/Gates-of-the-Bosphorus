 notification_eqfm_senussi_urbanized_down_desc: "Recent setbacks in the influence of the $eqfm_sanusiyyah_movement$ has forced [GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_senussi_character_var').GetCharacter.GetFullName]'s followers to withdraw into urban centers."
 notification_eqfm_senussi_villages_up_name: "[GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_senussi_character_var').GetCharacter.GetLastName] Advances into Desert Villages"
 notification_eqfm_senussi_villages_up_desc: "The Dominance of the $eqfm_sanusiyyah_movement$ has allowed [GetGlobalVariable('je_eqfm_sanusiyyah').Var('eqfm_senussi_character_var').GetCharacter.GetFullName]'s followers to advance into desert villages."
