l_english:
 # Journal Entries
 je_eqfm_libyan_desert: "The Libyan Deserts"
 je_eqfm_libyan_desert_reason: "Through millennia of servitude to foreign overlords, [ROOT.GetCountry.GetNameNoFlag] has only exerted nominal control over the deserts to its south. Foreign powers angle to stretch their tendrils across the world, and the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must act quickly to secure the southern border.\n$TOOLTIP_DELIMITER$\n @information! As long as we maintain a $eqfm_desert_expedition$ with over #v 5#! $eqfm_expedition_progress$, the [GetStateRegion('STATE_LIBYAN_DESERT').GetName] will receive the #tooltippable #tooltip:[GetRawTextTooltipTag('je_eqfm_libyan_desert_modifier')] $modifier_eqfm_desert_scouting$#!#! [concept_modifier]."
 je_eqfm_libyan_desert_status_default: "We control #v [GetPlayer.MakeScope.Var('eqfm_desert_provinces_var').GetValue]#! of #bold 209#! $gbbf_provinces$"
 je_eqfm_libyan_desert_status_expedition: "[GetPlayer.MakeScope.Var('eqfm_desert_expedition_leader_var').GetCharacter.GetFullName] leads the $eqfm_expedition$\n$eqfm_expedition_progress$: #bold #green [GetPlayer.MakeScope.Var('eqfm_desert_expedition_progress_var').GetValue]#!/8#! $eqfm_expedition_peril$: #bold #red [GetPlayer.MakeScope.Var('eqfm_desert_expedition_peril_var').GetValue]#!/5#!"
 je_eqfm_libyan_desert_modifier: "[GetStaticModifier('modifier_eqfm_desert_scouting').GetDesc]"

 # Modifiers
 modifier_eqfm_leading_desert_expedition: "Leading Desert Expedition"
 modifier_eqfm_desert_scouting: "Desert Scouting"
 modifier_eqfm_completed_desert_expedition: "Completed Desert Expedition"
 modifier_eqfm_cancelled_desert_expedition: "Cancelled Desert Expedition"
 modifier_eqfm_failed_desert_expedition_country: "Failed Desert Expedition"
 modifier_eqfm_failed_desert_expedition_character: "Failed Desert Expedition"
 modifier_eqfm_resupplied_desert_expedition: "Resupplied Desert Expedition"
 modifier_eqfm_tamed_wilderness: "Tamed the Wilderness"
 modifier_eqfm_administrative_disarray: "Administrative Disarray"
 modifier_eqfm_dissident_teachings: "Dissident Teachings"
 modifier_eqfm_tribal_conflicts: "Tribal Conflicts"
 modifier_eqfm_settled_conflict: "Settled Tribal Quarrel"
 modifier_eqfm_enforced_tax_law: "Enforced Tax Law"
 modifier_eqfm_brokered_tax_deal: "Brokered Tax Deal"
 modifier_eqfm_enboldened_nomads: "Emboldened Nomads"
 modifier_eqfm_desert_diplomat: "Desert Diplomat"
 modifier_eqfm_tribal_feuds: "Tribal Feuding"
 modifier_eqfm_desert_routes_mapped: "Desert Routes Mapped"
 modifier_eqfm_desert_routes_thoroughly_mapped: "Desert Routes Thoroughly Mapped"
 modifier_eqfm_nomad_recruits_country: "Recruited Desert Nomads"
 modifier_eqfm_nomad_recruits_state: "Recruited Desert Nomads"
 modifier_eqfm_nomad_recruits_character: "Recruited Desert Nomads"

 # Notifications
 notification_notification_eqfm_desert_raids_halted_name: "Desert Raids Halted"
 notification_notification_eqfm_desert_raids_halted_desc: "As [GetPlayer.GetName] does not have an active $eqfm_desert_expedition$, it is not possible to conduct #bold Desert Raids#!."
 notification_notification_eqfm_yearly_progress_name: "$eqfm_desert_expedition$ Makes Progress"
 notification_notification_eqfm_yearly_progress_desc: "Between warding off tribal raids and conducting diplomacy with tribal heads, our $eqfm_expedition$ has made progress in taming the [GetStateRegion('STATE_LIBYAN_DESERT').GetName]."

 # Scripted Buttons
 eqfm_deploy_desert_expedition_button: "Deploy $eqfm_desert_expedition$"
 eqfm_deploy_desert_expedition_button_desc: "[ROOT.GetCountry.GetNameNoFlag] carries the $turkfm_tanzimat$'s mandate to exert state control over both its cities and the deserts. We can aid our efforts to establish control by deploying a $eqfm_desert_expedition$"
 eqfm_deploy_desert_expedition_possible: "[ROOT.GetCountry.GetNameNoFlag] has a [concept_colony] in the [GetStateRegion('STATE_LIBYAN_DESERT').GetName]"
 eqfm_cancel_desert_expedition_button: "Recall $eqfm_desert_expedition$"
 eqfm_cancel_desert_expedition_button_desc: "$eqfm_recall_expedition_button_desc$"
 eqfm_resupply_desert_expedition_button: "Resupply $eqfm_desert_expedition$"
 eqfm_resupply_desert_expedition_button_desc: "The [GetStateRegion('STATE_LIBYAN_DESERT').GetName] is a harsh and inhospitable place. The $eqfm_desert_expedition$ will need all the support we can provide."
 eqfm_resupply_desert_expedition_possible: "The $eqfm_desert_expedition$ has #bold #red 3#! or more#! $eqfm_expedition_peril$"
 eqfm_resupply_desert_expedition_effect: "This will reduce $eqfm_desert_expedition$ $eqfm_expedition_peril$ by #bold #green 3#!#! (to a minimum of 0)"

 # Tooltips
 eqfm_desert_expedition: "@gbbf_expedition_desert! #yellow #tooltip:[GetRawTextTooltipTag('eqfm_desert_expedition_desc')] Desert Expedition#!#!"
 eqfm_desert_expedition_desc: "The [GetStateRegion('STATE_LIBYAN_DESERT').GetName] has never truly come under a central authority, with imperial and state control limited to the coasts and major settlements. With the spread of the $turkfm_tanzimat$, however, has come a renewed push to finally dominate these hostile lands."
 eqfm_desert_expedition_details: "As long as $eqfm_expedition$ $eqfm_expedition_progress$ remains over 5 #bold #green 8#!#!, [GetPlayer.GetNameNoFlag] will receive the [GetModifierType('modifier_eqfm_desert_scouting').GetName] [concept_modifier]. If $eqfm_expedition$ $eqfm_expedition_peril$ reaches #red #bold 5#!#!, [GetPlayer.GetNameNoFlag]'s expedition will be forced to withdraw."