 # Notifications
 notification_eqfm_desert_raids_halted_name: "Desert Raids Halted"
 notification_eqfm_desert_raids_halted_desc: "As [GetPlayer.GetName] does not have an active $eqfm_desert_expedition$, it is not possible to conduct #bold Desert Raids#!."

 # Tooltips
 eqfm_desert_expedition: "@gbbf_expedition_desert! #yellow #tooltip:[GetRawTextTooltipTag('eqfm_desert_expedition_desc')] Desert Expedition#!#!"
 eqfm_desert_expedition_desc: "The [GetStateRegion('STATE_LIBYAN_DESERT').GetName] has never truly come under a central authority, with imperial and state control limited to the coasts and major settlements. With the spread of the $turkfm_tanzimat$, however, has come a renewed push to finally dominate these hostile lands."
 eqfm_desert_expedition_details: "As long as $eqfm_expedition$ $eqfm_expedition_progress$ remains over 5 #bold #green 8#!#!, [GetPlayer.GetNameNoFlag] will receive the [GetStaticModifier('modifier_eqfm_desert_scouting').GetName] [concept_modifier]. If $eqfm_expedition$ $eqfm_expedition_peril$ reaches #red #bold 5#!#!, [GetPlayer.GetNameNoFlag]'s expedition will be forced to withdraw."