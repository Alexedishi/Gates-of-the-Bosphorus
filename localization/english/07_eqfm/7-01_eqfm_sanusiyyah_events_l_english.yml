l_english:
 eqfm_sanusiyyah.001.t: "The Senussi Order"
 eqfm_sanusiyyah.001.d: "An unassuming [GetReligion('sunni').GetName] scholar, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName], has arrived in [ROOT.GetCountry.GetNameNoFlag]. In advocating for reform of [GetReligion('sunni').GetName] Islam and independence from [ROOT.GetCountry.GetOverlord.GetName], he has gained recognition amongst the [GetCulture('bedouin').GetName] tribes of the desert."
 eqfm_sanusiyyah.001.f: "Outside of the major settlements, spiritual lives in the deserts are guided less by the $gbbf_devout$ and more by itinerant preachers known by the term [GetCharacterTrait('gbbf_trait_marabout').GetName]. These figures often act as tribal mediators and intermediaries between state authorities and tribal leaders."
 eqfm_sanusiyyah.001.a: "This could be troublesome."
 eqfm_sanusiyyah.001.a.tt: "Should the $eqfm_sanusiyyah_movement$ become dominant in a [concept_country], their [GetCulture('bedouin').GetName] $gbbf_pops$ will become more resistant to centralized rule."
 
 eqfm_sanusiyyah.002.t: "The Grand Senussi"
 eqfm_sanusiyyah.002.d: "#yellow Muhammad ibn Ali#! has died. In his place, his son [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName], has risen to head the $eqfm_sanusiyyah$ Order. Hailed as the "Mahdi" or "Great One," he is poised to lead the order to greater influence."
 eqfm_sanusiyyah.002.f: "While [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName] has refused to claim the title of "Mahdi," that has done little to dissuade adherents of the order from proclaiming him to a be saint in the making."
 eqfm_sanusiyyah.002.a: "Definitely troublesome."
 eqfm_sanusiyyah.002.a.tt: "With the #bold Grand Senussi#! at the helm, the $eqfm_sanusiyyah_movement$ will begin to spread across the [GetGeographicRegion('geographic_region_sanusiyyah').GetName] [concept_georegion]"
 
 eqfm_sanusiyyah.003.t: "Senussi Withdraws to the Desert"
 eqfm_sanusiyyah.003.d: "In response to increased scrutiny by [ROOT.GetCountry.GetNameNoFlag], [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName] has relocated his operations deep into the deserts of [SCOPE.sCountry('eqfm_sanusiyyah_tribal_scope').GetNameNoFlag] in the hopes of evading our patrols."
 eqfm_sanusiyyah.003.f: "While much harsher an environment than the cities and oases, the deserts offer ample places to hide from the eyes of the state."
 eqfm_sanusiyyah.003.a: "Serves them right."
 
 eqfm_sanusiyyah.004.t: "Armed Diplomacy"
 eqfm_sanusiyyah.004.d: "Our armed delegation has arrived at [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFirstName]'s base of operations in [SCOPE.sState('eqfm_sanusiyyah_tribal_scope').GetName]. Following a tense exchange with [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName], a nominal agreement was struck to minimize interference with the [ROOT.GetCountry.GetAdjectiveNoFlag] administration."
 eqfm_sanusiyyah.004.f: "While discussions were cordial, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName] appeared to understand the nature of our visit. However, advisors have been quick to caution that there is little we can to do actually enforce any agreements."
 eqfm_sanusiyyah.004.a: "Let this be a message."
 
 eqfm_sanusiyyah.005.t: "The State-within-a-State"
 eqfm_sanusiyyah.005.d: "As the influence of the $eqfm_sanusiyyah_movement$ continues to grow in [ROOT.GetCountry.GetNameNoFlag], [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName] has proposed the organization of his adherents and their lodges into a \"state-within-a-State.\""
 eqfm_sanusiyyah.005.f: "While wrapped in the noble cause of defending his followers, the Grand Senussi threatens the supremacy of the Sultan in state and social affairs."
 eqfm_sanusiyyah.005.a: "This is concerning."
 
 eqfm_sanusiyyah.006.t: "The Grand Senussi Brokers Peace"
 eqfm_sanusiyyah.006.d: "Traders from the Libyan frontier have reported an seismic events amongst the tribes: aiming to increase his standing in the deserts, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName] has brokered a peace between the long warring tribes of [SCOPE.sCountry('zuwayya_scope').GetName] and [SCOPE.sCountry('concussion_scope').GetName]."
 eqfm_sanusiyyah.006.f: "\"People from the Zuwayya tribe came to us and asked for forgiveness and asked us to build a Zawiya in Tzir. We want to be your neighbours, to teach you and your children the book of Allah. We want to reconcile you with the Zuwayya, who used to attack you and take your money and children, by turning to the Qur'an, which demands reconciliation among Muslims.\" —Letter from the Grand Senussi to the Tubu tribe"
 eqfm_sanusiyyah.006.a: "So he's just a regular diplomat now?"
 
 eqfm_sanusiyyah.007.t: ""
 eqfm_sanusiyyah.007.d: ""
 eqfm_sanusiyyah.007.f: ""
 eqfm_sanusiyyah.007.a: ""
 eqfm_sanusiyyah.007.b: ""
 
 eqfm_sanusiyyah.008.t: "The Future of the $eqfm_sanusiyyah_movement$"
 eqfm_sanusiyyah.008.d: ""
 eqfm_sanusiyyah.008.f: ""
 eqfm_sanusiyyah.008.a: ""
 eqfm_sanusiyyah.008.b: ""
 
 eqfm_sanusiyyah.009.t: "The $eqfm_sanusiyyah_movement$ Extinguished"
 eqfm_sanusiyyah.009.d: "In accordance with the mandate of the $turkfm_porte$, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has driven back the adherents of the $eqfm_sanusiyyah_movement$ and ensured the extinction of their school of thought."
 eqfm_sanusiyyah.009.f: "By securing the country against the followers of Senussi, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has also secured the dominance of [GetCulture('turkish').GetName] influence over [ROOT.GetCountry.GetName]."
 eqfm_sanusiyyah.009.a: "The $gbbf_devout$ will guide [ROOT.GetCountry.GetName]."
 
 eqfm_sanusiyyah.100.t: "Marabouts Spread Dissident Teachings"
 eqfm_sanusiyyah.100.d: "Several [GetCharacterTrait('gbbf_trait_marabout').GetName]#yellow s#! have been reported to be spreading teachings that run in defiance of the Ulema. Already small lodges have been reported taking root in [SCOPE.sState('eqfm_senussi_marabout_state').GetName]."
 eqfm_sanusiyyah.100.f: "With no centralized authority to answer to, the Marabout wanders from village to village, spreading their unique interpretations of Islamic jurisprudence."
 eqfm_sanusiyyah.100.a: "Leave them be."
 eqfm_sanusiyyah.100.b: "Shutter these lodges before this grows."
 
 eqfm_sanusiyyah.101.t: "Insecure Desert Routes"
 eqfm_sanusiyyah.101.d: "Traders from the south have warned that trade routes across the desert have been disrupted by conflicts between [GetCulture('bedouin').GetName] tribes."
 eqfm_sanusiyyah.101.f: "\"So long as the Arabs fight tribe against tribe, so long will they be a little people, a silly people - greedy, barbarous, and cruel..."\"
 eqfm_sanusiyyah.101.a: "Their quarrels are beyond our concern."
 eqfm_sanusiyyah.101.b: "We should broker a peace."
 eqfm_sanusiyyah.101.c: "Have our $eqfm_desert_expedition$ secure the way."
 
 eqfm_sanusiyyah.102.t: "Issues with Taxation"
 eqfm_sanusiyyah.102.d: "Disagreements have erupted between local beys and [GetCulture('bedouin').GetName] leaders in [SCOPE.sState('eqfm_desert_event_state').GetName] over the application of tax policy. Tribal leaders insist they entitled to a portion of revenues collected, while the beys seek to move all taxes under their jurisdiction."
 eqfm_sanusiyyah.102.f: "\"There's nothing further here for a warrior. We drive bargains. Old men's work. Young men make wars, and the virtues of war are the virtues of young men. Courage and hope for the future. Then old men make the peace.\""
 eqfm_sanusiyyah.102.a: "The law of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] will be the only law."
 eqfm_sanusiyyah.102.b: "They will have their share."

 eqfm_sanusiyyah.200.t: "#filler Sanusiyyah Entrenchment Sprinkler Apparatus#!"
 eqfm_sanusiyyah.200.d: "#filler eqfm_sanusiyyah.200.d#!"
 eqfm_sanusiyyah.200.f: "#filler eqfm_sanusiyyah.200.f#!"
 eqfm_sanusiyyah.200.a: "#filler eqfm_sanusiyyah.200.a#!"
 
 eqfm_sanusiyyah.201.t: "$eqfm_sanusiyyah$ Spreads to [SCOPE.sStateRegion('eqfm_sanusiyyah_state_region_scope').GetName]"
 eqfm_sanusiyyah.201.d: "Comfortable in his level of influence, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName] has dispatched missionaries across the deserts of [SCOPE.sStateRegion('eqfm_sanusiyyah_state_region_scope').GetName] to spread the message of $eqfm_sanusiyyah$."
 eqfm_sanusiyyah.201.f: "By operating deep in the deserts, the followers of Senussi are able to evade central authority. To them, international borders are merely a suggestion."
 eqfm_sanusiyyah.201.a: "So be it."

 eqfm_sanusiyyah.202.t: "The Awliya of [SCOPE.sStateRegion('eqfm_sanusiyyah_state_region_scope').GetName]"
 eqfm_sanusiyyah.202.d: "Local administrators in [SCOPE.sStateRegion('eqfm_sanusiyyah_state_region_scope').GetName] has uncovered an extensive network of shrines devoted to local saint-like figures. The $gbbf_devout$ has been quick to condemn this practice as contravening orthodox teaching."
 eqfm_sanusiyyah.202.f: "Most tribesmen and peasants practice a form of folk Islam. Professing their belief in saints or "awliya", they visit local shrines often asking for blessings, cures and protection."
 eqfm_sanusiyyah.202.a: "We must discourage this practice."
 eqfm_sanusiyyah.202.b: "This is a backwards, yet harmless practice."
 eqfm_sanusiyyah.202.c: "Tear down these shrines. Burn the idols."
 
 eqfm_sanusiyyah.203.t: "Sufism Spreads in [SCOPE.sStateRegion('eqfm_sanusiyyah_state_region_scope').GetName]"
 eqfm_sanusiyyah.203.d: "With the dispersal of $eqfm_sanusiyyah$ preachers across the desert has come a renewed wave of Sufism across the tribes. While not outright contradicting the authority of the state, mystical teaching threatens the $gbbf_devout$'s control over spiritual affairs."
 eqfm_sanusiyyah.203.f: "By simplifying the abstract literature of Islam for the tribesmen, [GetCharacterTrait('gbbf_trait_marabout').GetName]#yellow s#! have democratized the study of scripture in a way that threatens the standing of the [SCOPE.gsInterestGroup('devout_scope').GetName]."
 eqfm_sanusiyyah.203.a: "Detain these dissidents and disavow their teachings."
 eqfm_sanusiyyah.203.b: "Their path might be strange, but it is of no concern."
 eqfm_sanusiyyah.203.c: "Let us make an example out of these men. To the gallows!"

 eqfm_sanusiyyah.300.t: "$eqfm_sanusiyyah$ Spreads to [SCOPE.sCountry('eqfm_senussi_target_country').GetName]"
 eqfm_sanusiyyah.300.d: "Missionaries of the $eqfm_sanusiyyah_movement$ have arrived at the court in [SCOPE.sCountry('eqfm_senussi_target_country').GetCapital.GetCityHubName]. Despite the outcry of the established Ulama, they have found some willing ears."
 eqfm_sanusiyyah.300.f: "With their message of dissent against the perceived decadence of the $turkfm_porte$, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]'s preachings strike a common chord with fellow Muslims."
 eqfm_sanusiyyah.300.a: "So be it."
 eqfm_sanusiyyah.300.b: "The state cannot tolerate these mystics."
 eqfm_sanusiyyah.300.c: "We shall spread the word!"
 
 eqfm_sanusiyyah.301.t: "$eqfm_sanusiyyah$ Spreads to [SCOPE.sCountry('eqfm_senussi_target_country').GetName]"
 eqfm_sanusiyyah.301.d: ""
 eqfm_sanusiyyah.301.f: "With their message of dissent against the perceived decadence of the $turkfm_porte$, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]'s preachings strike a common chord with fellow Muslims."
 eqfm_sanusiyyah.301.a: "This could be troublesome."
 eqfm_sanusiyyah.301.a.tt: "Should the $eqfm_sanusiyyah_movement$ become dominant in a [concept_country], their [GetCulture('bedouin').GetName] $gbbf_pops$ will become more resistant to centralized rule."
 
 eqfm_sanusiyyah.302.t: "$eqfm_sanusiyyah$ Spreads to [SCOPE.sCountry('eqfm_senussi_target_country').GetName]"
 eqfm_sanusiyyah.302.d: ""
 eqfm_sanusiyyah.302.f: "With their message of dissent against the perceived decadence of the $turkfm_porte$, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]'s preachings strike a common chord with fellow Muslims."
 eqfm_sanusiyyah.302.a: "This could be troublesome."
 eqfm_sanusiyyah.302.a.tt: "Should the $eqfm_sanusiyyah_movement$ become dominant in [SCOPE.sCountry('eqfm_senussi_target_country').GetName], [GetCulture('bedouin').GetName] $gbbf_pops$ will become more resistant to our rule."
 
 eqfm_sanusiyyah.303.t: "The $eqfm_sanusiyyah_movement$ Expelled from [ROOT.GetCountry.GetName]"
 eqfm_sanusiyyah.303.d: ""
 eqfm_sanusiyyah.303.f: ""
 eqfm_sanusiyyah.303.a: ""
 
 eqfm_sanusiyyah.304.t: "House Senussi of [ROOT.GetCountry.GetName]"
 eqfm_sanusiyyah.304.d: "Arriving flanked by cheering crowds, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName], the head of the $eqfm_sanusiyyah_movement$ in [ROOT.GetCountry.GetNameNoFlag], has taken the throne of [ROOT.GetCountry.GetName]."
 eqfm_sanusiyyah.304.f: ""
 eqfm_sanusiyyah.304.a: "The $eqfm_sanusiyyah_movement$ will guide [ROOT.GetCountry.GetName]"
 
 eqfm_sanusiyyah.305.t: "Imams Defect from the [SCOPE.gsInterestGroup('devout_scope').GetName]"
 eqfm_sanusiyyah.305.d: "The leadership of the [SCOPE.gsInterestGroup('devout_scope').GetName] of [ROOT.GetCountry.GetNameNoFlag] has been thrown into disarray with several senior members declaring their sympathies for the $eqfm_sanusiyyah_movement$. The entrenched authorities have requested that the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] restore order."
 eqfm_sanusiyyah.305.f: "\"There are many paths to God.\" —Muhammad al-Sanusi"
 eqfm_sanusiyyah.305.a: "Arrest and depose these traitors."
 eqfm_sanusiyyah.305.b: "This is not the state's concern."
 
 eqfm_sanusiyyah.306.t: "Dissidents Preach in [SCOPE.sState('eqfm_sanusiyyah_state_scope').GetName]"
 eqfm_sanusiyyah.306.d: "Followers of the $eqfm_sanusiyyah_movement$ have recently increased their activities in the cities of [ROOT.GetCountry.GetNameNoFlag]"
 eqfm_sanusiyyah.306.f: "\"Does a bird have a mind or not?\"\n\"No.\"\n\"Yet, he puts his eggs on the top of a remote mountain so no fox or wolf can get them. Does the Yarbu' have a mind or not?\"\n\"No.\"\n\"Yet he digs many routes in his tunnel to escape snakes. Thus, be aware of the black snake which will come to you and point in an east-west direction.\" —The Grand Sanusi to his followers at Jaghbub"
 eqfm_sanusiyyah.306.a: "What of it? They have no standing."
 eqfm_sanusiyyah.306.b: "Have the $gbbf_devout$ confront their heresy."
 
 eqfm_sanusiyyah.307.t: "Sufist Thought in [SCOPE.sState('eqfm_sanusiyyah_state_scope').GetName]"
 eqfm_sanusiyyah.307.d: ""
 eqfm_sanusiyyah.307.f: "[GetCharacterTrait('gbbf_trait_marabout').GetName]#yellow s#! often play a pivotal role in tribal society by teaching the Quran, mediating disputes, leading religious festivals, and guarding the shrines of the saints. They are respected as teachers, judges, healers, and writers."
 eqfm_sanusiyyah.307.a: ""
 
 eqfm_sanusiyyah.400.t: "Contacting the Tribes in []"
 eqfm_sanusiyyah.400.d: ""
 eqfm_sanusiyyah.400.f: ""
 eqfm_sanusiyyah.400.a: ""
 eqfm_sanusiyyah.400.b: ""
 
 eqfm_sanusiyyah.401.t: "$eqfm_sanusiyyah$ Lodges Uncovered in []"
 eqfm_sanusiyyah.401.d: "Scouts have discovered a lodge for $eqfm_sanusiyyah$ activity in [GetPlayer.MakeScope.Var('eqfm_sanusiyyah_expedition_var').GetName]. The expedition awaits [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetLastName]'s orders."
 eqfm_sanusiyyah.401.f: "Despite being centers for spiritual life in the deserts, many lodges are nondescript and rarely centralized, allowing them to slip below the notice of our agents."
 eqfm_sanusiyyah.401.a: "Detain these clerics and shutter the lodge."
 eqfm_sanusiyyah.401.b: "Burn the whole settlement down."
 
 eqfm_sanusiyyah.402.t: "$eqfm_sanusiyyah$ Lodges Destroyed in []"
 eqfm_sanusiyyah.402.d: ""
 eqfm_sanusiyyah.402.f: ""
 eqfm_sanusiyyah.402.a: ""
 eqfm_sanusiyyah.402.b: ""
 
 eqfm_sanusiyyah.403.t: "$eqfm_sanusiyyah$ Expelled from [SCOPE.sState('eqfm_sanusiyyah_expedition_state_scope').GetName]"
 eqfm_sanusiyyah.403.d: "Following weeks of tracking down the last of the Marabouts in [SCOPE.sState('eqfm_sanusiyyah_expedition_state_scope').GetName], [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetPrimaryRoleTitle] has reported that they have successfully driven away any adherents to the $eqfm_sanusiyyah$ order."
 eqfm_sanusiyyah.403.f: "\"And stay out!\""
 eqfm_sanusiyyah.403.a: "Good riddance."
 
 eqfm_sanusiyyah.404.t: "Hiring a Leader"
 eqfm_sanusiyyah.404.d: ""
 eqfm_sanusiyyah.404.f: "\"Undisciplined... unpunctual... untidy. Several languages. Knowledge of music... literature... knowledge of... knowledge of... you're an interesting man there's no doubt about it.\""
 eqfm_sanusiyyah.404.a: ""
 eqfm_sanusiyyah.404.b: ""
 
 eqfm_sanusiyyah.405.t: "Hiring a Guide"
 eqfm_sanusiyyah.405.d: ""
 eqfm_sanusiyyah.405.f: "\"You send your navy and demand that I must pay my debts to you, and the expenses of your expedition. But how could I pay my debts when you have reduced my revenues to just taxes on agriculture and especially when we did not have enough rain in the last four years?\" —Yusuf Pasha, to the British Consul in Tripoli, 1831"
 eqfm_sanusiyyah.405.a: ""
 eqfm_sanusiyyah.405.b: ""
 
 eqfm_sanusiyyah.406.t: "Hiring a Logistician"
 eqfm_sanusiyyah.406.d: ""
 eqfm_sanusiyyah.406.f: "\"And that is the desert. From here until we reach the other side, no water but what we carry with us. For the camels, no water at all. If the camels die, we die. And in twenty days they will start to die.\""
 eqfm_sanusiyyah.406.a: ""
 eqfm_sanusiyyah.406.b: ""
 
 eqfm_sanusiyyah.410.t: "A Storm of Sand"
 eqfm_sanusiyyah.410.d: "The $eqfm_desert_expedition$ has been enveloped by a brutal sandstorm which shows no signs of relenting any time soon."
 eqfm_sanusiyyah.410.f: "\"Lawrence, only two kinds of creature get fun in the desert: Bedouins and gods, and you're neither. Take it from me, for ordinary men, it's a burning, fiery furnace.\""
 eqfm_sanusiyyah.410.a: "\"Everyone, find shelter!\""
 eqfm_sanusiyyah.411.t: "Sand, Sand, and More Sand"
 eqfm_sanusiyyah.411.d: "The $eqfm_desert_expedition$ has become disoriented in an area of featureless desert with minimal landmarks."
 eqfm_sanusiyyah.411.f: "\"My lord, I think... I think your book is right. 'The desert is an ocean in which no oar is dipped' and on this ocean the Bedu go where they please and strike where they please'...\""
 eqfm_sanusiyyah.411.a: "\"I thought they knew how to work a compass...\""
 eqfm_sanusiyyah.411.b: "\"Thankfully, [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFullName] knows the way.\""
 eqfm_sanusiyyah.412.t: "A Welcome Respite"
 eqfm_sanusiyyah.412.d: "\"Yes, sir! Right up ahead!\"\nThe $eqfm_desert_expedition$ let out collective sighs of relief as a forward scout confirmed the suspected sightings of water were, in fact, a poorly known oasis. With their waterskins refilled and camels rested, the men await further direction."
 eqfm_sanusiyyah.412.f: "\"He longs for the greenness of his native land. He pines for the Gothic cottages of Surrey, is it not? Already in imagination, he catches trout and engages in all the activities of the English gentleman.\""
 eqfm_sanusiyyah.412.a: "\"We shouldn't tarry too long, the sands await.\""
 eqfm_sanusiyyah.412.b: "\"Let us rest here, for it could be a long journey...\""
 eqfm_sanusiyyah.412.c: "\"Make camp. We shall call for a resupply.\""
 eqfm_sanusiyyah.413.t: "Desert Diplomacy"
 eqfm_sanusiyyah.413.d: "The $eqfm_desert_expedition$ is expected to pass within a day's travel of a major desert settlement. [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName]'s advisors have suggested this could be a chance to improve relations with local tribes."
 eqfm_sanusiyyah.413.f: "\"There may be honor among thieves, but there's none in politicians.\""
 eqfm_sanusiyyah.413.a: "\"Send word to local chiefs that we would host them.\""
 eqfm_sanusiyyah.413.b: "\"Stop for supplies, nothing more.\""
 eqfm_sanusiyyah.413.c: "\"This is a waste of time.\""
 eqfm_sanusiyyah.414.t: "Charting the Desert"
 eqfm_sanusiyyah.414.d: "Several riders have returned from scouting missions for the $eqfm_desert_expedition$. This has given [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName] a decent idea of where to direct his efforts."
 eqfm_sanusiyyah.414.f: "\"No Arab loves the desert. We love water and green trees. There is nothing in the desert and no man needs nothing.\""
 eqfm_sanusiyyah.414.a: "\"Steady as we go.\""
 eqfm_sanusiyyah.414.b: "\"Let us press a little bit further.\""
 eqfm_sanusiyyah.415.t: "A Clash on Camel-back"
 eqfm_sanusiyyah.415.d: "A band of [GetCulture('bedouin').GetName] nomads have set their sights on the $eqfm_desert_expedition$. With the sun cresting over the dunes, it has become clear they intent to attack. It falls to [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName] to direct the response."
 eqfm_sanusiyyah.415.f: "\"In this country, Mr. Bentley, the man who gives victory in battle is prized beyond every other man...\""
 eqfm_sanusiyyah.415.a: "\"Form a line... there- atop that dune.\""
 eqfm_sanusiyyah.415.b: "\"No prisoners! No prisoners!\""
 eqfm_sanusiyyah.415.c: "\"Leave behind what you must!\""
 eqfm_sanusiyyah.416.t: "Tribal Justice"
 eqfm_sanusiyyah.416.d: "Riders from a nearby tribe have approached the $eqfm_desert_expedition$ with a strange dilemma- they wish to settle a quarrel between tribes, but have failed to select an adequate mediator for fear of starting a blood feud. They have proposed that [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName] act as a neutral arbitrator."
 eqfm_sanusiyyah.416.f: "\"Then I will execute the Law. I have no tribe and no one is offended.\""
 eqfm_sanusiyyah.416.a: "\"Let us oblige their request.\""
 eqfm_sanusiyyah.416.b: "\"This is beneath us.\""
 eqfm_sanusiyyah.417.t: "Welcome Rains"
 eqfm_sanusiyyah.417.d: "What first appeared as a thin shadow on the horizon turned out to be a sudden rainstorm, mostly likely the only one of the year. After finding safe ground, the $eqfm_desert_expedition$ has taken the chance to replenish water stores and wash out equipment."
 eqfm_sanusiyyah.417.f: "\"No Arab loves the desert. We love water and green trees. There is nothing in the desert and no man needs nothing.\""
 eqfm_sanusiyyah.417.a: "What a miracle!"
 eqfm_sanusiyyah.418.t: "Safe Passages Mapped"
 eqfm_sanusiyyah.418.d: "Following several days of meticulous scouting, the $eqfm_desert_expedition$ has compiled charts of several safe passages over the dunes of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName]. A team is preparing to dispatch this information to [ROOT.GetCountry.GetCapital.GetCityHubName] to aid in our colonization efforts."
 eqfm_sanusiyyah.418.f: "There is little resembling infrastructure in the deserts, and the best routes through the sands are known to the Bedouin alone."
 eqfm_sanusiyyah.418.a: "Excellent work."
 eqfm_sanusiyyah.418.b: "Let's extend the survey a bit more."
 eqfm_sanusiyyah.419.t: "Unexpected Recruits"
 eqfm_sanusiyyah.419.d: "Over the last week, the $eqfm_expedition$ has been traveling alongside a [GetCulture('bedouin').GetName] tribal band. While preparing to part ways at the outskirts of a settlement, one of their members has approached [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName] and offered to join our endeavor."
 eqfm_sanusiyyah.419.f: "\"A thousand Arabs means a thousand knives, delivered anywhere day or night. It means a thousand camels. That means a thousand packs of high explosives and a thousand crack rifles.\""
 eqfm_sanusiyyah.419.a: "The expedition must remain focused."
 eqfm_sanusiyyah.419.b: "They are welcome to settle in [SCOPE.sState('eqfm_desert_event_state').GetName]."
 eqfm_sanusiyyah.419.c: "If [SCOPE.sCharacter('eqfm_desert_expedition_leader_scope').GetFirstName] trusts them, then he shall lead them."
 eqfm_sanusiyyah.419.e: "[SCOPE.sCharacter('eqfm_desert_event_tribal_character').GetFullName] will make an excellent warrior."
 
 eqfm_sanusiyyah.420.t: "[GetCulture('bedouin').GetName] Villagers Withhold Information"
 eqfm_sanusiyyah.420.d: "While surveying the area near a settlement in [GetPlayer.MakeScope.Var('eqfm_sanusiyyah_expedition_var').GetName], [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetLastName] has become aware that local villagers have withheld critical information regarding $eqfm_sanusiyyah$ activities in the area. Worse, there is reason to suspect they have intentionally misdirected the $eqfm_sanusiyyah_expedition$."
 eqfm_sanusiyyah.420.f: "The central authority of the cities is a truly alien concept to the tribes of the deserts. Reasonably, many prefer the familiarity of marabouts over our tax collectors and garrisons."
 eqfm_sanusiyyah.420.a: "Offer them an olive branch in exchange for the truth."
 eqfm_sanusiyyah.420.b: "Arrest anyone involved in this deception."
 eqfm_sanusiyyah.420.c: "Put their leaders to the sword."
 
 eqfm_sanusiyyah.421.t: "Neighboring Tribe Attacks $eqfm_expedition$"
 eqfm_sanusiyyah.421.d: "Tribal raiders from [SCOPE.sCountry('eqfm_sanusiyyah_expedition_neighbor_scope').GetName] have attacked our $eqfm_sanusiyyah_expedition$. Casualties are limited, but this has disrupted our progress. [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetLastName] has suggested striking back before they fully depart the area."
 eqfm_sanusiyyah.421.f: "Operating far from our established power bases, the expedition finds itself at the mercy of tribal power structures."
 eqfm_sanusiyyah.421.a: "Let them go, we have more important tasks."
 eqfm_sanusiyyah.421.b: "Have our scouts ride them down."
 
 eqfm_sanusiyyah.422.t: "$eqfm_sanusiyyah_expedition$ Beset by Sandstorms!"
 eqfm_sanusiyyah.422.d: "[SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetLastName] has found himself trapped in a rapidly intensifying sandstorm. With no nearby land features, he has ordered the $eqfm_expedition$ to build whatever makeshift shelters they can to endure the storm."
 eqfm_sanusiyyah.422.f: "\"Uhh, boss? That's not a mountain range... it's getting closer.\""
 eqfm_sanusiyyah.422.a: "This is disastrous."
 eqfm_sanusiyyah.422.b: "They must find shelter at all costs!"
 eqfm_sanusiyyah.422.c: "We must trust in [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetLastNameNoFormatting]'s instincts."
 
 eqfm_sanusiyyah.423.t: "Tribal Leaders Request Meeting"
 eqfm_sanusiyyah.423.d: "Tribal Elders in [SCOPE.sState('eqfm_sanusiyyah_expedition_state_scope').GetName] have approached the $eqfm_sanusiyyah_expedition$ with a proposition: If [ROOT.GetCountry.GetName] allows them to maintain some tribal privileges, they will aid us in our pursuit of [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]."
 eqfm_sanusiyyah.423.f: "Brokering power with local leaders has long been a necessity in the deserts. With a lack of infrastructure and hostile environs, the tribes are the true authority across the Sahara."
 eqfm_sanusiyyah.423.a: "This is a fair bargain."
 eqfm_sanusiyyah.423.b: "We do not deal with barbarians."
 eqfm_sanusiyyah.423.c: "No, but we'll take the information anyway."
 
 eqfm_sanusiyyah.424.t: "$eqfm_sanusiyyah_expedition$ Misdirected"
 eqfm_sanusiyyah.424.d: "After advancing nearly three days into the open desert, [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetLastName] has realized that the $eqfm_sanusiyyah_expedition$ have been misled by [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]. It may take several days to get back on course."
 eqfm_sanusiyyah.424.f: "\"Thine mother mated with a scorpion...\""
 eqfm_sanusiyyah.424.a: "This is unfortunate."
 eqfm_sanusiyyah.424.b: "Sounds like a forced march is in order."
 eqfm_sanusiyyah.424.c: "[SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetLastNameNoFormatting] will inspire the troops."
 
 eqfm_sanusiyyah.425.t: "Caravan Found Trafficking $eqfm_sanusiyyah$ Leaders"
 eqfm_sanusiyyah.425.d: "Following an alert from [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetLastNameNoFormatting], the garrison at [SCOPE.sState('eqfm_sanusiyyah_expedition_state_scope').GetCityHubName] has intercepted a caravan intent on smuggling several $eqfm_sanusiyyah$ faithful out of [ROOT.GetCountry.GetNameNoFlag]. The garrison has reported the seizure of both dry goods and weapons, likely meant for foreign lodges."
 eqfm_sanusiyyah.425.f: "\"A thousand Arabs means a thousand knives, delivered anywhere day or night. It means a thousand camels. That means a thousand packs of high explosives and a thousand crack rifles.\""
 eqfm_sanusiyyah.425.a: "Have these goods confiscated for the state."
 eqfm_sanusiyyah.425.b: "Trace these goods to their village and make arrests."
 
 eqfm_sanusiyyah.426.t: "$eqfm_sanusiyyah_expedition$ Ambushed by Raiders!"
 eqfm_sanusiyyah.426.d: "While navigating through the deserts in [GetPlayer.MakeScope.Var('eqfm_sanusiyyah_expedition_var').GetName], the $eqfm_sanusiyyah_expedition$ has been ambushed "
 eqfm_sanusiyyah.426.f: "\"I carry twenty-three great wounds, all got in battle! Seventy-five men have I killed with my own hands in battle! I scatter, I burn my enemies' tents! I take away their flocks and herds!\""
 eqfm_sanusiyyah.426.a: "They must hold their position."
 eqfm_sanusiyyah.426.b: "Perhaps an orderly retreat is in order..."
 eqfm_sanusiyyah.426.c: "[SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetLastName] rides to their aid!"
 
 eqfm_sanusiyyah.427.t: "Desert Settlement Refuses Entry"
 eqfm_sanusiyyah.427.d: "A settlement in [GetPlayer.MakeScope.Var('eqfm_sanusiyyah_expedition_var').GetName] has refused to provide lodging for the $eqfm_sanusiyyah_expedition$. As an act of defiance, this threatens the legitimacy of [ROOT.GetCountry.GetNameNoFlag]'s designs on the desert."
 eqfm_sanusiyyah.427.f: "\"Then I will execute the Law. I have no tribe and no one is offended.\""
 eqfm_sanusiyyah.427.a: "Move along, there is no time to waste."
 eqfm_sanusiyyah.427.b: "We will assert the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s authority."
 
 eqfm_sanusiyyah.428.t: "$eqfm_sanusiyyah$ Preacher Seeks Asylum"
 eqfm_sanusiyyah.428.d: "A dishevelled and haggardly preacher has approached the expedition and declared his desire to seek asylum in [ROOT.GetCountry.GetNameNoFlag] after being run out by the $eqfm_sanusiyyah$."
 eqfm_sanusiyyah.428.f: "\"Look, sir, we can't just do nothing.\"\n\"Why not? It's usually best.\""
 eqfm_sanusiyyah.428.a: "He will find shelter in [ROOT.GetCountry.GetNameNoFlag]"
 eqfm_sanusiyyah.428.b: "We cannot trust these radicals."
 
 eqfm_sanusiyyah.429.t: "Secret Caches Found"
 eqfm_sanusiyyah.429.d: "While travelling between two nomadic camps, [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetLastNameNoFormatting] stumbled upon what appeared to be a long-abandoned encampment. On closer inspection, it has been found to be an extensive system of caches stocked with provisions and weapons by the $eqfm_sanusiyyah$."
 eqfm_sanusiyyah.429.f: "\"...this is a nasty, dark little room.\"\n\"That's right.\"\n\"We are not happy in it.\"\n\"I am. It's better than a nasty, dark little trench.\""
 eqfm_sanusiyyah.429.a: "Gather what we can safely carry."
 eqfm_sanusiyyah.429.b: "Make an exhaustive search."
 eqfm_sanusiyyah.429.c: "We should focus on the search."
 
 eqfm_sanusiyyah.430.t: "Desert Hospitality"
 eqfm_sanusiyyah.430.d: "While most villages and camps have met the expedition with hostility, today's stop has seen [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_sanusiyyah_expedition_leader_scope').GetLastNameNoFormatting] greeted with the traditional hospitality of the [GetCulture('bedouin').GetName] nomads."
 eqfm_sanusiyyah.430.f: "\"There may be honor among thieves, but there's none in politicians.\""
 eqfm_sanusiyyah.430.a: "Let us be on our way."
 eqfm_sanusiyyah.430.b: "I'm sure they can offer a \"little\" more."