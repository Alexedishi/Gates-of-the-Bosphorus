 # Notifications
 notification_notitication_eqfm_balkans_involved_name: "[ROOT.GetCountry.GetNameNoFlag] Becomes $eqfm_involved$ in the $eqfm_balkan_situation$"
 notification_notitication_eqfm_balkans_involved_desc: "Due to meeting the criteria, [ROOT.GetCountry.GetNameNoFlag] is now $eqfm_involved$ in the $eqfm_balkan_situation$ and may now influence its outcome."
 notification_notification_eqfm_balkans_not_involved_name: "[ROOT.GetCountry.GetNameNoFlag] No Longer $eqfm_involved$ in the $eqfm_balkan_situation$"
 notification_notification_eqfm_balkans_not_involved_desc: "Due to meeting the criteria, [ROOT.GetCountry.GetNameNoFlag] is #bold no longer#! $eqfm_involved$ in the $eqfm_balkan_situation$."
 
 notification_notification_eqfm_secession_start_name: "Uprising in the Balkans!"
 notification_notification_eqfm_secession_start_desc: "Radicals in the Balkans have ejected the local administration and declared an uprising against the $turkfm_porte$!"

 notification_notification_eqfm_transition_stable_name: "$eqfm_balkan_situation$ Phase Transitions to $eqfm_stable$"
 notification_notification_eqfm_transition_stable_desc: "Tensions in the [GetStrategicRegion('region_balkans').GetName] have simmered, transitioning to the $eqfm_stable$ phase."
 notification_notification_eqfm_transition_unrest_name: "$eqfm_balkan_situation$ Phase Transitions to $eqfm_unrest$"
 notification_notification_eqfm_transition_unrest_desc: "Tensions in the [GetStrategicRegion('region_balkans').GetName] have increased, transitioning to the $eqfm_unrest$ phase."
 notification_notification_eqfm_transition_hostility_name: "$eqfm_balkan_situation$ Phase Transitions to $eqfm_hostility$"
 notification_notification_eqfm_transition_hostility_desc: "Tensions in the [GetStrategicRegion('region_balkans').GetName] have increased, transitioning to the $eqfm_hostility$ phase."
 notification_notification_eqfm_transition_deconfliction_name: "$eqfm_balkan_situation$ Phase Transitions to $eqfm_deconfliction$"
 notification_notification_eqfm_transition_deconfliction_desc: "Tensions in the [GetStrategicRegion('region_balkans').GetName] have decreased, transitioning to the $eqfm_deconfliction$ phase."
 notification_notification_eqfm_transition_crisis_name: "$eqfm_balkan_situation$ Transitions to $eqfm_crisis$"
 notification_notification_eqfm_transition_crisis_desc: "Tensions in the [GetStrategicRegion('region_balkans').GetName] have increased, transitioning to the $eqfm_crisis$ phase."

 notification_notification_eqfm_race_riots_name: "Rioting Breaks Out in the Balkans"
 notification_notification_eqfm_race_riots_desc: "Massive and sustained riots have broken out in the [GetStrategicRegion('region_balkans').GetName]. The $turkfm_porte$ finds itself facing imminent revolt should it fail to restore order."
 notification_notification_eqfm_race_riots_worsen_name: "Balkan Riots Worsen"
 notification_notification_eqfm_race_riots_worsen_desc: "Sustained rioting has spread to another state in the [GetStrategicRegion('region_balkans').GetName]. The $turkfm_porte$ may face multiple avenues of revolt should the situation remain unmitigated."
 notification_notification_eqfm_revolt_seccession_name: "Balkan Country Revolts!"
 notification_notification_eqfm_revolt_seccession_desc: "One of the peoples of the [GetStrategicRegion('region_balkans').GetName] have taken up arms against the $turkfm_porte$! It now falls to the Sultan to bring them to heel."
 notification_notification_eqfm_revolt_protectorate_name: "Balkan Country Secured Autonomy"
 notification_notification_eqfm_revolt_protectorate_desc: "One of the peoples of the [GetStrategicRegion('region_balkans').GetName] have strong-armed the $turkfm_porte$ into granting them limited autonomy. This has brought the legitimacy of the Sultan's mandate into question."
 notification_notification_eqfm_riot_suppressed_name: "Rioting Suppressed in the Balkans"
 notification_notification_eqfm_riot_suppressed_desc: "Despite their intensity and motivation, the $turkfm_porte$ has succeeded in quashing one of the riots in the [GetStrategicRegion('region_balkans').GetName]."

 notification_notification_eqfm_overtaxed_name: "Overtaxation in the [GetStrategicRegion('region_balkans').GetName] Raises Tensions"
 notification_notification_eqfm_overtaxed_desc: "Aggressive taxation by the $turkfm_porte$ has caused outcry against their rule. $eqfm_escalation_increase_medium$"
 notification_notification_eqfm_tax_break_name: "The $turkfm_porte$ Grants Tax Breaks in the [GetStrategicRegion('region_balkans').GetName]"
 notification_notification_eqfm_tax_break_desc: "In response to outcry by impacted communities, the $turkfm_porte$ has granted relief from taxation in rural areas of the Balkans. $eqfm_deescalation_increase_medium$"
 notification_notification_eqfm_plague_name: "Plague Outbreak in the [GetStrategicRegion('region_balkans').GetName] Raises Tensions"
 notification_notification_eqfm_plague_desc: "A massive plague outbreak has occurred in the $turkfm_porte$'s Balkan holdings. $eqfm_escalation_increase_medium$"
 notification_notification_eqfm_quarantine_name: "The $turkfm_porte$ Imposes Quarantines in the [GetStrategicRegion('region_balkans').GetName]"
 notification_notification_eqfm_quarantine_desc: "In response to a plague outbreak in the Balkans, the $turkfm_porte$ has imposed checkpoints and quarantines to stem the spread of the disease. $eqfm_escalation_increase_small$"
 notification_notification_eqfm_faketriarch_name: "Patriarchal Rebuke Raises Tensions"
 notification_notification_eqfm_faketriarch_desc: "The $turkfm_porte$ has directly rebuked the authority of the Ecumenical Patriarch to directly intervene in abuses against the [GetReligion('orthodox').GetName] Millet. $eqfm_escalation_increase_small$"
