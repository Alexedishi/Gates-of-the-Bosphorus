 eqfm_involved: "#greece #tooltip:[GetRawTextTooltipTag('eqfm_involved_desc')] Involved#!#!"
 eqfm_involved_desc: "A [concept_country] is #bold Involved#! in the $eqfm_balkan_situation$ by either:\n • Being a [concept_subject] of the #bold Ottoman Empire#!\n • Having a [concept_interest_tier] of [GetInterestTierType('interest_tier_engaged').GetName] or greater in the [GetStrategicRegion('region_balkans').GetName]\n • #italic By virtue of the situation, the #bold Ottoman Empire#! is always involved#!\n\n@information! #italic Different Actions will be available to you depending on your level of involvement.#!"

 eqfm_interloper: "#greece #tooltip:[GetRawTextTooltipTag('eqfm_interloper_desc')] An Interloper#!#!"
 eqfm_interloper_desc: "A [concept_country] is #bold An Interloper#! in the $eqfm_balkan_situation$ by either:\n • Not meeting the criteria to be $eqfm_involved$\n • Having a [concept_interest_tier] of [GetInterestTierType('interest_tier_observant').GetName] or greater in the [GetStrategicRegion('region_balkans').GetName]\n\n@information! #italic Different Actions will be available to you depending on your level of involvement.#!"
 
 eqfm_uninvolved: "#greece #tooltip:[GetRawTextTooltipTag('eqfm_uninvolved_desc')] Uninvolved#!#!"
 eqfm_uninvolved_desc: "An #bold uninvolved#! [concept_country] has no stake in the outcome of the $eqfm_balkan_situation$.\n\nA country can become an $eqfm_interloper$ by:\n • Having a [concept_interest_tier] of [GetInterestTierType('interest_tier_observant').GetName] or greater in the [GetStrategicRegion('region_balkans').GetName]\n\nA country can become $eqfm_involved$ by:\n • Being a [concept_subject] of the #bold Ottoman Empire#!\n • Having a [concept_interest_tier] of [GetInterestTierType('interest_tier_engaged').GetName] or greater in the [GetStrategicRegion('region_balkans').GetName]\n@information! #italic By virtue of the situation, the #bold Ottoman Empire#! is always involved#!\n\n@information! #italic Different Actions will be available to you depending on your level of involvement.#!"
 
 eqfm_balkan_cultures: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc')] Balkan Cultures#!#!"
 eqfm_balkan_cultures_desc: "#header Balkan Cultures:#!$gbbf_delimiter_normal$ • [GetCulture('greek').GetName]\n • [GetCulture('rhomaios').GetName]\n • [GetCulture('serb').GetName]\n • [GetCulture('bulgarian').GetName]\n • [GetCulture('romanian').GetName]\n • [GetCulture('albanian').GetName]\n • [GetCulture('bosniak').GetName]\n • [GetCulture('croat').GetName]\n • [GetCulture('slovene').GetName]\n • [GetCulture('romanyotim').GetName]"
 eqfm_balkan_culture: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc')] Balkan Culture#!#!"
 eqfm_balkan_native: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc')] Balkan Native#!#!"
 eqfm_balkan_natives: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc')] Balkan Natives#!#!"
 eqfm_balkan_subjects: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc')] Balkan Subjects#!#!"

 eqfm_stable: "@gbbf_stable! #bold #green #tooltip:[GetRawTextTooltipTag('eqfm_stable_desc')] Stable#!#!#!"
 eqfm_stable_desc: "@gbbf_stable! #bold #green Stable#!#!$gbbf_delimiter_normal$One of the phases in $eqfm_balkan_situation$.\n\nAfter mending burned bridges during the $eqfm_deconfliction$ phase, people have slowly begun to remember what is was that brought them to blows in the first place. Eventually, disputes and misunderstandings will cause an escalation into the $eqfm_unrest$ phase.$gbbf_delimiter_normal$This phase provides the following effects:\n[GetStaticModifier('modifier_eqfm_stable_phase').GetDesc]"
 eqfm_unrest: "@gbbf_unrest! #bold #yellow #tooltip:[GetRawTextTooltipTag('eqfm_unrest_desc')] Unrest#!#!#!"
 eqfm_unrest_desc: "@gbbf_unrest! #bold #yellow Unrest#!#!$gbbf_delimiter_normal$One of the phases in $eqfm_balkan_situation$.\n\nFear and paranoia have once again brought the peoples of the [GetStrategicRegion('region_balkans').GetName] into conflict with their [GetCulture('turkish').GetName] rulers. As discrimination and deception takes hold in the streets, further insults will cause an escalation into the $eqfm_hostility$ phase.$gbbf_delimiter_normal$This phase provides the following effects:\n[GetStaticModifier('modifier_eqfm_unrest_phase').GetDesc]"
 eqfm_hostility: "@gbbf_hostility! #bold #red #tooltip:[GetRawTextTooltipTag('eqfm_hostility_desc')] Hostility#!#!#!"
 eqfm_hostility_desc: "@gbbf_hostility! #bold #red Hostility#!#!$gbbf_delimiter_normal$One of the phases in $eqfm_balkan_situation$.\n\nViolence has become routine across the [GetStrategicRegion('region_balkans').GetName] as widespread rejection of Ottoman rule takes root. If [GetTechnology('nationalism').GetName] has taken root in the Empire, and should the $turkfm_porte$ fail to restore order, this may cause an escalation to the $eqfm_crisis$ phase. Should these tensions go unresolved, they will eventually sputter out, causing a deescalation to the $eqfm_deconfliction$ phase.$gbbf_delimiter_normal$This phase provides the following effects:\n[GetStaticModifier('modifier_eqfm_hostility_phase').GetDesc][GetPlayer.GetCustom('eqfm_crisis_ip3_type')]"
 eqfm_deconfliction: "@gbbf_deconfliction! #bold #greece #tooltip:[GetRawTextTooltipTag('eqfm_deconfliction_desc')] Deconfliction#!#!#!"
 eqfm_deconfliction_desc: "@gbbf_deconfliction! #bold #greece Deconfliction#!#!$gbbf_delimiter_normal$One of the phases in $eqfm_balkan_situation$.\n\nIn the wake of widespread violence, tensions have found release through chaos and destruction in both city and countryside. As noble and peasant alike return to their daily lives, many question how the situation was able to get so far out of control. These conciliatory feelings will not last forever, leading to a natural escalation to the $eqfm_stable$ phase.$gbbf_delimiter_normal$This phase provides the following effects:\n[GetStaticModifier('modifier_eqfm_deconfliction_phase').GetDesc]"
 eqfm_crisis: "@gbbf_crisis! #bold #red #tooltip:[GetRawTextTooltipTag('eqfm_crisis_desc')] Crisis#!#!#!"
 eqfm_crisis_desc: "@gbbf_crisis! #bold #red Crisis#!#!$gbbf_delimiter_normal$One of the phases in $eqfm_balkan_situation$.\n\nFollowing years of buildup, tensions have finally boiled over as [GetReligion('orthodox').GetName] and [GetReligion('jewish').GetName] populations seek to tear down the rule of the $turkfm_porte$ by any means necessary. With international eyes fixed on the [GetStrategicRegion('region_balkans').GetName], the Ottoman Empire faces widespread dissent from their subjects in Rumelia. $gbbf_great_powers$ will have the opportunity to support or hamper these movements. Should these tensions go unresolved, they will eventually sputter out, causing a deescalation to the $eqfm_deconfliction$ phase.$gbbf_delimiter_normal$This phase provides the following effects:\n[GetStaticModifier('modifier_eqfm_crisis_phase').GetDesc]\n\n#italic War will break out if #bold Crisis Progress#! reaches #bold 100#!.#![GetPlayer.GetCustom('eqfm_crisis_ip3_type')]"

