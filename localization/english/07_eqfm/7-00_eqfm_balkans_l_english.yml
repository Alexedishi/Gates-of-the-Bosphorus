 # Tooltips
 eqfm_balkan_situation: "@gbbf_nationalism! #o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_situation_desc')] Balkan Situation#!#!"
 eqfm_balkan_situation_desc: "#header @gbbf_nationalism! Balkan Situation#!$gbbf_delimiter_normal$The #bold Balkan Situation#! represents the ongoing struggle the $turkfm_porte$ faces in holding onto its possessions in the [GetStrategicRegion('region_balkans').GetName] against the tide of [GetTechnology('nationalism').GetName].\n\n#lore It is widely held that the #bold Ottoman Empire#! has fallen from grace. Rocked by revolutions in Greece and Serbia and reeling from the Egyptian Revolt, the authority of the $turkfm_sublime_porte$ has come into question. With the Empire humiliated by the insults of the Treaty of Adrianople and Convention of Kütahya, many anticipate the imminent disintegration of the Sultanate. The Center struggles to mount a defense against the Great Powers, and its #o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_cultures_desc')] Balkan Subjects#!#! eye their chances to break free from the Empire.#!"
 eqfm_balkan_situation_no_icon: "#o #tooltip:[GetRawTextTooltipTag('eqfm_balkan_situation_desc')] Balkan Situation#!#!"

 je_eqfm_eastern_question_porte: "$turkfm_porte$"
