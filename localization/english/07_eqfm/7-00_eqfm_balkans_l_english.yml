 je_eqfm_eastern_question_faction_porte_desc: "dummy"
 je_eqfm_eastern_question_faction_balkans: "@gbbf_region! [GetStrategicRegion('region_balkans').GetName] Faction"
 je_eqfm_eastern_question_faction_balkans_desc: "dummy"
