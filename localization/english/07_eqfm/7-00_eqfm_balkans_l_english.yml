 je_eqfm_eastern_question_balkans: "@gbbf_region! [GetStrategicRegion('region_balkans').GetName]"
 je_eqfm_eastern_question_balkans_desc: "dummy"
 je_eqfm_eastern_question_header: "[GetPlayer.GetNameNoFlag] is [GetPlayer.GetCustom('eqfm_tension_involvement_type')] in the $eqfm_balkan_situation$"
