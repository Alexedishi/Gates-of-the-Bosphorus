 eqfm_custom_hostility_next: "#bold #white Next Phase Progress#!:#!\n#italic Tensions will eventually transition into Deconfliction#!\n#bold Progress Towards#! $eqfm_deconfliction$: [JournalEntry.MakeScope.Var('eqfm_deescalation_var').GetValue]/500"
 eqfm_custom_hostility_crisis_next: "#bold #white Next Phase Progress#!:#!\n#italic Tensions will eventually transition into Crisis or Deconfliction#!\n#bold Progress Towards#! $eqfm_crisis$: [JournalEntry.MakeScope.Var('eqfm_escalation_var').GetValue]/500 \n#bold Progress Towards#! $eqfm_deconfliction$: [JournalEntry.MakeScope.Var('eqfm_deescalation_var').GetValue]/500"
 eqfm_custom_crisis_next: "#bold #white Next Phase Progress#!:#!\n#italic Tensions will eventually transition into Deconfliction#!\n#bold Progress Towards#! $eqfm_deconfliction$: [JournalEntry.MakeScope.Var('eqfm_deescalation_var').GetValue]/500"
 eqfm_custom_deconfliction_next: "#bold #white Next Phase Progress#!:#!\n#italic Tensions will eventually transition into Stable#!\n#bold Progress Towards#! $eqfm_stable$: [JournalEntry.MakeScope.Var('eqfm_escalation_var').GetValue]/500"

 eqfm_custom_stable_factors: "@information!Catalysts towards the $eqfm_stable$ Phase\n$eqfm_escalation_factors_desc$"
 eqfm_custom_unrest_factors: "@information!Catalysts towards the $eqfm_unrest$ Phase\n$eqfm_escalation_factors_desc$"
 eqfm_custom_hostility_factors: "@information!Catalysts towards the $eqfm_hostility$ Phase\n$eqfm_escalation_factors_desc$"
 eqfm_custom_deconfliction_factors: "@information!Catalysts towards the $eqfm_deconfliction$ Phase\n$eqfm_deescalation_factors_desc$"
 eqfm_custom_crisis_factors: "@information!Catalysts towards the $eqfm_crisis$ Phase\n$eqfm_escalation_factors_desc$"

 eqfm_custom_factors_during_stable: "$eqfm_custom_unrest_factors$"
 eqfm_custom_factors_during_unrest: "$eqfm_custom_hostility_factors$$gbbf_delimiter_normal$$eqfm_custom_deconfliction_factors$"
 eqfm_custom_factors_during_hostility: "$eqfm_custom_deconfliction_factors$"
 eqfm_custom_factors_during_hostility_crisis: "$eqfm_custom_crisis_factors$$gbbf_delimiter_normal$$eqfm_custom_deconfliction_factors$"
 eqfm_custom_factors_during_crisis: "$eqfm_custom_deconfliction_factors$"
 eqfm_custom_factors_during_deconfliction: "$eqfm_custom_stable_factors$"

 eqfm_custom_cannot_escalate: "@information! #italic Escalation not possible!"
 eqfm_custom_cannot_deescalate: "@information! #italic De-escalation not possible!"
 eqfm_custom_cannot_deescalate_crisis: "@warning! #italic The Empire is in #tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_crisis_criteria')] Crisis#!#!#!!"

 eqfm_custom_riot_1: "\n@warning!Rioting in [JournalEntry.MakeScope.Var('eqfm_riot_state_1_var').GetState.GetName] is contributing [JournalEntry.MakeScope.Var('eqfm_riot_state_1_progress_var').GetValue] Insurrection Progress."
 eqfm_custom_riot_2: "\n@warning!Rioting in [JournalEntry.MakeScope.Var('eqfm_riot_state_2_var').GetState.GetName] is contributing [JournalEntry.MakeScope.Var('eqfm_riot_state_2_progress_var').GetValue] Insurrection Progress."
 eqfm_custom_riot_3: "\n@warning!Rioting in [JournalEntry.MakeScope.Var('eqfm_riot_state_3_var').GetState.GetName] is contributing [JournalEntry.MakeScope.Var('eqfm_riot_state_3_progress_var').GetValue] Insurrection Progress."

