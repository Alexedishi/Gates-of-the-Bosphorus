l_english:
 # Journal Entries
 je_eqfm_balkan_situation: "The Powder Keg of Europe"
 je_eqfm_balkan_situation_reason: "[GetPlayer.GetCustom('eqfm_balkans_journal_type')]"
 je_eqfm_balkan_situation_complete: "The base [concept_acceptance] of #bold all#! of the following $gbbf_cultures$ are #bold 80 or Greater with the [GetGlobalVariable('eqfm_balkan_situation').Var('ottoman_scope').GetCountry.GetNameNoFlag]#!:\n • [GetCulture('greek').GetName]\n • [GetCulture('rhomaios').GetName]\n • [GetCulture('serb').GetName]\n • [GetCulture('bulgarian').GetName]\n • [GetCulture('bosniak').GetName]\n • [GetCulture('albanian').GetName]\n • [GetCulture('croat').GetName]\n • [GetCulture('slovene').GetName]"
 je_eqfm_balkan_situation_fail_1: "The [SCOPE.sCountry('ottoman_scope').GetNameNoFlag] has no $gbbf_states$ in the [GetStrategicRegion('region_balkans').GetName] [concept_strategic_region]"
 je_eqfm_balkan_situation_fail_2: "The [SCOPE.sCountry('ottoman_scope').GetNameNoFlag] has failed the #bold The Sick Man of Europe#! [concept_journal_entry]"
 je_eqfm_balkan_situation_fail_3: "The [SCOPE.sCountry('ottoman_scope').GetNameNoFlag] has failed the #bold The Reorganization of the State#! [concept_journal_entry]"
 je_eqfm_balkan_situation_invalid: "The #bold Ottoman Empire#! does not exist"
 je_eqfm_balkan_situation_status: "#bold #white Current Phase#!:#! [GetPlayer.GetCustom('eqfm_balkans_phase_type')]\n[GetPlayer.GetNameNoFlag] is [GetPlayer.GetCustom('eqfm_tension_involvement_type')]"
 je_eqfm_balkan_situation_crisis_status: "\n[concept_ottoman_integrity] is at #v [GetGlobalVariable('eqfm_balkan_situation').Var('eqfm_crisis_var').GetValue]/250#!"
 je_eqfm_balkan_situation_crisis_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('eqfm_crisis_progress_value')]"
 
 je_eqfm_journal_body_base: "$je_eqfm_balkan_situation_flavor_base$$gbbf_linebreak_normal$$je_eqfm_balkan_situation_details_base$"
 je_eqfm_balkan_situation_flavor_base: "#lore The subjects of the [GetGlobalVariable('eqfm_balkan_situation').Var('ottoman_scope').GetCountry.GetNameNoFlag] grow ever more rebellious as the ideals of [GetTechnology('nationalism').GetName] take root across the Empire. Already the Empire has been shaken by rebellions in $GRE$ and $SER$, and the $RUS_ADJ$ Empire has secured seniority in the $ROM_ADJ$ Principalities. All eyes now turn to the $turkfm_porte$ to bring our [GetReligion('orthodox').GetName] subjects to heel.#!"
 je_eqfm_balkan_situation_details_base: "#bold #white Current Phase#!:#! [GetPlayer.GetCustom('eqfm_balkans_phase_details_type')]\n\n[GetPlayer.GetCustom('eqfm_balkans_next_phase_progress_type')]$gbbf_delimiter_normal$[GetPlayer.GetCustom('eqfm_balkans_next_phase_factors_type')]"
 
 je_eqfm_journal_body_crisis: "$je_eqfm_balkan_situation_flavor_crisis$$gbbf_linebreak_normal$$je_eqfm_balkan_situation_details_crisis$"
 je_eqfm_balkan_situation_flavor_crisis: "#lore A $eqfm_crisis$ is brewing in the [GetStrategicRegion('region_balkans').GetName], and the [GetGlobalVariable('eqfm_balkan_situation').Var('ottoman_scope').GetCountry.GetNameNoFlag] must assert its authority over Rumelia as $gbbf_secessionists$ jeopardize [GetGlobalVariable('eqfm_balkan_situation').Var('ottoman_scope').GetCountry.GetAdjectiveNoFormatting] rule. This current uptick of unrest needs to be stabilized before it spreads across the region and into the empire at large.#!"
 je_eqfm_balkan_situation_details_crisis: "#bold #white Current Phase#!:#! [GetPlayer.GetCustom('eqfm_balkans_phase_details_type')]\n\n@information! [concept_ottoman_integrity] is at #v [GetGlobalVariable('eqfm_balkan_situation').Var('eqfm_crisis_var').GetValue]/250#!. This is expected to change by #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_eqfm_balkan_situation_crisis_breakdown [GetGlobalVariable('eqfm_balkan_situation').Var('eqfm_crisis_progress_var').GetValue|+=]#! next month.\n\n[GetPlayer.GetCustom('eqfm_balkans_next_phase_progress_type')]$gbbf_delimiter_normal$[GetPlayer.GetCustom('eqfm_balkans_next_phase_factors_type')]"

 eqfm_escalation_factors: "#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_escalation_factors_desc')] Escalation Factors#!#!"
 eqfm_escalation_factors_desc: "#white #bold Monthly Sources:#!#!\n • #bold #red +1#!:#! Base Monthly Progress\n • #bold #red +0.1#!x:#! Average [concept_radical] $gbbf_pops$ of $eqfm_balkan_cultures$ (Max +8)\n • #bold #red +0.1#!x:#! Per Ottoman [concept_legitimacy] below 70 (max +3)\n • #bold #red +1#!x:#! Number of $gbbf_great_powers$ #bold Accelerating Tensions#!\n • #bold #red +3#!:#! Per Month if [GetTechnology('nationalism').GetName] is present in any [GetStrategicRegion('region_balkans').GetName] [concept_subject]\n#white #bold Instant Sources:#!#!\n • #bold #red +3#!:#! Enforce a [concept_war_goal] on the Ottomans\n • #bold #red +3#!:#! Expel Diplomats as a non-[concept_great_power]\n • #bold #red +10#!:#! Reduce [concept_autonomy] of a [GetStrategicRegion('region_balkans').GetName] [concept_subject]\n • #bold #red +10#!:#! Expel Ottoman Diplomats as a [concept_great_power]\n • #bold #red +10#!:#! Enforce a [concept_humiliation] [concept_war_goal] on the Ottomans\n • #bold #red +10#!:#! Declare a [concept_rivalry] against the Ottomans as a [concept_great_power]"
 
 eqfm_deescalation_factors: "#tooltippable #tooltip:[GetRawTextTooltipTag('eqfm_deescalation_factors_desc')] Escalation Factors#!#!"
 eqfm_deescalation_factors_desc: "#white #bold Monthly Sources:#!#!\n • #bold #green +1#!:#! Base Monthly Progress\n • #bold #green +.01x!:#! Average [concept_loyalist] $gbbf_pops$ of $eqfm_balkan_cultures$ (Max +8)\n • #bold #green +0.1#!:#! From Ottoman [concept_legitimacy] above 70 (max +3)\n • #bold #green +1x#!:#! Number of countries Decelerating Tensions\n • #bold #green +1x#!:#! Bankroll [GetStrategicRegion('region_balkans').GetName] a [concept_subject] (per month)\n#white #bold Instant Sources:#!#!\n • #bold #green +5#!:#! Enforce a  [concept_war_goal] against a [concept_great_power]\n • #bold #green +10#!:#! Increase [concept_autonomy] of a [GetStrategicRegion('region_balkans').GetName] [concept_subject]\n • #bold #green +10#!:#! Declare an [concept_alliance] with the Ottomans as a [concept_great_power]\n • #bold #green +10#!:#! Increase the [concept_autonomy] of a [GetStrategicRegion('region_balkans').GetName] [concept_subject]\n • #bold #green +25#!:#! Grant a [GetStrategicRegion('region_balkans').GetName] Subject Independence"
 
 # Journal Entry Lobby Text
 je_eqfm_balkan_situation_lobby: "$gbbf_journal_lobby$\nThe subjects of the Ottoman Empire grow ever more rebellious as the ideals of [GetTechnology('nationalism').GetName] take root across the Empire. Already the Empire has been shaken by rebellions in Greece and Serbia, and the $RUS_ADJ$ Empire has secured seniority in the Romanian Principalities. All eyes now turn to the #bold Sultan#! to bring his [GetReligion('orthodox').GetName] subjects to heel."

