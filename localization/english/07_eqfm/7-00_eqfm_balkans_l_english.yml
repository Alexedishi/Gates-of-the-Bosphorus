 eqfm_decelerate_tensions_button: "#o #tooltip:[GetRawTextTooltipTag('gbbf_decelerate_tensions_desc')] $gbbf_decelerate_tensions$#!#!"
 eqfm_decelerate_tensions_button_desc: "The conflicts erupting across the Balkans are a threat to both the international order and the prosperity of the people that call the region home. If we are to provide meaningful support to the Ottomans, we should commit resources to mitigate these separatist sentiments."
