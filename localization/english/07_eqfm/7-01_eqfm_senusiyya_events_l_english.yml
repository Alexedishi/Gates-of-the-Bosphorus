 eqfm_senusiyya.400.t: "Expelling $eqfm_senusiyya$ from [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]"
 eqfm_senusiyya.400.d: ""
 eqfm_senusiyya.400.f: ""And that is the desert. From here until we reach the other side, no water but what we carry with us. For the camels, no water at all. If the camels die, we die. And in twenty days they will start to die""
 eqfm_senusiyya.400.a: "[SCOPE.sCharacter('eqfm_senusiyya_leader_1').GetFullName] will pacify these radicals."
 eqfm_senusiyya.400.b: "We will send [SCOPE.sCharacter('eqfm_senusiyya_leader_2').GetFullName]."
 eqfm_senusiyya.400.c: "[SCOPE.sCharacter('eqfm_senusiyya_leader_3').GetFullName] will serve us well."
 eqfm_senusiyya.400.e: "On second thought, let's not."
 eqfm_senusiyya.401.t: "$eqfm_senusiyya_expedition$ Arrives in [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]"
 eqfm_senusiyya.401.d: "After taking a few weeks to muster and gather supplies, [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetFullName] has departed into [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName] in support of our efforts to expell the $eqfm_senusiyya$."
 eqfm_senusiyya.401.f: ""You send your navy and demand that I must pay my debts to you, and the expenses of your expedition. But how could I pay my debts when you have reduced my revenues to just taxes on agriculture and especially when we did not have enough rain in the last four years?" -Yusuf Pasha, to the British Consul in Tripoli, 1831"
 eqfm_senusiyya.401.a: "We will bring order to the desert."
 eqfm_senusiyya.402.t: "$eqfm_senusiyya_expedition$ Leader has Died!"
 eqfm_senusiyya.402.d: "Our $eqfm_desert_expedition$ was sighted returning from the depths of the [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]. They bring with them the tragic news of the death of its leader out in the wastes."
 eqfm_senusiyya.402.f: ""I pray that I may never see the desert again. Hear me, God.""
 eqfm_senusiyya.402.a: "Tragic Circumstances"
 eqfm_senusiyya.403.t: "$eqfm_senusiyya_expedition$ Withdraws from [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]"
 eqfm_senusiyya.403.d: "Citing a lack of provisions and attritional losses, [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetFullName] has returned from the depths of [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]."
 eqfm_senusiyya.403.f: ""I pray that I may never see the desert again. Hear me, God.""
 eqfm_senusiyya.403.a: "At least they returned alive."
