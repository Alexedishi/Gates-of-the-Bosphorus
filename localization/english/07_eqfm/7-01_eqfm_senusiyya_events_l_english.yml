l_english:
 eqfm_senusiyya.001.t: "The Senussi Order"
 eqfm_senusiyya.001.d: "An unassuming [GetReligion('sunni').GetName] scholar, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName], has arrived in [ROOT.GetCountry.GetNameNoFlag]. In advocating for reform of [GetReligion('sunni').GetName] Islam and independence from [ROOT.GetCountry.GetOverlord.GetName], he has gained recognition amongst the [GetCulture('bedouin').GetName] tribes of the desert."
 eqfm_senusiyya.001.f: "Outside of the major settlements, spiritual lives in the deserts are guided less by the $gbbf_devout$ and more by itinerant preachers known by the term [GetCharacterTrait('gbbf_trait_marabout').GetName]. These figures often act as tribal mediators and intermediaries between state authorities and tribal leaders."
 eqfm_senusiyya.001.a: "This could be troublesome."
 eqfm_senusiyya.001.a.tt: "Should the $eqfm_senusiyya_movement$ become dominant in a [concept_country], their [GetCulture('bedouin').GetName] [Concept('concept_pop','$concept_pops$')] will become more resistant to centralized rule."
 eqfm_senusiyya.002.t: "The Grand Senussi"
 eqfm_senusiyya.002.d: "#yellow Muhammad ibn Ali#! has died. In his place, his son [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName], has risen to head the $eqfm_senusiyya$ Order. Hailed as the "Mahdi" or "Great One," he is poised to lead the order to greater influence."
 eqfm_senusiyya.002.f: "While [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName] has refused to claim the title of "Mahdi," that has done little to dissuade adherents of the order from proclaiming him to a be saint in the making."
 eqfm_senusiyya.002.a: "Definitely troublesome."
 eqfm_senusiyya.002.a.tt: "With the #bold Grand Senussi#! at the helm, the $eqfm_senusiyya_movement$ will begin to spread across the [GetGeographicRegion('geographic_region_senusiyya').GetName] [concept_georegion]"
 eqfm_senusiyya.003.t: "Senussi Withdraws to the Desert"
 eqfm_senusiyya.003.d: "In response to increased scrutiny by [ROOT.GetCountry.GetNameNoFlag], [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName] has relocated his operations deep into the deserts of [SCOPE.sCountry('eqfm_senusiyya_tribal_scope').GetNameNoFlag] in the hopes of evading our patrols."
 eqfm_senusiyya.003.f: "While much harsher an environment than the cities and oases, the deserts offer ample places to hide from the eyes of the state."
 eqfm_senusiyya.003.a: "Serves them right."
 eqfm_senusiyya.004.t: "Armed Diplomacy"
 eqfm_senusiyya.004.d: "Our armed delegation has arrived at [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFirstName]'s base of operations in [SCOPE.sState('eqfm_senusiyya_tribal_scope').GetName]. Following a tense exchange with [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName], a nominal agreement was struck to minimize interference with the [ROOT.GetCountry.GetAdjectiveNoFlag] administration."
 eqfm_senusiyya.004.f: "While discussions were cordial, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName] appeared to understand the nature of our visit. However, advisors have been quick to caution that there is little we can to do actually enforce any agreements."
 eqfm_senusiyya.004.a: "Let this be a message."
 eqfm_senusiyya.005.t: "The State-within-a-State"
 eqfm_senusiyya.005.d: "As the influence of the $eqfm_senusiyya_movement$ continues to grow in [ROOT.GetCountry.GetNameNoFlag], [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName] has proposed the organization of his adherents and their lodges into a \"state-within-a-State.\""
 eqfm_senusiyya.005.f: "While wrapped in the noble cause of defending his followers, the Grand Senussi threatens the supremacy of the Sultan in state and social affairs."
 eqfm_senusiyya.005.a: "This is concerning."
 eqfm_senusiyya.006.t: "The Grand Senussi Brokers Peace"
 eqfm_senusiyya.006.d: "Traders from the Libyan frontier have reported an seismic events amongst the tribes: aiming to increase his standing in the deserts, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName] has brokered a peace between the long warring tribes of [SCOPE.sCountry('zuwayya_scope').GetName] and [SCOPE.sCountry('concussion_scope').GetName]."
 eqfm_senusiyya.006.f: "\"People from the Zuwayya tribe came to us and asked for forgiveness and asked us to build a Zawiya in Tzir. We want to be your neighbours, to teach you and your children the book of Allah. We want to reconcile you with the Zuwayya, who used to attack you and take your money and children, by turning to the Qur'an, which demands reconciliation among Muslims.\" -Letter from the Grand Senussi to the Tubu tribe"
 eqfm_senusiyya.006.a: "So he's just a regular diplomat now?"
 eqfm_senusiyya.008.t: "The Future of the $eqfm_senusiyya_movement$"
 eqfm_senusiyya.008.d: ""
 eqfm_senusiyya.008.f: ""
 eqfm_senusiyya.008.a: ""
 eqfm_senusiyya.008.b: ""
 eqfm_senusiyya.009.t: "The $eqfm_senusiyya_movement$ Extinguished"
 eqfm_senusiyya.009.d: "In accordance with the mandate of the $turkfm_porte$, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has driven back the adherents of the $eqfm_senusiyya_movement$ and ensured the extinction of their school of thought."
 eqfm_senusiyya.009.f: "By securing the country against the followers of Senussi, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has also secured the dominance of [GetCulture('turkish').GetName] influence over [ROOT.GetCountry.GetName]."
 eqfm_senusiyya.009.a: "The $gbbf_devout$ will guide [ROOT.GetCountry.GetName]."

 eqfm_senusiyya.100.t: "Senusiyya Entrenchment Sprinkler Apparatus"
 eqfm_senusiyya.100.d: "DUMMY"
 eqfm_senusiyya.100.f: "DUMMY"
 eqfm_senusiyya.100.a: "DUMMY"
 eqfm_senusiyya.101.t: "$eqfm_senusiyya$ Spreads to [SCOPE.sStateRegion('eqfm_senusiyya_state_region_scope').GetName]"
 eqfm_senusiyya.101.d: "Comfortable in his level of influence, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName] has dispatched missionaries across the deserts of [SCOPE.sStateRegion('eqfm_senusiyya_state_region_scope').GetName] to spread the message of $eqfm_senusiyya$."
 eqfm_senusiyya.101.f: "By operating deep in the deserts, the followers of Senussi are able to evade central authority. To them, international borders are merely a suggestion."
 eqfm_senusiyya.101.a: "So be it."

 eqfm_senusiyya.110.t: "The Awliya of [SCOPE.sStateRegion('eqfm_senusiyya_state_region_scope').GetName]"
 eqfm_senusiyya.110.d: "Local administrators in [SCOPE.sStateRegion('eqfm_senusiyya_state_region_scope').GetName] has uncovered an extensive network of shrines devoted to local saint-like figures. The $gbbf_devout$ has been quick to condemn this practice as contravening orthodox teaching."
 eqfm_senusiyya.110.f: "Most tribesmen and peasants practice a form of folk Islam. Professing their belief in saints or "awliya", they visit local shrines often asking for blessings, cures and protection."
 eqfm_senusiyya.110.a: "We must discourage this practice."
 eqfm_senusiyya.110.b: "This is a backwards, yet harmless practice."
 eqfm_senusiyya.110.c: "Tear down these shrines. Burn the idols."
 eqfm_senusiyya.111.t: "Sufism Spreads in [SCOPE.sStateRegion('eqfm_senusiyya_state_region_scope').GetName]"
 eqfm_senusiyya.111.d: "With the dispersal of $eqfm_senusiyya$ preachers across the desert has come a renewed wave of Sufism across the tribes. While not outright contradicting the authority of the state, mystical teaching threatens the $gbbf_devout$'s control over spiritual affairs."
 eqfm_senusiyya.111.f: "By simplifying the abstract literature of Islam for the tribesmen, [GetCharacterTrait('gbbf_trait_marabout').GetName]#yellow s#! have democratized the study of scripture in a way that threatens the standing of the [SCOPE.gsInterestGroup('devout_scope').GetName]."
 eqfm_senusiyya.111.a: "Detain these dissidents and disavow their teachings."
 eqfm_senusiyya.111.b: "Their path might be strange, but it is of no concern."
 eqfm_senusiyya.111.c: "Let us make an example out of these men. To the gallows!"
 eqfm_senusiyya.112.t: ""
 eqfm_senusiyya.112.d: ""
 eqfm_senusiyya.112.f: "[GetCharacterTrait('gbbf_trait_marabout').GetName]#yellow s#! often play a pivotal role in tribal society by teaching the Quran, mediating disputes, leading religious festivals, and guarding the shrines of the saints. They are respected as teachers, judges, healers, and writers"
 eqfm_senusiyya.112.a: ""
 eqfm_senusiyya.112.b: ""
 eqfm_senusiyya.112.c: ""
