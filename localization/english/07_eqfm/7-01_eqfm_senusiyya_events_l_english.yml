 eqfm_senusiyya.210.t: "Imams Defect from the [SCOPE.gsInterestGroup('devout_scope').GetName]"
 eqfm_senusiyya.210.d: "The leadership of the [SCOPE.gsInterestGroup('devout_scope').GetName] of [ROOT.GetCountry.GetNameNoFlag] has been thrown into disarray with several senior members declaring their sympathies for the $eqfm_senusiyya_movement$. The entrenched authorities have requested that the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] restore order."
 eqfm_senusiyya.210.f: ""There are many paths to God." -Muhammad al-Sanusi"
 eqfm_senusiyya.210.a: "Arrest and depose these traitors."
 eqfm_senusiyya.210.b: "This is not the state's concern."
 eqfm_senusiyya.211.t: "Dissidents Preach in [SCOPE.sState('eqfm_senusiyya_target_state').GetName]"
 eqfm_senusiyya.211.d: "Followers of the $eqfm_senusiyya_movement$ have recently increased their activities in the cities of [ROOT.GetCountry.GetNameNoFlag]"
 eqfm_senusiyya.211.f: ""Does a bird have a mind or not?"\n"No."\n"Yet, he puts his eggs on the top of a remote mountain so no fox or wolf can get them. Does the Yarbu' have a mind or not?"\n"No."\n"Yet he digs many routes in his tunnel to escape snakes. Thus, be aware of the black snake which will come to you and point in an east-west direction." -The Grand Sanusi to his followers at Jaghbub"
 eqfm_senusiyya.211.a: ""
 eqfm_senusiyya.211.b: ""
