 eqfm_senusiyya.008.t: "The Senusiyya Movement Extinguished"
 eqfm_senusiyya.008.d: "In accordance with the mandate of the $turkfm_porte$, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has driven back the adherents of the $eqfm_senusiyya_movement$ and ensured the extinction of their school of thought."
 eqfm_senusiyya.008.f: "By securing the country against the followers of Senussi, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has also secured the dominance of [GetCulture('turkish').GetName] influence over [ROOT.GetCountry.GetName]."
 eqfm_senusiyya.008.a: "The [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] will guide [ROOT.GetCountry.GetName]."
 eqfm_senusiyya.009.t: "House Senussi of [ROOT.GetCountry.GetName]"
 eqfm_senusiyya.009.d: "Arriving flanked by cheering crowds, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName], the head of the $eqfm_senusiyya_movement$, has taken the throne of [ROOT.GetCountry.GetName]."
 eqfm_senusiyya.009.f: ""
 eqfm_senusiyya.009.a: "The $eqfm_senusiyya_movement$ will guide [ROOT.GetCountry.GetName]"
 
 eqfm_senusiyya.010.t: "$eqfm_senusiyya$ Spreads to [SCOPE.sCountry('eqfm_senussi_target').GetName]"
 eqfm_senusiyya.010.d: "Comfortable in his level of influence within [ROOT.GetCountry.GetName], [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName] has dispatched missionaries across the border into the deserts of [SCOPE.sCountry('eqfm_senussi_target').GetName] to spread his message."
 eqfm_senusiyya.010.f: "By operating deep in the deserts, the followers of Senussi are able to evade central authority. To them, international borders are merely a suggestion."
 eqfm_senusiyya.010.a: "So be it."
 eqfm_senusiyya.010.b: "The state cannot tolerate these mystics."
 eqfm_senusiyya.010.c: "We shall spread the word!"
 eqfm_senusiyya.011.t: "$eqfm_senusiyya$ Spreads to [SCOPE.sState('eqfm_senusiyya_target_state').GetStateRegion.GetName]"
 eqfm_senusiyya.011.d: ""
 eqfm_senusiyya.011.f: ""
 eqfm_senusiyya.011.a: ""