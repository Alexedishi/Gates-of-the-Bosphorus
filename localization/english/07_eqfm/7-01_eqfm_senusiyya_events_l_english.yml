l_english:
 eqfm_senusiyya.001.t: "The Senussi Order"
 eqfm_senusiyya.001.d: "An unassuming [GetReligion('sunni').GetName] scholar, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName], has arrived in [ROOT.GetCountry.GetNameNoFlag]. In advocating for reform of [GetReligion('sunni').GetName] Islam and independence from [ROOT.GetCountry.GetOverlord.GetName], he has gained recognition amongst the [GetCulture('bedouin').GetName] tribes of the desert."
 eqfm_senusiyya.001.f: "Outside of the major settlements, spiritual lives in the deserts are guided less by the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] and more by itinerant preachers known by the term [GetCharacterTrait('gbbf_trait_marabout').GetName]. These figures often act as tribal mediators and intermediaries between state authorities and tribal leaders."
 eqfm_senusiyya.001.a: "This could be troublesome."
 eqfm_senusiyya.001.a.tt: "Should the $eqfm_senusiyya_movement$ become dominant in [ROOT.GetCountry.GetNameNoFlag], our [GetCulture('bedouin').GetName] [concept_pop]#o s#! will become more resistant to our rule."
 eqfm_senusiyya.001.b: "This could be troublesome."
 eqfm_senusiyya.001.b.tt: "Should the $eqfm_senusiyya_movement$ become dominant in a [concept_country], their [GetCulture('bedouin').GetName] [concept_pop]#o s#! will become more resistant to centralized rule."
 eqfm_senusiyya.002.t: "The Grand Senussi"
 eqfm_senusiyya.002.d: "#yellow Muhammad ibn Ali#! has died. In his place, his son [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName], has risen to head the $eqfm_senusiyya$ Order. Hailed as the "Mahdi" or "Great One," he is poised to lead the order to greater influence."
 eqfm_senusiyya.002.f: "While [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName] has refused to claim the title of "Mahdi," that has done little to dissuade adherents of the order from proclaiming him to a be saint in the making."
 eqfm_senusiyya.002.a: "Definitely troublesome."
 eqfm_senusiyya.002.a.tt: "With the #bold Grand Senussi#! at the helm, the $eqfm_senusiyya_movement$ will begin to spread across the [GetGeographicRegion('geographic_region_senusiyya').GetName] [concept_georegion]"
 eqfm_senusiyya.003.t: "Senussi Withdraws to the Desert"
 eqfm_senusiyya.003.d: "In response to increased scrutiny by [ROOT.GetCountry.GetNameNoFlag], [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName] has relocated his operations deep into the deserts of [SCOPE.sCountry('kufra_scope').GetNameNoFlag] in the hopes of evading our patrols."
 eqfm_senusiyya.003.f: "While much harsher an environment than the cities and oases, the deserts offer ample places to hide from the eyes of the state."
 eqfm_senusiyya.003.a: "Serves them right."
 eqfm_senusiyya.004.t: "Armed Diplomacy"
 eqfm_senusiyya.004.d: "Our armed delegation has arrived at [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFirstName]'s base of operations in [SCOPE.sState('kufra_capital_scope').GetName]. Following a tense exchange with [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName], a nominal agreement was struck to minimize interference with the [ROOT.GetCountry.GetAdjectiveNoFlag] administration."
 eqfm_senusiyya.004.f: "While discussions were cordial, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName] appeared to understand the nature of our visit. However, advisors have been quick to caution that there is little we can to do actually enforce any agreements."
 eqfm_senusiyya.004.a: "Let this be a message."
 eqfm_senusiyya.005.t: "The State-within-a-State"
 eqfm_senusiyya.005.d: "As the influence of the $eqfm_senusiyya_movement$ continues to grow in [ROOT.GetCountry.GetNameNoFlag], [SCOPE.sCharacter('eqfm_senussi_character_scope').GetFullName] has proposed the organization of his adherents and their lodges into a "state-within-a-State.""
 eqfm_senusiyya.005.f: "While wrapped in the noble cause of defending his followers, the Grand Senussi threatens the supremacy of the Sultan in state and social affairs."
 eqfm_senusiyya.005.a: "This is concerning."
