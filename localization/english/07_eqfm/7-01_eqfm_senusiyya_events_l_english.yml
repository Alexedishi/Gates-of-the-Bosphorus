l_english:
 mgrbfm_libya.100.t: "The Senussi Order"
 mgrbfm_libya.100.d: "An unassuming [GetReligion('sunni').GetName] scholar, [SCOPE.sCharacter('mgrbfm_senussi_character_scope').GetFullName], has arrived in [ROOT.GetCountry.GetNameNoFlag]. In advocating for reform of [GetReligion('sunni').GetName] Islam and independence from [ROOT.GetCountry.GetOverlord.GetName], he has gained recognition amongst the [GetCulture('bedouin').GetName] tribes of the desert."
 mgrbfm_libya.100.f: "Outside of the major settlements, spiritual lives in the deserts are guided less by the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] and more by itinerant preachers known by the term [GetCharacterTrait('gbbf_trait_marabout').GetName]. These figures often act as tribal mediators and intermediaries between state authorities and tribal leaders."
 mgrbfm_libya.100.a: "This could be troublesome."
 mgrbfm_libya.101.t: "The Grand Senussi"
 mgrbfm_libya.101.d: "#yellow Muhammad ibn Ali#! has died. In his place, his son [SCOPE.sCharacter('mgrbfm_senussi_character_scope').GetFullName], has risen to head the $mgrbfm_senusiyya$ Order. Hailed as the "Mahdi" or "Great One," he is poised to lead the order to greater influence."
 mgrbfm_libya.101.f: "While [SCOPE.sCharacter('mgrbfm_senussi_character_scope').GetLastName] has refused to claim the title of "Mahdi," that has done little to dissuade adherents of the order from proclaiming him to a be saint in the making."
 mgrbfm_libya.101.a: "Definitely troublesome."
 mgrbfm_libya.102.t: "Senussi Withdraws to the Desert"
 mgrbfm_libya.102.d: "In response to increased scrutiny by [ROOT.GetCountry.GetNameNoFlag], [SCOPE.sCharacter('mgrbfm_senussi_character_scope').GetFullName] has relocated his operations deep into the deserts of [SCOPE.sCountry('kufra_scope').GetNameNoFlag] in the hopes of evading our patrols."
 mgrbfm_libya.102.f: "While much harsher an environment than the cities and oases, the deserts offer ample places to hide from the eyes of the state."
 mgrbfm_libya.102.a: "Serves them right."
 mgrbfm_libya.103.t: "Armed Diplomacy"
 mgrbfm_libya.103.d: "Our armed delegation has arrived at [SCOPE.sCharacter('mgrbfm_senussi_character_scope').GetFirstName]'s base of operations in [SCOPE.sState('kufra_capital_scope').GetName]. Following a tense exchange with [SCOPE.sCharacter('mgrbfm_senussi_character_scope').GetLastName], a nominal agreement was struck to minimize interference with the [ROOT.GetCountry.GetAdjectiveNoFlag] administration."
 mgrbfm_libya.103.f: "While discussions were cordial, [SCOPE.sCharacter('mgrbfm_senussi_character_scope').GetLastName] appeared to understand the nature of our visit. However, advisors have been quick to caution that there is little we can to do actually enforce any agreements."
 mgrbfm_libya.103.a: "Let this be a message."
 mgrbfm_libya.104.t: "The State-within-a-State"
 mgrbfm_libya.104.d: "As the influence of the $mgrbfm_senusiyya_movement$ continues to grow in [ROOT.GetCountry.GetNameNoFlag], [SCOPE.sCharacter('mgrbfm_senussi_character_scope').GetFullName] has proposed the organization of his adherents and their lodges into a "state-within-a-State.""
 mgrbfm_libya.104.f: "While wrapped in the noble cause of defending his followers, the Grand Senussi threatens the supremacy of the Sultan in state and social affairs."
 mgrbfm_libya.104.a: "This is concerning."
