 eqfm_senusiyya.300.t: "Expelling the $eqfm_senusiyya$"
 eqfm_senusiyya.300.d: "The [ROOT.GetCountry.GetRuler.GetPrimaryRolerTitle] has authorized the deployment of an $eqfm_expedition$ to expel the $eqfm_senusiyya_movement$ from [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]. All that remains is to appoint a leader."
 eqfm_senusiyya.300.f: ""And that is the desert. From here until we reach the other side, no water but what we carry with us. For the camels, no water at all. If the camels die, we die. And in twenty days they will start to die""
 eqfm_senusiyya.300.a: "[SCOPE.sCharacter('eqfm_senusiyya_leader_1').GetFullName] will pacify these radicals."
 eqfm_senusiyya.300.b: "We will send [SCOPE.sCharacter('eqfm_senusiyya_leader_2').GetFullName]."
 eqfm_senusiyya.300.c: "[SCOPE.sCharacter('eqfm_senusiyya_leader_3').GetFullName] will serve us well."
 eqfm_senusiyya.300.e: "On second thought, let's not."
 eqfm_senusiyya.301.t: "$eqfm_senusiyya_expedition$ Arrives in [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]"
 eqfm_senusiyya.301.d: "After taking a few weeks to muster and gather supplies, [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetFullName] has departed into [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName] in support of our efforts to expel the $eqfm_senusiyya$."
 eqfm_senusiyya.301.f: ""You send your navy and demand that I must pay my debts to you, and the expenses of your expedition. But how could I pay my debts when you have reduced my revenues to just taxes on agriculture and especially when we did not have enough rain in the last four years?" -Yusuf Pasha, to the British Consul in Tripoli, 1831"
 eqfm_senusiyya.301.a: "We will bring order to the desert."
 eqfm_senusiyya.302.t: "$eqfm_senusiyya_expedition$ Leader has Died!"
 eqfm_senusiyya.302.d: "Our $eqfm_desert_expedition$ was sighted returning from the depths of the [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]. They bring with them the tragic news of the death of its leader out in the wastes."
 eqfm_senusiyya.302.f: ""I pray that I may never see the desert again. Hear me, God.""
 eqfm_senusiyya.302.a: "Tragic Circumstances"
 eqfm_senusiyya.303.t: "$eqfm_senusiyya_expedition$ Withdraws from [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]"
 eqfm_senusiyya.303.d: "Citing a lack of provisions and attritional losses, [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetFullName] has returned from the depths of [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]."
 eqfm_senusiyya.303.f: ""I pray that I may never see the desert again. Hear me, God.""
 eqfm_senusiyya.303.a: "At least they returned alive."
 eqfm_senusiyya.304.t: "$eqfm_senusiyya$ Expelled from [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]"
 eqfm_senusiyya.304.d: ""
 eqfm_senusiyya.304.f: ""
 eqfm_senusiyya.304.a: ""
 
 eqfm_senusiyya.310.t: "$eqfm_senusiyya$ Lodge Uncovered"
 eqfm_senusiyya.310.d: "Scouts have discovered a lodge for $eqfm_senusiyya$ activity in [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName]. The expedition awaits [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastName]'s orders."
 eqfm_senusiyya.310.f: "Despite being centers for spiritual life in the deserts, many lodges are nondescript and rarely centralized, allowing them to slip below the notice of our agents."
 eqfm_senusiyya.310.a: "Detain these clerics and shutter the lodge."
 eqfm_senusiyya.310.b: "Burn the whole settlement down."
 eqfm_senusiyya.311.t: "[GetCulture('bedouin').GetName] Villagers Withhold Information"
 eqfm_senusiyya.311.d: "While surveying the area near a settlement in [GetPlayer.MakeScope.Var('eqfm_senusiyya_expedition_var').GetName], [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastName] has become aware that local villagers have withheld critical information regarding $eqfm_senusiyya$ activities in the area. Worse, there is reason to suspect they have intentionally misdirected the $eqfm_senusiyya_expedition$."
 eqfm_senusiyya.311.f: "The central authority of the cities is a truly alien concept to the tribes of the deserts. Reasonably, many prefer the familiarity of marabouts over our tax collectors and garrisons."
 eqfm_senusiyya.311.a: "Offer them an olive branch in exchange for the truth."
 eqfm_senusiyya.311.b: "Arrest anyone involved in this deception."
 eqfm_senusiyya.311.c: "Put their leaders to the sword."
 eqfm_senusiyya.312.t: "Neighboring Tribe Attacks $eqfm_expedition$"
 eqfm_senusiyya.312.d: "Tribal raiders from [SCOPE.sCountry('eqfm_senusiyya_expedition_neighbor_scope').GetName] have attacked our $eqfm_senusiyya_expedition$. Casualties are limited, but this has disrupted our progress. [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastName] has suggested striking back before they fully depart the area."
 eqfm_senusiyya.312.f: "Operating far from our established power bases, the expedition finds itself at the mercy of tribal power structures."
 eqfm_senusiyya.312.a: "Let them go, we have more important tasks."
 eqfm_senusiyya.312.b: "Have our scouts ride them down."
 eqfm_senusiyya.313.t: "$eqfm_senusiyya_expedition$ Beset by Sandstorms!"
 eqfm_senusiyya.313.d: "[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastName] has found himself trapped in a rapidly intensifying sandstorm. With no nearby land features, he has ordered the $eqfm_expedition$ to build whatever makeshift shelters they can to endure the storm."
 eqfm_senusiyya.313.f: ""Uhh, boss? That's not a mountain range... it's getting closer.""
 eqfm_senusiyya.313.a: "This is disastrous."
 eqfm_senusiyya.313.b: "They must find shelter at all costs!"
 eqfm_senusiyya.313.c: "We must trust in [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastNameNoFormatting]'s instincts."
 eqfm_senusiyya.314.t: "Tribal Leaders Request Meeting"
 eqfm_senusiyya.314.d: "Tribal Elders in [SCOPE.sState('eqfm_senusiyya_expedition_state_scope').GetName] have approached the $eqfm_senusiyya_expedition$ with a proposition: If [ROOT.GetCountry.GetName] allows them to maintain some tribal privileges, they will aid us in our pursuit of [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]."
 eqfm_senusiyya.314.f: "Brokering power with local leaders has long been a necessity in the deserts. With a lack of infrastructure and hostile environs, the tribes are the true authority across the Sahara."
 eqfm_senusiyya.314.a: "This is a fair bargain."
 eqfm_senusiyya.314.b: "We do not deal with barbarians."
 eqfm_senusiyya.314.c: "No, but we'll take the information anyway."
 eqfm_senusiyya.315.t: "$eqfm_senusiyya_expedition$ Misdirected"
 eqfm_senusiyya.315.d: "After advancing nearly three days into the open desert, [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastName] has realized that the $eqfm_senusiyya_expedition$ have been misled by [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]. It may take several days to get back on course."
 eqfm_senusiyya.315.f: ""
 eqfm_senusiyya.315.a: "This is unfortunate."
 eqfm_senusiyya.315.b: "Sounds like a forced march is in order."
 eqfm_senusiyya.315.c: "[SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastNameNoFormatting] will inspire the troops."
 eqfm_senusiyya.316.t: "Caravan Found Trafficking $eqfm_senusiyya$ Leaders"
 eqfm_senusiyya.316.d: "Following an alert from [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('eqfm_senusiyya_expedition_leader_scope').GetLastNameNoFormatting], the garrison at [SCOPE.sState('eqfm_senusiyya_expedition_state_scope').GetCityHubName] has intercepted a caravan intent on smuggling several $eqfm_senusiyya$ faithful out of [ROOT.GetCountry.GetNameNoFlag]. The garrison has reported the seizure of both dry goods and weapons, likely meant for foreign lodges."
 eqfm_senusiyya.316.f: ""
 eqfm_senusiyya.316.a: "Have these goods confiscated for the state."
 eqfm_senusiyya.316.b: "Trace these goods to their village and make arrests."
 eqfm_senusiyya.317.t: "$eqfm_senusiyya_expedition$ Ambushed by Raiders!"
