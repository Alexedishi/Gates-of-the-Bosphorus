 eqfm_senusiyya.200.t: "$eqfm_senusiyya$ Spreads to [SCOPE.sCountry('eqfm_senussi_target_country').GetName]"
 eqfm_senusiyya.200.d: "Missionaries of the $eqfm_senusiyya_movement$ have arrived at the court in [SCOPE.sCountry('eqfm_senussi_target_country').GetCapital.GetCityHubName]. Despite the outcry of the established Ulama, they have found some willing ears."
 eqfm_senusiyya.200.f: "With their message of dissent against the perceived decadence of the $turkfm_porte$, [SCOPE.sCharacter('eqfm_senussi_character_scope').GetLastName]'s preachings strike a common chord with fellow Muslims."
 eqfm_senusiyya.200.a: "So be it."
 eqfm_senusiyya.200.b: "The state cannot tolerate these mystics."
 eqfm_senusiyya.200.c: "We shall spread the word!"
