 mgrbfm_libya.108.t: "The Senusiyya Movement Extinguished"
 mgrbfm_libya.108.d: "In accordance with the mandate of the $turkfm_porte$, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has driven back the adherents of the $mgrbfm_senusiyya_movement$ and ensured the extinction of their school of thought."
 mgrbfm_libya.108.f: "By securing the country against the followers of Senussi, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has also secured the dominance of [GetCulture('turkish').GetName] influence over [ROOT.GetCountry.GetName]."
 mgrbfm_libya.108.a: "The [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] will guide [ROOT.GetCountry.GetName]."
 mgrbfm_libya.109.t: "House Senussi of [ROOT.GetCountry.GetName]"
 mgrbfm_libya.109.d: "Arriving flanked by cheering crowds, [SCOPE.sCharacter('mgrbfm_senussi_character_scope').GetFullName], the head of the $mgrbfm_senusiyya_movement$, has taken the throne of [ROOT.GetCountry.GetName]."
 mgrbfm_libya.109.f: ""
 mgrbfm_libya.109.a: "The $mgrbfm_senusiyya_movement$ will guide [ROOT.GetCountry.GetName]"
 
 mgrbfm_libya.110.t: "$mgrbfm_senusiyya$ Spreads to [SCOPE.sCountry('mgrbfm_senussi_target').GetName]"
 mgrbfm_libya.110.d: "Comfortable in his level of influence within [ROOT.GetCountry.GetName], [SCOPE.sCharacter('mgrbfm_senussi_character_scope').GetFullName] has dispatched missionaries across the border into the deserts of [SCOPE.sCountry('mgrbfm_senussi_target').GetName] to spread his message."
 mgrbfm_libya.110.f: "By operating deep in the deserts, the followers of Senussi are able to evade central authority. To them, international borders are merely a suggestion."
 mgrbfm_libya.110.a: "This is becoming problematic."
 mgrbfm_libya.111.t: "The Senussi Order"
 mgrbfm_libya.111.d: "Adherents of the [GetReligion('sunni').GetName] scholar, [SCOPE.sCharacter('mgrbfm_senussi_character_scope').GetFullName], have arrived in [ROOT.GetCountry.GetNameNoFlag]. Bringing with their peculiar brand of $mgrbfm_senusiyya$ thought, they have gained recognition amongst the [GetCulture('bedouin').GetName] tribes of the desert."
 mgrbfm_libya.111.f: "Outside of the major towns, spiritual life in [GetStrategicRegion('region_north_africa').GetName] is guided less by the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] and more by itinerant preachers known by the term [GetCharacterTrait('gbbf_trait_marabout').GetName] These figures often act as tribal mediators and intermediaries between state authorities and tribal leaders."
 mgrbfm_libya.111.a: "This could be troublesome."
 mgrbfm_libya.112.t: "$mgrbfm_senusiyya$ Takes Root in [SCOPE.sState('mgrbfm_senussi_state_scope').GetName]"
 mgrbfm_libya.112.d: "Adherents of the $mgrbfm_senusiyya_movement$ have made significant inroads into [SCOPE.sState('mgrbfm_senussi_state_scope').GetCityHubName] and established several lodges across [SCOPE.sState('mgrbfm_senussi_state_scope').GetName]. It will take significant effort to dislodge them now."
 mgrbfm_libya.112.f: "Centralized administration has encountered opposition from the populace who decry increased taxation and the erosion of their traditional autonomy. This has given the $mgrbfm_senusiyya_movement$ a wedge to find popular support."
 mgrbfm_libya.112.a: "We must keep them in their lane."
 mgrbfm_libya.112.b: "The state must take action."
 mgrbfm_libya.113.t: "$mgrbfm_senusiyya$ Expunged From [SCOPE.sState('mgrbfm_senussi_state_scope').GetName]"
 mgrbfm_libya.113.d: "Leaders of the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] have succeeded in pushing the $mgrbfm_senusiyya_movement$ out of [SCOPE.sState('mgrbfm_senussi_state_scope').GetCityHubName] and from their lodges across [SCOPE.sState('mgrbfm_senussi_state_scope').GetName]."
 mgrbfm_libya.113.f: "By repelling the $mgrbfm_senusiyya_movement$ from our urban centers, the "
 mgrbfm_libya.113.a: "The [GetInterestGroupVariant('ig_devout',GetPlayer).GetName] are the only authority in [ROOT.GetCountry.GetName]."
