 eqfm_karadag_placid_desc: "@information! There is nothing of note occurring along the Montenegrin border."
 eqfm_karadag_status_placid: "#bold Current Situation:#! $eqfm_karadag_placid$"

 eqfm_karadag_raiding: "@gbbf_raiding! #bold #orange Raiding#!#!"
 eqfm_karadag_raiding_desc: "@information! Our tribesmen are [concept_raiding] along the Montenegrin border."
