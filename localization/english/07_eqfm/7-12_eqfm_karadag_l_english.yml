 notification_notification_eqfm_bosnia_ejected_desc: ""
 notification_notification_eqfm_ottomans_ejected_name: ""
 notification_notification_eqfm_ottomans_ejected_desc: ""
 
 notification_notification_eqfm_expeditionary_force_arrives_name: "Ottoman Expeditionary Force Arrives at the Border"
 notification_notification_eqfm_expeditionary_force_arrives_desc: "The Ottoman Empire has deployed a $eqfm_karadag_expedition$ to combat [concept_raiding]"
 notification_notification_eqfm_expeditionary_force_withdraws_name: "Ottoman Expeditionary Force Withdraws from the Border"
 notification_notification_eqfm_expeditionary_force_withdraws_desc: "The Turkish $eqfm_karadag_expedition$ has returned to lick their wounds."
 notification_notification_eqfm_noble_released_name: "Ottoman Nobleman Released"
 notification_notification_eqfm_noble_released_desc: "Montenegrin raiders recently captured a minor noble during a Montenegrin border raid. Strangely, they have shown clemency and allowed him to return to Ottoman territory."
 notification_notification_eqfm_noble_captured_name: "Ottoman Nobleman Captured"
 notification_notification_eqfm_noble_captured_desc: "Montenegrin raiders have seized a minor noble during a Montenegrin border raid. This presents an embarrassing setback in the conflict."
 notification_notification_eqfm_folk_hero_killed_name: "Montenegrin Folk Hero Killed"
 notification_notification_eqfm_folk_hero_killed_desc: "Ottoman soldiers have dispatched a notable #yellow Montenegrin#! war leader. This has increased their influence over the Montenegrin border and galvanized the Montenegrin people against the $turkfm_porte$."
 notification_notification_eqfm_village_skirmish_name: "$eqfm_tribal_skirmish$ Escalates"
 notification_notification_eqfm_village_skirmish_desc: "News has arrived of an escalating conflict at a border village in [GetStateRegion('STATE_MONTENEGRO').GetName]. Militias on both sides have dug in for a prolonged fight."
 notification_notification_eqfm_villages_burned_name: "Village Outskirts Burned"
 notification_notification_eqfm_villages_burned_desc: "Several buildings on the outskirts of the village have been set aflame. This has cost us #v 1#! progress in the $eqfm_tribal_skirmish$"
 notification_notification_eqfm_noble_beheaded_name: "Ottoman Nobleman Beheaded"
 notification_notification_eqfm_noble_beheaded_desc: "Following our refusal to pay a ransom for our lost commander, $MON$ has executed their captive by beheading him. His head now adorns the fortifications of the $MON_ADJ$ royal palace."

 # Scripted Buttons
 eqfm_renounce_headtaking_name: "Renounce Head-taking"
 eqfm_renounce_headtaking_desc: "The taking of heads is a bizarre and barbaric holdover of the tribal history of [GetStateRegion('STATE_MONTENEGRO').GetName]. While previous attempts at negotiating its abolition have failed, increased exposure to the West has provided renewed support for ending the practice."
 eqfm_renounce_headtaking_possible: "Negotiations on #bold Head-taking#! have not occurred within the last #bold 5#! years"
 eqfm_renounce_headtaking_effect: "Participants will make their choice on whether to suppress head-taking"

 eqfm_increase_raiding_name: "\"Bring Me More Heads!\""
 eqfm_increase_raiding_desc: "Encourage the tribes to raid more often, increasing [concept_raiding_frequency]. This will increase our income, but hurt [concept_relations] with #v $RUS$#! and especially the #v Ottoman Empire#!."
 eqfm_decrease_raiding_name: "Discourage Raiding"
 eqfm_decrease_raiding_desc: "Force the tribes to curtail their raiding, decreasing [concept_raiding_frequency]. $RUS$#! will appreciate this step towards civility towards the #v Ottoman Empire#!."

 eqfm_appoint_tribal_chief_name: "Appoint Tribal Chief"
 eqfm_appoint_tribal_chief_desc: "[concept_raiding] is endemic to [GetStateRegion('STATE_MONTENEGRO').GetName], and it mostly uncoordinated in nature. By assigning a tribal chief to coordinate raiding, we can instead their spoils and direct a larger portion to state coffers."
 eqfm_dismiss_tribal_chief_name: "Dismiss Tribal Chief"
 eqfm_dismiss_tribal_chief_desc: "Tribal chiefs are useful when loyal. Should one become disloyal, there is little more to do than to "deal" with them."
 eqfm_ransom_captives_name: "Ransom Ottoman Noble"
 eqfm_ransom_captives_desc: "While they serve as a potent propaganda piece, the nobles we've captured do little for the cause beyond languishing in captivity. The Ottoman court may be interested in paying a ransom in exchange for a chance to save face."
 eqfm_ransom_captives_possible: "We have at least #bold 1#! captured noble"
 eqfm_negotiate_kotor_name: "Negotiate Adriatic Access"
 eqfm_negotiate_kotor_desc: "Kotor and its surrounding lands have long been home to the Montenegrin people, yet they have been unfairly cleaved from their countrymen by centuries of imperial designs. However, the Emperor in Vienna may be willing to lend us his ear in exchange for us aligning closer with his Empire."
 
 eqfm_abandon_karadag_name: "Abandon Montenegrin Aspirations"
 eqfm_abandon_karadag_desc: "The conquest of the highlands of [GetStateRegion('STATE_MONTENEGRO').GetName] is seen as a pipe-dream by many. While painful, letting the Montenegrin beast lie would free our attention for other plans..."
 eqfm_start_scheming_name: "Scheme Against #v $Smail$-aga#!"
 eqfm_start_scheming_desc: ""

 eqfm_assign_border_guard_name: "Deploy $eqfm_karadag_expedition$"
 eqfm_assign_border_guard_desc: "The border between Montenegro and the Ottoman Empire is ill-defined, with casual travel across the border being commonplace. With concerted effort, [ROOT.GetCountry.GetNameNoFlag] could extend its influence across the Montenegrin border. However, the resident tribal leaders may not appreciate damages to their lands."
 eqfm_recall_karadag_expedition_name: "Recall $eqfm_karadag_expedition$"
 eqfm_recall_karadag_expedition_desc: "$eqfm_recall_expedition_desc$"
 eqfm_arrest_ali_pasha_name: "Detain Ali Pasha"
 eqfm_arrest_ali_pasha_desc: "Ali Pasha Rizvanbegović is a direct threat to the legitimacy and authority of the Sultan. The $turkfm_porte$ cannot pretend to be secured in its rule as long as he walks free."

 # Script Value Breakdowns
 eqfm_value_from_raiding_intensity: "From current [concept_raiding_frequency]"
 eqfm_value_from_practicing_headtaking: "From practicing head-taking"
 eqfm_value_from_no_raid_leader: "Penalty from lacking a #bold Raiding Leader#!"
 eqfm_value_from_skirmish: "Penalty from ongoing $eqfm_tribal_skirmish$"

 # Tooltips
 eqfm_karadag_expedition: "@gbbf_expedition_karadag! #yellow #tooltip:[GetRawTextTooltipTag('eqfm_karadag_expedition_desc')] Karadağ Expedition#!#!"
 eqfm_karadag_expedition_desc: "The #bold Montenegrin Frontier#! has been isolated from the influences of the greater world by a mixture of rugged terrain and lack of development. As the Ottoman Empire lashes out in its death throes, the $turkfm_porte$ is determined to finally subjugate the Montenegrin tribes."

 eqfm_dismiss_tribal_chief: "This will reduce our earned [concept_raiding] income by #v #red 75%#!#! until we appoint a new Tribal Chief"
 eqfm_tribal_chief_cooldown: "[ROOT.GetCountry.GetNameNoFlag] will be unable to recall the $eqfm_karadag_expedition$ for #bold 1 year#!"

 eqfm_karadag_commander_imprisoned: "[SCOPE.sCharacter('eqfm_karadag_tur_leader').GetFullName] will be #bold imprisoned#!"
 eqfm_karadag_commander_released: "[SCOPE.sCharacter('eqfm_karadag_tur_leader').GetFullName] will be returned to the [ROOT.GetCountry.GetNameNoFlag]"
 eqfm_karadag_commander_captured: "[SCOPE.sCharacter('eqfm_karadag_tur_leader').GetFullName] has been #bold imprisoned#! by [SCOPE.sCountry('montenegro_scope').GetNameNoFlag] and is no longer a [concept_general]"

 eqfm_tribal_skirmish: "#bold #tooltip:[GetRawTextTooltipTag('eqfm_tribal_skirmish_desc')] Tribal Skirmish#!#!"
 eqfm_tribal_skirmish_desc: "A #bold Tribal Skirmish#! occurs when Montenegrin and Ottoman forces become entrenched around a border village. Neither party will be able to safely disengage until the battle has fizzled out."
 eqfm_karadag_skirmish_start: "While the $eqfm_tribal_skirmish$ is ongoing, both sides will be unable to withdraw their leaders until the resolution of the battle"
 eqfm_karadag_skirmish_penalty: "#red Being involved in a $eqfm_tribal_skirmish$ will halve our [concept_raiding] @gold! income!#!"
 eqfm_karadag_skirmish_end: "The $eqfm_tribal_skirmish$ comes to an end"

 eqfm_skirmish_no_progress: "The $eqfm_tribal_skirmish$ makes no progress"
 eqfm_skirmish_progress_mon_1: "The $eqfm_tribal_skirmish$ by #v 1#! in favor of [SCOPE.sCountry('montenegro_scope').GetName]"
 eqfm_skirmish_progress_mon_2: "The $eqfm_tribal_skirmish$ by #v 2#! in favor of [SCOPE.sCountry('montenegro_scope').GetName]"
 eqfm_skirmish_progress_mon_3: "The $eqfm_tribal_skirmish$ by #v 3#! in favor of [SCOPE.sCountry('montenegro_scope').GetName]"
 eqfm_skirmish_progress_tur_1: "The $eqfm_tribal_skirmish$ by #v 1#! in favor of [SCOPE.sCountry('ottoman_scope').GetName]"
 eqfm_skirmish_progress_tur_2: "The $eqfm_tribal_skirmish$ by #v 2#! in favor of [SCOPE.sCountry('ottoman_scope').GetName]"
 eqfm_skirmish_progress_tur_3: "The $eqfm_tribal_skirmish$ by #v 3#! in favor of [SCOPE.sCountry('ottoman_scope').GetName]"

