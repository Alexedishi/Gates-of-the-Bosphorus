l_english:
 # Journal Entries
 je_eqfm_karadag: "The Black Mountain"
 je_eqfm_karadag_reason: "$je_eqfm_karadag_flavor$$je_eqfm_karadag_details$"
 je_eqfm_karadag_flavor: "[GetPlayer.GetCustom('eqfm_karadag_flavor_type')]"
 je_eqfm_karadag_flavor_generic: "In many ways, the vicious frontier of [GetStateRegion('STATE_MONTENEGRO').GetName] has preserved many of the pre-medieval customs of conflict and tribal rule. From slave raids to the taking of heads, the hinterlands represent a bizarre holdover of tribalistic behavior to the outside world. As the Ottoman Empire struggles to assert its sovereignty, it looks to finally bring the Montenegrin people to heel."
 je_eqfm_karadag_flavor_montenegro: "$je_eqfm_karadag_flavor_generic$"
 je_eqfm_karadag_flavor_bosnia: "#yellow Ali Pasha Rizvanbegović was installed as the vizier of Hersek as a rewards for services to the $turkfm_porte$. In the years since, he has conspired to rule Bosnia as a person fiefdom and has repeatedly refused orders for modernization from [ROOT.GetCountry.GetCapital.GetCityHubName]. While #yellow Madmud#! showed deference to the Pasha, [ROOT.GetCountry.GetRuler.GetFirstName] has taken a less tolerant attitude towards Rizvanbegović."
 je_eqfm_karadag_flavor_ottoman: "$je_eqfm_karadag_flavor_generic$"
 
 je_eqfm_karadag_details: "[GetPlayer.GetCustom('eqfm_karadag_raiding_type')][GetPlayer.GetCustom('eqfm_karadag_ali_pasha_type')]"
 je_eqfm_karadag_raiding: "$gbbf_linebreak_normal$[ROOT.GetCountry.GetNameNoFlag]'s current [concept_raiding_frequency] is [GetPlayer.MakeScope.Var('raiding_intensity').GetValue]. This results in a weekly income of #g @money! #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_eqfm_karadag_raiding_breakdown [GetPlayer.MakeScope.Var('last_week_raiding_income').GetValue|+=0]#!#! (of a maximum of #v 5000#!) from [concept_raiding].[GetPlayer.GetCustom('eqfm_karadag_raiding_organizer_type')][GetPlayer.GetCustom('eqfm_karadag_captives_type')]"
 je_eqfm_karadag_raiding_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('eqfm_raiding_income_value')]"
 je_eqfm_karadag_raiding_amount: "\n[concept_raiding] is earning us #g @money!+[GetPlayer.MakeScope.Var('last_week_raiding_income').GetValue]#!"
 je_eqfm_karadag_raiding_amount_max: "\n[concept_raiding] is earning us #g @money!+[GetPlayer.MakeScope.ScriptValue('eqfm_max_raiding_income_value')]#! (Max)"
 
 je_eqfm_karadag_wrath_of_ali_pasha: "$gbbf_linebreak_normal$@warning! #v Montenegro#! has been set upon by the Vizier of Herzegovina, #bold Ali Pasha Rizvanbegović#!. Determined to increase their influence in the eyes of the Porte, both Ali Pasha and #bold_black Osman Pasha Skopljak#!, the Vizier of Scutari, have committed themselves to finally bringing Montenegro into the holdings of the #v Ottoman Empire#!. Every day, reports come in of new atrocities at our borders. It is all they can do to hold out against their aggression."
 je_eqfm_karadag_ambitions_of_ali_pasha: "$gbbf_linebreak_normal$@information! Should [ROOT.GetCountry.GetName] lose its [concept_claim] over [GetStateRegion('STATE_MONTENEGRO').GetName], it will be removed from the #bold $je_eqfm_karadag$#! [concept_journal_entry]."
 
 je_eqfm_karadag_on_complete_montenegro: "If completed with a #v $MON_ADJ$#! victory, Triggers the Event #white #bold $$#!#!"
 je_eqfm_karadag_on_complete_bosnia: "If completed with a #v $BOS_ADJ$#! victory, Triggers the Event #white #bold $$#!#!"
 je_eqfm_karadag_on_complete_ottomans: "If completed with a #v $TUR_ADJ$#! victory, Triggers the Event #white #bold $$#!#!"
 
 je_eqfm_karadag_status: "[GetPlayer.GetCustom('eqfm_karadag_status_type')][GetPlayer.GetCustom('eqfm_karadag_raiding_income_type')][GetPlayer.GetCustom('eqfm_karadag_expedition_type')]"
 
 je_eqfm_the_karadag_expedition: "\n$eqfm_expedition_progress$: #bold #green [GetPlayer.MakeScope.Var('eqfm_karadag_expedition_progress_var').GetValue]#!/8#! $eqfm_expedition_peril$: #bold #red [GetPlayer.MakeScope.Var('eqfm_karadag_expedition_peril_var').GetValue]#!/5#!"
 je_eqfm_karadag_captives_count: "\n@information! [ROOT.GetCountry.GetNameNoFlag] is currently holding [ROOT.MakeScope.Var('eqfm_captured_nobles_var').GetValue] nobles captive."
 je_eqfm_karadag_raiding_no_chief: "\n@warning! Our [concept_raiding] income is being reduced by #red #bold 75%#!#! due to not having a Tribal Chief organizing our efforts!"
 
 # Journal Entry Lobby Text
 je_eqfm_karadag_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_ip3$\n$je_eqfm_karadag_flavor_generic$"

