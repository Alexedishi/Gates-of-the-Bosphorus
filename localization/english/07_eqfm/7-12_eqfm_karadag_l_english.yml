 eqfm_karadag_status_skirmish: "#bold Current Situation:#! $eqfm_karadag_skirmish$"

 eqfm_headtaking_cooldown_GET: "We will be unable to attempt negotiations on Head-taking for #bold 5#! years"
 eqfm_raiding_status_cooldown: "[ROOT.GetCountry.GetNameNoFlag] has not changed its stance on raiding activities within the last #bold 2#! years"
