l_english:
 # Journal Entries
 je_eqfm_senusiyya: "The Teachings of al-Sanusi"
 je_eqfm_senusiyya_reason: "Like much of the Arab world, spiritual life in much of Northern Africa is guided by the Ulama. However, in the [GetGeographicRegion('geographic_region_senusiyya').GetName] [concept_georegion], spiritual life often centers around itinerant preachers known as [GetCharacterTrait('gbbf_trait_marabout').GetName]#yellow s#!. Under increasing pressure from the $turkfm_porte$, the $eqfm_senusiyya_movement$ has gained traction amongst the [GetCulture('bedouin').GetName] people, spreading along the paths of the Marabouts.\n$TOOLTIP_DELIMITER$\n#white Led by [GetGlobalVariable('je_eqfm_senusiyya').Var('eqfm_senussi_character_var').GetCharacter.GetFullName], the $eqfm_senusiyya_movement$ is exerting [GetGlobalVariable('je_eqfm_senusiyya').Var('eqfm_senusiyya_pressure_var').GetValue] $eqfm_senusiyya_pressure_short$. This is expected to change by #tooltippable;tooltip:[GetPlayer.GetTooltipTag],eqfm_senusiyya_pressure_progress_breakdown [GetGlobalVariable('je_eqfm_senusiyya').Var('eqfm_senusiyya_pressure_progress_var').GetValue]#! next month.#!\n$TOOLTIP_DELIMITER$\nAt maximum $eqfm_senusiyya_pressure_short$, the $eqfm_senusiyya_movement$ will provide the following effects:\n[GetStaticModifier('modifier_eqfm_senusiyya_movement').GetDesc]\n$TOOLTIP_DELIMITER$\nThe $eqfm_senusiyya_movement$ has the following $eqfm_senusiyya_entrenchment_short$ across the [GetGeographicRegion('geographic_region_senusiyya').GetName] [concept_georegion]:\n• [GetPlayer.GetCustom('eqfm_senusiyya_great_sand_sea_type')]\n• [GetPlayer.GetCustom('eqfm_senusiyya_libya_type')]\n• [GetPlayer.GetCustom('eqfm_senusiyya_libyan_desert_type')]\n• [GetPlayer.GetCustom('eqfm_senusiyya_tripoli_type')]\n• [GetPlayer.GetCustom('eqfm_senusiyya_egyptian_desert_type')]\n• [GetPlayer.GetCustom('eqfm_senusiyya_matruh_type')]\n• [GetPlayer.GetCustom('eqfm_senusiyya_chad_type')]"
 je_eqfm_senusiyya_status: "[GetPlayer.GetCustom('eqfm_senusiyya_status_type')]"
 je_eqfm_senusiyya_complete: "Every $eqfm_muslim$ [concept_country] in the [GetGeographicRegion('geographic_region_senusiyya').GetName] [concept_georegion] has either #bold Embraced#! or #bold Swept Away#! the $eqfm_senusiyya_movement$"
 eqfm_senusiyya_pressure_progress_breakdown: "[GetPlayer.MakeScope.GetScriptValueDesc('eqfm_senusiyya_pressure_progress_value')]"
 
 je_eqfm_senusiyya_expedition: ""
 je_eqfm_senusiyya_expedition_reason: ""
 je_eqfm_senusiyya_expedition_complete: ""
 je_eqfm_senusiyya_expedition_fail: ""
 je_eqfm_senusiyya_expedition_status_transit: ""
