l_english:
 # Journal Entries
 je_eqfm_senusiyya: "The Teachings of al-Sanusi"
 je_eqfm_senusiyya_reason: "Like much of the Arab world, spiritual life in [ROOT.GetCountry.GetName] is guided by the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName]. However, in the expanses of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName], spiritual life often centers around the [GetCharacterTrait('gbbf_trait_marabout').GetName]. Under increasing pressure from the $turkfm_porte$, the $eqfm_senusiyya_movement.013$ has gained traction amongst the [ROOT.GetCountry.GetAdjectiveNoFlag] people.\n$TOOLTIP_DELIMITER$\n#white Led by [GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetFullName], the $eqfm_senusiyya_movement.013$ has [GetPlayer.MakeScope.Var('eqfm_senussi_var').GetValue] strength. This is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],eqfm_senussi_progress_tt [GetPlayer.MakeScope.Var('eqfm_senussi_progress_var').GetValue]#! next month.\n$TOOLTIP_DELIMITER$\nAt maximum support, the $eqfm_senusiyya_movement.013$ will provide the following effects:\n[GetStaticModifier('modifier_eqfm_senusiyya_movement.013').GetDesc]"
 je_eqfm_senusiyya_complete: "Every [concept_country] in the [GetGeographicRegion('geographic_region_senussi').GetName] [concept_georegion] has either #bold Embraced#! or #bold Swept Away#! the $eqfm_senusiyya_movement.013$"
 je_eqfm_senusiyya_on_complete_1: "If a country has #bold Embraced#! the $eqfm_senusiyya_movement.013$, triggers the event #bold #white House Senussi of [ROOT.GetCountry.GetNameNoFormatting]#!#!"
 je_eqfm_senusiyya_on_complete_2: "If a country has #bold Swept Away#! the $eqfm_senusiyya_movement.013$, triggers the event #bold #white The Senusiyya Movement Extinguished#!#!"

 # Journal Entry Lobby Text
 je_eqfm_senusiyya_lobby: "$gbbf_journal_lobby$\nLike much of the Arab world, spiritual life in Libya is guided by the Ulema. However, in the expanses of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName], spiritual life often centers around the [GetCharacterTrait('gbbf_trait_marabout').GetName]. Under increasing pressure from the $turkfm_porte$, the $eqfm_senusiyya_movement.013$ has gained traction amongst the [GetCulture('bedouin').GetName] people."

 # Modifiers
 modifier_eqfm_senusiyya_movement.013: "$eqfm_senusiyya_movement.013$"
 modifier_eqfm_senussi_stronghold: "$eqfm_senusiyya$ Stronghold"
 modifier_eqfm_senussi_nationalism: "Senussi Nationalism"
 modifier_eqfm_desert_raids: "Desert Patrols"
 modifier_eqfm_senusiyya_extinguished: "$eqfm_senusiyya$ Extinguished"
 modifier_eqfm_senusiyya_embraced: "$eqfm_senusiyya$ Embraced"
 
 # Notifications
 notification_notification_eqfm_senussi_ghosted_name: "[GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetLastName] Vanishes!"
 notification_notification_eqfm_senussi_ghosted_desc: "Security services have reported that [GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetFullName] has vanished without a trace."
 notification_notification_eqfm_senussi_entrenched_name: " Becomes Entrenched"
 notification_notification_eqfm_senussi_entrenched_desc: "The Dominance of the $eqfm_senusiyya_movement.013$ has allowed [GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetFullName] to entrench himself in the Court at [ROOT.GetCountry.GetCapital.GetCityHubName]."
 notification_notification_eqfm_senussi_urbanized_up_name: "[GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetLastName] Advances into the Cities"
 notification_notification_eqfm_senussi_urbanized_up_desc: "The Dominance of the $eqfm_senusiyya_movement.013$ has allowed [GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetFullName]'s followers to advance into urban areas."
 notification_notification_eqfm_senussi_urbanized_down_name: "[GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetLastName] Regroups in the Cities"
 notification_notification_eqfm_senussi_urbanized_down_desc: "Recent setbacks in the influence of the $eqfm_senusiyya_movement.013$ has forced [GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetFullName]'s followers to withdraw into urban centers."
 notification_notification_eqfm_senussi_villages_up_name: "[GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetLastName] Advances into Desert Villages"
 notification_notification_eqfm_senussi_villages_up_desc: "The Dominance of the $eqfm_senusiyya_movement.013$ has allowed [GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetFullName]'s followers to advance into desert villages."
 notification_notification_eqfm_senussi_villages_down_name: "[GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetLastName] Withdraws to Desert Villages"
 notification_notification_eqfm_senussi_villages_down_desc: "Recent setbacks in the influence of the $eqfm_senusiyya_movement.013$ has forced [GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetFullName]'s followers to withdraw into desert villages."
 notification_notification_eqfm_senussi_desert_up_name: "[GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetLastName] Arrives in the Desert"
 notification_notification_eqfm_senussi_desert_up_desc: "The Dominance of the $eqfm_senusiyya_movement.013$ has allowed [GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetFullName]'s followers to advance into the depths of the desert wastelands."
 notification_notification_eqfm_senussi_desert_down_name: "[GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetLastName] Withdraws into the Desert"
 notification_notification_eqfm_senussi_desert_down_desc: "Recent setbacks in the influence of the $eqfm_senusiyya_movement.013$ has forced [GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetFullName]'s followers to withdraw into the depths of the desert wastelands."
 notification_notification_eqfm_senussi_arrival_name: "The $eqfm_senusiyya_movement.013$ Returns to [ROOT.GetCountry.GetName]"
 notification_notification_eqfm_senussi_arrival_desc: "Despite being driven out, the followers of $eqfm_senusiyya$ have once again managed to establish a foothold in [ROOT.GetCountry.GetName]"
 
 # Scripted Buttons
 eqfm_embrace_senussi_button: "Embrace $eqfm_senusiyya$"
 eqfm_embrace_senussi_button_desc: "The $eqfm_senusiyya_movement.013$ permeates every aspect of [ROOT.GetCountry.GetAdjectiveNoFlag] society. The time has come to throw off the tradition of Turkish rule and embrace a new future for [ROOT.GetCountry.GetNameNoFormatting]."
 eqfm_embrace_senussi_possible: "Support for $eqfm_senusiyya$ is at #bold Maximum#!"
 eqfm_embrace_senussi_button_effect: "[GetPlayer.MakeScope.Var('eqfm_senussi_character_var').GetCharacter.GetLastName] will become the [concept_ruler] of [ROOT.GetCountry.GetNameNoFlag]"
 eqfm_sweep_desert_button: "Sweep the Desert"
 eqfm_sweep_desert_button_desc: "The $eqfm_senusiyya_movement.013$ has been driven out of our cities and deep into the desert. All that remains is to round up their last supporters and shutter their last lodges to extinguish these radicals."
 eqfm_sweep_desert_possible: "There is #bold zero#! support for the $eqfm_senusiyya_movement.013$"
 eqfm_sweep_desert_button_effect: "The $eqfm_senusiyya_movement.013$ will be expelled from [ROOT.GetCountry.GetNameNoFlag] never to return"
 eqfm_supress_senusiyya_button: "Suppress Senussi's Followers"
 eqfm_supress_senusiyya_button_desc: "The tenets of the $eqfm_senusiyya_movement.013$ threaten the foundation of Turkish governance in [ROOT.GetCountry.GetName]. Suppression of Senussi's message via censorship and intimidation is our only choice."
 eqfm_supress_senusiyya_possible_1: "[ROOT.GetCountry.GetNameNoFlag] has #bold Sent an Armed Delegation to Senussi#!"
 eqfm_supress_senusiyya_possible_2: "[ROOT.GetCountry.GetNameNoFlag] has not changed its stance towards [GetStaticModifier('modifier_eqfm_desert_raids').GetName] within the last #bold 2 years#!"
 eqfm_supress_senusiyya_effect: "[ROOT.GetCountry.GetNameNoFlag] will be unable to change its stance towards [GetStaticModifier('modifier_eqfm_desert_raids').GetName] for #bold 2 years#!"
 eqfm_armed_delegation_button: "Send Armed Delegation"
 eqfm_armed_delegation_button_desc: "Despite being pushed out from the cities, Senussi continues to send his missionaries into our urban areas. We should send him a message to stay in his lane."
 
 # Scripted Progress Bars
 eqfm_senussi_progressbar: "$eqfm_senusiyya$ Influence:#!\n$TOOLTIP_DELIMITER$\n#bold #italic Factors in Support of Al-Senussi:#!#!\n[GetPlayer.MakeScope.GetScriptValueDesc('eqfm_senussi_support_value')]\n$TOOLTIP_DELIMITER$\n#bold #italic Factors in Opposition to Al-Senussi:\n#!#![GetPlayer.MakeScope.GetScriptValueDesc('eqfm_senussi_opposition_value')]\n$TOOLTIP_DELIMITER$\n#italic #white #bold [GetPlayer.MakeScope.Var('eqfm_senussi_progress_var').GetValue] expected monthly"
 eqfm_senussi_progressbar_desc: "$eqfm_senusiyya$ Influence"
 
