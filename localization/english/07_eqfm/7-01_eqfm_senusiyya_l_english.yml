 # Journal Entry Lobby Text
 je_eqfm_senusiyya_lobby: "$gbbf_journal_lobby$\nLike much of the Arab world, spiritual life in Libya is guided by the Ulema. However, in the expanses of the [GetStateRegion('STATE_LIBYAN_DESERT').GetName], spiritual life often centers around the [GetCharacterTrait('gbbf_trait_marabout').GetName]. Under increasing pressure from the $turkfm_porte$, the $eqfm_senusiyya_movement$ has gained traction amongst the [GetCulture('bedouin').GetName] people."
 
