l_english:
 # Modifiers
 modifier_eqfm_deployed_expedition: "Deployed Expedition Costs"

 # Scripted Buttons
 eqfm_recall_expedition_button: "Recall $eqfm_expedition$"
 eqfm_recall_expedition_button_desc: "The state's needs are ever changing. Should we need, we can recall this $eqfm_expedition$ to free up resources."

 # Script Value Breakdowns
 eqfm_value_from_senusiyya_expedition: "From deploying an $eqfm_senusiyya_expedition$ to sweep the $eqfm_senusiyya_movement$ out of a given [concept_state_region]"
 eqfm_value_from_organizing_raids: "From organizing [ROOT.GetCountry.GetAdjectiveNoFlag] [concept_raiding]"
 eqfm_value_from_black_mountain_expedition: "From deploying an $eqfm_black_mountain_expedition$ to suppress [concept_raiding]"
 eqfm_value_from_adriatic_expedition: "From deploying an $eqfm_adriatic_expedition$ to chase down [concept_albanian_piracy]"
 eqfm_value_from_desert_expedition: "From deploying an $eqfm_desert_expedition$ to tame the [concept_bedouin_tribes]"

 # Triggers
 eqfm_has_expedition: "[GetPlayer.GetNameNoFlag] has an active $eqfm_expedition$"
 eqfm_has_expedition_NOT: "[GetPlayer.GetNameNoFlag] does #bold not#! have an active $eqfm_expedition$"
 
 eqfm_has_senusiyya_expedition: "[GetPlayer.GetNameNoFlag] has an active $eqfm_senusiyya_expedition$"
 eqfm_has_senusiyya_expedition_NOT: "[GetPlayer.GetNameNoFlag] does #bold not#! have an active $eqfm_senusiyya_expedition$"
 
 eqfm_has_adriatic_expedition: "[GetPlayer.GetNameNoFlag] has an active $eqfm_adriatic_expedition$"
 eqfm_has_adriatic_expedition_NOT: "[GetPlayer.GetNameNoFlag] does #bold not#! have an active $eqfm_adriatic_expedition$"
 
 eqfm_has_black_mountain_expedition: "[GetPlayer.GetNameNoFlag] has an active $eqfm_black_mountain_expedition$"
 eqfm_has_black_mountain_expedition_NOT: "[GetPlayer.GetNameNoFlag] does #bold not#! have an active $eqfm_black_mountain_expedition$"
 
 eqfm_has_tribal_chief: "[GetPlayer.GetNameNoFlag] has a #bold Tribal Chief#! organizing [concept_raiding]"
 eqfm_has_tribal_chief_NOT: "[GetPlayer.GetNameNoFlag] does #bold not#! have a #bold Tribal Chief#! organizing [concept_raiding]"
 
 eqfm_has_desert_expedition: "[GetPlayer.GetNameNoFlag] has an active $eqfm_desert_expedition$"
 eqfm_has_desert_expedition_NOT: "[GetPlayer.GetNameNoFlag] does #bold not#! have an active $eqfm_desert_expedition$"
 
 eqfm_expedition_leaderless_trigger: "This $eqfm_expedition$ does #bold not#! have a leader"

 # Tooltips
 eqfm_expedition: "#o #tooltip:[GetRawTextTooltipTag('eqfm_expedition_desc')] Expedition#!#!"
 eqfm_expedition_desc: "The #bold Turkish Expeditions#! represent localized struggles by the $turkfm_porte$ to assert control over its Empire beyond the realms of geopolitics and economic development."

 eqfm_expedition_progress:  "#tooltippable;positive_value;TOOLTIP:eqfm_expedition_progress_desc Progress#!"
 eqfm_expedition_progress_desc: "#bold Progress#! represents the progress achieved by the members of an $eqfm_expedition$. Increasing #bold #green Progress#!#! to #bold 8 or more#! will achieve its goal."
 eqfm_add_expedition_progress: "$eqfm_expedition$  $eqfm_expedition_progress$ will change by #v [TopScope.GetLocalVariable('eqfm_expedition_loc_var').GetValue|+=]"
 eqfm_remove_all_progress: "The $eqfm_expedition$ loses #bold #red all#!#! $eqfm_expedition_progress$"

 eqfm_expedition_peril: "#tooltippable;negative_value;TOOLTIP:eqfm_expedition_peril_desc Peril#!"
 eqfm_expedition_peril_desc: "#bold Peril#! represents the adversity encountered by the members of an $eqfm_expedition$. Increasing #bold #red Peril#!#! to #bold 5 or more#! will cause it to fail."
 eqfm_add_expedition_peril: "$eqfm_expedition$  $eqfm_expedition_peril$ will change by #v [TopScope.GetLocalVariable('eqfm_expedition_loc_var').GetValue|-=]"
 eqfm_remove_all_peril: "The $eqfm_expedition$ loses #bold #green all#!#! $eqfm_expedition_peril$"
