 eqfm_karadag.111.t: "Planning an Assassination"
 eqfm_karadag.111.d: ""
 eqfm_karadag.111.f: ""
 eqfm_karadag.111.a: ""
 eqfm_karadag.111.b: ""
 eqfm_karadag.112.t: "Disruptive Influence"
 eqfm_karadag.112.d1: ""
 eqfm_karadag.112.d2: "A communiqué arrived in [ROOT.GetCountry.GetCapital.GetCityHubName] this morning, suggesting that the Ottoman bey, [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! [SCOPE.sCharacter('smail_aga_scope').GetLastName], has conspired to usurp [SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle] as Vizier of Herzegovina. Advisors to the Prince have warned this could endanger our Serb cousins in [SCOPE.sCountry('montenegro_scope').GetName]."
 eqfm_karadag.112.f1: ""
 eqfm_karadag.112.f2: "The Prince-Bishop of #yellow Montenegro#! has found himself assailed by the political intrigue of the Porte, with his borders threatened by #yellow Ali Pasha#!. While we cannot act openly against other subjects of our Ottoman overlords, we could aid [SCOPE.sCharacter('montenegro_ruler_scope').GetFullName] in sowing discord in their ranks."
 eqfm_karadag.112.a: "Send the Pasha a letter."
 eqfm_karadag.112.b: "Perhaps we can find a willing accomplice..."
 eqfm_karadag.112.c: "We will not aid this blood feud."
 eqfm_karadag.112.e: "Expose this deviant plot!"
 eqfm_karadag.113.t: "Knives in the Dark"
 eqfm_karadag.113.d: "[ROOT.GetCountry.GetRuler.GetFullNameWithTitle] has found himself at an impasse. A sealed letter arrived this morning from none other than [SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle] himself. In it, the [SCOPE.sCountry('bosnia_scope').GetRuler.GetPrimaryRoleTitle] has invited the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to a plot to assassinate Bosnian lord, [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! [SCOPE.sCharacter('smail_aga_scope').GetLastName], one of the perpetrators of gratuitous violence in Grahovo."
 eqfm_karadag.113.f: "[SCOPE.sCountry('serbia_scope').GetRuler.GetFullNameWithTitle], along with other beys, has found his position as vizier threatened by the rise of Smaïl-aga. With his fears validated by [SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle], Ali has sought allies in the region. Given Smaïl-aga's notoriety for a series of massacres in Grahovo after the village fell into Ottoman hands, the conspirators hope that [ROOT.GetCountry.GetRuler.GetLastName] will be amenable to their plans."
 eqfm_karadag.113.a: "We will have revenge for Gravoho."
 eqfm_karadag.113.b: "This is not the company we keep."
 eqfm_karadag.114.t: "A Local Collaborator"
 eqfm_karadag.114.d: "Following weeks of considerations, advisors have recommended recruiting a local to carry out the act to avoid implicating the Bishop. They have settled on [SCOPE.sCharacter('novica_cerovic_scope').GetFullName], a local vojvoda."
 eqfm_karadag.114.f: "Smaïl-aga's son, Rustem-beg has earned the hatred of Montenegrins still under the Ottoman thumb. Known for his alcoholism and gratuitous abuses of non-Muslim women in his realm, tribal leaders initially requested the Bishop's permission to assassinate him. A resident of Tušina, Cerović, like many villagers across Montenegro, has held a grudge against Smaïl-aga for the brutality he unleashed on Grahovo. He and his clansmen have accepted the job without hesitation on the condition that they be given leave to deal with Rustem-beg."
 eqfm_karadag.114.a: "He seems a fitting candidate."
 eqfm_karadag.114.tt: "[SCOPE.sCharacter('novica_cerovic_scope').GetFullName] will carry out this grizzly task"
 eqfm_karadag.115.t: "The Demise of Smaïl-aga"
 eqfm_karadag.115.d: "With the blessing of [SCOPE.sCountry('montenegro_scope').GetRuler.GetLastName], a local vojvoda, Novica Cerović, provoked [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! by refusing to pay tribute. While traveling to exact justice, the Ottoman lord was beset by several tribesmen from the region. After beheading the slain noble, the Prince-Bishop has been presented with his head as proof of the act."
 eqfm_karadag.115.f: "\"So you too have come my way, poor Smaïl!\" —Njegoš, 1840"
 eqfm_karadag.115.a: "Excellent. We will see Cerović rewarded."
 eqfm_karadag.115.b: "Good riddance."
 eqfm_karadag.115.c: "Good riddance."
 eqfm_karadag.116.t: "Settling for Blood"
 eqfm_karadag.116.d: "The "sudden" killing of Smaïl-aga has not gone without incident. [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! has publicly denounced the murder and begun a campaign of punishment along the border. [ROOT.GetCountry.GetName] has once again been put in a difficult position. With the threat of war escalating once more, [SCOPE.sCountry('russia_scope').GetName] and [SCOPE.sCountry('austria_scope').GetName] have demanded an immediate cessation of hostilities."
 eqfm_karadag.116.f: "Ali Pasha has taken advantage of the turmoil caused by Smaïl-aga's murder. Since the plot remains unknown, the Bishop's options are limited without exposing the nature of the plot."
 eqfm_karadag.116.a: "Call for negotiations."
 eqfm_karadag.116.b: "Expose the plot."
 eqfm_karadag.117.t: "Duplicitous Diplomacy"
 eqfm_karadag.117.d: "At the behest of the Great Powers, a peace has been negotiated between [SCOPE.sCountry('montenegro_scope').GetRuler.GetFullNameWithTitle] and [SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle]. However, the Pasha has not hesitated to take his chance to gloat at the Montenegrin people."
 eqfm_karadag.117.f: "\"My lord he has played us for fools!\"\nThis sentiment has echoed across the Montenegrin court, as news arrived of the events that transpired immediately after negotiations concluded. [SCOPE.sCountry('bosnia_scope').GetRuler.GetLastNameNoFormatting] Pasha, arrogant in his diplomatic victory, had suddenly opened a bag of gold and threw several coins across the floor. In the ensuring rush, several members of our delegation threw themselves to the floor to gather as many as they could for themselves. This embarrassing display has brought to light the sheer poverty of Montenegro in comparison to the rest of the Balkans."
 eqfm_karadag.117.a: "Never trust a Pasha."
 eqfm_karadag.118.t: "The Plot Exposed!"
