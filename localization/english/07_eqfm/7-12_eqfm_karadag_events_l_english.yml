l_english:
 eqfm_black_mountain.001.t: "The Battle of Grahovo"
 eqfm_black_mountain.001.d1: "The Vizier of the [SCOPE.sCountry('hersek_scope').GetName], [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName], has attacked the border village of Grahovo with the aim of asserting his perceived right to tribute. Despite the valiant efforts of the local militia, the village was ransacked and several civilians have been put to the sword at the command of [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! [SCOPE.sCharacter('smail_aga_scope').GetLastName]. Amongst the fallen is the brother of the [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle], #yellow Joko Petrovic#!."
 eqfm_black_mountain.001.d2: "The Vizier of the [SCOPE.sCountry('hersek_scope').GetName], [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName], has attacked the border village of Grahovo with the aim of asserting his perceived right to tribute. Despite the valiant efforts of the local militia, the village was ransacked and several civilians have been put to the sword at the command of [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! [SCOPE.sCharacter('smail_aga_scope').GetLastName]. Amongst the fallen is the brother of the [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle], #yellow Joko Petrovic#!."
 eqfm_black_mountain.001.f: "\"On Grahovo's wide and spacious plain\nOf Petrovic men full nine were slain\nBy Cengijic Aga's gleaming sword,\nTo the shame of Montenegro's lord."\n-Popular poem recounting the action at Grahovo, 1830s"
 eqfm_black_mountain.001.a: "[ROOT.GetCountry.GetName] must demand restitution."
 eqfm_black_mountain.001.b: "These lands are the rightful domain of the Sultan."
 eqfm_black_mountain.001.c: "[GetStateRegion('STATE_MONTENEGRO').GetName] should be ours."
 eqfm_black_mountain.006.t: "The Black Mountain Lost"
 eqfm_black_mountain.006.d: "Our efforts to retain control over the Black Mountain have failed. The small country has not only defied our leadership but has expelled our influence from [GetStateRegion('STATE_MONTENEGRO').GetName] altogether."
 eqfm_black_mountain.006.f: "Despite centuries of invasions and imperialist designs, Montenegro stands as resolute as its people."
 eqfm_black_mountain.006.a: "This is a disastrous outcome."
 eqfm_black_mountain.007.t: "The Black Mountain Subdued"
 eqfm_black_mountain.007.d: "With both resolute leadership and the fierce spirit of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has brought the entirety of [GetStateRegion('STATE_MONTENEGRO').GetName] under the control of [ROOT.GetCountry.GetName]."
 eqfm_black_mountain.007.f: "After centuries of resisting invasions and imperialist designs, [GetStateRegion('STATE_MONTENEGRO').GetName] has finally been brought to heel."
 eqfm_black_mountain.007.a: "The Black Mountain has been humbled."
 eqfm_black_mountain.008.t: "International Indifference"
 eqfm_black_mountain.008.d: "Despite appeals for armed interventions, both the $gbbf_great_powers$ have remained silent on the matter of Ottoman dominion over [GetStateRegion('STATE_MONTENEGRO').GetName]. In fact, they have demanded that we avoid aggression in the region lest we provoke a larger conflict."
 eqfm_black_mountain.008.f: "Time and time again, the European powers have renewed their support of Montenegro in the hopes of gaining a foothold in the Balkans only to withdraw their support whenever a new border conflict threaten to escalate into open warfare."
 eqfm_black_mountain.008.a: "\"What use are these so-called "Beacons of Civilization?\""
 eqfm_black_mountain.009.t: "The Lands of Montenegro"
 eqfm_black_mountain.009.d: "With both resolute leadership and the fierce spirit of the Montenegrin people, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has brought the entirety of our lands under the control of [ROOT.GetCountry.GetName]."
 eqfm_black_mountain.009.f: "Despite centuries of invasions and imperialist designs, Montenegro stands as resolute as its people."
 eqfm_black_mountain.009.a: "[ROOT.GetCountry.GetName] will never fall!"

 eqfm_black_mountain.010.t: "Negotiations on Head-taking" # Recipient
 eqfm_black_mountain.010.d: "An envoy sent by the [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle] of [SCOPE.sCountry('montenegro_scope').GetName] was hosted at the court in Constantinople today. Among the details discussed was a proposition to ban the practice of Head-taking in the among the tribes of [GetStateRegion('STATE_MONTENEGRO').GetName]."
 eqfm_black_mountain.010.f: "The lack of development and infrastructure across Montenegro has permitted the continuation of several traditions including that of head-taking. These grizzly displays have drawn both shock and scorn from the West."
 eqfm_black_mountain.010.a: "This is a ridiculous request. Off with his head!"
 eqfm_black_mountain.010.b: "These practices are barbaric. We should heed the sentiments of the West."
 eqfm_black_mountain.011.t: "Negotiations on Head-taking" # Outcome
 eqfm_black_mountain.011.d1: "Almost as expected, [SCOPE.sCountry('eqfm_headtaking_recipient_scope').GetNameNoFlag] has rejected our offer to clamp down on the practice of head-taking."
 eqfm_black_mountain.011.d2: "Against all odds, our envoys have brokered a deal that will see the practice of head-taking curtailed across [GetStateRegion('STATE_MONTENEGRO').GetName]. All that remains is to inform the tribal heads."
 eqfm_black_mountain.011.f: "While negotiations to abandon the practice of head-taking have occurred in the past, each and ever time they have been hampered by the fear that one side would renege on their side of the bargain."
 eqfm_black_mountain.011.a: "If they will not negotiate, then neither shall we."
 eqfm_black_mountain.011.b: "The [SCOPE.sCountry('eqfm_headtaking_recipient_scope').GetRuler.GetPrimaryRoleTitle] has no honor. We should display ours."
 eqfm_black_mountain.011.c: "Excellent news."
 eqfm_black_mountain.012.t: "Negotiations Over Cattaro" # Recipient
 eqfm_black_mountain.012.d: "An envoy from [SCOPE.sCountry('montenegro_scope').GetName] presented himself in the [ROOT.GetCountry.GetAdjective] court to negotiate for the return of Kotor to the Montenegrin people."
 eqfm_black_mountain.012.f: "Kotor has been a home to the Montenegrins [GetCulture('serb').GetName]#yellow s#! since their arrival in the [GetStrategicRegion('region_balkans').GetName], yet have found itself ruled by foreign powers more often than not. This agreement finally seeks to write this historical wrong."
 eqfm_black_mountain.012.a: "Give them a square deal."
 eqfm_black_mountain.012.b: "Kotor belongs to the Empire."
 eqfm_black_mountain.013.t: "Negotiations Over Cattaro" # Outcome
 eqfm_black_mountain.013.d: "Pleased with their entrenchment as our [concept_overlord], the court at [SCOPE.sCountry('austria_scope').GetCapital.GetFarmHubName] has approved of our requests for proper access to the Adriatic."
 eqfm_black_mountain.013.f: "Kotor has been a home to the Montenegrins [GetCulture('serb').GetName]#yellow s#! since their arrival in the [GetStrategicRegion('region_balkans').GetName], yet have found itself ruled by foreign powers more often than not. This agreement finally seeks to write this historical wrong."
 eqfm_black_mountain.013.a: "Kotor will finally come home."
 eqfm_black_mountain.013.b: "This is a travesty."
 eqfm_black_mountain.014.t: "The Gaols of Cetinje"
 eqfm_black_mountain.014.d: "Our captives of the Border Conflict languish in our prisons. Their fates rest of the whims of the [ROOT.GetCountry.GetRuler.GetName]."
 eqfm_black_mountain.014.f: "While hardly members of the Sultan's household, these captives may still serve a political purpose."
 eqfm_black_mountain.014.a: "Let us see what price [SCOPE.sCharacter('eqfm_captive_scope_1').GetFullName] commands."
 eqfm_black_mountain.014.a.tt: "[SCOPE.sCharacter('eqfm_captive_scope_1').GetFullName] will be offered for ransom"
 eqfm_black_mountain.014.b: "[SCOPE.sCharacter('eqfm_captive_scope_2').GetFullName] looks like he'll fetch a decent ransom"
 eqfm_black_mountain.014.b.tt: "[SCOPE.sCharacter('eqfm_captive_scope_2').GetFullName] will be offered for ransom"
 eqfm_black_mountain.014.c: "Bottom of the barrel it is. Send [SCOPE.sCharacter('eqfm_captive_scope_3').GetFullName]."
 eqfm_black_mountain.014.c.tt: "[SCOPE.sCharacter('eqfm_captive_scope_3').GetFullName] will be offered for ransom"
 eqfm_black_mountain.014.e: "Leave them be."
 eqfm_black_mountain.015.t: "Montenegro Offers Ransom"
 eqfm_black_mountain.015.d: "An "ambassador" from [SCOPE.sCountry('montenegro_scope').GetName] was granted an audience with the Sultan this morning. They have offered a ransom for a local noble held captive in Cetinje."
 eqfm_black_mountain.015.f: "While the captivity of any subjects of the Sultan is an embarrassment, the acceptance of such a bargain may cause worse damage to our reputation."
 eqfm_black_mountain.015.a: "\"Name your price.\""
 eqfm_black_mountain.015.b: "\"Unacceptable. Begone!\""
 eqfm_black_mountain.016.t: "The $turkfm_porte$ Replies to Ransom"
 eqfm_black_mountain.016.d1: "A few days ago, word reached the court in [ROOT.GetCountry.GetCapital.GetFarmHubName] that the $turkfm_porte$ had assented to our demand for ransom. Today, an armed guard has presented its at the palace to reclaim [SCOPE.sCharacter('eqfm_ransom_target_scope').GetFullName]."
 eqfm_black_mountain.016.d2: "In a blunt missive, the $turkfm_porte$ has rejected any demands for ransom. Whatever value remains with [SCOPE.sCharacter('eqfm_ransom_target_scope').GetFullName] is for the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 eqfm_black_mountain.016.f: "\"A hundred times I've cursed that hour last year\n when the Turks failed, or didn't want, to kill me;\nmy people's hopes I would not betray now.\" -Bishop Danilo, on being ransomed, excerpt from 'The Mountain Wreath'"
 eqfm_black_mountain.016.a: "Very well send him on his way."
 eqfm_black_mountain.016.a.tt: "[SCOPE.sCharacter('eqfm_ransom_target_scope').GetFullName] will be released from imprisonment."
 eqfm_black_mountain.016.b: "Then he shall languish in the pits."
 eqfm_black_mountain.016.b.tt: "[SCOPE.sCharacter('eqfm_ransom_target_scope').GetFullName] will return to the gaols"
 eqfm_black_mountain.016.c: "Let us send a message. Bring me his head!"

 eqfm_black_mountain.020.t: "Marauding in the Hinterlands"
 eqfm_black_mountain.020.d: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has convened a meeting of prominent tribal heads to designate one to organize our tribal efforts."
 eqfm_black_mountain.020.f: "Raiding has long been a source of stable income for both the tribes and the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Without a leader to centralize efforts, there is little to ensure a fair distribution of income."
 eqfm_black_mountain.020.a: "[SCOPE.sCharacter('expedition_leader_1').GetFullName] is a trusted leader."
 eqfm_black_mountain.020.b: "We shall call on the experience of [SCOPE.sCharacter('expedition_leader_2').GetFullName]"
 eqfm_black_mountain.020.c: "Let [SCOPE.sCharacter('expedition_leader_3').GetFullName] a chance to prove his name."
 eqfm_black_mountain.020.e: "[SCOPE.sCharacter('expedition_leader_4').GetFullName] is an excellent compromise."
 eqfm_black_mountain.021.t: "Defending the Hinterlands"
 eqfm_black_mountain.021.d: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has charged the governor of [GetStateRegion('STATE_MONTENEGRO').GetName] with securing the border from the persistent [concept_raiding] by [SCOPE.sCountry('montenegro_scope').GetAdjectiveNoFlag] tribal folk."
 eqfm_black_mountain.021.f: "\"Our struggle won't come to an end until\n we or the Turks are exterminated.\" -excerpt from 'The Mountain Wreath'"
 eqfm_black_mountain.021.a: "[SCOPE.sCharacter('expedition_leader_1').GetFullName] has the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s trust."
 eqfm_black_mountain.021.b: "Send the veteran [SCOPE.sCharacter('expedition_leader_2').GetFullName]"
 eqfm_black_mountain.021.c: "[SCOPE.sCharacter('expedition_leader_3').GetFullName] seems quite eager."
 eqfm_black_mountain.021.e: "[SCOPE.sCharacter('expedition_leader_4').GetFullName] is a safe bet."
 eqfm_black_mountain.022.t: "Expeditionary Force Arrives at the Border"
 eqfm_black_mountain.022.d: "[SCOPE.sCharacter('eqfm_black_mountain_tur_leader').GetFullName] has arrived on the fringes of [GetStateRegion('STATE_MONTENEGRO').GetName]. His latest report indicates that he has mustered his forces for the $eqfm_karadag_expedition$ and will be marching out shortly."
 eqfm_black_mountain.022.f: "The remoteness of the Black Mountain has proved daunting to all prior attempts to enforce the will of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Perhaps this time will be different."
 eqfm_black_mountain.022.a: "May he bring justice to these barbarians."
 eqfm_black_mountain.023.t: "Expeditionary Force Withdraws from the Hinterlands"
 eqfm_black_mountain.023.d: "[SCOPE.sCharacter('eqfm_black_mountain_tur_leader').GetFullName] has arrived in a Turkish controlled fortress outside of [GetStateRegion('STATE_MONTENEGRO').GetName] with his forces looking ever worse for wear. His report indicates that his position in the mountains had become untenable due to a lack of supplies."
 eqfm_black_mountain.023.f: "While embarrassing, the expedition's retreat into friendly territory underscores the remoteness of the Black Mountain."
 eqfm_black_mountain.023.a: "We'll be back."
 eqfm_black_mountain.024.t1: "Tribal Leader Has Died!"
 eqfm_black_mountain.024.t2: "Expeditionary Force Leader Has Died!"
 eqfm_black_mountain.024.d: "Our leader on at the border of [GetStateRegion('STATE_MONTENEGRO').GetName] has died. Our forces have withdrawn from the border to await further direction."
 eqfm_black_mountain.024.f: "\"I am a leaf on the wind...\""
 eqfm_black_mountain.024.a: "Very inconvenient."
 eqfm_black_mountain.026.t: "Border Incursion Repelled"
 eqfm_black_mountain.026.d: "Our forces have repelled the Turkish incursion into our lands. Locals have wasted little time in resuming their [concept_raiding] activities."
 eqfm_black_mountain.026.f: "\"And stay out!\""
 eqfm_black_mountain.026.a: "These lands are ours!"
 eqfm_black_mountain.027.t: "Village Skirmish Escalates"
 eqfm_black_mountain.027.d: "Urgent news has arrived of an escalating conflict at a village along the border. Local militias have begun dug in for several days and have sent urgent calls for aid. Our advisors have warned of threats to the local population."
 eqfm_black_mountain.027.f: "Given the remoteness of the mountains and the poor state of the roads, its surprising they held out at all. There's no guarantee any aid will arrive in time, but the tribes will remember our decision."
 eqfm_black_mountain.027.a: "Give no ground!"
 eqfm_black_mountain.028.t: "Skirmish Fizzles Out"
 eqfm_black_mountain.028.d: "Following weeks of indecisive skirmishes, both leaders have quietly withdrawn their parties from the $eqfm_tribal_skirmish$, each fearing for the increasing disarray of their forces."
 eqfm_black_mountain.028.f: "\"You killed him?! But I wanted to kill him!\""
 eqfm_black_mountain.028.a: "We cannot let our guard down."
 eqfm_black_mountain.029.t: "#dummy Village Skirmish Monitor#!"
 eqfm_black_mountain.029.d: "#dummy eqfm_black_mountain.029.d#!"
 eqfm_black_mountain.029.f: "#dummy eqfm_black_mountain.029.f#!"
 eqfm_black_mountain.029.a: "#dummy eqfm_black_mountain.029.a#!"

 eqfm_black_mountain.030.t: "Tax Evasion"
 eqfm_black_mountain.030.t2: "Yoshi Commits Tax Fraud"
 eqfm_black_mountain.030.d: "What few taxes the tribes bother to send to [ROOT.GetCountry.GetCapital.GetFarmHubName] are effectively symbolic, amounting to a few wagons of grains or meats. However, a particularly isolated tribe has once again rebuked the authority of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] by killing a tax collector and returning his severed head to the palace."
 eqfm_black_mountain.030.d2: "Infamous libertarian and anti-government activist Yoshi has declared that Taxation is Theft and refused to pay his taxes. Why anyone cares is beyond me, given that he is a dinosaur and doesn't have a job."
 eqfm_black_mountain.030.f: "\"Look, we've sent exactly a bushel of wheat and five cured meats for the last five generations. No, no- I don't care that he just adopted a dog, he gets exactly that."\n\n"Wait, on second thought... if the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] is so hungry, he can just have #bold #red you#!#!.\""
 eqfm_black_mountain.030.f2: "Remember kids, Yoshi never paid his taxes and got pinched by the feds in the end. Now imagine what Danilo would do given the situation."
 eqfm_black_mountain.030.a: "Perhaps we should delay our impositions on the tribes."
 eqfm_black_mountain.030.a2: "Throw Yoshi in Jail."
 eqfm_black_mountain.030.b: "We cannot tolerate this insult to our authority."
 eqfm_black_mountain.030.b2: "Let Yoshi Go Free."
 eqfm_black_mountain.031.t: "[SCOPE.sCountry('turkfm_hostage_nation').GetAdjective] Nobleman Held Captive" # for MON
 eqfm_black_mountain.031.d: "A tribal band has seized a [SCOPE.sCountry('turkfm_hostage_nation').GetAdjectiveNoFlag] family on holiday and has held them for ransom. With little direct influence over the tribes, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must react diplomatically."
 eqfm_black_mountain.031.f: "\"That coat must be worth a pretty penny. How about we find out what that [SCOPE.sCountry('turkfm_hostage_nation').GetAdjectiveNoFormatting] head of yours is worth?\""
 eqfm_black_mountain.031.a: "\"#italic Sigh#!, how much do you want this time?\""
 eqfm_black_mountain.031.b: "\"Hostage? What hostage?\""
 eqfm_black_mountain.031.c: "\"We are the law.\""
 eqfm_black_mountain.031.e: "\"[SCOPE.sCharacter('eqfm_black_mountain_mon_leader').GetFirstName], bring me their heads.\""
 eqfm_black_mountain.032.t: "Nobleman Held Captive Abroad" # for Recipient
 eqfm_black_mountain.032.d1: "A noble family of [ROOT.GetCountry.GetAdjectiveNoFlag] was abducted while travelling through the countryside of [SCOPE.sCountry('montenegro_scope').GetName]. Thanks to the quick intervention of the [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle], the family have been released and treated to a warm visit at the [SCOPE.sCountry('montenegro_scope').GetAdjectiveNoFormatting] court with guarantees of safe passage home."
 eqfm_black_mountain.032.d2: "A noble family of [ROOT.GetCountry.GetAdjectiveNoFlag] was abducted while travelling through the countryside of [SCOPE.sCountry('montenegro_scope').GetName]. The [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle], has neglected to respond in any meaningful way. The family has now vanished without a trace."
 eqfm_black_mountain.032.f: "The Montenegrin frontier is as dangerous as it is beautiful, and many have found themselves as literally captive to the place and as to its beauty."
 eqfm_black_mountain.032.a: "Excellent News."
 eqfm_black_mountain.032.b: "This is a travesty."
 eqfm_black_mountain.033.t: "Landslide Across the Border"
 eqfm_black_mountain.033.d: "Harsh rainfall across [GetStateRegion('STATE_MONTENEGRO').GetName] has triggered mudslides that have hampered travel between villages. Dire news has arrived of a major landslide within a village across the border within [SCOPE.sState('ottoman_montenegro_state_scope').GetName]. Our subjects have begun crossing the porous border to aid distant relatives."
 eqfm_black_mountain.033.f: "\"But the border guards will shoot us!"\n"The border guard be damned, those are my cousins trapped over there!\""
 eqfm_black_mountain.033.a: "These are matters for the tribes."
 eqfm_black_mountain.033.b: "The state will join in these efforts."
 eqfm_black_mountain.033.c: "We cannot afford so open a border."
 eqfm_black_mountain.034.t: "Raiding Party Ambushed"

 eqfm_black_mountain.040.t: "Local Informants"
 eqfm_black_mountain.040.d: "Our $eqfm_karadag_expedition$ was approached by several members of a border village that seems quite eager to share information regarding raiding party movements. This has been dutifully passed along to General [SCOPE.sCharacter('eqfm_black_mountain_tur_leader').GetLastName]"
 eqfm_black_mountain.040.f: "\"Yeah, that guy right over there. He killed my brother and dishonored my uncle.\"\n\"No, it has nothing to do with five of his sheep disappearing two years ago and his sister being with child.\""
 eqfm_black_mountain.040.a: "We will put this to good use."
 eqfm_black_mountain.040.b: "Perhaps we could \"persuade\" them to share a little more..."
 eqfm_black_mountain.041.t: "Bear Sighted"
 eqfm_black_mountain.041.d: "Scouts notified General [SCOPE.sCharacter('eqfm_black_mountain_tur_leader').GetLastName] that a bear was sighted tracking near to our forces. Some men have expressed eagerness at the potential for a hunt."
 eqfm_black_mountain.041.f: "\"Stop faffing about!"\n"But sir, meat stew!\""
 eqfm_black_mountain.041.a: "Leave it be."
 eqfm_black_mountain.041.b: "Let the men get some exercise."
 eqfm_black_mountain.042.t: "Spoiled Rations"
 eqfm_black_mountain.042.d: "General [SCOPE.sCharacter('eqfm_black_mountain_tur_leader').GetLastName] was awoken to the terrible news that a large portion of rations was not properly stored and has spoiled as a result. The negligent solider has been dealt with, but that has done little to alleviate the loss of valuable foodstuffs."
 eqfm_black_mountain.042.f: "\"We ain’t had nothin’ but maggoty bread for three stinking days!\""
 eqfm_black_mountain.042.a: "We will have to tighten our rations further."
 eqfm_black_mountain.042.b: "Request a resupply from the nearest garrison."
 eqfm_black_mountain.043.t: "Logistics Train Raided"
 eqfm_black_mountain.043.d: "Montenegrin raiding parties ambushed and burned several wagons with supplies destined for the $eqfm_karadag_expedition$. This will likely hamper their efforts."
 eqfm_black_mountain.043.f: "\"We do not do that to each other. We're ravagers. We got a code. -Yeah, and that code is steal from everybody.\""
 eqfm_black_mountain.043.a: "Godless barbarians!"
 eqfm_black_mountain.043.b: "Send for resupply from the capital."
 eqfm_black_mountain.044.t: "A Circular Expedition"
 eqfm_black_mountain.044.d: "The $eqfm_karadag_expedition$ has become disoriented while attempting to navigate the mountain paths in [GetStateRegion('STATE_MONTENEGRO').GetName]. After passing what seems like the same hills for the tenth time, it has dawned on them that they are utterly lost."
 eqfm_black_mountain.044.f: "Countless roads cross the mountains with many known only to the locals."
 eqfm_black_mountain.044.a: "This is going nowhere."
 eqfm_black_mountain.044.b: "\"Hey guys, maybe its this way.\""
 eqfm_black_mountain.045.t: "Successful Scouting"
 eqfm_black_mountain.045.d: "Forward scouts of the $eqfm_karadag_expedition$ have made significant progress tracking the movement of Montenegrin raiding parties."
 eqfm_black_mountain.045.f: "\"My men have eyes on them, captain! This way!\""
 eqfm_black_mountain.045.a: "Excellent work."
 eqfm_black_mountain.045.b: "Push them a little further."
 eqfm_black_mountain.046.t: "Balkan Hospitality"
 eqfm_black_mountain.046.d: "While passing near a village, scout from our $eqfm_karadag_expedition$ were invited to break bread with the locals. Aside from good-will towards our mission of securing peace in the region, the villagers have sent want few supplies they can spare."
 eqfm_black_mountain.046.f: "While the harshness of [GetStateRegion('STATE_MONTENEGRO').GetName] precludes intense agriculture, that same harshness has fostered a strong tradition of hospitality amongst its inhabitants."
 eqfm_black_mountain.046.a: "Let us be on our way."
 eqfm_black_mountain.046.b: "I'm sure they can offer a "little" more."

 eqfm_black_mountain.050.t: "Steady Grind"
 eqfm_black_mountain.050.d: "Skirmishing continues in [GetStateRegion('STATE_MONTENEGRO').GetName] with little progress made by either side. As minor casualties mount, there is no end in sight to the fighting."
 eqfm_black_mountain.050.f: "\"Keep digging! We'll need these emplacements ready before nightfall.\""
 eqfm_black_mountain.050.a: "Keep at it!"
 eqfm_black_mountain.051.t: "Village Outskirts Burned"
 eqfm_black_mountain.051.d: "An attempted flanking maneuver has turned into a disorganized melee at the village outskirts. In the confused fighting, several homes have been set ablaze and their residents displaced."
 eqfm_black_mountain.051.f: "\"I don't care who or what lives in there. Smoke them out!\""
 eqfm_black_mountain.051.a: "We can't give up now."
 eqfm_black_mountain.052.t: "Village Families Massacred"
 eqfm_black_mountain.052.d: "\"Concerning news has trickled in to border outposts in [GetStateRegion('STATE_MONTENEGRO').GetName]: militiamen nominally operating under our control have ransacked several non-[ROOT.GetCountry.GetStateReligion.GetName] houses with great human cost.\""
 eqfm_black_mountain.052.f: "Exercising military command is already complicated by the ruggedness of the mountain terrain. This, combined with traditional violence, has served as the perfect recipe for atrocity."
 eqfm_black_mountain.052.a: "Put a stop to this madness."
 eqfm_black_mountain.052.b: "This is no concern of ours. "
 eqfm_black_mountain.053.t: "Bora Disrupts Operations"
 eqfm_black_mountain.053.d: "A powerful windstorm has swept down from the mountains. While the Ottomans have been forced to seek shelter, the Montenegrins have consolidated their control over the village."
 eqfm_black_mountain.053.f: "\"Quickly braves! The storm has the Turks on poor footing!\""
 eqfm_black_mountain.053.a: "This will certainly muddy things up."
 eqfm_black_mountain.055.t: "Pitched Battle"
 eqfm_black_mountain.055.d: "A chance encounter between a Montenegrin scouting party and an Ottoman patrol devolved into prolonged fighting as both leaders elected to reinforce their positions."
 eqfm_black_mountain.055.f: "Despite their flexibility and familiarity with the terrain, the Montenegrins struggle to inflict sizeable damage to organized formations."
 eqfm_black_mountain.055.a: "Our men will not be cowed."
 eqfm_black_mountain.055.b: "These tribal forces are no threat to us."
 eqfm_black_mountain.056.t: "Sudden Breakthrough"
 eqfm_black_mountain.056.d: "A surprisingly organized push by [SCOPE.sCharacter('eqfm_black_mountain_tur_leader').GetFullName] have broken through our defenses near the village center and laid claim to several key buildings."
 eqfm_black_mountain.056.f: "\"Onward! For the Sultan!\""
 eqfm_black_mountain.056.a: "Our braves will never fail!"
 eqfm_black_mountain.056.b: "Let them taste the sword."
 eqfm_black_mountain.058.t: "Ottoman Commander Captured"
 eqfm_black_mountain.058.d: "The $eqfm_tribal_skirmish$ has ended in a resounding victory for [SCOPE.sCharacter('eqfm_black_mountain_mon_leader').GetFullName]. The Ottoman $eqfm_karadag_expedition$ has been routed and [SCOPE.sCharacter('eqfm_black_mountain_tur_leader').GetFullName] has been taken prisoner."
 eqfm_black_mountain.058.f: "With so little to leverage against the Ottomans, the capture of politically sensitive hostages has emerged as one of the pre-eminent tools of Montenegrin diplomacy."
 eqfm_black_mountain.058.a: "Lock him up in the palace."
 eqfm_black_mountain.058.b: "Turn him loose."
 eqfm_black_mountain.058.c: "We take no prisoners."
 eqfm_black_mountain.058.e: "What a shameful display."
 eqfm_black_mountain.058.g: "At least someone made it home."
 eqfm_black_mountain.059.t: "Montenegrin Leader Killed"
 eqfm_black_mountain.059.d: "[ROOT.GetCapital.GetFarmHubName] has been the site of mass mourning as the distressing news as arrived of the death of a famed warrior in the [ROOT.GetCountry.GetAdjectiveNoFlag] highlands."
 eqfm_black_mountain.059.f: "\"Oh my bird, oh my dear grey falcon,\nHow do you feel with your wing torn out?\nI am feeling with my wing torn out\nLike a brother one without the other.\""
 eqfm_black_mountain.059.a: "We will sing songs to his glory!"
 eqfm_black_mountain.059.b: "Justice well served!"