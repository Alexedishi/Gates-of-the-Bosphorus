l_english:
 eqfm_karadag.001.t: "The Lands of Montenegro"
 eqfm_karadag.001.d: "With both resolute leadership and the fierce spirit of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people, [ROOT.GetCountry.GetRuler.GetFullNameWithTitle] has brought the entirety of [GetStateRegion('STATE_MONTENEGRO').GetName] under the control of [ROOT.GetCountry.GetName]."
 eqfm_karadag.001.f: "Despite centuries of invasions and imperialist designs, Montenegro stands as resolute as its people."
 eqfm_karadag.001.a: ""
 eqfm_karadag.001.b: ""
 eqfm_karadag.002.t: "The Black Mountain Subdued"
 eqfm_karadag.002.d: "Despite centuries of resisting invasions and imperialist designs, [GetStateRegion('STATE_MONTENEGRO').GetName] has finally been brought to heel."
 eqfm_karadag.002.f: "#italic What is all this, Montenegrin brothers? \nWho has fanned this ugly flame of discord? \nFrom where did come this unfortunate thought \nof conversing about changing our faith? \nAren't we brothers despite differences? \nDidn't we fight the same battles together? \nWe share the good and the bad like brothers. \nDoesn't both Turkish and Serbian maidens' hair \ncover in grief the graves of slain heroes?#! \n\n–Petar II Petrović-Njegoš, #italic The Mountain Wreath#!"
 eqfm_karadag.002.a: "The Black Mountain has been humbled."
 eqfm_karadag.002.b: ""
 eqfm_karadag.003.t: "The Black Mountain Usurped!"
 eqfm_karadag.003.d: ""
 eqfm_karadag.003.f: "\"From today on, nobody needs to go to the emperor in Constantinople any longer. Here in Mostar is your Constantinople, and here in Mostar is your emperor.\"  -Ali Pasha Rizvanbegović, 1833"
 eqfm_karadag.003.a: ""
 eqfm_karadag.003.b: ""
 eqfm_karadag.004.t: "The Black Mountain Lost"
 eqfm_karadag.004.d: ""
 eqfm_karadag.004.f: "Time and time again, the European powers have renewed their support of Montenegro in the hopes of gaining a foothold in the Balkans only to withdraw their support whenever a new border conflict threaten to escalate into open warfare."
 eqfm_karadag.004.a: ""

 eqfm_karadag.010.t: "Negotiations on Head-taking" # Recipient
 eqfm_karadag.010.d: "An envoy sent by the [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle] of [SCOPE.sCountry('montenegro_scope').GetName] was hosted at the court in Constantinople today. Among the details discussed was a proposition to ban the practice of Head-taking in the among the tribes of [GetStateRegion('STATE_MONTENEGRO').GetName]."
 eqfm_karadag.010.f: "The lack of development and infrastructure across Montenegro has permitted the continuation of several traditions including that of head-taking. These grizzly displays have drawn both shock and scorn from the West."
 eqfm_karadag.010.a: "This is a ridiculous request. Off with his head!"
 eqfm_karadag.010.b: "These practices are barbaric. We should heed the sentiments of the West."
 eqfm_karadag.011.t: "Negotiations on Head-taking" # Outcome
 eqfm_karadag.011.d1: "Almost as expected, [SCOPE.sCountry('eqfm_headtaking_recipient_scope').GetNameNoFlag] has rejected our offer to clamp down on the practice of head-taking."
 eqfm_karadag.011.d2: "Against all odds, our envoys have brokered a deal that will see the practice of head-taking curtailed across [GetStateRegion('STATE_MONTENEGRO').GetName]. All that remains is to inform the tribal heads."
 eqfm_karadag.011.f: "While negotiations to abandon the practice of head-taking have occurred in the past, each and ever time they have been hampered by the fear that one side would renege on their side of the bargain."
 eqfm_karadag.011.a: "If they will not negotiate, then neither shall we."
 eqfm_karadag.011.b: "The [SCOPE.sCountry('eqfm_headtaking_recipient_scope').GetRuler.GetPrimaryRoleTitle] has no honor. We should display ours."
 eqfm_karadag.011.c: "Excellent news."
 eqfm_karadag.012.t: "Negotiations Over Cattaro" # Recipient
 eqfm_karadag.012.d: "An envoy from [SCOPE.sCountry('montenegro_scope').GetName] presented himself in the [ROOT.GetCountry.GetAdjective] court to negotiate for the return of Kotor to the Montenegrin people."
 eqfm_karadag.012.f: "Kotor has been a home to the Montenegrins [GetCulture('serb').GetName]#yellow s#! since their arrival in the [GetStrategicRegion('region_balkans').GetName], yet have found itself ruled by foreign powers more often than not. This agreement finally seeks to write this historical wrong."
 eqfm_karadag.012.a: "Give them a square deal."
 eqfm_karadag.012.b: "Kotor belongs to the Empire."
 eqfm_karadag.013.t: "Negotiations Over Cattaro" # Outcome
 eqfm_karadag.013.d: "Pleased with their entrenchment as our [concept_overlord], the court at [SCOPE.sCountry('austria_scope').GetCapital.GetFarmHubName] has approved of our requests for proper access to the Adriatic."
 eqfm_karadag.013.f: "Kotor has been a home to the Montenegrins [GetCulture('serb').GetName]#yellow s#! since their arrival in the [GetStrategicRegion('region_balkans').GetName], yet have found itself ruled by foreign powers more often than not. This agreement finally seeks to write this historical wrong."
 eqfm_karadag.013.a: "Kotor will finally come home."
 eqfm_karadag.013.b: "This is a travesty."
 eqfm_karadag.014.t: "The Gaols of Cetinje"
 eqfm_karadag.014.d: "Our captives of the Border Conflict languish in our prisons. Their fates rest of the whims of the [ROOT.GetCountry.GetRuler.GetName]."
 eqfm_karadag.014.f: "While hardly members of the Sultan's household, these captives may still serve a political purpose."
 eqfm_karadag.014.a: "Let us see what price [SCOPE.sCharacter('eqfm_captive_scope_1').GetFullName] commands."
 eqfm_karadag.014.a.tt: "[SCOPE.sCharacter('eqfm_captive_scope_1').GetFullName] will be offered for ransom"
 eqfm_karadag.014.b: "[SCOPE.sCharacter('eqfm_captive_scope_2').GetFullName] looks like he'll fetch a decent ransom"
 eqfm_karadag.014.b.tt: "[SCOPE.sCharacter('eqfm_captive_scope_2').GetFullName] will be offered for ransom"
 eqfm_karadag.014.c: "Bottom of the barrel it is. Send [SCOPE.sCharacter('eqfm_captive_scope_3').GetFullName]."
 eqfm_karadag.014.c.tt: "[SCOPE.sCharacter('eqfm_captive_scope_3').GetFullName] will be offered for ransom"
 eqfm_karadag.014.e: "Leave them be."
 eqfm_karadag.015.t: "Montenegro Offers Ransom"
 eqfm_karadag.015.d: "An "ambassador" from [SCOPE.sCountry('montenegro_scope').GetName] was granted an audience with the Sultan this morning. They have offered a ransom for a local noble held captive in Cetinje."
 eqfm_karadag.015.f: "While the captivity of any subjects of the Sultan is an embarrassment, the acceptance of such a bargain may cause worse damage to our reputation."
 eqfm_karadag.015.a: "\"Name your price.\""
 eqfm_karadag.015.b: "\"Unacceptable. Begone!\""
 eqfm_karadag.016.t: "The $turkfm_porte$ Replies to Ransom"
 eqfm_karadag.016.d1: "A few days ago, word reached the court in [ROOT.GetCountry.GetCapital.GetFarmHubName] that the $turkfm_porte$ had assented to our demand for ransom. Today, an armed guard has presented its at the palace to reclaim [SCOPE.sCharacter('eqfm_ransom_target_scope').GetFullName]."
 eqfm_karadag.016.d2: "In a blunt missive, the $turkfm_porte$ has rejected any demands for ransom. Whatever value remains with [SCOPE.sCharacter('eqfm_ransom_target_scope').GetFullName] is for the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 eqfm_karadag.016.f: "\"A hundred times I've cursed that hour last year\n when the Turks failed, or didn't want, to kill me;\nmy people's hopes I would not betray now.\" —Bishop Danilo, on being ransomed, excerpt from 'The Mountain Wreath'"
 eqfm_karadag.016.a: "Very well send him on his way."
 eqfm_karadag.016.a.tt: "[SCOPE.sCharacter('eqfm_ransom_target_scope').GetFullName] will be released from imprisonment."
 eqfm_karadag.016.b: "Then he shall languish in the pits."
 eqfm_karadag.016.b.tt: "[SCOPE.sCharacter('eqfm_ransom_target_scope').GetFullName] will return to the gaols"
 eqfm_karadag.016.c: "Let us send a message. Bring me his head!"

 eqfm_karadag.020.t: "Marauding in the Hinterlands"
 eqfm_karadag.020.d: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has convened a meeting of prominent tribal heads to designate one to organize our tribal efforts."
 eqfm_karadag.020.f: "Raiding has long been a source of stable income for both the tribes and the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Without a leader to centralize efforts, there is little to ensure a fair distribution of income."
 eqfm_karadag.020.a: "[SCOPE.sCharacter('expedition_leader_1').GetFullName] is a trusted leader."
 eqfm_karadag.020.b: "We shall call on the experience of [SCOPE.sCharacter('expedition_leader_2').GetFullName]"
 eqfm_karadag.020.c: "Let [SCOPE.sCharacter('expedition_leader_3').GetFullName] a chance to prove his name."
 eqfm_karadag.020.e: "[SCOPE.sCharacter('expedition_leader_4').GetFullName] is an excellent compromise."
 eqfm_karadag.021.t: "Defending the Hinterlands"
 eqfm_karadag.021.d: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has charged the governor of [GetStateRegion('STATE_MONTENEGRO').GetName] with securing the border from the persistent [concept_raiding] by [SCOPE.sCountry('montenegro_scope').GetAdjectiveNoFlag] tribal folk."
 eqfm_karadag.021.f: "\"Our struggle won't come to an end until\n we or the Turks are exterminated.\" —excerpt from 'The Mountain Wreath'"
 eqfm_karadag.021.a: "[SCOPE.sCharacter('expedition_leader_1').GetFullName] has the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s trust."
 eqfm_karadag.021.b: "Send the veteran [SCOPE.sCharacter('expedition_leader_2').GetFullName]"
 eqfm_karadag.021.c: "[SCOPE.sCharacter('expedition_leader_3').GetFullName] seems quite eager."
 eqfm_karadag.021.e: "[SCOPE.sCharacter('expedition_leader_4').GetFullName] is a safe bet."
 eqfm_karadag.022.t: "Expeditionary Force Arrives at the Border"
 eqfm_karadag.022.d: "[SCOPE.sCharacter('eqfm_karadag_tur_leader').GetFullName] has arrived on the fringes of [GetStateRegion('STATE_MONTENEGRO').GetName]. His latest report indicates that he has mustered his forces for the $eqfm_karadag_expedition$ and will be marching out shortly."
 eqfm_karadag.022.f: "The remoteness of the Black Mountain has proved daunting to all prior attempts to enforce the will of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Perhaps this time will be different."
 eqfm_karadag.022.a: "May he bring justice to these barbarians."
 eqfm_karadag.023.t: "Expeditionary Force Withdraws from the Hinterlands"
 eqfm_karadag.023.d: "[SCOPE.sCharacter('eqfm_karadag_tur_leader').GetFullName] has arrived in a Turkish controlled fortress outside of [GetStateRegion('STATE_MONTENEGRO').GetName] with his forces looking ever worse for wear. His report indicates that his position in the mountains had become untenable due to a lack of supplies."
 eqfm_karadag.023.f: "While embarrassing, the expedition's retreat into friendly territory underscores the remoteness of the Black Mountain."
 eqfm_karadag.023.a: "We'll be back."
 eqfm_karadag.024.t1: "Tribal Leader Has Died!"
 eqfm_karadag.024.t2: "Expeditionary Force Leader Has Died!"
 eqfm_karadag.024.d: "Our leader on at the border of [GetStateRegion('STATE_MONTENEGRO').GetName] has died. Our forces have withdrawn from the border to await further direction."
 eqfm_karadag.024.f: "\"I am a leaf on the wind...\""
 eqfm_karadag.024.a: "Very inconvenient."
 eqfm_karadag.026.t: "Border Incursion Repelled"
 eqfm_karadag.026.d: "Our forces have repelled the Turkish incursion into our lands. Locals have wasted little time in resuming their [concept_raiding] activities."
 eqfm_karadag.026.f: "\"And stay out!\""
 eqfm_karadag.026.a: "These lands are ours!"
 eqfm_karadag.027.t: "Village Skirmish Escalates"
 eqfm_karadag.027.d: "Urgent news has arrived of an escalating conflict at a village along the border. Local militias have begun dug in for several days and have sent urgent calls for aid. Our advisors have warned of threats to the local population."
 eqfm_karadag.027.f: "Given the remoteness of the mountains and the poor state of the roads, its surprising they held out at all. There's no guarantee any aid will arrive in time, but the tribes will remember our decision."
 eqfm_karadag.027.a: "Give no ground!"
 eqfm_karadag.028.t: "Skirmish Fizzles Out"
 eqfm_karadag.028.d: "Following weeks of indecisive skirmishes, both leaders have quietly withdrawn their parties from the $eqfm_tribal_skirmish$, each fearing for the increasing disarray of their forces."
 eqfm_karadag.028.f: "\"You killed him?! But I wanted to kill him!\""
 eqfm_karadag.028.a: "We cannot let our guard down."
 eqfm_karadag.029.t: "#filler Village Skirmish Monitor#!"
 eqfm_karadag.029.d: "#filler eqfm_karadag.029.d#!"
 eqfm_karadag.029.f: "#filler eqfm_karadag.029.f#!"
 eqfm_karadag.029.a: "#filler eqfm_karadag.029.a#!"

 eqfm_karadag.030.t: "Tax Evasion"
 eqfm_karadag.030.t2: "Yoshi Commits Tax Fraud"
 eqfm_karadag.030.d: "What few taxes the tribes bother to send to [ROOT.GetCountry.GetCapital.GetFarmHubName] are effectively symbolic, amounting to a few wagons of grains or meats. However, a particularly isolated tribe has once again rebuked the authority of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] by killing a tax collector and returning his severed head to the palace."
 eqfm_karadag.030.d2: "Infamous libertarian and anti-government activist Yoshi has declared that Taxation is Theft and refused to pay his taxes. Why anyone cares is beyond me, given that he is a dinosaur and doesn't have a job."
 eqfm_karadag.030.f: "\"Look, we've sent exactly a bushel of wheat and five cured meats for the last five generations. No, no- I don't care that he just adopted a dog, he gets exactly that."\n\n"Wait, on second thought... if the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] is so hungry, he can just have #bold #red you#!#!.\""
 eqfm_karadag.030.f2: "Remember kids, Yoshi never paid his taxes and got pinched by the feds in the end. Now imagine what Danilo would do given the situation."
 eqfm_karadag.030.a: "Perhaps we should delay our impositions on the tribes."
 eqfm_karadag.030.a2: "Throw Yoshi in Jail."
 eqfm_karadag.030.b: "We cannot tolerate this insult to our authority."
 eqfm_karadag.030.b2: "Let Yoshi Go Free."
 eqfm_karadag.031.t: "[SCOPE.sCountry('turkfm_hostage_nation').GetAdjective] Nobleman Held Captive" # for MON
 eqfm_karadag.031.d: "A tribal band has seized a [SCOPE.sCountry('turkfm_hostage_nation').GetAdjectiveNoFlag] family on holiday and has held them for ransom. With little direct influence over the tribes, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must react diplomatically."
 eqfm_karadag.031.f: "\"That coat must be worth a pretty penny. How about we find out what that [SCOPE.sCountry('turkfm_hostage_nation').GetAdjectiveNoFormatting] head of yours is worth?\""
 eqfm_karadag.031.a: "\"#italic Sigh#!, how much do you want this time?\""
 eqfm_karadag.031.b: "\"Hostage? What hostage?\""
 eqfm_karadag.031.c: "\"We are the law.\""
 eqfm_karadag.031.e: "\"[SCOPE.sCharacter('eqfm_karadag_mon_leader').GetFirstName], bring me their heads.\""
 eqfm_karadag.032.t: "Nobleman Held Captive Abroad" # for Recipient
 eqfm_karadag.032.d1: "A noble family of [ROOT.GetCountry.GetAdjectiveNoFlag] was abducted while travelling through the countryside of [SCOPE.sCountry('montenegro_scope').GetName]. Thanks to the quick intervention of the [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle], the family have been released and treated to a warm visit at the [SCOPE.sCountry('montenegro_scope').GetAdjectiveNoFormatting] court with guarantees of safe passage home."
 eqfm_karadag.032.d2: "A noble family of [ROOT.GetCountry.GetAdjectiveNoFlag] was abducted while travelling through the countryside of [SCOPE.sCountry('montenegro_scope').GetName]. The [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle], has neglected to respond in any meaningful way. The family has now vanished without a trace."
 eqfm_karadag.032.f: "The Montenegrin frontier is as dangerous as it is beautiful, and many have found themselves as literally captive to the place and as to its beauty."
 eqfm_karadag.032.a: "Excellent News."
 eqfm_karadag.032.b: "This is a travesty."
 eqfm_karadag.033.t: "Landslide Across the Border"
 eqfm_karadag.033.d: "Harsh rainfall across [GetStateRegion('STATE_MONTENEGRO').GetName] has triggered mudslides that have hampered travel between villages. Dire news has arrived of a major landslide within a village across the border within [SCOPE.sState('ottoman_montenegro_state_scope').GetName]. Our subjects have begun crossing the porous border to aid distant relatives."
 eqfm_karadag.033.f: "\"But the border guards will shoot us!"\n"The border guard be damned, those are my cousins trapped over there!\""
 eqfm_karadag.033.a: "These are matters for the tribes."
 eqfm_karadag.033.b: "The state will join in these efforts."
 eqfm_karadag.033.c: "We cannot afford so open a border."
 eqfm_karadag.034.t: "Raiding Party Ambushed"

 eqfm_karadag.040.t: "Local Informants"
 eqfm_karadag.040.d: "Our $eqfm_karadag_expedition$ was approached by several members of a border village that seems quite eager to share information regarding raiding party movements. This has been dutifully passed along to General [SCOPE.sCharacter('eqfm_karadag_tur_leader').GetLastName]"
 eqfm_karadag.040.f: "\"Yeah, that guy right over there. He killed my brother and dishonored my uncle.\"\n\"No, it has nothing to do with five of his sheep disappearing two years ago and his sister being with child.\""
 eqfm_karadag.040.a: "We will put this to good use."
 eqfm_karadag.040.b: "Perhaps we could \"persuade\" them to share a little more..."
 eqfm_karadag.041.t: "Bear Sighted"
 eqfm_karadag.041.d: "Scouts notified General [SCOPE.sCharacter('eqfm_karadag_tur_leader').GetLastName] that a bear was sighted tracking near to our forces. Some men have expressed eagerness at the potential for a hunt."
 eqfm_karadag.041.f: "\"Stop faffing about!"\n"But sir, meat stew!\""
 eqfm_karadag.041.a: "Leave it be."
 eqfm_karadag.041.b: "Let the men get some exercise."
 eqfm_karadag.042.t: "Spoiled Rations"
 eqfm_karadag.042.d: "General [SCOPE.sCharacter('eqfm_karadag_tur_leader').GetLastName] was awoken to the terrible news that a large portion of rations was not properly stored and has spoiled as a result. The negligent solider has been dealt with, but that has done little to alleviate the loss of valuable foodstuffs."
 eqfm_karadag.042.f: "\"We ain’t had nothin’ but maggoty bread for three stinking days!\""
 eqfm_karadag.042.a: "We will have to tighten our rations further."
 eqfm_karadag.042.b: "Request a resupply from the nearest garrison."
 eqfm_karadag.043.t: "Logistics Train Raided"
 eqfm_karadag.043.d: "Montenegrin raiding parties ambushed and burned several wagons with supplies destined for the $eqfm_karadag_expedition$. This will likely hamper their efforts."
 eqfm_karadag.043.f: "\"We do not do that to each other. We're ravagers. We got a code. -Yeah, and that code is steal from everybody.\""
 eqfm_karadag.043.a: "Godless barbarians!"
 eqfm_karadag.043.b: "Send for resupply from the capital."
 eqfm_karadag.044.t: "A Circular Expedition"
 eqfm_karadag.044.d: "The $eqfm_karadag_expedition$ has become disoriented while attempting to navigate the mountain paths in [GetStateRegion('STATE_MONTENEGRO').GetName]. After passing what seems like the same hills for the tenth time, it has dawned on them that they are utterly lost."
 eqfm_karadag.044.f: "Countless roads cross the mountains with many known only to the locals."
 eqfm_karadag.044.a: "This is going nowhere."
 eqfm_karadag.044.b: "\"Hey guys, maybe its this way.\""
 eqfm_karadag.045.t: "Successful Scouting"
 eqfm_karadag.045.d: "Forward scouts of the $eqfm_karadag_expedition$ have made significant progress tracking the movement of Montenegrin raiding parties."
 eqfm_karadag.045.f: "\"My men have eyes on them, captain! This way!\""
 eqfm_karadag.045.a: "Excellent work."
 eqfm_karadag.045.b: "Push them a little further."
 eqfm_karadag.046.t: "Balkan Hospitality"
 eqfm_karadag.046.d: "While passing near a village, scout from our $eqfm_karadag_expedition$ were invited to break bread with the locals. Aside from good-will towards our mission of securing peace in the region, the villagers have sent want few supplies they can spare."
 eqfm_karadag.046.f: "While the harshness of [GetStateRegion('STATE_MONTENEGRO').GetName] precludes intense agriculture, that same harshness has fostered a strong tradition of hospitality amongst its inhabitants."
 eqfm_karadag.046.a: "Let us be on our way."
 eqfm_karadag.046.b: "I'm sure they can offer a "little" more."

 eqfm_karadag.050.t: "Steady Grind"
 eqfm_karadag.050.d: "Skirmishing continues in [GetStateRegion('STATE_MONTENEGRO').GetName] with little progress made by either side. As minor casualties mount, there is no end in sight to the fighting."
 eqfm_karadag.050.f: "\"Keep digging! We'll need these emplacements ready before nightfall.\""
 eqfm_karadag.050.a: "Keep at it!"
 eqfm_karadag.051.t: "Village Outskirts Burned"
 eqfm_karadag.051.d: "An attempted flanking maneuver has turned into a disorganized melee at the village outskirts. In the confused fighting, several homes have been set ablaze and their residents displaced."
 eqfm_karadag.051.f: "\"I don't care who or what lives in there. Smoke them out!\""
 eqfm_karadag.051.a: "We can't give up now."
 eqfm_karadag.052.t: "Village Families Massacred"
 eqfm_karadag.052.d: "\"Concerning news has trickled in to border outposts in [GetStateRegion('STATE_MONTENEGRO').GetName]: militiamen nominally operating under our control have ransacked several non-[ROOT.GetCountry.GetStateReligion.GetName] houses with great human cost.\""
 eqfm_karadag.052.f: "Exercising military command is already complicated by the ruggedness of the mountain terrain. This, combined with traditional violence, has served as the perfect recipe for atrocity."
 eqfm_karadag.052.a: "Put a stop to this madness."
 eqfm_karadag.052.b: "This is no concern of ours. "
 eqfm_karadag.053.t: "Bora Disrupts Operations"
 eqfm_karadag.053.d: "A powerful windstorm has swept down from the mountains. While the Ottomans have been forced to seek shelter, the Montenegrins have consolidated their control over the village."
 eqfm_karadag.053.f: "\"Quickly braves! The storm has the Turks on poor footing!\""
 eqfm_karadag.053.a: "This will certainly muddy things up."
 eqfm_karadag.055.t: "Pitched Battle"
 eqfm_karadag.055.d: "A chance encounter between a Montenegrin scouting party and an Ottoman patrol devolved into prolonged fighting as both leaders elected to reinforce their positions."
 eqfm_karadag.055.f: "Despite their flexibility and familiarity with the terrain, the Montenegrins struggle to inflict sizeable damage to organized formations."
 eqfm_karadag.055.a: "Our men will not be cowed."
 eqfm_karadag.055.b: "These tribal forces are no threat to us."
 eqfm_karadag.056.t: "Sudden Breakthrough"
 eqfm_karadag.056.d: "A surprisingly organized push by [SCOPE.sCharacter('eqfm_karadag_tur_leader').GetFullName] have broken through our defenses near the village center and laid claim to several key buildings."
 eqfm_karadag.056.f: "\"Onward! For the Sultan!\""
 eqfm_karadag.056.a: "Our braves will never fail!"
 eqfm_karadag.056.b: "Let them taste the sword."
 eqfm_karadag.058.t: "Ottoman Commander Captured"
 eqfm_karadag.058.d: "The $eqfm_tribal_skirmish$ has ended in a resounding victory for [SCOPE.sCharacter('eqfm_karadag_mon_leader').GetFullName]. The Ottoman $eqfm_karadag_expedition$ has been routed and [SCOPE.sCharacter('eqfm_karadag_tur_leader').GetFullName] has been taken prisoner."
 eqfm_karadag.058.f: "With so little to leverage against the Ottomans, the capture of politically sensitive hostages has emerged as one of the pre-eminent tools of Montenegrin diplomacy."
 eqfm_karadag.058.a: "Lock him up in the palace."
 eqfm_karadag.058.b: "Turn him loose."
 eqfm_karadag.058.c: "We take no prisoners."
 eqfm_karadag.058.e: "What a shameful display."
 eqfm_karadag.058.g: "At least someone made it home."
 eqfm_karadag.059.t: "Montenegrin Leader Killed"
 eqfm_karadag.059.d: "[ROOT.GetCapital.GetFarmHubName] has been the site of mass mourning as the distressing news as arrived of the death of a famed warrior in the [ROOT.GetCountry.GetAdjectiveNoFlag] highlands."
 eqfm_karadag.059.f: "\"Oh my bird, oh my dear grey falcon,\nHow do you feel with your wing torn out?\nI am feeling with my wing torn out\nLike a brother one without the other.\""
 eqfm_karadag.059.a: "We will sing songs to his glory!"
 eqfm_karadag.059.b: "Justice well served!"
 
 eqfm_karadag.100.t: "A Demand for Haraç"
 eqfm_karadag.100.d: "A militia from [SCOPE.sCountry('bosnia_scope').GetName] has approached the border to demand that [ROOT.GetCountry.GetName] pay #italic Haraç#! to [SCOPE.sCountry('bosnia_scope').GetRuler.GetFullNameWithTitle]."
 eqfm_karadag.100.f: "The Haraç, a tax on non-Muslims, has been levied on the Balkans since the Ottoman conquests. As non-subjects of the [SCOPE.sCountry('ottoman_scope').GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] and his court have bucked this tribute-tax for centuries."
 eqfm_karadag.100.a: "[ROOT.GetCountry.GetNameNoFlag] will never submit to extortion."
 eqfm_karadag.100.b: "We have no means to resist [SCOPE.sCountry('bosnia_scope').GetNameNoFlag]"
 eqfm_karadag.101.t: "Tribal Conflicts"
 eqfm_karadag.101.d1: "A missive has arrived to inform us that our militias, led by our trusted warlord [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! have had their demands for Haraç rejected by [SCOPE.sCountry('montenegro_scope').GetName]."
 eqfm_karadag.101.d2: "In a shocking turn of events, a militia that approached [SCOPE.sCountry('montenegro_scope').GetName] to demand tribute has arrived with a different prize: the submission of the Price-Bishopric to [ROOT.GetCountry.GetName]."
 eqfm_karadag.101.f: "The [GetStrategicRegion('region_balkans').GetName] are no stranger to tribal violence. In the hinterlands, tribal feuds and customs often take precedence over the law of the Sultan."
 eqfm_karadag.101.a: "The Prince-Bishop will learn humility."
 eqfm_karadag.101.b: "They will serve us well."
 eqfm_karadag.102.t: "Negotiations at Humac"
 eqfm_karadag.102.d: "[SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! has found his designs on [GetStateRegion('STATE_MONTENEGRO').GetName] frustrated by [SCOPE.sCountry('montenegro_scope').GetRuler.GetFullNameWithTitle]'s stubborn refusal to abandon the defense of the countryside. Under pressure from both [SCOPE.sCountry('balkfm_benefactor_scope').GetNameNoFlag] and the [SCOPE.sCountry('ottoman_scope').GetNameNoFlag], the [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle] and [SCOPE.sCountry('bosnia_scope').GetRuler.GetFullName], the [SCOPE.sCountry('bosnia_scope').GetRuler.GetPrimaryRoleTitle] of [SCOPE.sCountry('bosnia_scope').GetNameNoFlag] have met at the village of #bold Humac#! to parlay."
 eqfm_karadag.102.f: "The following terms have been proposed:\n\"1. Displaced residents of Grahovo may return.\n 2. #yellow Jakov Daković#! will become lord of Grahovo.\n 3. Grahovo will resume paying taxes to the Porte.\n 4. All fortifications at Grahovo will be abandoned. \n 5. There will be "eternal peace" between the Turks and Montenegrins. \n 6. Both Mehmed Pasha, vizier of Bosnia, and [ROOT.GetCountry.GetRuler.GetLastName] will uphold this agreement.\""
 eqfm_karadag.102.a: "This [SCOPE.sCountry('bosnia_scope').GetRuler.GetLastName] is a snake, but we will parley."
 eqfm_karadag.102.b: "[SCOPE.sCountry('montenegro_scope').GetRuler.GetFullNameWithTitle] will have his revenge."
 eqfm_karadag.102.tt: "#red #bold This is a terrible idea.#!#!"
 eqfm_karadag.102.c: "So be it."
 eqfm_karadag.103.t: "The Battle of Grahovo"
 eqfm_karadag.103.d: "The [SCOPE.sCountry('montenegro_scope').GetAdjectiveNoFlag] border village of Grahovo has been subjected to a particularly violent raid. Aiming to assert this preceived rights to tribute, [SCOPE.sCountry('bosnia_scope').GetAdjectiveNoFlag] warlord [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! [SCOPE.sCharacter('smail_aga_scope').GetLastName] has ransacked the village and several civilians have been put to the sword at his command.\n\nDespite the efforts of the local militia, the village has been torched and local leaders forced to flee. Amongst the fallen is the brother of the [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle], [SCOPE.sCharacter('balkfm_joko_scope').GetFullName]."
 eqfm_karadag.103.f: "\"On Grahovo's wide and spacious plain\nOf Petrovic men full nine were slain\nBy Cengijic Aga's gleaming sword,\nTo the shame of Montenegro's lord."\n-Popular poem recounting the action at Grahovo, 1830s"
 eqfm_karadag.103.a: "[ROOT.GetCountry.GetName] must demand restitution."
 eqfm_karadag.103.b: "These lands are the rightful domain of the Sultan."
 eqfm_karadag.103.c: "[GetStateRegion('STATE_MONTENEGRO').GetName] should be ours."
