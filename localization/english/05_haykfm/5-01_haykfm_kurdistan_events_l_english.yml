l_english:
 haykfm_kurdistan.001.t: "The Tribes of Kurdistan"
 haykfm_kurdistan.001.d: "For generations, [ROOT.GetCountry.GetName] has paid nominal tribute to the [ROOT.GetCountry.GetOverlord.GetName] and exchanged local autonomy for the promise of safeguarding the Persian border. Recently, the Emir, [ROOT.GetCountry.GetRuler.GetFullName], has found the Sultan's emissaries becoming ever more overbearing and less tolerant of tribal sovereignty."
 haykfm_kurdistan.001.f: "The [GetCulture('kurdish').GetName] have called the lands of Kurdistan home for untold centuries. Despite the region changing hands dozens of times, its people have endured, binding themselves to each other with now faith and language. However, a renewed push by Constantinople to assert direct rule over Kurdistan now threatens the autonomy of the Kurdish tribes."
 haykfm_kurdistan.001.a: "[ROOT.GetCountry.GetName] will find its way."
 haykfm_kurdistan.002.t: "A Centralized State"
 haykfm_kurdistan.002.d: "Despite lacking any tradition of central authority, [ROOT.GetCountry.GetName] has established its first home-grown institutions. As the government learns to assert its control over the state, a future outside of Imperial domination seems increasingly likely."
 haykfm_kurdistan.002.f: "#italic "If we had a King,\nUpon whom God had bestowed a crown\nAnd allocated a throne\nThen our fortune would have emerged\nOur king would have his crown\nWe would have gained value and prestige."#! - Excerpt from #italic Mem û Zîn#!"
 haykfm_kurdistan.002.a: "The future remains bright for the [GetCulture('kurdish').GetName] people!"
 haykfm_kurdistan.003.t: "The Mir-i Miran"
 haykfm_kurdistan.003.d: "In a rousing ceremony in his court at [ROOT.GetCountry.GetCapital.GetCityHubName], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has laid claim to the title of #italic Mir-i Miran#!, signaling to Constantinople his intent to rule the [GetCulture('kurdish').GetName] people."
 haykfm_kurdistan.003.f: "#italic "If we had a victorious leader,\nWith generosity and sympathetic speech\nWe would have had our minted money\nWould no longer remain valueless and dubious\nTurks could not to dominate us\nOur country would not have been in ruins.\" — Kurdish Poet Xanî"
 haykfm_kurdistan.003.a: "Hail the Great [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]!"
 haykfm_kurdistan.004.t: "The Eyâlet-i Kurdistan" # TUR
 haykfm_kurdistan.004.d: "In response to the growing tide of [GetTechnology('nationalism').GetName], the Sultan has authorized the establishment of the [SCOPE.sCountry('haykfm_kurdistan_scope').GetName]. With governance handed off to a regional governor, this will free the $turkfm_porte$'s attention for other matters."
 haykfm_kurdistan.004.f: "\"I beg you all, you should be just and do your best to implement justice over all subjects and be kind-hearted with people. You should respect scholars, devotees, elderly and princes. In short, you should know yourselves and keep yourself from destruction of the construction of our society which our experienced dynasty has dignity and honour to build from lessons over centuries. Keep society’s regulations, doing well and bad are human products and their actions.\" —The Will of Abdulrahman Pasha of Baban (1789-1813"
 haykfm_kurdistan.004.a: "This will bring order to our frontier."
 haykfm_kurdistan.005.t: "The Eyâlet-i Kurdistan" # KUR
 haykfm_kurdistan.005.d: "The unyielding resolve of [GetCulture('kurdish').GetName] [GetTechnology('nationalism').GetName] has bourne fruit with the birth of [ROOT.GetCountry.GetName]. Yet much work remains- the tribal highlands are rugged and undeveloped, and its people remain poor and uneducated."
 haykfm_kurdistan.005.f: "\"I beg you all, you should be just and do your best to implement justice over all subjects and be kind-hearted with people. You should respect scholars, devotees, elderly and princes. In short, you should know yourselves and keep yourself from destruction of the construction of our society which our experienced dynasty has dignity and honour to build from lessons over centuries. Keep society’s regulations, doing well and bad are human products and their actions.\" —The Will of Abdulrahman Pasha of Baban (1789-1813"
 haykfm_kurdistan.005.a: "[ROOT.GetCountry.GetName] will find its way."

 haykfm_kurdistan.200.t: "Uniting the Kurdish People"
 haykfm_kurdistan.200.d: "The [GetCulture('kurdish').GetName] people have called their lands home for countless centuries. As [GetTechnology('nationalism').GetName] spreads across the tribes, one thing has become clear: the only future for the Kurdish people is one under a united Kurdistan!"
 haykfm_kurdistan.200.f: "#italic "We are not afraid of your soldiers,\nWe are not scared of the Tabriz ruler\nOur braves will not retreat."#! -Excerpt from #italic Dimdim#!"
 haykfm_kurdistan.200.a: "[ROOT.GetCountry.GetName] will unite the [GetCulture('kurdish').GetName] people!"
 haykfm_kurdistan.201.t: "The Birth of Kurdistan"
 haykfm_kurdistan.201.d: "Through the might of [ROOT.GetCountry.GetName]'s braves and the skill of its diplomats, a [GetCulture('kurdish').GetName] nation-state has risen for the first time in known history. The mood is jubliant in [ROOT.GetCountry.GetCapital.GetCityHubName] as the people cheer a new future for the Kurish people."
 haykfm_kurdistan.201.f: "\"We should unite together as brave men,\nLet there be no discrimination between shepherd, peasant and prince.\" —Hajî Qadir, Kurdish poet"
 haykfm_kurdistan.201.a: "The [GetCulture('kurdish').GetName] will make their own future!"
 haykfm_kurdistan.202.t: "The Lands of Greater Kurdistan"
 haykfm_kurdistan.202.d: ""
 haykfm_kurdistan.202.f: ""
 haykfm_kurdistan.202.a: "These lands have always been ours."