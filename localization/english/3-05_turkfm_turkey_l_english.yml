# Journal Entry Groups
 je_group_turkfm_content: "Ottoman & Turkish Flavor"

 # Decisions
 turkfm_palace_activation_decision: "Move Administration to the [GetBuildingType('gbbf_building_dolmabahce_palace').GetName]"
 turkfm_palace_activation_decision_desc: "The usage and prestige of the [GetBuildingType('gbbf_building_topkapi_palace').GetName] have been in decline for decades and this has only accelerated with the beginning of the Tanzimât. Advisors to the $turkfm_porte$ have appealed for the Imperial administration to move to a structure more befitting its renewed purpose."
 turkfm_palace_upgrade_decision: "Electrify the [GetBuildingType('gbbf_building_dolmabahce_palace').GetName]"
 turkfm_palace_upgrade_decision_desc: "As new technologies and standards develop across the world, administrative heads have petitioned the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] for the installation of more advanced technologies to better govern the empire."
 turkfm_palace_museum_decision: "Open the [GetBuildingType('gbbf_building_topkapi_palace').GetName] to the public"
 turkfm_palace_museum_decision_desc: "The former administrative center has quickly fallen into decay following its abandonment by the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s court. Reformers and nationalists alike have suggested that the old palace be converted into a museum to serve as a beacon of Turkish culture to the world."

