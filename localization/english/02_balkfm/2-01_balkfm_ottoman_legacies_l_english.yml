 # Tooltips
 balkfm_reform_agenda: "#o #tooltip:[GetPlayer.GetTooltipTag],balkfm_reform_agenda_desc Reform Agenda#!#!"
 balkfm_reform_agenda_desc: ""
 balkfm_agenda: "#o #tooltip:[GetPlayer.GetTooltipTag],balkfm_reform_agenda_desc Agenda#!#!"
 
 balkfm_tax_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_tax_reform_desc Modernize Tax Codes#!#! $balkfm_agenda$"
 balkfm_tax_reform_desc: "A leftover from Ottoman rule, taxation remains heavily land-based with the heaviest burden falling on those who work the fields. While preferred by the nobility, this system serves only to hold [ROOT.GetCountry.GetNameNoFormatting] back from its future."
 balkfm_tax_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_tax_reform_desc Modernize Tax Codes#!#!"
 
 balkfm_land_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_land_reform_desc Reform Ottoman Land Practices#!#! $balkfm_agenda$"
 balkfm_land_reform_desc: "As a result of centuries of stagnation under Ottoman rule, [ROOT.GetCountry.GetName] is a rural nation, sometimes even aggressively so. Leaders have demanded that the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] push forward efforts to raise the [ROOT.GetCountry.GetAdjectiveNoFormatting] people from their rural stations."
 balkfm_land_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_land_reform_desc Reform Ottoman Land Practices#!#!"
 
 balkfm_civic_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_civic_reform_desc Establish a Civic Tradition#!#! $balkfm_agenda$"
 balkfm_civic_reform_desc: "Entrenched over the course of Ottoman rule, the landed gentry exploit the lack of constitutional structures to place persons friendly to them in power. This has resulted in rampant corruption at all levels of [ROOT.GetCountry.GetAdjectiveNoFormatting] society."
 balkfm_civic_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_civic_reform_desc Establish a Civic Tradition#!#!"
 
 balkfm_brigandage_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_brigandage_desc Secure the Countryside#!#! $balkfm_agenda$"
 balkfm_brigandage_desc: "In the wake of the Greek War of Independence, bandits have terrorized the Balkan countryside outside of the reach of the both the Ottoman and [ROOT.GetCountry.GetAdjectiveNoFormatting] governments. Across the region, people demand they be brought to justice."
 balkfm_brigandage: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_brigandage_desc Secure the Countryside#!#!"
 
 balkfm_state_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_state_reform_desc Organize the Administrative State#!#! $balkfm_agenda$"
 balkfm_state_reform_desc: "[ROOT.GetCountry.GetName] emerged from Ottoman tutelage with a state apparatus that can hardly be described as one. Reform-oriented leaders have demanded that the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] implement reforms to ensure proper administration of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state."
 balkfm_state_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_state_reform_desc Organize the Administrative State#!#!"
 
 balkfm_economic_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_economic_reform_desc Organize the Economy#!#! $balkfm_agenda$"
 balkfm_economic_reform_desc: "As a result of centuries of contest by the major powers of history, the [ROOT.GetCountry.GetNameNoFormatting] economy has lagged far behind its neighbors in development. With most of the country dominated by subsistence agriculture and noble estates, reformers aim to bring industry to [ROOT.GetCountry.GetName]."
 balkfm_economic_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_economic_reform_desc Organize the Economy#!#!"
 
 balkfm_social_reform_agenda: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_social_reform_desc Initiate Social Reforms#!#! $balkfm_agenda$"
 balkfm_social_reform_desc: "[ROOT.GetCountry.GetAdjectiveNoFormatting]s have long been isolated from the ideologies of the West, but with autonomy from the Ottoman state has come a wave of enlightened thought. [ROOT.GetCountry.GetAdjectiveNoFormatting] scholars argue that the only way for the [ROOT.GetCountry.GetAdjectiveNoFormatting] state to gain its footing is to embrace modern legal and social movements."
 balkfm_social_reform: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],balkfm_social_reform_desc Initiate Social Reforms#!#!"