 # Events
 balkfm_ottoman_legacies.000.t: "An Ottoman Legacy"
 balkfm_ottoman_legacies.000.d: "[ROOT.GetCountry.GetName] enjoys a high degree of autonomy from the [SCOPE.sCountry('ottoman_scope').GetAdjective] government in [SCOPE.sCountry('ottoman_scope').GetCapital.GetCityHubName], yet the fledgling nation is gripped by the consequences of decades of neglect by the Porte. The country is rural, backwards, and uneducated with medieval processes abounding both in industry and politics."
 balkfm_ottoman_legacies.000.f: "Our country may have its freedom, but is for naught if we are unable to become economically independent from the Porte."
 balkfm_ottoman_legacies.000.a: "Something must be done."
 balkfm_ottoman_legacies.000.tt: "Completing #bold Ottoman Legacy#! journals will remove their effects."
 balkfm_ottoman_legacies.001.t: "Tax Reform Complete"
 balkfm_ottoman_legacies.001.d: "With the reform of our tax code, a massive weight has been lifted from the [ROOT.GetCountry.GetAdjectiveNoFormatting] people."
 balkfm_ottoman_legacies.001.f: ""
 balkfm_ottoman_legacies.001.a: "It is only fair."
 balkfm_ottoman_legacies.002.t: "The Great Land Reformation"
 balkfm_ottoman_legacies.002.d: "The sweeping reorganization of agricultural practices and land rights have resulted in a radical departure from the archaic systems that have prevailed in [ROOT.GetCountry.GetName] since Byzantine times. As peasants begin to understand themselves as something more than lowly laborers, it is as if the very soul of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state is waking from a stupor and finding itself ready for the future."
 balkfm_ottoman_legacies.002.f: "While it will take time to see the end results, farmers have already begun to realize the benefits of directly owning their land and crops."
 balkfm_ottoman_legacies.002.a: "This will secure our future."
 balkfm_ottoman_legacies.003.t: "An Honorable Regime"
 balkfm_ottoman_legacies.003.d: "The abolition of hereditary positions for large portions of the government bureaucracy has dragged the government forward from the Ottoman's medieval legacy."
 balkfm_ottoman_legacies.003.f: "The gentry may hem and haw, but the only way forward for [ROOT.GetCountry.GetNameNoFormatting] is to leave behind the trappings of absolutism."
 balkfm_ottoman_legacies.003.a: "For the good of the state."
 balkfm_ottoman_legacies.004.t: "The End of the Brigands"
 balkfm_ottoman_legacies.004.d: "Firm and decisive leadership from the state has led to the bandits ravaging our countryside putting down their weapons and taking up work as productive members of society."
 balkfm_ottoman_legacies.004.f: "While a basic and mundane thing, ensuring the safety of our countrymen at home is an important step in legitimizing the state."
 balkfm_ottoman_legacies.004.a: "Justly done."
 balkfm_ottoman_legacies.005.t: "Stately Foundation Established"
 balkfm_ottoman_legacies.005.d: "The reforms pushed forward by the National Assembly have brought into force the process of transforming [ROOT.GetCountry.GetName] from a post-Turkish backwater to a state capable of doing business with the West."
 balkfm_ottoman_legacies.005.f: "By pushing forward a mixture of judicial and bureaucratic reforms, the Assembly has given the state a framework for political development."
 balkfm_ottoman_legacies.005.a: "We should be proud of this."
 balkfm_ottoman_legacies.006.t: "Modernized Economy"
 balkfm_ottoman_legacies.006.d: "[ROOT.GetCountry.GetName] has pushed forward economic changes that have begun the process of reorganizing the [ROOT.GetCountry.GetAdjectiveNoFormatting] state into an industrial nation."
 balkfm_ottoman_legacies.006.f: "While still backwards in comparison to the West, these changes herald the end of feudal rule in [ROOT.GetCountry.GetNameNoFormatting]."
 balkfm_ottoman_legacies.006.a: "Our future is bright."
 balkfm_ottoman_legacies.007.t: "Social Equity"
 balkfm_ottoman_legacies.007.d: "[ROOT.GetCountry.GetName] has passed laws granting [ROOT.GetCountry.GetAdjectiveNoFormatting] citizens the rights of land ownership and personal inviolability."
 balkfm_ottoman_legacies.007.f: "The only way to escape servitude to the great empires is to start with ensuring that the [ROOT.GetCountry.GetAdjectiveNoFormatting] people are themselves free from slavery."
 balkfm_ottoman_legacies.007.a: "This is only fair."
 
 balkfm_ottoman_legacies.010.t: "The Brigands Raid Again"
 balkfm_ottoman_legacies.010.d: "Brigands have raided the countryside in [SCOPE.sState('brigandage_state').GetName], renewing cries for state action."
 balkfm_ottoman_legacies.010.f: "Disillusioned irregulars have seized on weak government control and police corruption to rob and pillage both laborer and gentry alike. Withdrawing as quickly as they arrived, local chieftains have found several villages raided and burned."
 balkfm_ottoman_legacies.010.a: "Godless Cowards."