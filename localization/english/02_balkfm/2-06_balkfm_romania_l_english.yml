l_english:
# Journal Entries
 je_balkfm_rom_regulamentul_organic: "The Regulamentul Organic"
 je_balkfm_rom_regulamentul_organic_reason: "[ROOT.GetCountry.GetName] exists only nominally as part of the Ottoman Empire. However, the country's newfound autonomy, both the cities and the countryside remain hopelessly backwards. Disrupted by centuries of conflict along the Austrian Military Frontier and the perennial Russo-Turkish conflicts, the state exercises minimal authority in its rural communities and the economy remains feudal in all but name.\n\nUsing its status as the guarantor of the Romanian people, the $RUS_ADJ$ Empire has imposed the#italic  Regulamentul Organic#!, or the Organic Law, upon the [ROOT.GetCountry.GetAdjectiveNoFormatting] state. Its various stipulations mandate that [ROOT.GetCountry.GetNameNoFormatting] take steps to modernize itself and her people.\n\n#blue The Regulamentul Organic imposes a seven year term limit on our [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]#!."
 je_rom_regulamentul_organic_tt: "[ROOT.GetCountry.GetNameNoFlag] has completed 4 or more #bold Ottoman Legacy#! journal entries (#bold [GetPlayer.MakeScope.Var('balkfm_ottoman_legacy_var').GetValue]#! completed)"
 je_balkfm_rom_regulamentul_election_tt1: "The #bold Hospodar#! election will occur in #bold [ROOT.GetVariable('balkfm_regulamentul_var').GetValue]#! years."
 je_balkfm_rom_regulamentul_election_tt2: "The #bold Hospodar#! election will occur next year."
 je_balkfm_rom_regulamentul_election_tt3: "The #bold Hospodar#! election is underway."
 je_balkfm_rom_regulamentul_election_tt4: "The electoral process has been disrupted."

 je_balkfm_rom_1848: "Romanian Liberalism"
 je_balkfm_rom_1848_reason: "As Enlightenment thought pours into [ROOT.GetCountry.GetName], the entrenched aristocracy surrounding the Prince has grown disillusioned with the promises of the #italic Regulamentul Organic#!. While not seeking the #italic Regulamentul#!'s total abolition, liberal factions have put forward demands for limitations on Princely prerogatives and safeguards for citizen's rights.\n\nThe Prince currently has #variable [ROOT.GetVariable('balkfm_1848_rom_var').GetValue]/200#! support. This is expected to change by #variable #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_rom_1848_sources [ROOT.GetVariable('balkfm_1848_progress_var').GetValue|+=]#!#! next month."
 je_balkfm_rom_1848_status: "The Prince has #variable [ROOT.GetVariable('balkfm_1848_rom_var').GetValue]/200#! support."
 je_balkfm_rom_1848_sources: "[Country.MakeScope.GetScriptValueDesc('balkfm_1848_progress_value')]"
 balkfm_1848_rom_success_tt: "The Prince has gathered #bold 200#! support."
 balkfm_1848_rom_fail_tt: "The Prince has lost all support."
 balkfm_intervention_tt: "The Prince has less than #bold 50#! support."

 je_balkfm_rom_statutul_dezvoltator: "Statutul Dezvoltător"
 je_balkfm_rom_statutul_dezvoltator_reason: "[ROOT.GetCountry.GetRuler.GetFullName] has consolidated power over the Romanian Principalities and now seeks to expand his direct control over the state. Using his power as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], he now aims to restore absolutist rule in the Principalities to the detriment of his opposition. \n\nSupport for the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_rom_statutul_dezvoltator_sources [ROOT.GetVariable('balkfm_dezvoltator_progress_var').GetValue|+=]#! next month."
 je_balkfm_rom_statutul_dezvoltator_goal: "The progress bar is full."
 je_balkfm_rom_statutul_dezvoltator_sources: "[Country.MakeScope.GetScriptValueDesc('balkfm_dezvoltator_progress_value')]"

 je_balkfm_rom_1866_1: "Romanian Constitutionalism"
 je_balkfm_rom_1866_1_reason: "King [ROOT.GetCountry.GetRuler.GetFullName] was invited to rule [ROOT.GetCountry.GetName] on the pretense of defending the freedoms of the Romanian people. With his endorsement of the constitution, the people look to their leadership to implement the prescribed reforms into law."
 je_balkfm_rom_1866_2: "Romanian Constitutionalism"
 je_balkfm_rom_1866_2_reason: "King [ROOT.GetCountry.GetRuler.GetFullName] was invited to rule [ROOT.GetCountry.GetName] on the pretense of defending the freedoms of the Romanian people. Instead, the King has fallen prey to the temptations of autocracy and seeks to impose his rule over the Romanian state.\n\nThe King currently commands #variable [ROOT.GetVariable('balkfm_1866_var').GetValue] support. This is expected to change by #variable [ROOT.GetVariable('balkfm_1866_progress_var').GetValue|+=]#! next month from #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_rom_sources various sources#!."
 je_balkfm_rom_sources: "Country.MakeScope.GetScriptValueDesc('balkfm_1866_progress_value')]"
 je_balkfm_rom_1866_fail: "The King has lost all support."
 je_balkfm_rom_constitution_1: "The King commands broad support."
 je_balkfm_rom_constitution_2: "The King's supporters are wavering."
 je_balkfm_rom_constitution_3: "The King has few supporters left."

 je_balkfm_rom_nationalism: "Romanian Nationalism"
 je_balkfm_rom_nationalism_reason: "The Romanian people have existed since at least the times of Roman Dacia, yet the origin of these Romance-speaking populations has remained shrouded in mystery. From its original conquest by Rome, and through invasion by Slavic and later Turkic peoples, the Romanian people have never held a state founded for their own people. Motivated by the tide of nationalism, two competing schools of thought have emerged that seek to write their own version of Romanian history and implement their own vision for [ROOT.GetCountry.GetName].\n$TOOLTIP_DELIMITER$\nThe conservative #yellow Junimists#! hold that the country lacks a solid socio-economic foundation and that the idea that modern Romanians are of pure Roman stock is a historical fabrication. Led by #yellow Titu Maiorescu#!, the #yellow Junimist#! camp commands #white #bold [ROOT.GetVariable('balkfm_junimism_var').GetValue]#!#! support. This is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_junimism_sources [Country.MakeScope.ScriptValue('balkfm_junimism_progress_value')|+=]#! next month.\n$TOOLTIP_DELIMITER$\nThe liberal #yellow Dacians#! argue that Romanians are possessed of a unique national rigor born of a fusion of both Roman and Dacian characteristics which has gifted them a supposed pioneering spirit that drives them to be leaders in European affairs. Led by #yellow Bogdan Hasdeu#!, the #yellow Dacian#! camp commands #white #bold [ROOT.GetVariable('balkfm_dacianism_var').GetValue]#!#! support. This is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_dacianism_sources [Country.MakeScope.ScriptValue('balkfm_dacianism_progress_value')|+=]#! next month.\n$TOOLTIP_DELIMITER$\n[SCOPE.GetRootScope.GetCountry.GetCustom('balkfm_romanian_nationalism_progress_type')]"
 je_balkfm_junimism_sources: "[Country.MakeScope.GetScriptValueDesc('balkfm_junimism_progress_value')]"
 je_balkfm_dacianism_sources: "[Country.MakeScope.GetScriptValueDesc('balkfm_dacianism_progress_value')]"
 je_balkfm_rom_nationalism_complete_tt: "Either the #yellow Junimist#! or #yellow Dacian#! camp has at least #bold 50#! support."
 je_balkfm_rom_nationalism_junimism_tt: "#yellow Junimism#! prevails in society."
 je_balkfm_rom_nationalism_dacianism_tt: "#yellow Dacianism#! prevails in society."
 je_balkfm_rom_nationalism_tie_tt: "Nationalist opinion is mixed."
 support_junimism_tt: "Supporting #yellow Junimism#! will increase its monthly progress by #bold 1#!."
 support_dacianism_tt: "Supporting #yellow Dacianism#! will increase its monthly progress by #bold 1#!."

 je_balkfm_rom_united_principalities: "The Romanian Principalities"
 je_balkfm_rom_united_principalities_reason: "The Danubian principalities rouse from their long lethargy. The rights and interests of the homeland cry out for liberation; the good and happiness of the Romanian nation demands action! We must pursue union, and help build a single country for our people. Caution must be exercised, however—we cannot upset any [Concept('concept_great_power','$concept_great_powers$')] in the process.\n\nWe have maintained the union for #variable [Country.MakeScope.Var('romanian_union_var').GetValue]/120#! months."
 je_balkfm_rom_united_principalities_reason_status_1: "Unite the Principalities."
 je_balkfm_rom_united_principalities_reason_status_2: "Maintain the union of principalities for 10 years."
 je_balkfm_rom_greater_romania: "Greater Romania"
 je_balkfm_rom_greater_romania_reason: "[ROOT.GetCountry.GetName] has achieved union. Yet, countless Romanians are trapped abroad, subject to the machinations and abuses of the Imperialist powers. The Romanian state will not be whole until all Romanians can call it home."
 je_balkfm_rom_greater_romania_possible_tt: "[ROOT.GetCountry.GetNameNoFlag] controls #bold 3 or more#! [GetCulture('romanian').GetName] [concept_homeland] [Concept('concept_state','$concept_states$')]"

 je_balkfm_peles_castle: "Peleș Castle"
 je_balkfm_peles_castle_reason: "With the recognition of [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] has put forward a plan to construct a royal residence that would lend legitimacy and prestige to the fledgling Romanian state."

 # Journal Entry Lobby Text
 je_balkfm_rom_regulamentul_organic_lobby: "$gbbf_journal_lobby$\nUsing its status as the guarantor of the Romanian people, the $RUS_ADJ$ Empire has imposed the#italic  Regulamentul Organic#!, or the Organic Law, upon the Principalities. Its various stipulations mandate that the small countries take steps to modernize themselves and their people."
 je_balkfm_rom_nationalism_lobby: "$gbbf_journal_lobby$\nFrom its original conquest by Rome, and through invasion by Slavic and later Turkic peoples, the Romanian people have never held a state founded for their own people. Motivated by the tide of nationalism, two competing schools of thought have emerged that seek to write their own version of Romanian history and implement their own vision for Romania."
 je_balkfm_rom_united_principalities_lobby: "$gbbf_journal_lobby$\nThe Danubian principalities rouse from their long lethargy. The rights and interests of the homeland cry out for liberation; the good and happiness of the Romanian nation demands action! We must pursue union, and help build a single country for our people."

