l_english:
 balkfm_revivalism.001.t: "The [ROOT.GetCountry.GetAdjectiveNoFormatting] Millet"
 balkfm_revivalism.001.d: "The Eyalet of [ROOT.GetCountry.GetNameNoFlag] comprises the heartlands of the medieval [ROOT.GetCountry.GetAdjectiveNoFormatting] state. Following the uprisings in Serbia and the independence of the Greek state, nationalist movements have taken root throughout the province as the [ROOT.GetCountry.GetAdjectiveNoFormatting] people fight to define themselves as a singular nation.\n\nThey have found their designs frustrated by the #yellow Phariot#! $grefm_greek$ nobility that seeks to use their influence to erase the [ROOT.GetCountry.GetAdjectiveNoFormatting] identity from the [GetStrategicRegion('region_balkans').GetName]."
 balkfm_revivalism.001.f: "“My peoples are far away from one another, and that is good... Each of them observes own neighbour: they do not understand anything and hate each other from the bottom of their souls. Thanks to the common mistrust, the order is maintained and their hatred for one another ensures long-term peace.” -Emperor Franz I to the $FRA_ADJ$ Ambassador"
 balkfm_revivalism.001.bul: "“We will be free in complete liberty where the Bulgarian lives: in Bulgaria, Thrace, Macedonia; people of whatever ethnicity live in this heaven of ours, they will be equal in rights to the Bulgarian in everything.” -V. Levski"
 balkfm_revivalism.001.bos: "“Back there, in Bosnia, living is based on slavery, the entire society is a slave... We, the youth of Bosnia, must start creating a new history... We must wage a war against pessimism, languor, dispiritedness, we, the heralds of new generations and new people...” -Vladimir Gaćinović"
 balkfm_revivalism.001.alb: "“Just as we are not and do not want to be Turks, so we shall oppose with all our might anyone who would like to turn us into Slavs or Austrians or Greeks, we want to be Albanians.” -League of Prizren, 1878"
 balkfm_revivalism.001.a: "The [ROOT.GetCountry.GetAdjectiveNoFormatting] people will find their way."
 balkfm_revivalism.002.t: "The Bulgarian Question"
 balkfm_revivalism.002.d: "While the Eyalet contains the oldest of the [GetCulture('bulgarian').GetName] homelands, we remain estranged from our cousins in Thrace and Macedonia. Torn between [ROOT.GetCountry.GetNameNoFlag], #yellow Rumelia#!, and #yellow Edirne#!, the once-unified Bulgaria identity has begun to fracture. Nationalists demand that we stress the commonalities between all Bulgarians."
 balkfm_revivalism.002.f: "\"Our language, as it is well known, is divided into two main dialects, of which one is spoken in Bulgaria and Thrace, and the other one in Macedonia.... Not only should not and cannot the Macedonian dialect be excluded from the common standard language, it would also have been better if it was accepted as its main basis; the reason being that it is more melodious, more fluent and better structured, and in many ways fuller and richer.\" -P. Zografski, 1857"
 balkfm_revivalism.002.a: "These lands are rightfully [GetCulture('bulgarian').GetName]"
 balkfm_revivalism.002.b: "We must focus on coexistence."
 balkfm_revivalism.003.t: "The Bulgarian National Revival"
 balkfm_revivalism.003.d: "The tenets of Nationalism have infused into Bulgarian society. From tenant farmers to provincial administrators, the Bulgarian people have begun to formulate the idea of themselves not as subjects of the Sultan, but as a people that both have and will exist separately from the influence of their Greco-Turkish overlords."
 balkfm_revivalism.003.f: "\"O, Volga, Volga! What memories you awake in me, how you drive me to bury myself in the past! High are your waters, Volga. I and my friend, also a Bulgarian, we dived and proudly told ourselves that, at this very moment, we received our true baptismal…""
 balkfm_revivalism.003.a: "We will resurrect the fatherland!"
 balkfm_revivalism.003.tt: "The Bulgarian Nationalist Movement will now gain momentum every month."
 balkfm_revivalism.009.t: "A Nation Reborn"
 balkfm_revivalism.009.d1: "With vocal support from [SCOPE.sCountry('balkfm_support_scope').GetName], the newly formed “National Assembly” has declared the restoration of the Bulgarian state in a moving ceremony in [ROOT.GetCountry.GetCapital.GetName]. Emissaries from the Sultan’s court are reportedly en route with a firman legalizing this action."
 balkfm_revivalism.009.d2: "In a moving ceremony in [ROOT.GetCountry.GetCapital.GetName], the newly formed “National Assembly” has declared the restoration of the Bulgarian state and empowered itself with the right to rule over the Bulgarian people."
 balkfm_revivalism.009.f1: "In a compromise with the Sultan, the revivalists have made no mention of independence, instead agreeing to autonomous existence under nominal Ottoman suzerainty."
 balkfm_revivalism.009.f2: "In defiance of nearly four centuries of submission to foreign rule, the Bulgaria state has been reforged."
 balkfm_revivalism.009.a: "Bulgaria is eternal!"
 balkfm_revivalism.009.tt: "The $gbbf_devout$ will become the #bold Orthodox Church#!."