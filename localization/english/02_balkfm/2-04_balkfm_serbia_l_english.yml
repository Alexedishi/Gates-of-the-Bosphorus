 balkfm_house_karadordevic_desc: "Founded by Đorđe Petrović, the #italic Veliki Vožd#! of the Serbian Uprising of 1804, House Karađorđević represents one of the two dynasties vying for the Serbian throne. Traditionally aligned with Russia, they have been locked in a bitter rivalry with $balkfm_house_obrenovic$ following the assassination of Karađorđe in 1817."

