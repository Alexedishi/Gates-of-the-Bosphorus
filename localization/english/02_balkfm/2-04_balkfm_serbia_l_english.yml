 je_balkfm_ser_karadordevic_breakdown: "[Country.MakeScope.GetScriptValueDesc('balkfm_karadordevic_progress_value')]"
 je_balkfm_ser_monarchism_complete: "Either dynasty has cemented their control over the throne."
 je_balkfm_ser_monarchism_obrenovic_outcome: "If $balkfm_house_obrenovic$ has cemented their succession, triggers the event #white #bold The Reckoning#!#!"
 je_balkfm_ser_monarchism_karadordevic_outcome: "If $balkfm_house_karadordevic$ has cemented their succession, triggers the event #white #bold Here to Stay#!#!"

 je_balkfm_ser_monarchism_body_gobt: "$je_balkfm_ser_monarchism_flavor_gotb$$gbbf_linebreak_normal$$je_balkfm_ser_monarchism_desc_gotb$$gbbf_linebreak_normal$$je_balkfm_ser_monarchism_factors_gotb$"
 je_balkfm_ser_monarchism_flavor_gotb: "Unlike its Balkan peers, [ROOT.GetCountry.GetName] has retained a native nobility, instead of importing a European royal family. This has aided Serbia in the transition to self-rule. However, the country has found itself divided between the great Dynasties of the Austrian-aligned $balkfm_house_obrenovic$ and the $RUS_ADJ$-aligned $balkfm_house_karadordevic$."
 je_balkfm_ser_monarchism_desc_gotb: "•$balkfm_house_obrenovic$ currently has #bold [ROOT.GetCountry.MakeScope.GetVariableFromVariableMap('balkfm_dynastic_rivalry_varmap', MakeScopeFlag('balkfm_obrenovic_support_var')).GetValue]#! $balkfm_serbian_senate_support$. They are expected to generate #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_balkfm_ser_obrenovic_breakdown [Country.MakeScope.ScriptValue('balkfm_obrenovic_progress_value')|+=]#! support next month.\n • $balkfm_house_karadordevic$ currently has #bold [JournalEntry.GetCountry..MakeScope.GetVariableFromVariableMap('balkfm_dynastic_rivalry_varmap', MakeScopeFlag('balkfm_karadordevic_support_var')).GetValue]#! $balkfm_serbian_senate_support$. They are expected to generate #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_balkfm_ser_karadordevic_breakdown [Country.MakeScope.ScriptValue('balkfm_karadordevic_progress_value')|+=]#! support next month.\n • [SCOPE.GetRootScope.GetCountry.GetCustom('balkfm_dynastic_rivalry_tilt_type')]"
 je_balkfm_ser_monarchism_factors_gotb: "$balkfm_house_obrenovic$ will be #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_balkfm_ser_obrenovic_pos strengthened#! by conservatism and #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_balkfm_ser_obrenovic_neg weakened#! by liberalism. Likewise, $balkfm_house_karadordevic$ will be #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_balkfm_ser_karadordevic_pos strengthened#! by liberalism and #tooltippable;tooltip:[GetPlayer.GetTooltipTag],je_balkfm_ser_karadordevic_neg weakened#! by conservatism."
 je_balkfm_ser_obrenovic_pos: "The following factors will #bold strengthen#! $balkfm_house_obrenovic$:\n • The [concept_clout] of pro-#yellow Autocracy#! or #yellow Oligarchy#! $gbbf_interest_groups$ if either law is enacted\n • Our $gbbf_investment_levels$ in the [GetInstitutionType('institution_police').GetName] [concept_institution]\n • The [concept_clout] of pro-#yellow Serfdom#! or #yellow Tenant Farmers#! $gbbf_interest_groups$ if either law is enacted\n • Having #green #bold positive#!#! [concept_relations] with #yellow Austria#!\n • Having #green #bold positive#!#! [concept_political_lobby_appeasement] of our pro-#yellow Austria#! $gbbf_lobbies$"
 je_balkfm_ser_obrenovic_neg: "The following factors will #bold weaken#! $balkfm_house_obrenovic$:\n • The [concept_clout] of pro-#yellow Autocracy#! or #yellow Oligarchy#! $gbbf_interest_groups$ if any #yellow Voting Rights#! are enacted\n • Not having the [GetInstitutionType('institution_police').GetName] [concept_institution] active\n • The [concept_clout] of pro-#yellow Serfdom#! or #yellow Tenant Farmers#! $gbbf_interest_groups$ if #bold neither#! law is enacted\n • Having #red #bold negative#!#! [concept_relations] with #yellow Austria#!\n • Having #red #bold negative#!#! [concept_political_lobby_appeasement] of our pro-#yellow Austria#! $gbbf_lobbies$\n • $balkfm_house_obrenovic$ has failed to support #yellow Vojvodina#!"
 je_balkfm_ser_karadordevic_pos: "The following factors will #bold strengthen#! $balkfm_house_karadordevic$:\n • The [concept_clout] of pro-#yellow Suffrage#! $gbbf_interest_groups$ if any #yellow Voting Rights#! are enacted\n • The [concept_clout] of pro-#yellow Right of Assembly#! or #yellow Protected Speech#! $gbbf_interest_groups$ if either law is enacted\n • The [concept_clout] of anti-#yellow Serfdom#! or #yellow Tenant Farmers#! $gbbf_interest_groups$ if #bold neither#! law is enacted\n • Having #green #bold positive#!#! [concept_relations] with #yellow Russia#!\n • Having #green #bold positive#!#! [concept_political_lobby_appeasement] of our pro-#yellow Russia#! $gbbf_lobbies$"
 je_balkfm_ser_karadordevic_neg: "The following factors will #bold weaken#! $balkfm_house_karadordevic$:\n • The [concept_clout] of pro-#yellow Suffrage#! $gbbf_interest_groups$ if #bold no#! #yellow Voting Rights#! are enacted\n • The [concept_clout] of pro-#yellow Right of Assembly#! or #yellow Protected Speech#! $gbbf_interest_groups$ if #bold neither#! law is enacted\n • The [concept_clout] of anti-#yellow Serfdom#! or #yellow Tenant Farmers#! $gbbf_interest_groups$ if either law is enacted\n • Having #red #bold negative#!#! [concept_relations] with #yellow Russia#!\n • Having #red #bold negative#!#! [concept_political_lobby_appeasement] of our pro-#yellow Russia#! $gbbf_lobbies$\n • $balkfm_house_karadordevic$ has failed to support #yellow Vojvodina#!"

 je_balkfm_ser_monarchism_body_ip3: "$je_balkfm_ser_monarchism_flavor_ip3$$gbbf_linebreak_normal$$je_balkfm_ser_monarchism_desc_ip3$$gbbf_linebreak_normal$$je_balkfm_ser_monarchism_factors_ip3$"
 je_balkfm_ser_monarchism_flavor_ip3: "Since the independence of [ROOT.GetCountry.GetName], the dynasties of $balkfm_house_obrenovic$ and $balkfm_house_karadordevic$ have been locked in plots to secure their hold over the [ROOT.GetCountry.GetAdjectiveNoFlag] throne. $balkfm_house_karadordevic$, a family whose founder was once known as a hero of the Serbian people, are plotting to dethrone $balkfm_house_obrenovic$. Karađorđe liberated Serbian provinces from the tyranny of renegade janissaries and sparked the light of freedom at the dawn of the century. However, it was also he who fled the field of battle when the situation was dire. The house of $balkfm_house_obrenovic$ stepped up to carry the banner since then. In time, the plotters will surely attempt to incite the populace to achieve their mischievous goals and dethrone the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Such shift in power bring disruption to the government until the dust settles again."
 je_balkfm_ser_monarchism_desc_ip3: "•$balkfm_house_obrenovic$ currently has #bold [ROOT.GetCountry.MakeScope.GetVariableFromVariableMap('balkfm_dynastic_rivalry_varmap', MakeScopeFlag('balkfm_obrenovic_support_var')).GetValue]#! $balkfm_serbian_senate_support$. They are expected to generate #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_breakdown [Country.MakeScope.ScriptValue('balkfm_obrenovic_progress_value')|+=]#! support next month.\n • $balkfm_house_karadordevic$ currently has #bold [JournalEntry.GetCountry.MakeScope.GetVariableFromVariableMap('balkfm_dynastic_rivalry_varmap', MakeScopeFlag('balkfm_karadordevic_support_var')).GetValue]#! $balkfm_serbian_senate_support$. They are expected to generate #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_breakdown [Country.MakeScope.ScriptValue('balkfm_karadordevic_progress_value')|+=]#! support next month.\n • [SCOPE.GetRootScope.GetCountry.GetCustom('balkfm_dynastic_rivalry_tilt_type')]"
 je_balkfm_ser_monarchism_factors_ip3: "$balkfm_house_obrenovic$ will be #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_pos_ip3 strengthened#! by conservatism and #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_neg_ip3 weakened#! by liberalism. Likewise, $balkfm_house_karadordevic$ will be #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_pos_ip3 strengthened#! by liberalism and #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_neg_ip3 weakened#! by conservatism."
 je_balkfm_ser_obrenovic_pos_ip3: "The following factors will #bold strengthen#! $balkfm_house_obrenovic$:\n • The [concept_clout] of pro-[GetLawType('law_autocracy').GetName] or [GetLawType('law_autocracy').GetName] $gbbf_interest_groups$ if either law is enacted\n • The [concept_clout] of pro-[GetLawGroup('lawgroup_policing').GetName] $gbbf_interest_groups$ if [GetPlayer.GetNameNoFlag] has the [GetInstitutionType('institution_police').GetName] [concept_institution]\n • The [concept_clout] of pro-[GetLawType('law_serfdom').GetName] or [GetLawType('law_tenant_farmers').GetName] $gbbf_interest_groups$ if either law is enacted\n • $gbbf_loyalists$ in [GetPlayer.GetNameNoFlag]\n • Having #green #bold positive#!#! [concept_relations] with #yellow Austria#!\n • Having #green #bold positive#!#! [concept_political_lobby_appeasement] of our pro-#yellow Austria#! $gbbf_lobbies$\n • Placing #yellow Austria#! at the head of [ROOT.GetCountry.GetAdjectiveNoFlag] diplomatic precedence\n • Running a smear campaign against $balkfm_house_obrenovic$\n • Choices and outcomes during events"
 je_balkfm_ser_obrenovic_neg_ip3: "The following factors will #bold weaken#! $balkfm_house_obrenovic$:\n • The [concept_clout] of pro-[GetLawType('law_autocracy').GetName] or [GetLawType('law_autocracy').GetName] $gbbf_interest_groups$ if any #yellow Voting Rights#! are enacted\n • Not having the [GetInstitutionType('institution_police').GetName] [concept_institution] active\n • The [concept_clout] of pro-[GetLawType('law_serfdom').GetName] or [GetLawType('law_tenant_farmers').GetName] $gbbf_interest_groups$ if #bold neither#! law is enacted\n • From $gbbf_radicals$ in [GetPlayer.GetNameNoFlag]\n • Having #red #bold negative#!#! [concept_relations] with #yellow Austria#!\n • Having #red #bold negative#!#! [concept_political_lobby_appeasement] of our pro-#yellow Austria#! $gbbf_lobbies$\n • Having #yellow Russia#! at the head of [ROOT.GetCountry.GetAdjectiveNoFlag] diplomatic precedence\n • $balkfm_house_obrenovic$ has failed to support #yellow Vojvodina#!\n • Choices and outcomes during events"
 je_balkfm_ser_karadordevic_pos_ip3: "The following factors will #bold Strengthen#! $balkfm_house_karadordevic$:\n • The [concept_clout] of pro-#yellow Suffrage#! $gbbf_interest_groups$ if any #yellow Voting Rights#! are enacted\n • The [concept_clout] of pro-[GetLawType('law_right_of_assembly').GetName] or [GetLawType('law_protected_speech').GetName] $gbbf_interest_groups$ if either law is enacted\n • The [concept_clout] of anti-[GetLawType('law_serfdom').GetName] or [GetLawType('law_tenant_farmers').GetName] $gbbf_interest_groups$ if either law is enacted\n • Having #green #bold positive#!#! [concept_relations] with #yellow Russia#!\n • Having #green #bold positive#!#! [concept_political_lobby_appeasement] of our pro-#yellow Russia#! $gbbf_lobbies$\n • Placing #yellow Russia#! at the head of [ROOT.GetCountry.GetAdjectiveNoFlag] diplomatic precedence\n • Running a smear campaign against $balkfm_house_karadordevic$\n • Choices and outcomes during events"
 je_balkfm_ser_karadordevic_neg_ip3: "The following factors will #bold Weaken#! $balkfm_house_karadordevic$:\n • The [concept_clout] of pro-#yellow Suffrage#! $gbbf_interest_groups$ if #bold no#! #yellow Voting Rights#! are enacted\n • The [concept_clout] of pro-[GetLawType('law_right_of_assembly').GetName] or [GetLawType('law_protected_speech').GetName] $gbbf_interest_groups$ if #bold neither#! law is enacted\n • The [concept_clout] of anti-[GetLawType('law_serfdom').GetName] or [GetLawType('law_tenant_farmers').GetName] $gbbf_interest_groups$ if #bold neither#! law is enacted\n • Having #red #bold negative#!#! [concept_relations] with #yellow Russia#!\n • Having #red #bold negative#!#! [concept_political_lobby_appeasement] of our pro-#yellow Russia#! $gbbf_lobbies$\n • Having #yellow Austria#! at the head of [ROOT.GetCountry.GetAdjectiveNoFlag] diplomatic precedence\n • $balkfm_house_karadordevic$ has failed to support #yellow Vojvodina#!\n •  Choices and outcomes during events"

 je_balkfm_ser_defenders: "Defenders of the Constitution"
 je_balkfm_ser_defenders_reason: "Determined to impose tangible limitations on royal privilege in [ROOT.GetCountry.GetName], a motivated group of politicians, calling themselves the "Defenders of the Constitution" have aligned against authoritarian rule."
 je_balkfm_ser_defenders_tt1: "[ROOT.GetCountry.GetNameNoFlag] has completed the #bold Organize the Administrative State#! [concept_journal_entry]"
 je_balkfm_ser_defenders_tt2: "[ROOT.GetCountry.GetNameNoFlag] has completed the #bold Establish a Civic Tradition#! [concept_journal_entry]"
 je_balkfm_ser_defenders_tt3: "[ROOT.GetCountry.GetNameNoFlag] has completed the #bold Reform Ottoman Land Practices#! [concept_journal_entry]"

 je_balkfm_ser_serbian_heartlands: "The Serbian Heartlands"
 je_balkfm_ser_serbian_heartlands_reason: "[ROOT.GetCountry.GetName] exists only as a shadow of itself. Our nation has no future as long as the majority of our peoples remain under the thumb of foreign empires."
 je_balkfm_ser_greater_serbia: "Greater Serbia"
 je_balkfm_ser_greater_serbia_reason: "\"#yellow The Draft#!\" represents a grandiose ideal for Serbian unification. Drawn up by nationalist #yellow Ilija Garašanin#! and presented to the Prince, the plan calls for the liberation of all Serbs living in the lands of \"Old Serbia\" and their reorganization into a revitalized Serbian Empire. While some would have this mean creating a union with Yugoslavs across the Balkans, many scholars and politicians argue that it is [ROOT.GetCountry.GetName] alone that deserves preeminence in the Balkans."
 je_balkfm_ser_greater_serbia_complete: "[ROOT.GetCountry.GetNameNoFlag] has formed the #yellow Serbian Empire#! in [concept_nation_formation]"

 # Journal Entry Lobby Text
 je_balkfm_ser_monarchism_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_ip3$\nUnlike its Balkan peers, #yellow Serbia#! has retained a native nobility, instead of importing a European royal family. This has aided Serbia in the transition to self-rule. However, the country has found itself divided between the great Houses of the Austrian-aligned #yellow Obrenović#! Dynasty and the $RUS_ADJ$-aligned #yellow Karađorđević#! Dynasty."
 je_balkfm_ser_serbian_heartlands_lobby: "$gbbf_journal_lobby$\nSerbia exists only as a shadow of itself. Our nation has no future as long as the majority of our peoples remain under the thumb of foreign empires."

