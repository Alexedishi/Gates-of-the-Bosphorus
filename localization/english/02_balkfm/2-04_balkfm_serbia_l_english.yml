# Journal Entry Groups
 je_group_balkfm_serbia: "Serbian Historical Content"

# Journal Entries
 je_balkfm_ser_monarchism: "Dynastic Rivalry"
 je_balkfm_ser_monarchism_reason: "Unlike its Balkan peers, #yellow Serbia#! has retained a native nobility, instead of importing a European royal family. This has aided Serbia in the transition to self-rule. However, the country has found itself divided between the great Houses of the Austrian-aligned #yellow Obrenović#! Dynasty and the Russian-aligned #yellow Karađorđević#! Dynasty.\n$TOOLTIP_DELIMITER$\n•$balkfm_house_obrenovic$ currently has #bold [Country.MakeScope.Var('balkfm_obrenovic_support_var').GetValue]#! #o Senate Support#!. They are expected to generate #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_breakdown [Country.MakeScope.ScriptValue('balkfm_obrenovic_progress_value')|+=]#! support next month.\n•$balkfm_house_karadordevic$ currently has #bold [Country.MakeScope.Var('balkfm_karadordevic_support_var').GetValue]#! #o Senate Support#!. They are expected to generate #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_breakdown [Country.MakeScope.ScriptValue('balkfm_karadordevic_progress_value')|+=]#! support next month.\n•[SCOPE.GetRootScope.GetCountry.GetCustom('balkfm_dynastic_rivalry_type')]\n$TOOLTIP_DELIMITER$\n$balkfm_house_obrenovic$ will be #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_pos strengthened#! by conservatism and #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_obrenovic_neg weakened#! by liberalism. Likewise, $balkfm_house_karadordevic$ will be #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_pos strengthened#! by liberalism and #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_ser_karadordevic_neg weakened#! by conservatism."
 je_balkfm_ser_obrenovic_breakdown: "[Country.MakeScope.GetScriptValueDesc('balkfm_obrenovic_progress_value')]"
 je_balkfm_ser_karadordevic_breakdown: "[Country.MakeScope.GetScriptValueDesc('balkfm_karadordevic_progress_value')]"
 je_balkfm_ser_obrenovic_pos: "The following factors will #bold strengthen#! $balkfm_house_obrenovic$:\n•The [concept_clout] of pro-#yellow Autocracy#! or #yellow Oligarchy#! [Concept('concept_interest_group','$concept_interest_groups$')] if either law is enacted\n•Our [concept_investment_level] in the #yellow Law Enforcement#! [concept_institution]\n•The [concept_clout] of pro-#yellow Serfdom#! or #yellow Tenant Farmers#! [Concept('concept_interest_group','$concept_interest_groups$')] if either law is enacted\n•Having #green #bold positive#!#! [concept_relations] with #yellow Austria#!\n•Having #green #bold positive#!#! [concept_political_lobby_appeasement] of our pro-#yellow Austria#! [Concept('concept_political_lobby','$concept_political_lobbies_short$')]"
 je_balkfm_ser_obrenovic_neg: "The following factors will #bold weaken#! $balkfm_house_obrenovic$:\n•The [concept_clout] of pro-#yellow Autocracy#! or #yellow Oligarchy#! [Concept('concept_interest_group','$concept_interest_groups$')] if any #yellow Voting Rights#! are enacted\n•Not having the #yellow Law Enforcement#! [concept_institution] active\n•The [concept_clout] of pro-#yellow Serfdom#! or #yellow Tenant Farmers#! [Concept('concept_interest_group','$concept_interest_groups$')] if #bold neither#! law is enacted\n•Having #red #bold negative#!#! [concept_relations] with #yellow Austria#!\n•Having #red #bold negative#!#! [concept_political_lobby_appeasement] of our pro-#yellow Austria#! [Concept('concept_political_lobby','$concept_political_lobbies_short$')]\n•$balkfm_house_obrenovic$ has failed to support #yellow Vojvodina#!"
 je_balkfm_ser_karadordevic_pos: "The following factors will #bold strengthen#! $balkfm_house_karadordevic$:\n•The [concept_clout] of pro-#yellow Suffrage#! [Concept('concept_interest_group','$concept_interest_groups$')] if any #yellow Voting Rights#! are enacted\n•The [concept_clout] of pro-#yellow Right of Assembly#! or #yellow Protected Speech#! [Concept('concept_interest_group','$concept_interest_groups$')] if either law is enacted\n•The [concept_clout] of anti-#yellow Serfdom#! or #yellow Tenant Farmers#! [Concept('concept_interest_group','$concept_interest_groups$')] if #bold neither#! law is enacted\n•Having #green #bold positive#!#! [concept_relations] with #yellow Russia#!\n•Having #green #bold positive#!#! [concept_political_lobby_appeasement] of our pro-#yellow Russia#! [Concept('concept_political_lobby','$concept_political_lobbies_short$')]"
 je_balkfm_ser_karadordevic_neg: "The following factors will #bold weaken#! $balkfm_house_karadordevic$:\n•The [concept_clout] of pro-#yellow Suffrage#! [Concept('concept_interest_group','$concept_interest_groups$')] if #bold no#! #yellow Voting Rights#! are enacted\n•The [concept_clout] of pro-#yellow Right of Assembly#! or #yellow Protected Speech#! [Concept('concept_interest_group','$concept_interest_groups$')] if #bold neither#! law is enacted\n•The [concept_clout] of anti-#yellow Serfdom#! or #yellow Tenant Farmers#! [Concept('concept_interest_group','$concept_interest_groups$')] if either law is enacted\n•Having #red #bold negative#!#! [concept_relations] with #yellow Russia#!\n•Having #red #bold negative#!#! [concept_political_lobby_appeasement] of our pro-#yellow Russia#! [Concept('concept_political_lobby','$concept_political_lobbies_short$')]\n•$balkfm_house_karadordevic$ has failed to support #yellow Vojvodina#!"
 je_balkfm_ser_monarchism_complete_tt: "Either dynasty has cemented their control over the throne."
 je_balkfm_ser_monarchism_status_1: "The #o Senate#! is drafting a constitution..."
 je_balkfm_ser_monarchism_status_2: "Control of the #o Senate#! is waning."
 je_balkfm_ser_monarchism_status_3: "$balkfm_house_obrenovic$ has control of the #o Senate#!."
 je_balkfm_ser_monarchism_status_4: "$balkfm_house_karadordevic$ has control of the #o Senate#!."
 je_balkfm_ser_monarchism_status_5: "Control of the #o Senate#! is contested."

