 balkfm_house_obrenovic_desc: "Founded by Miloš Obrenović and led to power by his leadership during the Serbian Uprising of 1815, House Obrenović represents one of the two dynasties vying for the Serbian throne. Traditionally aligned with Austria, they have been locked in a bitter rivalry with $balkfm_house_karadordevic$ following the assassination of Karađorđe in 1817."
