l_english:
# Journal Entries
 je_balkfm_bos_tanzimat: "The Reordering in Bosnia"
 je_balkfm_bos_tanzimat_reason: "The Sultan has declared a formal start to the Tanzimât and has ordered all Beys and Pashas to comply with the directives of the Edict of Gülhane. While abstract in its nature, any attempt to provide reforms directly threatens [ROOT.GetCountry.GetRuler.GetFullName]'s control over [ROOT.GetCountry.GetName]."
 je_balkfm_bos_tanzimat_complete: "[ROOT.GetCountry.GetNameNoFlag] has completed #v 3 or more#! $balkfm_reform_agendas$"
 
 je_balkfm_bos_ali_pasha: "The Ambitions of Ali Pasha"
 je_balkfm_bos_ali_pasha_reason: "In exchange for a lifetime of loyal service, the [ROOT.GetCountry.GetOverlord.GetName] rewarded [ROOT.GetCountry.GetRuler.GetFullName] with the lordship of [ROOT.GetCountry.GetName]. Drawn by the allure of power, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] now conspires to break free from Constantinople and to found a new [GetCulture('bosniak').GetName] Sultanate. These aspirations have now gone unnoticed by the $turkfm_porte$ and the risk of direct intervention by the Sultan and his court grow day by day."
 je_balkfm_bos_ali_pasha_fail: "Neither #bold Ali Pasha#! nor his son #bold Mehmed#! rule [ROOT.GetCountry.GetNameNoFlag]"
 je_balkfm_bos_ali_pasha_on_fail_1: "If #bold House $Rizvanbegovic$#! rules [ROOT.GetCountry.GetNameNoFlag], triggers the event #white Ali Pasha's Demise#!"
 je_balkfm_bos_ali_pasha_on_fail_2: "If #bold House $Rizvanbegovic$#! does #nold not#! rule [ROOT.GetCountry.GetNameNoFlag], triggers the event #white Failed Ambitions#!"

 # Journal Entry Lobby Text
 je_balkfm_bos_ali_pasha_lobby: "$gbbf_journal_lobby$\nThe Sultan has declared a formal start to the Tanzimât and has ordered all Beys and Pashas to comply with the directives of the Edict of Gülhane. While abstract in its nature, any attempt to provide reforms directly threatens Ali Pasha's control over Bosnia."

