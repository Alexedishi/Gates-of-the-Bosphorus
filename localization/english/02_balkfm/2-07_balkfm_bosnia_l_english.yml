 notification_balkfm_ali_rizvanbegovic_waxed_name: "#v House $Rizvanbegovic$#! Fails in Their Ambitions"
 notification_balkfm_ali_rizvanbegovic_waxed_desc: "Despite their cunning and deception, #v House $Rizvanbegovic$#! has failed in its attempt to "
