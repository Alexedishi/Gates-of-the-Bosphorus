l_english:
 balkfm_albania.001.t: "The Children of the Eagles"
 balkfm_albania.001.d: "For several decades, the people of $ALB_YAN$ enjoyed a degree of prosperity and relative autonomy from the $turkfm_porte$ while under the rule of $gbbf_bio_ali_of_jannina$. Following his deposition, the [GetCulture('albanian').GetName] people have come under the same pressures as other subjects in [GetGeographicRegion('geographic_region_rumelia').GetName]. While they are divided amongst several regions and lack a cohesive national movement, there a growing sense of an \"$ALB$\" that goes beyond being a mere subject of Constantinople."
 balkfm_albania.001.f: "\"The region of Albania is extremely rugged and its people are wild and brave... Tosks perform every kind of service whereas Gegs are animal herders.\" —Ahmed Cevdet, ca. 1889"
 balkfm_albania.001.a: "[ROOT.GetCountry.GetName] will find its way."