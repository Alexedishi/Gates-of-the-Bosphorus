l_english:
# Journal Entries
 je_balkfm_bul_battenburg_monarchy: "The Battenburg Monarchy"
 je_balkfm_bul_battenburg_monarchy_reason: "In the wake of recognition by the Porte, #yellow Alexander I#! was elected with the explicit backing of the Tsar. However, the people have instituted a liberal constitution that runs in conflict with the intent of having a $RUS_ADJ$ puppet in the Balkans. The Prince walks a careful line, with further liberal reforms risking his standing with Russia.\n\nThe ability of the Prince to retain the throne will be determined by various#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_battenburg_pos  positive#! or#tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_battenburg_neg  negative#! conditions. The vehemently divided National Assembly will only tolerate the Prince so long as he guards liberal ideals and maintains the support of the $RUS_ADJ$ Tsars.\n\nThe Prince currently enjoys #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_bul_battenburg_monarchy_breakdown [Country.MakeScope.ScriptValue('balkfm_battenburg_support_value')]#! support."
 je_balkfm_bul_battenburg_monarchy_breakdown: "[Country.MakeScope.GetScriptValueDesc('balkfm_battenburg_support_value')]"
 je_balkfm_battenburg_pos: "The following conditions will #bold advance#! the #bold Progress Bar#!:\n • Being in the same [concept_power_bloc] as #yellow Russia#!.\n • Maintaining #bold #green cordial#! or better#! [concept_relations] with #yellow Russia#!.\n • The [GetInterestGroupVariant('ig_landowners',GetPlayer).GetNameWithCountryVariant] are [concept_powerful] and [concept_in_government].\n • Accepting #bold $RUS_ADJ$ Military Attachés#!.\n • Having #yellow Freedom of Speech#! or #yellow Right of Assembly#! enacted.\n • Building Railways in #yellow Bulgaria#!.\n • Being #red #bold Schismatic#!#! or having #bold autocephaly#!.\n • Resolving the issue of #bold Brigandage#!."
 je_balkfm_battenburg_neg: "The following conditions will #bold deplete#! the #bold Progress Bar#!:\n • From being in a [concept_power_bloc] not led by #yellow Russia#!.\n • Failing to maintain good [concept_relations] with #yellow Russia#!.\n • The [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetNameWithCountryVariant] are [concept_powerful] and not [concept_in_government].\n • Having #yellow Censorship#! or #yellow Outlawed Dissent#! enacted.\n • Not having any Voting Rights.\n • Directly control #yellow Bulgaria#! and directly or indirectly control #yellow Northern Thrace#!.\n • Buying out the #bold Rusé-Varna railway#!."
 je_balkfm_alex_yeeted_tt: "Alexander has been expelled from #bold Bulgaria#!."
 battenburg_monarchy_success_tt1: "The #bold progress bar#! is greater than #bold 5#!."
 battenburg_monarchy_success_tt2: "The Prince has been exiled."
 battenburg_monarchy_fail_tt1: "The #bold progress bar#! is less than or equal to #bold 5#!."
 battenburg_monarchy_fail_tt2: "The Prince has been exiled."
 balkfm_coup_warning_1: "The Battenburg Monarchy is secure."
 balkfm_coup_warning_2: "There are whispers of discontent against the Battenburgs..."
 balkfm_coup_warning_3: "Dissenters have challenged the Monarchy."
 balkfm_coup_warning_4: "The Monarchy is widely decried in the National Assembly."
 balkfm_countercoup_add_1: "This will #green increase#! support for the Prince by #bold 1#!."
 balkfm_countercoup_add_2: "This will #green increase#! support for the Prince by #bold 2.#!"
 balkfm_countercoup_reduce_1: "This will #red decrease#! support for the Prince by #bold 1#!."
 balkfm_countercoup_reduce_2: "This will #red decrease#! support for the Prince by #bold 2#!."

 je_balkfm_bul_russian_influence: "$RUS_ADJ$ Influence"
 je_balkfm_bul_russian_influence_reason: "[ROOT.GetCountry.GetRuler.GetFullName] has been grievously insulted by the conduct of the Tsar's generals. Seeking both redress and reassurance of the Emperor's support, [ROOT.GetCountry.GetRuler.GetFullName] has assembled an entourage to accompany him on a trip to Moscow. The Prince hopes that not only will the Emperor support his continued rule in Bulgaria, but also that the Tsar will grant him the authority to punish these two ingrates."
 je_balkfm_bul_royal_influence_status: "The Prince has visited Moscow"
 je_balkfm_bul_railways: "Bulgarian Railways"
 je_balkfm_bul_railways_reason: "Support from Russia hinges on the construction of strategic rail connections to support their influence in the Balkans. Likewise, the $GBR_ADJ$ have conditioned their support on the Bulgarian state on buying out several English-operated lines in the region."

 je_balkfm_bul_stambolovism: "Stambolovism"
 je_balkfm_bul_stambolovism_reason: "The coronation of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has done little to secure the faith of the Bulgarian people in the monarchy. Seeking to remedy the damage done by the ousting of Prince Battenburg, Minister #yellow Stefan Stambolov#! and his supporters have put forward a plan to prove the worth of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], lest [ROOT.GetCountry.GetName] find itself under direct control by one of the $gbbf_great_powers$.\n\nThe [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] currently has #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_bul_stambolovism_breakdown [Country.MakeScope.ScriptValue('balkfm_stambolovism_value')|+=]#! #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_bul_stambolovism_sources Legitimizing Factors#!"
 je_balkfm_bul_stambolovism_goal: "The Prince has secured at least #bold 5#! legitimizing factors."
 je_balkfm_bul_stambolovism_sources: "The following can influence recognition of the Prince:\n • The Prince has produced an heir.\n • The Prince has over 50 [concept_popularity].\n • Completing Military Reforms\n • #yellow Stefan Stambolov#! is a leader in politics.\n • Choices during Stambolovism events."
 je_balkfm_bul_stambolovism_breakdown: "[Country.MakeScope.GetScriptValueDesc('balkfm_stambolovism_value')]"
 je_balkfm_bul_stambolovism_fail: "The King has died or left the throne before legitimizing his house."

 je_balkfm_bul_military_modernization: "$je_prussia_of_the_balkans$"
 je_balkfm_bul_military_modernization_reason: "$je_prussia_of_the_balkans_reason$"

 je_balkfm_bul_liberation_of_bulgaria: "The Liberation of Bulgaria"
 je_balkfm_bul_liberation_of_bulgaria_reason: "Bulgaria has achieved liberty after nearly five centuries of cowering before the might of the Sultan in Tsargrad. Yet, we have been unfairly denied union with the rest of the Bulgarian community. Our brethren in Eastern Rumelia call for freedom from the Sublime Porte."
 je_balkfm_bul_greater_bulgaria: "Greater Bulgaria"
 je_balkfm_bul_greater_bulgaria_reason: "The Treaty of San Stefano stipulated that the Bulgarian state would span across Moesia and Thrace. However, the meddling of the Great Powers resulted in these Bulgar-majority lands being striped away from the state and returned to the Porte."
 je_balkfm_bul_greater_bulgaria_alternate: "Greater Bulgaria"
 je_balkfm_bul_greater_bulgaria_alternate_reason: "The Treaty of San Stefano stipulated that the Bulgarian state would span across Moesia and Thrace. However, the meddling of the Great Powers resulted in these Bulgar-majority lands being striped away from the state and returned to the Porte."
 je_balkfm_bul_tsardom: "The Bulgarian Tsardom"
 je_balkfm_bul_tsardom_reason: "Following their arrival in the Balkans, the Bulgarians were Slavicized and established a large domain spanning the north of the region. After the fall of the Byzantine Empire, Bulgarian communities have been estranged from each other by the designs of the Porte. We should reunite these peoples with the Bulgarian state."
 je_balkfm_bul_empire: "The Bulgarian Empire"
 je_balkfm_bul_empire_reason: "Rife with the spirit of Nationalism and freed from the shackles of Ottoman oppression, [ROOT.GetCountry.GetName] aspires to become the new master of the Balkans. We will secure our dominion over Rumelia."
 je_balkfm_bul_empire_tt: "We have formed the #bold Bulgarian Empire#!"
 je_balkfm_bul_old_bulgaria: "Old Great Bulgaria"
 je_balkfm_bul_old_bulgaria_reason: "It is well-known and recognized that there was a time when the Bulgarian people called the steppe home. As steppe nomads, the first Bulgar state was founded in the lands between the Dniester and Volga rivers. As the [ROOT.GetCountry.GetName] consolidates its power over the Balkans, scholars and nationalists have suggested that we should extend our rule to our ancient homelands."

 je_balkfm_bul_two_bulgarias: "The Two Bulgarias"
 je_balkfm_bul_two_bulgarias_reason: "The division of Bulgaria is but a colossal legal fiction meant to split the Bulgarian nation in twain to make us more manageable for the Ottoman Administration. The Bulgarian people will known neither peace nor safety until the Bulgaria is made whole once more."
 je_balkfm_bul_two_bulgarias_status: "There are #bold [GetPlayer.MakeScope.Var('balkfm_erum_governor_var').GetValue]#! months remaining in our Governor-General's term."

