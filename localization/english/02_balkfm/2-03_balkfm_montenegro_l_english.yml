l_english:
# Journal Entries
 je_balkfm_mon_prince_bishopric: "The Prince-Bishopric"
 je_balkfm_mon_prince_bishopric_reason: "To many, the country of Montenegro seems like a ghost from the distant past. With nation-states to the west and empires to the east, the small nation endures as a reminder of Europe's feudal past. The ascent of Petar II to the throne has finally heralded change in the Prince-Bishopric. Invigorated by the ideals of his father, Petar I, and by liberalism from the West, the young Bishop hopes to bring the light of modernity to Montenegro."
 je_balkfm_mon_prince_bishopric_status: "Guide [ROOT.GetCountry.GetName] into modernity."
 je_balkfm_mon_prince_bishopric_tt1: "We have #bold Reformed Our Social Organization#!"
 je_balkfm_mon_prince_bishopric_tt2: "We have #bold Centralized the Government#!"
 je_balkfm_mon_prince_bishopric_tt3: "We have #bold Organized a Standing Army#!"
 je_balkfm_mon_prince_bishopric_tt4: "We have #bold declared the Principality of Montenegro#!."
 je_balkfm_mon_societal_reform: "Prince-Bishopric: Societal Reform"
 je_balkfm_mon_societal_reform_reason: "Montenegro is dominated by its feudal station. In the foothills of the Black Mountain, the people practice the same agriculture that has been in place since the Byzantine times. Industry is totally absent and the peasantry remain tied to their lords and chieftains. The Bishop hopes to elevate the country from this pitiful state."
 je_balkfm_mon_administration: "Prince-Bishopric: Administrative Reform"
 je_balkfm_mon_administration_reason: "The Prince-Bishop rules with absolute authority. However, there is little formal structure to the Montenegrin government. While the Bishop selects his ministers, there is no legal system to enforce standards of law and taxation with much of this being handled at the local level by chieftains and tribunals. Petar I's grand vision for Montenegro will never come to pass unless the country can first establish control over its own people."
 je_balkfm_mon_military_reform: "Prince-Bishopric: Military Reform"
 je_balkfm_mon_military_reform_reason: "The Montenegrin military can hardly be described as such. With the country trapped in its medieval condition, the state has no formal military units to call on for defense. Ottoman Viziers raid our border towns and the defense of the realm has fallen to tribal chiefs whose loyalty to the Bishop can be described as fractious at best. Montenegro's days are numbered unless it can find the strength to defend itself."

 je_balkfm_mon_ali_pasha: "The Wrath of Ali Pasha"
 je_balkfm_mon_ali_pasha_reason: "#yellow Montenegro#! has been set upon by the Vizier of Herzegovina, #yellow Ali Pasha Rizvanbegović#!. Determined to increase their influence in the eyes of the Porte, both Ali Pasha and #yellow Osman Pasha Skopljak#!, the Vizier of Scutari, have committed themselves to finally bringing Montenegro into the holdings of the #yellow Ottoman Empire#!. Every day, reports come in of new atrocities at our borders. It is all we can do to hold out against their aggression."
 je_balkfm_mon_ali_pasha_tt: "Montenegro has weathered #yellow Ali Pasha's#! aggression."
 balkfm_ali_pasha_waxed: "#yellow Ali Pasha#! has been deposed."
 
 je_balkfm_mon_austria_alliance: "A Change of Tack"
 je_balkfm_mon_austria_alliance_reason: "[SelectLocalization(SCOPE.sCountry('austria').IsValid, SCOPE.sCountry('austria').GetName, 'AUS')] concedes that it holds coastal lands that are rightfully ours. However it is adamant about keeping [concept_relations] with [SelectLocalization(SCOPE.sCountry('russia').IsValid, SCOPE.sCountry('russia').GetAdjective, 'russian')] influence out of the Mediterranean. \n\nIf we can convince the Austrians that we have fallen out with our [SelectLocalization(SCOPE.sCountry('russia').IsValid, SCOPE.sCountry('russia').GetAdjective, 'russian')] Orthodox brethren, they could be persuaded to hand back our precious coast."
 je_balkfm_mon_austria_alliance_possible_1: "#bold Austria#! owns the [concept_province] of Kotor"
 je_balkfm_mon_austria_alliance_possible_2: "[ROOT.GetCountry.GetNameNoFlag] has ceased [concept_raiding]"
 
 je_balkfm_mon_nationalism: "The Spirit of the Black Mountain"
 je_balkfm_mon_nationalism_reason: "The people of [ROOT.GetCountry.GetNameNoFlag] broadly consider themselves a subset of the greater [GetCulture('serb').GetName] culture. However, with centuries of separation and independent ruling dynasties, a lurking question has emerged: What if we are more than just wayward Serbs? What if there is meaning behind being [GetCulture('montenegrin').GetName]?"
 je_balkfm_mon_nationalism_possible_1: "[ROOT.GetCountry.GetNameNoFlag] has not #bold United with Serbia#!"
 je_balkfm_mon_nationalism_possible_2: "#bold $je_balkfm_unification_of_yugoslavia$#! [concept_journal_entry] has activated"
 je_balkfm_mon_nationalism_complete_1: "[ROOT.GetCountry.GetNameNoFlag] has not #bold United with Serbia#!"
 je_balkfm_mon_nationalism_complete_2: "[ROOT.GetCountry.GetNameNoFlag] has its [concept_capital_state] in [GetStateRegion('STATE_MONTENEGRO').GetName]"
 je_balkfm_mon_nationalism_fail_1: "[ROOT.GetCountry.GetNameNoFlag] has formed #bold $YUG$#!"
 je_balkfm_mon_nationalism_fail_2: "[ROOT.GetCountry.GetNameNoFlag] has #bold United with Serbia#!"
 je_balkfm_mon_nationalism_on_complete_1: "#v 90%#! of [GetCulture('serb').GetName] [concept_pop]#o s#! in [GetStateRegion('STATE_MONTENEGRO').GetName] will assimilate to the [GetCulture('montenegrin').GetName] culture"
 je_balkfm_mon_nationalism_on_complete_2: "Any remaining [GetCulture('serb').GetName] [concept_pop]#o s#! in [GetStateRegion('STATE_MONTENEGRO').GetName] will be fully radicalized"
 
 # Journal Entry Lobby Text
 je_balkfm_mon_prince_bishopric_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_ip3$\nTo many, the country of Montenegro seems like a ghost from the distant past. With nation-states to the west and empires to the east, the small nation endures as a reminder of Europe's feudal past. The ascent of Petar II to the throne has finally heralded change in the Prince-Bishopric. Invigorated by the ideals of his father, Petar I, and by liberalism from the West, the young Bishop hopes to bring the light of modernity to Montenegro."
 je_balkfm_mon_ali_pasha_lobby: "$gbbf_journal_lobby$\n#yellow Montenegro#! has been set upon by the Vizier of Herzegovina, #yellow Ali Pasha Rizvanbegović#!. Determined to increase their influence in the eyes of the Porte, both Ali Pasha and #yellow Osman Pasha Skopljak#!, the Vizier of Scutari, have committed themselves to finally bringing Montenegro into the holdings of the #yellow Ottoman Empire#!."

 # Decisions
 balkfm_mon_declare_kingdom_decision: "Declare the Kingdom of Montenegro"
 balkfm_mon_declare_kingdom_decision_desc: "Montenegro has survived as a marginal power within the Balkans for generations. We are now ready to signal our intent to join the world stage by elevating our state to the prestige befitting the Kingdoms of old."
 balkfm_great_montenegrivation_decision: "The Great Montenegrivation"
 balkfm_great_montenegrivation_decision_desc: ""In the wake of national stagnation and a crippling lack of vodka, Prince Nikola I montenegrieved all over the royal palace. It was quite disgusting.""

