 balkfm_yugoslavia.008.t: "Yugoslavism Fizzles Out"
 balkfm_yugoslavia.008.d: "With the collapse of the last holdouts of Yugoslavism, the dream of a unified state for the South Slavs is dead."
 balkfm_yugoslavia.008.f: "\"Hey, Slavs, there still lives the word (spirit) of our grandfathers\nWhile for the nation beats the heart of its sons!\nThere lives, there lives the Slavic spirit, It will live for ages!\""
 balkfm_yugoslavia.008.a: "Truly a terrible day."
 balkfm_yugoslavia.009.t: "The Birth of Yugoslavia"
 balkfm_yugoslavia.009.t1: "The [SCOPE.sCountry('yugoslav_formation_scope').GetCapital.GetCityHubName] Declaration"
 balkfm_yugoslavia.009.d: "Having broken free from the yoke of the Ottoman and Austrian empires, the Slavic peoples of the Balkans have unified into a single nation. In a series of rousing speeches in [SCOPE.sCountry('yugoslav_formation_scope').GetCapital.GetCityHubName], Yugoslavist leaders have declared the foundation of [SCOPE.sCountry('yugoslav_formation_scope').GetName]."
 balkfm_yugoslavia.009.f: "Freedom. Not mere release from the shackles, but true freedom. No longer caught between hammer and anvil, hound and hunter, the time has come for a new union. A new pact between Slavs for all to see."
 balkfm_yugoslavia.009.a: "A glorious union."

 balkfm_yugoslavia.010.t: "Yugoslavist Provocation" # Provokatur Event
 balkfm_yugoslavia.010.d: "With our support, #yellow #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] Yugoslav#!#! radicals in [SCOPE.sState('balkfm_rebellion_state_scope').GetCityHubName] have seized control of the regional capital and declared the independence of [SCOPE.sCountry('balkfm_rebellion_scope').GetName]. They have issued a call for international aid and recognition."
 balkfm_yugoslavia.010.f: "\"There are at least 5 million people who speak the same language, but by religion they can be split into three groups... Only the first 3 million call themselves Serbs, but the rest will not accept the name.\" -Vuk Karadžić, 1849"
 balkfm_yugoslavia.010.a: "All slavs deserve their freedom."
 balkfm_yugoslavia.011.t: "Yugoslavist Provocation in [SCOPE.sState('balkfm_rebellion_state_scope').GetName]" # Austrian Event
 balkfm_yugoslavia.011.d: "#yellow #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] Yugoslav#!#! radicals in [SCOPE.sState('balkfm_rebellion_state_scope').GetName] have seized control of the regional capital and declared the independence of [SCOPE.sCountry('balkfm_rebellion_scope').GetName]. They demand immediate recognition by and independence from the [ROOT.GetCountry.GetAdjectiveNoFlag] administration."
 balkfm_yugoslavia.011.f: "\"Wherever they went, a broad line of blood marked the track behind them; and as far as their dominion reached, civilisation disappeared from view. They represented everywhere government by force, as opposed to government by law. For the guide of this life they had a relentless fatalism: for its reward hereafter, a sensual paradise.\" -E. Gladstone, 1876"
 balkfm_yugoslavia.011.a: "Put them down!"
 balkfm_yugoslavia.011.b: "Grant them autonomy."
 balkfm_yugoslavia.012.t: "Yugoslavist Provocation in [SCOPE.sState('balkfm_rebellion_state_scope').GetName]" # Ottoman Event
 balkfm_yugoslavia.012.d: "#yellow #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] Yugoslav#!#! radicals in [SCOPE.sState('balkfm_rebellion_state_scope').GetName] have seized control of the regional capital and declared the independence of [SCOPE.sCountry('balkfm_rebellion_scope').GetName]. They demand immediate recognition by and independence from the [ROOT.GetCountry.GetAdjectiveNoFlag] administration."
 balkfm_yugoslavia.012.f: "\"Wherever they went, a broad line of blood marked the track behind them; and as far as their dominion reached, civilisation disappeared from view. They represented everywhere government by force, as opposed to government by law. For the guide of this life they had a relentless fatalism: for its reward hereafter, a sensual paradise.\" -E. Gladstone, 1876"
 balkfm_yugoslavia.012.a: "Put them down!"
 balkfm_yugoslavia.012.b: "Grant them autonomy."
