 balkfm_yugoslavia.105.t: "National Assemblies?"
 balkfm_yugoslavia.105.d: ""
 balkfm_yugoslavia.105.f: ""
 balkfm_yugoslavia.105.a: "Reduce them to an advisory role."
 balkfm_yugoslavia.105.b: "Allow the assemblies some local authority."
 balkfm_yugoslavia.105.c: "Disband these assemblies."
 
 balkfm_yugoslavia.106.t: "The Great [SCOPE.sCulture('balkfm_culture_scope').GetName] State"
 balkfm_yugoslavia.106.d: ""
 balkfm_yugoslavia.106.f: "\"In any case, the realization of our Serb political ideal presents itself as an unavoidable need of all Slavs, whom Your Imperial Majesty needs to lead. Because the unification of Serb lands: Serbia, Old Serbia, parts of Macedonia, Bosnia and Herzegovina, Croatia and Montenegro, would make one state of 280,000 square kilometers with a pure Slavic population of 10 millions.\" —Aleksandar Karađorđević, to Tsar Nicholas II, 1912"
 balkfm_yugoslavia.106.a: ""
 balkfm_yugoslavia.106.b: ""
 
 balkfm_yugoslavia.107.t: "Amputating [SCOPE.sCulture('balkfm_culture_scope').GetName]"
 balkfm_yugoslavia.107.d: ""
 balkfm_yugoslavia.107.f: "\"...these same elements, brothers and friends, which  present our legal struggle as anti-state, these same elements which treat  our most justified demands as treasonous, suggested that high treason be carried out: the amputation of our regions from the state community!\" —Svetozar Pribićević, 1918"
 balkfm_yugoslavia.107.a: ""
 balkfm_yugoslavia.107.b: ""
 
 balkfm_yugoslavia.108.t: "Denouncing Internal Enemies"
 balkfm_yugoslavia.108.d: ""
 balkfm_yugoslavia.108.f: "\"You must, by 20 December 1933, submit a report on the fulfillment of this as well as on the observed effect which this brochure will produce, and on other observations related to it.\n\nUnder the letter “A” you will provide the names of the separatists, and under the letter “B” the names of the national people to whom you sent or gave the brochure, as well as their place of residence.\"\n —Draft of KBUSB letter to district and local police and district chiefs, November 1933"
 balkfm_yugoslavia.108.a: ""
 balkfm_yugoslavia.108.b: ""

 balkfm_yugoslavia.temp: "\"Wherever they went, a broad line of blood marked the track behind them; and as far as their dominion reached, civilisation disappeared from view. They represented everywhere government by force, as opposed to government by law. For the guide of this life they had a relentless fatalism: for its reward hereafter, a sensual paradise.\" —E. Gladstone, 1876"