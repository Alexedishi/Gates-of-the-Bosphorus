 balkfm_yugoslavia.011.a: "$mon_state_formation.5.a$"
 
 balkfm_yugoslavia.012.t: "The Mountain Wreath"
 balkfm_yugoslavia.012.d: "Following a year of dedication, [SCOPE.sCountry('montenegro_scope').GetRuler.GetFullName], the [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle] of [SCOPE.sCountry('montenegro_scope').GetName], has published his epic work, #yellow The Mountain Wreath#!. A grandiose work of Montenegrin epic poetry, the massive poem tells a heroic story of Montenegrin defiance against the forces that would see it erased from the Balkans. In providing this work to the masses, [SCOPE.sCountry('montenegro_scope').GetRuler.GetFirstName] has lit a beacon that calls for the unification of the Slavic peoples under one independent flag."
 balkfm_yugoslavia.012.f: "\"When things go well 'tis easy to be good,/nIn suffering one learns who is the hero!\"\n -The Mountain Wreath, Verses 137–138"
 balkfm_yugoslavia.012.a: "Our spirit will never be extinguished."
 balkfm_yugoslavia.012.b: "This will only stoke tensions..."

 balkfm_yugoslavia.013.t: "Vienna Literary Agreement"
 balkfm_yugoslavia.013.d: "Intellectuals from the [GetCulture('serb').GetName], [GetCulture('croat').GetName], and [GetCulture('slovene').GetName] have gathered in [SCOPE.sCountry('austria_scope').GetCapital.GetCityHubName] with the aim of unifying and potentially standardizing their literary languages. While no binding agreements were made, the consensus has been that the #yellow Shtokavian#! dialect should be the basis for a future standard."
 balkfm_yugoslavia.013.f: "\"There can only be one true literary language in Illyria... It is not found in a single place, or a single country, but in the whole of Illyria... Our grammar and our dictionary is the whole of Illyria. In that huge garden there are beautiful flowers everywhere: let us gather everything of the best in one wreath, which will never wither.\" —L. Gaj, 1835""
 balkfm_yugoslavia.013.a: "An interesting exercise."

