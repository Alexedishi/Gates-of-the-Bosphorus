l_english:
 balkfm_yugoslavia.001.t1: "Illyrian Sentiment"
 balkfm_yugoslavia.001.t2: "Jugoslavism"
 balkfm_yugoslavia.001.t3: "\"The Draft""
 balkfm_yugoslavia.001.t4: "The Yugoslav Empire"
 balkfm_yugoslavia.001.d1: "As tensions rise against the imperialist powers in the Balkans, the ideals of the #yellow Illyrian Movement#! have been to spread across the South Slav people. Developed from the works of several [GetCulture('croat').GetName] scholars, this has grown into a movement to liberate all Slavs from Austrian and Ottoman rule."
 balkfm_yugoslavia.001.d2: "The publication of a Serbian nationalist document has caused a stir in the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s court. Named "the Draft" by its author#yellow  Ilja Garašanin#!, it lays out a diplomatic plan for a union of the Slavs in the Balkans."
 balkfm_yugoslavia.001.d3: "During a meeting with Prince [ROOT.GetCountry.GetRuler.GetLastName], nationalist politician, [SCOPE.sCharacter('garasanin_scope').GetFullName] has presented him and his court with an ambitious design: the restoration of the Serbian Empire through union with the South Slavs currently under the Ottoman thumb. Drawing heavily from the writings of Polish diplomat, #yellow Adam Jerzy Czartoryski#!, Garašanin has put forward the idea of a Yugoslavic union. Further inspired by nationalism imported from the West, he has condensed his ideas into a plan named "Načertanije," or "The Draft.\""
 balkfm_yugoslavia.001.d4: "With our position secure in the eastern Balkans, nationalist thinkers have declared that it is the destiny of the [ROOT.GetCountry.GetName] to reach from the Black Sea to the Adriatic."
 balkfm_yugoslavia.001.f1: "\"Our intention is not to abolish individual names, but unify them under a general name, because each of the individual names carries its own individual history, which gathered together comprise a more general history of the Illyrian nation.\" -Ljudevit Gaj, 1839"
 balkfm_yugoslavia.001.f2: "Drawing heavily from the writings of Polish diplomat, #yellow Adam Jerzy Czartoryski#!, Garašanin has put forward the idea of a Yugoslavic union. Further inspired by nationalism imported from the West, he has condensed his ideas into a plan named "Načertanije," or "The Draft.\""
 balkfm_yugoslavia.001.f3: "\"...My son, [SCOPE.sCharacter('garasanin_scope').GetFirstName], has long desired to be accepted into state service and be given a post for which he is prepared, provided that Your Highness decides to grant him that honor.\" -M. Garašanin, to Prince Miloš, 1833"
 balkfm_yugoslavia.001.f4: "The dream of liberation from the Ottoman yoke will not be fully realized until all of the #yellow #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] Jugoslav#!#! peoples live under our banner."
 balkfm_yugoslavia.001.a: "We will unite with our $balkfm_south_slav$ brothers!"
 balkfm_yugoslavia.001.b: "This is an a untenable idea."
 balkfm_yugoslavia.002.t: "The Mountain Wreath"
 balkfm_yugoslavia.002.d: "Following a year of dedication, [SCOPE.sCountry('montenegro_scope').GetRuler.GetFullName], the [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle] of [SCOPE.sCountry('montenegro_scope').GetName], has published his epic work, #yellow The Mountain Wreath#!. A grandiose work of Montenegrin epic poetry, the massive poem tells a heroic story of Montenegrin defiance against the forces that would see it erased from the Balkans. In providing this work to the masses, [SCOPE.sCountry('montenegro_scope').GetRuler.GetFirstName] has lit a beacon that calls for the unification of the Slavic peoples under one independent flag."
 balkfm_yugoslavia.002.f: "\"When things go well 'tis easy to be good,/nIn suffering one learns who is the hero!\"\n -The Mountain Wreath, Verses 137–138"
 balkfm_yugoslavia.002.a: "Our spirit will never be extinguished."
 balkfm_yugoslavia.002.b: "This will only stoke tensions..."
 balkfm_yugoslavia.003.t: "Vienna Literary Agreement"
 balkfm_yugoslavia.003.d: "Intellectuals from the [GetCulture('serb').GetName], [GetCulture('croat').GetName], and [GetCulture('slovene').GetName] have gathered in [SCOPE.sCountry('austria_scope').GetCapital.GetCityHubName] with the aim of unifying and potentially standardizing their literary languages. While no binding agreements were made, the consensus has been that the #yellow Shtokavian#! dialect should be the basis for a future standard."
 balkfm_yugoslavia.003.f: "\"There can only be one true literary language in Illyria... It is not found in a single place, or a single country, but in the whole of Illyria... Our grammar and our dictionary is the whole of Illyria. In that huge garden there are beautiful flowers everywhere: let us gather everything of the best in one wreath, which will never wither.\" -L. Gaj, 1835""
 balkfm_yugoslavia.003.a: "An interesting exercise."
