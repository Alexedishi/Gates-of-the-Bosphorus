 balkfm_yugoslavia.015.t: "[SCOPE.sCountry('balkfm_yugoslav_union_scope').GetName] Seeks Union"
 balkfm_yugoslavia.015.d: "[SCOPE.sCountry('balkfm_yugoslav_union_scope').GetName] has taken the bold step of asserting its independence against its former overlords. In an inflammatory manifesto, [SCOPE.sCountry('balkfm_yugoslav_union_scope').GetRuler.GetFullName] has declared that their country seeks political union with [ROOT.GetCountry.GetName]."
 balkfm_yugoslavia.015.f: "Negotiations have gone surprisingly smoothly and there is optimism for the union of our states. However, detractors continue to warn of the risks of further disruptions in the Balkans."
 balkfm_yugoslavia.015.a: "We welcome our #yellow #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] Yugoslav#!#! brothers!"
 balkfm_yugoslavia.015.b: "This is not the right time, patience will be rewarded."
 balkfm_yugoslavia.016.t: "[SCOPE.sCountry('balkfm_yugoslav_union_scope').GetName] Seeks Union"
