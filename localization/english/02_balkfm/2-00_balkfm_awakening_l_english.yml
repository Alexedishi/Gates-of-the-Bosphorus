l_english:
# Journal Entries
 je_balkfm_cultural_identity: "A National Identity"
 je_balkfm_cultural_identity_reason: "The [ROOT.GetCountry.GetAdjectiveNoFormatting] people have been subject to Ottoman rule for well over four centuries. Since the ottoman conquest, the [ROOT.GetCountry.GetAdjectiveNoFormatting] lands have been divided between many Ottoman administrative units, tearing apart the common fabric of former nation. This has begun to change with the emergence of dozens of western-educated revivalist thinkers, who collectively advocate for the continued existence of a [ROOT.GetCountry.GetAdjectiveNoFormatting] identity and for the right and duty of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people to overthrow their Turkish oppressors.\n$TOOLTIP_DELIMITER$\nThe #yellow [ROOT.GetCountry.GetAdjectiveNoFormatting] Revivalist#! Movement has garnered #bold [GetPlayer.MakeScope.Var('balkfm_revivalism_var').GetValue]/1000#! momentum. This is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_cultural_identity_sources [GetPlayer.MakeScope.ScriptValue('balkfm_revivalism_progress_value')]#! next month.\n$TOOLTIP_DELIMITER$\nThis can be influenced by the following factors:\n • Increasing our [concept_literacy] rate\n • Increasing our [concept_prestige] and the [concept_clout] of the $gbbf_intelligentsia$\n • Researching [GetTechnology('nationalism').GetName]\n • Increasing our level of [concept_autonomy]\n • Completing the #bold Exarchate of Bulgaria#! [concept_journal_entry]"
 je_balkfm_cultural_identity_status: "The #yellow Revivalist Movement#! is contributing [GetPlayer.MakeScope.ScriptValue('balkfm_revivalism_recognition_value')] momentum towards the #bold $je_earn_recognition$#! [concept_journal_entry]."
 je_balkfm_cultural_identity_sources: "[Country.MakeScope.GetScriptValueDesc('balkfm_revivalism_progress_value')]"

 je_balkfm_bul_bulgarian_exarchate: "The Exarchate of Bulgaria"
 je_balkfm_bul_bulgarian_exarchate_reason: "The #yellow Exarchate#! has garnered #bold [GetPlayer.MakeScope.Var('eocfm_schism_var').GetValue]/400#! momentum. This is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_balkfm_bul_bulgarian_exarchate_sources [GetPlayer.MakeScope.ScriptValue('eocfm_schism_progress_value')]#! next month.\n$TOOLTIP_DELIMITER$\nDuring the Byzantine Era, the Bulgarian state contested control of the Balkans with the ailing #bold Romanía#!. Over the course of their rivalry, the #bold Bulgarian Empire#! extracted both diplomatic recognition and ecclesiastic independence from the Baselius. Organizes as the Tarnovo Patriarchate, this church cemented the use of the Bulgarian language in their lands until it was violently reintegrated with the Ecumenical Patriarchate following the Fall of Constantinople to the Ottoman Empire.\n\nWithin the last century, the Phanariote Greeks has sought to extend their influence over the Bulgarian lands by enforcing Greek as the language of the Church. The Church has served as a bastion of Bulgarian identity since the Ottoman conquests and many fear that the displacement of the Bulgarian language from liturgy is just the first step in the erasure of Bulgarian identity as a whole."
 je_balkfm_bul_bulgarian_exarchate_complete_tt: "The #yellow Exarchate#! has gathered #bold 400#! momentum."
 je_balkfm_bul_bulgarian_exarchate_goal: "The progress bar is full"
 je_balkfm_bul_bulgarian_exarchate_status: "The #yellow Exarchate#! has #bold [GetPlayer.MakeScope.Var('eocfm_schism_var').GetValue]/400#! momentum."
 je_balkfm_bul_bulgarian_exarchate_sources: "[Country.MakeScope.GetScriptValueDesc('eocfm_schism_progress_value')]"

 je_balkfm_national_awakening: "$je_balkan_national_awakenings$"
 je_balkfm_national_awakening_reason: "$je_balkan_national_awakenings_reason$"

 # Journal Entry Lobby Text
 je_balkfm_cultural_identity_lobby: "For centuries, our people have lived under the thumb of foreign Empires. With the emergence of dozens of western-educated revivalist thinkers, our people have begun to sense a duty to claim cultural identity."
 je_balkfm_national_awakening_lobby: "Whilst our country has taken its first steps towards nationhood, it remains a land of peasants. Much of our populace continues to view the world through the lens of village and clan, rather than that of national brotherhood. We must foster cultural [concept_fervor] amongst our populace, and construct a unified nation from our people."

 # Scripted Progress Bars
 balkfm_cultural_identity_progressbar: "Cultural Identity Progress"
 balkfm_cultural_identity_progressbar_desc: "Cultural Identity Progress"
 balkfm_national_awakening_progressbar: "National Awakening Progress"
 balkfm_national_awakening_progressbar_desc: "National Awakening Progress"