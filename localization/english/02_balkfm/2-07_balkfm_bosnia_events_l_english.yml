l_english:
 # Bosnia Events
 balkfm_bosnia.001.t: "The Small Land of the Serbs"
 balkfm_bosnia.001.d: "For centuries, [ROOT.GetCountry.GetName] has been subject to external powers from the Greeks to the Ottomans. Having secured autonomy over their own affairs, the [GetCulture('bosniak').GetName] can finally claim their own destiny."
 balkfm_bosnia.001.f: "\"These are the counties of Herzegovina: Prijepolje, Pljevlja with Kolašin and Šaranci with Drobnjak, Čajniče, Nevesinje, Nikšić, Ljubinje-Trebinje, Stolac, Počitelj, Blagaj, Mostar, Duvno and half of the county of Konjic which is on this side of Neretva. This was given to me, my children and my kin, and I have done this to prevent that some bad pasha rule over Herzegovina. I thought that it was better that I, as a native, should rule over Herzegovina, instead of some alien; nobody could be fiend to his own house. I will judge everybody by justice...\" -Ali Pasha Rizvanbegović, 1833"
 balkfm_bosnia.001.a: "[ROOT.GetCountry.GetName] will find its way."
 balkfm_bosnia.002.t: "Tribal Conflicts"
 balkfm_bosnia.002.d1: "A missive has arrived to inform us that our militias, led by our trusted warlord [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! have had their demands for Haraç rejected by [SCOPE.sCountry('montenegro_scope').GetName]."
 balkfm_bosnia.002.d2: "In a shocking turn of events, a militia that approached [SCOPE.sCountry('montenegro_scope').GetName] to demand tribute has arrived with a different prize: the submission of the Price-Bishopric to [ROOT.GetCountry.GetName]."
 balkfm_bosnia.002.f: "The [GetStrategicRegion('region_balkans').GetName] are no stranger to tribal violence. In the hinterlands, tribal feuds and customs often take precedence over the law of the Sultan."
 balkfm_bosnia.002.a: "The Prince-Bishop will learn humility."
 balkfm_bosnia.002.b: "They will serve us well."
 balkfm_bosnia.003.t: "The Reordering Begins"
 balkfm_bosnia.003.d: "Messengers have arrived from Constantinople to report the promulgation of the Edict of Gülhane. As the next phase of the Tanzimât, the Sultan has directed all members to carry out its imperatives towards modernization... regardless of any erosion of powers held by the nobility and governors."
 balkfm_bosnia.003.f: "“If you apply Tanzimât in Bosnia Herzegovina, you will not be able to sustain them for even thirty years.” -Ali Pasha"
 balkfm_bosnia.003.a: "We will join in this lofty goal."
 balkfm_bosnia.003.b: "These plans are unreasonable."
 balkfm_bosnia.005.t: "Disruptive Influence"
 balkfm_bosnia.005.d: "A communiqué arrived in [SCOPE.sState('northern_serbia_state_scope').GetCityHubName] this morning, suggesting that the Ottoman bey, [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! [SCOPE.sCharacter('smail_aga_scope').GetLastName], has conspired to usurp [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName] as Vizier of Herzegovina. Advisors to the Prince have warned this could endanger our Serb cousins in [SCOPE.sCountry('montenegro_scope').GetName]."
 balkfm_bosnia.005.f: "The Prince-Bishop of #yellow Montenegro#! has found himself assailed by the political intrigue of the Porte, with his borders threatened by #yellow Ali Pasha#!. While we cannot act openly against other subjects of our Ottoman overlords, we could aid [SCOPE.sCharacter('montenegro_ruler_scope').GetFullName] in sowing discord in their ranks."
 balkfm_bosnia.005.a: "Send the Pasha a letter."
 balkfm_bosnia.005.b: "We do not deal in idle gossip."
 balkfm_bosnia.006.t1: "Ali Pasha's Demise"
 balkfm_bosnia.006.t2: "Ali Pasha Deposed"
 balkfm_bosnia.006.t3: "Ali Pasha Ascendant"
 balkfm_bosnia.006.d1: "The $turkfm_porte$'s justice came swiftly. Without warning, the vaunted [SCOPE.sCharacter('omer_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('omer_pasha_scope').GetLastName] arrived to restore control in [SCOPE.sCountry('hersek_scope').GetName]. Ali Pasha has been deposed and executed for asserting his autonomy, and the Sultan has declared his intent to restore central authority in [GetStateRegion('STATE_BOSNIA').GetName]."
 balkfm_bosnia.006.d2: "The $turkfm_porte$'s justice came swiftly. Without warning, the vaunted [SCOPE.sCharacter('omer_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('omer_pasha_scope').GetLastName] arrived to restore control in [SCOPE.sCountry('hersek_scope').GetName]. Ali Pasha has been detained and removed from power for asserting his autonomy, and the Sultan has declared his intent to restore central authority in [GetStateRegion('STATE_BOSNIA').GetName]."
 balkfm_bosnia.006.d3: "Through a combination of arrogance and audacity, Ali Pasha has secured his reign over [SCOPE.sCountry('hersek_scope').GetName]. Styling himself as the "Sultan in Mostar," Ali Pasha stands as a hereditary ruler rather than an appointed governor."
 balkfm_bosnia.006.f1: "A direct and loyal man, #yellow Ömer Pasha Lütfi#! has already established himself as a capable commander capable of navigating the powder-keg that is the Balkans. Dedicated to serving the Porte, Ömer Pasha has developed a reputation for bringing justice to the native nobility whenever their interests do not align that those of the $turkfm_porte$."
 balkfm_bosnia.006.f2: "\"From today on, nobody needs to go to the emperor in Constantinople any longer. Here in Mostar is your Constantinople, and here in Mostar is your emperor."  -Ali Pasha Rizvanbegović, 1833"
 balkfm_bosnia.006.a: "Is the [ROOT.GetCountry.GetAdjectiveNoFlag] dream dead?"
 balkfm_bosnia.006.b: "Good riddance!"
 balkfm_bosnia.007.t: "The Lands of Montenegro"
 balkfm_bosnia.007.d: "With both resolute leadership and the fierce spirit of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has brought the entirety of [GetStateRegion('STATE_MONTENEGRO').GetName] under the control of [ROOT.GetCountry.GetName]."
 balkfm_bosnia.007.f: "After centuries of resisting invasions and imperialist designs, Montenegro has finally been brought to heel."
 balkfm_bosnia.007.a: "[ROOT.GetCountry.GetRuler.GetFirstName] shall rule as a new Sultan!"
 balkfm_bosnia.008.t: "Failed Ambitions"
 balkfm_bosnia.008.d: "With the death of Ali Pasha has come the collapse of his ambitions for an independent Bosnia. While [ROOT.GetCountry.GetRuler.GetFullName] is motivated to rule, it is clear he lacks the deep connections of his father."
 balkfm_bosnia.008.f: "“If we do not stop Omer Pasha now, Bosnia will not belong to Bosnians in 30 years.” -Ali Pasha, c.1850"
 balkfm_bosnia.008.a: "[ROOT.GetCountry.GetName] must find its way."
 balkfm_bosnia.009.t: "House Rizvanbegović of Bosnia"
 balkfm_bosnia.009.d: "[ROOT.GetCountry.GetRuler.GetFullName]'s rebellion against the [SCOPE.sCountry('ottoman_scope').GetName] has succeeded. With the rise of his Sultanate comes a new era in the [GetStrategicRegion('region_balkans').GetName]."
 balkfm_bosnia.009.f: "“There is a sultan in Istanbul, but I am the sultan in Mostar.” -Ali Pasha, 1841"
 balkfm_bosnia.009.a: "[ROOT.GetCountry.GetName] will make its own way."