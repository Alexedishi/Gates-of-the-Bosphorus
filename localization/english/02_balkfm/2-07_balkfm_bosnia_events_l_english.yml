l_english:
 # Bosnia Events
 balkfm_bosnia.001.t: "The Small Land of the Serbs"
 balkfm_bosnia.001.d: "For centuries, [ROOT.GetCountry.GetName] has been subject to external powers from the Greeks to the Ottomans. Having secured autonomy over their own affairs, the [GetCulture('bosniak').GetName] can finally claim their own destiny."
 balkfm_bosnia.001.f: "\"These are the counties of Herzegovina: Prijepolje, Pljevlja with Kolašin and Šaranci with Drobnjak, Čajniče, Nevesinje, Nikšić, Ljubinje-Trebinje, Stolac, Počitelj, Blagaj, Mostar, Duvno and half of the county of Konjic which is on this side of Neretva. This was given to me, my children and my kin, and I have done this to prevent that some bad pasha rule over Herzegovina. I thought that it was better that I, as a native, should rule over Herzegovina, instead of some alien; nobody could be fiend to his own house. I will judge everybody by justice...\" —Ali Pasha Rizvanbegović, 1833"
 balkfm_bosnia.001.a: "[ROOT.GetCountry.GetName] will find its way."
 balkfm_bosnia.002.t: "House Rizvanbegović of Bosnia"
 balkfm_bosnia.002.d: "Through a combination of arrogance and audacity, Ali Pasha has secured his reign over [SCOPE.sCountry('hersek_scope').GetName]. With the rise of his Sultanate comes a new era in the [GetStrategicRegion('region_balkans').GetName]."
 balkfm_bosnia.002.f: "\"There is a sultan in Istanbul, but I am the sultan in Mostar.\" —Ali Pasha, 1841"
 balkfm_bosnia.002.a: "[ROOT.GetCountry.GetName] will make its own way."
 balkfm_bosnia.003.t: "Failed Ambitions"
 balkfm_bosnia.003.d: "With the death of Ali Pasha has come the collapse of his ambitions for an independent Bosnia. While [ROOT.GetCountry.GetRuler.GetFullName] is motivated to rule, it is clear he lacks the deep connections of his father."
 balkfm_bosnia.003.f: "\"If we do not stop Omer Pasha now, Bosnia will not belong to Bosnians in 30 years.\" —Ali Pasha, c.1850"
 balkfm_bosnia.003.a: "[ROOT.GetCountry.GetName] must find its way."
 balkfm_bosnia.004.t: "The End of House $Rizvanbegovic$"
 balkfm_bosnia.004.d: "The $turkfm_porte$'s justice came swiftly. Without warning, the vaunted [SCOPE.sCharacter('omer_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('omer_pasha_scope').GetLastName] arrived to restore control in [SCOPE.sCountry('hersek_scope').GetName]. House $Rizvanbegovic$ has been deposed for asserting their autonomy, and the Sultan has declared his intent to restore central authority in [GetStateRegion('STATE_BOSNIA').GetName]."
 balkfm_bosnia.004.f: "A direct and loyal man, [SCOPE.sCharacter('omer_pasha_scope').GetFullNameNoFormatting] has already established himself as a capable commander capable of navigating the powder-keg that is the [GetStrategicRegion('region_balkans').GetName]. Dedicated to serving the Porte, [SCOPE.sCharacter('omer_pasha_scope').GetFirstNameNoFormatting] has developed a reputation for bringing justice to the native nobility whenever their interests do not align that those of the $turkfm_porte$."
 balkfm_bosnia.004.a: ""
 balkfm_bosnia.004.b: ""
 balkfm_bosnia.005.t: "The Reordering Begins"
 balkfm_bosnia.005.d: "Messengers have arrived from Constantinople to report the promulgation of the Edict of Gülhane. As the next phase of the Tanzimât, the Sultan has directed all members to carry out its imperatives towards modernization... regardless of any erosion of powers held by the nobility and governors."
 balkfm_bosnia.005.f: "\"If you apply Tanzimât in Bosnia Herzegovina, you will not be able to sustain them for even thirty years.\" —Ali Pasha"
 balkfm_bosnia.005.a: "We will join in this lofty goal."
 balkfm_bosnia.005.b: "These plans are unreasonable."