 balkfm_bulgaria.167.d: ""
 balkfm_bulgaria.167.f: ""
 balkfm_bulgaria.167.a: ""
 balkfm_bulgaria.168.t: "OPEN"
 balkfm_bulgaria.168.d: ""
 balkfm_bulgaria.168.f: ""
 balkfm_bulgaria.168.a: ""
 balkfm_bulgaria.169.t: "The Exarchate of Bulgaria"
 balkfm_bulgaria.169.d: "In recognition of our efforts, Sultan [SCOPE.sCountry('ottoman_scope').GetRuler.GetFirstName] has granted our request for self-government in ecclesiastic affairs. Exercising authority, he has promulgated a firman delineating our independence from the Ecumenical Patriarchate, completely bypassing our need to interact with the Greek church."
 balkfm_bulgaria.169.f: ""...But in spite of all this we observed with regret the disputes and controversies which contrary to our good will, have lately arisen between the Bulgarians of the Orthodox faith and the Greek Patriarchate, i.e. concerning the relations between the Bulgarian archbishops, bishops, priests, the Bulgarian Church and the Patriarchate. A special spiritual jurisdiction shall be established under the name of Bulgarian Exarchate..." -Sultan Abdülaziz's Firman Establishing the Bulgarian Exarchate, 28 February 1870"
 balkfm_bulgaria.169.a: "This is a great day for the [GetCulture('bulgarian').GetName] people."

 balkfm_bulgaria.200.t: "Insurgency in Niš"
 balkfm_bulgaria.200.d: "A group of [GetCulture('bulgarian').GetName] nationalists in [SCOPE.sState('southern_serbia_state_scope').GetName] recently incited an attempted rebellion against the [SCOPE.sCountry('ottoman_scope').GetName]. While they were quickly arrested by the local garrison, the Phanariot-dominated clergy have claimed responsiblity as a means to legitimize their claims of authority over these lands."
 balkfm_bulgaria.200.f: "Alleging non-compliance with the protections granted to them under the Gülhane Hatt-ı Şerif, Bulgarian nationalists have attempted to launch a Serbian-style rebellion in the #yellow Niš Eyalet#!."
 balkfm_bulgaria.200.a: "The Bulgarians should claim responsibility for the attack."
 balkfm_bulgaria.200.b: "Let the Greeks suffer the consequences."
 balkfm_bulgaria.201.t: "The Bulgarian Eagle"
 balkfm_bulgaria.201.d: "In support of the Bulgarian cause from abroad, revivalist Ivan Bogorov has begun the publication a pro-Bulgarian newspaper, the "Bulgarian Eagle," in Constantinople. Targeted for domestic consumption by the elites of the Queen of Cities, the paper aims to legitimize Bulgarian Nationalism amongst Ottoman intellectuals by portraying the day-to-day struggles of the Bulgarian people in a sympathetic fashion."
 balkfm_bulgaria.201.f: "The idea of the Bulgars as sub-section of the Rûm Millet is not a totally foreign one to the #bold Porte#!, but senior officials have voiced concerns that direct support or acknowledgement by the Eyalet administration may further destabilize the Empire."
 balkfm_bulgaria.201.a: "This is a noble cause."
 balkfm_bulgaria.201.b: "Suppress public knowledge of this paper."
 balkfm_bulgaria.206.t: "The Bulgarian Legion"
 balkfm_bulgaria.206.d: ""
 balkfm_bulgaria.206.f: ""
 balkfm_bulgaria.206.a: "We should support their efforts"
 balkfm_bulgaria.206.b: "Condemn these radicals."
 balkfm_bulgaria.207.t: "The Legion Strikes Again!"
 balkfm_bulgaria.207.d: ""
 balkfm_bulgaria.207.f: ""
 balkfm_bulgaria.207.a: "This is the will of the people."
 balkfm_bulgaria.207.b: "This is madness. Arrest them!"
 balkfm_bulgaria.208.t: "Great Powers Support Bulgaria"
 balkfm_bulgaria.208.d: "Years of tireless diplomacy have come to fruition with the Great Powers openly declaring their support for increased autonomy for the Bulgarian people."
 balkfm_bulgaria.208.f: "While their support comes with no guarantees of what form this autonomy would have, this nonetheless represents a tremendous step for the Bulgarian cause."
 balkfm_bulgaria.208.a: "[SCOPE.sCountry('russia_scope').GetName] will lead us to freedom."
 balkfm_bulgaria.208.b: "[SCOPE.sCountry('austria_scope').GetAdjective] power will safeguard our liberty."
 balkfm_bulgaria.208.tt1: "We will now be empowered to become #bold Bulgaria#!."
 balkfm_bulgaria.208.tt2: "#bold Russia#! will become inclined to support us."
 balkfm_bulgaria.208.tt3: "#bold Austria#! will become inclined to support us."
 balkfm_bulgaria.209.t: "Securing our Sovereignty"
 balkfm_bulgaria.209.d: "As the celebrations and jubilation for the rebirth of [ROOT.GetCountry.GetName] fade away, the conversation has turned to the question of overall structure of the new [ROOT.GetCountry.GetAdjectiveNoFlag] state. The Great Powers have balked at the idea of full autonomy, with a consesus forming around establishing a Principality in similar fashion to Serbia and the Romanian Principalities. Many candidates have been put forward, with a German noble, #yellow Alexander Joseph von Battenburg#! garnering the widest support."
 balkfm_bulgaria.209.f: "Popular opinion favors a native candidate, but foreign consuls have warned of implications towards foreign support should we put forward a disagreeable candidate."
 balkfm_bulgaria.209.1: "The young noble, #yellow Alexander of Battenburg#!, has the most widespread support."
 balkfm_bulgaria.209.1.tt: "This is the historical option."
 balkfm_bulgaria.209.2: "The diplomat #yellow Emmanuel Bogoridi#! is worthy of the title."
 balkfm_bulgaria.209.3: "The revivalist, #yellow Alexander Exarch#!, would be a worthy steward."

 balkfm_bulgaria.210.t: "Dreams of the Tsardom"
 balkfm_bulgaria.210.d: "[ROOT.GetCountry.GetName] may be reborn, but it exists only as a shadow of its full potential. To the west and south, our countrymen still live under the Ottoman thumb. Both the Prince and leaders in the National Assembly have demanded further concessions be made to the Bulgarian state."
 balkfm_bulgaria.210.f: "Historical Note: The 1878 Treaty of San Stefano had originally provided for extreme gains in favor of the newly formed Bulgarian state. Months later, the vast majority of these conquests were reversed in the Treaty of Berlin which favored recognition of Serbia, Montenegro, and Romania. This left Bulgaria with only its lands north of the Balkan mountains and the remainder within East Rumelia with both under Ottoman suzerainty."
 balkfm_bulgaria.210.a: "We cannot abandon our brothers."
 balkfm_bulgaria.211.t: "The Tophane Agreement"
 balkfm_bulgaria.211.d: "[SCOPE.sState('bulgaria_capital_scope').GetCityHubName] erupted with cheers this morning on the news that the Rumelian puppet government has been overthrown and a union established between [ROOT.GetCountry.GetName] and [SCOPE.sCountry('rumelia_scope').GetName]. While we remain under Ottoman suzerainty, this is the first step in restoring the Bulgarian state."
 balkfm_bulgaria.211.f: ""Brothers! The hour of our Union has struck. The foreign government which has oppressed Roumelia for six years is overthrown. In it's place is proclaimed her union with the Principality of [ROOT.GetCountry.GetNameNoFlag], under the sceptre of the Bulgarian Prince, [ROOT.GetCountry.GetRuler.GetFullName]!" - Major D. Nikolaev, 1885"
 balkfm_bulgaria.211.a: "This is a great day for [ROOT.GetCountry.GetName]."
 balkfm_bulgaria.212.t: "An Independent Bulgaria"
 balkfm_bulgaria.212.d: "In a rousing Proclamation in the Church of the Forty Martyrs, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has sent shock-waves across the Balkan world by declaring the both the independence of [ROOT.GetCountry.GetName] and the annexation of East Rumelia. Since the Treaty of Berlin, the suzerainty of the Ottoman Empire has been little more than a pretentious illusion. The Bulgarian state has ruled itself with its own laws and customs, and, with this act, the legal fiction binding us to the [SCOPE.sCountry('ottoman_scope').GetName] has been cast to the wind."
 balkfm_bulgaria.212.f: ""The West has pronounced its anathema on me, the dawn of the East shines its rays on my dynasty and brightens our future!" -Ferdinand I, to the Sobranije, 1887"
 balkfm_bulgaria.212.a: "[ROOT.GetCountry.GetName] will triumph."
 balkfm_bulgaria.213.t: "Bulgarian Irredentism"
 balkfm_bulgaria.213.d: "The miracle of union with Eastern Rumelia has brought the original goals of the Treaty of San Stefano back into focus. As nationalist fervor grips [ROOT.GetCountry.GetName], the most ardent believers demand that all Bulgarians should live under our flag."
 balkfm_bulgaria.213.f: "Ever since their arrival in the Balkans, Bulgarian communities have reached from the banks of the Danube to the shores of the Aegean. The partition of the Bulgarian nation is a legal fiction that we will redress!"
 balkfm_bulgaria.213.a: "These are Bulgarian lands."
 balkfm_bulgaria.213.b: "We cannot anger the Great Powers."
 balkfm_bulgaria.214.t: "The Tsardom of Bulgaria"
 balkfm_bulgaria.214.d: "With the lands of Greater Bulgaria well within our control, [ROOT.GetCountry.GetName] has reclaimed the lands held by the Bulgarian Empires of old."
 balkfm_bulgaria.214.f: "From 681 to 1018 and again from 1185 to 1396 the Bulgarian Empire dominated the northern Balkans, many times even extracting tributes and concessions from the Byzantine Emperors."
 balkfm_bulgaria.214.a: "The Bulgarian state will rule the Balkans."
 balkfm_bulgaria.214.b: "We should be proud of what we've accomplished."
 balkfm_bulgaria.215.t: "The Future of [ROOT.GetCountry.GetName]"
 balkfm_bulgaria.215.d: "Our latest conquests have secured our dominance over the Balkans. Our people now look to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to determine the future of the Bulgarian state."
 balkfm_bulgaria.215.f: "We have secured our independence from our Greek, $RUS_ADJ$, and Ottoman oppressors. Now we we must decide what our position will be within the fabric of the Balkan community."
 balkfm_bulgaria.215.a: "[ROOT.GetCountry.GetName] will lead the Balkans!"
 balkfm_bulgaria.215.b: "Our nation will be for all Yugoslavs!"
 balkfm_bulgaria.215.c: "We will reclaim the Imperial Throne!"
 balkfm_bulgaria.215.tt: "This will enable the #bold Načertanije#! journal entry."
 balkfm_bulgaria.215.e: "We should be proud of what we've accomplished."
 balkfm_bulgaria.216.t: "The Bulgarian Empire"
 balkfm_bulgaria.216.d: "Crowds gathered at the heart of [ROOT.GetCountry.GetCapital.GetCityHubName] as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] declared the absolute dominance of the Bulgarian state over the Balkans."
 balkfm_bulgaria.216.f: "In defiance of the imperialist powers that would see us as second-class citizens in our own homelands, we have claimed both our freedom and our future."
 balkfm_bulgaria.216.a: "This is a glorious day for the [ROOT.GetCountry.GetName]"
 balkfm_bulgaria.217.t: "The Yugoslav Nation"
 balkfm_bulgaria.217.d: "Having broken free from the yoke of the Ottoman and Austrian empires, the Slavic peoples of the Balkans have unified into a single nation."
 balkfm_bulgaria.217.f: "Freedom. Not mere release from the shackles, but true freedom. No longer caught between hammer and anvil, hound and hunter, the time has come for a new union. A new pact between Slavs for all to see."
 balkfm_bulgaria.217.a: "The Yugoslavian dream has come true!"
 balkfm_bulgaria.218.t: "The Queen of Cities"
 balkfm_bulgaria.218.d: "With the conquest of lands across the Bosphorus and the Dardanelles, the ancient imperial capital of Constantinople now lies within our control. The once-illusory dreams of reforging the Byzantine Empire have come to fruition. Our citizens now look to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to lead them into a new era."
 balkfm_bulgaria.218.f: ""When you go to Constantinople, think of me." -Ferdinand I, to $GBR_ADJ$ General Sir Ian Hamilton"
 balkfm_bulgaria.218.a: "Our armies will raise the Imperial standard once more!"

 balkfm_bulgaria.220.t: "Memories of the Steppe"
 balkfm_bulgaria.220.d: "In Byzantine times, the first mention of the [GetCulture('bulgarian').GetName] people comes from the mentions of the "Onogur Bulğars" with their lands clinging to the shores of the Dniester and Volga rivers near the Sea of Azov. With the restoration of the [ROOT.GetCountry.GetName], nationalists have aruged that the time has come for the Bulgarian people to reclaim their ancestral homeland."
 balkfm_bulgaria.220.f: "While the origin of the name "Bulgar" has been lost to time, the ancients made it clear that they first overthrew the Avars before migrating into the Balkans."
 balkfm_bulgaria.220.a: "We will reclaim our roots."
 balkfm_bulgaria.220.b: "This would be a wasted effort."
 balkfm_bulgaria.221.t: "Old Great Bulgaria"
 balkfm_bulgaria.221.d: "Through our efforts the ancient homelands of the Bulgarian people have been reclaimed from $RUS_ADJ$ hands. While we may speak a slavic language today, we cannot deny our ancient roots."
 balkfm_bulgaria.221.f: ""When someone seeks the truth, God sees. And when someone lies, God sees that too. The Bulgars did many favors to the Christians (Byzantines), but the Christians forgot them. But God sees." -Presian I of Bulgaria, 7th century"
 balkfm_bulgaria.221.a: "The [GetCulture('bulgarian').GetName] people will not be denied!"
 balkfm_bulgaria.227.t: "A United Bulgaria"
 balkfm_bulgaria.227.d: "In a rousing Proclamation in the Church of the Forty Martyrs, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has sent shock-waves across the Balkan world by declaring the both the Tsardom of [ROOT.GetCountry.GetName] and the annexation of East Rumelia."
 balkfm_bulgaria.227.f: ""The West has pronounced its anathema on me, the dawn of the East shines its rays on my dynasty and brightens our future!" -Ferdinand I, to the Sobranije, 1887"
 balkfm_bulgaria.227.a: "[ROOT.GetCountry.GetName] will triumph."
 balkfm_bulgaria.228.t: "The Bulgarian State"
 balkfm_bulgaria.228.d: "With the re-establishment of [SCOPE.sCountry('bulgaria_scope').GetName], the Bulgarian people can finally dream of a future they can call their own. The young nation will require strong leadership if it is to survive Ottoman retributions..."
 balkfm_bulgaria.228.f: ""As it is very necessary that you meet... the leader of the defenders of the people in these border areas, in order to discuss a very important matter to the benefit of all Bulgarians, whom the Berlin Congress has again left under Turkish tyrannical rule." -Nathanael of Ohrid, to Petko Voyvoda, 1878."
 balkfm_bulgaria.228.a: "It's time to focus back on [ROOT.GetCountry.GetName]."
 balkfm_bulgaria.228.b: "I wonder what kind of story they will have..."
 balkfm_bulgaria.229.t: "The Golden Lion Awakens"
 balkfm_bulgaria.229.d: "Nearly a century of momentum built up in the National Awakening coupled with the decline of the [SCOPE.sCountry('ottoman_scope').GetName] has led to the rebirth of [ROOT.GetCountry.GetName]. With the support of [SCOPE.sCountry('russia_scope').GetName] and [SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('russia_scope').GetRuler.GetFirstName], a Catholic Austrian prince has been elected to rule the fledgling nation of [ROOT.GetCountry.GetName]."
 balkfm_bulgaria.229.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] is young and inexperienced and the country is in a precarious position. Not fully independent from the Porte, [ROOT.GetCountry.GetName] is rural, destitute, and heavily dependent on diplomatic support from the [SCOPE.sCountry('russia_scope').GetAdjectiveNoFormatting] state. Yet, the people feel hope for a future free of oppression and for future union with the Bulgarian people still living within Ottoman lands."
 balkfm_bulgaria.229.a: "[ROOT.GetCountry.GetName] will find its way."

 balkfm_bulgaria.300.t: "The Two Bulgarias"
 balkfm_bulgaria.300.d: "[ROOT.GetCountry.GetName] exists as a technicality: a legal fiction meant to cleave the [GetCulture('bulgarian').GetName] people in twain. Its existence is a travesty which represents the failures of the West to support the Bulgarian struggle for true self-determination. Yet, the dream of Bulgaria unification burns stronger than ever. All that remains is for us to seek union with [SCOPE.sCountry('bulgaria_scope').GetName] regardless of the will of the Sultan."
 balkfm_bulgaria.300.f: ""We shall set up a rickety sort of Turkish rule again south of the Balkans. But it is a mere respite. There is no vitality left in them." -Lord Salisbury, 1878"
 balkfm_bulgaria.300.a: "[ROOT.GetCountry.GetName] will find its way to union."
 balkfm_bulgaria.301.t: "Governor-General Appointed"
 balkfm_bulgaria.301.d: "The term of our current Governor-General has come to an end. Per the stipulations of the Treaty of Berlin, the Sultan has appointed a new Governor-General who is at least mostly palatable to both [ROOT.GetCountry.GetName] and the international community at large."
 balkfm_bulgaria.301.f: "With our governance bound so tightly to the Sultan, we might has well answer directly to the Ottoman court."
 balkfm_bulgaria.301.a: "So be it."

 balkfm_bulgaria.307.t: "Bulgarian Agitation in Rumelia!"
 balkfm_bulgaria.307.d: "[GetCulture('bulgarian').GetName] insurrectionists in [SCOPE.sState('northern_thrace_state_scope').GetName] have sparked a series of riots across the region. While they have been unable to seize political control, Bulgarians across the state have demanded increased autonomy and union with [SCOPE.sCountry('bulgaria_scope').GetName]."
 balkfm_bulgaria.307.f: ""The one road, leads to Philippopolis, and as far further as God may lead, the other to the Danube and Darmstadt." -S.Stamboloff, in counsel to Prince Battenburg, 1885"
 balkfm_bulgaria.307.a: "This is an afford to international order."
 balkfm_bulgaria.307.b: "We will not abandon our brothers!"
 balkfm_bulgaria.308.t: "Eastern Rumelia Rebels!"
 balkfm_bulgaria.308.d: "With direct aid from [SCOPE.sCountry('bulgaria_scope').GetName], separatists have seized the government offices in [SCOPE.sCountry('rumelia_scope').GetCapital.GetCityHubName] and proclaimed the Principality of [SCOPE.sCountry('rumelia_scope').GetName]. They have wasted little time in declaring their independence from [SCOPE.sCountry('ottoman_scope').GetAdjective rule and are determined to seek union with the Bulgarian state."
 balkfm_bulgaria.308.f: "With their emotions in a frenzy, the rebels have announced their intent to crown [SCOPE.sCountry('bulgaria_scope').GetRuler.GetFullName] the "Prince of North and South Bulgaria.""
 balkfm_bulgaria.308.a: "We must support our countrymen!"
 balkfm_bulgaria.308.b: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] will crush these ingrates!"
 balkfm_bulgaria.308.c: "We are in no position to escalate this conflict."
 balkfm_bulgaria.309.t: "Union with Bulgaria"
 balkfm_bulgaria.309.d: "[Root.GetCountry.GetCapital.GetCityHubName] erupted with cheers this morning on the news that the Rumelian puppet government has been overthrown and a union established between [ROOT.GetCountry.GetName] and [SCOPE.sCountry('bulgaria_scope').GetName]. While we remain under Ottoman suzerainty, this is the first step in restoring the Bulgarian state."
 balkfm_bulgaria.309.f: ""Brothers! The hour of our Union has struck. The foreign government which has oppressed Roumelia for six years is overthrown. In it's place is proclaimed her union with the Principality of [ROOT.GetCountry.GetNameNoFlag], under the sceptre of the Bulgarian Prince, [ROOT.GetCountry.GetRuler.GetFullName]!" - Major D. Nikolaev, 1885"
 balkfm_bulgaria.309.a: "This is a great day for the [GetCulture('bulgarian').GetName] people!"
