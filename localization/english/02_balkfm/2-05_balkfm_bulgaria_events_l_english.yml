l_english:
 balkfm_bulgaria.001.t: "The Golden Lion Awakens"
 balkfm_bulgaria.001.d: "Nearly a century of momentum built up in the National Awakening coupled with the decline of the [SCOPE.sCountry('ottoman_scope').GetName] has led to the rebirth of [ROOT.GetCountry.GetName]. With the support of [SCOPE.sCountry('russia_scope').GetName] and [SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('russia_scope').GetRuler.GetFirstName], a Catholic Austrian prince has been elected to rule the fledgling nation of [ROOT.GetCountry.GetName]."
 balkfm_bulgaria.001.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] is young and inexperienced and the country is in a precarious position. Not fully independent from the Porte, [ROOT.GetCountry.GetName] is rural, destitute, and heavily dependent on diplomatic support from the [SCOPE.sCountry('russia_scope').GetAdjectiveNoFormatting] state. Yet, the people feel hope for a future free of oppression and for future union with the Bulgarian people still living within Ottoman lands."
 balkfm_bulgaria.001.a: "[ROOT.GetCountry.GetName] will find its way."
 balkfm_bulgaria.002.t: "Democratic Obstructions"
 balkfm_bulgaria.002.d: "Prince [ROOT.GetCountry.GetRuler.GetFullName] has found his plans for rapidly developing the state apparatus dashed by the constant bickering of the National Assembly. All the while, the people openly speak of their mistrust in the Bulgarian politician process. With support from $RUS_ADJ$ diplomats, the Prince has proposed the abrogation of large portions of the Constitution."
 balkfm_bulgaria.002.f: ""I think it possible, Monseigneur, that this enunciation of the theory of the State among the Slav races, or rather in Russia, may be of some advantage to you in your political plans." \n-J. Askakoff, in a letter to the Prince, 1881"
 balkfm_bulgaria.002.a: "A strong nation requires a strong leader."
 balkfm_bulgaria.002.b: "The political process needs time."
 balkfm_bulgaria.003.t: "Dissident Publishing"
 balkfm_bulgaria.003.d: "A prominent newspaper, the "Bulgarski Glas," has drawn the ire of the Prince's Minister of the Interior in denouncing the Prince's desire for autocracy. He has advised that the Prince cannot tolerate these affronts to his authority."
 balkfm_bulgaria.003.f: ""The only voice the people need is the voice of their lord, the Prince!""
 balkfm_bulgaria.003.a: "Impose limitations on the press."
 balkfm_bulgaria.003.b: "The press must be sacrosanct."
 balkfm_bulgaria.004.t: "Tsarist Influence"
 balkfm_bulgaria.004.d: "Following the establishment of [ROOT.GetCountry.GetName] and after backing the election of [ROOT.GetCountry.GetRuler.GetFullName], Tsar [SCOPE.sCountry('russia_scope').GetRuler.GetFirstName] has treated the Prince more like a provincial deputy than a foreign ruler. In it's latest maneuver, [SCOPE.sCountry('russia_scope').GetName] has sent two generals to provide assistance and oversight to our military."
 balkfm_bulgaria.004.f: "These two men, #yellow Leonid Sobolev#! and #yellow Alexander von Kaulbars#! are established military men in their own right, but their presence might expose us to further $RUS_ADJ$ influence. Rightfully so, the Austrian consul has already lodged a complaint that this will give the Tsar undue influence in the Balkans."
 balkfm_bulgaria.004.a: "We should trust our benefactors."
 balkfm_bulgaria.004.b: "Our army will remain Bulgarian."
 balkfm_bulgaria.005.t: "Russia Demands Subservience"
 balkfm_bulgaria.005.d: "Concerned with the boldness the National Assembly and the rise of nationalist movements in the Balkans, Tsar [SCOPE.sCharacter('russia_ruler_scope').GetFullName] has issued a stern warning against pursuing our claims to [SCOPE.sCountry('rumelia_scope').GetName]."
 balkfm_bulgaria.005.f: ""Greece, which wishes to extend itself at its own cost is alone to be feared for the moment. It will be sufficiently difficult to withdraw this country ... from the crisis that it has evoked.... It must be remembered that Bulgaria is not yet capable of making head against the consequences of such a convulsion." -Tsar Alexander III, to Prince Batttenburg, on the matter of Balkan irredentism."
 balkfm_bulgaria.005.a: "We should tread carefully."
 balkfm_bulgaria.005.b: "Bulgarian reunification is inevitable."
 balkfm_bulgaria.006.t: "Disruptive Attitudes"
 balkfm_bulgaria.006.d: "The presence of our $RUS_ADJ$ attachés has not gone without incident. After interfering in the politics of the National Assembly, General #yellow Kaulbars#! has demanded limitations on the promotion of native-Bulgarian generals in the army."
 balkfm_bulgaria.006.f: "Naturally, this act has causes outrage. Bulgaria cannot possibly hope to seek its own path if the army remains chained to that of Russia. The political leaders have demanded that the Prince communicate directly with the Tsar about his intentions in Bulgaria."
 balkfm_bulgaria.006.a: "The Prince will seek redress."
 balkfm_bulgaria.006.tt: "Prince #yellow Alexander#! will depart towards Moscow."
 balkfm_bulgaria.006.b: "We will tolerate their antics."
 balkfm_bulgaria.007.t: "The Sobolev Regency"
 balkfm_bulgaria.007.d: "In another insult to the independence of [ROOT.GetCountry.GetName], General #yellow Sobolev#! has abused his authority by dismissing several Prefects and Ministers, attempting to reform the government into one more friendly to Russia while the prince was abroad."
 balkfm_bulgaria.007.f: "When the Prince left for Russia, he left behind a cadre of loyal men to take charge of take affairs. In his absence, #yellow Sobolev#! has wasted little time in attempting to supplant his rule."
 balkfm_bulgaria.007.a: "Just reverse his actions."
 balkfm_bulgaria.007.b: "Eject these rats from [ROOT.GetCountry.GetName]!"
 balkfm_bulgaria.008.t: "Mandate Secured"
 balkfm_bulgaria.008.d: "Mere days after the would-be coup, [SCOPE.sCharacter('balkfm_sava_scope').GetFullName] has rallied the military in support of the Prince, arresting the conspirators and restoring order to [ROOT.GetCountry.GetName]. Riding a wave of support from the $RUS_ADJ$ throne, [SCOPE.sCharacter('balkfm_alex_scope').GetFullName] has returned to the throne to widespread jubilation."
 balkfm_bulgaria.008.f: "The show of will and determination by the Prince and his supporters have galvanized his standing amongst the people. With the backing of [SCOPE.sCountry('russia_scope').GetName], the Prince has been declared the hereditary ruler of the Bulgarian state."
 balkfm_bulgaria.008.a: "The future is bright for [ROOT.GetCountry.GetName]!"
 balkfm_bulgaria.009.t: "The August Coup"
 balkfm_bulgaria.009.d: "In the wake of his attempts to assert autocratic rule in [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetFullName] has been removed from office. Russophile elements within the state broke into the royal residence and forced the Prince to abdicate under threat of death."
 balkfm_bulgaria.009.f: "The sudden outsing of the Prince has been met with widespread outrage. Despite attempts by [SCOPE.sCharacter('balkfm_sava_scope').GetFullName] to lead a counter-coup, the Prince has not found enough support to feel himself legitimate in ruling the Bulgarian state. A caretaker regency has been assembled and appeals made to the Great Powers for a new Prince."
 balkfm_bulgaria.009.a: "[ROOT.GetCountry.GetName] will find its way."

 balkfm_bulgaria.010.t: ""
 balkfm_bulgaria.010.d: ""
 balkfm_bulgaria.010.f: ""
 balkfm_bulgaria.010.a: ""
 balkfm_bulgaria.011.t: ""
 balkfm_bulgaria.011.d: ""
 balkfm_bulgaria.011.f: ""
 balkfm_bulgaria.011.a: ""
 balkfm_bulgaria.012.t: "Strategic Demands"
 balkfm_bulgaria.012.d: "The Treaty of Berlin established the limited Bulgarian state. Amongst its stipulations were requirements that [ROOT.GetCountry.GetName] establish a strategic rail network linking Turkish and Ottoman lands as part of a large Orient Line vision. Additionally, the $GBR_ADJ$ have imposed a demand that the state purchase the Rusé-Varna railway as recompense for their losses in the region."
 balkfm_bulgaria.012.f: "Since its inception, the Great Powers have hoped to position Bulgaria as a western beachhead in the Ottoman sphere. Despite desires to bring all aspects of transportation under state control, some fear this may compromise the Powers' support for the Bulgarian nation."
 balkfm_bulgaria.012.a: "We have no future without rail."
 balkfm_bulgaria.013.t: "Extortionate Pricing"
 balkfm_bulgaria.013.d: "After an inflammatory session in the National Assembly, [ROOT.GetCountry.GetName] has made good on its obligations regarding the Rusé-Varna line."
 balkfm_bulgaria.013.f: "The delay between the ratification of the Treaty of Berlin and the purchase of the rail, the English operators of the rail have taken their chance to extort the highest value possible from the Bulgarian state."
 balkfm_bulgaria.013.a: "A prudent choice, regardless of price."
 balkfm_bulgaria.014.t: "The Bulgarian Railways"
 balkfm_bulgaria.014.d: "The completion of a rail network across [ROOT.GetCountry.GetName] has finally given us a definitive link to the European world. We can only hope that this will help us in the push for independence from the [SCOPE.sCountry('ottoman_scope').GetName]."
 balkfm_bulgaria.014.f: "The construction of several railways in Bulgaria is essential to the strategic designs of the $RUS_ADJ$ and Austria Empires. It has also allowed for the completion of the Orient Express, linking Paris as far as Constantinople."
 balkfm_bulgaria.014.a: "With this, our future is secured."
 balkfm_bulgaria.015.t: "Royal Entourage"
 balkfm_bulgaria.015.d: "With approval from the Tsar's court, Prince [ROOT.GetCountry.GetRuler.GetFirstName] has made preparations to for his journey to [SCOPE.sCountry('russia_scope').GetName]. However, before departure a missive arrived indicating that the Sultan, [SCOPE.sCountry('ottoman_scope').GetRuler.GetFullName] wishes to meet with the Prince."
 balkfm_bulgaria.015.f: "While the Sultan has been less than helpful towards the Prince, many advisors recommend that the Prince make the journey to Constantinople. The Prince himself has considered that this may be a good chance to pay visits to several neighbors in the Balkans before heading on to Moscow."
 balkfm_bulgaria.015.a: "We should pay respect."
 balkfm_bulgaria.015.b: "We make for Russia."
 balkfm_bulgaria.016.t: "A Warm Reception"
 balkfm_bulgaria.016.d: "Despite his apprehensions, [ROOT.GetCountry.GetRuler.GetFirstName] was received warmly by the Sultan. Instead of short, cold exchanges, the Prince has been welcomed with mirth and granted stately decorations. [SCOPE.sCharacter('ottoman_ruler_scope').GetFullName] clearly seeks to quell the separatist tide sweeping across [ROOT.GetCountry.GetName]."
 balkfm_bulgaria.016.f: "The conduct of the Sultan has surprised the Prince and his entourage. The Sultan has given polite and attentive responses to requests by the Prince for Bulgaria, approving most and declining a few with the utmost respect. The Sultan has gone as far as awarding the Prince with the Order of Osmanieh, the second-highest order in the Empire."
 balkfm_bulgaria.016.a: "What a generous surprise!"
 balkfm_bulgaria.017.t: "A Cautious Welcome"
 balkfm_bulgaria.017.d1: "Prince [ROOT.GetCountry.GetRuler.GetFirstName] has been welcomed with distrust at the court in Athens. While no disrespect was made by King [SCOPE.sCharacter('greece_ruler_scope').GetFullName], it is clear that he does not share the Prince's pan-Balkan aspirations."
 balkfm_bulgaria.017.d2: "Prince [ROOT.GetCountry.GetRuler.GetFirstName] received a warm welcome in the Greek court. After concluding formalities, King [SCOPE.sCharacter('greece_ruler_scope').GetFullName] made several overtures in the hopes of securing a Greek ally in the Balkans. The King has further committed to seeking cooperation on the Macedonian Question."
 balkfm_bulgaria.017.f: "Relations between the Balkan peoples have always been fraught with discord. With national borders poorly defined and populations heavily mingled in the major cities, every irredentist movement has been met with dismay by those who would find themselves estranged from their own nation."
 balkfm_bulgaria.017.a: "This is unfortunate."
 balkfm_bulgaria.017.b: "This is fortuitous."
 balkfm_bulgaria.018.t: "The Black Mountain"
 balkfm_bulgaria.018.d1: "The clear air and peaceful environs of the Montenegrin lands warm the heart of any visitor. After friendly reception by [SCOPE.sCharacter('montenegro_ruler_scope').GetFullName], the Montenegrin court has offered the Prince the hand of one of the royal princesses in the hopes of cementing a bond between the two nations."
 balkfm_bulgaria.018.d2: "The clear air and peaceful environs of the Montenegrin lands warm the heart of any visitor. After friendly reception by [SCOPE.sCharacter('montenegro_ruler_scope').GetFullName], the conversation turned towards the decline of the Porte. While no concrete promises were made, the two agreed that the Balkans must stand together against the Turks."
 balkfm_bulgaria.018.f: "[SCOPE.sCountry('montenegro_scope').GetName] has held its own against the Ottomans for centuries. However, as the Porte seeks to assert control over the Balkans, it has found itself assailed on all sides. With this state of affairs, the Prince-Bishop has pushed to establish strong relations with the other Balkan nations."
 balkfm_bulgaria.018.a: "The Prince would be honored."
 balkfm_bulgaria.018.b: "We cannot commit the Prince so easily."
 balkfm_bulgaria.018.c: "May this be the start of a strong friendship."
 balkfm_bulgaria.019.t: "The Tsar's Court"
 balkfm_bulgaria.019.d: "Prince [ROOT.GetCountry.GetRuler.GetFirstName] was absolutely apoplectic when, on his arrival in Moscow, he found none other than #yellow Nikola Suknarov#!, the Mayor of Sofia, claiming to be at the head of a Bulgarian delegation to the Tsar. The enraged Prince stands at a crossroads of how to confront this situation."
 balkfm_bulgaria.019.f: "In his attempts to undermine Bulgarian independence, #yellow General Sobolev#! sent a second delegation directly to Moscow. This has had the intended effect of embarrassing the Bulgarian state abroad. After storming into the Tsar's halls the Prince has demanded an audience before the Tsar and been surprised with a personal meeting with the Emperor himself."
 balkfm_bulgaria.019.a: "Demand #yellow Sobolev#! be punished."
 balkfm_bulgaria.019.b: "Try to make amends."

 balkfm_bulgaria.020.t: "An Elected Prince"
 balkfm_bulgaria.020.d: "The search for a new prince to lead the Bulgarian state has been fraught with political intrigue as a torrent of diplomats descended on the National Assembly. The regency council, led by [ROOT.GetCountry.GetRuler.GetFullName], appears to have found a candidate acceptable to the international community."
 balkfm_bulgaria.020.f: "Following the ejection of Prince #yellow Battenburg#! from [ROOT.GetCountry.GetName] the custodian government was quickly approached by diplomats from [SCOPE.sCountry('russia_scope').GetName] and [SCOPE.sCountry('ottoman_scope').GetName] demanding the National Assembly rubber stamp their choice for the throne."
 balkfm_bulgaria.020.1: "The young prankster, Ferdinand Maximilian, is most acceptable."
 balkfm_bulgaria.020.2: "The Georgian Prince, Nikoloz Dadiani, would bring a fine pedigree."
 balkfm_bulgaria.020.3: "The former governor of #yellow Roumelia#!, Alexander Bogoridi, would understand us well."
 balkfm_bulgaria.020.4: "The Danish Prince, Valdemar of Glucksburg, shows the most promise."
 balkfm_bulgaria.020.5: "The Prussian, Goltz Pasha, has proven his value to the [ROOT.GetCountry.GetPowerBloc.GetName]."
 balkfm_bulgaria.021.t: "A Foreigner in Sofia"
 balkfm_bulgaria.021.d1: "[ROOT.GetCountry.GetRuler.GetFullName] is no doubt a strange choice for [ROOT.GetCountry.GetName]. Raised in Vienna and groomed for a life amongst the German nobility, the young [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] knows little of the country he is poised to rule. At his father's behest, a cadre of tutors has accompanied him to aid with him learning the [GetCulture('bulgarian').GetName] language."
 balkfm_bulgaria.021.d2: "[ROOT.GetCountry.GetRuler.GetFullName] is no doubt a strange choice for [ROOT.GetCountry.GetName]. Raised in Zugdidi and groomed for a life as a minor vassal to the $RUS_ADJ$ tsar, the young [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] knows little of the country he is poised to rule. At his council's behest, a cadre of tutors has accompanied him to aid with him learning the [GetCulture('bulgarian').GetName] language."
 balkfm_bulgaria.021.f: ""He spoke in $FRA_ADJ$ with his mother and diplomats; in German to his brother and to the servants; he swore in Hungarian, and boasted in English and Italian." - D. Gancheff, tutor to the Prince, 1887"
 balkfm_bulgaria.021.a: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] should speak the language of the people."
 balkfm_bulgaria.021.b: "The vulgar tongue is beneath the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 balkfm_bulgaria.022.t: "Legitimizing the King"
 balkfm_bulgaria.022.d: "As [ROOT.GetCountry.GetRuler.GetFirstName] settles into his throne, he has found himself vexed by his position: while he may occupy the throne of [ROOT.GetCountry.GetName] he lacks legal recognition from his fellow monarchs and has found himself dependent on statesman [SCOPE.sCharacter('stambolov_scope').GetFullName] to defend his position as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 balkfm_bulgaria.022.f: ""The Prince has recently thrown himself entirely into the arms of Mr. Stamboloff. The stiff, unbending character of the Prime Minister became abhorrent to the Prince quite some time ago.... Had he following his own autocratic leanings, he would have got rid of the 'kingmaker' long ago." -Austrian diplomatic communiqué, 1887"
 balkfm_bulgaria.022.a: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must secure the throne."
 balkfm_bulgaria.023.t: "Military Conciliation"
 balkfm_bulgaria.023.d: "Since his arrival in [ROOT.GetCountry.GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been dogged by fears of a potential #yellow Battenburg#! restoration. In a meeting at the hills of Slivnitsa, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has extended an olive branch to the leaders of the revolt against the former [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. Seeking amnesty, the [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName] have renounced any support for House #yellow Battenburg#! and pledged their allegiance to House [ROOT.GetCountry.GetRuler.GetLastName]."
 balkfm_bulgaria.023.f: ""I sincerely thank Your Highness for Your sentiments: I have no doubt that the army which I created and led to victory will always support Your Highness in Your endeavours for a happy and flourishing Bulgaria." -Alexander Battenburg, to Prince Ferdinand, 1887"
 balkfm_bulgaria.023.a: "Grant them amnesty, we will need their strength."
 balkfm_bulgaria.023.b: "We cannot trust these renegades."
 balkfm_bulgaria.024.t: "Military Insufficiency"
 balkfm_bulgaria.024.d: "Despite it's independence from Ottoman administration, [ROOT.GetCountry.GetName]'s army is fundamentally an Ottoman one. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has proposed changes that would seek to modernize the Bulgarian army."
 balkfm_bulgaria.024.f: ""Unfortunately, I am short of weapons and ammunition. If really necessary, we could mobilize 130,000 men, but about 80,000 of them would not even be partly armed. Who can give me arms at this moment? My success, the creation of a stable, peaceful Bulgaria, is the key to solving the Eastern Question..." - Kynaz Ferdinand, to Crown Prince Rudolf, 1887"
 balkfm_bulgaria.024.a: "We should invest in the army."
 balkfm_bulgaria.024.b: "They can make do with what they have."
 balkfm_bulgaria.025.t: "The Bulgarian Army"
 balkfm_bulgaria.025.d: "With a tremendous effort, the [ROOT.GetCountry.GetAdjective] army has reformed itself into a force capable of defending our newly-won independence."
 balkfm_bulgaria.025.f: "With this force, we will defend our freedom."
 balkfm_bulgaria.025.a: "[ROOT.GetCountry.GetName] will not be denied!"
 balkfm_bulgaria.026.t: "The Panitsa Plot"
 balkfm_bulgaria.026.d: "[SCOPE.sCharacter('stambolov_scope').GetFullName] has come with difficult news: the internal service has uncovered a plot by a disgruntled Macedonian, army Major #yellow Kosta Panitsa#! to lead a Battenburgist Restoration to remove [ROOT.GetCountry.GetRuler.GetFirstName] from the throne. Much to the shock of the court, nearly half of the military was in on the plot despite previous attempts at making amends."
 balkfm_bulgaria.026.f: "While most of Panitsa's supporters are at worst ambivalent to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], many have seized on the opportunity to install a revanchist regime to reassert Bulgarian dominance in Macedonia."
 balkfm_bulgaria.026.a: "Panitsa will face the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s justice."
 balkfm_bulgaria.026.b: "Banish these traitors from Bulgaria."
 balkfm_bulgaria.027.t: "Funerary Politics"
 balkfm_bulgaria.027.d: "Duke #yellow Ernest II#!, the head of House Coburg, has died. As the many relatives arrive in [SCOPE.sCountry('prussia_scope').GetName] for the services, a diplomatic dispute has developed over whether [ROOT.GetCountry.GetRuler.GetFirstName] should be allowed to appear in full dress or civilian dress."
 balkfm_bulgaria.027.f: "Despite being elected by the Sobranije, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s lack of diplomatic recognition has caused friction abroad, with diplomats avoiding mention of the topic to avoid upsetting the balance in the Balkans. In the face of this, both the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] and his advisors have resolved that [ROOT.GetCountry.GetRuler.GetFirstName] should present himself in full dress in support of [ROOT.GetCountry.GetName]"
 balkfm_bulgaria.027.a: "We should respect this request."
 balkfm_bulgaria.027.b: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] shall appear in full regalia."
 balkfm_bulgaria.028.t: "The House of Bulgaria"
 balkfm_bulgaria.028.d: "The citizens of the capital were abruptly awoken this morning to the sound of a 101-gun salute announcing the birth of [ROOT.GetCountry.GetHeir.GetFirstName] of Tirnovo. The timely arrival of an heir to the throne has silenced many critics [ROOT.GetCountry.GetRuler.GetFirstName]'s right to rule."
 balkfm_bulgaria.028.f: ""One God, one ruler, one Fatherland""
 balkfm_bulgaria.028.a: "At last, House [ROOT.GetCountry.GetRuler.GetLastName] is secure."
 balkfm_bulgaria.029.t: "Severed Hands"
 balkfm_bulgaria.029.d: "Early this morning, the papers were blazoned with the headlines that [SCOPE.sCharacter('stambolov_scope').GetFullName] was viciously assaulted by a group of Macedonian extremists in retaliation for a series of provocative anti-Macedonian articles published following his dismissal. So savage was the attack that doctors were forced to amputate his hands, yet physicians have reported he will not last the week."
 balkfm_bulgaria.029.f: ""Was it not I who made you Prince of Bulgaria? And in consequence I have borne the responsibility of your mistakes." - S. Stamboloff to Prince Ferdinand, 1894"
 balkfm_bulgaria.029.a: "What a gruesome outcome."

 balkfm_bulgaria.030.t: "The Bulgarian Academy"
 balkfm_bulgaria.030.d: "In the interest of developing [ROOT.GetCountry.GetName], King [SCOPE.sCharacter('university_benefactor').GetFullName] has put forward a plan to open a native institution of higher learning in [SCOPE.sState('university_state').GetCityHubName]. This plan would represent a large expense for the state."
 balkfm_bulgaria.030.f: "In it's time under direct Ottoman rule, the Bulgarian people have been cut off from the innovations of the West. Establishing a proper system for higher education will remedy this situation."
 balkfm_bulgaria.030.a: "A noble endeavor."
 balkfm_bulgaria.030.b: "The cost is too great."
 balkfm_bulgaria.031.t: "Royal Recognition"
 balkfm_bulgaria.031.d: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s steady efforts have culminated in the general recognition of his sovereignty over [ROOT.GetCountry.GetName]. Slowly, but surely, letters and missives of congratulation and support have trickled in from monarchs across Europe."
 balkfm_bulgaria.031.f: ""What I have done was imposed on me by my duty towards my beloved people... The sacrifice I have made to the Fatherland is so great.... For Bulgaria's happiness and prosperity I have pledged my own son and by doing so loosened the bands of my family and torn the ties that bound me to the West. In return I do not ask my beloved people for noisy ovations or for hypocritical homage, but merely for their respect and confidence in me." -Ferdinand I, to the Sobranije, 1887"
 balkfm_bulgaria.031.a: "All Hail [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]!"
 balkfm_bulgaria.031.b: "[SCOPE.sCharacter('stambolov_scope').GetFullName] deserves all credit."
 balkfm_bulgaria.031.c: "This is a great day for [ROOT.GetCountry.GetName]."
 balkfm_bulgaria.032.t: "Spring in Constantinople"
 balkfm_bulgaria.032.d: "In celebration of his recognition as the true monarch of [ROOT.GetCountry.GetName], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has untaken a tour of nearby capitals as befits a sovereign ruler. Following a warm reception and dinner with the Sultan [SCOPE.sCountry('ottoman_scope').GetRuler.GetFullName] in Constantinople, [ROOT.GetCountry.GetRuler.GetFirstName] has been showered with decorations befitting his status as a nominal subject of the Porte. Festivities aside, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has found himself enchanted by the incredible glamour and legacy of the ancient Queen of Cities."
 balkfm_bulgaria.032.f: ""....And so, while the Sultan's officer, glued to his door, was watching me with an air of speechless stupefaction, I took my cane and pushed back one of the mats covering the floor. I this disclosed the slab of porphyry on which the Baselius Justinian planted his feet, shod in the imperial purple. And I too, I too, set my feet on the slab of porphyry!" -Ferdinand I, regarding his visit to the Hagia Sophia, 1896"
 balkfm_bulgaria.032.a: "[ROOT.GetCountry.GetName] will not be denied!"

 balkfm_bulgaria.160.t: "Threats of Schism"
 balkfm_bulgaria.160.d: "The Ecumenical Patriarch, backed by the authority of the Sublime Porte, has denounced the Bulgarian bishopry as schismatic, threatening to cut ties between [ROOT.GetCountry.GetName] and the Mother Church unless we return to submission under Constantinople."
 balkfm_bulgaria.160.f: "The actions of the Bulgarian ecclesiarchy, both in seeking a firman by the Sultan and by voicing their intent of unilaterally declaring autocephaly, have caused outrage across the Orthodox world. Accusations have been made that the Bulgarian state has prioritized politics over the wellbeing of the faithful."
 balkfm_bulgaria.160.a: "This will insulate the Church from Ottoman meddling."
 balkfm_bulgaria.160.b: "We cannot divide the Church over politics."
 balkfm_bulgaria.161.t: "DUMMY"
 balkfm_bulgaria.161.d: "DUMMY"
 balkfm_bulgaria.161.f: "DUMMY"
 balkfm_bulgaria.161.a: "DUMMY"
 balkfm_bulgaria.162.t: "Ecclesiastic Hostility"
 balkfm_bulgaria.162.d: "During a recent a stay at a convent near Kalofer, [ROOT.GetCountry.GetRuler.GetFirstName] was accosted by Metropolitan [GetInterestGroupVariant('ig_devout',GetPlayer).GetLeader.GetLastName], who wasted no time in reminding the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of his "duties" to the $RUS_ADJ$ Tsar and denouncing his ongoing commitment to the [GetReligion('catholic').GetName] faith."
 balkfm_bulgaria.162.f: "While [GetInterestGroupVariant('ig_devout',GetPlayer).GetLeader.GetLastName] was removed from the convent, rumors abound that the Metropolitan has taken "gifts" from the $RUS_ADJ$ foreign ministry."
 balkfm_bulgaria.162.a: "Depose this grifter and strip him of his titles."
 balkfm_bulgaria.162.b: "Perhaps [ROOT.GetCountry.GetRuler.GetFirstName] should learn more of the [GetReligion('orthodox').GetName] faith."
 balkfm_bulgaria.163.t: "An Orthodox Heir"
 balkfm_bulgaria.163.d: "[ROOT.GetCountry.GetName] is an [GetReligion('orthodox').GetName] nation, yet [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] follows the [ROOT.GetCountry.GetRuler.GetReligion.GetName] faith. This has come to a head with political leaders declaring that they will only recognize [SCOPE.sCharacter('eocfm_heir_scope').GetFirstName] as heir if he converts to the faith. Despite efforts by the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to secure international support for conversion, the [GetReligion('catholic').GetName] powers have voiced vicious opposition to the idea."
 balkfm_bulgaria.163.f: ""If you deliver your son into schism, you are excommunicate ipso facto!" -Pope Leo XIII to Prince Ferdinand, 1896"
 balkfm_bulgaria.163.a: "The entire royal family will join the  Eastern Church."
 balkfm_bulgaria.163.b: "The heir, [SCOPE.sCharacter('eocfm_heir_scope').GetFirstName], shall be baptised as [GetReligion('orthodox').GetName]."
 balkfm_bulgaria.163.c: "This is nonsense, House [ROOT.GetCountry.GetRuler.GetLastName] is a [GetReligion('catholic').GetName] family."
 balkfm_bulgaria.164.t: "Restoring the Exarchate"
 balkfm_bulgaria.164.d: "The Bulgarian churches are assaulted on all sides by the influence of the Phanariotes and overtaxation by the Porte. Church leaders have begun a desperate fight to revive the #yellow Exarchate of Bulgaria#!, the ancient [Concept('concept_autocephaly','$concept_autocephalous$')] church of the #yellow Bulgarian Empire#!, as a means to defend our national identity."
 balkfm_bulgaria.164.f: ""Meanwhile the Turk wins by craft more than by force, and snatches away Christ by fraud out of the hearts of men. For the Turk, it is true, at the present time compels no country by violence to apostatise; but he uses other means whereby imperceptibly he roots out Christianity...""
 balkfm_bulgaria.164.a: "The Bulgarian people must take a stand."
 balkfm_bulgaria.165.t: "OPEN"
 balkfm_bulgaria.165.d: ""
 balkfm_bulgaria.165.f: ""
 balkfm_bulgaria.165.a: ""
