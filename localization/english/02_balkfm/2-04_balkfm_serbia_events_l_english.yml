l_english:
 balkfm_serbia.001.t: "Mileta's Rebellion"
 balkfm_serbia.001.d: "Like much of the Balkans, [ROOT.GetCountry.GetName] is both rural and disorganized, dependent on the Great Powers. Since gaining autonomy from the [SCOPE.sCountry('ottoman_scope').GetName], the Serbian state has been fractured by infighting between Royalist and Constitutionalist factions.\n\nAfter a rebellion by fellow war hero, #yellow Mileta Radojković#!, Prince [ROOT.GetCountry.GetRuler.GetFirstName] agreed to limitations on his power. However, under foreign pressure, the Prince abolished the "Sretenje Constitution" based on concerns over its reformist nature. The Prince now waits for the National Assembly to produce a new consitution."
 balkfm_serbia.001.f: "The Prince, [ROOT.GetCountry.GetRuler.GetFullName], has demanded societal reforms through absolutism, but has found himself opposed by supporters of #yellow Alexander Karađorđević#! who have demanded limits to the power of the throne. Prince [ROOT.GetCountry.GetRuler.GetLastName] may be a war hero, but his demands for absolutist rule have estranged him from the people he seeks to rule."
 balkfm_serbia.001.a: "[ROOT.GetCountry.GetName] will find its way."
 balkfm_serbia.002.t: "A Constitution Imposed"
 balkfm_serbia.002.d: "#yellow Prince#! [ROOT.GetCountry.GetRuler.GetLastName] was loathe to convene the National Assembly to draft a constitution and has found ire with the document presented to both the Porte and the Great Powers. Under pressure from both the Assembly and foreign delegates, the Prince has signed the document, dubbed the "Turkish Constitution," and left the country, abdicating in the process. The new Prince, [SCOPE.sCharacter('milan_scope').GetFullName], while infirm and on his deathbed will soon ascend to the throne."
 balkfm_serbia.002.f: ""When this stone rises from the Sava, you shall return to Serbia again!" -T.V. Perišić to Prince Miloš, 1839"
 balkfm_serbia.002.a: "There is no room for despotism in [ROOT.GetCountry.GetName]."
 balkfm_serbia.002.tt: "#yellow Prince Miloš#! abdicates the throne."
 balkfm_serbia.003.t: "An Inexperienced Ruler"
 balkfm_serbia.003.d: "With the abdication of Prince Miloš, his son [ROOT.GetCountry.GetRuler.GetFullName] nominally took the throne. Sick with consumption when given the throne, he scarcely survived four weeks before giving up the ghost. His brother, [SCOPE.sCharacter('milhailo_scope').GetFullName] has been elected to sit the throne instead. Young and politically inexperienced, his finds himself at the mercy of a National Senate fixated on further curtailment of royal authority."
 balkfm_serbia.003.f: "The young Prince appears to be set in following in his father's footsteps. Desspite his father's exile, he has pushed for a return to autocracy, not knowing that he is eroding what little political support he has. Taking advantage of his political inexperience, supporters of the House of Karađorđević have begun to move against the Prince, seeking to eject House Obrenović from power."
 balkfm_serbia.003.a: "He will have to learn."
 balkfm.404.t: "OPEN"
