 balkfm.406.f: "OPEN"
 balkfm.406.a: "OPEN"
 balkfm_serbia.007.t: "Defenders of the Constitution"
 balkfm_serbia.007.d: "Rising up against the threat of absolutist rule, [SCOPE.sCharacter('kaykay_scope').GetFullName] has rallied both political and military leaders to eject [ROOT.GetCountry.GetRuler.GetFullName] from the throne. With the approval of the Porte, he has been named the new Prince of [ROOT.GetCountry.GetName]."
 balkfm_serbia.007.f: ""We did not overthrow one Pasha to replace him with another.""
 balkfm_serbia.007.a: "We will defend our freedom."
 balkfm_serbia.007.tt1: "#yellow Prince Milhailo#! abdicates the throne."
 balkfm_serbia.007.tt2: "House #yellow Karađorđević#! takes the throne."
 balkfm_serbia.008.t: "Absent Reform"
 balkfm_serbia.008.d: "Despite widespread demands for reforms away from the archaic socio-economic systems left behind by Ottoman rule, the Skupština has balked at implementing them on a timely scale."
 balkfm_serbia.008.f: "Unless [ROOT.GetCountry.GetName] can break free from its Turkish legacy, we may be doomed to the same rot that has consumed the #bold Porte#!."
 balkfm_serbia.008.a: "Are we doomed to stagnation?"
 balkfm_serbia.009.t: "[ROOT.GetCountry.GetName] Reforged"
 balkfm_serbia.009.d: "Despite the impingement on royal dignity, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has brought forward reforms that has vastly curtailed royal privileges while providing meaningful guarantees of liberty to the Serbian people."
 balkfm_serbia.009.f: "The Serbian people can hold their heads high with the confidence and knowledge that they can thrown off the last vestiges of the feudal shackles placed on them by the Ottoman state."
 balkfm_serbia.009.a: "Justly so."

 balkfm_serbia.010.t: "House Karađorđević Takes the Throne"
 balkfm_serbia.010.d: "Support has collapsed for House Obrenović. Taking the initiative, [ROOT.GetCountry.GetRuler.GetFullName] has returned from exile. After appealing to the Senate, he has been named the new Prince of [ROOT.GetCountry.GetName]. "
 balkfm_serbia.010.f: "The former Prince, [SCOPE.sCharacter('balkfm_obrenovic_scope').GetFullName] has departed into exile. However, he still retains a powerful base of support in the Senate. The new Prince will have to act swiftly to legitimize his rule."
 balkfm_serbia.010.a: "[ROOT.GetCountry.GetName] must find its way."
 balkfm_serbia.011.t: "House Obrenović Takes the Throne"
 balkfm_serbia.011.d: "Support has collapsed for House Karađorđević. Taking the initiative, [ROOT.GetCountry.GetRuler.GetFullName] has returned from exile. After appealing to the Senate, he has been named the new Prince of [ROOT.GetCountry.GetName]"
 balkfm_serbia.011.f: "The former Prince, [SCOPE.sCharacter('balkfm_balkfm_karadordevic_scope').GetFullName] has departed into exile. However, he still retains a powerful base of support in the Senate. The new Prince will have to act swiftly to legitimize his rule."
 balkfm_serbia.011.a: "[ROOT.GetCountry.GetName] must find its way."
 balkfm_serbia.012.t: "[SCOPE.sCountry('balkfm_supplicant_scope').GetName] Demands Precedence"
 balkfm_serbia.012.d: "With House [ROOT.GetCountry.GetRuler.GetLastName] sitting the throne, their benefactors in [SCOPE.sCountry('balkfm_supplicant_scope').GetName] have presented the court with a demand that their consul be place first in the Serbian diplomatic precedence. The consul from [SCOPE.sCountry('balkfm_consul_scope').GetName] has lodged a protest at the demand."
 balkfm_serbia.012.f: "Despite not coming to blows over the matter, an endless competition has developed between Russia and Austria for having the highest degree of influence over the Prince."
 balkfm_serbia.012.a: "We will not dislodge [SCOPE.sCountry('balkfm_consul_scope').GetName]"
 balkfm_serbia.012.b: "[SCOPE.sCountry('balkfm_supplicant_scope').GetName] deserved precedence."
 balkfm_serbia.013.t: "Plague Outbreak!"
 balkfm_serbia.013.d: "An outbreak of plague across the [SCOPE.sCountry('ottoman_scope').GetName] has left Prince [ROOT.GetCountry.GetRuler.GetFirstName] at an impasse: contain the sickened Turkish garrison in their fortress and limit the spread, or avoid angering the Porte at the risk of allowing the disease to spread."
 balkfm_serbia.013.f: "While the state has easily secured its borders, it was the Turkish garrison in Belgrade that brought the plague into Serbian lands. We are confident that the outbreak can be contained if we act quickly."
 balkfm_serbia.013.a: "Surround the garrison. No one in or out."
 balkfm_serbia.013.b: "That would violate the Porte's rights."
 balkfm_serbia.014.t: "Abusive Garrison"
 balkfm_serbia.014.d: "The Turkish Garrison in Belgrade has been accused of abuses against the Serbian population of the city. With accusations ranging from theft to outright murder, the Senate has demanded that the Prince seek redress from the Porte."
 balkfm_serbia.014.f: "Nominally, Serbia was granted full authority to govern itself. Yet, the Porte has insisted in maintaining their garrison in the Fortress of Belgrade in violation of their treaty obligations."
 balkfm_serbia.014.a: "We will demand remediation."
 balkfm_serbia.014.b: "We cannot anger the Porte."

 balkfm_serbia.018.t: "Cementing the Monarchy"
 balkfm_serbia.018.d: "In a rousing speech to the #o Senate#!, #yellow House#! [ROOT.GetCountry.GetRuler.GetLastName] has made the formal demand that their reign should become both permanent and hereditary."
 balkfm_serbia.018.f: "Despite widespread support, there remain powerful detractors across [ROOT.GetCountry.GetName] and that goes without mentioning the reaction foreign power may have."
 balkfm_serbia.018.a: "[ROOT.GetCountry.GetName] deserves a proper [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 balkfm_serbia.018.cement: "A cement is a binder, a chemical substance used for construction that sets, hardens, and adheres to other materials to bind them together. Cement is seldom used on its own, but rather to bind sand and gravel (aggregate) together. Cement mixed with fine aggregate produces mortar for masonry, or with sand and gravel, produces concrete. Concrete is the most widely used material in existence and is behind only water as the planet's most-consumed resource."
 balkfm_serbia.019.t: "Mandate Secured"
 balkfm_serbia.019.d: "Despite the deep divisions that plague the #o Senate#!, #yellow House#! [ROOT.GetCountry.GetRuler.GetLastName] has cemented themselves as the rightful rulers of [ROOT.GetCountry.GetName]. With the passage of Acts of Inheritance, the Serbian state will finally have a hereditary monarch."
 balkfm_serbia.019.f: "By stabilizing the conflict over the Monarchy, both the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] and the Senate should be able to secure a measure of political stability in Serbia."
 balkfm_serbia.019.a: "All Hail House [ROOT.GetCountry.GetRuler.GetLastName]!"

 balkfm_serbia.200.t: "The Serbian Heartlands"
 balkfm_serbia.200.d: "[ROOT.GetCountry.GetName] may be free from direct rulership from the Porte, but there remain countless [GetCulture('serb')] populations trapped beyond our borders. We must see them reunited with the Serbian state."
 balkfm_serbia.200.f: "Consisting of the lands north of the river Vardar and stretching as far as Macedonia to the south and Bosnia to the west, the conquest of the lands of "Old Serbia" has become a rallying cry for Serbian nationalists."
 balkfm_serbia.200.a: "It is our duty to liberate all Serbs from oppression."
 balkfm_serbia.201.t: "Greater Serbia"
 balkfm_serbia.201.d: "With the heartlands of our great nation under our control, irredentist fervor has swept [ROOT.GetCountry.GetName]. Both citizen and politician alike clamor for the restoration of Serbian supremacy in the Balkans."
 balkfm_serbia.201.f: "In Byzantine times, the Serbian Empire ruled a vast realm stretching from the "
 balkfm_serbia.201.a: "[ROOT.GetCountry.GetName] will rise again!"
 balkfm_serbia.201.tt: "#red Restoring the #bold Serbian Empire#! will abandon the Yugoslav cause#!."
 balkfm_serbia.202.t: "Restoration of the Serbian Empire"
 balkfm_serbia.202.d: "Through the blood and sacrifices of the Serbian people, the [ROOT.GetCountry.GetName] has been reborn!"
 balkfm_serbia.202.f: "Today the Serbian flag waves proudly over the Balkans. Never again will be led our people become slaves to foreign Empires."
 balkfm_serbia.202.a: "[ROOT.GetCountry.GetName] will never be vanquished!"
 balkfm_serbia.203.t: "Society of Serbian Letters"
 balkfm_serbia.203.d: "Serbian intellectuals have convened in [ROOT.GetCountry.GetCapital.GetCityHubName] with the aim of discussing and reaching a consensus regarding standardizing the [GetCulture('serb').GetName] language."
 balkfm_serbia.203.f: "Organized with the blessing of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], the group has already made significant progress in producing the first common list of letters."
 balkfm_serbia.203.a: "This is an excellent initiative."
 balkfm_serbia.204.t: "May Assembly"
 balkfm_serbia.204.d: "[GetCulture('serb').GetName] leaders in [SCOPE.sCountry('vojvodina_scope').GetCapital.GetName] gave gathered with the purpose of renouncing Austrian rule. In defiance of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], members of the "May Assembly" have proclaimed Serbian [SCOPE.sCountry('vojvodina_scope').GetName] and have petitioned for autonomy from [ROOT.GetCountry.GetCapital.GetCityHubName]."
 balkfm_serbia.204.f: "Concerned that their struggle has been overshadowed by the larger dispute between Austria and Hungary, Serbian intellectuals have seized on the fears of our Serb subjects of future oppression by our sister government in Budapest."
 balkfm_serbia.204.a: "We cannot tolerate this insult to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 balkfm_serbia.204.b: "Their demands are only fair."
 balkfm_serbia.205.t: "The Vojvodina Uprising"
 balkfm_serbia.205.d: "Our [GetCulture('serb').GetName] brothers in [SCOPE.sCountry('vojvodina_scope').GetName] have proclaimed their autonomy from the royal government in [SCOPE.sCountry('austria_scope').GetName]. [SCOPE.sCountry('austria_scope').GetRuler.GetFirstName] has rejected their demands for independence and now seeks to quash the uprising."
 balkfm_serbia.205.f: "With the force of the Austrian army bearing down on them, the Serbs of Vojvodina have reached out to Serbia with the hope of securing foreign support."
 balkfm_serbia.205.a: "We will join our brothers!"
 balkfm_serbia.205.b: "Smuggle aid across the border."
 balkfm_serbia.205.c: "We cannot afford to interfere."
 balkfm_serbia.206.t: "The Serbian Voivodship"
 balkfm_serbia.206.d: "Our [GetCulture('serb').GetName] brothers in [SCOPE.sCountry('vojvodina_scope').GetName] have proclaimed their autonomy from the royal government in [SCOPE.sCountry('austria_scope').GetName]. In his wisdom, [SCOPE.sCountry('austria_scope').GetRuler.GetFirstName] has acknowledged their autonomy and has organized the region as a top-level division of the Habsburg Empire."
 balkfm_serbia.206.f: "By providing broad rights to the Serbs under his rule, the [SCOPE.sCountry('austria_scope').GetRuler.GetPrimaryRoleTitle] has diffused one of the many nationalist movements that threaten the integrity of the Empire."
 balkfm_serbia.206.a: "But [ROOT.GetCountry.GetName] will not be whole without them!"