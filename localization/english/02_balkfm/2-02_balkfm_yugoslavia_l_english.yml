 balkfm_south_slav: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] South Slav#!#!"
 balkfm_south_slavs: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] South Slavs#!#!"

 balkfm_yugoslavism: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslavism_desc')] Jugoslavism#!#!"
 balkfm_yugoslavism_desc: "#bold Yugoslavism#! is the notion that the $balkfm_south_slav$ peoples, belong to a single $balkfm_yugoslav$ nation separated by historical circumstance, language dialects, and religious divides. Its adherents advocate for the union of all South Slavs be it through diplomacy or violence."
 balkfm_yugoslavist: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslavism_desc')] Jugoslavist#!#!"
 balkfm_yugoslavist_movement: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslavism_desc')] Jugoslavist Movement#!#!"
 balkfm_support_yugoslavism: "This will commit us to supporting the cause of Yugoslavism."
 balkfm_oppose_yugoslavism: "This will commit us to opposing the cause of Yugoslavism."

 balkfm_yugoslav_leader: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_leader_desc')] Yugoslav Unification Leader#!#!"
 balkfm_yugoslav_leader_desc: "The #bold Yugoslav Unification Leader#! is the country with the highest prestige amongst all $balkfm_yugoslav$ cultures."
 balkfm_yugoslav_union: "If [ROOT.GetCountry.GetName] is $balkfm_yugoslav_involved$ in #bold $je_balkfm_unification_of_yugoslavia$#! [concept_journal_entry] and is the $balkfm_yugoslav_leader$, the state will be able to annex #tooltippable #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_union_desc')] eligible#!#! $balkfm_yugoslav$ [Concept('concept_country','$concept_countries$')]"
 balkfm_yugoslav_union_desc: "The $balkfm_yugoslav_leader$ can annex other $balkfm_yugoslav$ [Concept('concept_country','$concept_countries$')] if the following criteria are met:\n•The $balkfm_yugoslav_leader$ has researched [GetTechnology('pan-nationalism').GetName]\n•The $balkfm_yugoslav_leader$ does #bold not#! have [GetLawType('law_ethnostate').GetName] enacted\n•The two[Concept('concept_country','$concept_countries$')] have maintained [concept_relations] of #bold #green cordial#! or better#! for #bold 60 months or greater#!\n•Neither [concept_country] is a [concept_subject]\n•The two countries share a land border"
 balkfm_yugoslav_involved: "#tooltippable #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_involved_desc')] Involved#!#!"
 balkfm_yugoslav_involved_desc: "A [concept_country] will become involved in #bold $je_balkfm_unification_of_yugoslavia$#! by fulfilling these criteria:\n• Has a $balkfm_yugoslav$ [Concept('concept_primary_cultures','$concept_primary_culture$')]\n• Has a [concept_state] in the [GetStrategicRegion('region_balkans').GetName] [concept_strategic_region]\n• Has researched [GetTechnology('nationalism').GetName]\n\n@information! A [concept_country] will also become involved in #bold $je_balkfm_unification_of_yugoslavia$#! by having a $balkfm_yugoslav$ [concept_subject] in the [GetStrategicRegion('region_balkans').GetName]"

 balkfm_yugoslav_nationalism_boost: "Other $balkfm_yugoslav$ nations will receive boosts to [GetTechnology('nationalism').GetName] or [GetTechnology('pan-nationalism').GetName]. Empires with $balkfm_yugoslav$ [Concept('concept_pop','$concept_pops$')] may face increased [concept_radical]"
