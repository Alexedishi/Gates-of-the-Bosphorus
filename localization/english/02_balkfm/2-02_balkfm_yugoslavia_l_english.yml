 # Tooltips
 balkfm_lose_yugoslav_cultures: "[ROOT.GetCountry.GetName] will lose any other $balkfm_yugoslav$ [concept_primary_cultures]"
 balkfm_assimilate_to_yugoslav: "#v 50%#! of $balkfm_yugoslav$ $gbbf_pops$ will assimilate to the [GetCulture('yugoslav').GetName] [concept_culture]"
 balkfm_federalist_outcome: "[ROOT.GetCountry.GetNameNoFlag] will have to choose between a Federal or Unitary means of co-existence for the $balkfm_yugoslavs$"
 
 balkfm_yugoslav: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] Jugoslav#!#!"
 balkfm_yugoslav_desc: "[GetCulture('serb').GetName], [GetCulture('croat').GetName], [GetCulture('slovene').GetName], [GetCulture('bosniak').GetName], and [GetCulture('bulgarian').GetName]."
 balkfm_yugoslavs: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] Jugoslavs#!#!"
 balkfm_yugoslav_culture: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] Jugoslav Culture#!#!"
 balkfm_yugoslav_cultures: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] Jugoslav Cultures#!#!"
 balkfm_south_slav: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] South Slav#!#!"
 balkfm_south_slavs: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_desc')] South Slavs#!#!"

 balkfm_yugoslavism: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslavism_desc')] Jugoslavism#!#!"
 balkfm_yugoslavism_desc: "#bold Yugoslavism#! is the notion that the $balkfm_south_slav$ peoples, belong to a single $balkfm_yugoslav$ nation separated by historical circumstance, language dialects, and religious divides. Its adherents advocate for the union of all South Slavs be it through diplomacy or violence."
 balkfm_yugoslavist: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslavism_desc')] Jugoslavist#!#!"
 balkfm_yugoslavist_movement: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslavism_desc')] Jugoslavist Movement#!#!"
 balkfm_support_yugoslavism: "This will commit us to supporting the cause of Yugoslavism."
 balkfm_oppose_yugoslavism: "This will commit us to opposing the cause of Yugoslavism."

 balkfm_yugoslav_leader: "#o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_leader_desc')] Yugoslav Unification Leader#!#!"
 balkfm_yugoslav_leader_desc: "The #bold Yugoslav Unification Leader#! is the country with the highest prestige amongst all $balkfm_yugoslav$ cultures."
 balkfm_yugoslav_union: "If [ROOT.GetCountry.GetName] is $balkfm_yugoslav_involved$ in #bold $je_balkfm_unification_of_yugoslavia$#! [concept_journal_entry] and is the $balkfm_yugoslav_leader$, the state will be able to annex #tooltippable #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_union_desc')] eligible#!#! $balkfm_yugoslav$ $gbbf_countries$"
 balkfm_yugoslav_union_desc: "The $balkfm_yugoslav_leader$ can annex other $balkfm_yugoslav$ $gbbf_countries$ if the following criteria are met:\n • The $balkfm_yugoslav_leader$ has researched [GetTechnology('pan-nationalism').GetName]\n • The $balkfm_yugoslav_leader$ does #bold not#! have [GetLawType('law_ethnostate').GetName] enacted\n • The two$gbbf_countries$ have maintained [concept_relations] of #bold #green cordial#! or better#! for #bold 60 months or greater#!\n • Neither [concept_country] is a [concept_subject]\n • The two countries share a land border"
 balkfm_yugoslav_involved: "#tooltippable #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_involved_desc')] Involved#!#!"
 balkfm_yugoslav_involved_desc: "A [concept_country] will become involved in #bold $je_balkfm_unification_of_yugoslavia$#! by fulfilling these criteria:\n • Has a $balkfm_yugoslav$ $gbbf_primary_culture$\n • Has a [concept_state] in the [GetStrategicRegion('region_balkans').GetName] [concept_strategic_region]\n • Has researched [GetTechnology('nationalism').GetName]\n\n@information! A [concept_country] will also become involved in #bold $je_balkfm_unification_of_yugoslavia$#! by having a $balkfm_yugoslav$ [concept_subject] in the [GetStrategicRegion('region_balkans').GetName]"
 
 balkfm_yugoslav_solution: "@gbbf_identity! #o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_solution_desc')] Yugoslav Solution#!#!"
 balkfm_yugoslav_solution_desc: "The $yugoslav$ Project has come to fruition with the creation of #bold $YUG$#!. However, the ink was hardly dry when social and political leaders realized that co-existence between the $balkfm_yugoslavs$ will be much harder than abolishing borders. In light of the friction between the $balkfm_yugoslav_cultures$, intellectuals have offered several #bold Solutions#! to the issue:"
 balkfm_yugoslav_solutions: "@gbbf_identity! #o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_solution_desc')] Yugoslav Solutions#!#!"
 balkfm_yugoslav_solution_short: "@gbbf_identity! #o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_solution_desc')] Solution#!#!"
 balkfm_yugoslav_solutions_short: "@gbbf_identity! #o #tooltip:[GetRawTextTooltipTag('balkfm_yugoslav_solution_desc')] Solutions#!#!"
 
 balkfm_integralist: "@gbbf_identity! #o #tooltip:[GetRawTextTooltipTag('balkfm_integralist_desc')] Integralist#!#!"
 balkfm_integralist_desc: "The supporters of the #bold Integralist#! solution advocate for the creation of a supra-national cultural identity that would eventually supersede any local $balkfm_yugoslav_cultures$. This model has found few supporters amongst the common folk who see it as a destruction of their history and traditions."
 balkfm_integralist_solution: "@gbbf_identity! #o #tooltip:[GetRawTextTooltipTag('balkfm_integralist_desc')] Integralist Solution#!#!"
 
 balkfm_pluralist: "@gbbf_identity! #o #tooltip:[GetRawTextTooltipTag('balkfm_pluralist_desc')] Pluralist#!#!"
 balkfm_pluralist_desc: "The supporters of the #bold Pluralist#! solution argue that all $balkfm_yugoslav_cultures$ are inherently equal and should be supported as such in a singular state framework."
 balkfm_pluralist_solution: "@gbbf_identity! #o #tooltip:[GetRawTextTooltipTag('balkfm_pluralist_desc')] Pluralist Solution#!#!"
 
 balkfm_federalist: "@gbbf_identity! #o #tooltip:[GetRawTextTooltipTag('balkfm_federalist_desc')] Federalist#!#!"
 balkfm_federalist_desc: "The #bold Federalist#! solution has been proposed as a means of maintaining the unity of the $balkfm_yugoslav_cultures$ while allowing for strong local autonomy. While favored by each nationality, this solution is seen as a betrayal of the Yugoslavist ideal."
 balkfm_federalist_solution: "@gbbf_identity! #o #tooltip:[GetRawTextTooltipTag('balkfm_federalist_desc')] Federalist Solution#!#!"

 balkfm_yugoslav_nationalism_boost: "Other $balkfm_yugoslav$ nations will receive boosts to [GetTechnology('nationalism').GetName] or [GetTechnology('pan-nationalism').GetName]. Empires with $balkfm_yugoslav$ $gbbf_pops$ may face increased [concept_radical]"
 balkfm_yugoslav_truce_effect: "[ROOT.GetCountry.GetNameNoFlag] will get a #v 10 year#! [concept_truce] will every created [concept_subject]"
 
