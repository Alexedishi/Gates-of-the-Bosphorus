 # Journal Entry Lobby Text
 je_balkfm_serbia_and_montenegro_lobby: "$gbbf_integrates_ip3$\nThe people of Montenegro have always seen themselves as Serbs tragically separated from their brethren in Serbia by the tyrannical Ottoman Empire.\n\nIf both states were free and shared a common border, they could unite as one great Serbian nation."
 je_balkfm_yugoslav_project_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_ip3$\nThe South Slav people have been present throughout the Balkans for over a millennium. In spite of the divides of time and dialects, the Yugoslav plan calls for unifying the South Slavs under one crown."

