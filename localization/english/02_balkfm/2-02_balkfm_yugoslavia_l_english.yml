 balkfm_value_from_bosniak_movement: "From the [Concept('concept_political_movement_support','$concept_political_movement_support_short$')] behind the [GetCulture('bosniak').GetName] cultural [Concept('concept_political_movement', '$concept_political_movement_short$')]"
