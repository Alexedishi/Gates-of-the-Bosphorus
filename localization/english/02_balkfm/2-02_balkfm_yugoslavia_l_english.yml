l_english:
 # Journal Entries
 je_balkfm_serbia_and_montenegro: "Serbia and Montenegro"
 je_balkfm_serbia_and_montenegro_reason: "The people of [SCOPE.sCountry('montenegro').GetName] have always seen themselves as [GetCulture('serb').GetName]#yellow s#! tragically separated from their brethren in [SCOPE.sCountry('serbia').GetName] by the tyrannical [SCOPE.sCountry('ottoman').GetNameNoFlag].\n\nIf both states were free and shared a common border, they could unite as one great Serbian nation."
 je_balkfm_serbia_and_montenegro_complete: "[SCOPE.sCountry('montenegro').GetName] and [SCOPE.sCountry('serbia').GetName] share a land border"
 je_balkfm_serbia_and_montenegro_on_complete: "[SCOPE.sCountry('montenegro').GetNameNoFlag] and [SCOPE.sCountry('serbia').GetNameNoFlag] will have an opportunity to unite into a single nation. The new country will have a choice which nation's laws and leaders to adopt."
 je_balkfm_serbia_and_montenegro_fail: "[GetCulture('serb').GetName] is #bold not#! a [Concept('concept_primary_cultures','$concept_primary_culture$')] in [SCOPE.sCountry('montenegro').GetName]"
 je_balkfm_serbia_and_montenegro_on_fail: "Negative Event [Concept('concept_diplomatic_catalyst','$concept_diplomatic_catalysts$')] will be triggered between [SCOPE.sCountry('montenegro').GetName] and [SCOPE.sCountry('serbia').GetName]"

 je_balkfm_unification_of_yugoslavia: "The Yugoslav Project"
 je_balkfm_unification_of_yugoslavia_reason: "#italic The $balkfm_south_slav$ people have been present throughout the [GetStrategicRegion('region_balkans').GetName] for over a millennium. While we have been divided by times and dialects, the plan draws inspiration from the #bold Risorgimento#!, calling for unifying the South Slavs under one crown.#!$gbbf_delimiter_normal$@information! If we are the $balkfm_yugoslav_leader$ and have researched [GetTechnology('pan-nationalism').GetName], we will be able to pursue the annexation of neighboring $balkfm_yugoslav$ nations.\n[GetGlobalVariable('balkfm_yugoslavia_journal_var').Var('balkfm_yugoslav_leader_var').GetCountry.GetName] is the $balkfm_yugoslav_leader$ with [GetGlobalVariable('balkfm_yugoslavia_journal_var').Var('balkfm_yugoslav_leader_prestige_var').GetValue] [concept_prestige].$gbbf_delimiter_normal$There is currently [GetGlobalVariable('balkfm_yugoslav_fervor_var').GetValue] [concept_fervor] between all $balkfm_yugoslav_cultures$. This will provide any $balkfm_yugoslav$ [concept_subject] countries with the following effects for every #v 100#! shared fervor:\n[GetStaticModifier('modifier_balkfm_yugoslavist_separatism').GetDesc]"
 je_balkfm_unification_of_yugoslavia_complete: "#bold $YUG$#! has been formed"
 je_balkfm_unification_of_yugoslavia_on_complete_all_involved: "Triggers the Event #white $balkfm_yugoslavia.009.t$#!"
 je_balkfm_unification_of_yugoslavia_fail: "No [Concept('concept_country','$concept_countries$')] in the [GetGeographicRegion('geographic_region_balkans').GetName] have a $balkfm_yugoslav_culture$"
 je_balkfm_unification_of_yugoslavia_on_fail: "Triggers the Event #white $balkfm_yugoslavia.008.t$#!"
 je_balkfm_unification_of_yugoslavia_status: "[GetGlobalVariable('balkfm_yugoslavia_journal_var').Var('balkfm_yugoslav_leader_var').GetCountry.GetName] leads the $balkfm_yugoslavist_movement$."
 je_balkfm_unification_of_yugoslavia_status_idle: "There is no $balkfm_yugoslav_leader$."
 
 je_balkfm_yugoslav_nationalism: "The Nature of Yugoslavia"
 je_balkfm_yugoslav_nationalism_reason: "Following generations of struggles, [ROOT.GetCountry.GetName] has come into existence as its own nation. However, over a millennium of separation has sown divisions amongst the $balkfm_south_slavs$. As the new nation beings to assert its identity, a new question has come to the forefront: What is \"$YUG$?\" \n\n" # What is YUG? How is YUG? Where does YUG come from?
 je_balkfm_yugoslav_nationalism_complete: "The progress bar has fully advanced to the #bold Integralist#! side"
 je_balkfm_yugoslav_nationalism_on_complete_integralist: "If completed with the #bold Integralist#! solution:\n • Triggers the Event #white #bold $balkfm_yugoslavia.102.t$#!#!\n • $balkfm_lose_yugoslav_cultures$\n • $balkfm_assimilate_to_yugoslav$"
 je_balkfm_yugoslav_nationalism_on_complete_pluralist: "If completed with the #bold Pluralist#! solution:\n • Triggers the Event #white #bold $balkfm_yugoslavia.103.t$#!#!"
 je_balkfm_yugoslav_nationalism_fail: "The progress bar has fully advanced to the #bold Federalist#! side"
 je_balkfm_yugoslav_nationalism_invalid: "[concept_country] is #bold not#! $YUG$"
 je_balkfm_yugoslav_nationalism_status: "Integrating [GetPlayer.MakeScope.Var('balkfm_yugoslav_promotion_target_var').GetName] (#v [GetPlayer.MakeScope.Var('balkfm_yugoslav_promotion_var').GetName] %#!)"

 # Journal Entry Lobby Text
 je_balkfm_unification_of_yugoslavia_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_ip3$\nThe South Slav people have been present throughout the Balkans for over a millennium. In spite of the divides of time and dialects, the Yugoslav plan calls for unifying the South Slavs under one crown."

