l_japanese:
 balkfm_serbia.001.t: "Mileta's Rebellion"
 balkfm_serbia.001.d: "Like much of the Balkans, [ROOT.GetCountry.GetName] is both rural and disorganized, dependent on the Great Powers. Since gaining autonomy from the [SCOPE.sCountry('ottoman_scope').GetName], the Serbian state has been fractured by infighting between Royalist and Constitutionalist factions.\n\nAfter a rebellion by fellow war hero, #yellow Mileta Radojković#!, Prince [ROOT.GetCountry.GetRuler.GetFirstName] agreed to limitations on his power. However, under foreign pressure, the Prince abolished the "Sretenje Constitution" based on concerns over its reformist nature. The Prince now waits for the National Assembly to produce a new constitution."
 balkfm_serbia.001.f: "The Prince, [ROOT.GetCountry.GetRuler.GetFullName], has demanded societal reforms through absolutism, but has found himself opposed by supporters of #yellow Alexander Karađorđević#! who have demanded limits to the power of the throne. Prince [ROOT.GetCountry.GetRuler.GetLastName] may be a war hero, but his demands for absolutist rule have estranged him from the people he seeks to rule."
 balkfm_serbia.001.a: "[ROOT.GetCountry.GetName] will find its way."
 balkfm_serbia.002.t: "A Constitution Imposed"
 balkfm_serbia.002.d: "#yellow Prince#! [ROOT.GetCountry.GetRuler.GetLastName] was loathe to convene the National Assembly to draft a constitution and has found ire with the document presented to both the Porte and the Great Powers. Under pressure from both the Assembly and foreign delegates, the Prince has signed the document, dubbed the "Turkish Constitution," and left the country, abdicating in the process. The new Prince, [SCOPE.sCharacter('milan_scope').GetFullName], while infirm and on his deathbed will soon ascend to the throne."
 balkfm_serbia.002.f: ""When this stone rises from the Sava, you shall return to Serbia again!" -T.V. Perišić to Prince Miloš, 1839"
 balkfm_serbia.002.a: "There is no room for despotism in [ROOT.GetCountry.GetName]."
 balkfm_serbia.002.tt: "#yellow Prince Miloš#! abdicates the throne."
 balkfm_serbia.003.t: "An Inexperienced Ruler"
 balkfm_serbia.003.d: "With the abdication of Prince Miloš, his son [ROOT.GetCountry.GetRuler.GetFullName] nominally took the throne. Sick with consumption when given the throne, he scarcely survived four weeks before giving up the ghost. His brother, [SCOPE.sCharacter('milhailo_scope').GetFullName] has been elected to sit the throne instead. Young and politically inexperienced, his finds himself at the mercy of a National Senate fixated on further curtailment of royal authority."
 balkfm_serbia.003.f: "The young Prince appears to be set in following in his father's footsteps. Desspite his father's exile, he has pushed for a return to autocracy, not knowing that he is eroding what little political support he has. Taking advantage of his political inexperience, supporters of the House of Karađorđević have begun to move against the Prince, seeking to eject House Obrenović from power."
 balkfm_serbia.003.a: "He will have to learn."
 balkfm.404.t: "OPEN"
 balkfm.404.d: "OPEN"
 balkfm.404.f: "OPEN"
 balkfm.404.a: "OPEN"
 balkfm.405.t: "OPEN"
 balkfm.405.d: "OPEN"
 balkfm.405.f: "OPEN"
 balkfm.405.a: "OPEN"
 balkfm.406.t: "OPEN"
 balkfm.406.d: "OPEN"
 balkfm.406.f: "OPEN"
 balkfm.406.a: "OPEN"
 balkfm_serbia.007.t: "Defenders of the Constitution"
 balkfm_serbia.007.d: "Rising up against the threat of absolutist rule, [SCOPE.sCharacter('kaykay_scope').GetFullName] has rallied both political and military leaders to eject [ROOT.GetCountry.GetRuler.GetFullName] from the throne. With the approval of the Porte, he has been named the new Prince of [ROOT.GetCountry.GetName]."
 balkfm_serbia.007.f: ""We did not overthrow one Pasha to replace him with another.""
 balkfm_serbia.007.a: "We will defend our freedom."
 balkfm_serbia.007.tt1: "#yellow Prince Milhailo#! abdicates the throne."
 balkfm_serbia.007.tt2: "House #yellow Karađorđević#! takes the throne."
 balkfm_serbia.008.t: "Absent Reform"
 balkfm_serbia.008.d: "Despite widespread demands for reforms away from the archaic socio-economic systems left behind by Ottoman rule, the Skupština has balked at implementing them on a timely scale."
 balkfm_serbia.008.f: "Unless [ROOT.GetCountry.GetName] can break free from its Turkish legacy, we may be doomed to the same rot that has consumed the #bold Porte#!."
 balkfm_serbia.008.a: "Are we doomed to stagnation?"
 balkfm_serbia.009.t: "[ROOT.GetCountry.GetName] Reforged"
 balkfm_serbia.009.d: "Despite the impingement on royal dignity, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has brought forward reforms that has vastly curtailed royal privileges while providing meaningful guarantees of liberty to the Serbian people."
 balkfm_serbia.009.f: "The Serbian people can hold their heads high with the confidence and knowledge that they can thrown off the last vestiges of the feudal shackles placed on them by the Ottoman state."
 balkfm_serbia.009.a: "Justly so."

 balkfm_serbia.010.t: "House Karađorđević Takes the Throne"
 balkfm_serbia.010.d: "Support has collapsed for House Obrenović. Taking the initiative, [ROOT.GetCountry.GetRuler.GetFullName] has returned from exile. After appealing to the Senate, he has been named the new Prince of [ROOT.GetCountry.GetName]. "
 balkfm_serbia.010.f: "The former Prince, [SCOPE.sCharacter('balkfm_obrenovic_scope').GetFullName] has departed into exile. However, he still retains a powerful base of support in the Senate. The new Prince will have to act swiftly to legitimize his rule."
 balkfm_serbia.010.a: "[ROOT.GetCountry.GetName] must find its way."
 balkfm_serbia.011.t: "House Obrenović Takes the Throne"
 balkfm_serbia.011.d: "Support has collapsed for House Karađorđević. Taking the initiative, [ROOT.GetCountry.GetRuler.GetFullName] has returned from exile. After appealing to the Senate, he has been named the new Prince of [ROOT.GetCountry.GetName]"
 balkfm_serbia.011.f: "The former Prince, [SCOPE.sCharacter('balkfm_balkfm_karadordevic_scope').GetFullName] has departed into exile. However, he still retains a powerful base of support in the Senate. The new Prince will have to act swiftly to legitimize his rule."
 balkfm_serbia.011.a: "[ROOT.GetCountry.GetName] must find its way."
 balkfm_serbia.012.t: "[SCOPE.sCountry('balkfm_supplicant_scope').GetName] Demands Diplomatic Precedence"
 balkfm_serbia.012.d: "With House [ROOT.GetCountry.GetRuler.GetLastName] sitting the throne, their benefactors in [SCOPE.sCountry('balkfm_supplicant_scope').GetName] have presented the court with a demand that their consul be placed first in the Serbian diplomatic precedence. The consul from [SCOPE.sCountry('balkfm_consul_scope').GetName] has lodged a protest at the demand."
 balkfm_serbia.012.f: "Despite not coming to blows over the matter, an endless competition has developed between Russia and Austria for having the highest degree of influence over the Prince."
 balkfm_serbia.012.a: "We will not dislodge [SCOPE.sCountry('balkfm_consul_scope').GetName]"
 balkfm_serbia.012.b: "[SCOPE.sCountry('balkfm_supplicant_scope').GetName] deserves precedence."
 balkfm_serbia.013.t: "Plague Outbreak!"
 balkfm_serbia.013.d: "An outbreak of plague across the [SCOPE.sCountry('ottoman_scope').GetName] has left Prince [ROOT.GetCountry.GetRuler.GetFirstName] at an impasse: contain the sickened Turkish garrison in their fortress and limit the spread, or avoid angering the Porte at the risk of allowing the disease to spread."
 balkfm_serbia.013.f: "While the state has easily secured its borders, it was the Turkish garrison in Belgrade that brought the plague into Serbian lands. We are confident that the outbreak can be contained if we act quickly."
 balkfm_serbia.013.a: "Surround the garrison. No one in or out."
 balkfm_serbia.013.b: "That would violate the Porte's rights."
 balkfm_serbia.014.t: "Abusive Garrison"
 balkfm_serbia.014.d: "The Turkish Garrison in Belgrade has been accused of abuses against the Serbian population of the city. With accusations ranging from theft to outright murder, the Senate has demanded that the Prince seek redress from the Porte."
 balkfm_serbia.014.f: "Nominally, Serbia was granted full authority to govern itself. Yet, the Porte has insisted in maintaining their garrison in the Fortress of Belgrade in violation of their treaty obligations."
 balkfm_serbia.014.a: "We will demand remediation."
 balkfm_serbia.014.b: "We cannot anger the Porte."

 balkfm_serbia.017.t: "[SCOPE.sCountry('balkfm_supplicant_scope').GetName] Elevated to Diplomatic Precedence"
 balkfm_serbia.017.d: "With House [ROOT.GetCountry.GetRuler.GetLastName] sitting the throne, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has elevated the [SCOPE.sCountry('balkfm_supplicant_scope').GetAdjective] consul to the first position in [ROOT.GetCountry.GetAdjective] diplomatic precedence. The consul from [SCOPE.sCountry('balkfm_consul_scope').GetName] has lodged a protest at this action."
 balkfm_serbia.017.f: "Despite not coming to blows over the matter, an endless competition has developed between Russia and Austria for having the highest degree of influence over the Prince."
 balkfm_serbia.017.a: "[SCOPE.sCountry('balkfm_supplicant_scope').GetName] deserves precedence."
 balkfm_serbia.018.t: "Cementing the Monarchy"
 balkfm_serbia.018.d: "In a rousing speech to the #o Senate#!, #yellow House#! [ROOT.GetCountry.GetRuler.GetLastName] has made the formal demand that their reign should become both permanent and hereditary."
 balkfm_serbia.018.f: "Despite widespread support, there remain powerful detractors across [ROOT.GetCountry.GetName] and that goes without mentioning the reaction foreign power may have."
 balkfm_serbia.018.a: "[ROOT.GetCountry.GetName] deserves a proper [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 balkfm_serbia.018.cement: "A cement is a binder, a chemical substance used for construction that sets, hardens, and adheres to other materials to bind them together. Cement is seldom used on its own, but rather to bind sand and gravel (aggregate) together. Cement mixed with fine aggregate produces mortar for masonry, or with sand and gravel, produces concrete. Concrete is the most widely used material in existence and is behind only water as the planet's most-consumed resource."
 balkfm_serbia.019.t: "Mandate Secured"
 balkfm_serbia.019.d: "Despite the deep divisions that plague the #o Senate#!, #yellow House#! [ROOT.GetCountry.GetRuler.GetLastName] has cemented themselves as the rightful rulers of [ROOT.GetCountry.GetName]. With the passage of Acts of Inheritance, the Serbian state will finally have a hereditary monarch."
 balkfm_serbia.019.f: "By stabilizing the conflict over the Monarchy, both the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] and the Senate should be able to secure a measure of political stability in Serbia."
 balkfm_serbia.019.a: "All Hail House [ROOT.GetCountry.GetRuler.GetLastName]!"

 balkfm_serbia.020.t: "Clerical Publicity"
 balkfm_serbia.020.d: "The [SCOPE.gsInterestGroup('serb_clerical_publicity_ig').GetName] has offered us aid in our sacred cause to weaken [SCOPE.sCharacter('balkfm_karadordevic_scope').GetFullName]'s influence on people. Descendants of deserters shall not have a voice in [ROOT.GetCountry.GetName]."
 balkfm_serbia.020.f: "In a quiet valley of the village of Takovo, [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting] and his fellow folk walked out of the congregation, as he declared a Serbian uprising against the Ottomans.\n\nThe year was 1815. Those who named themselves "heroes" have already fled to find shelter under the wings of their foreign masters. One of them was Karađorđe, [SCOPE.sCharacter('balkfm_dynastic_opposition_scope').GetFirstNameNoFormatting]'s father."
 balkfm_serbia.020.a: "This should be sufficient."
 balkfm_serbia.020.b: "In unity, there is strength."
 balkfm_serbia.020.c: "Philanthropy is the essence of faith, isn't it?"
 balkfm_serbia.021.t: "Slander Pamphlets"
 balkfm_serbia.021.d: "We have been given the opportunity to produce pamphlets to defame the [ROOT.GetCountry.GetCustom('balkfm_dynastic_rivalry_dynasty_type')]."
 balkfm_serbia.021.f:1 "There is a fine line between propaganda and slander. And for sure, the former has the potential to be a politician's deadliest weapon. A pamphlet sample made by a renowned artist and calligrapher was presented to the Prince that morning.\n\nHolding the paper, he observed that under many mischievous 'facts' written on top, there was the patriarch of the [ROOT.GetCountry.GetCustom('balkfm_dynastic_rivalry_dynasty_type')] on all fours, chewing on thigh meat that was captioned as 'a Serbian Peasant' in the local tongue while being ridiculed and commanded by an Ottoman pasha."
 balkfm_serbia.021.a: "Ingenious."
 balkfm_serbia.021.b: "Start the production, now!"
 balkfm_serbia.022.t: "Exposing Hypocrites"
 balkfm_serbia.022.d: "It emerges that [SCOPE.sCharacter('serb_busted_ig_leader').GetFullName], leader of the [SCOPE.gsInterestGroup('serb_busted_ig').GetName] has been working secretly to persuade other politicians in favor of [SCOPE.sCharacter('balkfm_dynastic_opposition_scope').GetLastName]'s vile campaign."
 balkfm_serbia.022.f: "Banquets serve as important gatherings where various unspoken dynamics unfold. They often involve negotiations, displays of influence, slurping sounds of gluttonous megalomaniacs, and the ever-present competition to maintain prestige among peers. \n\nNavigating the complexities of individuals who present different facets of themselves is both a challenging and rewarding endeavor."
 balkfm_serbia.022.a: "Make him disappear."
 balkfm_serbia.022.b: "Force him to work for us."
 balkfm_serbia.023.t: "Renegade Hajduks"
 balkfm_serbia.023.d: "Irregular troops under the command of [SCOPE.sCharacter('balkfm_dynastic_opposition_scope').GetFullName] have been harassing [SCOPE.sReligion('sunni_pop_scope').GetName] and [SCOPE.sReligion('jewish_pop_scope').GetName] neighborhoods."
 balkfm_serbia.023.f: ""You know how they are, my [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. They used to enjoy raiding Ottoman trade caravans and aristocrats, but all they have left now are peasants without anyone to protect them." the advisor shooed the messenger with a swift gesture before proceeding "Karađorđe was one of them during the years of rebellion, now his son is trying to keep his father's friends happy.""
 balkfm_serbia.023.a: "Let them be, or they will turn to their own for loot."
 balkfm_serbia.023.b: "This cannot continue."
 balkfm_serbia.024.t: "Urban Rebels"
 balkfm_serbia.024.d: "A band of rebels in [SCOPE.sState('capital_state').GetName] have been demanding us to abdicate the throne to [SCOPE.sCharacter('balkfm_dynastic_opposition_scope').GetFullName]. They pose no critical threat, but how they're dealt with will send a message."
 balkfm_serbia.024.f: "Empathy is an attribute all remarkable leaders must possess. Having rebelled against undesired oppression, the Prince knows very well the meaning of taking back what's actually yours.\n\n"Nothing short of a group of young, gullible rascals they are." he murmured while peeking out the window. "We were at least fighting for the future of our nation, not for a man.""
 balkfm_serbia.024.a: "Make sure they're properly silenced."
 balkfm_serbia.024.b: "Arm loyalists and send them in as a show of strength."
 balkfm_serbia.024.c: "No need for bloodshed, everyone has a price."
 balkfm_serbia.025.t: "Plea for Aid"
 balkfm_serbia.025.d: "Dire news of Magyarization in [SCOPE.sState('delvidek_scope').GetName] has reached us recently. Certain Serbian villages await support from their brethren over the river. This is a valuable opportunity to bolster our stance against [SCOPE.sCharacter('balkfm_dynastic_opposition_scope').GetFullName]."
 balkfm_serbia.025.f: "The aidant untied a string that tightened all envelopes together, before opening the top-most one to read aloud.\n\n"To his Most Excellent Majesty, [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting] of House [ROOT.GetCountry.GetRuler.GetLastNameNoFormatting], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of all honorable Serbs.\n\nMay it please your greatness,\n\nI am writing humbly on behalf of our unworthy, but loyal village to ask for a return of favor. As you might recall, yet not in actuality, but we were there during your revolutionary victory against the Ottomans with whatever we could send...""
 balkfm_serbia.025.a: "Send them help to resist back."
 balkfm_serbia.025.b: "Invite over to their real homeland and help them rebuild."
 balkfm_serbia.025.b_move_pops_tt: "10% of Serbians in [SCOPE.sState('delvidek_scope').GetName] will move to [SCOPE.sState('capital_state').GetName]."

 balkfm_serbia.028.t: "Here To Stay"
 balkfm_serbia.028.d:1 "One by one, the lackeys of the [ROOT.GetCountry.GetCustom('balkfm_dynastic_rivalry_dynasty_type')] have betrayed them on their path to a terrible fate. All have seen the indisputable; [ROOT.GetCountry.GetName] belongs to the [ROOT.GetCountry.GetCustom('serbia_ruling_dynasty')]!"
 balkfm_serbia.028.f:1 ""Is this how you treat your saviors?" panic and desperation echoed throughout the hall "My father led this country to freedom while you were all hoarding riches. You will never understand what it means to carry the blood of a hero!"\n\nLoyal hounds were awaiting judgment.\n\n"Never!""
 balkfm_serbia.028.a: "You shall share the fate of your father."
 balkfm_serbia.028.b: "Do not ever set foot on Serbian soil."
 balkfm_serbia.028.c: "Mercy is a gift given only to true leaders."
 balkfm_serbia.029.t: "The Reckoning"
 balkfm_serbia.029.d:1 "Just as their father delivered them from the brink of destruction, the [ROOT.GetCountry.GetCustom('balkfm_dynastic_rivalry_dynasty_type')] has reigned supreme against the [ROOT.GetCountry.GetCustom('serbia_ruling_dynasty_short')] tyranny. The throne of [ROOT.GetCountry.GetName] now belongs to them."
 balkfm_serbia.029.f: ""Comrades! Sacred mothers! We are now free from the grasp of nesting politicians who do nothing for the sake of our homeland..." exclaimed the new [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of [ROOT.GetCountry.GetNameNoFormatting]. \n\nRecalling his father's heroic pursuit of freedom, the crowd kept on cheering, eager to heed the final judgment. \n\n"...and what say you for the fate of betrayers?" the Prince paused briefly, confident that whatever next came out of his mouth, they would comply without question."
 balkfm_serbia.029.a: ""...shall we send them to meet the Lord?""
 balkfm_serbia.029.b: ""...are we to keep feeding them?""
 balkfm_serbia.029.c: ""...will mercy be their final judgment?""

 balkfm_serbia.200.t: "The Serbian Heartlands"
 balkfm_serbia.200.d: "[ROOT.GetCountry.GetName] may be free from direct rulership from the Porte, but there remain countless [GetCulture('serb')] populations trapped beyond our borders. We must see them reunited with the Serbian state."
 balkfm_serbia.200.f: "Consisting of the lands north of the river Vardar and stretching as far as Macedonia to the south and Bosnia to the west, the conquest of the lands of "Old Serbia" has become a rallying cry for Serbian nationalists."
 balkfm_serbia.200.a: "It is our duty to liberate all Serbs from oppression."
 balkfm_serbia.201.t: "Greater Serbia"
 balkfm_serbia.201.d: "With the heartlands of our great nation under our control, irredentist fervor has swept [ROOT.GetCountry.GetName]. Both citizen and politician alike clamor for the restoration of Serbian supremacy in the Balkans."
 balkfm_serbia.201.f: "In Byzantine times, the Serbian Empire ruled a vast realm stretching from the "
 balkfm_serbia.201.a: "[ROOT.GetCountry.GetName] will rise again!"
 balkfm_serbia.201.tt: "#red Restoring the #bold Serbian Empire#! will abandon the Yugoslav cause#!."
 balkfm_serbia.202.t: "Restoration of the Serbian Empire"
 balkfm_serbia.202.d: "Through the blood and sacrifices of the Serbian people, the [ROOT.GetCountry.GetName] has been reborn!"
 balkfm_serbia.202.f: "Today the Serbian flag waves proudly over the Balkans. Never again will be led our people become slaves to foreign Empires."
 balkfm_serbia.202.a: "[ROOT.GetCountry.GetName] will never be vanquished!"
 balkfm_serbia.203.t: "Society of Serbian Letters"
 balkfm_serbia.203.d: "Serbian intellectuals have convened in [ROOT.GetCountry.GetCapital.GetCityHubName] with the aim of discussing and reaching a consensus regarding standardizing the [GetCulture('serb').GetName] language."
 balkfm_serbia.203.f: "Organized with the blessing of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], the group has already made significant progress in producing the first common list of letters."
 balkfm_serbia.203.a: "This is an excellent initiative."
 balkfm_serbia.204.t: "May Assembly"
 balkfm_serbia.204.d: "[GetCulture('serb').GetName] leaders in [SCOPE.sCountry('vojvodina_scope').GetCapital.GetName] gave gathered with the purpose of renouncing Austrian rule. In defiance of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], members of the "May Assembly" have proclaimed Serbian [SCOPE.sCountry('vojvodina_scope').GetName] and have petitioned for autonomy from [ROOT.GetCountry.GetCapital.GetCityHubName]."
 balkfm_serbia.204.f: "Concerned that their struggle has been overshadowed by the larger dispute between Austria and Hungary, Serbian intellectuals have seized on the fears of our Serb subjects of future oppression by our sister government in Budapest."
 balkfm_serbia.204.a: "We cannot tolerate this insult to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 balkfm_serbia.204.b: "Their demands are only fair."
 balkfm_serbia.205.t: "The Vojvodina Uprising"
 balkfm_serbia.205.d: "Our [GetCulture('serb').GetName] brothers in [SCOPE.sCountry('vojvodina_scope').GetName] have proclaimed their autonomy from the royal government in [SCOPE.sCountry('austria_scope').GetName]. [SCOPE.sCountry('austria_scope').GetRuler.GetFirstName] has rejected their demands for independence and now seeks to quash the uprising."
 balkfm_serbia.205.f: "With the force of the Austrian army bearing down on them, the Serbs of Vojvodina have reached out to Serbia with the hope of securing foreign support."
 balkfm_serbia.205.a: "We will join our brothers!"
 balkfm_serbia.205.b: "Smuggle aid across the border."
 balkfm_serbia.205.c: "We cannot afford to interfere."
 balkfm_serbia.206.t: "The Serbian Voivodship"
 balkfm_serbia.206.d: "Our [GetCulture('serb').GetName] brothers in [SCOPE.sCountry('vojvodina_scope').GetName] have proclaimed their autonomy from the royal government in [SCOPE.sCountry('austria_scope').GetName]. In his wisdom, [SCOPE.sCountry('austria_scope').GetRuler.GetFirstName] has acknowledged their autonomy and has organized the region as a top-level division of the Habsburg Empire."
 balkfm_serbia.206.f: "By providing broad rights to the Serbs under his rule, the [SCOPE.sCountry('austria_scope').GetRuler.GetPrimaryRoleTitle] has diffused one of the many nationalist movements that threaten the integrity of the Empire."
 balkfm_serbia.206.a: "But [ROOT.GetCountry.GetName] will not be whole without them!"