l_japanese:
 grefm_hellenic_empire.001.t: "The Vergina Sun Rises"
 grefm_hellenic_empire.001.d: "Church bells ring and people cheer as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] declares the rebirth of the [ROOT.GetCountry.GetName]. Beneath the imposing presence of the [SCOPE.sBuilding('hagia_sofia_scope').GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been adorned with reconstructions of the old sigils and regalia of the Ancient Greek Kings of Old. Stepping forward towards the array of citizens, dignitaries, and clergy, [ROOT.GetCountry.GetRuler.GetFirstName] stands as a beacon for the future of the Greek people."
 grefm_hellenic_empire.001.f: "Where countless attempts failed over the centuries since the losses of Rome and Constantinople, the Empire stands resurgent today. However, much work remains: numerous Greeks are ruled by heretics and heathens, formerly Roman lands remain within the grasp of foreign pretenders, and countless Byzantine treasures are kept hostage abroad. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must be sure to live up to the expectations of [ROOT.GetCountry.GetRuler.GetHerHis] subjects if [ROOT.GetCountry.GetRuler.GetSheHe] is to bring glory to [ROOT.GetCountry.GetName]."
 grefm_hellenic_empire.001.a: "This is a new dawn."
 grefm_hellenic_empire.001.b: "It is time to focus on our own prosperity."
 grefm_hellenic_empire.002.t: "The Revenge of the Greeks"
 grefm_hellenic_empire.002.d: "Our efforts have borne fruit with the rebirth of the [ROOT.GetCountry.GetName]. Now several voices call for the restoration of [ROOT.GetCountry.GetAdjectiveNoFormatting] power and prestige with the return of formerly Greek lands to the Hellenic State. It falls to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to determine the future of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state."
 grefm_hellenic_empire.002.f: ""The Kingdom of Greece is not Greece; it is merely a part: the smallest, poorest part of Greece. The Greek is not only he who inhabits the Kingdom, but also he who inhabits Ioannina, Salonika or Serres or Adrianople or Constantinople or Trebizond or Crete or Samos or any other region belonging to the Greek history or the Greek race... There are two great centres of Hellenism. Athens is the capital of the Kingdom. Constantinople is the great capital, the dream and hope of all Greeks." -I. Kolettis, 1844"
 grefm_hellenic_empire.002.a: "We will restore the glory of the [ROOT.GetCountry.GetName]."
 grefm_hellenic_empire.002.b: "This goal is unreasonable."
 grefm_hellenic_empire.009.t: "The Greek Realm"
 grefm_hellenic_empire.009.d: "Cheers have erupted across [ROOT.GetCountry.GetName] as the people cheer for the unification of all $grefm_greek$ peoples across the East into the [ROOT.GetCountry.GetAdjectiveNoFormatting] state."
 grefm_hellenic_empire.009.f: "From the Peloponnese, across the Bosporus, and along the Nile, the $grefm_greeks$ at last find themselves under the shelter of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state."
 grefm_hellenic_empire.009.a: "The True [ROOT.GetCountry.GetName] has been restored!"

 grefm_hellenic_empire.010.t: "The Lands of Arianōn"
 grefm_hellenic_empire.010.d: "With our Eastern borders established, scholars and nationalists alike make calls for the expansion of Greek influence across formerly Greek lands in the Iranian plateau."
 grefm_hellenic_empire.010.f: "Before the explosive rise of Islam in the 600s and 700s, countless communities from the Tigris to the Indus counted themselves among Christendom, including the Ancient Church of the East and the Nestorian heretics. These communities have grown more and more fragmented since their isolation from the old seats of Christianity. Even longer before this, Greek kingdoms were scattered along the Iranian plateau along the Hindu Kush up and into the edges of Punjab."
 grefm_hellenic_empire.010.a: "Persia, Africa, Arabia... all will submit to Hellas."
 grefm_hellenic_empire.010.b: "We should count our blessings."
 grefm_hellenic_empire.011.t: "The Graveyard of Empires"
 grefm_hellenic_empire.011.d: "With the subjugation of Iran, a greater design has come into view: the reclamation of the lands held by Alexander the Great."
 grefm_hellenic_empire.011.f: "After the collapse of the Selucid Empire during the rise of the Roman Empire, several large Greek Kingdoms emerged across the Iranian plateau and Afghani lands in the Hindu Kush, which survived as far as the first century AD. Reminders of this survive to this day with placenames and the presence of minute, but resilient, Greek villages dotting the mountains."
 grefm_hellenic_empire.011.a: "We will make it so."
 grefm_hellenic_empire.012.t: "The Empire of the Greeks"
 grefm_hellenic_empire.012.d: "The Lands once conquered by Alexander the Great at the apex of hellenic influence are once again under Greek control. The Hellenistic Empire has reforged!"
 grefm_hellenic_empire.012.f: "While short-lived, Alexander's conquests represented the largest amount of land ever held under a single Greek ruler. Thanks to the valor of our armies and the steady hand of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName], we have reclaimed the mantle of the Empire."
 grefm_hellenic_empire.012.a: "The Hellenic Empire is Restored."
 grefm_hellenic_empire.013.t: "The Shores of the Hospitable Sea"
 grefm_hellenic_empire.013.d: "We are unchallenged in our control of the heartlands of Christendom. The last obstacle to our authority remains in the form of the $RUS_ADJ$ Orthodoxy, which still claims supremacy over the Eastern Church."
 grefm_hellenic_empire.013.f: "The [ROOT.GetCountry.GetName] once held sway over the Black Sea. Even today, communities of Orthodox Greeks dot its shores. Before setting our eyes on the usurpers to the north, we must first liberate our countrymen from the Slavic yoke."
 grefm_hellenic_empire.013.a: "Ready the fleet!"
 grefm_hellenic_empire.014.t: "The Lands of Magna Graecia"
 grefm_hellenic_empire.014.d: "As the Empire seeks to affirm it's legitimacy, nationalist leaders have begun to clamor for the return of Southern Italy to Greek hands as it was in the time before the Romans."
 grefm_hellenic_empire.014.f: "Southern Italy, once known as Magna Graecia to the Romans was home to several Greek colonies and hosted a unique fusion of Greek and Latin culture. Several Greek-speaking communities have continued to thrive on the peninsula despite centuries of isolation from the Greek mainland."
 grefm_hellenic_empire.014.a: "These lands will return to us."
 grefm_hellenic_empire.015.t: "The Foundings of Alexander"
 grefm_hellenic_empire.015.d: "As Alexander's armies thundered across Asia, both he and his generals founded several cities in his name, each serving as a beacon of Hellenism in the east. With the restoration of the [ROOT.GetCountry.GetName], leaders have ardently called for the reconquest of the farthest reaches of the Empire, many of which lie in the hands of the [Concept('concept_great_power','$concept_great_powers$$')]."
 grefm_hellenic_empire.015.f: ""Shall I pass by and leave you lying there because of the expeditions you led against Greece, or shall I set you up again because of your magnanimity and your virtues in other respects?" -Alexander the Great, to a statue of Xerxes the Great (supposedly)"
 grefm_hellenic_empire.015.a: "We will see Alexander's Legacy Restored."