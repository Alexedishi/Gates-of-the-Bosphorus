 je_grefm_eastern_glory: "The Empire of the Greeks"
 je_grefm_eastern_glory_reason: "The Greek World once stretched from the hills of the Balkans to the shores of the Levantine Sea. Across the Mediterranean, Greek peoples call for union with the Greek state. We will see the Greek realm restored."
 je_grefm_eastern_glory_possible: "[ROOT.GetCountry.GetNameNoFlag] has formed #bold Graia#!"
 je_grefm_wonders_of_the_nile: "The Wonders of the Nile"
 je_grefm_wonders_of_the_nile_reason: "Phoenicia, an ancient name for the land known as the Levant, once linked the ancient Greek world to the eastern centers of civilization in Egypt and Mesopotamia. Once a part of the easternmost Roman Empire, these lands have languished under centuries of Muslim rulers."