 greek: "Hellene"

 concept_bavarocratic_ire_desc: "$concept_bavarocratic_ire_short$ represents the Greek population's opposition to the rule of the $grefm_bavarocracy$ in Greece. High $concept_bavarocratic_ire_short$ may result in the ousting of King Otto and his Bavarian supporters.\n\nThe following conditions will #bold advance#! $concept_bavarocratic_ire_short$:\n• Hosting the #bold Bavarian Auxiliaries#!\n• [GetCulture('south_german').GetName] [Concept('concept_commander','$concept_commanders$')] or [Concept('concept_character', '$concept_characters$')] in [concept_in_government]\n• #bold Not#! having an [GetReligion('orthodox').GetName] [concept_ruler]\n• The [concept_ruler] #bold Not#! having an [concept_heir]\n• The [concept_ruler] being unmarried \n• #bold Not#! having [Concept('concept_votes','$concept_voting_rights$')]\n• Fielding less than #v 10#! [Concept('concept_battalion', '$concept_battalions$')]\n• [Concept('concept_radical','$concept_radicals$')] in owned [GetCulture('greek').GetName] [concept_homeland] [Concept('concept_state','$concept_states$')]\n• Having recently #r lost#! a [concept_war]\n• Declaring [concept_bankruptcy] or being in [concept_default]\n• Event or button choices\n\nThe following conditions will #bold deplete#! $concept_bavarocratic_ire_short$:\n• Owning [GetCulture('greek').GetName] [concept_homeland] [Concept('concept_state','$concept_states$')]\n• [Concept('concept_loyalist','$concept_loyalists$')] in owned [GetCulture('greek').GetName] [concept_homeland] [Concept('concept_state','$concept_states$')]\n• Having recently #g won#! a [concept_war]\n• Having at least one [GetBuildingType('building_university').GetName] in a [GetCulture('greek').GetName] [concept_homeland] [concept_state]\n• Fielding more than #v 20#! [Concept('concept_battalion', '$concept_battalions$')]\n• Building the [GetBuildingType('gbbf_building_palaia_anaktora').GetName]\n• Dismissing the #bold Bavarian Auxiliaries#!\n• Releasing #bold Nikitaras#! from prison\n• Event or button choices"

 je_greek_nationalism: "The Megali Idea"
 je_greek_nationalism_lobby: "$gbbf_journal_lobby$\n$gbbf_integrates_ip3$\nFrom the Greek city-states of antiquity through the multi-ethnic Roman and Ottoman Empires, the Greek communities have never beheld a state that they valued over their own home villages and regions. Spearheaded by Enlightenment thought, two opposing movements have emerged, each seeking to unite the Greek people under a truly common identity."

 je_sick_man_syria: "Sick Man: Reclaim Syria"
 je_sick_man_syria_reason: "In his arrogance, the self-styled Khedive of Egypt, Muhammad Ali, saw the transfer of Syria and the Levant from Ottoman administration to that of Egypt. We must right this assault on the Sultan's authority."
 je_sick_man_egypt: "Sick Man: Reclaim Egypt"
 je_sick_man_egypt_reason: "Egypt has been an integral province of the Caliphate for centuries. The time has come to bring the ancient Kingdom back under the direct administration of the Sultan."