l_braz_por:
 balkfm_montenegro.001.t: "A Feudal Relic"
 balkfm_montenegro.001.d: "For centuries, the Prince-Bishopric of [ROOT.GetCountry.GetName] has successfully resisted the tide of the [SCOPE.sCountry('ottoman_scope').GetName]'s expansion across the Balkans. Despite this, Montenegro is a disorganized country where taxation is informal, justice is carried out by tribal leaders, and there is little central authority.\n\nThe young Prince-Bishop, [ROOT.GetCountry.GetRuler.GetFullName], inspired by liberalism from the West, seeks to break the Montenegrin state from its feudal mould. All the while, Viziers from the neighboring Ottoman Eyalets eye the borders with glee, each with the hope of finally subduing the Black Mountain itself."
 balkfm_montenegro.001.f: ""The mentality of our people is still very patriarchal. Here the knife, revenge and a tribal system exist as nowhere else. The whole country is interconnected and almost everyone knows everyone else. Montenegro is nothing but a large family—all of this augurs nothing good." -Mihajlo Dedeji"
 balkfm_montenegro.001.a: "[ROOT.GetCountry.GetName] will find its way."
 balkfm_montenegro.001.tt: "As long as we lack a formal border with the Ottoman Empire, we will be at risk of cross-border raids by local #italic beys#!."
 balkfm_montenegro.002.t: "Advancing From Tradition"
 balkfm_montenegro.002.d: "Pushing against centuries of inertia, [ROOT.GetCountry.GetName] has finally begun to shed its feudal legacy."
 balkfm_montenegro.002.f: "While resisted by the conservative leadership, the Prince-Bishopric has taken the first steps towards moving the country to the modern age. There is much left to do, but with these first social reforms, the people might begin to envision a Montenegrin world that encompasses all Montenegrins that live in the shadows of the Black Mountain."
 balkfm_montenegro.002.a: "[ROOT.GetCountry.GetName] can only grow from here."
 balkfm_montenegro.003.t: "Centralized Administration"
 balkfm_montenegro.003.d: "The Prince-Bishop's efforts have given fruit with the birth of the first state-like administration of the country."
 balkfm_montenegro.003.f: "By wresting control of the fledgling state apparatus from the ecclesiarchy, the Prince-Bishop has begun the process dragging [ROOT.GetCountry.GetName] kicking and screaming into the modern era."
 balkfm_montenegro.003.a: "Justly done."
 balkfm_montenegro.004.t: "A Professional Outfit"
 balkfm_montenegro.004.d: "Through the diligent efforts of the Prince-Bishop, the military has been reorganized from a tribalistic militia hardly deserving the name to a proper extension of state authority."
 balkfm_montenegro.004.f: "While this will do little to sway the Porte's desperation to retain its grip on the Balkans, at the very least we may be able to stave off their wrath."
 balkfm_montenegro.004.a: "Excellent news!"
 balkfm_montenegro.005.t: "The Court of the Tsar"
 balkfm_montenegro.005.d: "After months of delays and diplomatic wrangling, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has been received at [SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('russia_scope').GetRuler.GetFirstName]'s court in [SCOPE.sCountry('russia_scope').GetCapital.GetName]. After a dinner and friendly chatter, he has returned to [ROOT.GetCountry.GetName] with promises of continued $RUS_ADJ$ support for the Montenegrin cause."
 balkfm_montenegro.005.f: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s visit has been somewhat cooler in contrast to his trip in 1834, on account of his desires to introduce liberal thought into Montenegro. Yet, the $RUS_ADJ$ court seems unwilling to let slip such an easy inroad to the Balkans."
 balkfm_montenegro.005.a: "We will need strong protectors."
 balkfm_montenegro.006.t: "The Mountain Wreath"
 balkfm_montenegro.006.d: "Following a year of dedication, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has published his epic work, #yellow The Mountain Wreath#!. A grandiose work of Montenegrin epic poetry, the massive poem tells a heroic story of Montenegrin defiance against the forces that would see it erased from the Balkans. In providing this work to the masses, [ROOT.GetCountry.GetRuler.GetFirstName] has lit a beacon that calls for the unification of the Montenegrin Serbs under one independent flag."
 balkfm_montenegro.006.f: ""When things go well 'tis easy to be good,/nIn suffering one learns who is the hero!"/n -The Mountain Wreath, Verses 137–138"
 balkfm_montenegro.006.a: "[ROOT.GetCountry.GetName] will rise."
 balkfm_montenegro.006.tt: "Countries controlling #yellow Serb#! lands will begin to experience events increasing #yellow Serb#! radicalism."
 balkfm_montenegro.007.t: "An Intractable Illness"
 balkfm_montenegro.007.d: "For several months now, Bishop [ROOT.GetCountry.GetRuler.GetLastName] has been suffering from a severe cough. After seeing a physician in Cattaro, the Prince has been diagnosed with #yellow tuberculosis#!. The Bishop's condition has only continued to deteriorate since, leading many to worry his time on this earth is coming to an end."
 balkfm_montenegro.007.f: "[ROOT.GetCountry.GetName] lacks any physicians of the training required to treat the symptoms of consumption. Hoping to improve his humours, the Prince has devoted more of his time to relaxing and writing."
 balkfm_montenegro.007.a: "Unfortunate."
 balkfm_montenegro.008.t: "The Passing of the Bishop"
 balkfm_montenegro.008.d: "Tragedy has struck [ROOT.GetCountry.GetName]. Bishop [ROOT.GetCountry.GetRuler.GetFirstName] has been found dead in his chambers, his body finally claimed by consumption. The national senate stands divided between [SCOPE.sCharacter('balkfm_heir_scope').GetFirstName] and his brother [SCOPE.sCharacter('balkfm_pero_scope').GetFullName], with Danilo taking power thanks to popular backing."
 balkfm_montenegro.008.f: "While vigorous like his father, Bishop [SCOPE.sCharacter('balkfm_heir_scope').GetLastName] is young and inexperienced. However, he carries his father's same desire for secular rule in Montenegro."
 balkfm_montenegro.008.a: "Tragic Circumstances."
 balkfm_montenegro.009.t: "The Light of Modernity"
 balkfm_montenegro.009.d: "The recent reforms in [ROOT.GetCountry.GetName] have seen major strides towards accomplishing the dreams of #yellow Petar I#! to see the country advance beyond its tribal roots. While there remains much to be done, these first steps signal to the world that the small state is ready to make its mark on the global community."
 balkfm_montenegro.009.f: "While the West may still consider Montenegro to be backwards when compared to the Great Powers, they can not longer accuse us of being “uncivilized.""
 balkfm_montenegro.009.a: "Justly done."

 balkfm_montenegro.010.t: "The Little Rabbit"
 balkfm_montenegro.010.d: "[ROOT.GetCountry.GetRuler.GetFirstName] has been thrust into rulership without adequate time to prepare. In light of his youth and inexperience, several tribal heads have crowded into Cetinje to decry his ascent to the throne of [ROOT.GetCountry.GetName]."
 balkfm_montenegro.010.f: "With the unexpected news of Petar's death, the young [ROOT.GetCountry.GetRuler.GetFirstName] has interrupted his studies to rush back to Montenegro from abroad, hoping to head off any attempts at interference by the tribes."
 balkfm_montenegro.010.a: "We must have order."
 balkfm_montenegro.011.t: "A Hostile Court"
 balkfm_montenegro.011.d: "The untimely passing of #yellow Petar II#! has reignited old tribal rivalries. Early in his reign, the Prince-Bishop designated [ROOT.GetCountry.GetRuler.GetFirstName] as his successor. Led by [SCOPE.sCharacter('balkfm_landowners_leader_scope').GetFullName], tribal leaders have moved to install the late Prince-Bishop's brother, [SCOPE.sCharacter('balkfm_pero_scope').GetFullName], as the ruler of [ROOT.GetCountry.GetName]."
 balkfm_montenegro.011.f: "Per tradition, the young [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] is well within his rights to drive this challenger from the country. However, the social norms of the Black Mountain have placed him in a bind: he can either show clemency, and thus weakness, or take the risk of placing the #yellow Petrovićs#! in blood with their own kin."
 balkfm_montenegro.011.a: "We cannot tolerate this insolence."
 balkfm_montenegro.011.b: "Violence is not the solution."
 balkfm_montenegro.012.t: "Blood Revenge"
 balkfm_montenegro.012.d: "Terrible news has arrived in Cetinje. The [ROOT.GetCountry.GetRuler.GetFirstName] was assassinated by one of his own countrymen, #yellow Todor Kadić#! in apparent retaliation for slights against his tribesmen early in the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s rule."
 balkfm_montenegro.012.f: "The sudden killing of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] without the declaration of a formal blood feud has provoked suspicions of political or even international interference in the country."
 balkfm_montenegro.012.a: "This is an outrage!"
 balkfm_montenegro.013.t: "A Worldly Leader"
 balkfm_montenegro.013.d: "The killing of the previous [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has opened the path for [ROOT.GetCountry.GetRuler.GetFullName] to take the throne. Educated in the west and full of youthful vigor, the new [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has taken to his new position with glee, determined to complete the modernizing work envisioned by Petar I."
 balkfm_montenegro.013.f: "[ROOT.GetCountry.GetRuler.GetFirstName]'s broad education, when compared to his forefathers, makes him one of the most sophisticated men to ever rule over the Black Mountain."
 balkfm_montenegro.013.a: "[ROOT.GetCountry.GetName] cannot afford these distractions."

 balkfm_montenegro.020.t: "The Kingdom of Montenegro"
 balkfm_montenegro.020.d: "In defiance of the greater balance of power in Europe, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has led the National Assembly in the  unilateral elevation of [ROOT.GetCountry.GetName] to a Kingdom."
 balkfm_montenegro.020.f: "Despite sounding like a technical change in diplomatic communications, this action is critically important in asserting the existence of an independent Montenegrin state."
 balkfm_montenegro.020.a: "[ROOT.GetCountry.GetName] will never be vanquished."

 balkfm_montenegro.030.t: "A Demand for Haraç"
 balkfm_montenegro.030.d: "A militia from [SCOPE.sCountry('hersek_scope').GetName] has approached the border to demand that [ROOT.GetCountry.GetName] pay #italic Haraç#! to [SCOPE.sCountry('hersek_scope').GetRuler.GetFullName]."
 balkfm_montenegro.030.f: "The Haraç, a tax on non-Muslims, has been levied on the Balkans since the Ottoman conquests. As non-subjects of the [SCOPE.sCountry('ottoman_scope').GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] and his court have bucked this tribute-tax for centuries."
 balkfm_montenegro.030.a: "[ROOT.GetCountry.GetNameNoFlag] is never submit to extortion."
 balkfm_montenegro.030.b: "We have no means to resist [SCOPE.sCountry('hersek_scope').GetNameNoFlag]"
 balkfm_montenegro.031.t: "Negotiations at Humac"
 balkfm_montenegro.031.d: "[SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! has found his designs on [ROOT.GetCountry.GetName] frustrated by [SCOPE.sCountry('montenegro_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('montenegro_scope').GetRuler.GetFirstName]'s stubborn refusal to abandon the defense of the countryside. Under pressure from both [SCOPE.sCountry('balkfm_benefactor_scope').GetName] and [SCOPE.sCountry('ottoman_scope').GetName] to avoid escalating the conflict, the two have agreed to parlay."
 balkfm_montenegro.031.f: "The following terms have been proposed:\n 1. Displaced residents of Grahovo may return.\n 2. #yellow Jakov Daković#! will become lord of Grahovo.\n 3. Grahovo will resume paying taxes to the Porte.\n 4. All fortifications at Grahovo will be abandoned. \n 5. There will be "eternal peace" between the Turks and Montenegrins. \n 6. Both Mehmed Pasha, vizier of Bosnia, and [ROOT.GetCountry.GetRuler.GetLastName] will uphold this agreement."
 balkfm_montenegro.031.a: "[SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! cannot be trusted, but we cannot risk inflaming the situation."
 balkfm_montenegro.031.b: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] will have his revenge."
 balkfm_montenegro.031.tt: "#red #bold This is a terrible idea.#!#!"
 balkfm_montenegro.031.c: "So be it."
 balkfm_montenegro.032.t: "Knives in the Dark"
 balkfm_montenegro.032.d: "#yellow Bishop#! [ROOT.GetCountry.GetRuler.GetLastName] has found himself at an impasse. A sealed letter arrived this morning from none other than [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! himself. In it, the Pasha has invited the Bishop to a plot to assassinate Bosnian lord, [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! [SCOPE.sCharacter('smail_aga_scope').GetLastName], one of the perpetrators of gratuitous violence in Grahovo."
 balkfm_montenegro.032.f: "Ali Pasha, along with other beys, has found his position as vizier threatened by the rise of Smaïl-aga. With his fears validated by [SCOPE.sCountry('serbia_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('serbia_scope').GetRuler.GetLastName], Ali has sought allies in the region. Given Smaïl-aga's notoriety for a series of massacres in Grahovo after the village fell into Ottoman hands, the conspirators hope that [ROOT.GetCountry.GetRuler.GetLastName] will be amenable to their plans."
 balkfm_montenegro.032.a: "We will have revenge for Gravoho."
 balkfm_montenegro.032.b: "This is not the company we keep."
 balkfm_montenegro.033.t: "A Local Collaborator"
 balkfm_montenegro.033.d: "Following weeks of considerations, advisors have recommended recruiting a local to carry out the act to avoid implicating the Bishop. They have settled on [SCOPE.sCharacter('novica_cerovic_scope').GetFullName], a local vojvoda."
 balkfm_montenegro.033.f: "Smaïl-aga's son, Rustem-beg has earned the hatred of Montenegrins still under the Ottoman thumb. Known for his alcoholism and gratuitous abuses of non-Muslim women in his realm, tribal leaders initially requested the Bishop's permission to assassinate him. A resident of Tušina, Cerović, like many villagers across Montenegro, has held a grudge against Smaïl-aga for the brutality he unleashed on Grahovo. He and his clansmen have accepted the job without hesitation on the condition that they be given leave to deal with Rustem-beg."
 balkfm_montenegro.033.a: "He seems a fitting candidate."
 balkfm_montenegro.034.t: "The Demise of Smaïl-aga"
 balkfm_montenegro.034.d: "With the blessing of [SCOPE.sCountry('montenegro_scope').GetRuler.GetLastName], a local vojvoda, Novica Cerović, provoked [SCOPE.sCharacter('smail_aga_scope').GetFirstName]#yellow -aga#! by refusing to pay tribute. While traveling to exact justice, the Ottoman lord was beset by several tribesmen from the region. After beheading the slain noble, the Prince-Bishop has been presented with his head as proof of the act."
 balkfm_montenegro.034.f: ""So you too have come my way, poor Smaïl!" -Njegoš, 1840"
 balkfm_montenegro.034.a: "Excellent. We will see Cerović rewarded."
 balkfm_montenegro.034.b: "Good riddance."
 balkfm_montenegro.035.t: "Unintended Consequences"
 balkfm_montenegro.035.d: "The "sudden" killing of Smaïl-aga has not gone unanswered. [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! has publicly denounced the murder and begun a campaign of punishment along the border. [ROOT.GetCountry.GetName] has once again been put in a difficult position. With the threat of war escalating once more, [SCOPE.sCountry('russia_scope').GetName] and [SCOPE.sCountry('austria_scope').GetName] have demanded an immediate cessation of hostilities."
 balkfm_montenegro.035.f: "Ali Pasha has taken advantage of the turmoil caused by Smaïl-aga's murder. Since the plot remains unknown, the Bishop's options are limited without exposing the nature of the plot."
 balkfm_montenegro.035.a: "Call for negotiations."
 balkfm_montenegro.035.b: "Expose the plot."
 balkfm_montenegro.036.t: "Duplicitous Diplomacy"
 balkfm_montenegro.036.d: "At the behest of the Great Powers, a peace has been negotiated between #yellow Bishop#! [ROOT.GetCountry.GetRuler.GetFullName] and [SCOPE.sCharacter('ali_pasha_scope').GetFirstName] #yellow Pasha#! [SCOPE.sCharacter('ali_pasha_scope').GetLastName]. However, the Pasha has not hesitated to take his chance to gloat at the Montenegrin people."
 balkfm_montenegro.036.f: ""My lord he has played us for fools!"\nThis sentiment has echoed across the Montenegrin court, as news arrived of the events that transpired immediately after negotiations concluded. Ali Pasha, arrogant in his diplomatic victory, had suddenly opened a bag of gold and threw several coins across the floor. In the ensuring rush, several members of our delegation threw themselves to the floor to gather as many as they could for themselves. This embarrassing display has brought to light the sheer poverty of Montenegro in comparison to the rest of the Balkans."
 balkfm_montenegro.036.a: "Never trust a Pasha."

 balkfm_montenegro.100.t: "The Great Montenegrivation"
 balkfm_montenegro.100.d: "A slender hand is tapping against the Montenegrin seat of power - a metronome the court has been greatly familiar with for a long, long time. It is that of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]. It is a hand which has given no orders, issued no decrees, and promulgated no laws in recent memory."
 balkfm_montenegro.100.f: ""This country used to mean something", the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] wanted to say as he reached for his cup of rakija. Pausing with the drink at his lip, he quickly realized there was no great time to reference. #bold He's montenegrown tired#!."
 balkfm_montenegro.100.a: "It's Montin' Time"
 balkfm_montenegro.100.tt: ""#italic There's gotta be some kompót here somewhere...#!""

 balkfm_montenegro.200.t: "Montenegrin Nationalism"
 balkfm_montenegro.200.d: "As the notions of Yugoslavism begin to take root across the Balkans, a small contingent of Montenegrin intellectuals have asserted an opposing idea: that [ROOT.GetCountry.GetName] is not only host to a unique cultural identity, but that the [ROOT.GetCountry.GetAdjectiveNoFormatting] state should assert its place in the Balkans."
 balkfm_montenegro.200.f: ""For the Right, Honour and Freedom of Montenegro." -Motto of the Greens, 1919-1929"
 balkfm_montenegro.200.a: "The [ROOT.GetAdjectiveNoFlag] people deserve recognition."

 balkfm_montenegro.900.t: "DUMMY" # [TECH] Creates Historical Heirs
 balkfm_montenegro.900.d: "DUMMY"
 balkfm_montenegro.900.f: "DUMMY"
 balkfm_montenegro.900.a: "DUMMY"