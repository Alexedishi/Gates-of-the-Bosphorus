 # Diplomatic Plays
 dp_gbbf_integrate_eyalet: "Integrate Eyalet"
 dp_gbbf_integrate_eyalet_tooltip: "#header Start a $dp_gbbf_integrate_eyalet$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_gbbf_integrate_eyalet_desc$"
 dp_gbbf_integrate_eyalet_desc: "Sets the initiating [concept_war_goal] to completely annex the targeted [concept_country]."
 dp_gbbf_depose_bey: "Depose Bey"
 dp_gbbf_depose_bey_tooltip: "#header Start a $dp_gbbf_depose_bey$ [concept_diplomatic_play]#!\n$TOOLTIP_DELIMITER$\n$dp_gbbf_depose_bey_desc$"
 dp_gbbf_depose_bey_desc: "Sets the initiating [concept_war_goal] to depose the ruler the targeted [concept_country]. This will reduce their [concept_liberty_desire] if enforced."
 
