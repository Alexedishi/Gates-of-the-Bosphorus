 turkfm_loyal_subject: "Declare Fealty to the $turkfm_porte$"
 turkfm_loyal_subject_desc: "The Ottoman Empire has endured for centuries, it is only reasonable to support the Empire in its rebirth as loyal vassals of the Sultan."
 turkfm_loyal_subject_pact_desc: "$turkfm_loyal_subject_desc$"
 turkfm_loyal_subject_action_name: "$turkfm_loyal_subject$"
 turkfm_loyal_subject_action_notification_name: "[INITIATOR_COUNTRY.GetName] Declares Fealty to the $turkfm_porte$"
 turkfm_loyal_subject_action_notification_desc: "[INITIATOR_COUNTRY.GetName] has declared its unyielding loyalty to the $turkfm_sublime_porte$ and the Sultan's court."
 turkfm_loyal_subject_action_propose_name: "[INITIATOR_COUNTRY.GetName]"
 turkfm_loyal_subject_action_break_name: "Withdraw Fealty to the $turkfm_porte$"
