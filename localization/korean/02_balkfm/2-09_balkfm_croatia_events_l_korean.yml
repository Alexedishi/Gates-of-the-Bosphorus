l_korean:
 balkfm_croatia.200.t: "Illyrian Sentiment"
 balkfm_croatia.200.d: "The Habsburg Empire has contested control of Southeastern Europe against the [SCOPE.sCountry('ottoman_scope').GetName] successfully blocking [GetCulture('turkish').GetName] expansion into Central Europe. Before and during these conflicts, several #yellow #tooltip:[GetRawTextTooltipTag('balkfm_yug_cultures_tt')] Jugoslav#!#! peoples have come to call these lands home with many of them coming under Habsburg rule.\n\nAs #yellow Nationalism#! spreads across Europe, statesman [SCOPE.sCharacter('balkfm_metternich_scope').GetFullName] has identified increasing radicalism amongst the [GetCulture('croat').GetName] people as an emerging threat to the Empire."
 balkfm_croatia.200.f: ""A people without a nation\nIs like a body without bones."\n -Opening Motto of #italic Danica#!, 1835–1849"
 balkfm_croatia.200.a: "The Empire must remain indivisible."
 balkfm_croatia.201.t: "An Austro-Slavic Proposal"
 balkfm_croatia.201.d: "As #yellow Nationalist#! sentiments begin to take root across [ROOT.GetCountry.GetName], a [GetCulture('czech').GetName] statesman, [SCOPE.sCharacter('template_balkfm_borovsky_karel').GetFullName], has proposed an outlandish theory to resolve the ethnic stresses on the Empire. Termed #yellow Austrian Slavism#!, the plan envisions the reorganization of the Imperial kingdoms into federal units of a democratized state."
 balkfm_croatia.201.f: "The idea of a federated state under the Habsburg crown has quickly gained traction amongst several minorities across the Empire. However, it has found its largest detractors in the Hungarian court, which stands to lose control of several minority regions."
 balkfm_croatia.201.a: "This is a laudable proposal."
 balkfm_croatia.201.b: "We cannot reduce the power of the crown."
 balkfm_croatia.202.t: "Vienna Literary Agreement"
 balkfm_croatia.202.d: "Intellectuals from the [GetCulture('serb').GetName], [GetCulture('croat').GetName], and [GetCulture('slovene').GetName] have gathered in [ROOT.GetCountry.GetCapital.GetCityHubName] with the aim of unifying and potentially standardizing their literary languages. While no binding agreements were made, the consensus has been that the #yellow Shtokavian#! dialect should be the basis for a future standard."
 balkfm_croatia.202.f: ""There can only be one true literary language in Illyria... It is not found in a single place, or a single country, but in the whole of Illyria... Our grammar and our dictionary is the whole of Illyria. In that huge garden there are beautiful flowers everywhere: let us gather everything of the best in one wreath, which will never wither." -L. Gaj, 1835""
 balkfm_croatia.202.a: "What a curious exercise."

 balkfm_croatia.209.t1: "The Croatian–Hungarian Settlement"
 balkfm_croatia.209.t2: "The Austro-Croatian Compromise"
 balkfm_croatia.209.d1: "The state has succeeded in striking a balance with the [GetCulture('croat').GetName] people. For generations to come, they will play a role in shaping the future of the state."
 balkfm_croatia.209.d2: "The situation in Croatia has begun to boil over as politician leaders have met to demand recognition of the [GetCulture('croat').GetName] people. Should we refuse their calls we risk open rebellion against the state."
 balkfm_croatia.209.f1: "While far from true independence for the for Croatia, this action has provided solid guardrails against future abuses by the Austro-Hungarian establishment."
 balkfm_croatia.209.f2: "Both Imperial and local officials have rushed to [ROOT.GetCountry.GetCapital.GetCityHubName] to warn the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of the organization of [GetCulture('croat').GetName] separatist movements in the south. With luck, we may be able to strike a compromise with them before violence breaks out."
 balkfm_croatia.209.a1: "Croatia is an inseparable part of the Empire."
 balkfm_croatia.209.a2: "They shall handle their own affairs."
 balkfm_croatia.209.a3: "We must accept the settlement."
 balkfm_croatia.209.a4: "[ROOT.GetCountry.GetNameNoFormatting] is [ROOT.GetCountry.GetAdjectiveNoFormatting] first!"
 balkfm_croatia.209.b1: "Croatia is an inseparable part of the Empire."
 balkfm_croatia.209.b2: "They shall handle their own affairs."
 balkfm_croatia.209.b3: "We must accept the compromise."
 balkfm_croatia.209.b4: "[ROOT.GetCountry.GetNameNoFormatting] is [ROOT.GetCountry.GetAdjectiveNoFormatting] first!"


 balkfm_croatia.300.t: "The Triune Dream"
 balkfm_croatia.300.d: "With the Independence of [ROOT.GetCountry.GetName], an irredentist desire has begun to spread amongst our citizens to incorporate all people of the former #yellow Triune Kingdom#! under a single state."
 balkfm_croatia.300.f: ""We have cast aside centuries of Imperial rule to bring [ROOT.GetCountry.GetName] into being. Yet it is not enough. Many of our countrymen still live under the oppressive yoke of foreign rule, yearning for a country they can call their own.""
 balkfm_croatia.300.a: "We cannot leave our countrymen to suffer."
 balkfm_croatia.301.t: "Restoration of the Triune Kingdom"
 balkfm_croatia.301.d: "With the liberation of lands of the Triune crown, the dream of a reborn [ROOT.GetCountry.GetName] have come to fruition. Our citizens now look to the state to lead them into a new era."
 balkfm_croatia.301.f: "A new day dawns, and a new nation rises to the world stage. [ROOT.GetCountry.GetAdjectiveNoFormatting] glory is the inevitable future."
 balkfm_croatia.301.a: "We will raise the [ROOT.GetCountry.GetAdjective] banner high!"