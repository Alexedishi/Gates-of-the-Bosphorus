l_korean:
 # Game Concepts
 concept_albanian_piracy: "Albanian Piracy"
 concept_albanian_piracy_desc: "Pirates have plied the coasts of the Adriatic since Roman times. Since the arrival of the Ottomans, several pirate bands have entrenched themselves in Albanian waters. As long as they are not dislodged, the region will experience #bold Piracy Events#!."

 concept_bedouin_tribes: "Bedouin Tribes"
 concept_bedouin_tribes_desc: "The #bold [GetCulture('bedouin').GetName] Tribes#! live in nomadic bands scattered across the [GetStateRegion('STATE_LIBYAN_DESERT').GetName] and [GetStateRegion('STATE_EGYPTIAN_DESERT').GetName]. Generally aloof to the maneuvering of the [Concept('concept_great_power','$concept_great_powers$')], they tend to react poorly, even violently, once direct authority is imposed upon them."

 concept_beylik: "Beylik"
 concept_beylik_desc: "#bold Beylik#! is the name ascribed to a principality or petty kingdom ruled by a Bey. With the decline of the Byzantine Empire and Sultan of Rûm, beyliks came to dominate Anatolia before their annexation to the Ottoman Empire. Despite this, the title of #italic Bey#! endures, itself often used to assert independence from Constantinople."

 concept_concert_of_europe: "Concert of Europe"
 concept_concert_of_europe_desc: "The Concert of Europe is the informal poltical structure and balance of power that gives each country a [Concept('concept_rank','$concept_rank$')], provides each [Concept('concept_great_power','$concept_great_power$')] with a sphere of influence, and has been a major step towards avoiding the conditions that led to the $FRA_ADJ$ Revolutionary War and the Napoleonic Wars."

 concept_eastern_question: "Eastern Question"
 concept_eastern_question_desc: "The Eastern Question is the unstable political situation caused by the decline of the Ottoman Empire. As the empire slowly crumbles from within, the [Concept('concept_great_power','$concept_great_powers$')] struggle to find strategic and political solutions to expand their influence without disrupting the [Concept('concept_concert_of_europe','$concept_concert_of_europe$')]."

 concept_eyalet: "Eyalet"
 concept_eyalet_desc: "The #bold Eyalets#!, also called #italic Beylerbeyliks#! or #italic Pashaliks#!, are the primary administrative divisions of the Ottoman Empire. Originating in the years shortly after the Fall of Constantinople, the Eyalets function as a mixture of taxation and military administrations, with each headed by a Bey. While useful for the Empire's decentralized governance, this same system frequently hampers central authority."

 concept_kurdish_tribe: "Kurdish Tribe"
 concept_kurdish_tribe_desc: "A $concept_kurdish_tribe$ ([concept_subject]) is a highly autonomous [concept_subject_type] able to start their own [Concept('concept_diplomatic_play','$concept_diplomatic_plays$')]."