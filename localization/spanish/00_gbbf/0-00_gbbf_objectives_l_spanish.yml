l_spanish:
 je_grefm_intro: "Welcome to the Greece, Byzantium, & the Balkans Flavor Mod!"
 je_grefm_intro_reason: "This Journal Entry will close itself out, just let it figure itself out."

 objective_grefm: "@gbbf_icon! The Greek State"
 objective_grefm_desc: "The Independence of the Greek state has sent waves across the Greek populations under Ottoman rule. Guide the Hellenes onto the world stage or take charge of the Rhomaios people still under the Ottoman thumb. Overcome the domineering Great Powers to reclaim the lands of the #greece Hellenistic Empire#! or restore the #purple Roman Empire#!."
 objective_grefm_idle_header: ""
 objective_grefm_idle_hint: ""
 objective_grefm_name_GRE: "#v $GRE$#!"
 objective_grefm_desc_GRE: "#lore Greece is newly independent, but both backwards and unstable. Centuries of exploitation and stagnation under Ottoman rule have left her with an ineffective government and a largely rural populace. Will Greece take an autocratic route, or will she listen to the people that cry out for liberalism?#!"
 objective_grefm_name_ION: "#v $ION$#!"
 objective_grefm_desc_ION: "#lore With the influence of their colonial administration, the $GBR_ADJ$ seek to develop the islands into a model "colony." Yet, the islands yearn for reunion with their Greek cousins on the mainland.\n\nWill the islands find #italic enosis#! with the Greek state or will the Heptanese seek their own future?#!"
 objective_grefm_name_GRE_SAM: "#v $GRE_SAM$#!"
 objective_grefm_desc_GRE_SAM: "#lore The island of Samos stood alone in defying the Ottomans after the formation of the Greek state. Despite separation from the Greek state, the dream of #italic enosis#! burns stronger than ever in the hearts of the Samian people. Will Samos achieve Union with Greece, or will the island continue its defiance of the Ottoman state?#!\n\n#red Warning: This is a hard country to play.#!"
 objective_grefm_name_GBBF_CAP: "#v $GBBF_CAP$#!"
 objective_grefm_desc_GBBF_CAP: "#lore Deep in the heartland of Anatolia, the Greeks of Cappadocia face increased oppression as weakness and paranoia sweep the Ottoman Empire. Will Cappadocia find a brighter future?"
 objective_grefm_name_GBBF_THE: "#v $GBBF_THE$#!"
 objective_grefm_desc_GBBF_THE: "#lore Once the last holdout of the Roman Empire, the memory of Theodoro lies dormant under $RUS_ADJ$ rule. Will Theodoro guide the Urum people into determining their own future?#!\n\n#red Warning: This is a hard country to play.#!"
 objective_grefm_name_GBBF_TRB: "#v $GBBF_TRB$#!"
 objective_grefm_desc_GBBF_TRB: "#lore The lands of Pontus have have hosted Greek populations for millennia. As the Ottoman Empire struggles to control its subjects, the Rhomaios people have begun to question their status as subjects of the Sublime Porte. Will Trebizond lead the Pontic Greeks to freedom?"

 objective_balkfm: "@gbbf_icon! National Awakenings"
 objective_balkfm_desc: "Awaken Thee and rise up against the Ottoman Empire! Take charge of one of the nations of the Balkans as they each seek to carve their identities free of Ottoman yoke. Along the Austrian border, nationalism gives rise to separatism, while within the Empire, the former lands of #bold Bulgaria#!, #bold Bosnia#!, and #bold Albania#! remain divided between the #bold Eyalets#! of the Empire."
 objective_balkfm_idle_header: ""
 objective_balkfm_idle_hint: ""
 objective_balkfm_name_MON: "#v $MON$#!"
 objective_balkfm_desc_MON: "#lore The Prince-Bishropic of Montenegro has survived into the modern era as a relic of Europe's feudal past. Led by a Prince-Bishop, the small country lacks a centralized authority with its rugged terrain serving as its primary defense from Ottoman invasions. The border is poorly defined and skirmishes with neighboring Pashas and Beys is common. Will Montenegro rise from its antiquated roots or is the nation doomed to stagnation?#!\n\n#red Warning: This is a hard country to play.#!"
 objective_balkfm_name_SER: "#v $SER$#!"
 objective_balkfm_desc_SER: "#lore Led by the war hero Miloš Obrenović, Serbia has broken centuries of peaceful submission with two uprisings that have given the country an administration independent to that of the rest of the Ottoman Empire. As nationalism sweeps across Europe, many Serbs await the day they can break the chains tying them to the Sultan and unify the Serbian people. Will Serbia find its way to independence or will the Serbian people remain divided between the great empires?#!"
 objective_balkfm_name_MOL: "#v $MOL$#!"
 objective_balkfm_desc_MOL: "#lore Nestled between the Dneister River and the Carpathian mountains, Moldavia is far from the influence of the Sultan. Ruled by an Ottoman-approved hospodar, the small principality constitutes a small fragment of the larger Romanian community and is frequently subject to influence from its $RUS_ADJ$ neighbor. Will Moldavia be able to unite the Romanian people, or will it be lost in the struggle over Danubia?#!"
 objective_balkfm_name_WAL: "#v $WAL$#!"
 objective_balkfm_desc_WAL: "#lore As one of the two Romanian principalities, Wallachia has existed relatively free from the influence of the Ottoman court. Heavily influenced by European thought, the Romanians of Wallachia see themselves as just a small part of the greater Romanian nation. Will Wallachia overthrow their Ottoman-imposed hospodars and unite Romania or will they be trampled in the Habsburg-Ottoman conflict?#!"
 objective_balkfm_name_BOS: "#v $BOS_HER$#!"
 objective_balkfm_desc_BOS: "#lore Long divided between Christian and Muslim communities, the lands of Bosnia and Herzegovina are a melting pot of Balkan peoples. As the authority of Constantinople seems ever more distant, intellectuals seek to resurrect the soul of the Bosnian state. Will the Bosnian people claim a national identity and rise above their fractious religious nature?"
 objective_balkfm_name_GBBF_SIL: "#v $GBBF_SIL$#!"
 objective_balkfm_desc_GBBF_SIL: "#lore Once one of the great empires that rose to challenge the Byzantine Empire, the Bulgarian nation has been subdued and shattered by centuries of Ottoman rule. However, with the arrival of revivalist thinkers, the Bulgarian people have once more begun to grasp at a common existence apart from that of the Empire. Will the Bulgarian people rise to reclaim their national identity? \n\n#greece You will start as the Eyālet-i Silistra, the nucleus of the future Bulgarian state.#!"
 objective_balkfm_name_GBBF_ALB: "#v $GBBF_ALB$#!"
 objective_balkfm_desc_GBBF_ALB: "#lore The Albanian people have called the eastern coast of the Adriatic home since pre-Roman times. However, centuries of increasing pressure from the Sultan have gradually eroded the Albanian culture and they find themselves subjected to ever-increasing levels of Islamization. Will the Albanians manage to cling to their identity and secure a future independent from the Sultan?\n\n#greece You will start as the Sanjak-i Yanya, the nucleus of the future Albanian State.#!"

 objective_turkfm: "@gbbf_icon! The Sick Man of Europe"
 objective_turkfm_desc: "The Ottoman Empire is in decline. Decades of bureaucratic and economic stagnation coupled with the waves of [GetTechnology('nationalism').GetName] sweeping the Balkans have brought the Empire to its knees. Take charge of the #red Devlet-i ʿAlīye-i ʿOsmānīye#! and push back the seemingly inexorable tide of Western imperialism."
 objective_turkfm_idle_header: ""
 objective_turkfm_idle_hint: ""
 objective_turkfm_name_TUR: "#v $Ottoman Empire$#!"
 objective_turkfm_desc_TUR: "#lore The Ottoman Empire is best by turmoil from within and without. A decaying state apparatus has left the Empire unable to respond to the threats of separatism and imperialism. Will the Empire reform itself following the tenets of Ottomanism, or will it be swept away by nationalist fervor?#!"
 objective_turkfm_name_EGY: "#v $EGY$#!"
 objective_turkfm_desc_EGY: "#lore Spurred by the ambitions of Muhammad Ali, the Khedivate of Egypt has asserted increased autonomy from the Ottoman Empire. This freedom remains unrecognized by Constantinople and it is only a matter of time before the two come to blows once more. Will Egypt lead its own path free from foreign rule?#!"
 objective_turkfm_name_TRI: "#v $TRI$#!"
 objective_turkfm_desc_TRI: "#lore Tripoli lies at the margins of the Ottoman sphere. Despite the reassertion of Imperial authority, the hinterlands of the country remain in anarchy. Meanwhile, the Senusiyya Movement calls for organized resistance to the Sultan's rule. Will Libya claim its own identity?#!"
 objective_turkfm_name_TUN: "#v $TUN$#!"
 objective_turkfm_desc_TUN: "#lore Separated by both seas and sands, the Bey of Tunis pays nominal tribute to the Sultan. As Constantinople's influence wanes, Tunis finds itself threatened by $FRA_ADJ$ expansion into northern Africa. Can the Bey stave off invasion by the Great Powers and restore Tunis to prosperity?#!"
 objective_turkfm_name_KUR_SOR: "#v $KUR_SOR$#!"
 objective_turkfm_desc_KUR_SOR: "#lore Muhammad Pasha, the blind prince, has asserted his ambition to unite the lands of Kurdistan under his rule. However, this plans have run head-first into the aims of the Sultan in Constantinople who seeks to finally subjugate the Kurdish frontier. Can Soran survive the onset of the Tanzimât?#!"