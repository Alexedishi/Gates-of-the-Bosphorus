l_spanish:
 grefm_emu_empire.001.t: "'Straya has Landed"
 grefm_emu_empire.001.d: "With [ROOT.GetCountry.GetName]'s arrival in the Balkans has come the dawn of a new idea: What if the [ROOT.GetCountry.GetAdjectiveNoFormatting] Emu were to spread its wings across the eastern Mediterranean like the Roman Empire once did?"
 grefm_emu_empire.001.f: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetLastName] might have a few 'roos loose in the top paddock, but his idea has gained traction amongst Nationalists camps."
 grefm_emu_empire.001.a: "Let's put another shrimp on the barbie, yeah?"
 grefm_emu_empire.001.b: "Tell him he’s dreaming."
 grefm_emu_empire.002.t: "The Empire from Down Under"
 grefm_emu_empire.002.d: "Church bells ring and people cheer as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] declares the birth of the [ROOT.GetCountry.GetName]. Beneath the imposing presence of the [SCOPE.sBuilding('hagia_sofia_scope').GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been adorned with the old sigils and regalia of the Eastern Roman emperors and a resplendent robe of Emu down. Stepping forward towards the array of citizens, dignitaries, and clergy, [ROOT.GetCountry.GetRuler.GetFirstName] stands as a beacon for the future of the #bold #greece Emu#!#! state."
 grefm_emu_empire.002.f: ""If we had a military division with the bullet-carrying capacity of these birds it would face any army in the world ... They can face machine guns with the invulnerability of tanks. They are like Zulus whom even dum-dum bullets could not stop." -Major G. Meredith, 1932"
 grefm_emu_empire.002.a: "It'll be a piece of piss!"
 grefm_emu_empire.002.b: "The Empire's flat out like a lizard drinking."
 grefm_emu_empire.003.t: "The Emu of the East"
 grefm_emu_empire.003.d: "With Anatolia and the Balkans firmly within our grasp, the old heart of the Byzantine Empire has been brought under the Emu's wing. Prominent leaders roosting in the [ROOT.GetCountry.GetAdjectiveNoFormatting] court now call for the return of Egypt and the Levant, once strongholds of Christendom, into the Imperial sphere."
 grefm_emu_empire.003.f: "Almost one thousand years ago, Basileus Isaac I Komnenos augustly led the Empire into an era of renewed might and glory. Yet today, the old cities lie in ruins and the old bastions of Christendom wither without the Emu's protective light."
 grefm_emu_empire.003.a: "We will claim the Eastern Empire."
 grefm_emu_empire.003.b: "Shame the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s a dole bludger..."
 grefm_emu_empire.009.t: "The Holy Byzantine Emu Empire"
 grefm_emu_empire.009.d: "With the Eastern Empire within our domain, our people look to the Great Running Bird for shelter and guidance. Citizen and zookeeper alike call for the [GetCulture('emu').GetName] to lead [ROOT.GetCountry.GetName] into this new era."
 grefm_emu_empire.009.f: "They said she was cactus, that nobody could raise the Imperial banner. They said the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] was dead-set drongo for getting us into a scrap over these forsaken lands. Hard yakka it was sure, but you can't lie that's a ripper flag flapping over the Bosphorus."
 grefm_emu_empire.009.a: ""Good on 'ya mate!""