 grefm_megali_idea.100.t: "The Treaty of [SCOPE.sState('ionian_overlord_capital').GetCityHubName]"
 grefm_megali_idea.100.d: "Through careful negotiations, [SCOPE.sCountry('ionian_overlord').GetName] has agreed to cede the [SCOPE.sCountry('ionian_country').GetName] to [ROOT.GetCountry.GetName]."
 grefm_megali_idea.100.f: ""To promote good will between our nations and to bolster the spirit of the [ROOT.GetCountry.GetAdjectiveNoFormatting] people, the [SCOPE.sCountry('ionian_overlord').GetRuler.GetPrimaryRoleTitle] has graciously cede the Ionian Islands. Our amiable protectorate, under which the Islands benefited from our true and just assistance, is deemed at an end and we trust that the people of these isles will prosper under the benevolent care of our trusted friends.""
 grefm_megali_idea.100.a: "A most agreeable solution."
 grefm_megali_idea.101.t: "The Treaty of [SCOPE.sState('epirus_capital').GetCityHubName]"
 grefm_megali_idea.101.d: "Following quick negotiations, [SCOPE.sCountry('epirus_scope').GetName] has agreed to join the Greek state."
 grefm_megali_idea.101.f: "The Epriote Greeks fought for their freedom against the Ottomans, it is only right that the rejoin the Greek family."
 grefm_megali_idea.101.a: "A most agreeable solution."
 grefm_megali_idea.102.t: "The Treaty of [SCOPE.sState('cyprus_capital').GetCityHubName]"
 grefm_megali_idea.102.d: "Following quick negotiations, [SCOPE.sCountry('cyprus_scope').GetName] has agreed to join the Greek state."
 grefm_megali_idea.102.f: "The Cypriot Greeks have won their freedom by their own sweat and blood. If they so choose, then it is right that they join their Greek brothers and sisters."
 grefm_megali_idea.102.a: "A most agreeable solution."
 grefm_megali_idea.103.t: "The Treaty of [SCOPE.sState('crete_capital').GetCityHubName]"
 grefm_megali_idea.103.d: "Following quick negotiations, [SCOPE.sCountry('crete_scope').GetName] has agreed to join the Greek state."
 grefm_megali_idea.103.f: "The Cretan Greeks have finally achieved their freedom after generations of systematic oppression. It is a momentous occasion now that they rejoin their Greek brothers and sisters."
 grefm_megali_idea.103.a: "A most agreeable solution."
 grefm_megali_idea.104.t: "The Treaty of [SCOPE.sState('macedonia_capital').GetCityHubName]"
 grefm_megali_idea.104.d: "Following quick negotiations, [SCOPE.sCountry('macedonia_scope').GetName] has agreed to join the Greek state."
 grefm_megali_idea.104.f: "The Macedonian Greeks have finally achieved their freedom. Crowds cheer in the streets as they are rejoined with the Greek family."
 grefm_megali_idea.104.a: "A most agreeable solution."
 grefm_megali_idea.106.t: "The Treaty of [SCOPE.sState('samos_capital').GetCityHubName]"
 grefm_megali_idea.106.d: "Following quick negotiations, [SCOPE.sCountry('samos_scope').GetName] has agreed to join the Greek state."
 grefm_megali_idea.106.f: "For centuries, the island has stalwartly held out against Turkish and European incursion. At long last, they will be united with their countrymen."
 grefm_megali_idea.106.a: "A most agreeable solution."

 grefm_megali_idea.110.t: "The Treaty of [SCOPE.sState('trabzon_capital').GetCityHubName]"
 grefm_megali_idea.110.d: "Following quick negotiations, [SCOPE.sCountry('trabzon_scope') has agreed to join the Greek state."
 grefm_megali_idea.110.f: "Trabzon survived the fall of Constantinople, but soon came under the oppression of the Ottomans. Today, they rejoin [ROOT.GetCountry.GetName] as citizens."
 grefm_megali_idea.110.a: "A most agreeable solution."
 grefm_megali_idea.111.t: "The Treaty of [SCOPE.sState('cappadocia_capital').GetCityHubName]"
 grefm_megali_idea.111.d: "Following quick negotiations, [SCOPE.sCountry('cappadocia_scope') has agreed to join the Greek state."
 grefm_megali_idea.111.f: "Located deep in the highlands of Anatolia, the former region of Cappadocia hosted several entrenched Greek populations that have retained their unique identity."
 grefm_megali_idea.111.a: "A most agreeable solution."

 grefm_megali_idea.120.t: "The Treaty of [SCOPE.sState('theodoro_capital').GetCityHubName]"
 grefm_megali_idea.120.d: "Following quick negotiations, [SCOPE.sCountry('theodoro_scope') has agreed to join the Greek state."
 grefm_megali_idea.120.f: "Once a holdout against Ottoman expansion, the lands Theodoro eventually fell into the hands of the Tartar hordes. Today we welcome them back as citizens of [ROOT.GetCountry.GetName]"
 grefm_megali_idea.120.a: ""A most agreeable solution.""

 grefm_megali_idea.200.t: "The Fate of the Turks"
 grefm_megali_idea.200.d: "With Anatolia an integral part of the Empire, the question has been raised of what to do with the remnant Turkish peoples present across our lands."
 grefm_megali_idea.200.f: "Despite occupying and dominating the former Byzantine lands for over 400 years, the Ottomans tolerated the presence of the Orthodox worshipers amongst them. The state must decide which future awaits them."
 grefm_megali_idea.200.a: "Just as we co-existed with them, the Turks will coexist with us."
 grefm_megali_idea.200.b: "We are a Greek Empire for the Greek people."
 grefm_megali_idea.201.t: "A Question of Homelands"
 grefm_megali_idea.201.d: "As we establish control over our former lands, the question of what to do with the Turkish populations within [SCOPE.sState('turkish_homeland_state').GetName] has come to a head once more."
 grefm_megali_idea.201.f: "While originating from the steppes, the Turkic peoples across Anatolia feel few, if any, connections to their ancestral home. The majority would even argue that Anatolia #italic is#! their home. Regardless, irredentist leaders assert Greek primacy in these lands."
 grefm_megali_idea.201.a: "These are Greek lands."
 grefm_megali_idea.201.b: "[SCOPE.sState('turkish_homeland_state').GetName] will serve as a reservation."
 grefm_megali_idea.201.c: "They belong in [SCOPE.sState('turkish_reserve_state').GetName]."
 grefm_megali_idea.202.t: "Greek Expansion in [SCOPE.sState('grefm_expansion_state').GetName]"
 grefm_megali_idea.202.d: "The Anatolian region of [SCOPE.sState('grefm_expansion_state').GetName] has been incorporated into the Greek state and many Greeks seek to call it home once more."
 grefm_megali_idea.202.f: "The Greek world once extended from the Carpathians to the Hindu Kush. Anatolia is but a small part of this greater whole."
 grefm_megali_idea.202.a: "These lands have always been ours."
 grefm_megali_idea.203.t: "The Helleno-Turkish State"
 grefm_megali_idea.203.d: "Our efforts to integrate the former subjects of the Ottoman Empire has proven mostly successful. Despite extreme resistance by Nationalist groups across Greece, the [GetCulture('turkish').GetName] people can consider themselves fully-fledged citizens of our Greco-Turkish state."
 grefm_megali_idea.203.f: "Despite our differences and disagreements, we cannot deny that our Greek culture is as inseparable from Turkish influence and Turkish culture is from our influence. Conquered Greece conquered the Turk."
 grefm_megali_idea.203.a: "Greek and Turk will stand as equals."