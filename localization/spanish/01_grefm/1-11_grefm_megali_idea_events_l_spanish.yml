 grefm_megali_idea.011.d: "The expansion of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state has led some of the most fervent nationalists to propose an even more ambitious project: the restoration of the Greek Empire through the conquest of formerly [ROOT.GetCountry.GetAdjectiveNoFormatting] lands."
 grefm_megali_idea.011.f: ""We have cast aside centuries of Ottoman rule to bring the Greek state into being. Yet it is not enough. Many of our countrymen still live under the oppressive yoke of foreign rule, yearning for a country they can call their own. This dream can only be realized through the annexation of all the Greek lands, which we will achieve with or without the consent of their occupiers.""
 grefm_megali_idea.011.a: "Our claim to this land is irrefutable."
 grefm_megali_idea.011.b: "Expansion is not a priority for now."
 grefm_megali_idea.012.t: "The Throne of the East"
 grefm_megali_idea.012.d: "With the conquest of lands across the Bosphorus and the Dardanelles, the goals of the Great Idea have come to fruition. Our citizens now look to the state to lead them into a new era."
 grefm_megali_idea.012.f: ""Once more, as years and time go by,\nonce more they shall be ours." \n-Greek Nationalist Poem"
 grefm_megali_idea.012.a: "Our armies will raise the [GetCulture('rhomaios').GetName] standard once more!"
 grefm_megali_idea.012.b: "The Empire is dead. We will forge a new path!"

 grefm_megali_idea.020.t: "The Last of the Romans"
 grefm_megali_idea.020.d: "Four centuries ago, [ROOT.GetCountry.GetName] was the last holdout of Roman authority against the ascendant Ottoman Empire. Since then, [ROOT.GetCountry.GetCapital.GetName] has served as a refuge for Greeks fleeing oppression in Anatolia. With the independence of the Greek state intellectuals have called for reunification, or "enosis," with the Greek population centers in our vicinity."
 grefm_megali_idea.020.f: ""Language is a homeland we can never emigrate from." -Irina Grivina"
 grefm_megali_idea.020.a: "This is land is our home."

 grefm_megali_idea.030.t: "The Balkans Reclaimed"
 grefm_megali_idea.030.d: "[ROOT.GetCountry.GetCapital.GetCityHubName] has erupted into several days of celebration as the [ROOT.GetCountry.GetName] celebrates the return of the [GetStrategicRegion('region_balkans').GetName] to the Imperial realm."
 grefm_megali_idea.030.f: ""Hail to the Empire! Hail to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]!""
 grefm_megali_idea.030.a: "Glory to the [ROOT.GetCountry.GetName]!"
