l_spanish:
 grefm_megali_idea.001.t: "The Lands of Thessaly"
 grefm_megali_idea.001.d: "With the independence of the Greek state have come endless cries for reunification, or "enosis," with the various Greek population centers ruled over by the powers associated with the Ottoman state. They have begun to center on reclaiming the fertile plains of [SCOPE.sState('grefm_thessaly_scope').GetName], unfairly denied to us in the London Protocol."
 grefm_megali_idea.001.f: ""Fair Tempe! haunt belov'd of sylvan powers,\nOf nymphs and fauns; where in the golden age\n They play'd in secret on the shady brink\nWith ancient Pan- while round their choral steps,\nYoung hours and genial gales with constant hand\nShower'd blossoms, odours; shower'd ambrosial dews,\nAnd spring’s elysian bloom." -M. Akenside, The Pleasures of the Imagination, 1744"
 grefm_megali_idea.001.a: "We will liberate our Greek countrymen."
 grefm_megali_idea.002.t: "The Megali Idea"
 grefm_megali_idea.002.d: "The expansion of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state has led some of the most fervent nationalists to propose an even more ambitious project: the restoration of the Greek Empire through the conquest of formerly [ROOT.GetCountry.GetAdjectiveNoFormatting] lands."
 grefm_megali_idea.002.f: ""We have cast aside centuries of Ottoman rule to bring the Greek state into being. Yet it is not enough. Many of our countrymen still live under the oppressive yoke of foreign rule, yearning for a country they can call their own. This dream can only be realized through the annexation of all the Greek lands, which we will achieve with or without the consent of their occupiers.""
 grefm_megali_idea.002.a: "Our claim to this land is irrefutable."
 grefm_megali_idea.002.b: "Expansion is not a priority for now."
 grefm_megali_idea.003.t: "The Future of [ROOT.GetCountry.GetName]"
 grefm_megali_idea.003.d: "With the conquest of lands across the Bosphorus and the Dardanelles, the goals of the Great Idea have come to fruition. Our citizens now look to the state to lead them into a new era."
 grefm_megali_idea.003.f: ""Once more, as years and time go by,\nonce more they shall be ours." \n-Greek Nationalist Poem"
 grefm_megali_idea.003.a: "Our armies will raise the [GetCulture('greek').GetName] standard once more!"
 grefm_megali_idea.003.b: "The Empire is dead. We will forge a new path!"
 grefm_megali_idea.004.t: "The Empire of the Greeks"
 grefm_megali_idea.004.d: "The expansion of the Greek state has led some of the most fervent nationalists to propose an even more ambitious project: the restoration of the $grefm_greek_empire$ through the conquest of the [GetStrategicRegion('region_balkans').GetName] and [GetStrategicRegion('region_anatolia').GetName]."
 grefm_megali_idea.004.f: ""That which yesterday would have seemed an absurd pipe dream is now within our grasp. The purple phoenix will rise again!""
 grefm_megali_idea.004.a: "The $grefm_greek_empire$ will be restored."
 grefm_megali_idea.004.b: "We should not move forward with this ambitious agenda."
 grefm_megali_idea.005.t: "The Greek Lands Lost"
 grefm_megali_idea.005.d: "The aggressive pursuit of the $grefm_megali_idea$ is no longer tenable."
 grefm_megali_idea.005.f: "The tension in the room is palpable. Politicians and advisors argue over the sustainability of pursuing the Megali Idea. Each demands a responsible party be held accountable for the mismanagement of [ROOT.GetCountry.GetAdjectiveNoFormatting] resources used in this irredentist endeavor that has failed to manifest."
 grefm_megali_idea.005.a: "Our failure is an embarrassment."
 grefm_megali_idea.005.b: "[ROOT.GetCountry.GetRuler.GetFullName] must be held accountable."

 grefm_megali_idea.010.t: "The Lands of the [GetCulture('rhomaios').GetName]"
 grefm_megali_idea.010.d: "The independence of the Greek state has caused a wave of support for reunification, or "enosis," with the various Greek population centers ruled over by the powers associated with the Ottoman state. They have begun to center on reclaiming the the lands of our countrymen that are not fully under your administration."
 grefm_megali_idea.010.f: ""Language is a homeland we can never emigrate from." -Irina Grivina"
 grefm_megali_idea.010.a: "This is land is our home."
