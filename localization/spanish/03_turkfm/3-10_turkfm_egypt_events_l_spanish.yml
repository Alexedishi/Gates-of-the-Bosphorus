l_spanish:
 turkfm_egypt.001.t: "The Man Who Would Be Khedive"
 turkfm_egypt.001.d: "Once the seat of great empires, [ROOT.GetCountry.GetName] languishes under the decaying influence of the $turkfm_porte$. However, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] aims to change this. Through military might and industrial development, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] aims to defy the might of Constantinople and secure hereditary rule over [ROOT.GetCountry.GetNameNoFormatting]."
 turkfm_egypt.001.f: "The Khedivate of [ROOT.GetCountry.GetNameNoFormatting] has a deep history. From its ancient origins as #bold Kemet#! and through Greek, Roman, and now Arab conquest, the country has been home to varied peoples of many cultures and faiths."
 turkfm_egypt.001.a: "[ROOT.GetCountry.GetName] will find its way."