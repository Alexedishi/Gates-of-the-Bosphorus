 # GREFM
 GRE_FLAVOR_TEXT: "Through a prolonged and bloody struggle, Greece has won its independence from the Ottoman Empire. Saddled with the unpopular Bavarocracy, can Greece find political stability and expand its borders?"
 ION_FLAVOR_TEXT: "The Islands have passed from Ottoman to $RUS_ADJ$, $FRA_ADJ$ and finally $GBR_ADJ$ control within the past 30 years. Can the Islanders achieve Enosis with the new Greek state or will they seek a new path forward under $GBR_ADJ$ guidance?"
 BYZ: "Greek Empire"

 # BALKFM
 MON_FLAVOR_TEXT: "Montenegro has endured for centuries despite envelopment by the Ottoman Empire. Defined by the harshness of its lands and the pride of its people, will Montenegro spread forward from the shadows of the Black Mountain?"
 SER_FLAVOR_TEXT: "Serbia has fought hard for its independence, and will surely have to continue its struggle to retain it. Wedged between great powers, will Serbia become the powder keg of Europe?"
 MOL_FLAVOR_TEXT: "Calls for Romanian unification and political independence complicate regional politics, as both Russia and the Ottomans have an interest in enforcing the status quo. Can Romania win its freedom?"
 WAL_FLAVOR_TEXT: "Calls for Romanian unification and political independence complicate regional politics, as both Russia and the Ottomans have an interest in enforcing the status quo. Can Romania win its freedom?"

 # TURKFM
 TUR_FLAVOR_TEXT: "The Ottoman Empire is an Empire in crisis. Threatened from without by industry and imperialism and menaced from within by nationalism and stagnation, all eyes now turn to Constantinople as the Sultan attempts to reform the Empire into one capable of taking on this new age. Will the Ottoman Empire succeed in its great re-ordering or is it doomed to fall like the Byzantines before them?"
 TRI_FLAVOR_TEXT: "Following a long period of de facto independence, Tripolitania has once again fallen under Ottoman rule. As dissent brews in the deserts, can the Bey establish a central authority?"
 TUN_FLAVOR_TEXT: "After being forced to end its sponsorship of piratical raids, the Tunisian economy has taken a turn for the worse. Can the Bey restore prosperity?"