 # Tooltips
 turkfm_tanzimat: "@gbbf_tanzimat! #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_desc Tanzimât#!#!"
 turkfm_tanzimat_desc: "@gbbf_tanzimat! #header The Tanzimât#!\n$TOOLTIP_DELIMITER$\n#bold The Tanzimât#!, Turkish for #italic Reorganization#!, refers to a a broad spectrum of liberalizing reforms that have been gaining traction in the Ottoman Empire. Since the turn of the century, observers from within and without have acknowledged that the Empire suffers from critical structural issues ranging from poor governance, outdated military practices, and a stagnant economy. In response, the Sultans since Selim III have begun a period of cautious reform. However, as the Empire begins to appear ever more tenuous, the Sultans have felt more motivated in attempting aggressive reform of the Imperial apparatus."
 turkfm_tanzimat_reforms: "@gbbf_tanzimat! #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_tanzimat_desc Tanzimât Reforms#!#!"

 turkfm_identity: "@gbbf_identity! #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_identity_desc Identity#!#!"
 turkfm_identity_desc: "@gbbf_identity! #header Imperial Identity#!\n$TOOLTIP_DELIMITER$\nSince its initial expansion, the Ottoman Empire has delegated several aspects of governance to religion-based confessional communities referred to as #italic millets#!. Growing western involvement in the Empire has exposed the people to the ideals of [GetTechnology('nationalism').GetName] which now threatens to tear the empire apart.\n\nIn response, the $turkfm_reformist$ movement has emerged from the $turkfm_porte$ which remains split on whether $turkfm_ottomanism$ or $turkfm_islamism$ is the solution to the Empire's woes. Meanwhile, they are opposed by the entrenched interests of the $turkfm_conservatist$ movement, a broad alignment of warlords and governors that see their authority threatened by the $turkfm_tanzimat$."
 turkfm_identities: "@gbbf_identity! #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_identity_desc Identities#!#!"
 turkfm_imperial_identity: "@gbbf_identity! #o #tooltip:[GetPlayer.GetTooltipTag],turkfm_identity_desc Imperial Identity#!#!"

 turkfm_tanzimat_started: "[ROOT.GetCountry.GetNameNoFlag] has declared the start of the #bold $turkfm_tanzimat$ Reforms#!"
 turkfm_mahmud_dead_tt: "Sultan Mahmud II is dead"
 turkfm_tanzimat_declaration: "This will enable the #bold $turkfm_tanzimat$ Reform#! [Concept('concept_journal_entry','$concept_journal_entries$')]"
 turkfm_reform_completed: "Number of completed #bold $turkfm_tanzimat$ Reforms#! increases by #green #bold 1#!#!"
 turkfm_young_turks_failed: "[ROOT.GetCountry.GetNameNoFlag] has failed the #bold $je_turkfm_tanzimat_young_turks$#! [concept_journal_entry]"
 turkfm_grand_collapse_possible: "The #bold $je_turkfm_sick_man_grand_collapse$#! [concept_journal_entry] will become possible"

 turkfm_reformist: "#greece #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_reformist_desc Reformist#!#!#!"
 turkfm_reformists: "#greece #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_reformist_desc Reformists#!#!#!"
 turkfm_reformist_desc: "The #bold Reformist#! movement consists of an intellectual current that ascribes the stagnation of the Ottoman Empire to the outdatedness and inefficiency of its institutions. Emerging from the scribal class, the reformists seek to introduce European administrative methods and centralize power as a means to preserve the integrity of the Empire"
 turkfm_reformist_sources: "#bold The following are potential sources of $turkfm_reformist$ progress:#!\n$TOOLTIP_DELIMITER$\n•[GetBuildingType('building_government_administration').GetName] [Concept('concept_building','$concept_buildings$')] with the #yellow Secular Administration#! [concept_production_method] active\n•[GetBuildingType('building_university').GetName] [Concept('concept_building','$concept_buildings$')] with the #yellow Secular Academia#! [concept_production_method] active\n•Total amount of [concept_institution] [Concept('concept_investment_level','$concept_investment_levels$')]"

 turkfm_conservatist: "#purple #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_conservatist_desc Conservatist#!#!#!"
 turkfm_conservatists: "#purple #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_conservatist_desc Conservatists#!#!#!"
 turkfm_conservatist_desc: "The #bold Conservatist#! movement consists of entrenched aristocrats, clergy, and scribes that see any attempts at reform as a threat to their wealth and prestige. With their generations of established wealth and influence, they present a threat to the continued rule of the Sultan."
 turkfm_conservatist_sources: "#bold The following are potential sources of $turkfm_conservatist$ progress:#!\n$TOOLTIP_DELIMITER$\n•The [concept_clout] of Pro-[GetLawType('law_state_religion').GetName] [Concept('concept_interest_group','$concept_interest_groups$')]\n•Total amount of [GetInstitutionType('institution_schools').GetName] [Concept('concept_investment_level','$concept_investment_levels$')] while [GetLawType('law_religious_schools').GetName] is active\n•Total amount of [GetInstitutionType('institution_health_system').GetName] [Concept('concept_investment_level','$concept_investment_levels$')] while [GetLawType('law_charitable_health_system').GetName] is active\n•[GetBuildingType('building_government_administration').GetName] [Concept('concept_building','$concept_buildings$')] with the #yellow Administrative Clergy#! [concept_production_method] active\n•[GetBuildingType('building_university').GetName] [Concept('concept_building','$concept_buildings$')] with the #yellow Clerical Educators#! [concept_production_method] active"

 turkfm_ottomanist: "#yellow #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_ottomanist_desc Ottomanist#!#!#!"
 turkfm_ottomanist_desc: "The [GetIdeology('ideology_ottomanist').GetName] movement is comprised of an array of intellectuals that advocate for more ambitious reforms beyond those of the $turkfm_reformist$ movement. They aim to syncretize Islamic jurisprudence with that of Western [GetTechnology('nationalism').GetName] to produce an overarching "Ottoman" identity to unite the Empire."
 turkfm_ottomanist_sources: "#bold The following are potential sources of $turkfm_ottomanist$ progress:#!\n$TOOLTIP_DELIMITER$\n•The [concept_political_movement_support] behind the #bold [GetIdeology('ideology_gbbf_ottomanist_leader').GetName] Movement#!\n•The [concept_political_movement_support] behind the #bold [GetIdeology('ideology_modernizer').GetName] Movement#!"
 turkfm_ottomanism: "#yellow #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_ottomanist_desc Ottomanism#!#!#!"

 turkfm_islamist: "#green #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_islamist_desc Islamist#!#!#!"
 turkfm_islamist_desc: "The [GetIdeology('ideology_gbbf_islamist_leader').GetName] identity is backed by a mixture of clergy and conservative elements who hold Islam and its systems of jurisprudence as the only means to hold the Empire together. They aim to enshrine the system of Sharia and Qanun and as the only future for the Empire to the detriment of members of its millets."
 turkfm_islamist_sources: "#bold The following are potential sources of $turkfm_islamist$ progress:#!\n$TOOLTIP_DELIMITER$\n•The [concept_political_movement_support] behind the #bold Cultural Majority Movement#!\n•The [concept_political_movement_support] behind the #bold Religious Majority Movement#!"
 turkfm_islamism: "#green #bold #tooltip:[GetPlayer.GetTooltipTag],turkfm_islamist_desc Islamism#!#!#!"

