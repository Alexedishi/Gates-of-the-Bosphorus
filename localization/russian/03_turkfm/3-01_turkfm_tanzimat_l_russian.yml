 # Decisions
 turkfm_palace_activation_decision: "Move Administration to [GetBuildingType('gbbf_building_dolmabahce_palace').GetName]"
 turkfm_palace_activation_decision_desc: "After years of planning and construction, artisans are finally adding the final details to our new palace. The time has come to solidify the $turkfm_tanzimat$ by moving the Imperial administration to these new facilities."
 turkfm_palace_upgrade_decision: "Modernize [GetBuildingType('gbbf_building_dolmabahce_palace').GetName]"
 turkfm_palace_upgrade_decision_desc: "While grandiose and auspicious, the royal palace lacks many of the conveniences afforded by modern technologies. It would serve the empire well to modernize the palace."
 turkfm_palace_museum_decision: "Open [GetBuildingType('gbbf_building_topkapi_palace').GetName] to the Public"
 turkfm_palace_museum_decision_desc: "The old palace of the empire now serves as little more than another hole in the maintenance budget. Scholars have suggested converting the storied structures into a public museum from which we can educate our subjects on the virtues of the empire."

 # Notifications
 notification_notification_turkfm_tanzimat_started_name: "#yellow Ottoman Empire#! Declares the #bold $turkfm_tanzimat$#!"
 notification_notification_turkfm_tanzimat_started_desc: "Riding the wave of reform initiated by #yellow Selim III#!, the Sultan of the #yellow Ottoman Empire#! has declared ambitious plans to "Reorder" and modernize the Ottoman state."

 # Scripted Buttons
 turkfm_start_tanzimat_button: "Declare the $turkfm_tanzimat$"
 turkfm_start_tanzimat_button_desc: "The Empire is both stagnant and rotting to its core. With some reforms completed and several more underway, all that remains is to give the Reorganization legal sanction by royal decree."
 turkfm_enforce_identity_button: "Embrace $turkfm_imperial_identity$"
 turkfm_enforce_identity_button_desc: "The tide of Western thought has threatened to tear the Empire apart. The $turkfm_porte$ must act decisively to secure a future foundation for the Empire, be it through $turkfm_ottomanism$ or $turkfm_islamism$."
 turkfm_enforce_identity_button_possible_1: "The #bold $turkfm_tanzimat_reforms$#! progress bar is full"
 turkfm_enforce_identity_button_possible_2: "The #bold $turkfm_imperial_identity$ progress bar is within #bold 10%#! of full support towards either identity"
 turkfm_enforce_identity_ottomanist: "The [ROOT.GetCountry.GetName] will adopt the [GetCulture('ottoman').GetName] culture as its core identity."
 turkfm_enforce_identity_button_islamist: "The [ROOT.GetCountry.GetName] will adopt [GetReligion('sunni').GetName] Islam as its core identity."
 turkfm_ottomanist_identity_effect: "The [ROOT.GetCountry.GetName] will adopt the $turkfm_identity$ with greater support."

 turkfm_depose_murad_button: "Depose [ROOT.GetCountry.GetRuler.GetFullName]"
 turkfm_depose_murad_button_desc: "Despite early hopes that he would lead the Empire into an era of modernity, [ROOT.GetCountry.GetRuler.GetFirstName] has been so badly afflicted by the death of his brother that any hope for his reign has been lost to his insanity. Several within the Circle have suggested that he be "retired" from office before any harm is done."

