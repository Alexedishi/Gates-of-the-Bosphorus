 turkfm_young_ottoman: "#bold #yellow #tooltip:[GetRawTextTooltipTag('turkfm_young_ottoman_desc')] Young Ottoman#!#!#!"
 turkfm_young_ottomans: "#bold #yellow #tooltip:[GetRawTextTooltipTag('turkfm_young_ottoman_desc')] Young Ottomans#!#!#!"
 turkfm_young_ottoman_desc: "#header Young Ottomans#!\n$TOOLTIP_DELIMITER$\n#lore The ideology of the #bold Young Ottomans#! is not strictly codified, but its supporters generally agree that the solution to the woes of the Empire is the establishment of a constitutional government. They aim to establish a constitutional monarchy that fuses the ideals of Islamic jurisprudence with those of western Liberalism.#!\n$TOOLTIP_DELIMITER$\n[concept_interest_group]#o s#! and [concept_agitator]#o s#! will support the Young Ottomans based on their stances to the following laws:\n•Positive approval of towards any of:\n#indent_newline:3 •[GetLawType('law_wealth_voting').GetName]#!\n#indent_newline:3 •[GetLawType('law_census_voting').GetName]#!\n#indent_newline:3 •[GetLawType('law_universal_suffrage').GetName]#!\n•Positive approval towards [GetLawType('law_state_religion').GetName]\n•Positive approval of towards any of:\n#indent_newline:3 •[GetLawType('law_parliamentary_republic').GetName]#!\n#indent_newline:3 •[GetLawType('law_presidential_republic').GetName]#!"
