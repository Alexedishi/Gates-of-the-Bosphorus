l_russian:
 # Journal Entries
 je_grefm_samos_main: "Samos in Servitude"
 je_grefm_samos_main_reason: "When #yellow Greece#! took up arms in the #bold Greek War of Independence#!, they were joined by rebellions on the many smaller islands of the Aegean. Among them was the [ROOT.GetCountry.GetName], which defied the Ottoman state by refusing to submit to terms that would have seen them reintegrated into the Empire. Their defiance gained recognition from the [Concept('concept_great_power', '$concept_great_powers$')], who intervened to secure the island's autonomy from the #bold Sublime Porte#!.\n\nPresently, the island is nominally ruled by a #italic bey#! appointed by the Sultan, although the government of the island has its independence in all but name. With their union with #yellow Greece#! denied, the islanders are hopeful for a time when their cruel separation from their Greek cousins will come to an end.\n\n[Country.GetCustom('grefm_samos_support_type')]"
 je_grefm_samos_main_status_1: "Lord [ROOT.GetCountry.GetRuler.GetFirstName] rules with an iron fist."
 je_grefm_samos_main_status_2: "Lord [ROOT.GetCountry.GetRuler.GetFirstName] has #bold #greece [GetPlayer.MakeScope.Var('grefm_samos_support_var').GetValue]#!#! support."
 je_grefm_samos_main_breakdown: "[Country.MakeScope.GetScriptValueDesc('grefm_samos_support_value')]"
 je_grefm_samos_organic_law: "The Organic Law of Samos"
 je_grefm_samos_organic_law_reason: "The socioeconomic state of [ROOT.GetCountry.GetName] reflects its centuries of domination by the Ottoman state. In their defense of the small island, the [Concept('concept_great_power', '$concept_great_powers$')] secured the promulgation of an Organic Charter from the Sultan in exchange for the submission of the island to the #bold Sublime Porte#!. However, the implementation of these administrative functions has been left to the islanders themselves."

 # Journal Entry Lobby Text
 je_grefm_samos_main_lobby: "$gbbf_journal_lobby$\nSamos is nominally ruled by a #italic bey#! appointed by the Sultan, although the government of the island has its independence in all but name. With their union with Greece denied, the islanders are hopeful for a time when their cruel separation from their Greek cousins will come to an end."
 je_grefm_samos_organic_law_lobby: "$gbbf_journal_lobby$\nIn their defense of the small island, the West secured the promulgation of an Organic Charter from the Sultan in exchange for the submission of the island to the $turkfm_porte$. However, the implementation of these administrative functions has been left to the islanders themselves."

 # Modifiers
 modifier_grefm_submission: "Submission to the Sultan"
 modifier_grefm_hegemonic_ruler: "Hegemonic Ruler"
 modifier_grefm_organic_charter: "Organic Charter"
 modifier_grefm_samian_union: "Samian Union"

 # Custom Loc
 custom_grefm_samos_progress: "The Prince has #bold #greece [GetPlayer.MakeScope.Var('grefm_samos_support_var').GetValue]#!#! support. This is expected to change by #tooltippable;tooltip:[Country.GetTooltipTag],je_grefm_samos_main_breakdown [Country.MakeScope.ScriptValue('grefm_samos_support_value')|+=]#! next month."

 # Script Value Breakdowns
 grefm_samos_from_support: "From the [concept_clout] of [Concept('concept_interest_group','$concept_interest_groups$')] with #green #bold positive#!#! [concept_approval]."
 grefm_samos_from_opposition: "From the [concept_clout] of [Concept('concept_interest_group','$concept_interest_groups$')] with #red #bold negative#!#! [concept_approval]."

 # Tooltips
 je_grefm_stefanos_tt: "#yellow Stefanos Bogoridi#! is no longer #bold Prince of Samos#!."