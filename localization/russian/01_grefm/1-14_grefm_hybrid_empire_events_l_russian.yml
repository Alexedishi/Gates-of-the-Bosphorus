l_russian:
 grefm_hybrid_empire.001.t: "The New Greece Rises"
 grefm_hybrid_empire.001.d: "Church bells ring and people cheer as [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] declares the birth of the [ROOT.GetCountry.GetName]. Beneath the imposing presence of the [SCOPE.sBuilding('hagia_sofia_scope').GetName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has been adorned with reconstructions of the old sigils and regalia of the Ancient Greek Kings of Old. Stepping forward towards the array of citizens, dignitaries, and clergy, [ROOT.GetCountry.GetRuler.GetFirstName] stands as a beacon for the future of the Greek people."
 grefm_hybrid_empire.001.f: "Where countless attempts failed over the centuries since the losses of Rome and Constantinople, the Empire stands resurgent today. However, much work remains: numerous Greeks are ruled by heretics and heathens, formerly Roman lands remain within the grasp of foreign pretenders, and countless Byzantine treasures are kept hostage abroad. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must be sure to live up to the expectations of [ROOT.GetCountry.GetRuler.GetHerHis] subjects if [ROOT.GetCountry.GetRuler.GetSheHe] is to bring glory to [ROOT.GetCountry.GetName]."
 grefm_hybrid_empire.001.a: "The $grefm_greek$ people will carve out a new future!"
 grefm_hybrid_empire.001.b: "It is time to focus on our own prosperity."
 grefm_hybrid_empire.002.t: "The Eternal City"
 grefm_hybrid_empire.002.d: "Our efforts have borne fruit with the rebirth of the [ROOT.GetCountry.GetName]. Now several voices call for the restoration of [ROOT.GetCountry.GetAdjectiveNoFormatting] power and prestige with the return of formerly Greek lands to the [ROOT.GetCountry.GetAdjectiveNoFormatting] State."
 grefm_hybrid_empire.002.f: ""The Kingdom of Greece is not Greece; it is merely a part: the smallest, poorest part of Greece. The Greek is not only he who inhabits the Kingdom, but also he who inhabits Ioannina, Salonika or Serres or Adrianople or Constantinople or Trebizond or Crete or Samos or any other region belonging to the Greek history or the Greek race... There are two great centres of Hellenism. Athens is the capital of the Kingdom. Constantinople is the great capital, the dream and hope of all Greeks." -I. Kolettis, 1844"
 grefm_hybrid_empire.002.a: "We will restore the glory of the [ROOT.GetCountry.GetName]"
 grefm_hybrid_empire.002.b: "This goal is unreasonable."
 grefm_hybrid_empire.009.t: "The Greek Realm"
 grefm_hybrid_empire.009.d: "Cheers have erupted across [ROOT.GetCountry.GetName] as the people cheer for the unification of all $grefm_greek$ peoples across the East into the [ROOT.GetCountry.GetAdjectiveNoFormatting] state."
 grefm_hybrid_empire.009.f: "From the Peloponnese, across the Bosporus, and along the Nile, the $grefm_greeks$ at last find themselves under the shelter of the [ROOT.GetCountry.GetAdjectiveNoFormatting] state."
 grefm_hybrid_empire.009.a: "The True [ROOT.GetCountry.GetName] has been restored!"